  if (lastSnap.settings !== JSON.stringify(state.settings)) state.settingsAt = now;

  lastSnap = snapshot(state);
}

function save() {
  prevSavedJson = lastSavedJson;
  stampChanges();
  Store.save(state);
  lastSavedJson = JSON.stringify(state);
  syncPush();
}

/* Stellt den Stand vor der letzten Änderung wieder her. Die zurückgeholten
   Einträge bekommen dabei neue Zeitstempel, damit sie beim nächsten
   Abgleich nicht erneut von der Löschung überholt werden. */
function undoLast() {
  if (!prevSavedJson) { toast("Nichts zum Rückgängigmachen"); return; }
  try {
    const s = JSON.parse(prevSavedJson);
    migrate(s);
    state = s;
    save();
    renderAll();
    toast("Wiederhergestellt");
  } catch (e) { toast("Konnte nicht wiederhergestellt werden"); }
}

const areaById = id => state.areas.find(a => a.id === id) || state.areas[0];
function dayMeta(dateIso) {
  if (!state.days[dateIso]) state.days[dateIso] = { energy: null };
  return state.days[dateIso];
}
/* Reine Lesefassung: legt anders als dayMeta() nichts an. Für Stellen, die
   nur nachsehen wollen (z. B. eine Übersicht, die beim Vorblättern nicht
   sieben leere days-Einträge erzeugen und per Sync hochschieben soll). */
function dayMetaLesen(dateIso) {
  return state.days[dateIso] || null;
}

/* Ein freigehaltener Tag: der Verteiler schlägt hier nichts vor. Was von
   Hand drinsteht, bleibt — frei heißt „nichts Neues", nicht „gesperrt". */
function istFrei(dateIso) {
  const m = state.days[dateIso];
  return !!(m && m.frei);
}

/* ============================================================ Theme */
function applyTheme() {
  const t = state.settings.theme;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dunkel = (t === "auto" ? sysDark : t === "dark");
  document.documentElement.dataset.theme = dunkel ? "dark" : "light";
  // Vom Homescreen gestartet ist das die Farbe der Statusleiste. Ohne das
  // sitzt eine weisse Leiste ueber einer dunklen App.
  const mc = document.getElementById("themeColor");
  if (mc) mc.setAttribute("content", dunkel ? "#15131c" : "#ffffff");
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.settings.theme === "auto") applyTheme();
});

/* ============================================================ Toast */
function toast(msg, action) {
  const el = document.createElement("div");
  el.className = "toast";
  const txt = document.createElement("span");
  txt.textContent = msg;
  el.appendChild(txt);
  const life = action ? 6000 : 2200;
  if (action) {
    const b = document.createElement("button");
    b.className = "toast__act"; b.type = "button"; b.textContent = action.label;
    b.onclick = () => { el.remove(); action.run(); };
    el.appendChild(b);
  }
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, life);
  setTimeout(() => el.remove(), life + 400);
}

/* Toast mit Rückgängig — für alles, was etwas wegnimmt. */
function toastUndo(msg) {
  const snap = prevSavedJson;
  toast(msg, { label: "Rückgängig", run: () => {
    prevSavedJson = snap;
    undoLast();
  }});
}

/* ============================================================ Modal */
let openModal = null;
// Vom oberen Blatt beiseitegelegt statt entfernt — siehe modalPush() unten.
let stashedModal = null;
function modal(builder, opts = {}) {
  closeModal();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet" + (opts.wide ? " sheet--wide" : "");
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  scrim.appendChild(sheet);
  builder(sheet, closeModal);
  scrim.addEventListener("pointerdown", e => { if (e.target === scrim) closeModal(); });
  $("#modalRoot").appendChild(scrim);
  openModal = scrim;
  const focusable = sheet.querySelector("input, select, textarea, button");
  if (focusable) setTimeout(() => focusable.focus(), 40);
  return sheet;
}
// closeModal() heisst an rund 30 Stellen „alles zu" — das bleibt so, auch
// wenn gerade ein Blatt beiseitegelegt ist. Sonst würde z.B. Escape
// während einer beiseitegelegten Verschieben-Ansicht nur das obere Blatt
// schließen und die andere unsichtbar im Speicher hängen lassen.
function closeModal() {
  if (stashedModal) { stashedModal.remove(); stashedModal = null; }
  if (openModal) { openModal.remove(); openModal = null; }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* Zweiter Einstieg neben modal() — NICHT modal() zu einem echten Stapel
   ausbauen, das würde die Bedeutung jedes der rund 30 closeModal()-Aufrufe
   verändern. modalPush() legt nur das gerade offene Blatt beiseite statt es
   zu entfernen, und der Rückweg läuft über das eigene close() des oberen
   Blatts (nicht über closeModal()) — dafür maximal zwei Ebenen. Gedacht für
   genau zwei Fälle: die Serien-Rückfrage aus dem Blockeditor und aus dem
   Verschieben-Dialog heraus (siehe confirmSheet(..., { push: true })). */
function modalPush(builder, opts = {}) {
  if (openModal) { openModal.remove(); stashedModal = openModal; openModal = null; }
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet" + (opts.wide ? " sheet--wide" : "");
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  scrim.appendChild(sheet);
  const closeThis = () => {
    scrim.remove();
    openModal = null;
    if (stashedModal) { openModal = stashedModal; stashedModal = null; $("#modalRoot").appendChild(openModal); }
  };
  builder(sheet, closeThis);
  scrim.addEventListener("pointerdown", e => { if (e.target === scrim) closeThis(); });
  $("#modalRoot").appendChild(scrim);
  openModal = scrim;
  const focusable = sheet.querySelector("input, select, textarea, button");
  if (focusable) setTimeout(() => focusable.focus(), 40);
  return sheet;
}

function confirmSheet(title, text, confirmLabel, onYes, opts = {}) {
  const open = opts.push ? modalPush : modal;
  open((s, close) => {
    s.innerHTML = "<h2 class='sheet__title'></h2><p style='margin:0;color:var(--text-muted);font-size:14px;line-height:1.55'></p>";
    s.querySelector("h2").textContent = title;
    s.querySelector("p").textContent = text;
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const yes = document.createElement("button");
    yes.className = "btn btn--primary"; yes.textContent = confirmLabel;
    yes.style.background = "var(--danger)"; yes.style.borderColor = "var(--danger)";
    yes.style.color = "var(--on-danger)";
    yes.onclick = () => { close(); onYes(); };
    foot.append(cancel, yes);
    s.appendChild(foot);
  });
}

/* ============================================================ Kopfzeile */
function renderHeader() {
  const mon = mondayOf(anchor);
  const sun = addDays(mon, 6);
  const sameMonth = mon.getMonth() === sun.getMonth();
  const range = isMobile
    ? mon.getDate() + "." + (mon.getMonth() + 1) + ".–" + sun.getDate() + "." + (sun.getMonth() + 1) + "."
    : sameMonth
      ? mon.getDate() + ".–" + sun.getDate() + ". " + MONTHS[mon.getMonth()]
      : mon.getDate() + ". " + MONTHS[mon.getMonth()].slice(0, 3) + " – " + sun.getDate() + ". " + MONTHS[sun.getMonth()].slice(0, 3);
  $("#weekLabel").innerHTML = "KW " + isoWeek(mon) + "<small>" + range + "</small>";
  $("#whoLabel").textContent = state.profile.name ? "· " + state.profile.name : "";
  // In der laufenden Woche braucht niemand einen Knopf, der dorthin führt.
  // Am Telefon war die Kopfzeile bis auf null Pixel gefüllt — das Zahnrad
  // wurde angeschnitten. Der Knopf erscheint nur, wenn er etwas tut.
  const heuteBtn = $("#todayBtn");
  if (heuteBtn) heuteBtn.hidden = iso(mon) === iso(mondayOf(new Date()));
}

/* ============================================================ Tag-Umschalter (Mobile) */

/* Wie viel steht an einem Tag, gemessen an dem, was der Tag verträgt.

   Zähler: alles, was an dem Tag liegt — auch Vorschläge. Wer verteilen lässt,
   soll sofort sehen, wohin es die Woche kippt, und nicht erst nach dem
   Übernehmen.

   Nenner: die wache Zeit dieses Tages mal 65 %. Dieselbe Marke wie in der
   Ampel bei den Wochenzielen; zwei verschiedene Maßstäbe für dieselbe Frage
   wären schlimmer als keiner. */
function tagesAuslastung(day) {
  let wach = (state.settings.dayEnd - state.settings.dayStart) * 60;
  restSpans().forEach(r => {
    wach -= Math.max(0, Math.min(state.settings.dayEnd * 60, r.end)
                      - Math.max(state.settings.dayStart * 60, r.start));
  });
  const grenze = Math.max(60, wach) * VERPLANT_GRENZE;
  let min = 0;
  state.blocks.forEach(b => { if (onDay(b, day.key, day.i)) min += dauerVon(b); });
  return { min, grenze, quote: min / grenze };
}

function renderDaySwitch() {
  const wrap = $("#daySwitch");
  wrap.innerHTML = "";
  const mon = mondayOf(anchor);
  const todayIso = iso(new Date());
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const key = iso(d);
    const frei = istFrei(key);
    const last = tagesAuslastung({ key, i });

    const b = document.createElement("button");
    b.className = "dayswitch__btn" + (frei ? " is-frei" : "")
      + (last.quote > 1 ? " is-voll" : "");
    b.setAttribute("aria-pressed", String(i === selectedDayIdx));
    b.style.setProperty("--last", Math.round(clamp(last.quote, 0, 1) * 100) + "%");
    b.innerHTML = "<span>" + DAY_SHORT[i] + "</span><b>" + d.getDate() + "</b><i></i>";
    if (key === todayIso) b.querySelector("b").style.color = "var(--focus)";

    // Ein Balken allein sagt niemandem etwas, der ihn nicht sieht.
    const wieVoll = frei ? "freigehalten"
      : last.min < 15 ? "nichts geplant"
      : fmtDur(last.min) + " geplant" + (last.quote > 1 ? " — das wird eng" : "");
    b.title = DAY_LONG[i] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ". · " + wieVoll;
    b.setAttribute("aria-label", b.title);

    // Seit Stufe 3 steht der Tagwechsler auch in „Heute" — dessen Agenda
    // hängt genauso an selectedDayIdx wie das Raster.
    b.onclick = () => { selectedDayIdx = i; renderGrid(); renderDaySwitch(); renderAgenda(); renderEnergy(); };
    wrap.appendChild(b);
  }
}

/* ============================================================ Blöcke einer Spalte */
/* Liegt dieser Block an diesem Tag?

   Wöchentliche Blöcke galten bisher für *jeden* passenden Wochentag — auch für
   Wochen, die längst vorbei sind. Wer im August „Sport montags" anlegt, hatte
   damit rückwirkend auch jeden Montag im Januar erfüllt. „since" ist das Datum,
   ab dem die Serie gilt; bei alten Daten setzt migrate() es auf das Anlegedatum. */
function onDay(b, dayKey, dayIdx) {
  if (b.repeat !== "weekly") return b.date === dayKey;
  return b.day === dayIdx && (!b.since || dayKey >= b.since);
}

/* Fürs Raster: nur Blöcke mit fester Uhrzeit. Grobe hängen an einem
   Tagesabschnitt und stehen im Band darunter. */
function blocksFor(date, dayIdx) {
  const key = iso(date);
  return state.blocks.filter(b => !b.grob && onDay(b, key, dayIdx))
    .sort((a, b) => a.start - b.start);
}

/* Die groben eines Tages, nach Abschnitt sortiert. */
function grobeFor(dayKey, dayIdx) {
  const rang = { vm: 0, nm: 1, ab: 2 };
  return state.blocks.filter(b => b.grob && onDay(b, dayKey, dayIdx))
    .sort((a, b) => (rang[a.teil] - rang[b.teil]) || (b.dauer - a.dauer));
}

/* ============================================================
   Agenda — exakte und grobe Blöcke eines Tages zu EINER Liste gemischt
   (Stufe 4). Grobe reihen sich über den Beginn ihres Abschnitts ein, tragen
   aber keine eigene Uhrzeit — das entscheidet renderAgenda() bei der
   Darstellung, hier geht es nur um die Reihenfolge. Vorschläge (b.sug)
   zählen nicht mit: die Agenda zeigt, was gilt, nicht, was der Verteiler
   anbietet. */
function tagesAgenda(dayKey, dayIdx) {
  const exakt = blocksFor(addDays(mondayOf(anchor), dayIdx), dayIdx)
    .filter(b => !b.sug)
    .map(b => ({ block: b, grob: false, sortMin: b.start }));
  const grobe = grobeFor(dayKey, dayIdx)
    .filter(b => !b.sug)
    .map(b => ({ block: b, grob: true, sortMin: abschnittVon(b.teil).von }));
  return [...exakt, ...grobe].sort((a, b) => a.sortMin - b.sortMin);
}

/* Freie Zeit nach dem letzten (oder gerade laufenden) Eintrag — für die
   Fußzeile der Agenda. Einfacher als freeGaps() (2299): keine
   bereichsabhängigen Wegzeiten, nur Blöcke mit Uhrzeit und die Nachtruhe
   zählen als belegt. */
function freieZeitDanach(dayKey, dayIdx) {
  const { dayStart, dayEnd } = state.settings;
  let start = dayStart * 60;
  if (dayKey === iso(new Date())) {
    start = Math.max(start, new Date().getHours() * 60 + new Date().getMinutes());
  }
  const ende = dayEnd * 60;
  if (ende <= start) return null;

  const busy = state.blocks.filter(b => !b.grob && !b.sug && onDay(b, dayKey, dayIdx))
    .map(b => ({ start: b.start, end: b.end }))
    .concat(restSpans())
    .filter(s => s.end > start && s.start < ende)
    .sort((a, b) => a.start - b.start);

  let cursor = start, total = 0, longest = 0;
  busy.forEach(s => {
    const a = Math.max(s.start, start), e = Math.min(s.end, ende);
    if (a > cursor) { const len = a - cursor; total += len; longest = Math.max(longest, len); }
    cursor = Math.max(cursor, e);
  });
  if (ende > cursor) { const len = ende - cursor; total += len; longest = Math.max(longest, len); }
  return { total, longest };
}

/* Überlappungen nebeneinander legen */
function layout(items) {
  const cols = [];
  const placed = items.map(b => ({ b, col: 0, of: 1 }));
  placed.forEach(p => {
    let c = 0;
    while (cols[c] && cols[c] > p.b.start) c++;
    cols[c] = p.b.end;
    p.col = c;
  });
  const groups = [];
  let cur = [], curEnd = -1;
  placed.forEach(p => {
    if (p.b.start >= curEnd && cur.length) { groups.push(cur); cur = []; }
    cur.push(p); curEnd = Math.max(curEnd, p.b.end);
  });
  if (cur.length) groups.push(cur);
  groups.forEach(g => { const n = Math.max(...g.map(p => p.col)) + 1; g.forEach(p => p.of = n); });
  return placed;
}

/* ============================================================
   Wochenziele — Stunden pro Woche statt fester Uhrzeit.

   Ein Bereich kann ein Wochenziel haben ("10 h Lernen"). Der Planer
   zählt, wie viel davon schon im Raster steht, und kann den Rest auf
   Vorschlag verteilen. Vorschläge sind normale Blöcke mit sug:true —
   dadurch lassen sie sich ziehen und ziehen wie alles andere, zählen
   aber erst als erledigt geplant, wenn sie angenommen wurden.

   Bewusst kein Übertrag in die nächste Woche: eine nicht volle Woche
   ist kein Fehler, und ein wachsender Schuldenberg wäre das Gegenteil
   von dem, was dieser Planer sein soll.
   ============================================================ */

function weekDays() {
  const mon = mondayOf(anchor);
  return [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(mon, i);
    return { i, d, key: iso(d) };
  });
}

/* Minuten eines Bereichs in der angezeigten Woche.
   sug=false: echte Einträge · sug=true: offene Vorschläge */
/* ============================================================
   Abhaken

   Ein wöchentlicher Eintrag ist derselbe Datensatz in jeder Woche — ein
   Häkchen am Block würde ihn in allen Wochen als erledigt zeigen. Darum
   hängt das Häkchen am Paar aus Eintrag und Datum.

   Warum überhaupt von Hand abhaken, wenn die App die Zeiten kennt? Weil
   selbst festgehaltener Fortschritt messbar stärker wirkt als automatisch
   mitgeschriebener — und weil nur der Mensch weiß, ob die geplante Stunde
   wirklich stattgefunden hat.
   ============================================================ */

function hakenKey(b, dayKey) { return b.id + "|" + (b.repeat === "weekly" ? dayKey : b.date); }

function istErledigt(b, dayKey) {
  const e = state.erledigt[hakenKey(b, dayKey)];
  return !!(e && e.on);
}
function setzeErledigt(b, dayKey, on) {
  state.erledigt[hakenKey(b, dayKey)] = { on: !!on, at: Date.now() };
}

/* Wie viel von einem Bereich in dieser Woche wirklich stattgefunden hat. */
function areaIst(areaId) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId || b.sug) return;
      if (onDay(b, day.key, day.i) && istErledigt(b, day.key)) sum += dauerVon(b);
    });
  });
  return sum;
}

/* Alle Einträge einer Woche, chronologisch — Grundlage für den Rückblick. */
function wocheEintraege(mon) {
  const out = [];
  [0, 1, 2, 3, 4, 5, 6].forEach(i => {
    const key = iso(addDays(mon, i));
    state.blocks.forEach(b => {
      if (b.sug) return;
      if (onDay(b, key, i)) out.push({ b, key, i });
    });
  });
  return out.sort((x, y) => x.i - y.i || (x.b.start || 0) - (y.b.start || 0));
}

function areaMinutes(areaId, sug) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId) return;
      if (!!b.sug !== !!sug) return;
      if (onDay(b, day.key, day.i)) sum += dauerVon(b);
    });
  });
  return sum;
}

function hasSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  return state.blocks.some(b => b.sug && keys.has(b.date));
}

/* Stunden lesbar: 90 → „1,5 h", 45 → „45 min" */
function fmtDur(min) {
  if (min <= 0) return "0 h";
  if (min < 60) return min + " min";
  const h = min / 60;
  return (Math.round(h * 10) / 10).toString().replace(".", ",") + " h";
}

/* ============================================================
   Nachtruhe

   Die Zeitspannen eines Tages, die zur Nacht gehören — Schlaf plus die
   Ruhezeit davor und danach. Zurückgegeben als Minuten seit Mitternacht
   des jeweiligen Tages, denn der Schlaf läuft über den Tageswechsel:
   22:00 abends und 6:30 früh sind zwei Abschnitte desselben Kalendertags.
   ============================================================ */
function restSpans() {
  const sl = state.settings.sleep;
  if (!sl || !sl.on) return [];
  const w = sl.wind || 0;
  const from = sl.from, to = sl.to;

  if (from > to) {
    // Normalfall: über Mitternacht. Abends ab „from - Ruhezeit",
    // morgens bis „to + Ruhezeit".
    return [
      { start: 0, end: Math.min(1440, to + w), kind: "morgen" },
      { start: Math.max(0, from - w), end: 1440, kind: "abend" }
    ].filter(s => s.end > s.start);
  }
  // Wer tagsüber schläft: ein zusammenhängender Abschnitt.
  return [{ start: Math.max(0, from - w), end: Math.min(1440, to + w), kind: "tag" }]
    .filter(s => s.end > s.start);
}

/* ============================================================
   Orte und Wege

   weg(a, b) ist symmetrisch und null, wenn einer der beiden Orte fehlt oder
   beide gleich sind. Ein Block ohne eigenen Ort erbt den seines Bereichs und
   sonst den Heimatort — sonst wäre die Matrix voller Lücken und die Wegzeit
   verschwände, sobald irgendwo nichts eingetragen ist.
   ============================================================ */
function ortOf(block) {
  if (!block) return null;
  if (block.ortId) return block.ortId;
  const a = areaById(block.areaId);
  return (a && a.plan.ortId) || state.settings.heimOrt || null;
}
function ortName(id) {
  const o = (state.orte || []).find(x => x.id === id);
  return o ? o.name : "";
}
function wegKey(a, b) { return a < b ? a + ">" + b : b + ">" + a; }
function weg(a, b) {
  if (!a || !b || a === b) return 0;
  return +(state.wege || {})[wegKey(a, b)] || 0;
}
/* Alle Ortspaare, die im Plan tatsächlich vorkommen — nur die muss man pflegen. */
function ortPaare() {
  const ids = new Set();
  (state.orte || []).forEach(o => ids.add(o.id));
  const liste = [...ids];
  const out = [];
  for (let i = 0; i < liste.length; i++)
    for (let j = i + 1; j < liste.length; j++)
      out.push({ a: liste[i], b: liste[j], key: wegKey(liste[i], liste[j]) });
  return out;
}

/* Ortsauswahl als Chip-Reihe. Wird im Bereichs- und im Eintrags-Dialog
   benutzt. Ein neuer Ort entsteht inline — ein zweiter Dialog würde den
   ersten schließen. */
function ortChips(wrap, getId, setId) {
  const paint = () => {
    wrap.innerHTML = "";
    const mach = (id, txt) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.setAttribute("aria-pressed", String((getId() || null) === id));
      c.textContent = txt;
      c.onclick = () => { setId(id); paint(); };
      wrap.appendChild(c);
    };
    mach(null, "— egal —");
    (state.orte || []).forEach(o => mach(o.id, o.name));

    const neu = document.createElement("button");
    neu.type = "button"; neu.className = "chip";
    neu.textContent = "＋ Ort";
    neu.onclick = () => {
      wrap.innerHTML = "";
      const inp = document.createElement("input");
      inp.className = "field"; inp.placeholder = "z.B. Büro, Uni, Halle";
      inp.style.maxWidth = "190px"; inp.autocomplete = "off";
      const ok = document.createElement("button");
      ok.type = "button"; ok.className = "btn btn--sm"; ok.textContent = "Anlegen";
      const fertig = () => {
        const name = inp.value.trim();
        if (!name) { paint(); return; }
        if (!Array.isArray(state.orte)) state.orte = [];
        const o = { id: "o-" + uid(), name };
        state.orte.push(o);
        // Der erste Ort ist der Heimatort: alles ohne eigenen Ort gilt als dort.
        if (!state.settings.heimOrt) state.settings.heimOrt = o.id;
        setId(o.id);
        paint();
      };
      ok.onclick = fertig;
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); fertig(); }
        if (e.key === "Escape") { e.preventDefault(); paint(); }
      });
      wrap.append(inp, ok);
      inp.focus();
    };
    wrap.appendChild(neu);
  };
  paint();
  return paint;
}

/* ============================================================
   Wie voll ist die Woche, bevor überhaupt verteilt wird?

   Der Planer hat bisher immer verteilt und am Ende gemeldet, was nicht passte.
   Andersherum ist es ehrlicher: Wer sich 58 Stunden vornimmt, hat kein
   Platzproblem, sondern ein Zielproblem. Und ein Tag, der bis zum Rand
   verplant ist, hält nicht — unverplante Zeit ist keine Lücke im Plan,
   sondern Teil davon.
   ============================================================ */
const VERPLANT_GRENZE = 0.65;
function wochenKapazitaet() {
  const tage = weekDays();
  let wach = 0;
  tage.forEach(() => {
    let frei = (state.settings.dayEnd - state.settings.dayStart) * 60;
    restSpans().forEach(r => {
      frei -= Math.max(0, Math.min(state.settings.dayEnd * 60, r.end)
                        - Math.max(state.settings.dayStart * 60, r.start));
    });
    wach += Math.max(0, frei);
  });

  let fest = 0;
  tage.forEach(day => state.blocks.forEach(b => {
    if (!b.sug && onDay(b, day.key, day.i)) fest += dauerVon(b);
  }));

  // Offene Wochenziele plus die Pausen, die dazugehören
  let offen = 0, pausen = 0;
  state.areas.forEach(a => {
    const rest = Math.max(0, a.plan.goal * 60 - areaMinutes(a.id, false));
    if (!rest) return;
    offen += rest;
    const A = artOf(a);
    pausen += Math.ceil(rest / A.max) * A.pause;
  });

  const bedarf = fest + offen + pausen;
  const grenze = wach * VERPLANT_GRENZE;
  return { wach, fest, offen, pausen, bedarf, grenze,
           quote: wach ? bedarf / wach : 0, ok: bedarf <= grenze };
}

/* Zeichnet die Auslastungs-Ampel. Grün bis 60 %, gelb bis 70 %, darüber rot —
   die Zahlen kommen aus der Beobachtung, dass Pläne reißen, weil man sich zu
   viel vornimmt, nicht weil man schlecht sortiert. */
function ampelFarbe(q) {
  return q <= 0.60 ? "var(--success)" : q <= 0.70 ? "var(--warn)" : "var(--danger)";
}
function ampelZeichnen(el) {
  if (!el) return;
  const k = wochenKapazitaet();
  const pct = Math.round(k.quote * 100);
  el.innerHTML =
    "<div class='ampel'><span>Woche zu <b style='color:var(--text)'>" + pct + " %</b> verplant</span>" +
    "<span class='ampel__bar'><span class='ampel__fill' style='transform:scaleX(" +
      (Math.min(100, pct) / 100) + ");background:" + ampelFarbe(k.quote) + "'></span>" +
      "<span class='ampel__mark' style='left:" + Math.round(VERPLANT_GRENZE * 100) + "%'></span>" +
    "</span><span style='color:var(--text-faint)'>" + fmtDur(Math.round(k.bedarf)) + " von " +
      fmtDur(Math.round(k.wach)) + "</span></div>" +
    (k.ok ? "" :
      "<div class='goalrow__sub' style='margin:-2px 0 10px'>Über der Marke bei " +
      Math.round(VERPLANT_GRENZE * 100) + " % wird es eng — Pläne reißen an zu vollen Tagen, " +
      "nicht an schlechter Sortierung.</div>");
  return k;
}

/* Mindestpause nach einem Block, bevor der Planer etwas Neues vorschlägt.

   Der Stress entsteht am Übergang, nicht im Termin — und je länger der Block,
   desto länger muss die Pause sein. Kurze Pausen reichen für die Stimmung, für
   Kopfarbeit nicht. Ohne diese Regel klebte alles aneinander: „Längster Block
   120 min" teilte die Zeit zwar, trennte sie aber nicht.

   Das gilt nur für den Vorschlag. Von Hand darf man weiter alles aneinanderlegen. */
const PAUSE_MIN = 5;
function pauseNach(len, area) {
  const grund = area ? artOf(area).pause : 15;
  // Kurze Blöcke brauchen weniger, sehr lange etwas mehr als die Grundpause.
  if (len < 45) return Math.max(PAUSE_MIN, Math.round(grund * 0.5 / 5) * 5);
  if (len >= 150) return grund + 10;
  return grund;
}

/* Freie Lücken eines Tages innerhalb des erlaubten Fensters.
   Vergangenes wird ausgelassen — ein Vorschlag für gestern hilft niemandem.
   Schlaf- und Ruhezeit zählen wie ein belegter Block: der Vorschlag geht
   darum herum, von Hand eintragen darf man dort trotzdem. */
function freeGaps(day, plan, area) {
  const areaId = area && area.id;
  const todayKey = iso(new Date());
  if (day.key < todayKey) return [];
  if (istFrei(day.key)) return [];

  const lo = Math.max(state.settings.dayStart * 60, plan.from == null ? 0 : plan.from);
  const hi = Math.min(state.settings.dayEnd * 60, plan.to == null ? 1440 : plan.to);
  if (hi - lo < 15) return [];

  let cursor = lo;
  if (day.key === todayKey) {
    const now = new Date().getHours() * 60 + new Date().getMinutes();
    cursor = Math.max(cursor, Math.ceil((now + 10) / 15) * 15);
  }

  // Der Abstand zu einem vorhandenen Block ist der größte von dreien:
  // seine Wegzeit, die Wegzeit dessen, was hier hin soll, und die Mindestpause.
  //
  // Bisher zählte nur die erste. Wer eine Stunde zur Uni fährt, bekam den
  // Uni-Block trotzdem auf die Minute an die Arbeit geklebt — der Puffer hing
  // am falschen Bereich.
  //
  // Der Abstand ist der größere von zwei Dingen: die Fahrt zwischen den beiden
  // Orten und die Pause nach dem vorhandenen Block. Gleicher Ort heißt keine
  // Fahrt — zwei Lernblöcke hintereinander sitzen am selben Schreibtisch.
  const zielOrt = area ? (area.plan.ortId || state.settings.heimOrt || null) : null;
  const busy = state.blocks
    .filter(b => !b.grob && onDay(b, day.key, day.i))
    .map(b => {
      const pause = pauseNach(b.end - b.start, areaById(b.areaId));
      const fahrt = weg(ortOf(b), zielOrt);
      return { start: b.start - Math.max(fahrt, pause), end: b.end + Math.max(fahrt, pause) };
    })
    .concat(restSpans())
    .sort((a, b) => a.start - b.start);

  const gaps = [];
  busy.forEach(b => {
    if (b.start > cursor) gaps.push({ start: cursor, end: b.start });
    cursor = Math.max(cursor, b.end);
  });
  gaps.push({ start: cursor, end: hi });

  return gaps
    .map(g => ({ start: Math.max(g.start, lo), end: Math.min(g.end, hi) }))
    .filter(g => g.end - g.start >= 15);
}

/* Wie voll ist ein Tag schon — inklusive der Vorschläge, die dieser
   Durchlauf bereits gesetzt hat. */
function tagesLast(day) {
  return state.blocks.reduce((s, b) =>
    s + (onDay(b, day.key, day.i) ? dauerVon(b) : 0), 0);
}
function bereichAmTag(areaId, day) {
  return state.blocks.reduce((s, b) =>
    s + (b.areaId === areaId && onDay(b, day.key, day.i) ? dauerVon(b) : 0), 0);
}

/* Bewertet einen möglichen Platz. Je höher, desto besser.

   Der alte Verteiler nahm immer die erste freie Lücke und schrieb den Block an
   deren Anfang. Das ist der Grund, warum der Vormittag zugemauert wurde und der
   Abend leer blieb, und warum der Montag zwölf Stunden trug, während der Sonntag
   fünfeinhalb hatte. Hier werden stattdessen mehrere Plätze verglichen. */
function slotScore(start, len, area, day, gap) {
  let s = 100;
  const vorne = start - gap.start;
  const hinten = gap.end - (start + len);

  // Fragmentierung: bestraft wird, was übrig bleibt, nicht das Teilen an sich.
  // Eine Lücke von acht Stunden in zwei Hälften zu schneiden ist harmlos —
  // sogar gut, weil links und rechts Luft entsteht. Schlecht sind unbrauchbare
  // Reste. (Eine pauschale Strafe fürs Teilen drückte jeden Block an den
  // Anfang der Lücke und damit die Erholung zurück in den Vormittag.)
  if (vorne > 0 && vorne < 45) s -= 14;
  if (hinten > 0 && hinten < 45) s -= 14;
  const kleinereSeite = (vorne > 0 && hinten > 0) ? Math.min(vorne, hinten) : Infinity;
  if (kleinereSeite < 90) s -= 8;

  // Tagesbalance. Quadratisch, damit ein schon voller Tag schnell unattraktiv
  // wird — sonst frisst der erste Tag der Woche alles.
  const fenster = Math.max(60, (state.settings.dayEnd - state.settings.dayStart) * 60);
  const anteil = Math.min(1.6, tagesLast(day) / (fenster * 0.65));
  s -= anteil * anteil * 55;

  // Derselbe Bereich soll sich über die Woche verteilen, nicht an einem Tag klumpen.
  s -= bereichAmTag(area.id, day) / 15 * 5;

  // Tagesform: an einem Tag mit wenig Energie landet weniger.
  // Ist nichts eingetragen, ist das Gewicht 1 und dieser Term null.

  // Tageszeit — hängt an der Art. Kopfarbeit früh, Erholung in den Feierabend.
  // Ohne diesen Term landet alles am Tagesende, weil dort nichts zerschnitten
  // wird und keine Restlücke bleibt.
  const tagAnfang = Math.max(state.settings.dayStart * 60,
    ...restSpans().filter(r => r.start <= state.settings.dayStart * 60).map(r => r.end), 0);
  const A = artOf(area);
  s += A.zeit(start, tagAnfang);
  // Direkt aus dem Bett in einen Block will niemand — und direkt bis ins Bett
  // auch nicht. Ohne die zweite Regel landet Erholung immer am Tagesende, weil
  // dort keine Restlücke übrig bleibt, die man zerschneiden könnte.
  if (start < tagAnfang + 45) s -= 12;
  const abendRuhe = restSpans().filter(r => r.end >= 1440).map(r => r.start);
  const tagEnde = Math.min(state.settings.dayEnd * 60,
    ...(abendRuhe.length ? abendRuhe : [1440]));
  if (start + len > tagEnde - 45) s -= 18;

  // Lange Blöcke lieber am Stück als zerstückelt.
  s += Math.min(len, A.max) / 60 * 3;

  // Ortswechsel kosten. Wer schon am selben Ort ist, spart die Fahrt;
  // der dritte Ort an einem Tag ist einer zu viel.
  const zielOrt = area.plan.ortId || state.settings.heimOrt || null;
  if (zielOrt) {
    const heute = state.blocks.filter(b => onDay(b, day.key, day.i));
    const orte = new Set(heute.map(b => ortOf(b)).filter(Boolean));
    if (orte.has(zielOrt)) s += 8;
    else if (orte.size >= 2) s -= 16;
    const davor = heute.filter(b => b.end <= start).sort((x, y) => y.end - x.end)[0];
    if (davor && weg(ortOf(davor), zielOrt) > 0) s -= 6;
  }

  return s;
}

/* Verteilt die offenen Minuten eines Bereichs auf die Woche.
   Jeder Block sucht sich seinen Platz einzeln und nimmt den bestbewerteten. */
/* ============================================================
   Grobe Verteilung

   Kein Suchen nach Lücken — nur die Frage, an welchem Tag und in welchem
   Abschnitt noch Luft ist. Dabei zwei Regeln aus der Erholungsforschung:
   lieber ein langer Block als drei kurze (fragmentierte Freizeit wird als
   minderwertig erlebt, auch wenn die Summe stimmt), und Erholung gehört in
   den Feierabend.
   ============================================================ */
function placeGrob(area, open, tage) {
  const A = artOf(area);
  const minLen = Math.max(60, A.min);          // Anti-Konfetti
  const maxLen = Math.max(minLen, A.max);
  const heuteKey = iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  // Bevorzugter Abschnitt je Art — Erholung abends, Kopfarbeit vormittags
  const reihenfolge = A === ARTEN.kopf ? ["vm", "nm", "ab"]
                    : A === ARTEN.koerper ? ["nm", "ab", "vm"]
                    : ["ab", "nm", "vm"];

  const moeglich = [];
  tage.forEach(day => {
    if (day.key < heuteKey) return;
    if (istFrei(day.key)) return;
    reihenfolge.forEach((teil, rang) => {
      const a = abschnittVon(teil);
      // Ein Abschnitt, der heute schon vorbei ist, hilft niemandem mehr
      if (day.key === heuteKey && jetzt >= a.bis) return;
      // Wie viel ist in diesem Abschnitt schon verplant — grob wie exakt?
      const belegt = state.blocks.filter(b => onDay(b, day.key, day.i)).reduce((n, b) => {
        if (b.grob) return n + (b.teil === teil ? b.dauer : 0);
        const ueberlappt = Math.min(b.end, a.bis) - Math.max(b.start, a.von);
        return n + Math.max(0, ueberlappt);
      }, 0);
      const laenge = Math.min(a.bis, state.settings.dayEnd * 60)
                   - Math.max(a.von, state.settings.dayStart * 60);
      if (laenge <= 0) return;
      // Nie mehr als zwei Drittel eines Abschnitts grob verplanen
      const frei = Math.floor(laenge * 0.66) - belegt;
      if (frei < minLen) return;
      moeglich.push({ day, teil, rang, frei, schonHier: bereichAmTag(area.id, day) });
    });
  });

  if (!moeglich.length) return 0;

  let rest = open, placed = 0, schutz = 0;
  while (rest >= 15 && schutz++ < 40) {
    // Bester Platz: bevorzugter Abschnitt, wenig belegt, Bereich noch nicht
    // an diesem Tag — Streuung über die Woche statt Häufung
    moeglich.sort((x, y) =>
      (x.rang - y.rang) || (x.schonHier - y.schonHier) || (y.frei - x.frei));
    const ziel = moeglich.find(m => m.frei >= Math.min(minLen, rest));
    if (!ziel) break;

    const len = Math.floor(Math.min(maxLen, rest, ziel.frei) / 15) * 15;
    if (len < 15) break;
    // Bliebe ein Rest unter der Mindestlänge übrig, lieber alles in einen Block
    const nimm = (rest - len > 0 && rest - len < minLen) ? Math.min(rest, ziel.frei) : len;

    state.blocks.push({
      id: uid(), title: area.name, areaId: area.id,
      day: ziel.day.i, date: ziel.day.key, repeat: "none",
      grob: true, teil: ziel.teil, dauer: nimm,
      start: abschnittVon(ziel.teil).von, end: abschnittVon(ziel.teil).von + nimm,
      frog: false, sug: true
    });
    ziel.frei -= nimm;
    ziel.schonHier += nimm;
    moeglich.filter(m => m.day.key === ziel.day.key).forEach(m => { m.schonHier = ziel.schonHier; });
    rest -= nimm;
    placed += nimm;
  }
  return placed;
}

function placeArea(area, open) {
  const p = area.plan;
  const tage = weekDays().filter(day => p.days.includes(day.i));
  if (!tage.length) return 0;

  // Grob geplante Bereiche bekommen keine Uhrzeit, sondern einen Abschnitt.
  if (p.grob) return placeGrob(area, open, tage);

  // Blocklängen kommen aus der Art, nicht mehr aus zwei Zahlenfeldern,
  // die niemand sinnvoll raten konnte.
  const A = artOf(area);
  const minLen = Math.min(A.min, Math.max(15, Math.floor(open / 15) * 15));

  // Auf wie viele Tage lässt sich das Ziel sinnvoll verteilen? Genau hier lag
  // der zweite Fehler: „Sport 3 h" ergab rechnerisch 30 Minuten pro Tag, das
  // war weniger als die Mindestlänge — also wurde an keinem Tag etwas gesetzt
  // und der Auffangdurchlauf kippte alle drei Stunden auf den Montag.
  // Zielblocklänge: eine Stunde ist der brauchbarste Default, aber innerhalb
  // dessen, was der Bereich erlaubt. Daraus ergibt sich, auf wie viele Tage
  // sich das Ziel sinnvoll verteilen lässt.
  const zielLen = clamp(60, A.min, A.max);
  const maxTage = clamp(Math.round(open / zielLen), 1,
                        Math.min(tage.length, Math.max(1, Math.floor(open / minLen))));
  const proTag = Math.max(minLen, Math.ceil(open / maxTage / 15) * 15);

  let rest = open, placed = 0;

  // Erst mit Tagesobergrenze verteilen, dann ohne — sonst bleibt bei einer
  // vollen Woche etwas liegen, das durchaus noch gepasst hätte.
  for (const grenze of [proTag, Infinity]) {
    let schutz = 0;
    while (rest >= minLen && schutz++ < 60) {
      let best = null;
      for (const day of tage) {
        const schon = bereichAmTag(area.id, day);
        if (schon >= grenze) continue;
        // Auch die Blocklänge an die Tagesgrenze binden — sonst schöpft der
        // erste Block die Obergrenze in einem Rutsch aus und der Bereich landet
        // doch wieder nur an zwei Tagen.
        const platzHeute = grenze === Infinity ? Infinity : grenze - schon;
        for (const g of freeGaps(day, p, area)) {
          const room = g.end - g.start;
          const len = Math.floor(Math.min(A.max, rest, room, platzHeute) / 15) * 15;
          if (len < minLen) continue;
          // Anfang, kurz nach Anfang, Mitte und Ende der Lücke vergleichen
          const starts = [g.start, g.start + 45,
                          g.start + Math.floor((room - len) / 2 / 15) * 15, g.end - len];
          new Set(starts).forEach(st => {
            if (st < g.start || st + len > g.end) return;
            const sc = slotScore(st, len, area, day, g);
            if (!best || sc > best.sc) best = { sc, day, start: st, len };
          });
        }
      }
      if (!best) break;
      state.blocks.push({
        id: uid(), title: area.name, areaId: area.id,
        day: best.day.i, date: best.day.key, repeat: "none",
        start: best.start, end: best.start + best.len, frog: false, sug: true
      });
      rest -= best.len;
      placed += best.len;
    }
    if (rest < minLen) break;
  }

  // Restminuten unter der Mindestlänge nicht als Zwergblock anlegen,
  // sondern an vorhandene Vorschläge anhängen
  if (rest >= 15) placed += growSuggestions(area, rest);

  return placed;
}

/* Hängt übrig gebliebene Minuten an bestehende Vorschläge an,
   statt 15-Minuten-Krümel ins Raster zu streuen.

   Diese Funktion kannte weder die Nachtruhe noch überlappende Termine: sie
   dehnte Vorschläge in die Schlafenszeit hinein und quer über Arzttermine
   hinweg, weil `x.start >= b.end` einen Block, der schon vorher beginnt,
   nicht findet. Beides ist jetzt Teil der Obergrenze. */
function growSuggestions(area, rest) {
  const p = area.plan;
  const hi = Math.min(state.settings.dayEnd * 60, p.to == null ? 1440 : p.to);
  let used = 0;

  for (const day of weekDays()) {
    if (!p.days.includes(day.i)) continue;
    if (day.key < iso(new Date())) continue;
    const all = state.blocks.filter(b => onDay(b, day.key, day.i))
      .sort((a, b) => a.start - b.start);

    for (const b of all) {
      if (rest - used < 15) return used;
      if (!b.sug || b.areaId !== area.id) continue;

      // Alles, was nach dem Ende dieses Blocks noch im Weg steht — auch wenn es
      // davor beginnt und ihn überlappt. Dazu die Nachtruhe.
      const zielOrt = area.plan.ortId || state.settings.heimOrt || null;
      const hindernisse = all
        .filter(x => x !== b && x.end > b.end)
        .map(x => x.start - Math.max(weg(ortOf(x), zielOrt),
                                     pauseNach(x.end - x.start, areaById(x.areaId))))
        .concat(restSpans().filter(r => r.end > b.end).map(r => r.start));

      const limit = Math.min(hi, ...hindernisse.filter(v => v >= b.end));
      const grow = Math.floor(
        Math.min(limit - b.end, artOf(area).max - (b.end - b.start), rest - used) / 15) * 15;
      if (grow >= 15) { b.end += grow; used += grow; }
    }
  }
  return used;
}

function buildSuggestions() {
  clearSuggestions();

  // Erst das, was sein muss — dann der Rest. Bei knappem Platz soll nicht
  // der Serienabend den Lernblock verdraengen, nur weil er groesser war.
  const todo = state.areas
    .map(a => ({ a, open: a.plan.goal * 60 - areaMinutes(a.id, false) }))
    .filter(x => x.open >= 15)
    .sort((x, y) => (y.a.plan.must - x.a.plan.must) || (y.open - x.open));

  let placed = 0, missing = 0;
  todo.forEach(({ a, open }) => {
    const got = placeArea(a, open);
    placed += got;
    missing += open - got;
  });
  return { placed, missing, areas: todo.length };
}

function clearSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  state.blocks = state.blocks.filter(b => !(b.sug && keys.has(b.date)));
}

function acceptSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  let n = 0;
  state.blocks.forEach(b => { if (b.sug && keys.has(b.date)) { delete b.sug; n++; } });
  return n;
}

/* Vorschlagsleiste ueber der Tabbar: dieselben drei Funktionen wie in
   "Ziele" (hasSuggestions/acceptSuggestions/clearSuggestions), nur auch
   in "Plan" und "Heute" sichtbar platziert — vorher musste man dafuer
   extra nach "Ziele" wechseln. Der data-sugbar-Flag am body treibt sowohl
   die Sichtbarkeit der Leiste als auch die Fussbereich-Stapelung in CSS
   (--fuss-oben, s. Responsive-Media-Query). */
function renderSugBar() {
  const bar = $("#sugBar");
  const aktiv = hasSuggestions() && (mview === "plan" || mview === "heute");
  document.body.dataset.sugbar = aktiv ? "1" : "0";
  bar.innerHTML = "";
  if (!aktiv) return;

  const keys = new Set(weekDays().map(d => d.key));
  const n = state.blocks.filter(b => b.sug && keys.has(b.date)).length;

  const text = document.createElement("span");
  text.className = "sugbar__text";
  text.textContent = n + (n === 1 ? " Vorschlag" : " Vorschläge");

  const ok = document.createElement("button");
  ok.type = "button"; ok.className = "btn btn--primary sugbar__accept";
  ok.textContent = "Übernehmen";
  ok.onclick = () => {
    const got = acceptSuggestions();
    save(); renderAll();
    toast(got + (got === 1 ? " Vorschlag übernommen" : " Vorschläge übernommen"));
  };

  const close = document.createElement("button");
  close.type = "button"; close.className = "btn btn--icon btn--ghost sugbar__close";
  close.textContent = "×";
  close.setAttribute("aria-label", "Vorschläge verwerfen");
  close.onclick = () => { clearSuggestions(); save(); renderAll(); toast("Vorschläge verworfen"); };

  bar.append(text, ok, close);
}

/* ============================================================ Ziele-Anzeige */
/* Ist die angezeigte Woche die laufende? */
function istDieseWoche() {
  return iso(mondayOf(anchor)) === iso(mondayOf(new Date()));
}

/* Blättert eine Woche vor und verteilt dort gleich.
   Vorausplanen ging immer schon — man musste nur wissen, dass man
   vorblättern kann. Genau das wusste niemand. */
function planeNaechsteWoche() {
  anchor = addDays(mondayOf(anchor), 7);
  const r = buildSuggestions();
  save(); renderAll();
  if (!r.placed) toast("Nichts zu verteilen — alle Ziele sind schon gedeckt");
  else toast("Vorschlag für die nächste Woche steht");
}

function renderGoals() {
  const list = $("#goalsList");
  const foot = $("#goalsFoot");
  list.innerHTML = "";
  foot.innerHTML = "";

  // Wer in einer anderen Woche plant, soll das sehen — sonst wundert man
  // sich, warum die Stunden nicht zum eigenen Gefühl passen.
  if (!istDieseWoche()) {
    const mon = mondayOf(anchor);
    const bar = document.createElement("div");
    bar.className = "goals__which";
    bar.textContent = (mon > mondayOf(new Date()) ? "Du planst voraus: " : "Vergangene Woche: ")
      + "KW " + isoWeek(mon) + ", ab " + mon.getDate() + "." + (mon.getMonth() + 1) + ".";
    list.appendChild(bar);
  }

  const withGoal = state.areas.filter(a => a.plan.goal > 0);

  if (withGoal.length) {
    const amp = document.createElement("div");
    ampelZeichnen(amp);
    list.appendChild(amp);
  }

  if (!withGoal.length) {
    list.innerHTML =
      "<div class='empty'><b>Noch keine Wochenziele</b>Für alles ohne feste Uhrzeit: sag, wie viele Stunden " +
      "pro Woche du willst — z.B. 10 h Lernen. Wann genau, entscheidest du später.</div>";
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Wochenziel festlegen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    return;
  }

  let anyOpen = false;

  withGoal.forEach(a => {
    const goal = a.plan.goal * 60;
    const done = areaMinutes(a.id, false);
    const sug  = areaMinutes(a.id, true);
    const open = Math.max(0, goal - done - sug);
    if (goal - done >= 15) anyOpen = true;

    const row = document.createElement("div");
    row.className = "goal";
    row.style.setProperty("--h", a.hue);

    const ist   = Math.min(areaIst(a.id), done);
    const pIst  = clamp(ist / goal * 100, 0, 100);
    const pDone = clamp((done - ist) / goal * 100, 0, 100 - pIst);
    const pSug  = clamp(sug / goal * 100, 0, 100 - pIst - pDone);

    row.innerHTML =
      "<div class='goal__top'>" +
        "<span class='goal__name'><span class='goal__dot'></span>" + escapeHtml(a.name) + "</span>" +
        "<span class='goal__num'>" + (ist > 0 ? "✓ " + fmtDur(ist) + " · " : "") +
          fmtDur(done) + " / " + fmtDur(goal) + "</span>" +
      "</div>" +
      "<div class='goal__track'>" +
        "<div class='goal__fill goal__fill--ist' style='width:" + pIst + "%'></div>" +
        "<div class='goal__fill' style='width:" + pDone + "%'></div>" +
        "<div class='goal__fill goal__fill--sug' style='width:" + pSug + "%'></div>" +
      "</div>" +
      "<div class='goal__rest'>" + goalHint(done, sug, open, goal) + "</div>";

    list.appendChild(row);
  });

  // Immer erreichbar, solange man in der laufenden Woche steht
  const naechste = () => {
    if (!istDieseWoche()) return null;
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Nächste Woche";
    b.title = "Eine Woche vorblättern und dort verteilen";
    b.onclick = planeNaechsteWoche;
    return b;
  };

  if (hasSuggestions()) {
    const ok = document.createElement("button");
    ok.className = "btn btn--primary btn--sm";
    ok.textContent = "Alle übernehmen";
    ok.onclick = () => {
      const n = acceptSuggestions();
      save(); renderAll();
      toast(n + (n === 1 ? " Vorschlag übernommen" : " Vorschläge übernommen"));
    };
    const no = document.createElement("button");
    no.className = "btn btn--sm";
    no.textContent = "Verwerfen";
    no.onclick = () => { clearSuggestions(); save(); renderAll(); toast("Vorschläge verworfen"); };
    foot.append(ok, no);
  } else if (anyOpen) {
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Vorschlagen";
    b.onclick = () => {
      const verteilen = () => {
        const r = buildSuggestions();
        save(); renderAll();
        if (!r.placed) toast("Kein Platz gefunden — Zeitfenster erweitern?");
        else if (r.missing >= 15) toast("Verteilt, bis auf " + fmtDur(r.missing) + " — da war kein Platz mehr");
        else toast("Vorschlag steht — schau, ob's dir passt");
      };
      const k = wochenKapazitaet();
      if (k.ok) { verteilen(); return; }
      // Nicht erst verteilen und danach melden, was nicht passte.
      modal((sh, close) => {
        sh.innerHTML =
          "<h2 class='sheet__title'>Das wird eng</h2>" +
          "<p style='margin:0 0 14px;color:var(--text-muted);font-size:14px;line-height:1.6'>" +
          "Deine Ziele und Termine summieren sich mit den nötigen Pausen auf <b>" +
          fmtDur(Math.round(k.bedarf)) + "</b>. In dieser Woche stehen dir " +
          fmtDur(Math.round(k.wach)) + " wache Stunden zur Verfügung — realistisch verplanbar " +
          "sind davon etwa <b>" + fmtDur(Math.round(k.grenze)) + "</b>.</p>" +
          "<p style='margin:0 0 14px;color:var(--text-faint);font-size:13px;line-height:1.6'>" +
          "Ein Plan ohne Luft hält nicht: Es kommt immer etwas dazwischen, und dann " +
          "kippt der ganze Tag statt nur ein Block. Nimm lieber " +
          fmtDur(Math.round(k.bedarf - k.grenze)) + " aus den Wochenzielen heraus.</p>" +
          "<div id='wAmpel'></div>";
        ampelZeichnen(sh.querySelector("#wAmpel"));
        const foot = document.createElement("div");
        foot.className = "sheet__foot";
        const trotz = document.createElement("button");
        trotz.className = "btn"; trotz.type = "button"; trotz.textContent = "Trotzdem verteilen";
        trotz.onclick = () => { close(); verteilen(); };
        const sp = document.createElement("span"); sp.className = "spacer";
        const ziele = document.createElement("button");
        ziele.className = "btn btn--primary"; ziele.type = "button"; ziele.textContent = "Ziele anpassen";
        ziele.onclick = () => { close(); goalsSheet(); };
        foot.append(trotz, sp, ziele);
        sh.appendChild(foot);
      });
    };
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  } else {
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Ziele anpassen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  }
}

function goalHint(done, sug, open, goal) {
  if (sug > 0) return "<b>" + fmtDur(sug) + "</b> vorgeschlagen" + (open >= 15 ? " · " + fmtDur(open) + " bleiben offen" : "");
  if (done >= goal) return "Geschafft.";
  return "<b>" + fmtDur(goal - done) + "</b> noch offen";
}

/* ============================================================ Ziele bearbeiten */
function goalsSheet() {
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Wochenziele</h2>" +
      "<p style='margin:0 0 16px;color:var(--text-muted);font-size:14px;line-height:1.6'>" +
      "Für alles, was keine feste Uhrzeit hat. Trag Stunden pro Woche ein — der Planer " +
      "rechnet mit, was noch fehlt, und kann den Rest auf die Woche verteilen. " +
      "0 lassen heißt: kein Ziel. Die <b>Art</b> sagt ihm, wie lang die Blöcke sein " +
      "dürfen, wie viel Pause danach nötig ist und wann am Tag es am besten passt.</p>" +
      "<div id='gAmpel'></div>" +
      "<div class='goallist' id='gList'></div>";

    const wrap = s.querySelector("#gList");
    ampelZeichnen(s.querySelector("#gAmpel"));

    state.areas.forEach(a => {
      const p = a.plan;
      const row = document.createElement("div");
      row.className = "goalrow";
      row.style.setProperty("--h", a.hue);

      row.innerHTML =
        "<div class='goalrow__head'>" +
          "<span class='goalrow__name'><span class='goal__dot'></span>" + escapeHtml(a.name) +
            "<span class='goalrow__tags'></span></span>" +
          "<input class='field goalrow__h' type='number' min='0' max='80' step='0.5' " +
                 "aria-label='Stunden pro Woche für " + escapeHtml(a.name) + "'>" +
          "<span class='goalrow__unit'>h / Woche</span>" +
          "<button class='goalrow__more' type='button' aria-expanded='false' " +
                  "aria-label='Zeiten für " + escapeHtml(a.name) + "'>⌄</button>" +
        "</div>" +
        "<div class='goalrow__art'></div>" +
        "<div class='goalrow__arthint'></div>" +
        "<div class='goalrow__body' hidden>" +
          "<label class='switch' style='margin-bottom:6px'>" +
            "<input type='checkbox' class='gGrob'> Ohne feste Uhrzeit planen</label>" +
          "<p class='goalrow__sub' style='margin:0 0 14px'>Der Vorschlag legt nur einen " +
            "Tagesabschnitt fest — „Samstagabend, etwa zwei Stunden\" statt 14:00–16:30. " +
            "Für Freizeit und Zeit mit Menschen ist das meist die ehrlichere Planung.</p>" +
          "<label class='switch' style='margin-bottom:14px'>" +
            "<input type='checkbox' class='gMust'> Muss sein — nicht zum Streichen vorschlagen</label>" +
          "<p class='goalrow__sub'>Wann darf der Vorschlag das einplanen?</p>" +
          "<div class='chipset gDays' style='margin-bottom:14px'></div>" +
          "<div class='sheet__cols' style='margin-bottom:12px'>" +
            "<div><label class='label'>Frühestens</label><input class='field gFrom' type='time' step='900'></div>" +
            "<div><label class='label'>Spätestens</label><input class='field gTo' type='time' step='900'></div>" +
          "</div>" +
          "<p class='goalrow__sub'>Wo findet das statt? Daraus rechnet der Planer die Fahrzeit.</p>" +
          "<div class='chipset gOrte'></div>" +
        "</div>";

      const hIn   = row.querySelector(".goalrow__h");
      const more  = row.querySelector(".goalrow__more");
      const body  = row.querySelector(".goalrow__body");
      const dayW  = row.querySelector(".gDays");
      const from  = row.querySelector(".gFrom");
      const to    = row.querySelector(".gTo");
      const mustIn = row.querySelector(".gMust");
      const grobIn = row.querySelector(".gGrob");
      grobIn.checked = !!p.grob;
      const artW  = row.querySelector(".goalrow__art");
      const artHint = row.querySelector(".goalrow__arthint");
      const orteW = row.querySelector(".gOrte");

      const tags = row.querySelector(".goalrow__tags");
      const paintTags = () => {
        tags.innerHTML =
          (p.grob ? "<span class='tag'>ohne Uhrzeit</span>" : "") +
          (p.must ? "" : "<span class='tag tag--soft'>kann warten</span>") +
          (p.ortId ? "<span class='tag'>" + escapeHtml(ortName(p.ortId)) + "</span>" : "");
      };
      paintTags();

      // Art — die eine sichtbare Entscheidung je Bereich
      const paintArt = () => {
        artW.innerHTML = "";
        ART_REIHE.forEach(k => {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(p.art === k));
          c.textContent = ARTEN[k].label;
          c.onclick = () => { p.art = k; paintArt(); };
          artW.appendChild(c);
        });
        const A = ARTEN[p.art] || ARTEN.orga;
        artHint.textContent = A.hint + " · Blöcke " + A.min + "–" + A.max +
          " min, danach " + A.pause + " min Pause.";
      };
      paintArt();

      // Ort
      ortChips(orteW, () => p.ortId, id => { p.ortId = id; paintTags(); });

      mustIn.checked = p.must;
      hIn.value = p.goal || 0;
      from.value = fmtTime(p.from == null ? state.settings.dayStart * 60 : p.from);
      to.value   = fmtTime(p.to   == null ? state.settings.dayEnd * 60   : p.to);

      const days = new Set(p.days);
      const paintDays = () => {
        dayW.innerHTML = "";
        for (let i = 0; i < 7; i++) {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(days.has(i)));
          c.textContent = DAY_SHORT[i];
          c.onclick = () => {
            if (days.has(i)) { if (days.size > 1) days.delete(i); }
            else days.add(i);
            paintDays();
          };
          dayW.appendChild(c);
        }
      };
      paintDays();

      more.onclick = () => {
        const open = body.hidden;
        if (!open) { row._commit(); paintTags(); }   // Zugeklapptes zeigt den Zustand
        body.hidden = !open;
        more.setAttribute("aria-expanded", String(open));
        more.textContent = open ? "⌃" : "⌄";
      };

      row._commit = () => {
        p.must = mustIn.checked;
        p.grob = grobIn.checked;
        p.goal = clamp(parseFloat(String(hIn.value).replace(",", ".")) || 0, 0, 80);
        p.days = [...days].sort((x, y) => x - y);
        const f = parseTime(from.value), t = parseTime(to.value);
        p.from = f > 0 ? f : null;
        p.to   = t < 1440 && t > f ? t : null;
        // Blocklängen kommen aus der Art — die beiden Zahlenfelder sind weg.
        const A = ARTEN[p.art] || ARTEN.orga;
        p.min = A.min; p.max = A.max;
      };

      wrap.appendChild(row);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Speichern";
    wrap.addEventListener("input", () => {
      wrap.querySelectorAll(".goalrow").forEach(r => r._commit());
      ampelZeichnen(s.querySelector("#gAmpel"));
    });
    ok.onclick = () => {
      wrap.querySelectorAll(".goalrow").forEach(r => r._commit());
      save(); close(); renderAll();
    };
    foot.append(cancel, ok);
    s.appendChild(foot);
  }, { wide: true });
}

/* ============================================================
   Band für grob geplante Zeit

   Steht unter dem Raster, in denselben Spalten, aber ohne Zeitachse.
   Erscheint nur, wenn es in der Woche überhaupt etwas Grobes gibt.
   ============================================================ */
function renderLoose() {
  const band = $("#looseBand");
  if (!band) return;
  const mon = mondayOf(anchor);
  const tage = einTag ? [selectedDayIdx] : [0, 1, 2, 3, 4, 5, 6];

  const daten = tage.map(i => {
    const d = addDays(mon, i);
    return { i, key: iso(d), items: grobeFor(iso(d), i) };
  });

  if (!daten.some(x => x.items.length)) { band.hidden = true; return; }
  band.hidden = false;
  band.innerHTML = "";
  band.style.setProperty("--lcols", tage.length);
  band.style.setProperty("--gutter", einTag ? "44px" : "56px");

  // Eine Zeile je Abschnitt, damit man sieht, wann am Tag es ungefähr sein soll
  ABSCHNITTE.forEach(abschnitt => {
    const inZeile = daten.map(x => x.items.filter(b => b.teil === abschnitt.id));
    if (!inZeile.some(l => l.length)) return;

    const lab = document.createElement("div");
    lab.className = "loose__lab";
    lab.textContent = abschnitt.kurz;
    band.appendChild(lab);

    inZeile.forEach((liste, n) => {
      const cell = document.createElement("div");
      cell.className = "loose__cell";
      liste.forEach(b => {
        const area = areaById(b.areaId);
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "loosechip" + (b.sug ? " is-sug" : "");
        chip.style.setProperty("--h", area.hue);
        const fertig = !b.sug && istErledigt(b, daten[n].key);
        if (fertig) chip.classList.add("is-done");
        chip.title = (fertig ? "Erledigt: " : "") + b.title + " · " + abschnitt.name + " · " + fmtDur(b.dauer)
                   + (b.sug ? " (Vorschlag)" : "");
        chip.innerHTML = "<span class='loosechip__t'>" + escapeHtml(b.title) + "</span>" +
                         "<span class='loosechip__d'>" + fmtDur(b.dauer) + "</span>";
        chip.onclick = () => (b.sug ? sugSheet(b) : blockSheet({ ...b }, daten[n].key));
        cell.appendChild(chip);
      });
      band.appendChild(cell);
    });
  });

  const hinweis = document.createElement("div");
  hinweis.className = "loose__hint";
  hinweis.textContent = isMobile
    ? "Ohne feste Uhrzeit."
    : "Ohne feste Uhrzeit — der Abschnitt ist reserviert, die Minute nicht.";
  band.appendChild(hinweis);
}

/* ============================================================ Raster */
function renderGrid() {
  const grid = $("#grid");
  const wrap = $("#gridWrap");
  const keepScroll = wrap.scrollTop;
  grid.innerHTML = "";

  const { dayStart, dayEnd } = state.settings;
  const hours = dayEnd - dayStart;
  const hourH = parseFloat(getComputedStyle(grid).getPropertyValue("--hourh")) || 52;
  const bodyH = hours * hourH;
  const mon = mondayOf(anchor);
  const todayIso = iso(new Date());
  const dayIdxs = einTag ? [selectedDayIdx] : [0, 1, 2, 3, 4, 5, 6];
  grid.style.setProperty("--cols", dayIdxs.length);

  // Kopfzeile — am Handy übernimmt das der Tag-Umschalter oben
  if (!einTag) {
  const gh = document.createElement("div");
  gh.className = "dayhead dayhead--gutter";
  grid.appendChild(gh);

  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const h = document.createElement("div");
    const frei = istFrei(iso(d));
    h.className = "dayhead" + (iso(d) === todayIso ? " is-today" : "") + (frei ? " is-frei" : "");
    const en = state.days[iso(d)] && state.days[iso(d)].energy;
    if (en) h.dataset.energy = en;
    h.innerHTML =
      "<div class='dayhead__name'>" + DAY_SHORT[i] + "</div>" +
      "<div class='dayhead__num'>" + d.getDate() + "</div>" +
      (frei ? "<span class='dayhead__frei'>frei</span>" : "") +
      "<span class='dayhead__energy' aria-hidden='true'><i></i><i></i><i></i></span>";
    h.onclick = () => { selectedDayIdx = i; renderEnergy(); renderDaySwitch(); if (einTag) renderGrid(); };
    grid.appendChild(h);
  });
  }

  // Ein freigehaltener Tag wird nicht bebaut — der Verteiler lässt ihn aus,
  // von Hand eintragen bleibt erlaubt.
  // Zeitspalte
  const tc = document.createElement("div");
  tc.className = "timecol";
  tc.style.height = bodyH + "px";
  for (let h = dayStart; h <= dayEnd; h++) {
    const m = document.createElement("div");
    m.className = "timecol__mark num";
    m.style.top = ((h - dayStart) * hourH) + "px";
    m.textContent = pad2(h) + ":00";
    tc.appendChild(m);
  }
  grid.appendChild(tc);

  // Tagesspalten
  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const col = document.createElement("div");
    col.className = "daycol" + (i >= 5 ? " is-weekend" : "") + (istFrei(iso(addDays(mon, i))) ? " is-frei" : "");
    col.style.height = bodyH + "px";
    col.dataset.day = i;
    col.dataset.date = iso(d);

    // Nachtruhe hinterlegen — liegt unter den Linien und Blöcken
    restSpans().forEach(sp => {
      const a = Math.max(sp.start, dayStart * 60);
      const b = Math.min(sp.end, dayEnd * 60);
      if (b <= a) return;
      const r = document.createElement("div");
      r.className = "rest";
      r.style.top = ((a - dayStart * 60) / 60 * hourH) + "px";
      r.style.height = ((b - a) / 60 * hourH) + "px";
      r.title = "Nachtruhe — hier wird nichts vorgeschlagen";
      col.appendChild(r);
    });

    for (let h = 0; h <= hours; h++) {
      const l = document.createElement("div");
      l.className = "daycol__line";
      l.style.top = (h * hourH) + "px";
      col.appendChild(l);
      if (h < hours) {
        const hl = document.createElement("div");
        hl.className = "daycol__line daycol__line--half";
        hl.style.top = (h * hourH + hourH / 2) + "px";
        col.appendChild(hl);
      }
    }

    if (iso(d) === todayIso) {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      if (mins >= dayStart * 60 && mins <= dayEnd * 60) {
        const n = document.createElement("div");
        n.className = "now";
        n.style.top = ((mins - dayStart * 60) / 60 * hourH) + "px";
        col.appendChild(n);
      }
    }

    layout(blocksFor(d, i)).forEach(p => col.appendChild(blockEl(p, hourH, iso(d))));

    attachColumnHandlers(col, hourH);
    grid.appendChild(col);
  });

  // keepScroll === 0 ist falsy — wer ganz oben stand, wurde vom Minutentakt
  // sonst jede Minute zurück zur aktuellen Uhrzeit gerissen.
  wrap.scrollTop = keepScroll > 0 ? keepScroll : startScroll(hourH);
}

/* Wohin das Raster beim ersten Zeichnen springt.

   Bisher immer „aktuelle Stunde minus eins". Am Telefon zeigt der Plan aber
   einen einzelnen Tag, und wer den Sonntag ansieht, will nicht die Uhrzeit
   von heute sehen, sondern was an dem Tag ansteht. Und wenn der erste
   Eintrag um neun beginnt, ist eine Kopfzeile bei zehn nutzlos. */
function startScroll(hourH) {
  const { dayStart } = state.settings;
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();
  let ziel;

  if (isMobile) {
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const heute = iso(d) === iso(new Date());
    const starts = blocksFor(d, selectedDayIdx).map(b => b.start);
    if (starts.length) ziel = Math.min(...starts);
    else if (heute) ziel = jetzt;
    else ziel = Math.max(dayStart * 60, 8 * 60);
    if (heute) ziel = Math.min(ziel, jetzt);
  } else {
    ziel = jetzt;
  }

  // Eine Dreiviertelstunde Vorlauf, damit der erste Eintrag nicht am
  // oberen Rand klebt.
  return Math.max(0, (ziel - 45 - dayStart * 60) / 60 * hourH);
}

function blockEl({ b, col, of }, hourH, dayKey) {
  const { dayStart } = state.settings;
  const el = document.createElement("div");
  const area = areaById(b.areaId);
  const h = (b.end - b.start) / 60 * hourH;
  const fertig = !b.sug && istErledigt(b, dayKey || b.date);
  el.className = "block" + (h < 34 ? " is-short" : "") + (b.frog ? " is-frog" : "")
    + (b.sug ? " is-sug" : "") + (fertig ? " is-done" : "");
  el.style.setProperty("--h", area.hue);
  el.style.top = ((b.start - dayStart * 60) / 60 * hourH) + "px";
  el.style.height = Math.max(18, h - 2) + "px";
  if (of > 1) {
    const w = 100 / of;
    el.style.left = "calc(" + (col * w) + "% + 3px)";
    el.style.right = "calc(" + ((of - col - 1) * w) + "% + 3px)";
  }
  el.tabIndex = 0;
  el.dataset.id = b.id;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label",
    (b.sug ? "Vorschlag: " : "") + (fertig ? "Erledigt: " : "") + b.title + ", "
    + fmtTime(b.start) + " bis " + fmtTime(b.end) + ", " + area.name);
  const t = document.createElement("div");
  t.className = "block__title"; t.textContent = b.title || "Ohne Titel";
  const tm = document.createElement("div");
  tm.className = "block__time num"; tm.textContent = fmtTime(b.start) + "–" + fmtTime(b.end);
  el.append(t, tm);
  const rz = document.createElement("div");
  rz.className = "block__resize";
  el.appendChild(rz);

  // Abhaken direkt am Block — bisher ging das nur über den Blockeditor.
  // Vorschläge zählen nicht: die gelten erst als erledigt, wenn sie
  // angenommen wurden.
  if (!b.sug) {
    const done = document.createElement("input");
    done.type = "checkbox"; done.className = "block__done";
    done.checked = fertig;
    done.setAttribute("aria-label", "Erledigt: " + (b.title || area.name));
    // Sonst löst der Klick auch den Spalten-Handler aus (verschieben/öffnen),
    // und die Leertaste würde zusätzlich noch den Editor öffnen (Tastatur-
    // Handler unten am Block, hört auch auf gebubbelte Ereignisse).
    done.addEventListener("pointerdown", e => e.stopPropagation());
    done.addEventListener("click", e => e.stopPropagation());
    done.addEventListener("keydown", e => e.stopPropagation());
    done.onchange = () => {
      setzeErledigt(b, dayKey || b.date, done.checked);
      // renderAll() statt nur diesen Block anzufassen: am Desktop stehen
      // Agenda und Raster nebeneinander, sonst zeigt der Haken in der
      // Agenda-Zeile den alten Stand, bis irgendetwas anderes neu zeichnet.
      save(); renderAll();
    };
    el.appendChild(done);
  }

  if (b.sug) {
    const bar = document.createElement("div");
    bar.className = "block__sug";
    const yes = document.createElement("button");
    yes.type = "button"; yes.textContent = "✓";
    yes.title = "Übernehmen"; yes.setAttribute("aria-label", "Vorschlag übernehmen");
    yes.onclick = e => { e.stopPropagation(); acceptOne(b.id); };
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "×";
    no.title = "Verwerfen"; no.setAttribute("aria-label", "Vorschlag verwerfen");
    no.onclick = e => { e.stopPropagation(); dropOne(b.id); };
    bar.append(yes, no);
    // Pointer-Events der Knöpfe nicht vom Spalten-Handler abfangen lassen
    bar.addEventListener("pointerdown", e => e.stopPropagation());
    el.appendChild(bar);
  }

  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (b.sug) acceptOne(b.id); else editBlock(b.id, dayKey || b.date);
    }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      state.blocks = state.blocks.filter(x => x.id !== b.id);
      save(); renderAll();
      if (b.sug) toast("Vorschlag verworfen"); else toastUndo("Eintrag gelöscht");
    }
  });
  return el;
}

function acceptOne(id, fest) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  delete b.sug;
  if (fest) b.repeat = "weekly";
  save(); renderAll();
  toast(fest ? "Übernommen — steht ab jetzt jede Woche" : "Übernommen");
}
function dropOne(id) {
  state.blocks = state.blocks.filter(x => x.id !== id);
  save(); renderAll(); toast("Vorschlag verworfen");
}

/* ============================================================ Maus/Touch im Raster */
const SNAP = 15;
function snap(min) { return Math.round(min / SNAP) * SNAP; }

function attachColumnHandlers(col, hourH) {
  const { dayStart, dayEnd } = state.settings;
  const minAt = clientY => {
    const r = col.getBoundingClientRect();
    return clamp(snap(dayStart * 60 + (clientY - r.top) / hourH * 60), dayStart * 60, dayEnd * 60);
  };

  col.addEventListener("pointerdown", e => {
    const blockNode = e.target.closest(".block");
    const handle = e.target.closest(".block__resize");
    const fine = e.pointerType === "mouse";

    /* --- Größe ändern --- */
    if (handle && blockNode && fine) {
      e.preventDefault();
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const move = ev => {
        const end = Math.max(b.start + SNAP, minAt(ev.clientY));
        blockNode.style.height = Math.max(18, (end - b.start) / 60 * hourH - 2) + "px";
        blockNode.dataset.pendEnd = end;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        b.end = +blockNode.dataset.pendEnd || b.end;
        save(); renderAll();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Block verschieben (nur Maus) --- */
    if (blockNode && fine) {
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const startY = e.clientY, origStart = b.start, len = b.end - b.start;
      let moved = false;
      const move = ev => {
        if (!moved && Math.abs(ev.clientY - startY) < 4) return;
        moved = true;
        blockNode.classList.add("is-dragging");
        const delta = snap((ev.clientY - startY) / hourH * 60);
        const ns = clamp(origStart + delta, dayStart * 60, dayEnd * 60 - len);
        blockNode.style.top = ((ns - dayStart * 60) / 60 * hourH) + "px";
        blockNode.dataset.pendStart = ns;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        if (moved) {
          const ns = +blockNode.dataset.pendStart;
          b.start = ns; b.end = ns + len;
          save(); renderAll();
        } else {
          editBlock(b.id, col.dataset.date);
        }
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf Block: erst beim Loslassen, und nur ohne Wischen ---
       Vorher ging der Editor schon beim Aufsetzen des Fingers auf, sodass
       jeder Scrollversuch einen Dialog erzeugt hat. */
    if (blockNode) {
      tapOrScroll(e, () => editBlock(blockNode.dataset.id, col.dataset.date));
      return;
    }

    /* --- Ziehen zum Anlegen (nur Maus) --- */
    if (fine) {
      e.preventDefault();
      const a = minAt(e.clientY);
      const ghost = document.createElement("div");
      ghost.className = "block__ghost";
      ghost.style.setProperty("--h", state.areas[0].hue);
      col.appendChild(ghost);
      let from = a, to = a + 60;
      const paint = () => {
        const s = Math.min(from, to), en = Math.max(from, to);
        ghost.style.top = ((s - dayStart * 60) / 60 * hourH) + "px";
        ghost.style.height = Math.max(16, (en - s) / 60 * hourH - 2) + "px";
        ghost.textContent = fmtTime(s) + "–" + fmtTime(en);
      };
      paint();
      let dragged = false;
      const move = ev => { dragged = true; to = minAt(ev.clientY); paint(); };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        ghost.remove();
        let s = Math.min(from, to), en = Math.max(from, to);
        if (!dragged || en - s < SNAP) { s = a; en = a + 60; }
        newBlock(+col.dataset.day, col.dataset.date, s, Math.min(en, dayEnd * 60));
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf leere Fläche: langes Drücken ---
       Ein kurzer Tipp legt bewusst nichts an. Beim Scrollen streift man
       ständig freie Flächen; ein Eintrag, den man nicht wollte, ist
       ärgerlicher als ein Weg, den man einmal lernen muss. Für alles
       andere gibt es den Plus-Knopf. */
    holdToCreate(e, col, minAt, hourH, dayEnd);
  });

  /* Aufgabe per Drag&Drop einplanen */
  col.addEventListener("dragover", e => {
    if (!dragTaskId) return;
    e.preventDefault();
    col.classList.add("is-droptarget");
  });
  col.addEventListener("dragleave", () => col.classList.remove("is-droptarget"));
  col.addEventListener("drop", e => {
    col.classList.remove("is-droptarget");
    if (!dragTaskId) return;
    e.preventDefault();
    const t = state.tasks.find(x => x.id === dragTaskId);
    if (!t) return;
    // Startzeit klemmen, nicht die Endzeit — sonst entsteht beim Fallenlassen
    // ganz unten ein Block „22:00–22:00" ohne Dauer.
    const laenge = t.dauer || 60;
    const s = Math.min(minAt(e.clientY), state.settings.dayEnd * 60 - 30);
    state.blocks.push({
      id: uid(), title: t.title, areaId: t.areaId || state.areas[0].id,
      day: +col.dataset.day, date: col.dataset.date, repeat: "none",
      start: s, end: Math.min(s + laenge, state.settings.dayEnd * 60), frog: !!t.frog
    });
    save(); renderAll();
    toast("Eingeplant: " + t.title);
  });
}

/* ============================================================
   Tippen oder Wischen auseinanderhalten

   Auf einem Telefon ist jede Berührung erst einmal mehrdeutig: Anfang
   einer Scrollbewegung oder Tipp? Das entscheidet sich erst beim
   Loslassen — vorher zu handeln erzeugt genau die Fehlauslösungen, über
   die man dann stolpert.
   ============================================================ */
const TAP_SLOP = 10;      // Pixel Wackeln, die noch als Tipp durchgehen
const TAP_TIME = 700;     // länger gehalten ist kein Tipp mehr
const HOLD_TIME = 380;    // so lange drücken für einen neuen Eintrag

function tapOrScroll(e, run) {
  const x0 = e.clientX, y0 = e.clientY, t0 = Date.now();
  let moved = false;
  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) moved = true;
  };
  const done = () => {
    off();
    if (!moved && Date.now() - t0 < TAP_TIME) run();
  };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", done);
    document.removeEventListener("pointercancel", off);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", done);
  document.addEventListener("pointercancel", off);
}

function holdToCreate(e, col, minAt, hourH, dayEnd) {
  const x0 = e.clientX, y0 = e.clientY;
  const start = minAt(e.clientY);
  let abgebrochen = false;

  // Sichtbare Rückmeldung, damit klar ist, dass gerade etwas entsteht
  const ghost = document.createElement("div");
  ghost.className = "block__ghost is-holding";
  ghost.style.setProperty("--h", state.areas[0].hue);
  ghost.style.top = ((start - state.settings.dayStart * 60) / 60 * hourH) + "px";
  ghost.style.height = Math.max(16, hourH - 2) + "px";
  ghost.textContent = fmtTime(start) + "–" + fmtTime(start + 60);
  col.appendChild(ghost);

  const timer = setTimeout(() => {
    if (abgebrochen) return;
    off();
    ghost.remove();
    if (navigator.vibrate) navigator.vibrate(12);
    newBlock(+col.dataset.day, col.dataset.date, start, Math.min(start + 60, dayEnd * 60));
  }, HOLD_TIME);

  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) stop();
  };
  const stop = () => { abgebrochen = true; clearTimeout(timer); ghost.remove(); off(); };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", stop);
    document.removeEventListener("pointercancel", stop);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
}

/* ============================================================ Block-Editor */
function newBlock(dayIdx, dateIso, start, end) {
  blockSheet({
    id: null, title: "", areaId: state.areas[0].id,
    day: dayIdx, date: dateIso, repeat: "none",
    start, end, frog: false
  });
}
function editBlock(id, dayKey) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  if (b.sug) { sugSheet(b); return; }
  blockSheet({ ...b }, dayKey || b.date);
}

/* Antippen eines Vorschlags — am Handy der Hauptweg, am PC die Alternative
   zu den kleinen Knöpfen im Block. */
function sugSheet(b) {
  const area = areaById(b.areaId);
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Vorschlag</h2>" +
      "<p style='margin:0 0 6px;font-size:15px'><b>" + escapeHtml(b.title) + "</b></p>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:14px'>" +
      DAY_LONG[b.day] + ", " + fmtTime(b.start) + "–" + fmtTime(b.end) +
      " · " + escapeHtml(area.name) + "</p>" +
      "<p style='margin:0 0 16px;color:var(--text-faint);font-size:13px;line-height:1.6'>" +
      "Nur ein Vorschlag — er zählt erst mit, wenn du ihn übernimmst. " +
      "Verschieben kannst du ihn auch einfach im Raster.</p>" +
      "<label class='switch'><input type='checkbox' id='sugWeekly'> " +
      "Fest übernehmen — ab jetzt jede Woche zu dieser Zeit</label>";

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const del = document.createElement("button");
    del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Verwerfen";
    del.onclick = () => { close(); dropOne(b.id); };
    const sp = document.createElement("span"); sp.className = "spacer";
    const edit = document.createElement("button");
    edit.className = "btn"; edit.type = "button"; edit.textContent = "Ändern";
    edit.onclick = () => { close(); blockSheet({ ...b }); };
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Übernehmen";
    ok.onclick = () => {
      const fest = s.querySelector("#sugWeekly").checked;
      close();
      acceptOne(b.id, fest);
    };
    foot.append(del, sp, edit, ok);
    s.appendChild(foot);
  });
}

function blockSheet(draft, dayKey) {
  const isNew = !draft.id;
  const hakenTag = dayKey || draft.date;
  const mon = mondayOf(anchor);
  let days = new Set([draft.day]);

  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>" + (isNew ? "Neuer Eintrag" : "Eintrag bearbeiten") + "</h2>" +
      "<div class='sheet__row'><label class='label' for='bTitle'>Was?</label>" +
      "<input class='field' id='bTitle' placeholder='z.B. Vorlesung, Sport, Serienabend' autocomplete='off'></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span><div class='chipset' id='bAreas'></div></div>" +
