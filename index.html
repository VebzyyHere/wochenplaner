<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenplaner</title>
<meta name="description" content="Deine Woche in Stunden statt nur in Terminen. Feste Termine, Wochenziele und Erholung in einem Plan.">
<!-- Farbe der Statusleiste; wird beim Umschalten des Erscheinungsbilds
     aus dem Code nachgezogen. -->
<meta name="theme-color" id="themeColor" content="#ffffff">
<!-- Vom Homescreen starten: ohne Browserleiste, mit eigenem Namen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wochenplan">
<!-- Manifest und Symbole liegen als eigene Dateien daneben. Wer die
     Einzeldatei heruntergeladen hat, hat sie nicht — dort wuerden drei
     vergebliche Abrufe in der Konsole landen. Darum erst pruefen, dann
     eintragen. Das passiert noch beim Lesen des Kopfes, also fruehzeitig
     genug, dass der Browser die App als installierbar erkennt. -->
<script>
(function () {
  if (location.protocol.indexOf("http") !== 0) return;
  var v = [["manifest", "manifest.json"], ["apple-touch-icon", "apple-touch-icon.png"], ["icon", "icon-192.png"]];
  for (var i = 0; i < v.length; i++) {
    var l = document.createElement("link");
    l.rel = v[i][0]; l.href = v[i][1];
    document.head.appendChild(l);
  }
})();
</script>
<style>
/* ============================================================
   Design Tokens
   Chrome bleibt achromatisch — die Farbe gehört den Bereichen.
   In einem Planer IST die Farbe die Information.
   ============================================================ */
:root {
  color-scheme: light dark;
  -webkit-text-size-adjust: 100%;   /* iOS blaeht Text im Querformat sonst auf */

  --h-ink: 265;

  --bg:         oklch(0.985 0.003 var(--h-ink));
  --surface:    oklch(1 0 0);
  --surface-2:  oklch(0.965 0.004 var(--h-ink));
  --surface-3:  oklch(0.935 0.006 var(--h-ink));
  --border:     oklch(0.90 0.006 var(--h-ink));
  --border-strong: oklch(0.82 0.008 var(--h-ink));
  --text:       oklch(0.24 0.015 var(--h-ink));
  --text-muted: oklch(0.44 0.012 var(--h-ink));
  --text-faint: oklch(0.53 0.010 var(--h-ink));

  --ink:        oklch(0.30 0.030 var(--h-ink));
  --ink-hover:  oklch(0.24 0.030 var(--h-ink));
  --ink-active: oklch(0.19 0.030 var(--h-ink));
  --focus:      oklch(0.58 0.170 var(--h-ink));

  --danger:  oklch(0.55 0.190 25);
  --success: oklch(0.55 0.140 150);
  --warn:    oklch(0.66 0.150 75);

  --on-ink:    var(--surface);
  --on-danger: var(--surface);

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-12:48px;

  --radius: 10px;
  --radius-sm: 7px;
  --radius-lg: 16px;
  --shadow-1: 0 1px 2px oklch(0.2 0.02 var(--h-ink) / 0.08);
  --shadow-2: 0 6px 20px oklch(0.2 0.02 var(--h-ink) / 0.14), 0 1px 3px oklch(0.2 0.02 var(--h-ink) / 0.08);
  --shadow-3: 0 16px 48px oklch(0.2 0.02 var(--h-ink) / 0.22);

  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

html[data-theme="dark"] {
  --bg:         oklch(0.165 0.012 var(--h-ink));
  --surface:    oklch(0.205 0.014 var(--h-ink));
  --surface-2:  oklch(0.245 0.015 var(--h-ink));
  --surface-3:  oklch(0.285 0.016 var(--h-ink));
  --border:     oklch(0.315 0.016 var(--h-ink));
  --border-strong: oklch(0.40 0.018 var(--h-ink));
  --text:       oklch(0.955 0.006 var(--h-ink));
  --text-muted: oklch(0.80 0.012 var(--h-ink));
  --text-faint: oklch(0.68 0.012 var(--h-ink));

  --ink:        oklch(0.90 0.010 var(--h-ink));
  --ink-hover:  oklch(0.96 0.010 var(--h-ink));
  --ink-active: oklch(0.82 0.010 var(--h-ink));
  --focus:      oklch(0.72 0.150 var(--h-ink));

  --danger:  oklch(0.68 0.180 25);
  --success: oklch(0.72 0.140 150);
  --warn:    oklch(0.78 0.150 75);

  --on-ink:    oklch(0.18 0.014 var(--h-ink));
  --on-danger: oklch(0.18 0.014 var(--h-ink));

  --shadow-1: 0 1px 2px oklch(0 0 0 / 0.35);
  --shadow-2: 0 6px 20px oklch(0 0 0 / 0.45), 0 1px 3px oklch(0 0 0 / 0.3);
  --shadow-3: 0 16px 48px oklch(0 0 0 / 0.6);

}

/* Bereichsfarben: gleiche Helligkeit/Chroma, nur der Hue (--h) wechselt.
   Muss auf dem Element selbst deklariert werden — auf :root wäre --h leer. */
.block, .block__ghost, .chip, .arearow, .task__meta, .dayswitch__btn, .goal, .goalrow, .reliefrow,
.hakenrow, .zielrow, .agenda__hero, .agenda__row {
  --area-bg:     oklch(0.950 0.048 var(--h));
  --area-bg-2:   oklch(0.900 0.075 var(--h));
  --area-edge:   oklch(0.870 0.070 var(--h));
  --area-line:   oklch(0.605 0.150 var(--h));
  --area-text:   oklch(0.350 0.090 var(--h));
  --area-dot:    oklch(0.605 0.150 var(--h));
}
html[data-theme="dark"] :is(.block, .block__ghost, .chip, .arearow, .task__meta, .dayswitch__btn, .goal, .goalrow, .reliefrow,
.hakenrow, .zielrow, .agenda__hero, .agenda__row) {
  --area-bg:     oklch(0.320 0.060 var(--h));
  --area-bg-2:   oklch(0.400 0.085 var(--h));
  --area-edge:   oklch(0.430 0.080 var(--h));
  --area-line:   oklch(0.740 0.150 var(--h));
  --area-text:   oklch(0.945 0.035 var(--h));
  --area-dot:    oklch(0.740 0.150 var(--h));
}

/* ============================================================ Base */
* { box-sizing: border-box; }
/* Das hidden-Attribut bringt nur einen schwachen Browser-Standard mit, den
   jede Klassenregel schlaegt. Ohne das hier bleibt ein verborgener Knopf
   unsichtbar, faengt aber weiter Klicks ab — genau das hat auf dem iPhone
   das Zahnrad blockiert. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
.num { font-variant-numeric: tabular-nums; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================ Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 38px; padding: 0 var(--s-3);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 14px; font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn--primary {
  background: var(--ink); border-color: var(--ink);
  color: var(--on-ink); font-weight: 600;
}
.btn--primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn--ghost { background: transparent; border-color: transparent; }
/* Ohne echtes Zeigegerät bleibt :hover nach dem Antippen hängen (z. B.
   #nextWeek zeigt dann dauerhaft die Hover-Fläche) — deshalb nur auf
   Geräten mit echtem Hover aktiv. .btn:hover trifft auch auf .btn--ghost
   zu (gleiche Kaskade), muss also mitwandern. */
@media (hover: hover) {
  .btn:hover { background: var(--surface-2); }
  .btn--ghost:hover { background: var(--surface-2); }
}
.btn--danger { color: var(--danger); border-color: transparent; background: transparent; }
.btn--danger:hover { background: oklch(0.55 0.19 25 / 0.12); }
.btn--icon { min-width: 38px; padding: 0 var(--s-2); }
.btn--sm { min-height: 32px; font-size: 13px; padding: 0 var(--s-2); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface); font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s;
}
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink);
}
.chip__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--area-dot); flex: none; }

.label {
  display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: var(--s-2);
}
.field {
  width: 100%; min-height: 40px; padding: 0 var(--s-3);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
}
.field:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }

/* ============================================================ App shell */
/* overflow: hidden verhindert, dass die ganze Seite am Telefon gummiartig
   mitfedert — gescrollt wird im Raster, nicht am Dokument. */
.app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

/* Langes Drücken legt einen Eintrag an. Ohne diese drei Zeilen kommt an
   derselben Stelle die Textauswahl von iOS dazwischen und übernimmt die
   Geste. */
.gridwrap, .dayswitch, .tabbar, .loose, .dayhead, .block, .daycol {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.block__title, .block__time { -webkit-user-select: none; user-select: none; }

.topbar {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  padding-top: max(var(--s-3), env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex: none;
}
.brand { display: flex; align-items: baseline; gap: var(--s-2); margin-right: auto; min-width: 0; }
.brand__name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand__who {
  font-size: 13px; color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.weeknav { display: flex; align-items: center; gap: var(--s-1); }
.weeknav__label {
  min-width: 148px; text-align: center; font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.weeknav__label small { display: block; font-weight: 500; color: var(--text-muted); font-size: 12px; }

.main { display: flex; flex: 1; min-height: 0; }

.panel {
  width: 320px; flex: none;
  border-right: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  padding: var(--s-4);
  display: flex; flex-direction: column; gap: var(--s-5);
}
.card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); padding: var(--s-4);
}
.card__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-2); margin-bottom: var(--s-3);
}
.card__title { font-size: 13px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); }

/* ============================================================ Tagesform (Signature) */
.energy { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.energy__opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: var(--s-3) var(--s-1); min-height: 74px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); font-size: 12px; font-weight: 600;
  transition: background .15s, border-color .15s, transform .1s;
}
.energy__opt:active { transform: scale(0.97); }
.energy__opt[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-3); }
.energy__bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.energy__bars i { width: 5px; border-radius: 2px; background: var(--border-strong); display: block; }
.energy__bars i:nth-child(1) { height: 8px; }
.energy__bars i:nth-child(2) { height: 14px; }
.energy__bars i:nth-child(3) { height: 20px; }
.energy__opt[data-lvl="low"][aria-pressed="true"] .energy__bars i:nth-child(1) { background: var(--warn); }
.energy__opt[data-lvl="mid"][aria-pressed="true"] .energy__bars i:nth-child(-n+2) { background: var(--focus); }
.energy__opt[data-lvl="high"][aria-pressed="true"] .energy__bars i { background: var(--success); }
.hint {
  margin-top: var(--s-3); padding: var(--s-3);
  border-radius: var(--radius-sm); background: var(--surface);
  border: 1px dashed var(--border-strong);
  font-size: 13px; color: var(--text-muted); line-height: 1.5;
}
.hint b { color: var(--text); font-weight: 600; }

/* ============================================================
   Agenda — der neue Kopf der „Heute"-Karte (Stufe 4)

   Keine Karten in der Karte: Zeilen trennt eine Haarlinie, Farbe ist ein
   3px-Strich links (--area-line), keine Fläche, kein Rahmen, kein
   Schatten. Zwei Schriftgrößen pro Zeile, nicht drei — die einzige große
   ist der laufende Eintrag, alles andere bleibt Fließtext.
   ============================================================ */
.agenda { display: flex; flex-direction: column; }
.agenda__label {
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-muted); margin: 14px 0 6px;
}
.agenda__label:first-child { margin-top: 0; }
.agenda__frog {
  display: block; width: 100%; min-height: 44px; padding: 4px 0 10px;
  border: none; border-bottom: 1px solid var(--border); background: transparent;
  font-size: 15px; font-weight: 600; color: var(--text); text-align: left;
  cursor: pointer;
}
.agenda__hero {
  margin-top: 10px; padding: 8px 0 10px 10px;
  border-left: 3px solid var(--area-line); border-bottom: 1px solid var(--border);
}
.agenda__hero-status {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; color: var(--text-muted); margin-bottom: 3px;
}
.agenda__hero-title { font-size: 26px; font-weight: 600; line-height: 1.25; }
.agenda__hero-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
.agenda__list { display: flex; flex-direction: column; }
.agenda__row {
  display: flex; align-items: flex-start; gap: 10px; min-height: 44px;
  padding: 6px 0 6px 10px; border-left: 3px solid var(--area-line);
  border-top: 1px solid var(--border); cursor: pointer;
}
.agenda__row--grob { border-left-style: dotted; }
.agenda__row.is-on .agenda__title { opacity: .55; text-decoration: line-through; }
.agenda__check {
  appearance: none; width: 16px; height: 16px; margin-top: 4px; flex: none;
  border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
  cursor: pointer; position: relative;
}
.agenda__check:checked { background: var(--ink); border-color: var(--ink); }
.agenda__check:checked::after {
  content: ""; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 8px; border: solid var(--on-ink);
  border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.agenda__body { flex: 1; min-width: 0; }
.agenda__line { display: flex; align-items: baseline; gap: 8px; }
.agenda__title { font-size: 14px; font-weight: 500; min-width: 0; }
.agenda__time { margin-left: auto; font-size: 13px; color: var(--text-muted); flex: none; }
.agenda__sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.agenda__foot {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-muted);
}
/* Ladezustand, solange Sync.boot() den echten Stand noch nicht gezogen hat —
   dieselbe Schraffur wie die Nachtruhe im Raster (.rest, ~785), nur als
   eigenständige Fläche statt als Overlay. */
.agenda__loading {
  height: 200px; border-radius: var(--radius-sm);
  background: var(--surface-3);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0.5 0.02 var(--h-ink) / 0.055) 5px 10px);
}
html[data-theme="dark"] .agenda__loading {
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0 0 0 / 0.16) 5px 10px);
}

/* ============================================================ Wochenstart */
.ritual { border-color: var(--border-strong); }
.ritual__head {
  font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.ritual__txt { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text-muted); }
.ritual__txt b { color: var(--text); }
.ritual__foot { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); }
.ritual__lead {
  margin: 0 0 16px; font-size: 13.5px; line-height: 1.6; color: var(--text-muted);
}
.ritual__lead b { color: var(--text); font-weight: 600; }

.steps { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.steps__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
.steps__dot.is-on { background: var(--ink); }
.steps__lab { font-size: 11.5px; color: var(--text-faint); margin-left: 6px; }
.ritual__summe {
  margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text-muted);
}
.ritual__summe b { color: var(--text); font-weight: 600; }

.hakenliste { display: flex; flex-direction: column; gap: 2px; }
.hakenliste__tag:first-child { margin-top: 0; }
.hakenkopf {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border);
}
.hakenkopf__sum { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 120px; }
.hakenkopf__sum b { color: var(--text); font-weight: 600; }
.hakenliste__tag {
  font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-faint); margin: 12px 0 4px;
}
.hakenrow {
  display: flex; align-items: center; gap: 10px; min-height: 44px;
  padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer;
}
.hakenrow:hover { background: var(--surface-2); }
.hakenrow.is-on .hakenrow__txt { opacity: .55; text-decoration: line-through; }
.hakenrow input { width: 20px; height: 20px; flex: none; accent-color: var(--area-line); }
.hakenrow__txt {
  display: flex; align-items: center; gap: 7px; font-size: 13.5px;
  min-width: 0; flex: 1;
}
.hakenrow__txt > span:first-child { flex: none; }
.hakenrow__zeit { margin-left: auto; font-size: 11.5px; color: var(--text-faint); flex: none; }

.zieleliste { display: flex; flex-direction: column; gap: 2px; }
.zielrow {
  display: flex; align-items: center; gap: 10px; min-height: 48px;
  padding: 4px 0; opacity: .55;
}
.zielrow.is-on { opacity: 1; }
.zielrow__name { display: flex; align-items: center; gap: 7px; font-size: 13.5px; flex: 1; min-width: 0; }
.zielrow__ist { color: var(--text-faint); font-size: 11.5px; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper__val { min-width: 42px; text-align: center; font-size: 13px; font-weight: 600; }

/* Freihalten sitzt unter der Tagesform, weil beides dieselbe Frage ist:
   was verträgt dieser Tag? */
.freischalter { margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--border); }

/* ============================================================ Konto-Anzeige */
.syncbadge {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); border-radius: 999px;
  padding: 0 10px; min-height: 28px; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.syncbadge::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint); flex: none;
}
.syncbadge:hover { background: var(--surface-2); color: var(--text); }
.syncbadge.is-ok::before   { background: var(--success); }
.syncbadge.is-warn::before { background: var(--warn); }
.syncbadge.is-work::before { background: var(--focus); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.syncbadge__ico { display: none; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .syncbadge { padding: 0; min-width: 44px; justify-content: center; gap: 3px; }
  .syncbadge__txt { display: none; }
  .syncbadge__ico { display: block; }
  .syncbadge::before { width: 7px; height: 7px; }
}

/* ============================================================ Einstellungs-Menü */
.setmenu { display: flex; flex-direction: column; gap: 2px; margin: 0 calc(var(--s-2) * -1); padding-bottom: var(--s-3); }
.setmenu__item {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%; text-align: left;
  padding: 13px var(--s-2); min-height: 58px;
  border: none; background: transparent; border-radius: var(--radius-sm);
  border-bottom: 1px solid var(--border);
}
.setmenu__item:last-child { border-bottom: 0; }
.setmenu__item:hover { background: var(--surface-2); }
.setmenu__item:active { background: var(--surface-3); }
.setmenu__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.setmenu__name { font-size: 15px; font-weight: 600; }
.setmenu__kurz {
  font-size: 12.5px; color: var(--text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.setmenu__pfeil { flex: none; font-size: 20px; color: var(--text-faint); line-height: 1; }
.setback {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; padding: 4px 0; margin: 0 0 var(--s-4);
  font-size: 15px; font-weight: 600; color: var(--text-muted);
  min-height: 40px;
}
.setback:hover { color: var(--text); }
.setback span { font-size: 20px; line-height: 1; }
.sheet__row[hidden], .setmenu[hidden], .setback[hidden] { display: none; }

/* Konto in den Einstellungen */
.acct { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s-3); }
.acct__row { display: flex; align-items: center; gap: var(--s-3); }
.acct__txt { flex: 1; min-width: 0; }
.acct__what { font-size: 14px; font-weight: 600; }
.acct__sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

/* ============================================================ Wochenziele */
.goals { display: flex; flex-direction: column; gap: var(--s-4); }
.goal__top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); margin-bottom: 6px; }
.goal__name {
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.goal__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--area-dot); flex: none; }
.goal__num { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; flex: none; }
/* Drei Stufen im selben Balken: abgehakt, geplant, vorgeschlagen.
   Unterschieden über die Deckkraft, nicht über eine Schraffur — in acht
   Pixeln Höhe ist eine Schraffur kein Muster mehr, nur ein Farbton, und
   ein Vorschlag sah aus wie Erledigtes. */
.goal__track {
  height: 8px; border-radius: 4px; background: var(--surface-3);
  overflow: hidden; display: flex;
}
.goal__fill { background: var(--area-line); opacity: .58; }
.goal__fill--ist { opacity: 1; }
.goal__fill--sug { opacity: .24; }
.goal__rest { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; }
.goal__rest b { color: var(--text); font-weight: 600; }
.goals__foot { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); }
.goals__foot .btn { flex: 1 1 auto; }

/* Zieleditor */
.goallist { display: flex; flex-direction: column; gap: var(--s-2); }
.goalrow {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--s-3); background: var(--surface);
}
.goalrow__head { display: flex; align-items: center; gap: var(--s-2); }
.goalrow__name {
  flex: 1; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.goalrow__tags { display: inline-flex; gap: 5px; overflow: hidden; }
.goals__which {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  background: var(--surface-3); border-radius: var(--radius-sm);
  padding: 6px 10px; margin-bottom: 2px;
}
.relief { display: flex; flex-direction: column; gap: var(--s-2); }
.reliefrow {
  display: flex; align-items: center; gap: var(--s-2);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--s-3); background: var(--surface);
}
.reliefrow__txt { flex: 1; min-width: 0; }
.reliefrow__title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.reliefrow__time { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.reliefrow .goal__dot { background: var(--area-dot); }
.tag {
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-3); color: var(--text-muted);
}
.tag--soft { background: transparent; border: 1px dashed var(--border-strong); }
.goalrow__h { width: 78px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.goalrow__unit { font-size: 12.5px; color: var(--text-faint); flex: none; }
.goalrow__more {
  border: none; background: transparent; color: var(--text-faint);
  width: 30px; min-height: 30px; border-radius: var(--radius-sm); flex: none; font-size: 12px;
}
.goalrow__more:hover { background: var(--surface-2); color: var(--text); }
.goalrow__body {
  margin-top: var(--s-3); padding-top: var(--s-3);
  border-top: 1px dashed var(--border);
}
.goalrow__body[hidden] { display: none; }
.goalrow__art { display: flex; gap: 6px; margin-top: var(--s-2); flex-wrap: wrap; }
.goalrow__art .chip { font-size: 12px; padding: 5px 10px; min-height: 32px; }
@media (pointer: coarse) { .goalrow__art .chip { min-height: 44px; padding: 5px 12px; } }
.goalrow__arthint { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }
.wegrow { display: flex; align-items: center; gap: var(--s-2); margin-bottom: 6px; }
.wegrow__txt { flex: 1; font-size: 13px; min-width: 0; }
.wegrow__min { width: 74px; flex: none; text-align: right; }
.ampel { display: flex; align-items: center; gap: 8px; font-size: 12px;
  color: var(--text-muted); margin-bottom: var(--s-2); }
.ampel__bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-3);
  overflow: hidden; position: relative; }
.ampel__fill {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  border-radius: 99px; transform-origin: left; transition: transform .25s;
}
.ampel__mark { position: absolute; top: -2px; bottom: -2px; width: 1px;
  background: var(--text-faint); opacity: .55; }
.goalrow__sub { font-size: 12px; color: var(--text-faint); margin: 0 0 var(--s-2); }

/* Vorschlagsblöcke im Raster */
.block.is-sug {
  border-style: dashed;
  border-left-style: dashed;
  background: transparent;
  box-shadow: none;
  cursor: grab;
}
.block.is-sug::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--area-bg); opacity: .55;
}
.block.is-sug .block__title { opacity: .9; padding-right: 44px; }
.block.is-sug .block__time { opacity: .6; }
.block__sug { position: absolute; right: 3px; top: 3px; display: flex; gap: 3px; z-index: 3; }
.block__sug button {
  width: 19px; height: 19px; padding: 0; border-radius: 5px;
  border: 1px solid var(--area-edge); background: var(--surface);
  color: var(--area-text); font-size: 11px; line-height: 1;
  display: grid; place-items: center; box-shadow: var(--shadow-1);
}
.block__sug button:hover { background: var(--area-bg-2); }
.block.is-short .block__sug { top: 1px; }

/* ============================================================ Aufgaben */
.tasks { display: flex; flex-direction: column; gap: 2px; }
.task {
  display: flex; align-items: flex-start; gap: var(--s-2);
  padding: var(--s-2); border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid transparent;
  transition: background .15s, border-color .15s;
  cursor: grab;
}
.task:hover { border-color: var(--border); }
.task.is-dragging { opacity: .4; }
.task__check {
  appearance: none; width: 18px; height: 18px; margin: 2px 0 0; flex: none;
  border: 1.5px solid var(--border-strong); border-radius: 5px; background: var(--surface);
  cursor: pointer; transition: background .15s, border-color .15s; position: relative;
}
.task__check:checked { background: var(--ink); border-color: var(--ink); }
.task__check:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 4px; height: 9px; border: solid var(--on-ink);
  border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.task__body { flex: 1; min-width: 0; cursor: pointer; }
.task__title { font-size: 14.5px; word-break: break-word; line-height: 1.35; }
.task.is-done .task__title { text-decoration: line-through; color: var(--text-faint); }
.task__star {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text); margin-right: 5px; vertical-align: middle;
}
.task__meta {
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: 11.5px; color: var(--text-muted);
}
.task__dur {
  margin-left: 4px; padding-left: 7px; border-left: 1px solid var(--border);
  color: var(--text-faint);
}
.task__more {
  flex: none; border: 0; background: transparent; color: var(--text-muted);
  font-size: 17px; letter-spacing: 1px; line-height: 1;
  padding: 4px 8px; border-radius: 8px; align-self: center;
  transition: background .15s, color .15s;
}
.task__more:hover { background: var(--surface-2); color: var(--text); }
.taskadd { display: flex; gap: var(--s-2); margin-bottom: var(--s-3); }
.taskadd .field { min-height: 38px; }

.empty {
  text-align: center; padding: var(--s-5) var(--s-3);
  color: var(--text-faint); font-size: 13px; line-height: 1.6;
}
.empty b { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 4px; }

/* ============================================================ Wochenraster */
/* min-height:0 ist hier nicht optional — ohne das wächst das Raster über
   den Bildschirm hinaus und schiebt das Band unter den Rand. */
.planwrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.gridwrap { flex: 1; min-width: 0; overflow: auto; position: relative; background: var(--bg); }

/* ============================================================
   Band für grob geplante Zeit

   Bewusst ohne Zeitachse und ohne scharfe Kanten: was hier steht, hat
   keine Uhrzeit und soll auch keine vortäuschen.
   ============================================================ */
.loose {
  flex: none; border-top: 1px solid var(--border);
  background: var(--surface); padding: var(--s-2) 0;
  display: grid; grid-template-columns: var(--gutter, 56px) repeat(var(--lcols, 7), minmax(0, 1fr));
  max-height: 34dvh; overflow-y: auto;
  overscroll-behavior: contain;
}
.loose__lab {
  grid-column: 1; font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-faint);
  padding: 4px var(--s-2) 0 0; text-align: right; align-self: start;
}
.loose__cell { padding: 2px 3px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.loosechip {
  --area-bg: oklch(0.950 0.048 var(--h)); --area-line: oklch(0.605 0.150 var(--h));
  --area-text: oklch(0.350 0.090 var(--h));
  display: flex; align-items: baseline; gap: 5px;
  border: 1px dashed var(--area-line); border-radius: 999px;
  background: var(--area-bg); color: var(--area-text);
  padding: 5px 10px; min-height: 30px; text-align: left;
  font-size: 11.5px; font-weight: 600; line-height: 1.2;
  overflow: hidden;
}
html[data-theme="dark"] .loosechip {
  --area-bg: oklch(0.320 0.060 var(--h)); --area-line: oklch(0.740 0.150 var(--h));
  --area-text: oklch(0.945 0.035 var(--h));
}
.loosechip:hover { filter: brightness(0.97); }
html[data-theme="dark"] .loosechip:hover { filter: brightness(1.12); }
.loosechip.is-sug { opacity: .72; }
.loosechip__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loosechip.is-done { opacity: .5; text-decoration: line-through; }
.loosechip__d { flex: none; opacity: .75; font-variant-numeric: tabular-nums; font-weight: 500; }
.loose__hint {
  grid-column: 1 / -1; font-size: 11.5px; color: var(--text-faint);
  padding: 2px var(--s-3) 4px calc(var(--gutter, 56px) + 3px);
}

/* Am Telefon ist links kein Platz für eine Beschriftungsspalte —
   der Abschnitt steht als Zeile über seinen Einträgen. */
@media (max-width: 780px), (max-height: 500px) and (max-width: 1000px) {
  body[data-tage="1"] .loose { grid-template-columns: 1fr; padding: var(--s-1) 0 var(--s-2); }
  body[data-tage="1"] .loose__lab { text-align: left; padding: 6px var(--s-3) 2px; }
  body[data-tage="1"] .loose__cell { padding: 0 var(--s-3); }
  body[data-tage="1"] .loose__hint { padding: 4px 76px 0 var(--s-3); }
}
.grid {
  display: grid;
  grid-template-columns: var(--gutter) repeat(var(--cols), minmax(var(--colmin), 1fr));
  min-width: 100%;
  --gutter: 56px;
  --colmin: 116px;
  --hourh: 52px;
}
.dayhead {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  border-left: 1px solid var(--border);
  padding: var(--s-2) var(--s-2) var(--s-3);
  text-align: center;
}
.dayhead--gutter { border-left: 0; }
.dayhead.is-frei { background: var(--surface-2); }
.dayhead__frei {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--success); margin-top: 2px;
}
/* Ein freier Tag ist nicht leer — er ist geschützt. Darum eine ruhige
   Fläche statt einer Sperrschraffur. */
.daycol.is-frei { background: oklch(0.62 0.14 150 / .05); }
html[data-theme="dark"] .daycol.is-frei { background: oklch(0.72 0.14 150 / .07); }
.dayswitch__btn.is-frei { background: oklch(0.62 0.14 150 / .10); }
html[data-theme="dark"] .dayswitch__btn.is-frei { background: oklch(0.72 0.14 150 / .13); }
.dayhead__name { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
.dayhead__num {
  font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
  width: 32px; height: 32px; line-height: 32px; margin: 2px auto 0;
  border-radius: 50%;
}
.dayhead.is-today .dayhead__num { background: var(--ink); color: var(--on-ink); }
.dayhead.is-today .dayhead__name { color: var(--text); }
.dayhead__energy {
  display: none; align-items: flex-end; gap: 2px; height: 11px; margin-top: 4px;
}
.dayhead[data-energy] .dayhead__energy { display: inline-flex; }
.dayhead__energy i { width: 3px; border-radius: 1px; background: var(--border-strong); }
.dayhead__energy i:nth-child(1){height:5px} .dayhead__energy i:nth-child(2){height:8px} .dayhead__energy i:nth-child(3){height:11px}
.dayhead[data-energy="low"] .dayhead__energy i:nth-child(1){background:var(--warn)}
.dayhead[data-energy="mid"] .dayhead__energy i:nth-child(-n+2){background:var(--focus)}
.dayhead[data-energy="high"] .dayhead__energy i{background:var(--success)}

.timecol { grid-column: 1; position: relative; background: var(--bg); }
.timecol__mark {
  position: absolute; right: var(--s-2); transform: translateY(-50%);
  font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.daycol {
  position: relative; border-left: 1px solid var(--border);
  background: var(--surface);
  touch-action: pan-y;
}
.daycol.is-weekend { background: var(--surface-2); }
.daycol__line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
.daycol__line--half { border-top-style: dotted; opacity: .6; }
.now {
  position: absolute; left: 0; right: 0; height: 0; z-index: 9; pointer-events: none;
  border-top: 2px solid var(--danger);
}
.now::before {
  content: ""; position: absolute; left: -4px; top: -5px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
}

.block {
  position: absolute; left: 3px; right: 3px; z-index: 8;
  border-radius: var(--radius-sm);
  border: 1px solid var(--area-edge);
  border-left: 4px solid var(--area-line);
  background: var(--area-bg);
  color: var(--area-text);
  padding: 4px 6px;
  /* clip statt hidden: schneidet ab, erzeugt aber keinen eigenen
     Scroll-Bereich - erst dadurch kann der Titel unten sticky bleiben */
  overflow: clip;
  text-align: left;
  font: inherit;
  cursor: grab;
  transition: box-shadow .15s, filter .15s;
}
.block:hover { box-shadow: var(--shadow-1); filter: brightness(0.985); z-index: 9; }
html[data-theme="dark"] .block:hover { filter: brightness(1.12); }
.block.is-dragging { opacity: .75; box-shadow: var(--shadow-2); z-index: 30; cursor: grabbing; }
.block__title {
  font-size: 12.5px; font-weight: 600; line-height: 1.25;
  /* Nur an Wortgrenzen umbrechen. „Vorlesu ng Statisti k" war unlesbar -
     lieber ein zu langes Wort abschneiden als es mittendrin zerhacken.
     Auf iOS und Safari trennt hyphens zusaetzlich sauber nach Silben. */
  overflow-wrap: normal; word-break: normal; hyphens: auto;
  /* Laeuft ein langer Block oben aus dem Bild, bleibt die Beschriftung
     stehen statt unsichtbar zu werden - unterhalb der Tagesleiste,
     sonst verschwindet sie dahinter */
  position: sticky; top: 58px;
}
.block__time { font-size: 11px; opacity: .78; font-variant-numeric: tabular-nums; }
.block.is-short { padding: 1px 6px; display: flex; align-items: center; gap: 6px; }
.block.is-short .block__time { display: none; }
.block.is-done { opacity: .55; }
.block.is-done .block__title { text-decoration: line-through; text-decoration-thickness: 1px; }
/* War ein reines ::before ("✓", nicht antippbar) — jetzt eine echte Checkbox
   an derselben Stelle, gleiche Grösse, damit sich am Layout nichts ändert.
   Ungehakt bleibt sie unsichtbar wie vorher der leere Zustand. */
.block__done {
  appearance: none; position: absolute; right: 5px; bottom: 3px;
  width: 13px; height: 12px; margin: 0; padding: 0; z-index: 4;
  border: none; background: none; cursor: pointer;
}
.block__done::after {
  content: "✓"; position: absolute; inset: 0; font-size: 11px; font-weight: 700;
  line-height: 1; color: var(--area-text); opacity: 0;
}
.block__done:checked::after { opacity: 1; }
@media (pointer: coarse) {
  .block__done::before { content: ""; position: absolute; inset: -9px; }
}
/* Tagesschwerpunkt: kein Emoji, keine breitere Kante (verschlimmert den
   side-tab-Befund nur) - stattdessen ein gezeichneter Punkt oben rechts
   plus fetter Titel. ::after ist frei, .is-done belegt bereits ::before. */
.block.is-frog::after {
  content: ""; position: absolute; top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--area-text);
}
.block.is-frog .block__title { font-weight: 700; }
.block__resize {
  position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
  cursor: ns-resize; touch-action: none;
}
.block__ghost {
  position: absolute; left: 3px; right: 3px; z-index: 12;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--area-line);
  background: var(--area-bg);
  opacity: .8; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 600; color: var(--area-text);
  font-variant-numeric: tabular-nums;
}
.daycol.is-droptarget { background: var(--surface-3); }
.gridwrap.wisch-links  .grid { animation: wischL .2s ease-out; }
.gridwrap.wisch-rechts .grid { animation: wischR .2s ease-out; }
@keyframes wischL { from { transform: translateX(26px); opacity: .45 } }
@keyframes wischR { from { transform: translateX(-26px); opacity: .45 } }
.block__ghost.is-holding {
  opacity: 0; animation: hold var(--holdms, 380ms) ease-out forwards;
}
@keyframes hold {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: .85; transform: scale(1); }
}

/* Nachtruhe — dezent hinterlegt, blockiert aber nichts */
.rest {
  position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
  background: var(--surface-3);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0.5 0.02 var(--h-ink) / 0.055) 5px 10px);
}
html[data-theme="dark"] .rest {
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0 0 0 / 0.16) 5px 10px);
}

/* ============================================================ Mobile day switcher */
.dayswitch {
  display: none; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0;
  padding: 4px 2px; border-bottom: 1px solid var(--border);
  background: var(--surface); overflow: hidden;
}
.dayswitch__btn {
  min-width: 0; min-height: 46px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; padding: 3px 1px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.dayswitch__btn span {
  font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-muted); line-height: 1.1;
}
.dayswitch__btn b { font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.dayswitch__btn[aria-pressed="true"] { background: var(--surface-3); border-color: var(--border-strong); }
/* Wie voll ist dieser Tag?

   Die Eintagesansicht ist am Telefon richtig — sieben Spalten auf 390 Pixeln
   kann niemand lesen. Sie kostet aber die Woche: „an welchem Tag ist noch
   Luft" war nur noch durch Durchblättern zu beantworten. Der Punkt unter dem
   Datum sagte lediglich „da ist irgendwas".

   Jetzt ist er ein Balken. Voll heißt: an dieser Marke reißen Pläne — dieselben
   65 %, die auch die Ampel bei den Wochenzielen benutzt. Damit steht die
   Wochenverteilung wieder im Bild, ohne den Tag zu verlassen. */
.dayswitch__btn i {
  width: 20px; height: 3px; border-radius: 2px; flex: none;
  background: linear-gradient(to right,
    var(--last-farbe, var(--text-faint)) 0 var(--last, 0%),
    var(--surface-3) var(--last, 0%) 100%);
}
.dayswitch__btn.is-voll i { --last-farbe: var(--warn); }
.dayswitch__btn[aria-pressed="true"] i { --last-farbe: var(--ink); }
.dayswitch__btn[aria-pressed="true"].is-voll i { --last-farbe: var(--warn); }

/* ============================================================ Sheet / Modal */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: oklch(0.2 0.02 var(--h-ink) / 0.45);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: var(--s-4);
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0 } }
.sheet {
  width: 100%; max-width: 460px; max-height: 88dvh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-3);
  padding: var(--s-5);
  animation: pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98) } }
.sheet--wide { max-width: 560px; }
.sheet__title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 var(--s-4); }
.sheet__row { margin-bottom: var(--s-4); }
.sheet__cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
/* Der Fussbereich klebt am unteren Rand des Dialogs. Ohne das rutscht der
   Bestaetigen-Knopf bei langen Inhalten aus dem Bild - auf einem kleinen
   iPhone war der Willkommens-Dialog dadurch schlicht nicht bedienbar. */
.sheet__foot {
  display: flex; gap: var(--s-2); align-items: center;
  margin-top: var(--s-5);
  position: sticky; bottom: calc(var(--s-5) * -1);
  margin-bottom: calc(var(--s-5) * -1);
  padding: var(--s-3) 0 var(--s-5);
  padding-bottom: calc(var(--s-5) + env(safe-area-inset-bottom));
  background: var(--surface);
  box-shadow: 0 -10px 14px -10px oklch(0.2 0.02 var(--h-ink) / 0.18);
}
html[data-theme="dark"] .sheet__foot { box-shadow: 0 -10px 14px -10px oklch(0 0 0 / 0.55); }
.sheet__foot .spacer { flex: 1; }
.chipset { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.switch { display: flex; align-items: center; gap: var(--s-2); font-size: 14px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--ink); }

/* ============================================================ Areas editor */
.arealist { display: flex; flex-direction: column; gap: var(--s-2); }
.arearow { display: flex; align-items: center; gap: var(--s-2); }
.arearow__swatch {
  width: 30px; height: 30px; flex: none; border-radius: 8px;
  background: var(--area-bg-2); border: 1px solid var(--area-line);
  cursor: pointer;
}
.arearow .field { min-height: 36px; }

/* ============================================================ Toast + banner */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--s-5) + env(safe-area-inset-bottom)); z-index: 90;
  display: flex; flex-direction: column; gap: var(--s-2); align-items: center;
  pointer-events: none; width: min(92vw, 420px);
}
.toast {
  background: var(--ink); color: var(--on-ink);
  padding: 10px var(--s-4); border-radius: 999px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-2); animation: pop .2s cubic-bezier(.2,.9,.3,1);
  display: flex; align-items: center; gap: var(--s-3); max-width: 100%;
}
.toast__act {
  pointer-events: auto; flex: none;
  background: transparent; border: none; padding: 2px 2px; margin: -2px 0;
  color: inherit; font-size: 13.5px; font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
}
.toast__act:hover { opacity: .75; }
.toasts .toast { pointer-events: none; }
.toasts .toast:has(.toast__act) { pointer-events: auto; }
.banner {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: 10px var(--s-4); font-size: 13px;
  background: oklch(0.66 0.15 75 / 0.16);
  border-bottom: 1px solid oklch(0.66 0.15 75 / 0.45);
  color: var(--text);
}
.banner b { font-weight: 700; }

/* ============================================================ Responsive */
/* ============================================================
   Umschalter am Handy

   Ein Telefon ist kein schmaler Schreibtisch. Statt Raster und Karten
   übereinander zu stapeln — wobei der Kalender, die Hauptsache, auf ein
   knappes Drittel schrumpft — bekommt hier jede Ansicht den ganzen
   Bildschirm, umschaltbar unten in Daumenreichweite.
   ============================================================ */
.tabbar { display: none; }
.fab { display: none; }
.sugbar { display: none; }

@media (max-width: 780px), (max-height: 500px) and (max-width: 1000px) {
  /* ---- Unterer Bedienbereich --------------------------------------------
     Tabbar, FAB, Toasts und Vorschlagsleiste konkurrieren hier unten um
     denselben Platz. Statt jede Fläche mit einer eigenen, von Hand
     geschätzten Zahl zu positionieren (das führte zuletzt zu einem
     Notbehelf: ein Toast-Wert, der eigentlich die "Heute"-Karte freihalten
     sollte, nicht die Tabbar — bei einem leeren Tag schwebte er dadurch
     mitten im Bild), zieht jede schwebende Fläche ihren bottom-Wert aus
     zwei Variablen:
       --fussleiste  Höhe der Tabbar inkl. unterer Sicherheitszone.
       --fuss-oben   dasselbe, zusätzlich die Vorschlagsleiste, wenn sie
                     steht (body[data-sugbar="1"], gesetzt von renderSugBar). */
  body {
    --fussleiste: calc(62px + env(safe-area-inset-bottom));
    --fuss-oben: var(--fussleiste);
  }
  body[data-sugbar="1"] {
    /* 61px = Höhe der Vorschlagsleiste: 44px hohe Knöpfe + 16px senkrechtes
       Padding (var(--s-2) oben und unten) + 1px Haarlinie. Muss mit den
       Werten unten bei .sugbar übereinstimmen, sonst schiebt sich der FAB
       wieder unter die Leiste. */
    --fuss-oben: calc(var(--fussleiste) + 61px);
  }

  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    flex: none; gap: 2px; padding: 2px 6px 0;
    padding-bottom: max(4px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--surface);
  }
  .tabbar button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-height: 50px; padding: 4px 2px 5px;
    border: none; background: transparent; border-radius: var(--radius-sm);
    font-size: 11px; font-weight: 600; color: var(--text-faint);
    -webkit-tap-highlight-color: transparent;
  }
  .tabbar svg {
    width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .tabbar button[aria-current="true"] { color: var(--text); }
  .tabbar button:active { background: var(--surface-2); }

  /* Schwebender Knopf — „ins Raster tippen" ist am Handy nicht selbsterklärend */
  body[data-mview="plan"] .fab {
    display: grid; place-items: center; position: fixed;
    right: 16px; z-index: 40;
    bottom: var(--fuss-oben);
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--ink); border: none; box-shadow: var(--shadow-2);
  }
  .fab svg {
    width: 26px; height: 26px; fill: none; stroke: var(--on-ink);
    stroke-width: 2.2; stroke-linecap: round;
  }
  .fab:active { transform: scale(0.94); }

  /* Vorschlagsleiste: keine Karte — kein Schatten, kein Radius, kein
     farbiger Rand. Eine Haarlinie nach oben genügt, die Fläche bleibt
     ruhig. "Übernehmen" ist der einzige betonte Knopf, wie überall sonst
     auch — der Akzent gehört der Primäraktion, nicht der Dekoration. */
  body[data-sugbar="1"] .sugbar {
    display: flex; align-items: center; gap: var(--s-3);
    position: fixed; left: 0; right: 0; z-index: 41;
    bottom: var(--fussleiste); min-height: 61px;
    padding: var(--s-2) var(--s-4);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .sugbar__text { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .sugbar__accept { min-height: 44px; padding: 0 var(--s-4); }
  .sugbar__close {
    flex: none; min-width: 44px; min-height: 44px;
    color: var(--text-faint); font-size: 20px; line-height: 1;
  }

  /* ---- Eine Ansicht zur Zeit -------------------------------------------
     Der Plan und die Karten teilen sich nicht den Bildschirm, sie ersetzen
     sich. Entscheidend ist, dass die jeweils andere Seite **ganz** weg ist:
     ein leeres `.planwrap` liess vorher das Band stehen und schnitt die
     Karten mitten im Text ab. */
  .main { flex-direction: column; }
  .panel {
    width: 100%; flex: 1; min-height: 0;
    border-right: 0; max-height: none;
    padding: var(--s-3) var(--s-3) 0;
    gap: var(--s-3);
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  }
  body[data-mview="plan"] .panel { display: none; }
  body:not([data-mview="plan"]) .planwrap { display: none; }
  body[data-mview="ziele"]    .card:not([data-card="ziele"]):not(.ritual),
  body[data-mview="aufgaben"] .card:not([data-card="aufgaben"]),
  body[data-mview="heute"]    .card:not([data-card="heute"]) { display: none; }

  /* Eine Karte, die den ganzen Bildschirm hat, braucht keinen Rahmen mehr —
     der Rahmen im Rahmen kostet nur Platz und Aufmerksamkeit. */
  .panel > .card {
    border-width: 0; border-radius: 0; background: transparent;
    padding: 0 0 var(--s-4);
  }
  .card__head { margin-bottom: var(--s-3); }

  /* Die Aufgabenliste darf den Platz nutzen, damit das Eingabefeld oben
     stehen bleibt statt mit wegzuscrollen. */
  body[data-mview="aufgaben"] .panel { overflow: hidden; }
  body[data-mview="aufgaben"] .card[data-card="aufgaben"] {
    flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: 0;
  }
  body[data-mview="aufgaben"] .tasks {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: calc(var(--s-4) + env(safe-area-inset-bottom));
  }

  /* Eine Regel statt zweier gleich starker: die spätere gewann, und der
     Tagwechsler stand über den Wochenzielen.
     „Heute" hängt genauso an selectedDayIdx wie „Plan" — ohne diese Zeile
     liess sich „Diesen Tag freihalten" nur an einem Tag bedienen, den man
     dort gar nicht auswählen konnte. */
  body[data-mview="plan"][data-tage="1"] .dayswitch,
  body[data-mview="heute"][data-tage="1"] .dayswitch { display: grid; }
  .grid { --gutter: 44px; --colmin: 0; --hourh: 56px; }
  .block__title { top: 0; }
  .brand { display: none; }
  .weeknav { margin-right: auto; min-width: 0; }
  /* Datum und Woche in eine Zeile: die zweite Zeile kostete zwölf Pixel
     Rasterhöhe und stand doppelt im Tagwechsler darunter. */
  .weeknav__label {
    min-width: 0; font-size: 13px; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .weeknav__label small { display: inline; font-size: 12px; }
  .weeknav__label small::before { content: " · "; }
  /* Unter 360 Pixeln bricht das Datum mitten durch. Die Tage stehen
     ohnehin im Wechsler darunter — dann lieber nur die Kalenderwoche. */
  @media (max-width: 360px) { .weeknav__label small { display: none; } }
  .topbar { padding: 4px var(--s-2); gap: 0; }
  .topbar { padding-top: max(4px, env(safe-area-inset-top)); }
  .sheet { max-width: 100%; border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin-top: auto; }
  .scrim { padding: 0; align-items: flex-end; }
  .card { padding: var(--s-3); }

  /* Das Band nimmt hoechstens ein Viertel der Hoehe. Vorher durfte es ein
     Drittel — auf einem 568er Display blieben dem Tag viereinhalb Stunden. */
  .loose { max-height: 25dvh; padding: 4px 0; }
  .loose__hint { font-size: 10.5px; line-height: 1.35; }

  /* Meldungen ueber die Leiste heben, sonst verdecken sie die Umschalter.
     Bezieht sich jetzt auf --fuss-oben (Tabbar, plus Vorschlagsleiste, wenn
     sie steht) statt auf einen von Hand geschaetzten Wert — der raetselte
     bisher an der Hoehe der „Heute"-Karte herum und liess den Toast bei
     einem leeren Tag mitten im Bild schweben. Dazu die Fab-Hoehe (54px)
     und ein kleiner Abstand, damit er auch den Knopf klar ueberragt. */
  .toasts { bottom: calc(var(--fuss-oben) + 54px + var(--s-2)); width: min(94vw, 420px); }

  /* ---- Dialogfuss ------------------------------------------------------
     Drei Knoepfe nebeneinander passen auf 320 px nicht. Loeschen rutscht in
     eine eigene Zeile darunter — nebenbei die richtige Rangfolge. */
  .sheet__foot { flex-wrap: wrap; }
  .sheet__foot .spacer { display: none; }
  .sheet__foot > .btn { flex: 1 1 40%; }
  .sheet__foot > .btn--danger { order: 5; flex: 0 0 auto; }
}

/* Querformat am Handy: kaum Höhe, also flacher bauen */
@media (max-height: 500px) and (max-width: 1000px) {
  .tabbar { padding-top: 0; }
  .tabbar button { min-height: 44px; font-size: 0; gap: 0; padding: 4px; }
  .tabbar svg { width: 20px; height: 20px; }
  .grid { --hourh: 46px; }
  .dayswitch { padding: 2px; }
  .dayswitch__btn { min-height: 40px; padding: 2px; }
  .dayswitch__btn b { font-size: 14px; }
  /* Bei 390 Pixeln Höhe ist jeder Erklärsatz eine Stunde Plan */
  .loose { max-height: 30dvh; }
  .loose__hint { display: none; }
  .dayhead { padding: 2px 2px 3px; }
  .dayhead__name { font-size: 9.5px; }
  .dayhead__num { font-size: 15px; width: 24px; height: 24px; line-height: 24px; margin-top: 0; }
  .dayhead__frei { font-size: 8.5px; }
  .dayhead__energy { display: none; }
  /* Sieben Spalten auf 844 Pixeln heisst rund hundert Pixel je Tag. Zwei
     fingergerechte Haken passen da nicht neben einen Titel, ohne ihn zu
     verdecken — und ein Vorschlag, den man nicht lesen kann, ist keiner.
     Das Querformat ist die Übersicht: annehmen/verwerfen geht hier über
     die Vorschlagsleiste (.sugbar, bleibt auch im Querformat sichtbar)
     oder in "Ziele" über „Alle übernehmen". */
  body[data-tage="7"] .block__sug { display: none; }
  .topbar { padding: 2px var(--s-2); }
  .weeknav__label { font-size: 12.5px; }
}

/* ============================================================
   Tablet — alle sieben Tage müssen sichtbar sein.
   Eine Wochenansicht, die das Wochenende hinter horizontalem
   Scrollen versteckt, ist keine Wochenansicht.
   ============================================================ */
@media (min-width: 781px) and (max-width: 1100px) and (min-height: 501px) {
  .panel { width: 250px; padding: var(--s-3); gap: var(--s-4); }
  .grid { --colmin: 0; --gutter: 44px; }
  .dayhead { padding: 6px 2px 8px; }
  .dayhead__num { font-size: 17px; width: 28px; height: 28px; line-height: 28px; }
  .dayhead__name { font-size: 10.5px; }
  .block { left: 2px; right: 2px; }
  .block__title { font-size: 11.5px; }
  .block__time { font-size: 10px; }
  .card { padding: var(--s-3); }
}

/* ============================================================
   Finger statt Maus — überall dort, wo mit dem Finger bedient wird,
   müssen die Ziele mindestens 44 px hoch sein.
   ============================================================ */
/* ============================================================
   Finger statt Zeiger

   Alles, was man antippt, ist mindestens 44 x 44 Punkte gross. Das ist
   keine Geschmacksfrage: darunter steigt die Fehlerrate messbar, und ein
   Fehltipp in einem Planer heisst, dass etwas verschoben oder gelöscht
   wird, das man nicht anfassen wollte.

   Wo es optisch klein bleiben muss (Häkchen, Farbfeld), bleibt das Bild
   klein und die Trefferfläche wächst über ein unsichtbares ::before.
   ============================================================ */
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn--sm { min-height: 44px; padding: 0 var(--s-3); }
  .btn--icon { min-width: 44px; min-height: 44px; }
  .chip { min-height: 44px; padding: 0 var(--s-3); }
  .field { min-height: 46px; }
  .arearow .field { min-height: 44px; }
  .arearow__swatch { width: 40px; height: 40px; position: relative; }
  .arearow__swatch::before { content: ""; position: absolute; inset: -2px; }
  .syncbadge { min-height: 44px; min-width: 44px; padding: 0 12px; }
  .setback { min-height: 44px; }
  .task { padding: var(--s-3) var(--s-2); }
  .task__check { width: 24px; height: 24px; position: relative; }
  .task__check::before { content: ""; position: absolute; inset: -11px; border-radius: 8px; }
  .agenda__check::before { content: ""; position: absolute; inset: -14px; border-radius: 8px; }
  .task__del, .task__more { min-width: 44px; min-height: 44px; }
  /* Auf einem Touchgerät gibt es kein Hover — ein Knopf, der erst beim
     Zeigen erscheint, existiert dort nicht. */
  .task__del { opacity: 1; }
  .task__area { min-height: 34px; padding: 4px 8px; }
  .task__frog, .task__plan { min-height: 40px; min-width: 40px; padding: 4px 8px; }
  /* Ein Schalter ist eine ganze Zeile — die Box bleibt klein, die
     Trefferflaeche wird fingergerecht. */
  .switch { min-height: 44px; }
  .switch input { width: 22px; height: 22px; }
  .hakenrow input { width: 22px; height: 22px; }
  .energy__opt { min-height: 68px; }
  .dayswitch__btn { min-height: 46px; }
  /* Annehmen und Verwerfen sind der Kern der Schleife — die dürfen nicht
     die kleinsten Knöpfe im Bild sein. */
  .block__sug { gap: 6px; right: 4px; top: 4px; }
  .block__sug button { width: 34px; height: 34px; font-size: 14px; position: relative; }
  .block__sug button::before { content: ""; position: absolute; inset: -5px; }
  .block__resize { height: 14px; }
  .goalrow__more { min-width: 44px; min-height: 44px; }
  .loosechip { min-height: 44px; }
  .toast__act { padding: 12px 6px; margin: -12px 0; }
  #inSwap { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="banner"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand__name">Wochenplaner</span>
      <span class="brand__who" id="whoLabel"></span>
    </div>

    <div class="weeknav">
      <button class="btn btn--icon btn--ghost" id="prevWeek" aria-label="Woche zurück">‹</button>
      <div class="weeknav__label" id="weekLabel"></div>
      <button class="btn btn--icon btn--ghost" id="nextWeek" aria-label="Woche vor">›</button>
    </div>

    <button class="syncbadge" id="syncBadge" hidden></button>
    <button class="btn btn--sm" id="todayBtn">Heute</button>
    <button class="btn btn--icon btn--ghost" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
  </header>

  <nav class="dayswitch" id="daySwitch" aria-label="Tag wählen"></nav>

  <div class="main">

    <aside class="panel">

      <!-- Tagesform -->
      <section class="card" data-card="heute">
        <div class="agenda" id="agenda"></div>
        <div class="card__head">
          <h2 class="card__title">Tagesform</h2>
          <span id="energyDay" style="font-size:12px;color:var(--text-faint)"></span>
        </div>
        <div class="energy" role="group" aria-label="Wie viel Energie hast du heute?">
          <button class="energy__opt" data-lvl="low" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Wenig
          </button>
          <button class="energy__opt" data-lvl="mid" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Normal
          </button>
          <button class="energy__opt" data-lvl="high" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Viel
          </button>
        </div>
        <div class="hint" id="energyHint"></div>
        <div id="energyAct"></div>
        <label class="switch freischalter"><input type="checkbox" id="dayFrei"> <span id="dayFreiLab">Diesen Tag freihalten</span></label>
      </section>

      <!-- Wochenstart -->
      <section class="card ritual" data-card="ziele" id="ritualCard" hidden></section>

      <!-- Wochenziele -->
      <section class="card" data-card="ziele">
        <div class="card__head">
          <h2 class="card__title">Wochenziele</h2>
          <button class="btn btn--sm btn--ghost" id="goalsEdit">Ziele</button>
        </div>
        <div class="goals" id="goalsList"></div>
        <div class="goals__foot" id="goalsFoot"></div>
      </section>

      <!-- Aufgaben -->
      <section class="card" data-card="aufgaben">
        <div class="card__head">
          <h2 class="card__title">Aufgaben</h2>
          <button class="btn btn--sm btn--ghost" id="clearDone">Erledigte weg</button>
        </div>
        <form class="taskadd" id="taskForm">
          <input class="field" id="taskInput" placeholder="Was steht an?" aria-label="Neue Aufgabe" autocomplete="off">
          <button class="btn btn--primary" type="submit" aria-label="Aufgabe hinzufügen">+</button>
        </form>
        <div class="tasks" id="taskList"></div>
      </section>

    </aside>

    <div class="planwrap">
      <div class="gridwrap" id="gridWrap">

const Store = (() => {
  const BASE = "wochenplaner";

  // Pro Konto ein eigener Speicherplatz — sonst überschreiben sich zwei
  // Leute, die denselben Rechner benutzen, gegenseitig den Plan.
  let scope = "local";
  let available = false;
  let full = false;              // Browser-Speicher voll — einmal melden, nicht dauernd

        if (!full) {

function mondayOf(date) {

function addDays(date, n) {

function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dn = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dn + 3);
  const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const fdn = (first.getUTCDay() + 6) % 7;
  first.setUTCDate(first.getUTCDate() - fdn + 3);
  return 1 + Math.round((d - first) / 604800000);
}

/* ============================================================ Zustand */
const DEFAULT_AREAS = [
  { id: "a1", name: "Arbeit",           hue: 248 },
  { id: "a2", name: "Uni & Lernen",     hue: 295 },
  { id: "a3", name: "Sport",            hue: 152 },
  { id: "a4", name: "Hobby",            hue: 88  },
  { id: "a5", name: "Freizeit & Pausen",hue: 196 },
  { id: "a6", name: "Menschen",         hue: 22  },
  { id: "a7", name: "Alltag",           hue: 330 }
];

/* ============================================================
   Art einer Tätigkeit — die eine Eigenschaft, aus der sich fast alles ableitet.

   Vorher musste man je Bereich vier Zahlen raten (kürzester Block, längster
   Block, frühestens, spätestens) und die Wirkung war unsichtbar. Die Art ist
   eine Entscheidung, die man versteht: „Sport ist Körper". Daraus ergeben sich
   Blocklänge, Pause danach und die bevorzugte Tageszeit.

   Die Pausenlänge folgt der geistigen Last: nach Kopfarbeit reichen fünf
   Minuten nicht, nach einem Spaziergang schon.
   ============================================================ */
const ARTEN = {
  kopf: {
    label: "Kopf", kurz: "Kopf",
    hint: "Arbeit, Lernen, alles was Konzentration kostet",
    min: 60, max: 120, pause: 20,
    // Früher am Tag ist besser, Vormittag bekommt einen Bonus
    zeit: (start, tagAnfang) => -(Math.max(0, start - tagAnfang) / 60 * 2.5)
                              + (start >= 480 && start <= 780 ? 10 : 0)
  },
  koerper: {
    label: "Körper", kurz: "Körper",
    hint: "Sport, Bewegung, alles Körperliche",
    min: 45, max: 90, pause: 15,
    zeit: (start) => -Math.abs(start - 16 * 60) / 60 * 1.2
  },
  erholung: {
    label: "Erholung", kurz: "Erholung",
    hint: "Freizeit, Hobby, Zeit mit Menschen, Pausen für dich",
    min: 60, max: 180, pause: 10,
    // Erholung gehört in den Feierabend, nicht in den Vormittag —
    // und auch nicht in die letzte Stunde vor dem Schlafen.
    zeit: (start) => -Math.abs(start - 18.5 * 60) / 60 * 3
  },
  orga: {
    label: "Alltag", kurz: "Alltag",
    hint: "Haushalt, Erledigungen, Organisation",
    min: 30, max: 90, pause: 10,
    zeit: (start, tagAnfang) => -(Math.max(0, start - tagAnfang) / 60 * 1)
  }
};
const ART_REIHE = ["kopf", "koerper", "erholung", "orga"];

/* Art eines Bereichs, immer mit gültigem Rückfall. */
function artOf(area) {
  return ARTEN[(area && area.plan && area.plan.art)] || ARTEN.orga;
}

/* Erste Zuordnung für bestehende und neue Bereiche. Die sieben Standard-
   bereiche kennen wir; bei eigenen Namen raten wir über Stichworte und
   landen sonst bei „Alltag", der neutralen Art. */
const ART_STANDARD = { a1: "kopf", a2: "kopf", a3: "koerper",
                       a4: "erholung", a5: "erholung", a6: "erholung", a7: "orga" };
function artRaten(area) {
  if (ART_STANDARD[area.id]) return ART_STANDARD[area.id];
  const n = String(area.name || "").toLowerCase();
  if (/arbeit|job|büro|buero|uni|lern|studi|schule|projekt|fokus|deep/.test(n)) return "kopf";
  if (/sport|lauf|gym|fitness|yoga|schwimm|rad|training|bewegung/.test(n)) return "koerper";
  if (/freizeit|pause|hobby|menschen|freund|familie|serie|entspann|ruhe|spiel|musik|lesen/.test(n)) return "erholung";
  return "orga";
}

/* Plan-Einstellungen eines Bereichs — steuern Wochenziel und Vorschlag.
   goal 0 = kein Wochenziel. from/to null = ganzer sichtbarer Tag. */
/* ============================================================
   Grob statt genau

   Freizeit mit Uhrzeit ist keine Freizeit mehr. Tonietto & Malkoc haben das
   über dreizehn Studien gezeigt: eine verabredete Tätigkeit fühlt sich
   verpflichtender an und wird weniger genossen als dieselbe spontan — und
   im selben Papier steht die Lösung, „roughly scheduling without prespecified
   times" hebt den Effekt vollständig auf.

   Deshalb kennt ein Block hier zwei Genauigkeiten. Ein exakter Block liegt
   im Raster wie bisher. Ein grober hängt nur an einem Tagesabschnitt: „Samstag
   abends, ungefähr zwei Stunden". Er kann mit nichts kollidieren, muss nie
   umgeplant werden, und der Abend bleibt reserviert, ohne zerschnitten zu sein.
   ============================================================ */
const ABSCHNITTE = [
  { id: "vm", name: "vormittags", kurz: "Vorm.",  von: 0,        bis: 12 * 60 },
  { id: "nm", name: "nachmittags", kurz: "Nachm.", von: 12 * 60,  bis: 17 * 60 },
  { id: "ab", name: "abends",     kurz: "Abends", von: 17 * 60,  bis: 24 * 60 }
];
const abschnittVon = id => ABSCHNITTE.find(a => a.id === id) || ABSCHNITTE[2];

/* In welchen Abschnitt fällt eine Uhrzeit? */
function abschnittFuer(minute) {
  return (ABSCHNITTE.find(a => minute < a.bis) || ABSCHNITTE[2]).id;
}

/* Wie lange dauert ein Block — grobe zählen ihre Dauer, exakte ihre Spanne. */
function dauerVon(b) {
  return b.grob ? (b.dauer || 0) : (b.end - b.start);
}

function defaultPlan() {
  return {
    goal: 0, days: [0, 1, 2, 3, 4, 5, 6], from: null, to: null, min: 45, max: 120,
    // muss: Standard ist Pflicht. Wer nichts einstellt, soll nie erleben,
    // dass der Planer ihm etwas zum Streichen vorschlaegt, das ihm wichtig war.
    must: true,
    // pad: Wegzeit vor und nach einem Block dieses Bereichs, in Minuten.
    // Ab v1.7 nur noch Altlast — die Wegzeit hängt jetzt am Ortswechsel.
    pad: 0,
    // art: steuert Blocklänge, Pause danach und bevorzugte Tageszeit
    art: "orga",
    // ortId: Standardort für diesen Bereich, leer erlaubt
    ortId: null,
    // grob: plant dieser Bereich ohne feste Uhrzeit? Für Erholung ist das
    // der bessere Standard — siehe Kommentar oben.
    grob: false
  };
}

/* Schlafenszeit samt Ruhezeit davor und danach.
   „wind" ist die Zeit zum Runterkommen und Fertigmachen — sie gehört
   genauso zur Nacht wie der Schlaf selbst und wird nicht verplant.
   Standardmäßig aus: der Planer setzt niemandem einen Rhythmus vor. */
function defaultSleep() {
  return { on: false, from: 22 * 60 + 30, to: 6 * 60 + 30, wind: 30 };
}

function freshState() {
  return {
    version: 8,
    profile: { id: uid(), name: "" },
    settings: { dayStart: 7, dayEnd: 22, theme: "auto", sleep: defaultSleep() },
    settingsAt: 0,
    areas: DEFAULT_AREAS.map(a => ({ ...a, plan: defaultPlan(), })).map(a =>
      ({ ...a, plan: { ...a.plan, art: ART_STANDARD[a.id] || "orga" } })),
    orte: [],        // { id, name } — Wegzeiten hängen an Ortspaaren, nicht an Bereichen
    wege: {},        // { "id1>id2": minuten }
    blocks: [],
    tasks: [],
    days: {},
    tombs: {},        // gelöschte IDs mit Zeitpunkt — sonst kommen sie beim Sync zurück
    erledigt: {},     // "blockId|datum" -> { on, at } — abgehakt, pro Tag statt pro Serie
    rituale: {},      // "montag-datum" -> Zeitpunkt des Wochenstarts
    backupAt: 0,      // wann zuletzt eine Sicherung gespeichert wurde
    nagAt: 0          // wann zuletzt an eine Sicherung erinnert wurde
  };
}

let state = Store.load() || freshState();
migrate(state);

function migrate(s) {
  if (!s.profile) s.profile = { id: uid(), name: "" };
  if (!s.settings) s.settings = { dayStart: 7, dayEnd: 22, theme: "auto", sleep: defaultSleep() };
  if (!Array.isArray(s.areas) || !s.areas.length) s.areas = DEFAULT_AREAS.map(a => ({ ...a, plan: defaultPlan() }));
  if (!Array.isArray(s.blocks)) s.blocks = [];
  if (!Array.isArray(s.tasks)) s.tasks = [];
  if (!s.days) s.days = {};
  // v2: Wochenziele + bevorzugte Zeitfenster pro Bereich
  s.areas.forEach(a => {
    const d = defaultPlan();
    const p = (a.plan && typeof a.plan === "object") ? a.plan : {};
    a.plan = {
      goal: Math.max(0, +p.goal || 0),
      days: Array.isArray(p.days) && p.days.length ? p.days.filter(n => n >= 0 && n <= 6) : d.days,
      from: (p.from === null || p.from === undefined) ? null : +p.from,
      to:   (p.to   === null || p.to   === undefined) ? null : +p.to,
      min:  clamp(+p.min || d.min, 15, 240),
      max:  clamp(+p.max || d.max, 15, 480),
      must: p.must === undefined ? true : !!p.must,
      pad:  clamp(+p.pad || 0, 0, 180),
      art:  ARTEN[p.art] ? p.art : null,
      ortId: p.ortId || null,
      grob: p.grob === undefined ? undefined : !!p.grob
    };
    if (a.plan.max < a.plan.min) a.plan.max = a.plan.min;
    if (!a.plan.art) a.plan.art = artRaten(a);
  });
  // v4: Schlafenszeit mit Ruhezeit
  {
    const d = defaultSleep();
    const sl = (s.settings.sleep && typeof s.settings.sleep === "object") ? s.settings.sleep : {};
    s.settings.sleep = {
      on:   !!sl.on,
      from: clamp(typeof sl.from === "number" ? sl.from : d.from, 0, 1439),
      to:   clamp(typeof sl.to   === "number" ? sl.to   : d.to,   0, 1439),
      wind: clamp(typeof sl.wind === "number" ? sl.wind : d.wind, 0, 180)
    };
  }
  // v3: Vorbereitung für den Abgleich zwischen Geräten
  if (!s.tombs || typeof s.tombs !== "object") s.tombs = {};
  if (typeof s.settingsAt !== "number") s.settingsAt = 0;
  if (typeof s.backupAt !== "number") s.backupAt = 0;

  // Tagfenster absichern. Geclampt wurde bisher nur im Einstellungsdialog —
  // ein gesyncter oder importierter Stand mit dayEnd < dayStart zerlegt das Raster.
  s.settings.dayStart = clamp(+s.settings.dayStart || 7, 0, 22);
  s.settings.dayEnd   = clamp(+s.settings.dayEnd   || 22, s.settings.dayStart + 1, 24);

  // v6: Orte und Wegzeiten.
  //
  // Bisher hing die Wegzeit am Bereich: „Arbeit +60 min". Das legte eine Stunde
  // Anfahrt auch zwischen zwei Arbeitsblöcke am selben Schreibtisch und null
  // Minuten zwischen Arbeit und Uni. Eine Fahrt entsteht aber nicht durch die
  // Tätigkeit, sondern durch den Ortswechsel.
  //
  // Aus jedem Bereich mit Wegzeit wird ein Ort, dazu ein Heimatort. Wer vorher
  // „Arbeit +60" hatte, bekommt „Zuhause ↔ Arbeit = 60 min" — dieselbe Wirkung,
  // nur an der richtigen Stelle. Blöcke ohne eigenen Ort gelten als zuhause.
  if (!Array.isArray(s.orte)) s.orte = [];
  if (!s.wege || typeof s.wege !== "object") s.wege = {};
  {
    const mitWeg = s.areas.filter(a => a.plan.pad > 0 && !a.plan.ortId);
    if (mitWeg.length && !s.settings.heimOrt) {
      const heim = { id: "o-heim", name: "Zuhause" };
      s.orte.push(heim);
      s.settings.heimOrt = heim.id;
      mitWeg.forEach(a => {
        const o = { id: "o-" + a.id, name: a.name };
        s.orte.push(o);
        a.plan.ortId = o.id;
        s.wege[wegKey(heim.id, o.id)] = a.plan.pad;
      });
    }
    s.areas.forEach(a => { a.plan.pad = 0; });   // Altfeld stillgelegt
    // Schlüssel sind immer sortiert („a>b" mit a < b) — sonst findet weg() nichts
    Object.keys(s.wege).forEach(k => {
      const t = k.split(">");
      if (t.length !== 2) { delete s.wege[k]; return; }
      const richtig = wegKey(t[0], t[1]);
      if (richtig !== k) { s.wege[richtig] = s.wege[k]; delete s.wege[k]; }
    });
    const ortIds = new Set(s.orte.map(o => o.id));
    if (s.settings.heimOrt && !ortIds.has(s.settings.heimOrt)) s.settings.heimOrt = null;
    s.areas.forEach(a => { if (a.plan.ortId && !ortIds.has(a.plan.ortId)) a.plan.ortId = null; });
    s.blocks.forEach(b => { if (b.ortId && !ortIds.has(b.ortId)) delete b.ortId; });
    Object.keys(s.wege).forEach(k => {
      if (!k.split(">").every(id => ortIds.has(id))) delete s.wege[k];
    });
  }

  // Wöchentliche Blöcke gelten ab ihrem Anlegedatum, nicht seit Anbeginn
  s.blocks.forEach(b => {
    if (b.repeat === "weekly" && !b.since) b.since = b.date || "1970-01-01";
  });

  // Verwaiste Verweise reparieren. Wird ein Bereich auf einem Gerät gelöscht,
  // zeigen die Blöcke des anderen ins Leere — areaById fällt still auf den
  // ersten Bereich zurück, und „Laufen" zählt plötzlich auf das Arbeitsziel.
  {
    const ids = new Set(s.areas.map(a => a.id));
    const heimat = () => {
      let rest = s.areas.find(a => a.name === "Sonstiges");
      if (!rest) {
        rest = { id: "arest", name: "Sonstiges", hue: 210, plan: defaultPlan() };
        rest.plan.goal = 0;
        s.areas.push(rest);
        ids.add(rest.id);
      }
      return rest.id;
    };
    [...s.blocks, ...s.tasks].forEach(r => {
      if (r.areaId && !ids.has(r.areaId)) r.areaId = heimat();
    });
  }

  // v7: grobe Planung. Erholung plant ab jetzt ohne feste Uhrzeit —
  // wer es anders will, stellt es pro Bereich um.
  s.areas.forEach(a => {
    if (a.plan.grob === undefined) a.plan.grob = a.plan.art === "erholung";
  });
  s.blocks.forEach(b => {
    if (b.grob) {
      b.teil = ABSCHNITTE.some(x => x.id === b.teil) ? b.teil : "ab";
      b.dauer = clamp(+b.dauer || 60, 15, 720);
    } else {
      delete b.teil; delete b.dauer;
    }
  });
  // v8: Abhaken und Wochenstart
  if (!s.erledigt || typeof s.erledigt !== "object") s.erledigt = {};
  if (!s.rituale || typeof s.rituale !== "object") s.rituale = {};
  // Ein Tag kann auf einem anderen Gerät freigehalten worden sein, nachdem
  // hier schon verteilt wurde. Vorschläge dort gelten dann nicht mehr.
  s.blocks = s.blocks.filter(b => {
    if (!b.sug) return true;
    const m = s.days[b.date];
    return !(m && m.frei);
  });
  s.version = 8;
}

let anchor = new Date();          // irgendein Tag der angezeigten Woche
let selectedDayIdx = (new Date().getDay() + 6) % 7;   // für Mobile
// Wird erst wahr, wenn Sync.boot() (ganz unten) durch ist — vorher zeigt
// die Agenda eine Schraffur statt eines Standes, der gleich stillschweigend
// gegen den abgeglichenen ausgetauscht werden könnte.
let syncSettled = false;
/* Zwei Fragen, die bisher eine waren:

   MOBILE_Q — bekommt der Bildschirm die Tableiste unten und eine Ansicht
   zur Zeit? Das hängt daran, ob Karten und Raster nebeneinander passen.

   EINTAG_Q — zeigt das Raster einen Tag oder die ganze Woche? Das hängt
   allein an der Breite. Wer das Telefon dreht, hat plötzlich 844 Pixel —
   da passt die Woche, und der Tagwechsler wird überflüssig. Vorher war
   beides dieselbe Bedingung, und im Querformat blieb ein einzelner Tag
   über die volle Breite gezogen. */
const MOBILE_Q = "(max-width: 780px), (max-height: 500px) and (max-width: 1000px)";
const EINTAG_Q = "(max-width: 640px)";
let isMobile = window.matchMedia(MOBILE_Q).matches;
let einTag   = window.matchMedia(EINTAG_Q).matches;

/* ============================================================
   Änderungen erkennen — Grundlage für den Abgleich zwischen Geräten.

   Statt an jeder einzelnen Stelle im Code einen Zeitstempel zu setzen
   (und garantiert eine zu vergessen), vergleicht der Planer beim
   Speichern den neuen Stand mit dem letzten. Was sich geändert hat,
   bekommt den aktuellen Zeitpunkt; was verschwunden ist, landet als
   Grabstein in state.tombs.

   Die Grabsteine sind der unscheinbare, aber entscheidende Teil: ohne
   sie taucht ein auf dem Handy gelöschter Eintrag beim nächsten
   Abgleich vom PC wieder auf.
   ============================================================ */

function recHash(r) {
  const c = {};
  Object.keys(r).sort().forEach(k => { if (k !== "at") c[k] = r[k]; });
  return JSON.stringify(c);
}

function snapshot(s) {
  const snap = { blocks: {}, tasks: {}, areas: {}, orte: {}, days: {} };
  ["blocks", "tasks", "areas", "orte"].forEach(c =>
    (s[c] || []).forEach(r => { snap[c][r.id] = recHash(r); }));
  Object.keys(s.days || {}).forEach(k => { snap.days[k] = recHash(s.days[k]); });
  snap.settings = JSON.stringify(s.settings);
  return snap;
}

let lastSnap = snapshot(state);
let lastSavedJson = JSON.stringify(state);
let prevSavedJson = null;     // Stand vor der letzten Änderung — für „Rückgängig"

function stampChanges() {
  const now = Date.now();

  ["blocks", "tasks", "areas", "orte"].forEach(c => {
    const prev = lastSnap[c] || {};
    const seen = new Set();
    state[c].forEach(r => {
      seen.add(r.id);
      if (prev[r.id] !== recHash(r)) r.at = now;
      if (typeof r.at !== "number") r.at = 0;
    });
    Object.keys(prev).forEach(id => { if (!seen.has(id)) state.tombs[id] = now; });
  });

  const prevDays = lastSnap.days || {};
  const seenDays = new Set();
  Object.keys(state.days).forEach(k => {
    seenDays.add(k);
    if (prevDays[k] !== recHash(state.days[k])) state.days[k].at = now;
  });
  Object.keys(prevDays).forEach(k => { if (!seenDays.has(k)) state.tombs["day:" + k] = now; });
