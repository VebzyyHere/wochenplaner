function blocksFor(date, dayIdx) {
  const key = iso(date);
  return state.blocks.filter(b =>
    b.repeat === "weekly" ? b.day === dayIdx : b.date === key
  ).sort((a, b) => a.start - b.start);
}

/* Überlappungen nebeneinander legen */
function layout(items) {
  const cols = [];
  const placed = items.map(b => ({ b, col: 0, of: 1 }));
  placed.forEach(p => {
    let c = 0;
    while (cols[c] && cols[c] > p.b.start) c++;
    cols[c] = p.b.end;
    p.col = c;
  });
  const groups = [];
  let cur = [], curEnd = -1;
  placed.forEach(p => {
    if (p.b.start >= curEnd && cur.length) { groups.push(cur); cur = []; }
    cur.push(p); curEnd = Math.max(curEnd, p.b.end);
  });
  if (cur.length) groups.push(cur);
  groups.forEach(g => { const n = Math.max(...g.map(p => p.col)) + 1; g.forEach(p => p.of = n); });
  return placed;
}

/* ============================================================
   Wochenziele — Stunden pro Woche statt fester Uhrzeit.

   Ein Bereich kann ein Wochenziel haben ("10 h Lernen"). Der Planer
   zählt, wie viel davon schon im Raster steht, und kann den Rest auf
   Vorschlag verteilen. Vorschläge sind normale Blöcke mit sug:true —
   dadurch lassen sie sich ziehen und ziehen wie alles andere, zählen
   aber erst als erledigt geplant, wenn sie angenommen wurden.

   Bewusst kein Übertrag in die nächste Woche: eine nicht volle Woche
   ist kein Fehler, und ein wachsender Schuldenberg wäre das Gegenteil
   von dem, was dieser Planer sein soll.
   ============================================================ */

const ENERGY_WEIGHT = { low: 0.55, mid: 1, high: 1.45 };

function weekDays() {
  const mon = mondayOf(anchor);
  return [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(mon, i);
    return { i, d, key: iso(d) };
  });
}

/* Minuten eines Bereichs in der angezeigten Woche.
   sug=false: echte Einträge · sug=true: offene Vorschläge */
function areaMinutes(areaId, sug) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId) return;
      if (!!b.sug !== !!sug) return;
      const here = b.repeat === "weekly" ? b.day === day.i : b.date === day.key;
      if (here) sum += b.end - b.start;
    });
  });
  return sum;
}

function hasSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  return state.blocks.some(b => b.sug && keys.has(b.date));
}

/* Stunden lesbar: 90 → „1,5 h", 45 → „45 min" */
function fmtDur(min) {
  if (min <= 0) return "0 h";
  if (min < 60) return min + " min";
  const h = min / 60;
  return (Math.round(h * 10) / 10).toString().replace(".", ",") + " h";
}

/* ============================================================
   Nachtruhe

   Die Zeitspannen eines Tages, die zur Nacht gehören — Schlaf plus die
   Ruhezeit davor und danach. Zurückgegeben als Minuten seit Mitternacht
   des jeweiligen Tages, denn der Schlaf läuft über den Tageswechsel:
   22:00 abends und 6:30 früh sind zwei Abschnitte desselben Kalendertags.
   ============================================================ */
function restSpans() {
  const sl = state.settings.sleep;
  if (!sl || !sl.on) return [];
  const w = sl.wind || 0;
  const from = sl.from, to = sl.to;

  if (from > to) {
    // Normalfall: über Mitternacht. Abends ab „from - Ruhezeit",
    // morgens bis „to + Ruhezeit".
    return [
      { start: 0, end: Math.min(1440, to + w), kind: "morgen" },
      { start: Math.max(0, from - w), end: 1440, kind: "abend" }
    ].filter(s => s.end > s.start);
  }
  // Wer tagsüber schläft: ein zusammenhängender Abschnitt.
  return [{ start: Math.max(0, from - w), end: Math.min(1440, to + w), kind: "tag" }]
    .filter(s => s.end > s.start);
}

/* Freie Lücken eines Tages innerhalb des erlaubten Fensters.
   Vergangenes wird ausgelassen — ein Vorschlag für gestern hilft niemandem.
   Schlaf- und Ruhezeit zählen wie ein belegter Block: der Vorschlag geht
   darum herum, von Hand eintragen darf man dort trotzdem. */
function freeGaps(day, plan) {
  const todayKey = iso(new Date());
  if (day.key < todayKey) return [];

  const lo = Math.max(state.settings.dayStart * 60, plan.from == null ? 0 : plan.from);
  const hi = Math.min(state.settings.dayEnd * 60, plan.to == null ? 1440 : plan.to);
  if (hi - lo < 15) return [];

  let cursor = lo;
  if (day.key === todayKey) {
    const now = new Date().getHours() * 60 + new Date().getMinutes();
    cursor = Math.max(cursor, Math.ceil((now + 10) / 15) * 15);
  }

  // Jeder Block belegt zusaetzlich seine Wegzeit. Wer um 13:30 aus der
  // Arbeit kommt und eine Stunde nach Hause faehrt, faengt nicht um 13:30
  // mit Lernen an — und der Planer soll das auch nicht behaupten.
  const busy = state.blocks
    .filter(b => b.repeat === "weekly" ? b.day === day.i : b.date === day.key)
    .map(b => {
      const pad = (areaById(b.areaId).plan || {}).pad || 0;
      return { start: b.start - pad, end: b.end + pad };
    })
    .concat(restSpans())
    .sort((a, b) => a.start - b.start);

  const gaps = [];
  busy.forEach(b => {
    if (b.start > cursor) gaps.push({ start: cursor, end: b.start });
    cursor = Math.max(cursor, b.end);
  });
  gaps.push({ start: cursor, end: hi });

  return gaps
    .map(g => ({ start: Math.max(g.start, lo), end: Math.min(g.end, hi) }))
    .filter(g => g.end - g.start >= 15);
}

function dayWeight(day) {
  const e = (state.days[day.key] || {}).energy;
  return ENERGY_WEIGHT[e] || 1;
}

/* Verteilt die offenen Minuten eines Bereichs auf die Woche.
   Gleichmäßig über die erlaubten Tage, gewichtet nach Tagesform. */
function placeArea(area, open) {
  const p = area.plan;
  const cand = weekDays()
    .filter(day => p.days.includes(day.i))
    .map(day => ({ day, gaps: freeGaps(day, p), w: dayWeight(day) }))
    .filter(c => c.gaps.length);
  if (!cand.length) return 0;

  const sumW = cand.reduce((s, c) => s + c.w, 0);
  cand.forEach(c => { c.share = Math.round(open * c.w / sumW / 15) * 15; });

  // Kürzeste sinnvolle Blocklänge. Ist das ganze Ziel kleiner als die
  // Mindestlänge, darf der Block entsprechend kleiner sein.
  const minLen = Math.min(p.min, Math.max(15, Math.floor(open / 15) * 15));
  let placed = 0;

  const fill = (c, wanted) => {
    let need = wanted;
    for (const g of c.gaps) {
      while (need >= minLen) {
        const room = g.end - g.start;
        if (room < minLen) break;
        const len = Math.floor(Math.min(p.max, need, room) / 15) * 15;
        if (len < minLen) break;
        state.blocks.push({
          id: uid(), title: area.name, areaId: area.id,
          day: c.day.i, date: c.day.key, repeat: "none",
          start: g.start, end: g.start + len, frog: false, sug: true
        });
        // Der eigene Puffer gilt auch zum naechsten eigenen Block
        g.start += len + p.pad;
        need -= len;
        placed += len;
      }
      if (need < minLen) break;
    }
    return wanted - need;
  };

  let rest = open;
  cand.forEach(c => { rest -= fill(c, Math.min(c.share, rest)); });
  // Was nirgends passte, noch einmal über alle Tage schieben
  if (rest >= minLen) cand.forEach(c => { if (rest >= minLen) rest -= fill(c, rest); });
  // Restminuten unter der Mindestlänge nicht als Zwergblock anlegen,
  // sondern an vorhandene Vorschläge anhängen
  if (rest >= 15) placed += growSuggestions(area, rest);

  return placed;
}

/* Hängt übrig gebliebene Minuten an bestehende Vorschläge an,
   statt 15-Minuten-Krümel ins Raster zu streuen. */
function growSuggestions(area, rest) {
  const p = area.plan;
  const hi = Math.min(state.settings.dayEnd * 60, p.to == null ? 1440 : p.to);
  let used = 0;

  for (const day of weekDays()) {
    if (!p.days.includes(day.i)) continue;
    const all = state.blocks
      .filter(b => b.repeat === "weekly" ? b.day === day.i : b.date === day.key)
      .sort((a, b) => a.start - b.start);

    for (const b of all) {
      if (rest - used < 15) return used;
      if (!b.sug || b.areaId !== area.id) continue;
      const next = all.find(x => x !== b && x.start >= b.end);
      const nextPad = next ? ((areaById(next.areaId).plan || {}).pad || 0) : 0;
      const limit = next ? Math.min(hi, next.start - Math.max(p.pad, nextPad)) : hi;
      const grow = Math.floor(
        Math.min(limit - b.end, p.max - (b.end - b.start), rest - used) / 15) * 15;
      if (grow >= 15) { b.end += grow; used += grow; }
    }
  }
  return used;
}

function buildSuggestions() {
  clearSuggestions();

  // Erst das, was sein muss — dann der Rest. Bei knappem Platz soll nicht
  // der Serienabend den Lernblock verdraengen, nur weil er groesser war.
  const todo = state.areas
    .map(a => ({ a, open: a.plan.goal * 60 - areaMinutes(a.id, false) }))
    .filter(x => x.open >= 15)
    .sort((x, y) => (y.a.plan.must - x.a.plan.must) || (y.open - x.open));

  let placed = 0, missing = 0;
  todo.forEach(({ a, open }) => {
    const got = placeArea(a, open);
    placed += got;
    missing += open - got;
  });
  return { placed, missing, areas: todo.length };
}

function clearSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  state.blocks = state.blocks.filter(b => !(b.sug && keys.has(b.date)));
}

function acceptSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  let n = 0;
  state.blocks.forEach(b => { if (b.sug && keys.has(b.date)) { delete b.sug; n++; } });
  return n;
}

/* ============================================================ Ziele-Anzeige */
/* Ist die angezeigte Woche die laufende? */
function istDieseWoche() {
  return iso(mondayOf(anchor)) === iso(mondayOf(new Date()));
}

/* Blättert eine Woche vor und verteilt dort gleich.
   Vorausplanen ging immer schon — man musste nur wissen, dass man
   vorblättern kann. Genau das wusste niemand. */
function planeNaechsteWoche() {
  anchor = addDays(mondayOf(anchor), 7);
  const r = buildSuggestions();
  save(); renderAll();
  if (!r.placed) toast("Nichts zu verteilen — alle Ziele sind schon gedeckt");
  else toast("Vorschlag für die nächste Woche steht");
}

function renderGoals() {
  const list = $("#goalsList");
  const foot = $("#goalsFoot");
  list.innerHTML = "";
  foot.innerHTML = "";

  // Wer in einer anderen Woche plant, soll das sehen — sonst wundert man
  // sich, warum die Stunden nicht zum eigenen Gefühl passen.
  if (!istDieseWoche()) {
    const mon = mondayOf(anchor);
    const bar = document.createElement("div");
    bar.className = "goals__which";
    bar.textContent = (mon > mondayOf(new Date()) ? "Du planst voraus: " : "Vergangene Woche: ")
      + "KW " + isoWeek(mon) + ", ab " + mon.getDate() + "." + (mon.getMonth() + 1) + ".";
    list.appendChild(bar);
  }

  const withGoal = state.areas.filter(a => a.plan.goal > 0);

  if (!withGoal.length) {
    list.innerHTML =
      "<div class='empty'><b>Noch keine Wochenziele</b>Für alles ohne feste Uhrzeit: sag, wie viele Stunden " +
      "pro Woche du willst — z.B. 10 h Lernen. Wann genau, entscheidest du später.</div>";
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Wochenziel festlegen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    return;
  }

  let anyOpen = false;

  withGoal.forEach(a => {
    const goal = a.plan.goal * 60;
    const done = areaMinutes(a.id, false);
    const sug  = areaMinutes(a.id, true);
    const open = Math.max(0, goal - done - sug);
    if (goal - done >= 15) anyOpen = true;

    const row = document.createElement("div");
    row.className = "goal";
    row.style.setProperty("--h", a.hue);

    const pDone = clamp(done / goal * 100, 0, 100);
    const pSug  = clamp(sug / goal * 100, 0, 100 - pDone);

    row.innerHTML =
      "<div class='goal__top'>" +
        "<span class='goal__name'><span class='goal__dot'></span>" + escapeHtml(a.name) + "</span>" +
        "<span class='goal__num'>" + fmtDur(done) + " / " + fmtDur(goal) + "</span>" +
      "</div>" +
      "<div class='goal__track'>" +
        "<div class='goal__fill' style='width:" + pDone + "%'></div>" +
        "<div class='goal__fill goal__fill--sug' style='width:" + pSug + "%'></div>" +
      "</div>" +
      "<div class='goal__rest'>" + goalHint(done, sug, open, goal) + "</div>";

    list.appendChild(row);
  });

  // Immer erreichbar, solange man in der laufenden Woche steht
  const naechste = () => {
    if (!istDieseWoche()) return null;
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Nächste Woche";
    b.title = "Eine Woche vorblättern und dort verteilen";
    b.onclick = planeNaechsteWoche;
    return b;
  };

  if (hasSuggestions()) {
    const ok = document.createElement("button");
    ok.className = "btn btn--primary btn--sm";
    ok.textContent = "Alle übernehmen";
    ok.onclick = () => {
      const n = acceptSuggestions();
      save(); renderAll();
      toast(n + (n === 1 ? " Vorschlag übernommen" : " Vorschläge übernommen"));
    };
    const no = document.createElement("button");
    no.className = "btn btn--sm";
    no.textContent = "Verwerfen";
    no.onclick = () => { clearSuggestions(); save(); renderAll(); toast("Vorschläge verworfen"); };
    foot.append(ok, no);
  } else if (anyOpen) {
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Vorschlagen";
    b.onclick = () => {
      const r = buildSuggestions();
      save(); renderAll();
      if (!r.placed) toast("Kein Platz gefunden — Zeitfenster erweitern?");
      else if (r.missing >= 15) toast("Verteilt, bis auf " + fmtDur(r.missing) + " — da war kein Platz mehr");
      else toast("Vorschlag steht — schau, ob's dir passt");
    };
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  } else {
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Ziele anpassen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  }
}

function goalHint(done, sug, open, goal) {
  if (sug > 0) return "<b>" + fmtDur(sug) + "</b> vorgeschlagen" + (open >= 15 ? " · " + fmtDur(open) + " bleiben offen" : "");
  if (done >= goal) return "Geschafft.";
  return "<b>" + fmtDur(goal - done) + "</b> noch offen";
}

/* ============================================================ Ziele bearbeiten */
function goalsSheet() {
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Wochenziele</h2>" +
      "<p style='margin:0 0 16px;color:var(--text-muted);font-size:14px;line-height:1.6'>" +
      "Für alles, was keine feste Uhrzeit hat. Trag Stunden pro Woche ein — der Planer " +
      "rechnet mit, was noch fehlt, und kann den Rest auf die Woche verteilen. " +
      "0 lassen heißt: kein Ziel.</p>" +
      "<div class='goallist' id='gList'></div>";

    const wrap = s.querySelector("#gList");

    state.areas.forEach(a => {
      const p = a.plan;
      const row = document.createElement("div");
      row.className = "goalrow";
      row.style.setProperty("--h", a.hue);

      row.innerHTML =
        "<div class='goalrow__head'>" +
          "<span class='goalrow__name'><span class='goal__dot'></span>" + escapeHtml(a.name) +
            "<span class='goalrow__tags'></span></span>" +
          "<input class='field goalrow__h' type='number' min='0' max='80' step='0.5' " +
                 "aria-label='Stunden pro Woche für " + escapeHtml(a.name) + "'>" +
          "<span class='goalrow__unit'>h / Woche</span>" +
          "<button class='goalrow__more' type='button' aria-expanded='false' " +
                  "aria-label='Zeiten für " + escapeHtml(a.name) + "'>⌄</button>" +
        "</div>" +
        "<div class='goalrow__body' hidden>" +
          "<label class='switch' style='margin-bottom:14px'>" +
            "<input type='checkbox' class='gMust'> Muss sein — nicht zum Streichen vorschlagen</label>" +
          "<p class='goalrow__sub'>Wann darf der Vorschlag das einplanen?</p>" +
          "<div class='chipset gDays' style='margin-bottom:14px'></div>" +
          "<div class='sheet__cols' style='margin-bottom:12px'>" +
            "<div><label class='label'>Frühestens</label><input class='field gFrom' type='time' step='900'></div>" +
            "<div><label class='label'>Spätestens</label><input class='field gTo' type='time' step='900'></div>" +
          "</div>" +
          "<div class='sheet__cols' style='margin-bottom:12px'>" +
            "<div><label class='label'>Kürzester Block (min)</label><input class='field gMin' type='number' min='15' max='240' step='15'></div>" +
            "<div><label class='label'>Längster Block (min)</label><input class='field gMax' type='number' min='15' max='480' step='15'></div>" +
          "</div>" +
          "<label class='label'>Wegzeit davor und danach (min)</label>" +
          "<input class='field gPad' type='number' min='0' max='180' step='15' style='max-width:140px'>" +
          "<div class='goalrow__sub' style='margin:8px 0 0'>Zum Beispiel eine Stunde Heimfahrt nach der Arbeit. " +
          "So lange wird davor und danach nichts eingeplant.</div>" +
        "</div>";

      const hIn   = row.querySelector(".goalrow__h");
      const more  = row.querySelector(".goalrow__more");
      const body  = row.querySelector(".goalrow__body");
      const dayW  = row.querySelector(".gDays");
      const from  = row.querySelector(".gFrom");
      const to    = row.querySelector(".gTo");
      const minIn = row.querySelector(".gMin");
      const maxIn = row.querySelector(".gMax");
      const mustIn = row.querySelector(".gMust");
      const padIn = row.querySelector(".gPad");

      const tags = row.querySelector(".goalrow__tags");
      const paintTags = () => {
        tags.innerHTML =
          (p.must ? "" : "<span class='tag tag--soft'>kann warten</span>") +
          (p.pad ? "<span class='tag'>+" + p.pad + " min Weg</span>" : "");
      };
      paintTags();

      mustIn.checked = p.must;
      padIn.value = p.pad;
      hIn.value = p.goal || 0;
      from.value = fmtTime(p.from == null ? state.settings.dayStart * 60 : p.from);
      to.value   = fmtTime(p.to   == null ? state.settings.dayEnd * 60   : p.to);
      minIn.value = p.min;
      maxIn.value = p.max;

      const days = new Set(p.days);
      const paintDays = () => {
        dayW.innerHTML = "";
        for (let i = 0; i < 7; i++) {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(days.has(i)));
          c.textContent = DAY_SHORT[i];
          c.onclick = () => {
            if (days.has(i)) { if (days.size > 1) days.delete(i); }
            else days.add(i);
            paintDays();
          };
          dayW.appendChild(c);
        }
      };
      paintDays();

      more.onclick = () => {
        const open = body.hidden;
        if (!open) { row._commit(); paintTags(); }   // Zugeklapptes zeigt den Zustand
        body.hidden = !open;
        more.setAttribute("aria-expanded", String(open));
        more.textContent = open ? "⌃" : "⌄";
      };

      row._commit = () => {
        p.must = mustIn.checked;
        p.pad = clamp(parseInt(padIn.value, 10) || 0, 0, 180);
        p.goal = clamp(parseFloat(String(hIn.value).replace(",", ".")) || 0, 0, 80);
        p.days = [...days].sort((x, y) => x - y);
        const f = parseTime(from.value), t = parseTime(to.value);
        p.from = f > 0 ? f : null;
        p.to   = t < 1440 && t > f ? t : null;
        p.min  = clamp(parseInt(minIn.value, 10) || 45, 15, 240);
        p.max  = clamp(parseInt(maxIn.value, 10) || 120, 15, 480);
        if (p.max < p.min) p.max = p.min;
      };

      wrap.appendChild(row);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Speichern";
    ok.onclick = () => {
      wrap.querySelectorAll(".goalrow").forEach(r => r._commit());
      save(); close(); renderAll();
    };
    foot.append(cancel, ok);
    s.appendChild(foot);
  }, { wide: true });
}

/* ============================================================ Raster */
function renderGrid() {
  const grid = $("#grid");
  const wrap = $("#gridWrap");
  const keepScroll = wrap.scrollTop;
  grid.innerHTML = "";

  const { dayStart, dayEnd } = state.settings;
  const hours = dayEnd - dayStart;
  const hourH = parseFloat(getComputedStyle(grid).getPropertyValue("--hourh")) || 52;
  const bodyH = hours * hourH;
  const mon = mondayOf(anchor);
  const todayIso = iso(new Date());
  const dayIdxs = isMobile ? [selectedDayIdx] : [0, 1, 2, 3, 4, 5, 6];
  grid.style.setProperty("--cols", dayIdxs.length);

  // Kopfzeile — am Handy übernimmt das der Tag-Umschalter oben
  if (!isMobile) {
  const gh = document.createElement("div");
  gh.className = "dayhead dayhead--gutter";
  grid.appendChild(gh);

  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const h = document.createElement("div");
    h.className = "dayhead" + (iso(d) === todayIso ? " is-today" : "");
    const en = state.days[iso(d)] && state.days[iso(d)].energy;
    if (en) h.dataset.energy = en;
    h.innerHTML =
      "<div class='dayhead__name'>" + DAY_SHORT[i] + "</div>" +
      "<div class='dayhead__num'>" + d.getDate() + "</div>" +
      "<span class='dayhead__energy' aria-hidden='true'><i></i><i></i><i></i></span>";
    h.onclick = () => { selectedDayIdx = i; renderEnergy(); renderDaySwitch(); if (isMobile) renderGrid(); };
    grid.appendChild(h);
  });
  }

  // Zeitspalte
  const tc = document.createElement("div");
  tc.className = "timecol";
  tc.style.height = bodyH + "px";
  for (let h = dayStart; h <= dayEnd; h++) {
    const m = document.createElement("div");
    m.className = "timecol__mark num";
    m.style.top = ((h - dayStart) * hourH) + "px";
    m.textContent = pad2(h) + ":00";
    tc.appendChild(m);
  }
  grid.appendChild(tc);

  // Tagesspalten
  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const col = document.createElement("div");
    col.className = "daycol" + (i >= 5 ? " is-weekend" : "");
    col.style.height = bodyH + "px";
    col.dataset.day = i;
    col.dataset.date = iso(d);

    // Nachtruhe hinterlegen — liegt unter den Linien und Blöcken
    restSpans().forEach(sp => {
      const a = Math.max(sp.start, dayStart * 60);
      const b = Math.min(sp.end, dayEnd * 60);
      if (b <= a) return;
      const r = document.createElement("div");
      r.className = "rest";
      r.style.top = ((a - dayStart * 60) / 60 * hourH) + "px";
      r.style.height = ((b - a) / 60 * hourH) + "px";
      r.title = "Nachtruhe — hier wird nichts vorgeschlagen";
      col.appendChild(r);
    });

    for (let h = 0; h <= hours; h++) {
      const l = document.createElement("div");
      l.className = "daycol__line";
      l.style.top = (h * hourH) + "px";
      col.appendChild(l);
      if (h < hours) {
        const hl = document.createElement("div");
        hl.className = "daycol__line daycol__line--half";
        hl.style.top = (h * hourH + hourH / 2) + "px";
        col.appendChild(hl);
      }
    }

    if (iso(d) === todayIso) {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      if (mins >= dayStart * 60 && mins <= dayEnd * 60) {
        const n = document.createElement("div");
        n.className = "now";
        n.style.top = ((mins - dayStart * 60) / 60 * hourH) + "px";
        col.appendChild(n);
      }
    }

    layout(blocksFor(d, i)).forEach(p => col.appendChild(blockEl(p, hourH)));

    attachColumnHandlers(col, hourH);
    grid.appendChild(col);
  });

  wrap.scrollTop = keepScroll || Math.max(0, ((new Date().getHours() - 1 - dayStart) * hourH));
}

function blockEl({ b, col, of }, hourH) {
  const { dayStart } = state.settings;
  const el = document.createElement("div");
  const area = areaById(b.areaId);
  const h = (b.end - b.start) / 60 * hourH;
  el.className = "block" + (h < 34 ? " is-short" : "") + (b.frog ? " is-frog" : "") + (b.sug ? " is-sug" : "");
  el.style.setProperty("--h", area.hue);
  el.style.top = ((b.start - dayStart * 60) / 60 * hourH) + "px";
  el.style.height = Math.max(18, h - 2) + "px";
  if (of > 1) {
    const w = 100 / of;
    el.style.left = "calc(" + (col * w) + "% + 3px)";
    el.style.right = "calc(" + ((of - col - 1) * w) + "% + 3px)";
  }
  el.tabIndex = 0;
  el.dataset.id = b.id;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label",
    (b.sug ? "Vorschlag: " : "") + b.title + ", " + fmtTime(b.start) + " bis " + fmtTime(b.end) + ", " + area.name);
  const t = document.createElement("div");
  t.className = "block__title"; t.textContent = b.title || "Ohne Titel";
  const tm = document.createElement("div");
  tm.className = "block__time num"; tm.textContent = fmtTime(b.start) + "–" + fmtTime(b.end);
  el.append(t, tm);
  const rz = document.createElement("div");
  rz.className = "block__resize";
  el.appendChild(rz);

  if (b.sug) {
    const bar = document.createElement("div");
    bar.className = "block__sug";
    const yes = document.createElement("button");
    yes.type = "button"; yes.textContent = "✓";
    yes.title = "Übernehmen"; yes.setAttribute("aria-label", "Vorschlag übernehmen");
    yes.onclick = e => { e.stopPropagation(); acceptOne(b.id); };
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "×";
    no.title = "Verwerfen"; no.setAttribute("aria-label", "Vorschlag verwerfen");
    no.onclick = e => { e.stopPropagation(); dropOne(b.id); };
    bar.append(yes, no);
    // Pointer-Events der Knöpfe nicht vom Spalten-Handler abfangen lassen
    bar.addEventListener("pointerdown", e => e.stopPropagation());
    el.appendChild(bar);
  }

  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (b.sug) acceptOne(b.id); else editBlock(b.id);
    }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      state.blocks = state.blocks.filter(x => x.id !== b.id);
      save(); renderAll();
      if (b.sug) toast("Vorschlag verworfen"); else toastUndo("Eintrag gelöscht");
    }
  });
  return el;
}

function acceptOne(id, fest) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  delete b.sug;
  if (fest) b.repeat = "weekly";
  save(); renderAll();
  toast(fest ? "Übernommen — steht ab jetzt jede Woche" : "Übernommen");
}
function dropOne(id) {
  state.blocks = state.blocks.filter(x => x.id !== id);
  save(); renderAll(); toast("Vorschlag verworfen");
}

/* ============================================================ Maus/Touch im Raster */
const SNAP = 15;
function snap(min) { return Math.round(min / SNAP) * SNAP; }

function attachColumnHandlers(col, hourH) {
  const { dayStart, dayEnd } = state.settings;
  const minAt = clientY => {
    const r = col.getBoundingClientRect();
    return clamp(snap(dayStart * 60 + (clientY - r.top) / hourH * 60), dayStart * 60, dayEnd * 60);
  };

  col.addEventListener("pointerdown", e => {
    const blockNode = e.target.closest(".block");
    const handle = e.target.closest(".block__resize");
    const fine = e.pointerType === "mouse";

    /* --- Größe ändern --- */
    if (handle && blockNode && fine) {
      e.preventDefault();
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const move = ev => {
        const end = Math.max(b.start + SNAP, minAt(ev.clientY));
        blockNode.style.height = Math.max(18, (end - b.start) / 60 * hourH - 2) + "px";
        blockNode.dataset.pendEnd = end;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        b.end = +blockNode.dataset.pendEnd || b.end;
        save(); renderAll();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Block verschieben (nur Maus) --- */
    if (blockNode && fine) {
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const startY = e.clientY, origStart = b.start, len = b.end - b.start;
      let moved = false;
      const move = ev => {
        if (!moved && Math.abs(ev.clientY - startY) < 4) return;
        moved = true;
        blockNode.classList.add("is-dragging");
        const delta = snap((ev.clientY - startY) / hourH * 60);
        const ns = clamp(origStart + delta, dayStart * 60, dayEnd * 60 - len);
        blockNode.style.top = ((ns - dayStart * 60) / 60 * hourH) + "px";
        blockNode.dataset.pendStart = ns;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        if (moved) {
          const ns = +blockNode.dataset.pendStart;
          b.start = ns; b.end = ns + len;
          save(); renderAll();
        } else {
          editBlock(b.id);
        }
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf Block: erst beim Loslassen, und nur ohne Wischen ---
       Vorher ging der Editor schon beim Aufsetzen des Fingers auf, sodass
       jeder Scrollversuch einen Dialog erzeugt hat. */
    if (blockNode) {
      tapOrScroll(e, () => editBlock(blockNode.dataset.id));
      return;
    }

    /* --- Ziehen zum Anlegen (nur Maus) --- */
    if (fine) {
      e.preventDefault();
      const a = minAt(e.clientY);
      const ghost = document.createElement("div");
      ghost.className = "block__ghost";
      ghost.style.setProperty("--h", state.areas[0].hue);
      col.appendChild(ghost);
      let from = a, to = a + 60;
      const paint = () => {
        const s = Math.min(from, to), en = Math.max(from, to);
        ghost.style.top = ((s - dayStart * 60) / 60 * hourH) + "px";
        ghost.style.height = Math.max(16, (en - s) / 60 * hourH - 2) + "px";
        ghost.textContent = fmtTime(s) + "–" + fmtTime(en);
      };
      paint();
      let dragged = false;
      const move = ev => { dragged = true; to = minAt(ev.clientY); paint(); };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        ghost.remove();
        let s = Math.min(from, to), en = Math.max(from, to);
        if (!dragged || en - s < SNAP) { s = a; en = a + 60; }
        newBlock(+col.dataset.day, col.dataset.date, s, Math.min(en, dayEnd * 60));
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf leere Fläche: langes Drücken ---
       Ein kurzer Tipp legt bewusst nichts an. Beim Scrollen streift man
       ständig freie Flächen; ein Eintrag, den man nicht wollte, ist
       ärgerlicher als ein Weg, den man einmal lernen muss. Für alles
       andere gibt es den Plus-Knopf. */
    holdToCreate(e, col, minAt, hourH, dayEnd);
  });

  /* Aufgabe per Drag&Drop einplanen */
  col.addEventListener("dragover", e => {
    if (!dragTaskId) return;
    e.preventDefault();
    col.classList.add("is-droptarget");
  });
  col.addEventListener("dragleave", () => col.classList.remove("is-droptarget"));
  col.addEventListener("drop", e => {
    col.classList.remove("is-droptarget");
    if (!dragTaskId) return;
    e.preventDefault();
    const t = state.tasks.find(x => x.id === dragTaskId);
    if (!t) return;
    const s = minAt(e.clientY);
    state.blocks.push({
      id: uid(), title: t.title, areaId: t.areaId || state.areas[0].id,
      day: +col.dataset.day, date: col.dataset.date, repeat: "none",
      start: s, end: Math.min(s + 60, state.settings.dayEnd * 60), frog: !!t.frog
    });
    save(); renderAll();
    toast("Eingeplant: " + t.title);
  });
}

/* ============================================================
   Tippen oder Wischen auseinanderhalten

   Auf einem Telefon ist jede Berührung erst einmal mehrdeutig: Anfang
   einer Scrollbewegung oder Tipp? Das entscheidet sich erst beim
   Loslassen — vorher zu handeln erzeugt genau die Fehlauslösungen, über
   die man dann stolpert.
   ============================================================ */
const TAP_SLOP = 10;      // Pixel Wackeln, die noch als Tipp durchgehen
const TAP_TIME = 700;     // länger gehalten ist kein Tipp mehr
const HOLD_TIME = 380;    // so lange drücken für einen neuen Eintrag

function tapOrScroll(e, run) {
  const x0 = e.clientX, y0 = e.clientY, t0 = Date.now();
  let moved = false;
  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) moved = true;
  };
  const done = () => {
    off();
    if (!moved && Date.now() - t0 < TAP_TIME) run();
  };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", done);
    document.removeEventListener("pointercancel", off);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", done);
  document.addEventListener("pointercancel", off);
}

function holdToCreate(e, col, minAt, hourH, dayEnd) {
  const x0 = e.clientX, y0 = e.clientY;
  const start = minAt(e.clientY);
  let abgebrochen = false;

  // Sichtbare Rückmeldung, damit klar ist, dass gerade etwas entsteht
  const ghost = document.createElement("div");
  ghost.className = "block__ghost is-holding";
  ghost.style.setProperty("--h", state.areas[0].hue);
  ghost.style.top = ((start - state.settings.dayStart * 60) / 60 * hourH) + "px";
  ghost.style.height = Math.max(16, hourH - 2) + "px";
  ghost.textContent = fmtTime(start) + "–" + fmtTime(start + 60);
  col.appendChild(ghost);

  const timer = setTimeout(() => {
    if (abgebrochen) return;
    off();
    ghost.remove();
    if (navigator.vibrate) navigator.vibrate(12);
    newBlock(+col.dataset.day, col.dataset.date, start, Math.min(start + 60, dayEnd * 60));
  }, HOLD_TIME);

  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) stop();
  };
  const stop = () => { abgebrochen = true; clearTimeout(timer); ghost.remove(); off(); };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", stop);
    document.removeEventListener("pointercancel", stop);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
}

/* ============================================================ Block-Editor */
function newBlock(dayIdx, dateIso, start, end) {
  blockSheet({
    id: null, title: "", areaId: state.areas[0].id,
    day: dayIdx, date: dateIso, repeat: "none",
    start, end, frog: false
  });
}
function editBlock(id) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  if (b.sug) { sugSheet(b); return; }
  blockSheet({ ...b });
}

/* Antippen eines Vorschlags — am Handy der Hauptweg, am PC die Alternative
   zu den kleinen Knöpfen im Block. */
function sugSheet(b) {

      " · " + escapeHtml(area.name) + "</p>" +

      "Verschieben kannst du ihn auch einfach im Raster.</p>" +

    const del = document.createElement("button");

    del.onclick = () => { close(); dropOne(b.id); };
    const sp = document.createElement("span"); sp.className = "spacer";
    const edit = document.createElement("button");
    edit.className = "btn"; edit.type = "button"; edit.textContent = "Ändern";

function blockSheet(draft) {
  const isNew = !draft.id;
  const mon = mondayOf(anchor);
  let days = new Set([draft.day]);

  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>" + (isNew ? "Neuer Eintrag" : "Eintrag bearbeiten") + "</h2>" +
      "<div class='sheet__row'><label class='label' for='bTitle'>Was?</label>" +
      "<input class='field' id='bTitle' placeholder='z.B. Vorlesung, Sport, Serienabend' autocomplete='off'></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span><div class='chipset' id='bAreas'></div></div>" +
      "<div class='sheet__row sheet__cols'>" +
        "<div><label class='label' for='bFrom'>Von</label><input class='field' id='bFrom' type='time' step='300'></div>" +
        "<div><label class='label' for='bTo'>Bis</label><input class='field' id='bTo' type='time' step='300'></div>" +
      "</div>" +
      "<div class='sheet__row'><span class='label'>Wann?</span>" +
        "<label class='switch'><input type='checkbox' id='bRepeat'> Jede Woche wiederholen</label>" +
        "<div class='chipset' id='bDays' style='margin-top:12px'></div>" +
        "<div id='bDaysHint' style='font-size:12px;color:var(--text-faint);margin-top:8px'></div>" +
      "</div>";

    const title = s.querySelector("#bTitle");
    title.value = draft.title;
    const from = s.querySelector("#bFrom"); from.value = fmtTime(draft.start);
    const to = s.querySelector("#bTo"); to.value = fmtTime(draft.end);
    const rep = s.querySelector("#bRepeat"); rep.checked = draft.repeat === "weekly";

    // Bereiche
    const areaWrap = s.querySelector("#bAreas");
    const paintAreas = () => {
      areaWrap.innerHTML = "";
      state.areas.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.style.setProperty("--h", a.hue);
        c.setAttribute("aria-pressed", String(a.id === draft.areaId));
        c.innerHTML = "<span class='chip__dot'></span>";
        c.append(a.name);
        c.onclick = () => { draft.areaId = a.id; paintAreas(); };
        areaWrap.appendChild(c);
      });
    };
    paintAreas();

    // Tage
    const dayWrap = s.querySelector("#bDays");
    const hint = s.querySelector("#bDaysHint");
    const paintDays = () => {
      dayWrap.innerHTML = "";
      for (let i = 0; i < 7; i++) {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(days.has(i)));
        c.textContent = DAY_SHORT[i];
        c.onclick = () => {
          if (days.has(i)) { if (days.size > 1) days.delete(i); }
          else { if (isNew) days.add(i); else { days.clear(); days.add(i); } }
          paintDays();
        };
        dayWrap.appendChild(c);
      }
      hint.textContent = rep.checked
        ? (isNew && days.size > 1 ? days.size + " Einträge, jede Woche — z.B. Arbeit von Mo bis Fr in einem Rutsch." : "Taucht in jeder Woche auf.")
        : "Nur in dieser Woche (" + [...days].map(i => DAY_SHORT[i]).join(", ") + ", " + addDays(mon, [...days][0]).getDate() + "." + (addDays(mon, [...days][0]).getMonth() + 1) + ".).";
    };
    rep.onchange = paintDays;
    paintDays();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    if (!isNew) {
      const del = document.createElement("button");
      del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Löschen";
      del.onclick = () => {
        state.blocks = state.blocks.filter(x => x.id !== draft.id);
        save(); close(); renderAll(); toastUndo("Eintrag gelöscht");
      };
      foot.appendChild(del);
    }
    const sp = document.createElement("span"); sp.className = "spacer"; foot.appendChild(sp);
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = isNew ? "Eintragen" : "Speichern";

    const commit = () => {
      let st = parseTime(from.value), en = parseTime(to.value);
      if (en <= st) en = st + 30;
      const weekly = rep.checked;
      const list = [...days];
      if (isNew) {
        list.forEach(d => state.blocks.push({
          id: uid(), title: title.value.trim() || "Ohne Titel", areaId: draft.areaId,
          day: d, date: iso(addDays(mon, d)), repeat: weekly ? "weekly" : "none",
          start: st, end: en, frog: false
        }));
      } else {
        const b = state.blocks.find(x => x.id === draft.id);
        b.title = title.value.trim() || "Ohne Titel";
        b.areaId = draft.areaId;
        b.day = list[0];
        b.date = iso(addDays(mon, list[0]));
        b.repeat = weekly ? "weekly" : "none";
        b.start = st; b.end = en;
      }
      save(); close(); renderAll();
    };
    ok.onclick = commit;
    title.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
    foot.append(cancel, ok);
    s.appendChild(foot);
  });
}

/* ============================================================ Aufgaben */
let dragTaskId = null;

function renderTasks() {
  const list = $("#taskList");
  list.innerHTML = "";
  const open = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done);

  if (!state.tasks.length) {
    list.innerHTML = "<div class='empty'><b>Noch nichts notiert</b>Schreib oben rein, was ansteht. Aufgaben kannst du später einfach in den Wochenplan ziehen.</div>";
    return;
  }
  [...open, ...done].forEach(t => list.appendChild(taskEl(t)));
}

function taskEl(t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " is-done" : "");
  row.draggable = !t.done;

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "task__check"; cb.checked = t.done;
  cb.setAttribute("aria-label", "Erledigt: " + t.title);
  cb.onchange = () => { t.done = cb.checked; save(); renderTasks(); };

  const body = document.createElement("div");
  body.className = "task__body";
  const ti = document.createElement("div");
  ti.className = "task__title"; ti.textContent = t.title;
  const tags = document.createElement("div");
  tags.className = "task__tags";

  const areaBtn = document.createElement("button");
  areaBtn.className = "task__area";
  const a = areaById(t.areaId);
  areaBtn.style.setProperty("--h", a.hue);
  areaBtn.style.border = "0"; areaBtn.style.background = "transparent"; areaBtn.style.padding = "0";
  areaBtn.innerHTML = "<span class='chip__dot'></span>";
  areaBtn.append(a.name);
  areaBtn.title = "Bereich wechseln";
  areaBtn.onclick = () => {
    const i = state.areas.findIndex(x => x.id === t.areaId);
    t.areaId = state.areas[(i + 1) % state.areas.length].id;
    save(); renderTasks();
  };

  const frog = document.createElement("button");
  frog.className = "task__frog"; frog.textContent = "🐸";
  frog.title = "Frosch des Tages — die Aufgabe mit der größten Überwindung";
  frog.setAttribute("aria-pressed", String(!!t.frog));
  frog.setAttribute("aria-label", "Als Frosch des Tages markieren");
  frog.onclick = () => {
    const on = !t.frog;
    if (on) state.tasks.forEach(x => x.frog = false);
    t.frog = on; save(); renderTasks(); renderEnergy();
  };

  const plan = document.createElement("button");
  plan.className = "task__frog"; plan.textContent = "📅";
  plan.style.filter = "none"; plan.style.opacity = ".55";
  plan.title = "In den Wochenplan legen";
  plan.setAttribute("aria-label", "In den Wochenplan legen");
  plan.onclick = () => {
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const start = clamp(snap(new Date().getHours() * 60 + 60), state.settings.dayStart * 60, state.settings.dayEnd * 60 - 60);
    blockSheet({
      id: null, title: t.title, areaId: t.areaId || state.areas[0].id,
      day: selectedDayIdx, date: iso(d), repeat: "none",
      start, end: start + 60, frog: !!t.frog
    });
  };

  tags.append(areaBtn, frog, plan);
  body.append(ti, tags);

  const del = document.createElement("button");
  del.className = "task__del"; del.innerHTML = "×";
  del.setAttribute("aria-label", "Aufgabe löschen");
  del.onclick = () => {
    state.tasks = state.tasks.filter(x => x.id !== t.id);
    save(); renderTasks(); toastUndo("Aufgabe gelöscht");
  };

  row.append(cb, body, del);
  row.addEventListener("dragstart", e => {
    dragTaskId = t.id; row.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "copy";
    try { e.dataTransfer.setData("text/plain", t.title); } catch (err) {}
  });
  row.addEventListener("dragend", () => { dragTaskId = null; row.classList.remove("is-dragging"); });
  return row;
}

$("#taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#taskInput");
  const v = inp.value.trim();
  if (!v) return;
  state.tasks.unshift({ id: uid(), title: v, areaId: state.areas[0].id, done: false, frog: false });
  inp.value = "";
  save(); renderTasks();
});
$("#goalsEdit").onclick = goalsSheet;

$("#clearDone").onclick = () => {
  const n = state.tasks.filter(t => t.done).length;
  if (!n) { toast("Nichts zu räumen"); return; }
  state.tasks = state.tasks.filter(t => !t.done);
  save(); renderTasks(); toastUndo(n + " erledigt & weggeräumt");
};

/* ============================================================ Tagesform */
const ENERGY = {
  low:  { pomo: [15, 5],  text: "<b>Wenig Energie.</b> Frosch nicht streichen, nur schrumpfen: 15 Minuten anfangen reicht. Sonst Alltagskram und Pausen — das zählt auch." },
  mid:  { pomo: [25, 5],  text: "<b>Normal.</b> Kurz warmlaufen, dann der Frosch. 25 Minuten Fokus, 5 Minuten Pause." },
  high: { pomo: [50, 10], text: "<b>Viel Energie.</b> Frosch zuerst, bevor der Tag ihn frisst. Langer Block: 50 Minuten Fokus, 10 Minuten Pause." },
  none: { pomo: [25, 5],  text: "Wie fühlst du dich heute? Der Plan passt sich an — bei wenig Energie wird der Frosch kleiner statt verschoben." }
};

function currentDayIso() { return iso(addDays(mondayOf(anchor), selectedDayIdx)); }

function renderEnergy() {
  const key = currentDayIso();
  const meta = state.days[key] || {};
  const lvl = meta.energy;
  document.querySelectorAll(".energy__opt").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lvl === lvl));
  });
  const d = addDays(mondayOf(anchor), selectedDayIdx);
  $("#energyDay").textContent = DAY_LONG[selectedDayIdx] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ".";
  const frog = state.tasks.find(t => t.frog && !t.done);
  let html = ENERGY[lvl || "none"].text;
  if (frog) html += "<br><br>🐸 <b>Frosch heute:</b> " + escapeHtml(frog.title);
  $("#energyHint").innerHTML = html;
  renderEnergyAction();
  if (!pomo.running) setPomoFromEnergy();
}
/* ============================================================
   Was kann heute weg?

   Der Tagesform-Schalter hat lange nur den Timer gestellt — er sah aus
   wie ein Regler, der den Plan anpasst, war aber keiner. Das hier ist
   der fehlende Hebel: an einem schwachen Tag zeigt der Planer, was heute
   nicht sein muss, und bietet an, es zu streichen oder zu verschieben.

   Was „muss" ist, entscheidet der Bereich (plan.must) — im Zweifel gilt
   Pflicht, damit nie etwas zum Streichen vorgeschlagen wird, das wichtig war.
   ============================================================ */

function optionalToday() {
  const key = currentDayIso();
  const idx = selectedDayIdx;
  return state.blocks.filter(b => {
    if (b.sug) return false;
    const hier = b.repeat === "weekly" ? b.day === idx : b.date === key;
    if (!hier) return false;
    const area = areaById(b.areaId);
    return !(area.plan && area.plan.must);
  }).sort((a, b) => a.start - b.start);
}

function renderEnergyAction() {
  const box = $("#energyAct");
  if (!box) return;
  box.innerHTML = "";
  const lvl = (state.days[currentDayIso()] || {}).energy;
  if (lvl !== "low") return;

  const weg = optionalToday();
  if (!weg.length) return;

  const b = document.createElement("button");
  b.className = "btn btn--sm";
  b.style.marginTop = "12px";
  b.style.width = "100%";
  b.textContent = "Was kann heute weg? (" + weg.length + ")";
  b.onclick = relieveSheet;
  box.appendChild(b);
}

function relieveSheet() {
  modal((s, close) => {
    const tag = DAY_LONG[selectedDayIdx];
    s.innerHTML =
      "<h2 class='sheet__title'>Was kann heute weg?</h2>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:14px;line-height:1.6'>" +
      "Wenig Energie an diesem " + tag + ". Das hier ist nicht als Pflicht markiert — " +
      "du kannst es streichen oder auf einen anderen Tag schieben. " +
      "Was du stehen lässt, bleibt einfach im Plan.</p>" +
      "<div class='relief' id='reliefList'></div>";

    const list = s.querySelector("#reliefList");

    const paint = () => {
      const weg = optionalToday();
      list.innerHTML = "";
      if (!weg.length) {
        list.innerHTML = "<div class='empty'><b>Nichts mehr offen</b>" +
          "Alles andere an diesem Tag ist als Pflicht markiert.</div>";
        return;
      }
      weg.forEach(blk => {
        const area = areaById(blk.areaId);
        const row = document.createElement("div");
        row.className = "reliefrow";
        row.style.setProperty("--h", area.hue);
        row.innerHTML =
          "<div class='reliefrow__txt'>" +
            "<div class='reliefrow__title'><span class='goal__dot'></span>" + escapeHtml(blk.title) + "</div>" +
            "<div class='reliefrow__time num'>" + fmtTime(blk.start) + "–" + fmtTime(blk.end) +
            (blk.title === area.name ? "" : " · " + escapeHtml(area.name)) + "</div>" +
          "</div>";

        const move = document.createElement("button");
        move.className = "btn btn--sm"; move.type = "button"; move.textContent = "Verschieben";
        move.onclick = () => { close(); moveSheet(blk.id); };

        const del = document.createElement("button");
        del.className = "btn btn--sm btn--danger"; del.type = "button"; del.textContent = "Streichen";
        del.onclick = () => {
          state.blocks = state.blocks.filter(x => x.id !== blk.id);
          save(); renderAll(); paint();
          toastUndo("Gestrichen");
        };

/* Einen Block auf einen anderen Tag schieben — sucht dort die nächste
   freie Stelle, statt ihn blind auf dieselbe Uhrzeit zu setzen. */
function moveSheet(id) {
  const blk = state.blocks.find(x => x.id === id);
  if (!blk) return;
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Verschieben</h2>" +
      "<p style='margin:0 0 6px;font-size:15px'><b>" + escapeHtml(blk.title) + "</b></p>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:14px'>" +
      "Dauer " + fmtDur(blk.end - blk.start) + " · auf welchen Tag?</p>" +
      "<div class='chipset' id='mvDays'></div>" +
      "<div id='mvHint' style='font-size:13px;color:var(--text-faint);margin-top:14px;min-height:18px'></div>";

    const wrap = s.querySelector("#mvDays");
    const hint = s.querySelector("#mvHint");
    const laenge = blk.end - blk.start;
    const heuteKey = iso(new Date());

    weekDays().forEach(day => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.textContent = DAY_SHORT[day.i];
      const vergangen = day.key < heuteKey;
      const selbst = (blk.repeat === "weekly" ? blk.day === day.i : blk.date === day.key);
      c.disabled = vergangen || selbst;
      if (c.disabled) c.style.opacity = ".4";
      c.onclick = () => {
        const platz = freeGaps(day, { from: null, to: null, days: [day.i] })
          .find(g => g.end - g.start >= laenge);
        if (!platz) { hint.textContent = "Am " + DAY_LONG[day.i] + " ist kein Platz von " + fmtDur(laenge) + " frei."; return; }
        blk.repeat = "none";
        blk.day = day.i;
        blk.date = day.key;
        blk.start = platz.start;
        blk.end = platz.start + laenge;
        save(); close(); renderAll();
        toast("Auf " + DAY_LONG[day.i] + ", " + fmtTime(blk.start) + " geschoben");
      };
      wrap.appendChild(c);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    foot.appendChild(cancel);
    s.appendChild(foot);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

document.querySelectorAll(".energy__opt").forEach(btn => {

/* ============================================================ Pomodoro */
const pomo = { running: false, phase: "work", left: 25 * 60, total: 25 * 60, rounds: 0, timer: null };

function setPomoFromEnergy() {
  const meta = state.days[currentDayIso()] || {};
  const [w] = ENERGY[meta.energy || "none"].pomo;
  pomo.phase = "work"; pomo.total = w * 60; pomo.left = w * 60;
  paintPomo();
}
function paintPomo() {
  $("#pomoTime").textContent = pad2(Math.floor(pomo.left / 60)) + ":" + pad2(pomo.left % 60);
  $("#pomoPhase").textContent = pomo.running ? (pomo.phase === "work" ? "Fokus" : "Pause") : (pomo.phase === "work" ? "Bereit" : "Pause");
  const pct = pomo.total ? (1 - pomo.left / pomo.total) * 100 : 0;
  const bar = $("#pomoBar");
  bar.style.width = pct + "%";
  bar.classList.toggle("is-break", pomo.phase === "break");
  $("#pomoStart").textContent = pomo.running ? "Pause" : "Start";
  const meta = state.days[currentDayIso()] || {};
  const [w, b] = ENERGY[meta.energy || "none"].pomo;
  $("#pomoMeta").textContent = w + " min Fokus · " + b + " min Pause" + (pomo.rounds ? " · " + pomo.rounds + " Runden heute" : "");
}
function tick() {
  pomo.left--;
  if (pomo.left <= 0) {
    const meta = state.days[currentDayIso()] || {};
    const [w, b] = ENERGY[meta.energy || "none"].pomo;
    if (pomo.phase === "work") {
      pomo.rounds++; pomo.phase = "break"; pomo.total = b * 60; pomo.left = b * 60;
      toast("Runde geschafft — " + b + " Minuten Pause");
    } else {
      pomo.phase = "work"; pomo.total = w * 60; pomo.left = w * 60;
      toast("Pause vorbei — weiter geht's");
    }
  }
  paintPomo();
}
$("#pomoStart").onclick = () => {
  pomo.running = !pomo.running;
  clearInterval(pomo.timer);
  if (pomo.running) pomo.timer = setInterval(tick, 1000);
  paintPomo();
};
$("#pomoReset").onclick = () => {
  pomo.running = false; clearInterval(pomo.timer);
  setPomoFromEnergy();
};

        "<div class='sheet__row'><label class='label' for='inEmail'>E-Mail</label>" +

      const mail = s.querySelector("#inEmail");
      const pass = s.querySelector("#inPass");
      const msg = s.querySelector("#inMsg");

      s.querySelector("#inSwap").onclick = () => {
        const keepMail = mail.value;
        neu = !neu;
        paint();
        s.querySelector("#inEmail").value = keepMail;
        s.querySelector("#inEmail").focus();
      };

      const foot = document.createElement("div");
      foot.className = "sheet__foot";
      foot.innerHTML = "<span class='spacer'></span>";
      const cancel = document.createElement("button");
      cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
      cancel.onclick = close;
      const ok = document.createElement("button");
      ok.className = "btn btn--primary"; ok.type = "button";
      ok.textContent = neu ? "Konto anlegen" : "Anmelden";

      const go = async () => {
        const e = mail.value.trim(), p = pass.value;
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { msg.textContent = "Bitte eine gültige E-Mail-Adresse."; mail.focus(); return; }
        if (p.length < 6) { msg.textContent = "Das Passwort braucht mindestens sechs Zeichen."; pass.focus(); return; }
        ok.disabled = true;
        msg.textContent = neu ? "Konto wird angelegt …" : "Wird angemeldet …";
        try {
          if (neu) {
            const r = await Sync.signUp(e, p);
            if (r === "confirm") {
              msg.innerHTML = "<b>Fast fertig.</b> Bestätige zuerst den Link in deinem Postfach, dann melde dich hier an.";
              ok.textContent = "Alles klar"; ok.disabled = false; ok.onclick = close;
              return;
            }
          } else {
            await Sync.signInPassword(e, p);
          }
          close();
          await Sync.afterSignIn();
          toast("Angemeldet — dein Plan ist jetzt überall");
        } catch (err) {
          msg.textContent = err.message || "Hat nicht geklappt.";
          ok.disabled = false;
        }
      };
      ok.onclick = go;
      [mail, pass].forEach(f => f.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); go(); }
      }));
      foot.append(cancel, ok);
      s.appendChild(foot);
      mail.focus();
    };
    paint();
  });
}

/* ============================================================ Sichern / Laden */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wochenplaner-" + iso(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  state.backupAt = Date.now();
  save();
  toast("Sicherung gespeichert");
}

/* ============================================================
   Sicherungs-Erinnerung

   Solange der Plan nur im Browser liegt, ist er genau eine gelöschte
   Browser-Historie vom Totalverlust entfernt. Deshalb ein Hinweis —
   aber ein einziger, höchstens alle zwei Wochen, und nur wenn wirklich
   Arbeit drinsteckt. Wer ein Konto hat, sieht ihn nie.
   ============================================================ */
const BACKUP_NAG_DAYS = 14;

function maybeBackupNag() {
  if (!Store.available) return;
  if (Sync.active()) return;
  const stuff = state.blocks.length + state.tasks.length;
  if (stuff < 8) return;                       // zu wenig, um daran zu hängen
  const now = Date.now();
  const span = BACKUP_NAG_DAYS * 86400000;
  if (state.backupAt && now - state.backupAt < span) return;
  if (state.nagAt && now - state.nagAt < span) return;

  state.nagAt = now;
  save();
  setTimeout(() => {
    toast(state.backupAt ? "Letzte Sicherung ist eine Weile her" : "Dein Plan liegt nur in diesem Browser",
      { label: "Sichern", run: exportData });
  }, 2500);
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data !== "object") throw new Error("bad");
        migrate(data);
        state = data;
        save(); closeModal(); renderAll();
        toast("Sicherung geladen");
      } catch (e) {
        toast("Datei konnte nicht gelesen werden");
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

/* ============================================================
   Zusammenführen zweier Stände

   Regel: pro Eintrag gewinnt die neuere Änderung. Ein Grabstein zählt
   wie eine Änderung — ist er neuer als der Eintrag, bleibt gelöscht.
   Das ist bewusst simpel: bei einem Wochenplaner arbeitet praktisch nie
   jemand gleichzeitig auf zwei Geräten am selben Eintrag.
   ============================================================ */
function mergeStates(mine, theirs) {
  const out = JSON.parse(JSON.stringify(mine));
  if (!theirs || typeof theirs !== "object") return out;

  out.tombs = Object.assign({}, out.tombs);
  Object.keys(theirs.tombs || {}).forEach(id => {
    out.tombs[id] = Math.max(out.tombs[id] || 0, theirs.tombs[id] || 0);
  });

  ["blocks", "tasks", "areas"].forEach(c => {
    const byId = new Map();
    (out[c] || []).forEach(r => byId.set(r.id, r));
    (theirs[c] || []).forEach(r => {
      const m = byId.get(r.id);
      if (!m || (r.at || 0) > (m.at || 0)) byId.set(r.id, r);
    });
    out[c] = [...byId.values()].filter(r => (out.tombs[r.id] || 0) <= (r.at || 0));
  });

  out.days = out.days || {};
  Object.keys(theirs.days || {}).forEach(k => {
    const m = out.days[k], t = theirs.days[k];
    if (!m || (t.at || 0) > (m.at || 0)) out.days[k] = t;
  });
  Object.keys(out.days).forEach(k => {
    if ((out.tombs["day:" + k] || 0) > (out.days[k].at || 0)) delete out.days[k];
  });

  if ((theirs.settingsAt || 0) > (out.settingsAt || 0)) {
    out.settings = theirs.settings;
    out.settingsAt = theirs.settingsAt;
  }
  if (!out.profile.name && theirs.profile && theirs.profile.name) out.profile.name = theirs.profile.name;
  out.backupAt = Math.max(out.backupAt || 0, theirs.backupAt || 0);

  // Grabsteine älter als ein halbes Jahr wegräumen
  const cutoff = Date.now() - 180 * 86400000;
  Object.keys(out.tombs).forEach(id => { if (out.tombs[id] < cutoff) delete out.tombs[id]; });

  return out;
}

/* ============================================================
   Abgleich zwischen Geräten (Supabase)

   Ohne eingetragene Zugangsdaten passiert hier nichts — der Planer
   läuft dann genau wie vorher rein lokal. Sobald URL und Schlüssel
   oben in SUPABASE stehen, erscheint in den Einstellungen der
   Konto-Bereich und alles Weitere läuft von selbst.

   Der öffentliche Schlüssel (anon key) darf in dieser Datei stehen —
   er ist dafür gemacht. Geschützt werden die Daten auf dem Server
   durch Row Level Security: jeder sieht nur seine eigene Zeile.
   ============================================================ */

const SESSION_KEY = "wochenplaner.session";

const Sync = (() => {
  let session = null;        // { access_token, refresh_token, expires_at, user_id, email }
  let status = "off";        // off | signedout | syncing | ok | offline | error
  let pending = false;
  let timer = null;

  const configured = () => !!(SUPABASE.url && SUPABASE.key);

  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
    catch (e) { session = null; }
  }
  function storeSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function setStatus(s) { status = s; paintSyncBadge(); }

  async function api(path, opts = {}) {
    const headers = Object.assign({
      "apikey": SUPABASE.key,
      "Content-Type": "application/json"
    }, opts.headers || {});
    if (session && session.access_token) headers["Authorization"] = "Bearer " + session.access_token;
    const res = await fetch(SUPABASE.url.replace(/\/$/, "") + path, Object.assign({}, opts, { headers }));
    if (res.status === 401 && session && session.refresh_token && !opts._retried) {
      const ok = await refresh();
      if (ok) return api(path, Object.assign({}, opts, { _retried: true }));
    }
    return res;
  }

  async function refresh() {
    try {
      const res = await fetch(SUPABASE.url.replace(/\/$/, "") + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE.key, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!res.ok) { storeSession(null); setStatus("signedout"); return false; }
      const d = await res.json();
      storeSession({
        access_token: d.access_token, refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        user_id: (d.user && d.user.id) || (session && session.user_id),
        email: (d.user && d.user.email) || (session && session.email)
      });
      return true;
    } catch (e) { setStatus("offline"); return false; }
  }

  const base = () => SUPABASE.url.replace(/\/$/, "");
  const anonHead = { "apikey": SUPABASE.key, "Content-Type": "application/json" };

  function takeSession(d) {
    storeSession({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Date.now() + (d.expires_in || 3600) * 1000,
      user_id: d.user && d.user.id,
      email: d.user && d.user.email
    });
  }

  /* Anmelden mit E-Mail und Passwort. Funktioniert ohne jede weitere
     Einrichtung — im Gegensatz zum E-Mail-Link, der einen Mailversand
     braucht (siehe unten). */
  async function signInPassword(email, password) {
    const res = await fetch(base() + "/auth/v1/token?grant_type=password", {
      method: "POST", headers: anonHead,
      body: JSON.stringify({ email, password })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = (d.error_description || d.msg || d.message || "").toLowerCase();
      if (m.includes("invalid login") || m.includes("credentials"))
        throw new Error("E-Mail oder Passwort stimmt nicht.");
      throw new Error("Anmeldung hat nicht geklappt.");
    }
    takeSession(d);
    return true;
  }

  async function signUp(email, password) {
    const res = await fetch(base() + "/auth/v1/signup", {
      method: "POST", headers: anonHead,
      body: JSON.stringify({ email, password })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = (d.msg || d.message || d.error_description || "").toLowerCase();
      if (m.includes("already registered") || m.includes("already been registered"))
        throw new Error("Diese Adresse hat schon ein Konto — melde dich einfach an.");
      if (m.includes("password"))
        throw new Error("Das Passwort ist zu kurz — mindestens sechs Zeichen.");
      throw new Error("Konto anlegen hat nicht geklappt.");
    }
    if (d.access_token) { takeSession(d); return "ready"; }
    return "confirm";     // Bestätigungsmail ist eingeschaltet
  }

  /* Anmeldung per Link in der E-Mail — braucht einen eingerichteten
     Mailversand im Supabase-Projekt, sonst kommt die Mail nicht an. */
  async function signInLink(email) {
    const res = await fetch(base() + "/auth/v1/otp", {
      method: "POST", headers: anonHead,
      body: JSON.stringify({
        email, create_user: true,
        options: { email_redirect_to: location.origin + location.pathname }
      })
    });
    if (!res.ok) throw new Error("Der Link konnte nicht verschickt werden.");
    return true;
  }

  /* Nach dem Klick auf den Link kommt das Token im Adress-Anhang zurück. */
  function catchRedirect() {
    if (!location.hash || location.hash.indexOf("access_token") < 0) return false;
    const p = new URLSearchParams(location.hash.slice(1));
    const at = p.get("access_token");
    if (!at) return false;
    storeSession({
      access_token: at,
      refresh_token: p.get("refresh_token"),
      expires_at: Date.now() + (+p.get("expires_in") || 3600) * 1000,
      user_id: null, email: null
    });
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  }

  async function whoAmI() {
    const res = await api("/auth/v1/user");
    if (!res.ok) return null;
    const u = await res.json();
    storeSession(Object.assign({}, session, { user_id: u.id, email: u.email }));
    return u;
  }

  /* Server-Stand holen, mit dem lokalen zusammenführen, Ergebnis anzeigen. */
  async function pull() {
    if (!active()) return;
    setStatus("syncing");
    try {
      const res = await api("/rest/v1/plans?select=data");
      if (!res.ok) { setStatus("error"); return; }
      const rows = await res.json();
      if (rows.length && rows[0].data) {
        const merged = mergeStates(state, rows[0].data);
        migrate(merged);
        state = merged;
        lastSnap = snapshot(state);      // nicht alles als „gerade geändert" stempeln
        lastSavedJson = JSON.stringify(state);
        Store.save(state);
        renderAll();
      }
      setStatus("ok");
      await pushNow();
    } catch (e) { setStatus("offline"); pending = true; }
  }

  async function pushNow() {
    if (!active()) return;
    try {
      const res = await api("/rest/v1/plans", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ user_id: session.user_id, data: state, updated_at: new Date().toISOString() })
      });
      if (!res.ok) { pending = true; setStatus("error"); return; }
      pending = false;
      setStatus("ok");
    } catch (e) { pending = true; setStatus("offline"); }
  }

  function push() {
    if (!active()) return;
    clearTimeout(timer);
    timer = setTimeout(pushNow, 1500);
  }

  function active() { return configured() && !!(session && session.access_token && session.user_id); }

  async function signOut() {
    try { await api("/auth/v1/logout", { method: "POST" }); } catch (e) {}
    storeSession(null);
    Store.setScope("local");
    state = Store.load() || freshState();
    migrate(state);
    lastSnap = snapshot(state);
    lastSavedJson = JSON.stringify(state);
    setStatus("signedout");
    renderAll();
  }

  /* Beim Start: Rücksprung vom E-Mail-Link einsammeln, Konto ermitteln,
     auf den Speicherplatz dieses Kontos umschalten, dann abgleichen. */
  async function boot(opts) {
    if (!configured()) { setStatus("off"); return; }
    const viaLink = catchRedirect();
    // Nur direkt nach einer Anmeldung wird der bisherige lokale Plan
    // übernommen — sonst würde beim Anmelden auf einem fremden Gerät
    // dessen Plan in den eigenen wandern.
    const adopt = viaLink || (opts && opts.adopt);

    if (!session) loadSession();
    if (!session) { setStatus("signedout"); return; }

    if (!session.user_id) {
      const u = await whoAmI();
      if (!u) { setStatus("signedout"); return; }
    }

    Store.setScope(session.user_id);
    const own = Store.load();
    if (own) {
      state = own;
    } else if (adopt) {
      const local = Store.loadScope("local");
      if (local) state = mergeStates(state, local);
    }
    migrate(state);
    lastSnap = snapshot(state);
    lastSavedJson = JSON.stringify(state);
    Store.save(state);
    renderAll();
    await pull();
  }

  return {
    configured, active, signInPassword, signUp, signInLink, signOut, pull, push, boot,
    afterSignIn: () => boot({ adopt: true }),
    get status() { return status; },
    get email() { return session && session.email; },
    retryPending() { if (pending) pushNow(); }
  };
})();

/* Wird bei jedem Speichern aufgerufen — vor der Definition von Sync
   sicher, weil Funktionsdeklarationen vorgezogen werden. */
function syncPush() {
  try { Sync.push(); } catch (e) {}
}

window.addEventListener("online", () => Sync.retryPending());
setInterval(() => Sync.retryPending(), 60000);

/* ============================================================ Konto-Anzeige */
function paintSyncBadge() {
  const el = $("#syncBadge");
  if (!el) return;
  if (!Sync.configured()) { el.hidden = true; return; }
  el.hidden = false;
  const s = Sync.status === "off" ? "signedout" : Sync.status;
  const map = {
    signedout: { t: "Nur hier", cls: "is-off",  title: "Plan liegt nur auf diesem Gerät — zum Anmelden hier klicken" },
    syncing:   { t: "…",        cls: "is-work", title: "Wird abgeglichen" },
    ok:        { t: "Synchron", cls: "is-ok",   title: "Auf allen Geräten aktuell" },
    offline:   { t: "Offline",  cls: "is-warn", title: "Keine Verbindung — wird nachgeholt" },
    error:     { t: "Problem",  cls: "is-warn", title: "Abgleich klemmt — hier klicken" },
    off:       { t: "", cls: "", title: "" }
  };
  const m = map[s] || map.signedout;
  el.textContent = m.t;
  el.title = m.title;
  el.className = "syncbadge " + m.cls;
}

/* ============================================================ Navigation */
$("#prevWeek").onclick = () => { anchor = addDays(mondayOf(anchor), -7); renderAll(); };
$("#nextWeek").onclick = () => { anchor = addDays(mondayOf(anchor), 7); renderAll(); };
$("#todayBtn").onclick = () => {
  anchor = new Date();
  selectedDayIdx = (new Date().getDay() + 6) % 7;
  renderAll();
};
$("#themeBtn").onclick = () => {
  const order = ["auto", "light", "dark"];
  const i = order.indexOf(state.settings.theme);
  state.settings.theme = order[(i + 1) % 3];
  save(); applyTheme();
  toast({ auto: "Folgt dem Gerät", light: "Hell", dark: "Dunkel" }[state.settings.theme]);
};

document.addEventListener("keydown", e => {
  if (openModal) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (e.key === "ArrowLeft") { $("#prevWeek").click(); }
  if (e.key === "ArrowRight") { $("#nextWeek").click(); }
  if (e.key.toLowerCase() === "t") { $("#todayBtn").click(); }
  if (e.key.toLowerCase() === "n") {
    e.preventDefault();
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const s = clamp(snap(new Date().getHours() * 60), state.settings.dayStart * 60, state.settings.dayEnd * 60 - 60);
    newBlock(selectedDayIdx, iso(d), s, s + 60);
  }
});

window.matchMedia(MOBILE_Q).addEventListener("change", e => {
  isMobile = e.matches;
  if (!isMobile) setView("plan");
  renderGrid();
});

/* ============================================================ Ansicht am Handy */
let mview = "plan";

function setView(v) {
  mview = v;
  document.body.dataset.mview = v;
  document.querySelectorAll("#tabbar button").forEach(b => {
    const on = b.dataset.view === v;
    b.setAttribute("aria-current", String(on));
  });
  if (v === "plan") renderGrid();
}

document.querySelectorAll("#tabbar button").forEach(b => {
  b.onclick = () => setView(b.dataset.view);
});

/* Der schwebende Knopf legt den Eintrag dort an, wo gerade Platz ist:
   ab der nächsten vollen Stunde, aber nicht in der Vergangenheit. */
$("#fabAdd").onclick = () => {
  const d = addDays(mondayOf(anchor), selectedDayIdx);
  const { dayStart, dayEnd } = state.settings;
  const heute = iso(d) === iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();
  let s = heute ? Math.ceil((jetzt + 5) / 30) * 30 : 9 * 60;
  s = clamp(s, dayStart * 60, dayEnd * 60 - 60);
  newBlock(selectedDayIdx, iso(d), s, s + 60);
};

/* ============================================================ Erststart */
function maybeWelcome() {
  if (state.blocks.length || state.tasks.length || state.profile.name) return;
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Deine Woche, dein Rhythmus</h2>" +
      "<p style='margin:0 0 16px;color:var(--text-muted);font-size:14.5px;line-height:1.6'>" +
      "Nichts ist vorgegeben — du trägst ein, was zu dir passt.</p>" +
      "<ul style='margin:0 0 20px;padding-left:20px;color:var(--text-muted);font-size:14px;line-height:1.75'>" +
      "<li><b style='color:var(--text)'>Eintragen:</b> aufs Plus tippen oder ins Raster ziehen.</li>" +
      "<li><b style='color:var(--text)'>Ohne feste Uhrzeit:</b> als Wochenziel in Stunden — z.B. 10 h Lernen. " +
      "Der Planer schlägt vor, wie sich das über die Woche verteilen lässt.</li>" +
      "<li><b style='color:var(--text)'>Pausen zählen:</b> Serienabend und Nichtstun dürfen genauso im Plan stehen wie Arbeit.</li>" +
      "</ul>" +
      "<div class='sheet__row'><label class='label' for='wName'>Wie heißt du?</label>" +
      "<input class='field' id='wName' placeholder='Optional' autocomplete='off'></div>";
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Los geht's";
    const go = () => {
      state.profile.name = s.querySelector("#wName").value.trim();
      save(); close(); renderHeader();
    };
    ok.onclick = go;
    s.querySelector("#wName").addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
    foot.appendChild(ok);
    s.appendChild(foot);
  });
}

/* ============================================================ Start */
function renderAll() {
  renderHeader();
  renderDaySwitch();
  renderGrid();
  renderTasks();
  renderGoals();
  renderEnergy();
  paintPomo();
}

if (!Store.available) {
  $("#banner").innerHTML =
    "<div class='banner'><b>Vorschau-Modus:</b> Hier werden Änderungen nicht gespeichert. " +
    "Lade die Datei herunter und öffne sie direkt im Browser — dann bleibt alles erhalten.</div>";
}

$("#syncBadge").onclick = () => {
  if (!Sync.configured()) return;
  if (!Sync.active()) signInSheet();
  else { Sync.pull(); toast("Wird abgeglichen …"); }
};

applyTheme();
setView("plan");
renderAll();
paintSyncBadge();

Sync.boot()
  .catch(() => {})
  .then(() => {
    maybeWelcome();
    maybeBackupNag();
  });

setInterval(() => { if (!openModal) renderGrid(); }, 60000);
// Beim Zurückkommen auf den Tab: kurz nachsehen, ob woanders was passiert ist
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Sync.active()) Sync.pull();
});
</script>
</body>
</html>
