  let mon = mondayOf(new Date(jahr, monatIdx, 1));
  while (gehoertDazu(mon) || gehoertDazu(addDays(mon, 6))) {
    montage.push(mon);
    mon = addDays(mon, 7);
  }
  return montage;
}

/* Belegung einer Woche, billig gerechnet für die KW-Rinne: Summe
   dauerVon() aller Blöcke (inkl. Serien über onDay(), auch Vorschläge —
   wie tagesAuslastung()) geteilt durch die wachen Minuten der Woche.
   BEWUSST kein Ersatz für wochenKapazitaet(): die zählt zusätzlich offene
   Wochenziele/Aufgaben ein und klemmt die laufende Woche auf "ab jetzt"
   (Stufe A) — hier reicht "wie voll ist die Woche schon", für jede Woche
   (vergangen, laufend, künftig) gleich gerechnet, damit die Rinne beim
   Blättern nicht plötzlich die Rechenart wechselt. */
function wochenBelegung(mon) {
  let wach = 0, belegt = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), key = iso(d);
    let tagWach = (state.settings.dayEnd - state.settings.dayStart) * 60;
    restSpans().forEach(r => {
      tagWach -= Math.max(0, Math.min(state.settings.dayEnd * 60, r.end)
                        - Math.max(state.settings.dayStart * 60, r.start));
    });
    wach += Math.max(0, tagWach);
    state.blocks.forEach(b => { if (onDay(b, key, i)) belegt += dauerVon(b); });
  }
  return wach ? belegt / wach : 0;
}

function monatSheet(startDatum) {
  modal((s, close) => {
    const heute = new Date();
    const todayIso = iso(heute);
    const heuteMon = mondayOf(heute);
    // Start = Monat der Anzeige-Woche — jahr/monatIdx sind rein lokal, das
    // bloße Blättern hier fasst den globalen anchor nie an. Vorgabe bleibt
    // anchor; Stufe M3.1 gibt dem Titel-Zoom aus freizeitSheet() einen
    // eigenen Startpunkt mit (Monat der zuletzt DORT gezeigten Woche).
    const start = mondayOf(startDatum || anchor);
    let jahr = start.getFullYear(), monatIdx = start.getMonth();

    s.innerHTML =
      "<div class='weeknav' style='margin-bottom:var(--s-3)'>" +
        "<button type='button' class='btn btn--icon btn--ghost' id='monatPrev' aria-label='Vorheriger Monat'>‹</button>" +
        "<h2 class='sheet__title' id='monatTitel' style='margin:0;flex:1;text-align:center'></h2>" +
        "<button type='button' class='btn btn--icon btn--ghost' id='monatNext' aria-label='Nächster Monat'>›</button>" +
        "<button type='button' class='btn btn--sm' id='monatHeute' hidden>Heute</button>" +
      "</div>" +
      "<div class='monatgrid' id='monatGrid'></div>" +
      "<div class='monatfuss' id='monatFuss' hidden></div>";

    const titelEl = s.querySelector("#monatTitel");
    const gridEl = s.querySelector("#monatGrid");
    const fussEl = s.querySelector("#monatFuss");
    const heuteBtn = s.querySelector("#monatHeute");

    // Zeichnet Titel + Raster für den aktuell gewählten Monat (jahr/
    // monatIdx) neu — beim Öffnen und nach jedem Klick auf ‹/›/Heute.
    const zeichnen = () => {
      // Stufe M3.4: die Jahreszahl steckt in einem eigenen <span>, das
      // unter 360px verschwindet (Responsive-Regel, s. dort) — vier der
      // zwölf Monatsnamen brechen sonst mit sichtbarem "Heute"-Knopf
      // zweizeilig um. textContent bleibt für Prüfskripte unverändert
      // "September 2026" (display:none entfernt keinen Text aus dem DOM).
      titelEl.innerHTML = MONTHS[monatIdx] + " <span class='monat__jahr'>" + jahr + "</span>";
      heuteBtn.hidden = jahr === heute.getFullYear() && monatIdx === heute.getMonth();

      const montage = monatMontage(jahr, monatIdx);

      let html = "<div class='monatgrid__lab' aria-hidden='true'>KW</div>"
        + DAY_SHORT.map(t => "<div class='monatgrid__lab'>" + t + "</div>").join("");

      montage.forEach(mon => {
        const monIso = iso(mon);
        const vergangeneWoche = monIso < iso(heuteMon);
        const kuenftigeWoche = monIso > iso(heuteMon);
        const belegung = wochenBelegung(mon);

        // Stufe M3.2: aktuelle und vergangene Wochen öffnen jetzt das
        // Wochen-Blatt (freizeitSheet()) in genau dieser Woche — vergangene
        // bleiben dabei optisch gedimmt (is-past), sind aber nicht mehr
        // disabled (Rückblick möglich, s. Bericht). Künftige Wochen
        // behalten ihr "+" (planeWoche() durchs Gate). aria-label nennt
        // jetzt die Handlung statt der Auslastung — die % stehen sichtbar
        // im Knopf selbst (.monatweek__pct).
        const kwAria = kuenftigeWoche ? ("KW " + isoWeek(mon) + " planen") : ("KW " + isoWeek(mon) + " ansehen");
        html += "<button type='button' class='monatweek"
          + (vergangeneWoche ? " is-past" : "") + (kuenftigeWoche ? " is-future" : "") + "'"
          + " data-monday='" + monIso + "' aria-label='" + kwAria + "'>"
          + "<b>" + isoWeek(mon) + "</b>"
          + "<span class='monatweek__pct'>" + Math.round(belegung * 100) + "%</span>"
          + (kuenftigeWoche ? "<span class='monatweek__plus' aria-hidden='true'>+</span>"
            // Symmetrie-Prinzip: ansehbare Wochen (aktuell + vergangen) sind seit M3
            // ebenso antippbar wie künftige, trugen aber kein Zeichen dafür — jetzt
            // ein dezentes "›" an derselben Stelle, gleiche Klasse/Dämpfung wie "+".
            : "<span class='monatweek__plus' aria-hidden='true'>&rsaquo;</span>")
          + "</button>";

        for (let i = 0; i < 7; i++) {
          const d = addDays(mon, i);
          const key = iso(d);
          // Außermonatliche Tage bleiben leer statt gedimmt lesbar — bei
          // 320px sind selbst die eigenen Zahlen schon knapp, zwei
          // Monate gleichzeitig lesbar zu halten wäre unruhiger als
          // hilfreich (Entscheidung dokumentiert im Bericht).
          if (d.getFullYear() !== jahr || d.getMonth() !== monatIdx) {
            // data-date auch hier, rein für Prüfskripte (haakelt an keiner
            // Interaktion) — sonst ließe sich "beide Monatsränder korrekt"
            // nur über die Position im Grid prüfen statt über das Datum.
            html += "<div class='monatcell monatcell--leer' data-date='" + key + "'></div>";
            continue;
          }
          const frei = istFrei(key);
          const last = tagesAuslastung({ key, i });
          const istHeute = key === todayIso;
          const vergangen = key < todayIso;
          // Dieselbe Formulierung wie im Tagwechsler (renderDaySwitch,
          // ~2820) statt einer neu erfundenen Prozentzahl — last.quote
          // ist relativ zur 65%-Planungsgrenze, nicht zum Tag selbst,
          // eine daraus gebaute "NN% verplant"-Zeile wäre irreführend.
          const wieVoll = frei ? "freigehalten"
            : last.min < 15 ? "nichts geplant"
            : fmtDur(last.min) + " geplant" + (last.quote > 1 ? " — das wird eng" : "");
          const label = DAY_LONG[i] + ", " + d.getDate() + ". " + MONTHS[monatIdx] + " — " + wieVoll;

          html += "<button type='button' class='monatcell"
            + (frei ? " is-frei" : "") + (last.quote > 1 ? " is-voll" : "")
            + (istHeute ? " is-today" : "") + (vergangen ? " is-vergangen" : "") + "'"
            + " style='--last:" + Math.round(clamp(last.quote, 0, 1) * 100) + "%'"
            + " data-date='" + key + "' aria-label='" + label + "'>"
            + "<b>" + d.getDate() + "</b><i class='monatcell__bar'></i>"
            + "</button>";
        }
      });
      gridEl.innerHTML = html;

      // Fußzeile: nur wenn der angezeigte Monat die Woche des echten
      // Heute trägt UND der globale anchor selbst schon auf ihr steht —
      // wochenKapazitaet() rechnet immer für die Woche von anchor, den
      // dieses Blatt beim Blättern nie anfasst (s.o.). Stünde anchor
      // anderswo, wäre die Zahl die einer anderen Woche, als die Zeile
      // behauptet — dann lieber schweigen als falsch beschriften.
      const zeigtHeuteWoche = montage.some(mon => iso(mon) === iso(heuteMon));
      if (zeigtHeuteWoche && istDieseWoche()) {
        const k = wochenKapazitaet();
        const pct = Math.round(k.quote * 100);
        // Dieselbe Deckelung wie ampelZeichnen() (~3519): über 200% ist im
        // wach->0-Randfall (Sonntagabend, offenes Ziel) kein ehrlicher Wert
        // mehr, nur noch Lärm.
        fussEl.hidden = false;
        fussEl.textContent = "KW " + isoWeek(heuteMon) + " · Rest der Woche zu "
          + (pct > 200 ? "über 200" : pct) + " % verplant";
      } else {
        fussEl.hidden = true;
      }
    };
    zeichnen();

    // Ein Listener für das ganze Raster statt bis zu 48 einzelner — Klick
    // delegiert über data-date/data-monday, dieselbe Zeichnen-Instanz
    // bleibt bei ‹/›/Heute wiederverwendbar.
    gridEl.addEventListener("click", e => {
      // :not(.monatcell--leer): außermonatliche Füllzellen tragen data-date
      // nur für Prüfskripte (s.o.) — sie sind <div>s ohne Tipp-Funktion.
      const tagBtn = e.target.closest(".monatcell[data-date]:not(.monatcell--leer)");
      if (tagBtn) {
        const d = new Date(tagBtn.dataset.date + "T12:00:00");
        close();
        anchor = mondayOf(d);
        selectedDayIdx = (d.getDay() + 6) % 7;
        setView("plan");
        renderAll();
        return;
      }
      const kwBtn = e.target.closest(".monatweek[data-monday]");
      if (!kwBtn) return;
      const montag = new Date(kwBtn.dataset.monday + "T12:00:00");
      const kuenftig = kwBtn.classList.contains("is-future");
      // Blatt schließt VOR dem Wochenwechsel/Gate — dieselbe Begründung
      // wie im Ritual und an anlegen() (Stufe D): planeWoche() kann über
      // verteilenMitGate() selbst ein Blatt öffnen, und die Zeichnen-
      // Funktion hier hängt an beim Öffnen eingefrorenen Werten.
      close();
      if (kuenftig) {
        // setView() hier und nicht in planeWoche() selbst: die Funktion
        // bedient auch planeNaechsteWoche() (die drei älteren Verteil-
        // Einstiege), deren Aufrufer nie zur Planansicht wechseln sollten.
        setView("plan");
        planeWoche(montag);
      } else {
        // Stufe M3.2: aktuelle/vergangene Woche zoomt ins Wochen-Blatt statt
        // in den Plan — anchor bleibt unangetastet (Kerninvariante dieser
        // Stufe), in den Tag springt man von dort per Zeilen-Tipp.
        freizeitSheet(montag);
      }
    });

    s.querySelector("#monatPrev").onclick = () => {
      monatIdx--; if (monatIdx < 0) { monatIdx = 11; jahr--; } zeichnen();
    };
    s.querySelector("#monatNext").onclick = () => {
      monatIdx++; if (monatIdx > 11) { monatIdx = 0; jahr++; } zeichnen();
    };
    heuteBtn.onclick = () => { jahr = heute.getFullYear(); monatIdx = heute.getMonth(); zeichnen(); };

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const okBtn = document.createElement("button");
    okBtn.className = "btn btn--primary"; okBtn.type = "button"; okBtn.textContent = "Fertig";
    okBtn.onclick = close;
    foot.appendChild(okBtn);
    s.appendChild(foot);
  });
}

/* ============================================================ Blöcke einer Spalte */
/* „Serie" heisst: wiederholt sich, egal in welchem Rhythmus. Dieses eine Tor
   entscheidet für alle Stellen, die nur zwischen einmalig und wiederkehrend
   unterscheiden wollen — eine vergessene Einzelabfrage auf "weekly" würde
   einen zweiwöchentlichen Termin sonst lautlos wie einen einmaligen behandeln. */
function istSerie(b) { return b.repeat === "weekly" || b.repeat === "2wochen"; }

/* Liegt dieser Block an diesem Tag?

   Wöchentliche Blöcke galten bisher für *jeden* passenden Wochentag — auch für
   Wochen, die längst vorbei sind. Wer im August „Sport montags" anlegt, hatte
   damit rückwirkend auch jeden Montag im Januar erfüllt. „since" ist das Datum,
   ab dem die Serie gilt; bei alten Daten setzt migrate() es auf das Anlegedatum.

   Zweiwöchentliche Blöcke ("2wochen") brauchen zusätzlich eine Parität: sie
   gelten nur in jeder zweiten Woche, gezählt ab der Woche von „since". */
function onDay(b, dayKey, dayIdx) {
  if (!istSerie(b)) return b.date === dayKey;
  if (b.ausnahmen && b.ausnahmen.includes(dayKey)) return false;
  if (b.day !== dayIdx) return false;
  if (b.since && dayKey < b.since) return false;
  if (b.repeat === "2wochen" && b.since) {
    // Ganze Wochen zwischen dem Montag von since und dem Montag von dayKey.
    // Math.round ist Pflicht, nicht Kosmetik: eine Woche hat an den
    // Umstellungswochenenden nicht exakt 7×24h (6,958 oder 7,042 Tage durch
    // die Sommerzeit) — ohne Runden geriete der Rhythmus dort kurz aus dem Takt.
    const a = mondayOf(new Date(b.since + "T12:00:00"));
    const z = mondayOf(new Date(dayKey + "T12:00:00"));
    if (Math.round((z - a) / 604800000) % 2 !== 0) return false;
  }
  return true;
}

/* Fürs Raster: nur Blöcke mit fester Uhrzeit. Grobe hängen an einem
   Tagesabschnitt und stehen im Band darunter. */
function blocksFor(date, dayIdx) {
  const key = iso(date);
  return state.blocks.filter(b => !b.grob && onDay(b, key, dayIdx))
    .sort((a, b) => a.start - b.start);
}

/* Die groben eines Tages, nach Abschnitt sortiert. */
function grobeFor(dayKey, dayIdx) {
  const rang = { vm: 0, nm: 1, ab: 2 };
  return state.blocks.filter(b => b.grob && onDay(b, dayKey, dayIdx))
    .sort((a, b) => (rang[a.teil] - rang[b.teil]) || (b.dauer - a.dauer));
}

/* ============================================================
   Agenda — exakte und grobe Blöcke eines Tages zu EINER Liste gemischt
   (Stufe 4). Grobe reihen sich über den Beginn ihres Abschnitts ein, tragen
   aber keine eigene Uhrzeit — das entscheidet renderAgenda() bei der
   Darstellung, hier geht es nur um die Reihenfolge. Vorschläge (b.sug)
   zählen nicht mit: die Agenda zeigt, was gilt, nicht, was der Verteiler
   anbietet. */
function tagesAgenda(dayKey, dayIdx) {
  const exakt = blocksFor(addDays(mondayOf(anchor), dayIdx), dayIdx)
    .filter(b => !b.sug)
    .map(b => ({ block: b, grob: false, sortMin: b.start }));
  const grobe = grobeFor(dayKey, dayIdx)
    .filter(b => !b.sug)
    .map(b => ({ block: b, grob: true, sortMin: abschnittVon(b.teil).von }));
  return [...exakt, ...grobe].sort((a, b) => a.sortMin - b.sortMin);
}

/* Freie Zeit nach dem letzten (oder gerade laufenden) Eintrag — für die
   Fußzeile der Agenda. Einfacher als freeGaps() (2299): keine
   bereichsabhängigen Wegzeiten, nur Blöcke mit Uhrzeit und die Nachtruhe
   zählen als belegt. */
function freieZeitDanach(dayKey, dayIdx) {
  const { dayStart, dayEnd } = state.settings;
  let start = dayStart * 60;
  if (dayKey === iso(new Date())) {
    start = Math.max(start, new Date().getHours() * 60 + new Date().getMinutes());
  }
  const ende = dayEnd * 60;
  if (ende <= start) return null;

  const busy = state.blocks.filter(b => !b.grob && !b.sug && onDay(b, dayKey, dayIdx))
    .map(b => ({ start: b.start, end: b.end }))
    .concat(restSpans())
    .filter(s => s.end > start && s.start < ende)
    .sort((a, b) => a.start - b.start);

  let cursor = start, total = 0, longest = 0;
  busy.forEach(s => {
    const a = Math.max(s.start, start), e = Math.min(s.end, ende);
    if (a > cursor) { const len = a - cursor; total += len; longest = Math.max(longest, len); }
    cursor = Math.max(cursor, e);
  });
  if (ende > cursor) { const len = ende - cursor; total += len; longest = Math.max(longest, len); }
  return { total, longest };
}

/* Überlappungen nebeneinander legen */
function layout(items) {
  const cols = [];
  const placed = items.map(b => ({ b, col: 0, of: 1 }));
  placed.forEach(p => {
    let c = 0;
    while (cols[c] && cols[c] > p.b.start) c++;
    cols[c] = p.b.end;
    p.col = c;
  });
  const groups = [];
  let cur = [], curEnd = -1;
  placed.forEach(p => {
    if (p.b.start >= curEnd && cur.length) { groups.push(cur); cur = []; }
    cur.push(p); curEnd = Math.max(curEnd, p.b.end);
  });
  if (cur.length) groups.push(cur);
  groups.forEach(g => { const n = Math.max(...g.map(p => p.col)) + 1; g.forEach(p => p.of = n); });
  return placed;
}

/* ============================================================
   Wochenziele — Stunden pro Woche statt fester Uhrzeit.

   Ein Bereich kann ein Wochenziel haben ("10 h Lernen"). Der Planer
   zählt, wie viel davon schon im Raster steht, und kann den Rest auf
   Vorschlag verteilen. Vorschläge sind normale Blöcke mit sug:true —
   dadurch lassen sie sich ziehen und ziehen wie alles andere, zählen
   aber erst als erledigt geplant, wenn sie angenommen wurden.

   Bewusst kein Übertrag in die nächste Woche: eine nicht volle Woche
   ist kein Fehler, und ein wachsender Schuldenberg wäre das Gegenteil
   von dem, was dieser Planer sein soll.
   ============================================================ */

function weekDays() {
  const mon = mondayOf(anchor);
  return [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(mon, i);
    return { i, d, key: iso(d) };
  });
}

/* Minuten eines Bereichs in der angezeigten Woche.
   sug=false: echte Einträge · sug=true: offene Vorschläge */
/* ============================================================
   Abhaken

   Ein wöchentlicher Eintrag ist derselbe Datensatz in jeder Woche — ein
   Häkchen am Block würde ihn in allen Wochen als erledigt zeigen. Darum
   hängt das Häkchen am Paar aus Eintrag und Datum.

   Warum überhaupt von Hand abhaken, wenn die App die Zeiten kennt? Weil
   selbst festgehaltener Fortschritt messbar stärker wirkt als automatisch
   mitgeschriebener — und weil nur der Mensch weiß, ob die geplante Stunde
   wirklich stattgefunden hat.
   ============================================================ */

function hakenKey(b, dayKey) { return b.id + "|" + (istSerie(b) ? dayKey : b.date); }

function istErledigt(b, dayKey) {
  const e = state.erledigt[hakenKey(b, dayKey)];
  return !!(e && e.on);
}
function setzeErledigt(b, dayKey, on) {
  state.erledigt[hakenKey(b, dayKey)] = { on: !!on, at: Date.now() };
  // Stufe 12: gehört der Block zu einer Aufgabe, hakt das dieselbe Aufgabe
  // mit ab — die Aufgabenliste zeigt sie dann als erledigt statt als
  // Duplikat, das man dort noch einmal von Hand abhaken müsste.
  if (b.taskId) {
    const t = state.tasks.find(x => x.id === b.taskId);
    if (t) t.done = !!on;
  }
}

/* ============================================================
   Freude (v1.33)

   Abhaken ist der Moment, in dem der Plan Wirklichkeit wird — der einzige,
   der eine Reaktion verdient. Klein beim einzelnen Haken (ein paar
   Schnipsel im Farbton des Bereichs), größer, wenn damit ein Wochenziel
   erreicht oder der ganze Tag abgehakt ist, dann auch mit einem Satz.
   Nie beim Aufheben eines Hakens, nie bei „Bewegung reduzieren", nie mehr
   als einmal je Tag bzw. Ziel und Sitzung. Rein darstellend: nichts davon
   landet in state.
   ============================================================ */
/* Handgezogene Welle unter dem Tagesschwerpunkt, im Farbton seines Bereichs.
   Die Farbe steht im SVG selbst — ein data:-Bild kennt keine CSS-Variablen. */
function kringel(hue) {
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='18' height='7' viewBox='0 0 18 7'>"
    + "<path d='M0 4.5 Q4.5 0.5 9 4.5 T18 4.5' fill='none' stroke-width='2' stroke-linecap='round' style='stroke:oklch(0.68 0.15 " + (+hue || 150) + ")'/></svg>";
  return "url(&quot;data:image/svg+xml," + encodeURIComponent(svg) + "&quot;)";
}

function gruss() {
  const h = new Date().getHours();
  const name = (state.profile && state.profile.name || "").trim();
  // v1.40: morgens und nachts mit Zeichen — Sonne bzw. Glitzersterne.
  if (h >= 22 || h < 5) return (name ? "Schlaf was Schönes, " + name : "Schlaf was Schönes") + " ✨";
  if (h < 11) return (name ? "Einen wunderschönen guten Morgen, " + name : "Einen wunderschönen guten Morgen") + " ☀️";
  const wort = h < 14 ? "Mahlzeit" : h < 18 ? "Hallihallöchen" : "Guten Abend";
  return name ? wort + ", " + name : wort;
}

/* v1.42 „Stundensteine": statt Konfetti klackt ein Stein in Bereichsfarbe
   in die Mulde — fällt hinein, staucht kurz, federt zurück — und ein paar
   Splitter springen ab (Entwurf B). Der Stein ist ein eigenes, festes
   Element über dem Haken: der Aufrufer zeichnet die Liste gleich danach neu,
   der Haken selbst ist dann schon ein anderer Knoten. gross (Wochenziel
   geschafft, Tag ganz abgehakt) wirft nur mehr Splitter weiter — keinen
   zweiten Stein, keinen Konfettiregen. Alles trägt .jubel: fest, nie
   anklickbar, räumt sich selbst weg. */
function jubel(el, hue, gross) {
  if (!el || !el.getBoundingClientRect || !document.body.animate) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return;
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  // hue null: ein Haken ohne Bereich (Aufgabe) — dann fällt ein Jade-Stein.
  const farbe = hue == null ? "var(--jade)" : "oklch(var(--stone-L) var(--stone-C) " + (+hue || 150) + ")";
  const teil = (klasse, w, h) => {
    const s = document.createElement("i");
    s.className = "jubel " + klasse; s.setAttribute("aria-hidden", "true");
    s.style.left = (x - w / 2) + "px"; s.style.top = (y - h / 2) + "px";
    s.style.width = w + "px"; s.style.height = h + "px"; s.style.background = farbe;
    document.body.appendChild(s);
    return s;
  };
  if (!gross) {
    const d = Math.max(12, Math.min(r.width, r.height, 32));
    const stein = teil("jubel--stein", d, d);
    stein.style.setProperty("--d", d + "px");
    const a = stein.animate([
      { transform: "translateY(-22px) scale(.7)", opacity: 0 },
      { transform: "translateY(0) scale(1)", opacity: 1, offset: 0.55 },
      { transform: "scale(1.14, .82)", offset: 0.72 },
      { transform: "scale(.96, 1.05)", offset: 0.88 },
      { transform: "none", opacity: 1 }
    ], { duration: 380, easing: "cubic-bezier(.4, 0, .3, 1)" });
    a.onfinish = a.oncancel = () => stein.remove();
    // Der neu gezeichnete Haken darunter zeigt seinen Stein erst, wenn der
    // fallende ankommt — sonst fiele ein Stein auf einen Stein. Gesucht wird
    // er im nächsten Bild an derselben Stelle (der Aufrufer zeichnet direkt
    // nach abhaken() neu).
    const art = el.classList[0], name = el.getAttribute("aria-label"), id = el.dataset ? el.dataset.id : null;
    requestAnimationFrame(() => {
      const ziel = document.elementsFromPoint(x, y).find(n => n.matches && n.matches("input[type=checkbox]:checked")
        && n.classList[0] === art && n.getAttribute("aria-label") === name && (!id || n.dataset.id === id));
      if (!ziel) return;
      ziel.classList.add("is-landend");
      setTimeout(() => ziel.classList.remove("is-landend"), 210);
    });
  }
  // Splitter: ein Fächer nach oben, leicht gestreut, mit etwas Schwerkraft.
  const n = gross ? 9 : 4;
  const von = gross ? -170 : -150, bis = gross ? -10 : -30;
  for (let i = 0; i < n; i++) {
    const g = gross ? 9 : 8;
    const s = teil("jubel--splitter", g, g);
    const w = (von + (bis - von) * (i / (n - 1)) + (Math.random() * 16 - 8)) * Math.PI / 180;
    const weit = gross ? 38 + Math.random() * 22 : 22 + Math.random() * 10;
    const dx = Math.cos(w) * weit, dy = Math.sin(w) * weit;
    const a = s.animate([
      { transform: "translate(0, 0) scale(.6)", opacity: 0 },
      { transform: "translate(" + dx * 0.5 + "px, " + dy * 0.5 + "px) scale(1)", opacity: 1, offset: 0.25 },
      { transform: "translate(" + dx + "px, " + (dy + (gross ? 16 : 10)) + "px) scale(.5)", opacity: 0 }
    ], { duration: gross ? 680 : 520, delay: gross ? 240 : 200, easing: "cubic-bezier(.2, .7, .3, 1)", fill: "backwards" });
    a.onfinish = a.oncancel = () => s.remove();
  }
}
/* „+1 h Sport" schwebt kurz über dem Haken auf (Entwurf B). Der Wert ist
   die Dauer des abgehakten Eintrags (dauerVon()), der Name der des Bereichs —
   Nutzertext, deshalb textContent. */
function jubelSchweben(el, text) {
  if (!el || !el.getBoundingClientRect || !document.body.animate) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return;
  const s = document.createElement("span");
  s.className = "jubel jubel--schwebt"; s.setAttribute("aria-hidden", "true");
  s.textContent = text;
  document.body.appendChild(s);
  const w = s.offsetWidth;
  s.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  s.style.top = Math.max(8, r.top - 36) + "px";
  const a = s.animate([
    { transform: "translateY(8px)", opacity: 0 },
    { transform: "translateY(0)", opacity: 1, offset: 0.2 },
    { transform: "translateY(-6px)", opacity: 1, offset: 0.75 },
    { transform: "translateY(-16px)", opacity: 0 }
  ], { duration: 1000, delay: 200, easing: "ease-out", fill: "backwards" });
  a.onfinish = a.oncancel = () => s.remove();
}

const gefeiert = new Set();
/* Haken setzen und, wenn er gesetzt wird, darauf antworten. el ist der
   Knopf/Haken, von dem die Schnipsel ausgehen. Der Aufrufer speichert und
   zeichnet danach wie bisher selbst. */
function abhaken(b, dayKey, on, el) {
  const area = areaById(b.areaId);
  const ziel = area && area.plan ? area.plan.goal * 60 : 0;
  const vorher = ziel ? areaIst(area.id) : 0;
  // Nur ein echter Wechsel auf „erledigt" wird gefeiert — der Blockeditor
  // reicht beim Speichern auch einen schon gesetzten Haken durch.
  const schon = istErledigt(b, dayKey);
  setzeErledigt(b, dayKey, on);
  if (!on || schon) return;
  jubel(el, area ? area.hue : 150, false);
  const dauer = dauerVon(b);
  if (area && dauer > 0) jubelSchweben(el, "+" + fmtDur(dauer) + " " + area.name);
  const nachher = ziel ? areaIst(area.id) : 0;
  const zielKey = "ziel|" + area.id + "|" + iso(mondayOf(anchor));
  if (ziel && vorher < ziel && nachher >= ziel && !gefeiert.has(zielKey)) {
    gefeiert.add(zielKey);
    jubel(el, area.hue, true);
    toast(area.name + ": Wochenziel geschafft. Stark.");
    return;
  }
  if (dayKey === iso(new Date()) && !gefeiert.has("tag|" + dayKey)) {
    const idx = (new Date(dayKey + "T12:00:00").getDay() + 6) % 7;
    if (iso(addDays(mondayOf(anchor), idx)) !== dayKey) return;
    const eintraege = tagesAgenda(dayKey, idx);
    if (eintraege.length >= 2 && eintraege.every(e => istErledigt(e.block, dayKey))) {
      gefeiert.add("tag|" + dayKey);
      jubel(el, area ? area.hue : 150, true);
      toast("Alles abgehakt. Der Rest des Tages gehört dir.");
    }
  }
}

/* Wie viel von einem Bereich in dieser Woche wirklich stattgefunden hat. */
function areaIst(areaId) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId || b.sug) return;
      if (onDay(b, day.key, day.i) && istErledigt(b, day.key)) sum += dauerVon(b);
    });
  });
  return sum;
}

/* Alle Einträge einer Woche, chronologisch — Grundlage für den Rückblick. */
function wocheEintraege(mon) {
  const out = [];
  [0, 1, 2, 3, 4, 5, 6].forEach(i => {
    const key = iso(addDays(mon, i));
    state.blocks.forEach(b => {
      if (b.sug) return;
      if (onDay(b, key, i)) out.push({ b, key, i });
    });
  });
  return out.sort((x, y) => x.i - y.i || (x.b.start || 0) - (y.b.start || 0));
}

function areaMinutes(areaId, sug) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId) return;
      if (!!b.sug !== !!sug) return;
      if (onDay(b, day.key, day.i)) sum += dauerVon(b);
    });
  });
  return sum;
}

/* v1.42, nur für die Steine: wie viel eines Bereichs in der gezeigten Woche
   ohne Uhrzeit (b.grob) verplant und noch nicht abgehakt ist. Derselbe Gang
   über die Blöcke wie areaMinutes() — keine Verteiler- oder Kapazitätsrechnung. */
function areaGrobOffen(areaId) {
  let sum = 0;
  weekDays().forEach(day => {
    state.blocks.forEach(b => {
      if (b.areaId !== areaId || b.sug || !b.grob) return;
      if (onDay(b, day.key, day.i) && !istErledigt(b, day.key)) sum += dauerVon(b);
    });
  });
  return sum;
}

function hasSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  return state.blocks.some(b => b.sug && keys.has(b.date));
}

/* Stunden lesbar: 90 → „1,5 h", 45 → „45 min" */
function fmtDur(min) {
  if (min <= 0) return "0 h";
  if (min < 60) return min + " min";
  const h = min / 60;
  return (Math.round(h * 10) / 10).toString().replace(".", ",") + " h";
}

/* ============================================================
   Nachtruhe

   Die Zeitspannen eines Tages, die zur Nacht gehören — Schlaf plus die
   Ruhezeit davor und danach. Zurückgegeben als Minuten seit Mitternacht
   des jeweiligen Tages, denn der Schlaf läuft über den Tageswechsel:
   22:00 abends und 6:30 früh sind zwei Abschnitte desselben Kalendertags.
   ============================================================ */
function restSpans() {
  const sl = state.settings.sleep;
  if (!sl || !sl.on) return [];
  const w = sl.wind || 0;
  const from = sl.from, to = sl.to;

  if (from > to) {
    // Normalfall: über Mitternacht. Abends ab „from - Ruhezeit",
    // morgens bis „to + Ruhezeit".
    return [
      { start: 0, end: Math.min(1440, to + w), kind: "morgen" },
      { start: Math.max(0, from - w), end: 1440, kind: "abend" }
    ].filter(s => s.end > s.start);
  }
  // Wer tagsüber schläft: ein zusammenhängender Abschnitt.
  return [{ start: Math.max(0, from - w), end: Math.min(1440, to + w), kind: "tag" }]
    .filter(s => s.end > s.start);
}

/* ============================================================
   Orte und Wege

   weg(a, b) ist symmetrisch und null, wenn einer der beiden Orte fehlt oder
   beide gleich sind. Ein Block ohne eigenen Ort erbt den seines Bereichs und
   sonst den Heimatort — sonst wäre die Matrix voller Lücken und die Wegzeit
   verschwände, sobald irgendwo nichts eingetragen ist.
   ============================================================ */
function ortOf(block) {
  if (!block) return null;
  if (block.ortId) return block.ortId;
  const a = areaById(block.areaId);
  return (a && a.plan.ortId) || state.settings.heimOrt || null;
}
function ortName(id) {
  const o = (state.orte || []).find(x => x.id === id);
  return o ? o.name : "";
}
function wegKey(a, b) { return a < b ? a + ">" + b : b + ">" + a; }
function weg(a, b) {
  if (!a || !b || a === b) return 0;
  return +(state.wege || {})[wegKey(a, b)] || 0;
}
/* Alle Ortspaare, die im Plan tatsächlich vorkommen — nur die muss man pflegen. */
function ortPaare() {
  const ids = new Set();
  (state.orte || []).forEach(o => ids.add(o.id));
  const liste = [...ids];
  const out = [];
  for (let i = 0; i < liste.length; i++)
    for (let j = i + 1; j < liste.length; j++)
      out.push({ a: liste[i], b: liste[j], key: wegKey(liste[i], liste[j]) });
  return out;
}

/* Ortsauswahl als Chip-Reihe. Wird im Bereichs- und im Eintrags-Dialog
   benutzt. Ein neuer Ort entsteht inline — ein zweiter Dialog würde den
   ersten schließen. */
function ortChips(wrap, getId, setId) {
  const paint = () => {
    wrap.innerHTML = "";
    const mach = (id, txt) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.setAttribute("aria-pressed", String((getId() || null) === id));
      c.textContent = txt;
      c.onclick = () => { setId(id); paint(); };
      wrap.appendChild(c);
    };
    mach(null, "— egal —");
    (state.orte || []).forEach(o => mach(o.id, o.name));

    const neu = document.createElement("button");
    neu.type = "button"; neu.className = "chip";
    neu.textContent = "＋ Ort";
    neu.onclick = () => {
      wrap.innerHTML = "";
      const inp = document.createElement("input");
      inp.className = "field"; inp.placeholder = "z.B. Büro, Uni, Halle";
      inp.style.maxWidth = "190px"; inp.autocomplete = "off";
      const ok = document.createElement("button");
      ok.type = "button"; ok.className = "btn btn--sm"; ok.textContent = "Anlegen";
      const fertig = () => {
        const name = inp.value.trim();
        if (!name) { paint(); return; }
        if (!Array.isArray(state.orte)) state.orte = [];
        const o = { id: "o-" + uid(), name };
        state.orte.push(o);
        // Der erste Ort ist der Heimatort: alles ohne eigenen Ort gilt als dort.
        if (!state.settings.heimOrt) state.settings.heimOrt = o.id;
        setId(o.id);
        paint();
      };
      ok.onclick = fertig;
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); fertig(); }
        if (e.key === "Escape") { e.preventDefault(); paint(); }
      });
      wrap.append(inp, ok);
      inp.focus();
    };
    wrap.appendChild(neu);
  };
  paint();
  return paint;
}

/* ============================================================
   Wie voll ist die Woche, bevor überhaupt verteilt wird?

   Der Planer hat bisher immer verteilt und am Ende gemeldet, was nicht passte.
   Andersherum ist es ehrlicher: Wer sich 58 Stunden vornimmt, hat kein
   Platzproblem, sondern ein Zielproblem. Und ein Tag, der bis zum Rand
   verplant ist, hält nicht — unverplante Zeit ist keine Lücke im Plan,
   sondern Teil davon.

   Stufe A: In der LAUFENDEN Woche zählen "wach" und "fest" nur noch ab jetzt.
   Ohne das meldete die Ampel am Samstagabend nach Feierabend "57 % verplant,
   grün" — die 40 Stunden Montag bis Freitag standen im Nenner mit, obwohl sie
   längst vorbei waren, und übrig blieb praktisch nur der Sonntag. growSuggestions()
   (3672 ff.) kennt "jetzt" schon seit Stufe 16, hier zieht die Kapazitätsrechnung
   nach. Zukünftige und vergangene Wochen bleiben bewusst bei der alten Rechnung
   (ganze Woche) — eine Zukunftswoche hat noch keine Vergangenheit, und eine
   vergangene Woche liest man als Rückblick, wo die ganze Woche die richtige Zahl
   ist. Das braucht unten keinen eigenen Zweig: außerhalb der laufenden Woche ist
   "istHeute" nie wahr und kein Tag "vergangen", also bleibt jeder Tag ungeklemmt
   — genau die alte Formel.
   ============================================================ */
const VERPLANT_GRENZE = 0.65;
function wochenKapazitaet() {
  const tage = weekDays();
  const laufend = istDieseWoche();
  const heuteKey = iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  let wach = 0, fest = 0;
  tage.forEach(day => {
    // Vergangene Tage der laufenden Woche sind vorbei — 0 zu beiden Seiten.
    if (laufend && day.key < heuteKey) return;
    const istHeute = laufend && day.key === heuteKey;
    const von = istHeute ? Math.max(jetzt, state.settings.dayStart * 60) : state.settings.dayStart * 60;
    const bis = state.settings.dayEnd * 60;

    let frei = Math.max(0, bis - von);
    restSpans().forEach(r => {
      frei -= Math.max(0, Math.min(bis, r.end) - Math.max(von, r.start));
    });
    wach += Math.max(0, frei);

    state.blocks.forEach(b => {
      if (b.sug || !onDay(b, day.key, day.i)) return;
      // Heute: grobe Blöcke haben keine Uhrzeit, an der man clampen könnte —
      // sie zählen wie bisher voll. Exakte zählen nur noch ihren Rest ab
      // jetzt; ein schon beendeter Block trägt nichts mehr bei.
      fest += (!istHeute || b.grob) ? dauerVon(b) : Math.max(0, b.end - Math.max(b.start, jetzt));
    });
  });

  // Offene Wochenziele plus die Pausen, die dazugehören — unverändert: ein
  // bereits verplanter Block deckt das Ziel, egal ob sein Termin vergangen
  // oder künftig ist.
  let offen = 0, pausen = 0;
  state.areas.forEach(a => {
    const rest = Math.max(0, a.plan.goal * 60 - areaMinutes(a.id, false));
    if (!rest) return;
    offen += rest;
    const A = artOf(a);
    pausen += Math.ceil(rest / A.max) * A.pause;
  });

  // Stufe 12: Aufgaben mit Dauer, die noch keinen Platz haben, brauchen
  // genauso Zeit in der Woche wie ein offenes Wochenziel — sonst zeigt die
  // Ampel grün, obwohl schon zwei Stunden Aufgaben unverplant in der Liste
  // stehen. Schon verplante Aufgaben zählen bereits über "fest" mit (ihr
  // Block trägt die echte areaId), hier also nur die noch offenen.
  state.tasks.forEach(t => {
    if (t.done || t.geplant || !t.dauer) return;
    offen += t.dauer;
    const A = artOf(areaById(t.areaId));
    pausen += Math.ceil(t.dauer / A.max) * A.pause;
  });

  const bedarf = fest + offen + pausen;
  const grenze = wach * VERPLANT_GRENZE;
  // wach kann in der laufenden Woche auf 0 fallen (Sonntagnacht, alles vorbei)
  // — bedarf/0 wäre Infinity. 9.99 reicht, um sicher rot zu zeichnen, ohne eine
  // absurde Zahl zu führen; ampelZeichnen() deckelt die Anzeige zusätzlich bei
  // "über 200 %".
  const quote = wach ? bedarf / wach : (bedarf > 0 ? 9.99 : 0);
  return { wach, fest, offen, pausen, bedarf, grenze, quote, ok: bedarf <= grenze };
}

/* Zeichnet die Auslastungs-Ampel. Grün bis 60 %, gelb bis 70 %, darüber rot —
   die Zahlen kommen aus der Beobachtung, dass Pläne reißen, weil man sich zu
   viel vornimmt, nicht weil man schlecht sortiert. */
function ampelFarbe(q) {
  return q <= 0.60 ? "var(--success)" : q <= 0.70 ? "var(--warn)" : "var(--danger)";
}
function ampelZeichnen(el) {
  if (!el) return;
  const k = wochenKapazitaet();
  const pct = Math.round(k.quote * 100);
  // Stufe A: über 200 % ist kein ehrlicher Prozentwert mehr, nur noch Lärm
  // (vor allem im wach===0-Randfall, siehe wochenKapazitaet) — der Balken
  // selbst ist über scaleX ohnehin schon bei 100 % gedeckelt.
  const pctText = pct > 200 ? "über 200" : String(pct);
  // In der laufenden Woche zählt nur noch der Rest — das muss auch im Text
  // stehen, sonst wirkt die Stundenangabe darunter wie ein Rechenfehler.
  const wieWoche = istDieseWoche() ? "Rest der Woche" : "Woche";
  el.innerHTML =
    "<div class='ampel'><span>" + wieWoche + " zu <b style='color:var(--text)'>" + pctText + " %</b> verplant</span>" +
    "<span class='ampel__bar'><span class='ampel__fill' style='transform:scaleX(" +
      (Math.min(100, pct) / 100) + ");background:" + ampelFarbe(k.quote) + "'></span>" +
      "<span class='ampel__mark' style='left:" + Math.round(VERPLANT_GRENZE * 100) + "%'></span>" +
    "</span><span style='color:var(--text-faint)'>" + fmtDur(Math.round(k.bedarf)) + " von " +
      fmtDur(Math.round(k.wach)) + "</span></div>" +
    (k.ok ? "" :
      "<div class='goalrow__sub' style='margin:-2px 0 10px'>Über der Marke bei " +
      Math.round(VERPLANT_GRENZE * 100) + " % wird es eng — Pläne reißen an zu vollen Tagen, " +
      "nicht an schlechter Sortierung.</div>");
  return k;
}

/* Mindestpause nach einem Block, bevor der Planer etwas Neues vorschlägt.

   Der Stress entsteht am Übergang, nicht im Termin — und je länger der Block,
   desto länger muss die Pause sein. Kurze Pausen reichen für die Stimmung, für
   Kopfarbeit nicht. Ohne diese Regel klebte alles aneinander: „Längster Block
   120 min" teilte die Zeit zwar, trennte sie aber nicht.

   Das gilt nur für den Vorschlag. Von Hand darf man weiter alles aneinanderlegen. */
const PAUSE_MIN = 5;
function pauseNach(len, area) {
  const grund = area ? artOf(area).pause : 15;
  // Kurze Blöcke brauchen weniger, sehr lange etwas mehr als die Grundpause.
  if (len < 45) return Math.max(PAUSE_MIN, Math.round(grund * 0.5 / 5) * 5);
  if (len >= 150) return grund + 10;
  return grund;
}

/* Ende des letzten "echten" Blocks eines Bereichs an einem Tag — nicht grob,
   kein Vorschlag. Grundlage für den Anker unten. Bewusst aus den Blöcken
   abgeleitet statt an eine feste Block-ID gebunden: die bräche, sobald der
   Termin verschoben wird oder an einem freien Tag fehlt. */
function ankerEnde(ref, day) {
  let e = null;
  state.blocks.forEach(b => {
    if (b.areaId !== ref || b.grob || b.sug) return;
    if (onDay(b, day.key, day.i)) e = Math.max(e === null ? -1 : e, b.end);
  });
  return e;
}

/* Erlaubt ein Fenster diesen Wochentag? Leer oder fehlend heißt: jeder Tag
   erlaubt — der unveränderte Altzustand ohne regeln. */
function fensterErlaubtTag(regeln, dayIdx) {
  const fenster = regeln && Array.isArray(regeln.fenster) ? regeln.fenster : [];
  return !fenster.length || fenster.some(f => Array.isArray(f.tage) && f.tage.includes(dayIdx));
}

/* Freie Lücken eines Tages innerhalb des erlaubten Fensters.
   Vergangenes wird ausgelassen — ein Vorschlag für gestern hilft niemandem.
   Schlaf- und Ruhezeit zählen wie ein belegter Block: der Vorschlag geht
   darum herum, von Hand eintragen darf man dort trotzdem.

   Ab v9 kann der Bereich zusätzlich area.regeln tragen (Geschwister von
   plan, siehe migrate): Fenster grenzen Wochentag und Uhrzeit ein, ein
   Anker bindet die Zeit an das Ende eines anderen Bereichs an diesem Tag.
   Beides klemmt dieselbe(n) lo/hi-Spanne(n) weiter ein — mit mehreren
   Fenstern können daraus mehrere Spannen an einem Tag werden. Jeder harte
   Ausschluss sammelt sich lesbar in .gruende, für die Begründungszeile
   (Stufe 11).

   opts (Stufe 11, optional): excludeId lässt einen Block sich nicht selbst
   im Weg stehen — Grundlage für die Gültigkeitsprüfung eines bestehenden
   Vorschlags beim Warm Start. ignoreFrei/ignoreFenster/ignoreAnker schalten
   je einen harten Filter probeweise ab — Grundlage für das Minimal
   Correction Subset (Teil C): welcher einzelne Filter schafft wieder Platz? */
function freeGaps(day, plan, area, opts) {
  opts = opts || {};
  const areaId = area && area.id;
  const todayKey = iso(new Date());
  if (day.key < todayKey) return [];

  const gruende = [];
  const leer = () => { const g = []; g.gruende = gruende; return g; };
  if (!opts.ignoreFrei && istFrei(day.key)) { gruende.push("Tag freigehalten"); return leer(); }

  const regeln = area && area.regeln;
  if (!opts.ignoreFenster && !fensterErlaubtTag(regeln, day.i)) { gruende.push(DAY_LONG[day.i]); return leer(); }

  const basisLo = Math.max(state.settings.dayStart * 60, plan.from == null ? 0 : plan.from);
  const basisHi = Math.min(state.settings.dayEnd * 60, plan.to == null ? 1440 : plan.to);
  const fensterHeute = (!opts.ignoreFenster && regeln && Array.isArray(regeln.fenster))
    ? regeln.fenster.filter(f => f.tage.includes(day.i)) : [];

  let spans = fensterHeute.length
    ? fensterHeute.map(f => ({ start: Math.max(basisLo, f.von), end: Math.min(basisHi, f.bis) }))
    : [{ start: basisLo, end: basisHi }];
  spans = spans.filter(sp => sp.end - sp.start >= 15);

  if (!opts.ignoreAnker && regeln && regeln.anker && regeln.anker.ref) {
    const refName = (areaById(regeln.anker.ref) || {}).name || "";
    const ende = ankerEnde(regeln.anker.ref, day);
    if (ende === null) {
      gruende.push("kein " + refName + " an diesem Tag");
      if (regeln.anker.sonst === "aus") spans = [];
    } else {
      gruende.push("mind. " + fmtDur(regeln.anker.min) + " nach " + refName);
      spans = spans
        .map(sp => ({ start: Math.max(sp.start, ende + regeln.anker.min),
                       end: Math.min(sp.end, ende + regeln.anker.max) }))
        .filter(sp => sp.end - sp.start >= 15);
    }
  } else if (!opts.ignoreAnker && regeln && regeln.anker && regeln.anker.tageszeit) {
    // Stufe 13 Teil B: der zweite Anker-Zweig ohne ref, aus der Anker-Frage
    // im Wochenstart. Grenzen wie ABSCHNITTE (vm endet, ab beginnt) — dieselbe
    // Tagesteilung wie bei groben Blöcken, damit "morgens" überall dasselbe
    // meint. gruende bekommt den Eintrag IMMER, nicht nur beim Einschränken:
    // das ist die Zeile, unter der der Nutzer seinen Vorsatz wiederliest.
    const morgen = regeln.anker.tageszeit === "morgen";
    const grenze = morgen ? abschnittVon("vm").bis : abschnittVon("ab").von;
    gruende.push(morgen ? "Morgens, wie vorgenommen" : "Abends, wie vorgenommen");
    spans = spans
      .map(sp => morgen ? { start: sp.start, end: Math.min(sp.end, grenze) }
                         : { start: Math.max(sp.start, grenze), end: sp.end })
      .filter(sp => sp.end - sp.start >= 15);
  }
  if (!spans.length) return leer();

  // Der Abstand zu einem vorhandenen Block ist der größte von dreien:
  // seine Wegzeit, die Wegzeit dessen, was hier hin soll, und die Mindestpause.
  //
  // Bisher zählte nur die erste. Wer eine Stunde zur Uni fährt, bekam den
  // Uni-Block trotzdem auf die Minute an die Arbeit geklebt — der Puffer hing
  // am falschen Bereich.
  //
  // Der Abstand ist der größere von zwei Dingen: die Fahrt zwischen den beiden
  // Orten und die Pause nach dem vorhandenen Block. Gleicher Ort heißt keine
  // Fahrt — zwei Lernblöcke hintereinander sitzen am selben Schreibtisch.
  const zielOrt = area ? (area.plan.ortId || state.settings.heimOrt || null) : null;
  const busy = state.blocks
    .filter(b => !b.grob && b.id !== opts.excludeId && onDay(b, day.key, day.i))
    .map(b => {
      const pause = pauseNach(b.end - b.start, areaById(b.areaId));
      const fahrt = weg(ortOf(b), zielOrt);
      return { start: b.start - Math.max(fahrt, pause), end: b.end + Math.max(fahrt, pause) };
    })
    .concat(restSpans())
    .sort((a, b) => a.start - b.start);

  const nowCursor = day.key === todayKey
    ? Math.ceil((new Date().getHours() * 60 + new Date().getMinutes() + 10) / 15) * 15
    : null;

  const gaps = [];
  spans.forEach(sp => {
    let cursor = nowCursor == null ? sp.start : Math.max(sp.start, nowCursor);
    busy.forEach(b => {
      if (cursor >= sp.end) return;
      if (b.start > cursor) gaps.push({ start: cursor, end: Math.min(b.start, sp.end) });
      cursor = Math.max(cursor, b.end);
    });
    if (cursor < sp.end) gaps.push({ start: cursor, end: sp.end });
  });

  // Je Fenster für sich geklemmt, jetzt sortiert zusammengeführt — mehrere
  // Fenster können sonst überlappende oder direkt angrenzende Lücken lassen.
  gaps.sort((a, b) => a.start - b.start);
  const merged = [];
  gaps.forEach(g => {
    const last = merged[merged.length - 1];
    if (last && g.start <= last.end) last.end = Math.max(last.end, g.end);
    else merged.push({ start: g.start, end: g.end });
  });

  const out = merged.filter(g => g.end - g.start >= 15);
  out.gruende = gruende;
  return out;
}

/* Wie voll ist ein Tag schon — inklusive der Vorschläge, die dieser
   Durchlauf bereits gesetzt hat. */
function tagesLast(day) {
  return state.blocks.reduce((s, b) =>
    s + (onDay(b, day.key, day.i) ? dauerVon(b) : 0), 0);
}
function bereichAmTag(areaId, day) {
  return state.blocks.reduce((s, b) =>
    s + (b.areaId === areaId && onDay(b, day.key, day.i) ? dauerVon(b) : 0), 0);
}

/* Bewertet einen möglichen Platz. Je höher, desto besser.

   Der alte Verteiler nahm immer die erste freie Lücke und schrieb den Block an
   deren Anfang. Das ist der Grund, warum der Vormittag zugemauert wurde und der
   Abend leer blieb, und warum der Montag zwölf Stunden trug, während der Sonntag
   fünfeinhalb hatte. Hier werden stattdessen mehrere Plätze verglichen. */
function slotScore(start, len, area, day, gap) {
  let s = 100;
  const vorne = start - gap.start;
  const hinten = gap.end - (start + len);

  // Fragmentierung: bestraft wird, was übrig bleibt, nicht das Teilen an sich.
  // Eine Lücke von acht Stunden in zwei Hälften zu schneiden ist harmlos —
  // sogar gut, weil links und rechts Luft entsteht. Schlecht sind unbrauchbare
  // Reste. (Eine pauschale Strafe fürs Teilen drückte jeden Block an den
  // Anfang der Lücke und damit die Erholung zurück in den Vormittag.)
  if (vorne > 0 && vorne < 45) s -= 14;
  if (hinten > 0 && hinten < 45) s -= 14;
  const kleinereSeite = (vorne > 0 && hinten > 0) ? Math.min(vorne, hinten) : Infinity;
  if (kleinereSeite < 90) s -= 8;

  // Tagesbalance. Quadratisch, damit ein schon voller Tag schnell unattraktiv
  // wird — sonst frisst der erste Tag der Woche alles.
  const fenster = Math.max(60, (state.settings.dayEnd - state.settings.dayStart) * 60);
  const anteil = Math.min(1.6, tagesLast(day) / (fenster * 0.65));
  s -= anteil * anteil * 55;

  // Derselbe Bereich soll sich über die Woche verteilen, nicht an einem Tag klumpen.
  s -= bereichAmTag(area.id, day) / 15 * 5;

  // Tagesform: an einem Tag mit wenig Energie landet weniger.
  // Ist nichts eingetragen, ist das Gewicht 1 und dieser Term null.

  // Tageszeit — hängt an der Art. Kopfarbeit früh, Erholung in den Feierabend.
  // Ohne diesen Term landet alles am Tagesende, weil dort nichts zerschnitten
  // wird und keine Restlücke bleibt.
  const tagAnfang = Math.max(state.settings.dayStart * 60,
    ...restSpans().filter(r => r.start <= state.settings.dayStart * 60).map(r => r.end), 0);
  const A = artOf(area);
  s += A.zeit(start, tagAnfang);
  // Direkt aus dem Bett in einen Block will niemand — und direkt bis ins Bett
  // auch nicht. Ohne die zweite Regel landet Erholung immer am Tagesende, weil
  // dort keine Restlücke übrig bleibt, die man zerschneiden könnte.
  if (start < tagAnfang + 45) s -= 12;
  const abendRuhe = restSpans().filter(r => r.end >= 1440).map(r => r.start);
  const tagEnde = Math.min(state.settings.dayEnd * 60,
    ...(abendRuhe.length ? abendRuhe : [1440]));
  if (start + len > tagEnde - 45) s -= 18;

  // Lange Blöcke lieber am Stück als zerstückelt.
  s += Math.min(len, A.max) / 60 * 3;

  // Ortswechsel kosten. Wer schon am selben Ort ist, spart die Fahrt;
  // der dritte Ort an einem Tag ist einer zu viel.
  const zielOrt = area.plan.ortId || state.settings.heimOrt || null;
  if (zielOrt) {
    const heute = state.blocks.filter(b => onDay(b, day.key, day.i));
    const orte = new Set(heute.map(b => ortOf(b)).filter(Boolean));
    if (orte.has(zielOrt)) s += 8;
    else if (orte.size >= 2) s -= 16;
    const davor = heute.filter(b => b.end <= start).sort((x, y) => y.end - x.end)[0];
    if (davor && weg(ortOf(davor), zielOrt) > 0) s -= 6;
  }

  // Stabilitätsbonus (Stufe 11): lag hier im letzten Durchlauf schon ein
  // Vorschlag desselben Bereichs zur selben Tag+Uhrzeit, bleibt der Plan
  // beim Neuverteilen ruhig, statt bei jeder Kleinigkeit umzuwerfen. Gegen
  // realtest.js kalibriert auf +14: kleiner als die Tagesbalance (bis zu
  // -55) und jede echte Verschlechterung, größer als die Mikro-Präferenzen
  // (Ortswechsel ±8/±16, Tageszeit-Bonus 10) — ein wirklich besserer Platz
  // gewinnt trotzdem, ein bloß minimal besserer nicht.
  if (vorherigePlaetze.has(platzKey(area.id, day.i, start))) s += 14;

  return s;
}

/* Stufe 11: Positionen aus dem Durchlauf vor dem aktuellen buildSuggestions()
   — Grundlage für den Stabilitätsbonus in slotScore. Vor jedem Durchlauf neu
   befüllt, sonst leer (dann hat der Bonus nirgends eine Wirkung). */
let vorherigePlaetze = new Set();
function platzKey(areaId, dayIdx, start) { return areaId + "|" + dayIdx + "|" + start; }

/* Verteilt die offenen Minuten eines Bereichs auf die Woche.
   Jeder Block sucht sich seinen Platz einzeln und nimmt den bestbewerteten. */
/* ============================================================
   Grobe Verteilung

   Kein Suchen nach Lücken — nur die Frage, an welchem Tag und in welchem
   Abschnitt noch Luft ist. Dabei zwei Regeln aus der Erholungsforschung:
   lieber ein langer Block als drei kurze (fragmentierte Freizeit wird als
   minderwertig erlebt, auch wenn die Summe stimmt), und Erholung gehört in
   den Feierabend.
   ============================================================ */
function placeGrob(area, open, tage) {
  const A = artOf(area);
  const minLen = Math.max(60, A.min);          // Anti-Konfetti
  const maxLen = Math.max(minLen, A.max);
  const heuteKey = iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  // Bevorzugter Abschnitt je Art — Erholung abends, Kopfarbeit vormittags.
  // Stufe 13 Teil B: ein Tageszeit-Anker aus der Anker-Frage sticht das, statt
  // nur die Reihenfolge zu verschieben — sonst könnte der Grund unten "Morgens,
  // wie vorgenommen" behaupten und der Block landete trotzdem nachmittags.
  const ankerTZ = area.regeln && area.regeln.anker && area.regeln.anker.tageszeit;
  const reihenfolge = ankerTZ === "morgen" ? ["vm"]
                    : ankerTZ === "abend" ? ["ab"]
                    : A === ARTEN.kopf ? ["vm", "nm", "ab"]
                    : A === ARTEN.koerper ? ["nm", "ab", "vm"]
                    : ["ab", "nm", "vm"];

  const moeglich = [];
  tage.forEach(day => {
    if (day.key < heuteKey) return;
    if (istFrei(day.key)) return;
    if (!fensterErlaubtTag(area.regeln, day.i)) return;
    reihenfolge.forEach((teil, rang) => {
      const a = abschnittVon(teil);
      // Ein Abschnitt, der heute schon vorbei ist, hilft niemandem mehr
      if (day.key === heuteKey && jetzt >= a.bis) return;
      // Wie viel ist in diesem Abschnitt schon verplant — grob wie exakt?
      const belegt = state.blocks.filter(b => onDay(b, day.key, day.i)).reduce((n, b) => {
        if (b.grob) return n + (b.teil === teil ? b.dauer : 0);
        const ueberlappt = Math.min(b.end, a.bis) - Math.max(b.start, a.von);
        return n + Math.max(0, ueberlappt);
      }, 0);
      const laenge = Math.min(a.bis, state.settings.dayEnd * 60)
                   - Math.max(a.von, state.settings.dayStart * 60);
      if (laenge <= 0) return;
      // Nie mehr als zwei Drittel eines Abschnitts grob verplanen
      const frei = Math.floor(laenge * 0.66) - belegt;
      if (frei < minLen) return;
      moeglich.push({ day, teil, rang, frei, schonHier: bereichAmTag(area.id, day) });
    });
  });

  if (!moeglich.length) return 0;

  let rest = open, placed = 0, schutz = 0;
  while (rest >= 15 && schutz++ < 40) {
    // Bester Platz: bevorzugter Abschnitt, wenig belegt, Bereich noch nicht
    // an diesem Tag — Streuung über die Woche statt Häufung
    moeglich.sort((x, y) =>
      (x.rang - y.rang) || (x.schonHier - y.schonHier) || (y.frei - x.frei));
    const ziel = moeglich.find(m => m.frei >= Math.min(minLen, rest));
    if (!ziel) break;

    const len = Math.floor(Math.min(maxLen, rest, ziel.frei) / 15) * 15;
    if (len < 15) break;
    // Bliebe ein Rest unter der Mindestlänge übrig, lieber alles in einen Block
    const nimm = (rest - len > 0 && rest - len < minLen) ? Math.min(rest, ziel.frei) : len;

    state.blocks.push({
      id: uid(), title: area.name, areaId: area.id,
      day: ziel.day.i, date: ziel.day.key, repeat: "none",
      grob: true, teil: ziel.teil, dauer: nimm,
      start: abschnittVon(ziel.teil).von, end: abschnittVon(ziel.teil).von + nimm,
      frog: false, sug: true,
      grund: ankerTZ ? (ankerTZ === "morgen" ? "Morgens, wie vorgenommen" : "Abends, wie vorgenommen")
        : DAY_LONG[ziel.day.i] + " " + abschnittVon(ziel.teil).name + " war noch am freisten"
    });
    ziel.frei -= nimm;
    ziel.schonHier += nimm;
    moeglich.filter(m => m.day.key === ziel.day.key).forEach(m => { m.schonHier = ziel.schonHier; });
    rest -= nimm;
    placed += nimm;
  }
  return placed;
}

// Generischer Fallback-Grund (Stufe C Punkt C2): bei leerer Woche landet er
// achtmal auf demselben Vorschlag — als Anzeige ist das Rauschen, auf der
// Datenebene bleibt er trotzdem ein gültiger, nicht-leerer Grund (erklaer.js
// prüft genau das). grundZumZeigen() unten filtert ihn nur für die Anzeige.
const GRUND_GENERISCH = "Bester freier Platz diese Woche";

/* Begründungszeile (Stufe 11) für den gewählten Platz: erst das härteste
   zutreffende Filter-Label (fällt in freeGaps() ohnehin an), sonst der
   Term, der in slotScore() am stärksten wiegt — die Tagesbalance (bis zu
   -55) dominiert dort alles andere, „Tag war am leersten" ist darum meist
   die ehrliche Antwort auf „warum hier". String-Verkettung, keine neue
   Bewertung: die Werte selbst kommen unverändert aus freeGaps()/tagesLast(). */
function grundFuer(area, day, start, gruende, tage) {
  if (gruende && gruende.length) return gruende[0];
  const leerster = tage.reduce((min, d) => tagesLast(d) < tagesLast(min) ? d : min, tage[0]);
  if (leerster.key === day.key) return DAY_LONG[day.i] + " war am leersten";
  const zielOrt = area.plan.ortId || state.settings.heimOrt || null;
  if (zielOrt && state.blocks.some(b => onDay(b, day.key, day.i) && ortOf(b) === zielOrt))
    return "Kein Ortswechsel nötig";
  if (artOf(area) === ARTEN.kopf && start >= 480 && start <= 780) return "Vormittags, beste Zeit für Kopfarbeit";
  return GRUND_GENERISCH;
}

// Grund für die ANZEIGE auf Block/Zeile (Stufe C Punkt C2) — der generische
// Fallback beantwortet dort keine Frage, die spezifischen Gründe sind das
// eigentliche Vertrauens-Feature. b.grund selbst bleibt unangetastet (Daten-
// vertrag für erklaer.js); nur die Anzeige schweigt, wenn sie nichts zu
// sagen hat. sugSheet()/blockSheet() rufen diese Funktion bewusst NICHT auf
// — dort beantwortet auch der generische Grund noch die aktive Frage
// "warum hier?".
function grundZumZeigen(b) {
  return (b.grund && b.grund !== GRUND_GENERISCH) ? b.grund : "";
}

/* Abzugsgrund einer verworfenen Alternative — dieselben Signale wie oben,
   nur negativ gegen den gewählten Platz gehalten. Für den Knopf „Trotzdem
   hierhin" im Vorschlags-Sheet (Stufe 11 Teil B). */
function grundAbzug(area, cand, best) {
  const vorne = cand.start - cand.gap.start, hinten = cand.gap.end - (cand.start + cand.len);
  if ((vorne > 0 && vorne < 45) || (hinten > 0 && hinten < 45)) return "zerschneidet die Lücke ungünstig";
  if (cand.day.key !== best.day.key && tagesLast(cand.day) > tagesLast(best.day))
    return DAY_LONG[cand.day.i] + " war schon voller";
  const tagAnfang = Math.max(state.settings.dayStart * 60,
    ...restSpans().filter(r => r.start <= state.settings.dayStart * 60).map(r => r.end), 0);
  if (cand.start < tagAnfang + 45) return "zu früh am Tag";
  const abendRuhe = restSpans().filter(r => r.end >= 1440).map(r => r.start);
  const tagEnde = Math.min(state.settings.dayEnd * 60, ...(abendRuhe.length ? abendRuhe : [1440]));
  if (cand.start + cand.len > tagEnde - 45) return "spät am Tag";
  return "insgesamt schlechter bewertet";
}

/* ============================================================
   Stufe 12: Aufgaben werden verplant

   Der Verteiler kennt nur "Vorhaben" — bisher ausschließlich Bereiche. Eine
   Aufgabe bekommt hier ein Pseudo-Vorhaben, das sich denselben Bausteinen
   unterschieben lässt wie ein echter Bereich (freeGaps, slotScore,
   grundFuer/grundAbzug).

   Die Falle: placeArea() schreibt areaId: area.id auf den erzeugten Block.
   Ein Pseudo-Vorhaben mit einer erfundenen ID ("task:"+t.id) würde also
   einen Block mit einer areaId erzeugen, die kein Bereich ist — migrate()
   repariert genau das bedingungslos (verwaiste areaId → Bereich
   "Sonstiges", notfalls neu angelegt) und schickt den erfundenen Bereich
   per Sync auf jedes Gerät. Deshalb trägt das Pseudo-Vorhaben die ECHTE
   areaId der Aufgabe; die Zugehörigkeit zur Aufgabe steckt separat in
   .taskId (nie als areaId benutzt) — und als Nebeneffekt zählt verplante
   Aufgabenzeit dadurch ganz von selbst richtig aufs Wochenziel des Bereichs. */
function taskVorhaben(t) {
  const a = areaById(t.areaId);
  return {
    id: t.areaId,
    kennung: "task:" + t.id,
    name: t.title,
    hue: a.hue,
    plan: { ...a.plan, goal: 0, grob: false },
    regeln: t.regeln || a.regeln,
    taskId: t.id
  };
}

/* Löst die Verbindung zwischen Block und Aufgabe, ohne die Aufgabe
   mitzureißen: ein verworfener Vorschlag, ein gelöschter Eintrag oder ein
   beim Warm Start ungültig gewordener Platz nehmen der Aufgabe nur ihren
   Platz, nicht sich selbst — sie taucht danach wieder als offen auf. */
function unlinkTask(b) {
  if (!b.taskId) return;
  const t = state.tasks.find(x => x.id === b.taskId);
  if (t && t.geplant === b.id) delete t.geplant;
}

/* Eine Aufgabe wird als GENAU EIN Block verplant. placeArea() teilt ein
   Bereichsziel bei Bedarf auf mehrere Tage auf (zielLen, maxTage) — für ein
   Wochenziel richtig, für eine einzelne Aufgabe falsch: aus "Bericht
   schreiben, 90 min" würden sonst zwei halbe Sitzungen an zwei Tagen werden.
   Darum keine placeArea()-Wiederverwendung, sondern derselbe Bauplan wie
   dort (freeGaps + slotScore, dieselben Begründungsfunktionen), nur ohne
   dessen Aufteil-Schleife. */
function placeTask(t) {
  const v = taskVorhaben(t);
  const tage = weekDays().filter(day => v.plan.days.includes(day.i));
  const len = t.dauer;
  if (!tage.length || !len) return false;

  let best = null;
  const alt = [];
  for (const day of tage) {
    const gaps = freeGaps(day, v.plan, v);
    for (const g of gaps) {
      const room = g.end - g.start;
      if (room < len) continue;
      const starts = [g.start, g.start + 45,
                      g.start + Math.floor((room - len) / 2 / 15) * 15, g.end - len];
      new Set(starts).forEach(st => {
        if (st < g.start || st + len > g.end) return;
        const sc = slotScore(st, len, v, day, g);
        const cand = { sc, day, start: st, len, gap: g, gruende: gaps.gruende };
        alt.push(cand);
        if (!best || sc > best.sc) best = cand;
      });
    }
  }
  if (!best) return false;

  const alternativen = alt
    .filter(c => !(c.day.key === best.day.key && c.start === best.start))
    .sort((x, y) => y.sc - x.sc)
    .slice(0, 2)
    .map(c => ({ day: c.day.i, date: c.day.key, start: c.start, end: c.start + c.len,
                  grund: grundAbzug(v, c, best) }));

  const id = uid();
  state.blocks.push({
    id, title: t.title, areaId: v.id, taskId: t.id,
    day: best.day.i, date: best.day.key, repeat: "none",
    start: best.start, end: best.start + best.len, frog: !!t.frog, sug: true,
    grund: grundFuer(v, best.day, best.start, best.gruende, tage),
    alternativen
  });
  t.geplant = id;
  return true;
}

function placeArea(area, open) {
  const p = area.plan;
  const tage = weekDays().filter(day => p.days.includes(day.i));
  if (!tage.length) return 0;
  // Pruefer-Fix 2 (akzeptiert, nicht bekämpft): maxTage unten hängt an
  // tage.length. Die erste Speicherung eines gefensterten Bereichs (Fix 1
  // in goalsSheet) darf p.days neu falten — die Aufteilung fällt danach
  // anders aus (z. B. 5 Blöcke über 3 statt 5 Tage), weil tage.length jetzt
  // den wirklich belegbaren Tagen entspricht. Die Summe bleibt gleich.

  // Grob geplante Bereiche bekommen keine Uhrzeit, sondern einen Abschnitt.
  if (p.grob) return placeGrob(area, open, tage);

  // Blocklängen kommen aus der Art, nicht mehr aus zwei Zahlenfeldern,
  // die niemand sinnvoll raten konnte.
  const A = artOf(area);
  const minLen = Math.min(A.min, Math.max(15, Math.floor(open / 15) * 15));

  // Auf wie viele Tage lässt sich das Ziel sinnvoll verteilen? Genau hier lag
  // der zweite Fehler: „Sport 3 h" ergab rechnerisch 30 Minuten pro Tag, das
  // war weniger als die Mindestlänge — also wurde an keinem Tag etwas gesetzt
  // und der Auffangdurchlauf kippte alle drei Stunden auf den Montag.
  // Zielblocklänge: eine Stunde ist der brauchbarste Default, aber innerhalb
  // dessen, was der Bereich erlaubt. Daraus ergibt sich, auf wie viele Tage
  // sich das Ziel sinnvoll verteilen lässt.
  const zielLen = clamp(60, A.min, A.max);
  const maxTage = clamp(Math.round(open / zielLen), 1,
                        Math.min(tage.length, Math.max(1, Math.floor(open / minLen))));
  const proTag = Math.max(minLen, Math.ceil(open / maxTage / 15) * 15);

  let rest = open, placed = 0;

  // Erst mit Tagesobergrenze verteilen, dann ohne — sonst bleibt bei einer
  // vollen Woche etwas liegen, das durchaus noch gepasst hätte.
  for (const grenze of [proTag, Infinity]) {
    let schutz = 0;
    while (rest >= minLen && schutz++ < 60) {
      let best = null;
      // Stufe 11: die besten verworfenen Plätze mitsammeln, statt sie
      // wegzuwerfen — Grundlage für „Trotzdem hierhin" im Vorschlags-Sheet.
      const alt = [];
      for (const day of tage) {
        const schon = bereichAmTag(area.id, day);
        if (schon >= grenze) continue;
        // Auch die Blocklänge an die Tagesgrenze binden — sonst schöpft der
        // erste Block die Obergrenze in einem Rutsch aus und der Bereich landet
        // doch wieder nur an zwei Tagen.
        const platzHeute = grenze === Infinity ? Infinity : grenze - schon;
        const gaps = freeGaps(day, p, area);
        for (const g of gaps) {
          const room = g.end - g.start;
          const len = Math.floor(Math.min(A.max, rest, room, platzHeute) / 15) * 15;
          if (len < minLen) continue;
          // Anfang, kurz nach Anfang, Mitte und Ende der Lücke vergleichen
          const starts = [g.start, g.start + 45,
                          g.start + Math.floor((room - len) / 2 / 15) * 15, g.end - len];
          new Set(starts).forEach(st => {
            if (st < g.start || st + len > g.end) return;
            const sc = slotScore(st, len, area, day, g);
            const cand = { sc, day, start: st, len, gap: g, gruende: gaps.gruende };
            alt.push(cand);
            if (!best || sc > best.sc) best = cand;
          });
        }
      }
      if (!best) break;
      const alternativen = alt
        .filter(c => !(c.day.key === best.day.key && c.start === best.start))
        .sort((x, y) => y.sc - x.sc)
        .slice(0, 2)
        .map(c => ({ day: c.day.i, date: c.day.key, start: c.start, end: c.start + c.len,
                      grund: grundAbzug(area, c, best) }));
      state.blocks.push({
        id: uid(), title: area.name, areaId: area.id,
        day: best.day.i, date: best.day.key, repeat: "none",
        start: best.start, end: best.start + best.len, frog: false, sug: true,
        grund: grundFuer(area, best.day, best.start, best.gruende, tage),
        alternativen
      });
      rest -= best.len;
      placed += best.len;
    }
    if (rest < minLen) break;
  }

  // Restminuten unter der Mindestlänge nicht als Zwergblock anlegen,
  // sondern an vorhandene Vorschläge anhängen
  if (rest >= 15) placed += growSuggestions(area, rest);

  return placed;
}

/* Hängt übrig gebliebene Minuten an bestehende Vorschläge an,
   statt 15-Minuten-Krümel ins Raster zu streuen.

   Diese Funktion kannte weder die Nachtruhe noch überlappende Termine: sie
   dehnte Vorschläge in die Schlafenszeit hinein und quer über Arzttermine
   hinweg, weil `x.start >= b.end` einen Block, der schon vorher beginnt,
   nicht findet. Beides ist jetzt Teil der Obergrenze.

   Stufe 16: kannte auch kein "jetzt" — verlängerte am laufenden Tag auch
   einen eigenen Vorschlag, dessen Zeit längst vorbei war (buildSuggestions()
   räumt am laufenden Tag bewusst nichts weg, siehe clearSuggestions()). Ein
   gerade laufender Block (start <= jetzt < end) wächst davon unberührt
   weiter — nur ein bereits abgeschlossenes Ende wird nicht mehr verlängert. */
function growSuggestions(area, rest) {
  const p = area.plan;
  const hi = Math.min(state.settings.dayEnd * 60, p.to == null ? 1440 : p.to);
  let used = 0;
  const heuteKey = iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  for (const day of weekDays()) {
    if (!p.days.includes(day.i)) continue;
    if (day.key < heuteKey) continue;

    // area.regeln (Stufe 9) kann die Tagesobergrenze enger ziehen als hi —
    // Fenster-Ende und Anker-Ende+max. Ohne das wächst ein Vorschlag über
    // genau die Grenze hinaus, die ihn erst hierher gestellt hat.
    let hiTag = hi;
    if (area.regeln) {
      const fensterHeute = Array.isArray(area.regeln.fenster)
        ? area.regeln.fenster.filter(f => f.tage.includes(day.i)) : [];
      if (fensterHeute.length) hiTag = Math.min(hiTag, Math.max(...fensterHeute.map(f => f.bis)));
      if (area.regeln.anker && area.regeln.anker.ref) {
        const ende = ankerEnde(area.regeln.anker.ref, day);
        if (ende !== null) hiTag = Math.min(hiTag, ende + area.regeln.anker.max);
      }
    }

    const all = state.blocks.filter(b => onDay(b, day.key, day.i))
      .sort((a, b) => a.start - b.start);

    for (const b of all) {
      if (rest - used < 15) return used;
      // fix (Stufe 11): von Hand gezogen oder bearbeitet — der Verteiler
      // rührt diesen Block nicht mehr an, auch nicht durchs Wachsenlassen.
      // taskId (Stufe 12): gehört der Block zu einer Aufgabe, teilt er zwar
      // die areaId mit dem echten Bereich (siehe taskVorhaben), ist aber
      // kein offener Bereichs-Vorschlag — seine Länge ist die Dauer der
      // Aufgabe, nicht Verhandlungsmasse für übrig gebliebene Bereichszeit.
      if (!b.sug || b.areaId !== area.id || b.fix || b.taskId) continue;
      // Kennt sonst kein "jetzt" (siehe Kommentar oben der Funktion): ein
      // eigener Vorschlag von heute, dessen Ende schon erreicht oder
      // überschritten ist, ist bewiesen vorbei — der Verteiler darf ihn
      // nicht mehr verlängern. Ein gerade laufender Block (start <= jetzt
      // < end) fällt nicht unter dieses Filter und wächst wie bisher.
      if (day.key === heuteKey && b.end <= jetzt) continue;

      // Alles, was nach dem Ende dieses Blocks noch im Weg steht — auch wenn es
      // davor beginnt und ihn überlappt. Dazu die Nachtruhe.
      const zielOrt = area.plan.ortId || state.settings.heimOrt || null;
      const hindernisse = all
        .filter(x => x !== b && x.end > b.end)
        .map(x => x.start - Math.max(weg(ortOf(x), zielOrt),
                                     pauseNach(x.end - x.start, areaById(x.areaId))))
        .concat(restSpans().filter(r => r.end > b.end).map(r => r.start));

      const limit = Math.min(hiTag, ...hindernisse.filter(v => v >= b.end));
      const grow = Math.floor(
        Math.min(limit - b.end, artOf(area).max - (b.end - b.start), rest - used) / 15) * 15;
      if (grow >= 15) { b.end += grow; used += grow; }
    }
  }
  return used;
}

function buildSuggestions() {
  // Stufe 11 (Stabilität): wo lag ein Vorschlag vor diesem Durchlauf? Erst
  // merken, dann erst räumen — der Stabilitätsbonus in slotScore zieht neu
  // gesetzte Vorschläge zurück an Plätze, die schon einmal galten.
  const keysVorher = new Set(weekDays().map(d => d.key));
  vorherigePlaetze = new Set(
    state.blocks.filter(b => b.sug && !b.grob && keysVorher.has(b.date))
      .map(b => platzKey(b.areaId, b.day, b.start)));

  // Warm Start: nur ungültig gewordene Vorschläge fallen weg, der Rest
  // bleibt liegen — buildSuggestions() füllt danach nur die Lücken.
  clearSuggestions(true);

  // Erst das, was sein muss — dann der Rest. Bei knappem Platz soll nicht
  // der Serienabend den Lernblock verdraengen, nur weil er groesser war.
  // Bei Gleichstand geht der engste Bereich zuerst — sonst frisst ein
  // flexibler Bereich das knappe Fenster eines unflexiblen leer.
  //
  // open zieht jetzt auch schon liegen gebliebene Vorschläge ab (areaMinutes
  // mit sug=true) — sonst plant der Warm Start oben drauf, statt nur die
  // Lücke zu füllen, die das Wegfallen ungültiger Vorschläge gerissen hat.
  // Teil F: "×" im Vorschlags-Blatt (plan.keinVorschlag) — der Bereich bleibt
  // planbar, bekommt vom Verteiler nur nichts mehr vorgeschlagen.
  const todo = state.areas
    .filter(a => !a.plan.keinVorschlag)
    .map(a => ({ a, open: a.plan.goal * 60 - areaMinutes(a.id, false) - areaMinutes(a.id, true),
      kandidatentage: weekDays().filter(d => a.plan.days.includes(d.i) && fensterErlaubtTag(a.regeln, d.i)).length }))
    .filter(x => x.open >= 15)
    .sort((x, y) => (y.a.plan.must - x.a.plan.must) || (y.open - x.open) || (x.kandidatentage - y.kandidatentage));

  let placed = 0, missing = 0, hinweise = [];
  todo.forEach(({ a, open }) => {
    const got = placeArea(a, open);
    placed += got;
    missing += open - got;
    // Teil C: passte für diesen Bereich gar nichts, eine Handlungsanweisung
    // statt nur „kein Platz" — probiert jeden harten Filter einzeln ab.
    if (!got) { const h = mcsHinweis(a); if (h) hinweise.push(h); }
  });

  // Stufe 12: Aufgaben mit Dauer, die noch keinen Platz haben — Das
  // Wichtigste zuerst, wie schon der Schalter im Aufgabenblatt verspricht
  // ("Das Wichtigste — zuerst dran"). Erledigte und schon verplante Aufgaben
  // (t.geplant zeigt auf einen noch gültigen Block) bleiben unangetastet;
  // ohne Dauer ist eine Aufgabe nicht verteilbar — das bleibt so und ist
  // nur an der fehlenden Dauer-Anzeige zu erkennen, kein Fehler.
  state.tasks
    .filter(t => !t.done && !t.geplant && t.dauer)
    .filter(t => { const ar = areaById(t.areaId); return !ar || !ar.plan.keinVorschlag; })
    .sort((x, y) => y.frog - x.frog)
    .forEach(t => {
      const got = placeTask(t);
      placed += got ? t.dauer : 0;
      missing += got ? 0 : t.dauer;
      if (!got) { const h = mcsHinweis(taskVorhaben(t)); if (h) hinweise.push(h); }
    });

  return { placed, missing, areas: todo.length, hinweise };
}

/* warm=false (Vorgabe): wirft alle Vorschläge der angezeigten Woche weg —
   für den ausdrücklichen „Verwerfen"-Knopf.
   warm=true (Stufe 11): wirft nur die ungültig gewordenen weg. fix und der
   laufende Tag bleiben davon so oder so unberührt — der Verteiler rührt sie
   nie automatisch an; Rest wird gegen freeGaps() erneut geprüft. */
function clearSuggestions(warm) {
  const keys = new Set(weekDays().map(d => d.key));
  const heuteKey = iso(new Date());
  state.blocks = state.blocks.filter(b => {
    if (!(b.sug && keys.has(b.date))) return true;
    if (!warm) { unlinkTask(b); return false; }
    if (b.fix) return true;
    if (b.date === heuteKey) return true;   // der laufende Tag wird nie automatisch umgeplant
    if (vorschlagGueltig(b)) return true;
    // Stufe 12: fällt ein Aufgaben-Vorschlag hier raus, verliert die
    // Aufgabe nur ihren Platz — sonst bliebe t.geplant auf einen Block
    // zeigen, den der nächste buildSuggestions()-Durchlauf schon vergessen
    // hat, und die Aufgabe bekäme nie wieder einen neuen Vorschlag.
    unlinkTask(b);
    return false;
  });
}

/* Stufe 11 (Warm Start): gilt dieser bestehende Vorschlag nach einer
   Änderung noch? Dieselben harten Filter wie bei der Platzsuche — nur was
   sie nicht mehr erfüllt, räumt seinen Platz für den nächsten Durchlauf
   frei. excludeId (freeGaps-Option) verhindert, dass der Block sich beim
   Prüfen selbst im Weg steht. */
function vorschlagGueltig(b) {
  // Stufe 12: ein Aufgaben-Vorschlag prüft gegen sein eigenes Pseudo-
  // Vorhaben (task.regeln, falls gesetzt), nicht blind gegen den Bereich —
  // sonst würde beim Warm Start eine aufgabeneigene Zeitregel ignoriert.
  // Zeigt b.taskId ins Leere (Aufgabe zwischenzeitlich gelöscht), war das
  // Löschen selbst schon dafür zuständig, den Verweis zu kappen — taucht
  // er trotzdem noch auf, ist der Vorschlag ungültig.
  const t = b.taskId ? state.tasks.find(x => x.id === b.taskId) : null;
  if (b.taskId && !t) return false;
  const area = t ? taskVorhaben(t) : areaById(b.areaId);
  if (!area) return false;
  const day = weekDays().find(d => d.key === b.date);
  if (!day) return false;
  if (!area.plan.days.includes(day.i)) return false;
  if (b.grob) return !istFrei(day.key) && fensterErlaubtTag(area.regeln, day.i);
  const gaps = freeGaps(day, area.plan, area, { excludeId: b.id });
  return gaps.some(g => g.start <= b.start && g.end >= b.end);
}

/* Teil C — naives Minimal Correction Subset: passt für einen Bereich gar
   nichts, schaltet diese Funktion probeweise je einen harten Filter ab und
   sucht neu. Der erste, der wieder Platz schafft, wird gemeldet — eine
   Handlungsanweisung statt einer Sackgasse. */
function mcsHinweis(area) {
  const varianten = [];
  if (area.regeln && area.regeln.fenster && area.regeln.fenster.length)
    varianten.push(["die Uhrzeit-Grenze", { ignoreFenster: true }]);
  if (area.regeln && area.regeln.anker) {
    // Zwei Anker-Formen (Stufe 13 Teil B): mit ref "nach [Bereich]", ohne
    // ref eine Tageszeit — beide räumt opts.ignoreAnker gleich weg.
    const ak = area.regeln.anker;
    const label = ak.ref ? "den Anker nach " + ((areaById(ak.ref) || {}).name || "")
      : "den Anker (" + (ak.tageszeit === "morgen" ? "morgens" : "abends") + ")";
    varianten.push([label, { ignoreAnker: true }]);
  }
  varianten.push(["freigehaltene Tage", { ignoreFrei: true }]);

  for (const [label, opts] of varianten) {
    for (const day of weekDays()) {
      const gaps = freeGaps(day, area.plan, area, opts);
      if (gaps.length) return area.name + " passt nicht. Ohne " + label + " ginge " +
        DAY_LONG[day.i] + " " + fmtTime(gaps[0].start) + ".";
    }
  }
  return null;
}

function acceptSuggestions() {
  const keys = new Set(weekDays().map(d => d.key));
  let n = 0;
  state.blocks.forEach(b => { if (b.sug && keys.has(b.date)) { delete b.sug; n++; } });
  return n;
}

// Stufe C Punkt C7: dieselbe Auswahl, die acceptSuggestions() gleich
// annehmen wird — dort selbst nicht mehr abrufbar, weil die Funktion die
// sug-Flags schon löscht. Wird VOR dem Aufruf gesammelt, für den Toast danach.
function sugBlockeDieserWoche() {
  const keys = new Set(weekDays().map(d => d.key));
  return state.blocks.filter(b => b.sug && keys.has(b.date));
}

// Baut aus den gerade übernommenen Blöcken einen aussprechbaren Toast-Satz
// (Stufe C Punkt C7) statt der bloßen Zahl: Gesamtdauer (dauerVon() zählt
// grobe Blöcke über ihr .dauer, nicht über end-start), Zahl der Tage,
// vollster Tag. Genau ein Tag betroffen — ob durch einen einzigen Vorschlag
// oder mehrere am selben Tag — braucht kein "über 1 Tag", "am <Tag>" reicht.
function toastUebernommenText(bloecke) {
  if (!bloecke.length) return "0 Vorschläge übernommen";
  const gesamt = bloecke.reduce((sum, b) => sum + dauerVon(b), 0);
  const proTag = new Map();
  bloecke.forEach(b => proTag.set(b.day, (proTag.get(b.day) || 0) + dauerVon(b)));
  const tage = [...proTag.keys()];
  if (tage.length <= 1) return "Übernommen: " + fmtDur(gesamt) + " am " + DAY_LONG[tage[0]] + ".";
  const vollster = tage.reduce((a, b) => proTag.get(b) > proTag.get(a) ? b : a);
  return "Übernommen: " + fmtDur(gesamt) + " über " + tage.length + " Tage — " + DAY_LONG[vollster] + " ist am vollsten.";
}

/* Stufe 15: "Tag durcheinander?" — der Knopf in "Heute" fuer den Moment,
   in dem der Plan mitten am Tag zerbricht. Wendet denselben Verteiler wie
   das Wochenziel-Verteilen an (placeArea/placeGrob/growSuggestions), nur
   auf den LAUFENDEN Tag beschraenkt: eine Kopie des Bereichsplans mit
   plan.days = [heute] reicht dafuer, weil alle drei Funktionen ihre Tage
   ausschliesslich ueber plan.days filtern — der Rest der Woche bleibt so
   unberuehrt, ohne dass sie etwas von der Einschraenkung wissen muessen.

   Nichts in der Vergangenheit: freeGaps() (2989 ff.) schneidet fuer den
   heutigen Tag ohnehin schon bei jetzt+10min ab, placeGrob() laesst einen
   schon vorbeigezogenen Abschnitt von sich aus aus. Keine festen Termine:
   dieser Weg legt ausschliesslich NEUE sug:true-Bloecke in freie Luecken -
   er verschiebt oder loescht nie etwas Bestehendes.

   Ein zweiter Tipp auf denselben Knopf soll neu rechnen, nicht stapeln —
   darum raeumt er zuerst seine eigenen, noch nicht angenommenen Vorschlaege
   ab jetzt weg. Was schon vorbei ist, bleibt stehen (dieselbe Grenze wie
   oben); Aufgaben-Vorschlaege (b.taskId) fasst dieser Knopf grundsaetzlich
   nicht an — placeTask() kennt keine Tages-Einschraenkung, und ein schon
   fuer heute stehender Aufgaben-Vorschlag soll dafuer nicht verschwinden. */
function restDesTagesBauen() {
  const heuteKey = iso(new Date());
  const day = weekDays().find(d => d.key === heuteKey);
  if (!day) return { placed: 0, missing: 0, hinweise: [] };
  // Derselbe Vertrag wie ueberall sonst im Verteiler (istFrei, s. 2997/3217/
  // 3649): auf einem freigehaltenen Tag schlaegt dieser Weg nichts vor.
  if (istFrei(heuteKey)) return { placed: 0, missing: 0, hinweise: [] };
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  state.blocks = state.blocks.filter(b => {
    if (!(b.sug && b.date === heuteKey && !b.taskId)) return true;
    return b.grob ? abschnittVon(b.teil).bis <= jetzt : b.end <= jetzt;
  });
