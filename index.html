  width: 100%; max-width: 460px; max-height: min(88dvh, calc(var(--sicht-hoehe) - 16px)); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-3);
  padding: var(--s-5);
  animation: pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98) } }
.sheet--wide { max-width: 560px; }
.sheet__title { font-size: var(--t-h1); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 var(--s-4); }
.sheet__row { margin-bottom: var(--s-4); }
.sheet__cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-3); }
.sheet__cols > * { min-width: 0; }
.sheet__title, .sheet__row { overflow-wrap: anywhere; }
/* Der Fussbereich klebt am unteren Rand des Dialogs. Ohne das rutscht der
   Bestaetigen-Knopf bei langen Inhalten aus dem Bild - auf einem kleinen
   iPhone war der Willkommens-Dialog dadurch schlicht nicht bedienbar. */
.sheet__foot {
  display: flex; gap: var(--s-2); align-items: center;
  margin-top: var(--s-5);
  position: sticky; bottom: calc(var(--s-5) * -1);
  margin-bottom: calc(var(--s-5) * -1);
  padding: var(--s-3) 0 var(--s-5);
  padding-bottom: calc(var(--s-5) + var(--safe-bottom));
  background: var(--surface);
  box-shadow: 0 -10px 14px -10px oklch(0.2 0.02 var(--h-ink) / 0.18);
}
html[data-theme="dark"] .sheet__foot { box-shadow: 0 -10px 14px -10px oklch(0 0 0 / 0.55); }
.sheet__foot .spacer { flex: 1; }
.chipset { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.switch { display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-body); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--ink); }

/* ============================================================ Areas editor */
.arealist { display: flex; flex-direction: column; gap: var(--s-2); }
.arearow { display: flex; align-items: center; gap: var(--s-2); }
.arearow__swatch {
  width: 30px; height: 30px; flex: none; border-radius: 8px;
  background: var(--area-bg-2); border: 1px solid var(--area-line);
  cursor: pointer;
}
.arearow .field { min-height: 36px; }

/* ============================================================ Toast + banner */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--s-5) + var(--safe-bottom)); z-index: 90;
  display: flex; flex-direction: column; gap: var(--s-2); align-items: center;
  pointer-events: none; width: min(92vw, 420px);
}
.toast {
  background: var(--ink); color: var(--on-ink);
  padding: 10px var(--s-4); border-radius: 999px; font-size: var(--t-sm); font-weight: 500;
  box-shadow: var(--shadow-2); animation: pop .2s cubic-bezier(.2,.9,.3,1);
  display: flex; align-items: center; gap: var(--s-3); max-width: 100%;
}
.toast__act {
  pointer-events: auto; flex: none;
  background: transparent; border: none; padding: 2px 2px; margin: -2px 0;
  color: inherit; font-size: var(--t-sm); font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
}
.toast__act:hover { opacity: .75; }
.toasts .toast { pointer-events: none; }
.toasts .toast:has(.toast__act) { pointer-events: auto; }
#banner { flex: none; }
.banner {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: 10px var(--s-4); font-size: var(--t-sm);
  padding-top: max(10px, var(--safe-top));
  background: oklch(0.66 0.15 75 / 0.16);
  border-bottom: 1px solid oklch(0.66 0.15 75 / 0.45);
  color: var(--text);
}
.banner b { font-weight: 700; }
.app:has(.banner) .topbar { padding-top: 4px; }

/* ============================================================ Responsive */
/* ============================================================
   Umschalter am Handy

   Ein Telefon ist kein schmaler Schreibtisch. Statt Raster und Karten
   übereinander zu stapeln — wobei der Kalender, die Hauptsache, auf ein
   knappes Drittel schrumpft — bekommt hier jede Ansicht den ganzen
   Bildschirm, umschaltbar unten in Daumenreichweite.
   ============================================================ */
.tabbar { display: none; }
.fab { display: none; }
.sugbar { display: none; }

@media (max-width: 1100px) {
  /* Tabbar und Vorschlagsleiste bilden den unteren Bedienbereich. Der
     Tagesstreifen steht direkt unter der Kopfzeile und zählt hier nicht. */
  body {
    --fussleiste: calc(62px + var(--safe-bottom));
    --fuss-oben: var(--fussleiste);
  }
  body[data-sugbar="1"] {
  /* 61px = Höhe der Vorschlagsleiste: 44px hohe Knöpfe + 16px senkrechtes
       Padding (var(--s-2) oben und unten) + 1px Haarlinie. */
    --fuss-oben: calc(var(--fussleiste) + 61px);
  }

  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    flex: none; gap: 2px; padding: 2px 6px 0;
    padding-bottom: max(4px, var(--safe-bottom));
    border-top: 1px solid var(--glas-linie);
    box-shadow: inset 0 1px 0 var(--glas-kante);
    position: relative; z-index: 42;
  }
  .tabbar button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-height: 50px; padding: 4px 2px 5px;
    border: none; background: transparent; border-radius: var(--radius-sm);
    font-size: var(--t-xs); font-weight: 600; color: var(--text-faint);
    -webkit-tap-highlight-color: transparent;
  }
  .tabbar svg {
    width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .tabbar button[aria-current="true"] { background: var(--selected); color: var(--selected-text); }
  .tabbar button:active { background: var(--surface-2); }

  /* Die Eintragsaktion steht in der Plan-Kopfzeile. So bleibt sie sichtbar,
     ohne Termine im Raster oder Vorschläge am unteren Rand zu verdecken. */
  body[data-mview="plan"] .fab {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s-1);
    flex: none; min-height: 44px; padding: 0 var(--s-3); border-radius: var(--radius-sm);
    background: var(--ink); color: var(--on-ink); border: none;
  }
  .fab svg {
    width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 2.2; stroke-linecap: round;
  }
  .fab:active { opacity: .85; }

  /* Vorschlagsleiste: keine Karte — kein Schatten, kein Radius, kein
     farbiger Rand. Eine Haarlinie nach oben genügt, die Fläche bleibt
     ruhig. "Übernehmen" ist der einzige betonte Knopf, wie überall sonst
     auch — der Akzent gehört der Primäraktion, nicht der Dekoration.
     flex-wrap: bei sehr schmalem Gerät UND vergrößerter Systemschrift
     reicht der Platz neben "Übernehmen" + "×" nicht mehr für die Zahl
     (gemessen: iPhone SE 320px bei 150% Schrift bleiben der Zahl nur noch
     53px Breite). Ohne flex-wrap quetschte min-width:0 den Text bis ein
     Wort über den eigenen Rand hinaus lief — sichtbar nicht als Ellipse,
     sondern vom später gezeichneten Knopf verdeckt (leiste.js). Bei
     genug Platz (Normalschrift, breitere Geräte) bleibt alles in einer
     Zeile, weil dort nichts umbrechen muss. */
  body[data-sugbar="1"] .sugbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3);
    position: fixed; left: var(--safe-left); right: var(--safe-right); z-index: 41;
    bottom: var(--fussleiste); min-height: 61px;
    padding: var(--s-2) var(--s-4);
    border-top: 1px solid var(--glas-linie);
    box-shadow: inset 0 1px 0 var(--glas-kante);
  }
  /* min-width:max-content statt 0 — die Zahl darf so viel Platz
     beanspruchen, wie sie braucht; reicht der daneben nicht mehr, wandern
     "Übernehmen"/"×" dank flex-wrap oben in eine zweite Zeile, statt den
     Text zu quetschen. */
  /* Stufe B2: aus dem <span> wurde ein <button> (Weg zum frühesten
     Vorschlag) — border/padding/margin auf 0, sonst wächst die Leiste über
     die an zwei Stellen fest angenommenen 61px hinaus (s. Kommentar bei
     body[data-sugbar="1"] oben). */
  .sugbar__text {
    flex: 1; min-width: max-content; font-size: var(--t-sm); font-weight: 600; color: var(--text);
    border: 0; background: none; padding: 0; margin: 0; text-align: left; min-height: 44px;
  }
  .sugbar__accept { min-height: 44px; padding: 0 var(--s-4); }
  .sugbar__close {
    flex: none; min-width: 44px; min-height: 44px;
    color: var(--text-faint); font-size: var(--t-h1); line-height: 1;
  }
  /* Stehen schon Vorschläge an, ist "Übernehmen" oben die anstehende
     Entscheidung — "Vorschlagen" in der leeren Heute-Karte (#agendaVorschlag,
     s. renderAgenda) würde nur weitere Vorschläge erzeugen und darf
     zurückweichen. Sonst werben zwei gleich betonte Knöpfe im selben
     Blickfeld um denselben Akzent (Skeptiker-Befund, vier Bilder). Fällt
     zurück auf dieselbe schlichte Optik wie "Trotzdem hierhin" (~5157),
     keine eigene Ghost-Klasse nötig. Ohne Vorschläge (data-sugbar="0")
     bleibt "Vorschlagen" unangetastet die Primäraktion. .btn behält die
     44px-Trefferfläche unter (pointer: coarse) unverändert — das ändert
     nur Farbe/Gewicht, nicht die Größe. */
  body[data-sugbar="1"] #agendaVorschlag {
    background: var(--surface); border-color: var(--border-strong);
    color: var(--text); font-weight: 500;
  }

  /* ---- Eine Ansicht zur Zeit -------------------------------------------
     Der Plan und die Karten teilen sich nicht den Bildschirm, sie ersetzen
     sich. Entscheidend ist, dass die jeweils andere Seite **ganz** weg ist:
     ein leeres `.planwrap` liess vorher das Band stehen und schnitt die
     Karten mitten im Text ab. */
  .main { flex-direction: column; }
  .panelnav { display: none; }
  body:not([data-mview="plan"]) .planhead { display: none; }
  .planhead { padding: var(--s-2) var(--s-4); gap: var(--s-2); }
  .planhead h1 { font-size: var(--t-body); margin: 0; }
  .planhead #desktopAdd { display: none; }
  .panel {
    width: 100%; flex: 1; min-height: 0;
    border-right: 0; max-height: none;
    padding: var(--s-3) var(--s-3) 0;
    gap: var(--s-3);
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  }
  /* v1.32 Liquid Glass: der Kopf (Kopfzeile + Tagesstreifen, bis unter
     die Dynamic Island) liegt über dem Inhalt. Die Karten in Heute/Ziele
     beginnen darunter und scrollen sichtbar hinter das Glas; der Plan
     beginnt ebenfalls darunter, sein Raster scrollt in sich (Tageskopf,
     Scrollmerker und Klebetitel bleiben unberührt). --kopf-h misst
     kopfhoeheMessen() an der echten Höhe, auch mit Speicher-Banner. */
  .app { position: relative; }
  /* fixed statt absolute (v1.35): WebKits Farbabtaster am oberen Rand zählt
     nur feste/klebende Elemente — ein absolut gesetzter Kopf galt nicht als
     Rand, und iOS 26/27 legte trotz deckender Farbe sein Glas darüber. */
  .kopf { position: fixed; top: 0; left: 0; right: 0; }
  .panel { padding-top: calc(var(--kopf-h, 0px) + var(--s-3)); scroll-padding-top: var(--kopf-h, 0px); }
  .planwrap { padding-top: var(--kopf-h, 0px); }
  body[data-mview="plan"] .panel { display: none; }
  body:not([data-mview="plan"]) .planwrap { display: none; }
  body[data-mview="ziele"]    .card:not([data-card="ziele"]):not(.ritual),
  body[data-mview="aufgaben"] .card:not([data-card="aufgaben"]),
  body[data-mview="heute"]    .card:not([data-card="heute"]) { display: none; }

  /* Eine Karte, die den ganzen Bildschirm hat, braucht keinen Rahmen mehr —
     der Rahmen im Rahmen kostet nur Platz und Aufmerksamkeit. */
  .panel > .card {
    border-width: 0; border-radius: 0; background: transparent;
    padding: 0 0 var(--s-4);
  }
  /* Die Vorschlagsleiste ist fixed und schwebt frei ueber dem Fussbereich —
     anders als die Tabbar, ein echtes Flex-Geschwister, bekommt sie von
     Flexbox keinen eigenen Platz zugewiesen. Toasts rechnen sie
     ueber --fuss-oben ein; der Karte in
     "Heute" und dem Raster in "Plan" fehlte das Gegenstueck (belegt durch
     leiste.js). Bodenabstand ist die Differenz aus --fuss-oben und
     --fussleiste — exakt die Leistenhoehe, aber aus der Variable abgeleitet
     statt als dritte Kopie der 61px (die stehen schon an zwei Stellen, s.
     Kommentare dort). Das Polster gehoert auf den gescrollten INHALT, nicht
     auf .planwrap — das ist nur der Flex-Container und traegt selbst kein
     overflow; ein Polster dort verkuerzt die verfuegbare Flaeche fuer
     .gridwrap statt den Scrollweg zu verlaengern (kostete eine Stunde
     Rasterhoehe, s. diag7.js/leiste.js). Darum getrennt: .grid ist der
     Inhalt von .gridwrap (das Aequivalent zu .card oben), .loose scrollt
     sich dagegen selbst wie .tasks (~1294) und bekommt das Polster direkt. */
  body[data-sugbar="1"] .panel > .card {
    padding-bottom: calc(var(--fuss-oben) - var(--fussleiste) + var(--s-4));
  }
  body[data-sugbar="1"] .gridwrap > .grid {
    padding-bottom: calc(var(--fuss-oben) - var(--fussleiste));
  }
  body[data-sugbar="1"] .loose {
    padding-bottom: calc(var(--fuss-oben) - var(--fussleiste) + var(--s-2));
  }
  .card__head { margin-bottom: var(--s-3); }
  /* Auf kleinen Telefonen bleibt die laufende Agenda samt "Danach frei"
     oberhalb der Tabbar. Nur Zwischenräume schrumpfen; antippbare Zeilen
     und Schriftgrößen behalten ihre Maße. */
  @media (max-width: 640px) {
    body[data-mview="heute"] .agenda__label:not(:first-child) { margin-top: 8px; }
    body[data-mview="heute"] .agenda__hero { margin-top: 4px; padding-bottom: 6px; }
    body[data-mview="heute"] .agenda__foot { margin-top: 4px; padding-top: 6px; }
  }

  /* Die Aufgabenliste darf den Platz nutzen, damit das Eingabefeld oben
     stehen bleibt statt mit wegzuscrollen. */
  body[data-mview="aufgaben"] .panel { overflow: hidden; }
  body[data-mview="aufgaben"] .card[data-card="aufgaben"] {
    flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: 0;
  }
  body[data-mview="aufgaben"] .tasks {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: var(--s-4);
  }

  /* Eine Regel statt zweier gleich starker: die spätere gewann, und der
     Tagwechsler stand über den Wochenzielen.
     „Heute" hängt genauso an selectedDayIdx wie „Plan" — ohne diese Zeile
     liess sich „Diesen Tag freihalten" nur an einem Tag bedienen, den man
     dort gar nicht auswählen konnte. */
  body[data-mview="plan"][data-tage="1"] .dayswitch,
  body[data-mview="heute"][data-tage="1"] .dayswitch { display: grid; }
  /* Markup- und sichtbare Reihenfolge: Kopf, Tage, Inhalt, Tabbar. */
  .grid { --gutter: 44px; --colmin: 0; --hourh: 56px; }
  /* Ab 390px (13/14 Pro Max, nicht das SE) darf die Stunde etwas hoeher
     werden -- --gutter bleibt unangetastet, das ist ein reiner
     Lesbarkeits-Gewinn fuer die groesseren Formate. Aendert die Zahl der
     ohne Scrollen sichtbaren Stunden auf diesen Geraeten (dev.js/diag7.js
     zeigen das, ohne es zu pruefen -- s. Bericht); die Falz-Vertraege
     selbst haengen am SE-Format und bleiben unberuehrt. */
  @media (min-width: 390px) {
    .grid { --hourh: 60px; }
  }
  /* Tablets zeigen hier weiterhin sieben Tage MIT Tageskopf — deshalb die
     gemessene Kopfhöhe (0 in der Eintagesansicht) statt eines festen 0. */
  .block__title { top: var(--kopf, 0px); }
  .brand { display: none; }
  .weeknav { margin-right: auto; min-width: 0; }
  /* Datum und Woche in eine Zeile: die zweite Zeile kostete zwölf Pixel
     Rasterhöhe und stand doppelt im Tagwechsler darunter. */
  .weeknav__label {
    min-width: 0; font-size: var(--t-sm); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .weeknav__label small { display: inline; font-size: var(--t-sm); }
  .weeknav__label small::before { content: " · "; }
  @media (max-width: 359px) {
    .dayswitch__band { gap: 0; --band-rand: 3px; grid-auto-columns: calc(100% / 7); }
    .planhead__weekday { display: none; }
  }
  /* Unter 360 Pixeln bricht das Datum mitten durch. Die Tage stehen
     ohnehin im Wechsler darunter — dann lieber nur die Kalenderwoche. */
  @media (max-width: 360px) {
    .weeknav__label small { display: none; }
    /* Monatsblatt-Titel (Stufe M3.4): "<Monat> <Jahr>" bricht bei vier von
       zwölf Monatsnamen mit sichtbarem "Heute"-Knopf zweizeilig um. Das
       Jahr steht bei 320px ohnehin implizit fest (und beim
       Jahreswechsel-Blättern zeigt der Monatsname selbst den Kontext) --
       NICHT display:none (Fund bei der M3-Prüfung, s. Bericht): der Titel
       ist per aria-labelledby der zugängliche Name des ganzen Dialogs
       (modal()), und die Name-from-content-Berechnung schließt display:none
       aus -- Screenreader hätten den Dialog unter 360px nur noch als
       "August" statt "August 2026" gehört, obwohl textContent (und damit
       jeder auf textContent prüfende Test) unverändert "August 2026" zeigt.
       Dieselbe 1x1px-Technik wie .sr (171) hält das Jahr im zugänglichen
       Namen, ohne der Zeile ihre Breite zurückzugeben. */
    .monat__jahr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  }
  .topbar { padding: 4px max(var(--s-2), var(--safe-right)) 4px max(var(--s-2), var(--safe-left)); gap: 0; }  .topbar { padding-top: max(4px, var(--safe-top)); }
  .sheet { max-width: 100%; max-height: min(88dvh, calc(var(--sicht-hoehe) - var(--safe-top) - 8px));
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin-top: auto; }
  .scrim { padding: var(--safe-top) var(--safe-right) 0 var(--safe-left); align-items: flex-end; }
  .card { padding: var(--s-3); }

  /* Das Band nimmt hoechstens ein Viertel der Hoehe. Vorher durfte es ein
     Drittel — auf einem 568er Display blieben dem Tag viereinhalb Stunden. */
  .loose { max-height: 25dvh; padding: 4px 0; }
  .loose__hint { font-size: var(--t-xs); line-height: 1.35; }

  /* Meldungen stehen knapp über Tabbar oder Vorschlägen. Der Eintragsknopf
     liegt jetzt im Plankopf und braucht unten keinen Freiraum mehr. */
  .toasts { bottom: calc(var(--fuss-oben) + var(--s-2)); width: min(94vw, 420px); }

  /* ---- Dialogfuss ------------------------------------------------------
     Drei Knoepfe nebeneinander passen auf 320 px nicht. Loeschen rutscht in
     eine eigene Zeile darunter — nebenbei die richtige Rangfolge. */
  .sheet__foot { flex-wrap: wrap; }
  .sheet__foot .spacer { display: none; }
  .sheet__foot > .btn { flex: 1 1 40%; }
  .sheet__foot > .btn--danger { order: 5; flex: 0 0 auto; }
}

/* Querformat am Handy: kaum Höhe, also flacher bauen */
@media (max-height: 500px) and (max-width: 1000px) {
  .tabbar { padding-top: 0; }
  .tabbar button { min-height: 44px; font-size: 0; gap: 0; padding: 4px; }
  .tabbar svg { width: 20px; height: 20px; }
  .grid { --hourh: 46px; }
  .dayswitch { padding: 2px 0; }
  .dayswitch__btn { min-height: 40px; padding: 2px; }
  .dayswitch__btn b { font-size: var(--t-body); }
  /* Bei 390 Pixeln Höhe ist jeder Erklärsatz eine Stunde Plan */
  .loose { max-height: 30dvh; }
  .loose__hint { display: none; }
  .dayhead { padding: 2px 2px 3px; }
  .dayhead__name { font-size: var(--t-xs); }
  .dayhead__num { font-size: var(--t-body); width: 24px; height: 24px; line-height: 24px; margin-top: 0; }
  .dayhead__frei { font-size: var(--t-xs); }
  .dayhead__energy { display: none; }
  .dayhead__last { margin-top: 1px; min-height: 0; }
  .dayhead__std { display: none; }
  /* Sieben Spalten auf 844 Pixeln heisst rund hundert Pixel je Tag. Zwei
     fingergerechte Haken passen da nicht neben einen Titel, ohne ihn zu
     verdecken — und ein Vorschlag, den man nicht lesen kann, ist keiner.
     Das Querformat ist die Übersicht: annehmen/verwerfen geht hier über
     die Vorschlagsleiste (.sugbar, bleibt auch im Querformat sichtbar)
     oder in "Ziele" über „Alle übernehmen". */
  body[data-tage="7"] .block__sug { display: none; }
  .topbar { padding: 2px max(var(--s-2), var(--safe-right)) 2px var(--s-2);
    padding-top: max(2px, var(--safe-top)); }
  .weeknav__label { font-size: var(--t-sm); }

  /* ---- v1.32: Querformat als Übersicht ---------------------------------
     Gemessen am iPhone 15 Pro quer (852 × 393): Kopf 49, „Deine Woche" 61,
     Tagesköpfe 64, Abendband 118, Vorschläge 61, Tabbar 66 — dem Raster
     blieben 35 px, keine einzige Stunde. Breite gibt es dagegen genug.
     Deshalb wandert die Navigation als senkrechte Leiste an den Rand
     (neben die Kamera-Aussparung), „Eintrag" unten in dieselbe Leiste,
     die Tagesköpfe werden einzeilig und das Abendband flach. */
  body { --rail: 64px; }
  .main { margin-left: var(--rail); }
  /* Ohne Tabbar unten hält niemand mehr den Home-Indikator frei. */
  .planwrap { padding-bottom: var(--safe-bottom); }
  .panel { padding-bottom: var(--safe-bottom); }
  /* Die Leiste reicht über die volle Höhe, der Kopf beginnt rechts daneben —
     unter dem Kopf begonnen, stieß auf dem SE quer (320 px, dort mit
     Tagesstreifen) der vierte Tab an „Eintrag" (fuss.js). */
  .kopf { left: calc(var(--safe-left) + var(--rail)); }
  .tabbar {
    position: fixed; z-index: 42; top: 0; bottom: 0; left: 0;
    width: calc(var(--safe-left) + var(--rail));
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: max(6px, var(--safe-top)) 0 max(6px, var(--safe-bottom)) var(--safe-left);
    border-top: 0; border-right: 1px solid var(--glas-linie);
    box-shadow: inset -1px 0 0 var(--glas-kante);
  }
  .tabbar button { width: 52px; min-height: 44px; flex: none; }
  .planhead, .planhead__actions { display: contents; }
  .planhead > div:first-child { display: none; }
  body[data-mview="plan"] .fab {
    position: fixed; z-index: 43;
    left: calc(var(--safe-left) + (var(--rail) - 52px) / 2);
    bottom: max(8px, var(--safe-bottom));
    width: 52px; min-height: 52px; padding: 0; border-radius: 16px;
    box-shadow: var(--shadow-2);
  }
  .fab span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dayhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; column-gap: 5px; padding: 3px 2px; }
  .dayhead__num { margin: 0; }
  .dayhead__last { flex-basis: 100%; }
  .dayhead__frei { margin-top: 0; line-height: 1.2; }
  .loose { max-height: 72px; }
  body[data-sugbar="1"] .sugbar { left: calc(var(--safe-left) + var(--rail)); }
  /* Ab 700 px Breite steht die Vorschlagsleiste in der Kopfzeile statt
     über dem Raster (sugbarPlatzieren() hängt sie dorthin um) — als Pille
     zwischen Wochennavigation und Monatssymbol, ohne eigene Zeile. */
  body[data-sugoben="1"][data-sugbar="1"] .sugbar {
    position: static; flex: 0 1 auto; flex-wrap: nowrap; gap: 4px;
    min-height: 44px; margin: 0 var(--s-2); padding: 0 0 0 12px;
    border: 1px solid var(--glas-linie); border-radius: 22px; box-shadow: none;
    background: var(--surface-2); -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  body[data-sugoben="1"] .sugbar__text { flex: none; min-width: 0; }
  /* Neben der Pille wäre der Datumsbereich abgeschnitten — die Tage stehen
     ohnehin im Wochenkopf darunter. */
  body[data-sugoben="1"][data-sugbar="1"] .weeknav__label small { display: none; }
  body[data-sugoben="1"] .sugbar__accept { min-height: 36px; padding: 0 var(--s-3); }
  body[data-sugoben="1"] .sugbar__close { min-width: 40px; min-height: 40px; }

  /* Bei so wenig Höhe kostet das festgepinnte Eingabefeld (~1320) mehr,
     als es bringt: dem Aufgabenblatt blieben gemessen nur noch 144px für
     die Liste bei 302px Inhalt. Ab hier scrollt die Ansicht wieder als
     Ganzes wie jede andere Karte auch — das Eingabefeld bleibt über den
     einen gemeinsamen Scrollweg weiter erreichbar, nur nicht mehr fixiert. */
  body[data-mview="aufgaben"] .panel { overflow-y: auto; }
  body[data-mview="aufgaben"] .card[data-card="aufgaben"] { flex: none; padding-bottom: var(--s-4); }
  body[data-mview="aufgaben"] .tasks { flex: none; overflow-y: visible; }
}

/* Tablets bekommen eine ganze Arbeitsfläche. Das Raster behält sieben Tage,
   Texte in Heute, Aufgaben und Zielen eine gut lesbare Breite. */
@media (min-width: 641px) and (max-width: 1100px) and (min-height: 501px) {
  .panel { padding: calc(var(--kopf-h, 0px) + var(--s-6)) max(var(--s-6), calc((100% - 720px) / 2)) 0; }
  .topbar { padding: var(--s-2) max(var(--s-4), var(--safe-right)) var(--s-2) max(var(--s-4), var(--safe-left));
    padding-top: max(var(--s-2), var(--safe-top)); }
  .brand { display: flex; }
  .brand__name { overflow: hidden; text-overflow: ellipsis; }
  .brand__tagline, .brand__who { display: none; }
  .weeknav { margin-left: auto; margin-right: var(--s-2); }
  .tabbar { padding-left: max(var(--s-6), calc((100% - 640px) / 2));
    padding-right: max(var(--s-6), calc((100% - 640px) / 2)); }
  .tabbar button { flex-direction: row; gap: var(--s-2); font-size: var(--t-sm); min-height: 54px; }
  body[data-mview="heute"] .dayswitch { display: grid; padding-left: var(--s-6); padding-right: var(--s-6); }
  .scrim { padding: max(var(--s-6), var(--safe-top)) max(var(--s-6), var(--safe-right))
    max(var(--s-6), var(--safe-bottom)) max(var(--s-6), var(--safe-left)); align-items: center; }
  .sheet { max-width: 560px; margin: 0; border-radius: var(--radius-lg);
    max-height: calc(var(--sicht-hoehe) - max(48px, var(--safe-top) + var(--safe-bottom))); }
}
@media (min-width: 641px) and (max-width: 780px) and (min-height: 501px) {
  .brand__copy { display: none; }
}

/* ============================================================
   Finger statt Maus — überall dort, wo mit dem Finger bedient wird,
   müssen die Ziele mindestens 44 px hoch sein.
   ============================================================ */
/* ============================================================
   Finger statt Zeiger

   Alles, was man antippt, ist mindestens 44 x 44 Punkte gross. Das ist
   keine Geschmacksfrage: darunter steigt die Fehlerrate messbar, und ein
   Fehltipp in einem Planer heisst, dass etwas verschoben oder gelöscht
   wird, das man nicht anfassen wollte.

   Wo es optisch klein bleiben muss (Häkchen, Farbfeld), bleibt das Bild
   klein und die Trefferfläche wächst über ein unsichtbares ::before.
   ============================================================ */
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn--sm { min-height: 44px; padding: 0 var(--s-3); }
  .btn--icon { min-width: 44px; min-height: 44px; }
  .chip { min-height: 44px; padding: 0 var(--s-3); }
  .field { min-height: 46px; }
  input.field, select.field, textarea.field { font-size: max(1rem, 16px); }
  .arearow .field { min-height: 44px; }
  .arearow__swatch { width: 40px; height: 40px; position: relative; }
  .arearow__swatch::before { content: ""; position: absolute; inset: -2px; }
  .syncbadge { min-height: 44px; min-width: 44px; padding: 0 12px; }
  .setback { min-height: 44px; }
  .task { padding: var(--s-3) var(--s-2); }
  .task__check { width: 24px; height: 24px; position: relative; }
  .task__check::before { content: ""; position: absolute; inset: -11px; border-radius: 8px; }
  .agenda__check::before { content: ""; position: absolute; inset: -14px; border-radius: 8px; }
  /* Dieselbe 34px+(-5px)=44px-Rechnung wie .block__sug button unten —
     Annehmen/Verwerfen duerfen in der Agenda nicht kleiner treffen als im
     Raster. */
  .agenda__sugacts button { width: 34px; height: 34px; font-size: var(--t-body); }
  .agenda__sugacts button::before { content: ""; position: absolute; inset: -5px; }
  .task__del, .task__more, .task__go { min-width: 44px; min-height: 44px; }
  /* Auf einem Touchgerät gibt es kein Hover — ein Knopf, der erst beim
     Zeigen erscheint, existiert dort nicht. */
  .task__del { opacity: 1; }
  .task__area { min-height: 34px; padding: 4px 8px; }
  .task__frog, .task__plan { min-height: 40px; min-width: 40px; padding: 4px 8px; }
  /* Ein Schalter ist eine ganze Zeile — die Box bleibt klein, die
     Trefferflaeche wird fingergerecht. */
  .switch { min-height: 44px; }
  .switch input { width: 22px; height: 22px; }
  .hakenrow input { width: 22px; height: 22px; }
  .energy__opt { min-height: 68px; }
  /* Der Pseudobereich hält die Tagesziele auch bei Zoom gut erreichbar. */
  .dayswitch__btn { min-height: 46px; position: relative; }
  .dayswitch__btn::before {
    content: ""; position: absolute; inset: 50%;
    width: 46px; height: 46px; transform: translate(-50%, -50%);
  }
  /* Acht Spalten (KW-Rinne + Mo-So) auf 320px lassen den Monatszellen
     selbst keine 44px Breite — dieselbe Technik wie beim Tagwechsler
     direkt darüber. */
  .monatcell, .monatweek { position: relative; }
  .monatcell::before, .monatweek::before {
    content: ""; position: absolute; inset: 50%;
    width: 46px; height: 46px; transform: translate(-50%, -50%);
  }
  /* Annehmen und Verwerfen sind der Kern der Schleife — die dürfen nicht
     die kleinsten Knöpfe im Bild sein. */
  .block__sug { gap: 6px; right: 4px; top: 4px; }
  .block__sug button { width: 34px; height: 34px; font-size: var(--t-body); position: relative; }
  .block__sug button::before { content: ""; position: absolute; inset: -5px; }
  .block__resize { height: 14px; }
  /* Ab 360px darf die sichtbare Box der Vorschlags-Checkknoepfe wachsen --
     die effektiven 44px standen ueber die ::before-Trefferflaeche (5px/
     -5px-Rechnung oben) schon vorher, hier geht es nur um die wahrgenommene
     Groesse. ::before-Mechanik und alles andere in diesem Block bleiben
     unangetastet. */
  @media (min-width: 360px) {
    .agenda__sugacts button { width: 40px; height: 40px; }
    .block__sug button { width: 40px; height: 40px; }
  }
  .goalrow__more { min-width: 44px; min-height: 44px; }
  .loosechip { min-height: 44px; }
  .toast__act { padding: 13px 6px; margin: -13px 0; }
  #inSwap { min-height: 44px; }
}

/* ============================================================
   v1.36 „Moos & Papier" — eine Stilschicht über dem Bestand
   Warmes Papier als Grund, Moosgrün für Aktionen, Limette als Belohnung
   (Haken, aktiver Tab, heute). Nur Aussehen: keine Struktur, keine neuen
   Klassen im Markup — alle Prüfskripte greifen weiter auf dieselben Knoten.
   ============================================================ */
:root {
  --bg:        oklch(0.962 0.011 100);
  --surface-2: oklch(0.945 0.012 100);
  --surface-3: oklch(0.915 0.014 100);
  --border:    oklch(0.895 0.012 100);
  --ink:       oklch(0.34 0.070 152);
  --ink-hover: oklch(0.29 0.060 152);
  --ink-active: oklch(0.25 0.050 152);
  --selected:  oklch(0.925 0.065 130);
  --selected-text: oklch(0.32 0.080 145);
  --lime:      oklch(0.89 0.170 128);
  --on-lime:   oklch(0.25 0.040 150);
  --tief:      oklch(0.34 0.070 152);
  --pille:     oklch(0.30 0.060 152);
  --pille-an:  oklch(0.40 0.075 150);
  --radius: 20px; --radius-sm: 12px; --radius-lg: 26px;
  --kopf-flach: #f4f2ea;
  /* Glas im Papierton statt Salbei — der Kopf gehört zum Grund. */
  --glas:       oklch(0.972 0.010 100 / 0.82);
  --glas-kante: oklch(1 0 0 / 0.70);
  --glas-linie: oklch(0.55 0.02 100 / 0.16);
}
html[data-theme="dark"] {
  /* Im Dunkeln trägt die Aktion dieselbe Limette wie Tab, Heute und „+" —
     vorher stand dort ein kühles Mint, das neben der Limette fremd wirkte. */
  --ink:        oklch(0.85 0.140 132);
  --ink-hover:  oklch(0.90 0.120 130);
  --ink-active: oklch(0.79 0.140 134);
  --focus:      oklch(0.85 0.140 132);
  --selected:   oklch(0.31 0.045 145);
  --selected-text: oklch(0.91 0.110 130);
  --success:    oklch(0.80 0.150 140);
  --glas:       oklch(0.20 0.014 155 / 0.82);
  --lime:    oklch(0.86 0.160 128);
  --on-lime: oklch(0.22 0.035 150);
  --tief:    oklch(0.34 0.055 150);
  --pille:   oklch(0.25 0.030 155);
  --pille-an: oklch(0.34 0.050 150);
}
body { background: var(--bg); }
/* Einstellungen als gruppierte Liste wie in iOS: eine Fläche, Haarlinien
   dazwischen — keine gerundeten Einzelzeilen mit gebogenen Linien. */
.setmenu { margin: 0; background: var(--surface-2); border-radius: var(--radius); overflow: hidden; gap: 0; padding-bottom: 0; }
.setmenu__item { border-radius: 0; padding-left: var(--s-4); padding-right: var(--s-4); }
.sheet > .setmenu { margin-bottom: var(--s-3); }
.card { border-color: transparent; box-shadow: 0 1px 2px oklch(0.3 0.03 120 / .06); }
html[data-theme="dark"] .card { border-color: var(--border); box-shadow: none; }
/* Sprungziel des Desktop-Reiters: kein eckiger Fokusrahmen nach einem Klick,
   für die Tastatur ein runder. */
.card:focus:not(:focus-visible) { outline: none; }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.card__title, .agenda__label { font-family: var(--font-display); font-weight: 800; }
.btn { border-radius: 999px; }
.btn--primary { font-weight: 750; }

/* Hinweise (Toasts) tragen dieselbe dunkle Pille wie die Tabbar, die Aktion
   darin ist Limette — in beiden Modi gleich statt Aktionsfarbe als Fläche. */
.toast { background: var(--pille); color: oklch(0.96 0.01 110); font-weight: 600; }
.toast__act { color: var(--lime); }
/* Tagesform: Kacheln wie die übrigen Karten — Fläche statt Rahmen. */
.energy__opt { border-color: transparent; border-radius: var(--radius); background: var(--surface-2); }
.energy__opt[aria-pressed="true"] { border-color: var(--ink); }
/* Desktop: gewählter Tag im Wochenkopf in derselben Auswahlfarbe wie überall. */
.dayhead[aria-pressed="true"], .dayhead[aria-pressed="true"]:hover { background: var(--selected); }
.dayhead.is-today .dayhead__num { background: var(--lime); color: var(--on-lime); }

/* Heute: die Antwort als dunkle Moos-Karte statt als Linie. */
.agenda__hero {
  padding: 8px 14px; border-radius: var(--radius);
  background: var(--tief); color: oklch(0.96 0.01 110);
  border-bottom: 0;
}
.agenda__hero .agenda__hero-status, .agenda__hero .agenda__hero-sub { color: oklch(0.84 0.03 140); }
.agenda__hero-title { font-family: var(--font-display); font-weight: 800; }

/* Agenda-Zeilen als runde Kärtchen, Haken groß und rund. */
.agenda__list { gap: 3px; margin-top: 0; }
.agenda__row {
  background: var(--surface); border-top: 0; border-radius: 16px;
  padding: 6px 10px; align-items: center; overflow: hidden;
}
.agenda__row.is-on { background: var(--surface-2); }
.agenda__title { font-weight: 650; }
.agenda__check {
  width: 26px; height: 26px; margin-top: 0;
  border: 2.5px solid var(--border-strong); order: 9;
  transition: background .18s, border-color .18s, transform .18s;
}
.agenda__check:checked { background: var(--ink); border-color: var(--ink); transform: scale(1.04); }
.agenda__check:checked::after { left: 8px; top: 3.5px; width: 6px; height: 11px; border-width: 0 2.5px 2.5px 0; }
.agenda__row.is-wisch::before { border-radius: 16px; }

/* Tagesstreifen: runde Kacheln, gewählter Tag dunkel, heute in Limette. */
.dayswitch__btn { border-radius: 16px; background: var(--surface); }
.dayswitch__btn span { text-transform: none; letter-spacing: 0; font-weight: 750; }
.dayswitch__btn b { font-family: var(--font-display); font-weight: 800; }
.dayswitch__btn.is-today b { background: var(--lime); color: var(--on-lime); }
.dayswitch__btn[aria-pressed="true"] { background: var(--tief); border-color: var(--tief); color: oklch(0.96 0.01 110); }
.dayswitch__btn[aria-pressed="true"] span { color: oklch(0.84 0.03 140); }
.dayswitch__btn[aria-pressed="true"] i { --last-farbe: var(--lime); background-color: oklch(1 0 0 / .18); }
.dayswitch__btn.is-frei { background: oklch(0.62 0.14 150 / .12); }

/* Fortschrittsring in der Agenda-Kopfzeile */
/* Kopfzeile: „Heute zählt" links, Gruß und Ring rechts. Ein langer Gruß
   (Morgen, Nacht) steht darunter in einer eigenen Zeile, der Ring bleibt oben. */
.agenda__kopfzeile .agenda__gruss { margin-left: auto; }
.agenda__kopfzeile.is-lang .agenda__fort { order: 1; }
.agenda__kopfzeile.is-lang .agenda__gruss { order: 2; margin-left: 0; }
#restTagBtn { margin-top: 10px; }
.agenda__kopfzeile.is-lang { row-gap: 0; line-height: 1.15; }
/* Die zweite Grußzeile kostet Höhe — der Falz-Vertrag (agenda.js) verlangt,
   dass „Danach" trotzdem über der Tabbar steht. Deshalb rücken nur in diesem
   Fall Schwerpunkt, erster Schritt und laufender Eintrag enger zusammen. */
@media (max-width: 1100px) {
  .agenda__kopfzeile.is-lang ~ .agenda__frog { padding: 0 0 6px; }
  .agenda__kopfzeile.is-lang ~ .agenda__step { margin-top: 2px; margin-bottom: 0; line-height: 1.35; }
  .agenda__kopfzeile.is-lang ~ .agenda__hero { margin-top: 4px; }
  #agenda .agenda__kopfzeile.is-lang ~ .agenda__label { margin-top: 2px; }
  #agenda .agenda__kopfzeile.is-lang ~ .agenda__foot { margin-top: 0; }
  #agenda .agenda__kopfzeile.is-lang ~ #restTagBtn { margin-top: 2px; }
}
.agenda__kopfzeile.is-lang .agenda__gruss { flex-basis: 100%; white-space: normal; line-height: 1.2; margin-top: -2px; }
.agenda__fort { display: inline-flex; align-items: center; gap: 5px; line-height: 1; font-family: var(--font-display); font-size: var(--t-sm); color: var(--text); }
.agenda__fort svg { width: 18px; height: 18px; transform: rotate(-90deg); fill: none; stroke-width: 3.5; }
.agenda__fort circle { stroke: var(--surface-3); }
.agenda__fort .agenda__fortbogen { stroke: var(--ink); stroke-linecap: round; transition: stroke-dasharray .4s cubic-bezier(.16,1,.3,1); }
.agenda__fort b { font-weight: 800; }
.agenda__fortbogen[stroke-dasharray^="0.0 "] { stroke: none; }

/* Blätter: Griff oben; am Telefon kommen sie von unten (Bottom Sheet). */
.tabbar__plus { display: none; }
.sheet__griff { display: none; }
@media (max-width: 640px) and (pointer: coarse) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet {
    max-width: none; border-radius: 28px 28px 0 0; border-bottom: 0;
    max-height: calc(var(--sicht-hoehe) - 64px) !important;
    padding-bottom: calc(var(--s-5) + var(--safe-bottom));
    animation: hochfahren .2s cubic-bezier(.16,1,.3,1);
    transition: transform .25s cubic-bezier(.16,1,.3,1);
  }
  .sheet__griff { display: block; width: 40px; height: 5px; border-radius: 3px; margin: -8px auto 10px; background: var(--border-strong); }
}
@keyframes hochfahren { from { transform: translateY(40%); opacity: .6 } }

/* Schwebende Tabbar mit „+" in der Mitte — nicht im Querformat (Leiste). */
@media (max-width: 1100px) and (min-height: 501px) {
  .tabbar {
    grid-template-columns: repeat(2, 1fr) auto repeat(2, 1fr);
    align-items: center; gap: 2px;
    padding: 3px 12px; padding-bottom: max(5px, var(--safe-bottom));
    border-top: 0; box-shadow: none; background: transparent !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    position: relative; isolation: isolate;
  }
  .tabbar::before {
    content: ""; position: absolute; z-index: -1;
    left: 12px; right: 12px; top: 3px; bottom: max(5px, var(--safe-bottom));
    border-radius: 999px; background: var(--pille);
    box-shadow: 0 10px 28px oklch(0.25 0.04 155 / .30);
  }
  .tabbar button { color: oklch(0.80 0.03 140); min-height: 46px; margin: 2px 0; }
  .tabbar button[aria-current="true"] { background: var(--pille-an); color: var(--lime); }
  .tabbar button:active { background: var(--pille-an); }
  .tabbar .tabbar__plus {
    display: flex; width: 50px; height: 50px; min-height: 50px; margin: 0 4px; padding: 0;
    border-radius: 50%; background: var(--lime); color: var(--on-lime);
    transition: transform .15s;
  }
  .tabbar .tabbar__plus:active { transform: scale(.92); background: var(--lime); }
  .tabbar .tabbar__plus svg { width: 26px; height: 26px; stroke-width: 2.8; }
  /* Das „+" steht jetzt in der Tabbar; der Plankopf braucht keinen zweiten. */
  body[data-mview="plan"] .planhead .fab { display: none; }
}
@media (prefers-reduced-transparency: reduce) { .tabbar { background: transparent !important; } }

@media (max-width: 1100px) {
  .tabbar button { border-radius: 999px; font-weight: 750; }
  .tabbar button[aria-current="true"] { background: var(--tief); color: var(--lime); }
  body[data-mview="plan"] .fab { background: var(--lime); color: var(--on-lime); border-radius: 999px; font-weight: 800; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   v1.42 „Stundensteine" — eine Stilschicht über Bestand und v1.36
   Kühler Stein als Grund, tiefes Jade für Aktionen, jeder Bereich als
   gedeckter Stein (gleiche Helligkeit, nur der Farbton wechselt). Haken
   sind runde Mulden, in die ein Stein fällt; das „+" der Tabbar ist der
   größte Stein. Kein Glas mehr: Kopf, Tabbar und Leiste sind deckend —
   ruhiger, und iOS findet am oberen Rand immer eine flache Farbe.
   Nur Aussehen: keine Klassen umbenannt, keine Maße, an denen die
   Falz-Verträge (agenda.js, schrift.js) hängen, sind gewachsen.
   Vorlage: Entwurf B „Stundensteine" (von Sunny abgenommen).
   ============================================================ */
:root {
  --h-ink: 170;
  --bg:          oklch(0.952 0.009 170);
  --surface:     oklch(0.982 0.006 170);
  --surface-2:   oklch(0.936 0.011 170);
  --surface-3:   oklch(0.912 0.013 170);
  --border:      oklch(0.870 0.012 170);
  --border-strong: oklch(0.740 0.016 170);
  --text:        oklch(0.280 0.035 172);
  --text-muted:  oklch(0.420 0.025 172);
  --text-faint:  oklch(0.465 0.020 172);
  --ink:         oklch(0.420 0.095 166);
  --ink-hover:   oklch(0.370 0.090 166);
  --ink-active:  oklch(0.330 0.080 166);
  --on-ink:      oklch(0.970 0.012 165);
  --focus:       oklch(0.420 0.095 166);
  --selected:    oklch(0.905 0.045 165);
  --selected-text: oklch(0.380 0.090 166);
  --danger:      oklch(0.500 0.170 28);
  --success:     oklch(0.560 0.130 150);
  --warn:        oklch(0.700 0.140 75);
  /* Die v1.36-Rollen zeigen jetzt alle auf Jade — wer sie noch benutzt,
     zieht ohne eigene Regel mit. */
  --lime:        oklch(0.420 0.095 166);
  --on-lime:     oklch(0.970 0.012 165);
  --tief:        oklch(0.420 0.095 166);
  --pille:       oklch(0.300 0.035 170);
  --pille-an:    oklch(0.380 0.040 170);
  /* Steine und Mulden */
  --jade:        oklch(0.520 0.110 165);
  --raised:      oklch(0.995 0.003 170);
  --tray:        oklch(0.925 0.012 170);
  --mulde:       oklch(0.25 0.03 170 / .10);
  --mulde-tief:  oklch(0.25 0.03 170 / .22);
  --rand:        oklch(0.575 0.020 170);
  --hi:          oklch(1 0 0 / .42);
  --lo:          oklch(0.2 0.03 170 / .26);
  --on-stone:    oklch(0.99 0.005 165);
  --bar-bg:      oklch(0.300 0.035 170);
  --bar-ink:     oklch(0.950 0.010 165);
  --bar-btn:     oklch(0.800 0.100 165);
  --bar-btn-ink: oklch(0.220 0.030 170);
  --stone-L: 0.565; --stone-C: 0.105;
  --soft-L: 0.905;  --soft-C: 0.042;
  --soft2-L: 0.870; --soft2-C: 0.062;
  --edge-L: 0.840;  --edge-C: 0.050;
  --atext-L: 0.300; --atext-C: 0.045;
  --feder: cubic-bezier(.22, 1.28, .4, 1);
  --radius: 18px; --radius-sm: 12px; --radius-lg: 24px;
  --shadow-1: 0 1px 2px oklch(0.2 0.03 170 / .10);
  --shadow-2: 0 6px 18px -6px oklch(0.2 0.03 170 / .30), 0 1px 2px oklch(0.2 0.03 170 / .10);
  --shadow-3: 0 16px 40px -8px oklch(0.2 0.03 170 / .30);
  /* Glas gibt es nicht mehr; die Tokens bleiben für alte Regeln deckend. */
  --glas:        oklch(0.952 0.009 170);
  --glas-kante:  transparent;
  --glas-linie:  oklch(0.870 0.012 170);
  --glas-schatten: 0 1px 0 oklch(0.870 0.012 170);
  /* = --bg als Hexwert: applyTheme() meldet ihn als theme-color. */
  --kopf-flach: #eaf1ee;
}
html[data-theme="dark"] {
  --bg:          oklch(0.220 0.018 170);
  --surface:     oklch(0.255 0.020 170);
  --surface-2:   oklch(0.290 0.022 170);
  --surface-3:   oklch(0.320 0.022 170);
  --border:      oklch(0.340 0.020 170);
  --border-strong: oklch(0.460 0.020 170);
  --text:        oklch(0.940 0.010 165);
  --text-muted:  oklch(0.810 0.015 165);
  --text-faint:  oklch(0.720 0.015 165);
  --ink:         oklch(0.780 0.110 165);
  --ink-hover:   oklch(0.840 0.100 165);
  --ink-active:  oklch(0.720 0.110 165);
  --on-ink:      oklch(0.210 0.030 170);
  --focus:       oklch(0.800 0.110 165);
  --selected:    oklch(0.330 0.050 165);
  --selected-text: oklch(0.880 0.090 165);
  --danger:      oklch(0.720 0.150 28);
  --success:     oklch(0.720 0.140 150);
  --warn:        oklch(0.800 0.140 82);
  --on-danger:   oklch(0.210 0.030 170);
  --lime:        oklch(0.780 0.110 165);
  --on-lime:     oklch(0.210 0.030 170);
  --tief:        oklch(0.780 0.110 165);
  --pille:       oklch(0.340 0.025 170);
  --pille-an:    oklch(0.420 0.030 170);
  --jade:        oklch(0.780 0.110 165);
  --raised:      oklch(0.290 0.022 170);
  --tray:        oklch(0.275 0.020 170);
  --mulde:       oklch(0 0 0 / .26);
  --mulde-tief:  oklch(0 0 0 / .45);
  --rand:        oklch(0.630 0.020 170);
  --hi:          oklch(1 0 0 / .24);
  --lo:          oklch(0 0 0 / .42);
  --on-stone:    oklch(0.20 0.03 170);
  --bar-bg:      oklch(0.340 0.025 170);
  --bar-ink:     oklch(0.950 0.010 165);
  --bar-btn:     oklch(0.800 0.110 165);
  --bar-btn-ink: oklch(0.200 0.030 170);
  --stone-L: 0.700; --stone-C: 0.100;
  --soft-L: 0.335;  --soft-C: 0.045;
  --soft2-L: 0.400; --soft2-C: 0.060;
  --edge-L: 0.430;  --edge-C: 0.060;
  --atext-L: 0.940; --atext-C: 0.025;
  --shadow-1: 0 1px 2px oklch(0 0 0 / .35);
  --shadow-2: 0 6px 18px -6px oklch(0 0 0 / .55), 0 1px 2px oklch(0 0 0 / .3);
  --shadow-3: 0 16px 40px -8px oklch(0 0 0 / .6);
  --glas:        oklch(0.220 0.018 170);
  --glas-linie:  oklch(0.340 0.020 170);
  --glas-schatten: 0 1px 0 oklch(0.340 0.020 170);
  --kopf-flach: #121d19;
}
/* Bereichsfarben als Steine: Helligkeit und Buntheit aus den Tokens oben,
   nur der Farbton (--h) gehört dem Bereich. html[data-theme] hebt die
   Spezifität über die alte Dunkel-Regel, damit ein Satz für beide reicht. */
html[data-theme] :is(.block, .block__ghost, .chip, .arearow, .task__meta, .dayswitch__btn, .goal, .goalrow, .reliefrow,
.hakenrow, .zielrow, .agenda__hero, .agenda__row, .abschlussrow, .wochenzeile__seg, .loosechip) {
  --area-bg:   oklch(var(--soft-L) var(--soft-C) var(--h));
  --area-bg-2: oklch(var(--soft2-L) var(--soft2-C) var(--h));
  --area-edge: oklch(var(--edge-L) var(--edge-C) var(--h));
  --area-line: oklch(var(--stone-L) var(--stone-C) var(--h));
  --area-text: oklch(var(--atext-L) var(--atext-C) var(--h));
  --area-dot:  oklch(var(--stone-L) var(--stone-C) var(--h));
}
::selection { background: var(--selected); color: var(--selected-text); }

/* ---- Grundbausteine: Knöpfe, Chips, Felder ---------------------------- */
.btn { border: 1.5px solid var(--rand); background: transparent; color: var(--text); font-weight: 600; }
.btn--ghost { border-color: transparent; }
.btn--primary {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 700;
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -2px 0 var(--lo);
}
.btn--primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn--danger { border-color: transparent; color: var(--danger); }
@media (hover: hover) {
  .btn:hover, .btn--ghost:hover { background: var(--mulde); }
  .btn--primary:hover { background: var(--ink-hover); }
  .btn--danger:hover { background: oklch(0.55 0.19 25 / 0.12); }
}
.chip { border: 1.5px solid var(--rand); background: transparent; font-weight: 600; }
.chip[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -2px 0 var(--lo);
}
.chip__dot { box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--lo); }
.chip[aria-pressed="true"] .chip__dot { box-shadow: 0 0 0 1.5px var(--on-ink); }
.field { border: 1.5px solid var(--rand); border-radius: 14px; background: var(--bg); }
.field:focus { outline: none; border-color: var(--jade); box-shadow: 0 0 0 1px var(--jade); }
.field[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.label { color: var(--text-muted); font-weight: 650; }
/* Karten tragen keinen Schatten mehr — am Telefon zeichnete er eine Linie am Rand. */
.card, html[data-theme="dark"] .card { box-shadow: none; }
.tag { background: var(--raised); color: var(--text-muted); }
:focus-visible { outline-color: var(--focus); }

/* ---- Kopf, Tagesband: deckend statt Glas ------------------------------ */
.kopf, html[data-app="1"] .kopf {
  background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: 0 1px 0 var(--border);
}
html[data-app="1"] .kopf { background: var(--kopf-flach) !important; }
.weeknav__label { font-weight: 700; }
.weeknav__label small { font-weight: 500; color: var(--text-faint); }
.dayswitch { border-top: 0; }
.dayswitch__btn {
  border-radius: 22px; background: transparent; border-color: transparent; color: var(--text-muted);
  transition: background .2s, box-shadow .2s;
}
.dayswitch__btn span { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.dayswitch__btn b { font-weight: 700; color: var(--text); }
/* Heute trägt einen Jade-Ring um die ganze Pille, der gewählte Tag ist ein
   gefüllter Stein — beides zugleich ist dieselbe Pille mit beidem. */
.dayswitch__btn.is-today { box-shadow: inset 0 0 0 2px var(--jade); }
.dayswitch__btn.is-today b { background: transparent; color: var(--text); width: auto; height: auto; }
.dayswitch__btn[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -2px 0 var(--lo);
}
.dayswitch__btn[aria-pressed="true"] span, .dayswitch__btn[aria-pressed="true"] b { color: var(--on-ink); }
.dayswitch__btn i {
  width: 22px; height: 4px; border-radius: 4px;
  background: linear-gradient(to right,
    var(--last-farbe, var(--jade)) 0 var(--last, 0%), var(--mulde-tief) var(--last, 0%) 100%);
}
.dayswitch__btn[aria-pressed="true"] i, .dayswitch__btn[aria-pressed="true"].is-voll i {
  --last-farbe: var(--on-ink); background-color: transparent;
  background: linear-gradient(to right,
    var(--on-ink) 0 var(--last, 0%), oklch(from var(--on-ink) l c h / .3) var(--last, 0%) 100%);
}
.dayswitch__btn.is-frei, html[data-theme="dark"] .dayswitch__btn.is-frei { background: var(--mulde); }
.dayswitch__btn.is-frei[aria-pressed="true"] { background: var(--ink); }
.dayswitch__heute {
  background: var(--ink); color: var(--on-ink);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -2px 0 var(--lo), 0 4px 12px -4px var(--lo);
}
@media (hover: hover) { .dayswitch__btn:not([aria-pressed="true"]):hover { background: var(--mulde); } }

/* ---- Heute: Agenda ---------------------------------------------------- */
.agenda__label { color: var(--text-muted); }
.agenda__kopfzeile .agenda__label { color: var(--text); }
.agenda__fort .agenda__fortbogen { stroke: var(--jade); }
.agenda__fort circle { stroke: var(--mulde-tief); }
/* „Heute zählt": die Antwort als Karte im Pastell ihres Bereichs, ohne
   Seitenkante. Am Telefon bewusst knapp (Falz!), am Desktop luftiger. */
.agenda__hero {
  border-left: 0; border-bottom: 0; border-radius: 20px;
  background: var(--area-bg); color: var(--text);
  padding: 8px 14px 8px 16px;
}
.agenda__hero .agenda__hero-status, .agenda__hero .agenda__hero-sub { color: var(--text-muted); }
.agenda__hero-status > span:first-child { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.agenda__hero-status > span:first-child::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--area-line);
  box-shadow: inset 0 1px 1px var(--hi), inset 0 -1px 1px var(--lo);
}
.agenda__hero .tag {
  display: inline-flex; align-items: center; gap: 6px; background: var(--raised); color: var(--text);
  font-weight: 700; letter-spacing: 0; padding: 2px 10px 2px 8px;
}
.agenda__hero .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--area-line); }
.agenda__hero-title { font-weight: 800; color: var(--text); }
@media (min-width: 1101px) {
  .agenda__hero { padding: 14px 18px 14px 20px; border-radius: 24px; }
  .agenda__hero-sub { margin-top: 6px; }
}
/* Danach: eine Liste auf einer Fläche, Haarlinien statt Einzelkärtchen,
   der Haken als Mulde links (wie im Entwurf). Ein kleiner Stein vor dem
   Titel trägt den Bereich, seit die Seitenkante weg ist. */
.agenda__list { gap: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.agenda__row {
  background: transparent; border-left: 0; border-top: 0; border-radius: 0;
  gap: 12px; padding: 6px 12px 6px 10px;
}
.agenda__row + .agenda__row {
  background: linear-gradient(var(--border), var(--border)) no-repeat 50px 0 / calc(100% - 62px) 1px;
}
.agenda__row.is-on { background-color: transparent; }
.agenda__title::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
  background: var(--area-dot); vertical-align: .08em;
}
.agenda__row--grob .agenda__title::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--area-dot); }
.agenda__row.is-on .agenda__title { opacity: 1; color: var(--text-faint); text-decoration-thickness: 1.5px; }
.agenda__title { font-weight: 600; }
/* Der Haken: eine runde Mulde; abgehakt fällt ein Stein in Bereichsfarbe
   hinein. Das Bild bleibt 28 px, die Trefferfläche wächst weiter über das
   ::before aus „Finger statt Zeiger". */
.agenda__check {
  order: 0; width: 28px; height: 28px; margin: 0; align-self: center;
  border: 0; background: var(--mulde);
  box-shadow: inset 0 2px 3px var(--mulde-tief), inset 0 0 0 1.5px var(--rand);
  transition: background .18s, box-shadow .18s, transform .3s var(--feder);
}
.agenda__check:checked {
  background: var(--area-line); border: 0; transform: none;
  box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo), 0 1px 1px var(--lo);
}
.agenda__check:checked::after {
  left: 10px; top: 5.5px; width: 6px; height: 12px;
  border-color: var(--on-stone); border-width: 0 3px 3px 0;
}
/* Das Hineinfallen spielt jubel() einmal beim Abhaken — eine CSS-Animation
   am :checked liefe bei jedem Neuzeichnen der Agenda erneut. */
.jubel { border-radius: 50%; }
.jubel--stein { box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo), 0 1px 1px var(--lo); }
.jubel--stein::after {
  content: ""; position: absolute; left: 36%; top: 19%; width: 22%; height: 44%;
  border: solid var(--on-stone); border-width: 0 calc(var(--d) * .11) calc(var(--d) * .11) 0;
  transform: rotate(45deg);
}
.jubel--splitter { box-shadow: inset 0 1px 0 var(--hi); }
input[type="checkbox"].is-landend:checked {
  background: var(--mulde) !important; border-color: var(--rand) !important;
  box-shadow: inset 0 2px 3px var(--mulde-tief), inset 0 0 0 1.5px var(--rand) !important;
  transition: none !important;
}
input[type="checkbox"].is-landend:checked::after { visibility: hidden; }
.jubel--schwebt {
  width: auto; height: auto; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  font: 700 var(--t-body) / 1.25 var(--font-display); font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--raised); box-shadow: 0 4px 12px -4px var(--lo);
}
/* Vorschläge: gestrichelte Kontur, ✓ als Jade-Ring, × leise. */
.agenda__list:has(> .is-vorschlag) { background: transparent; gap: 6px; border-radius: 0; overflow: visible; }
.agenda__row.is-vorschlag {
  border: 1.5px dashed var(--rand); border-radius: 14px; background: transparent;
  padding: 4px 6px 4px 14px; align-items: center;
}
.agenda__row.is-vorschlag + .agenda__row.is-vorschlag { background: transparent; }
.agenda__row.is-vorschlag .agenda__title { color: var(--text-muted); }
.agenda__sugacts { align-items: center; gap: 2px; }
.agenda__sugacts button {
  border-radius: 50%; border: 0; background: transparent; color: var(--text-muted); font-weight: 700;
}
.agenda__sugacts button[data-vorschlag-ok] { color: var(--selected-text); box-shadow: inset 0 0 0 2px currentColor; }
.agenda__sugacts button:hover { background: var(--mulde); }
.agenda__foot { border-top-color: var(--border); }
.agenda__frog { border-bottom-color: var(--border); font-weight: 700; }
.agenda__row.is-wisch::before { border-radius: 0 14px 14px 0; }
.agenda__row.is-wisch-voll::before { background: var(--ink); }
.empty b { color: var(--text); }

/* Tagesform: drei Stufen als Segmentschalter auf einer Mulde. */
.energy {
  gap: 4px; padding: 4px; border-radius: 999px; background: var(--tray);
  box-shadow: inset 0 1px 2px var(--mulde-tief);
}
.energy__opt, .energy__opt[aria-pressed="true"] {
  flex-direction: row; justify-content: center; gap: 8px;
  min-height: 48px; padding: 4px 8px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-muted); font-size: var(--t-body); font-weight: 600;
}
.energy__opt[aria-pressed="true"] {
  background: var(--raised); color: var(--text);
  box-shadow: 0 1px 2px var(--lo), inset 0 1px 0 var(--hi);
}
.energy__bars { height: 16px; }
.energy__bars i { width: 4px; background: var(--mulde-tief); }
.energy__bars i:nth-child(1) { height: 6px; }
.energy__bars i:nth-child(2) { height: 11px; }
.energy__bars i:nth-child(3) { height: 16px; }
.energy__opt[data-lvl="low"] .energy__bars i:nth-child(1),
.energy__opt[data-lvl="mid"] .energy__bars i:nth-child(-n+2),
.energy__opt[data-lvl="high"] .energy__bars i { background: var(--text-faint); }
.energy__opt[data-lvl="low"][aria-pressed="true"] .energy__bars i:nth-child(1) { background: var(--warn); }
.energy__opt[data-lvl="mid"][aria-pressed="true"] .energy__bars i:nth-child(-n+2) { background: var(--jade); }
.energy__opt[data-lvl="high"][aria-pressed="true"] .energy__bars i { background: var(--success); }
@media (pointer: coarse) { .energy__opt { min-height: 48px; } }
/* „Diesen Tag freihalten" als Zeile mit Schalter — die Checkbox selbst
   wird zum Schieber, Text links, Schalter rechts. */
.freischalter {
  justify-content: space-between; gap: 12px; min-height: 56px; margin-top: var(--s-3);
  padding: 6px 12px 6px 16px; border-top: 0; border-radius: 14px; background: var(--surface);
  font-weight: 600;
}
.freischalter #dayFreiLab { order: 1; }
.switch.freischalter input {
  order: 2; appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
  position: relative; width: 52px; height: 32px; border-radius: 999px;
  background: var(--mulde); box-shadow: inset 0 2px 3px var(--mulde-tief), inset 0 0 0 1.5px var(--rand);
  transition: background .2s;
}
.switch.freischalter input::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--raised); box-shadow: inset 0 2px 1px var(--hi), inset 0 -2px 2px var(--lo), 0 1px 2px var(--lo);
  transition: transform .3s var(--feder);
}
.switch.freischalter input:checked { background: var(--ink); box-shadow: none; }
.switch.freischalter input:checked::after { transform: translateX(20px); }
.card__title { font-weight: 800; }

/* ---- Woche: Raster und Blöcke ------------------------------------------ */
.gridwrap, .timecol, .dayhead { background: var(--bg); }
.daycol, .daycol.is-weekend { background: transparent; }
.daycol.is-frei, html[data-theme="dark"] .daycol.is-frei { background: var(--mulde); }
.dayhead.is-frei { background: var(--mulde); }
.daycol__line { border-top-color: var(--border); }
.dayhead, .daycol { border-left-color: var(--border); }
.dayhead__name { font-weight: 700; letter-spacing: .08em; color: var(--text-muted); }
.dayhead.is-today .dayhead__num {
  background: var(--ink); color: var(--on-ink);
  box-shadow: inset 0 2px 1px var(--hi), inset 0 -2px 2px var(--lo);
}
.dayhead[aria-pressed="true"], .dayhead[aria-pressed="true"]:hover { background: var(--selected); }
.dayhead__last i {
  width: 24px; height: 4px; border-radius: 4px;
  background: linear-gradient(to right, var(--last-farbe, var(--jade)) 0 var(--last, 0%), var(--mulde-tief) var(--last, 0%) 100%);
}
.dayhead[aria-pressed="true"] .dayhead__last i { background: linear-gradient(to right,
    var(--last-farbe, var(--ink)) 0 var(--last, 0%), var(--mulde-tief) var(--last, 0%) 100%); }
.dayhead__frei { background: var(--raised); color: var(--text-muted); }
.timecol__mark { color: var(--text-faint); }
.now { border-top-color: var(--jade); }
.now::before { background: var(--jade); width: 10px; height: 10px; left: -5px; top: -6px; }
.rest { background-color: var(--mulde); }
.block {
  border: 0; border-radius: 12px; background: var(--area-bg); color: var(--area-text);
  padding: 5px 9px;
}
.block__title { background: var(--area-bg); font-weight: 650; }
.block__title::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%;
  background: var(--area-line); vertical-align: .06em;
}
.block.is-short .block__title::before { vertical-align: .02em; }
.block:hover { box-shadow: none; filter: brightness(.98); }
html[data-theme="dark"] .block:hover { filter: brightness(1.1); }
.block.is-done { opacity: .82; }
.block.is-done .block__title { text-decoration: none; }
.block.is-done .block__title::before { width: 10px; height: 10px; margin-right: 5px; vertical-align: -.02em;
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--lo); }
.block__done { border: 1.5px solid var(--rand); background: var(--mulde); }
.block__done::after { border-color: var(--on-stone); }
.block__done:checked { background: var(--area-line); border-color: var(--area-line);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--lo); }
.block.is-frog::after { background: var(--area-line); }
/* Vorschläge im Raster: gestrichelt auf dem Grund, nicht gefüllt. */
.block.is-sug { border: 1.5px dashed var(--area-line); background: var(--bg); }
.block.is-sug::before { display: none; }
.block.is-sug .block__title { color: var(--text-muted); background: none; }
/* blockZeilenEinpassen(): ganze Zeilen statt halb abgeschnittener. */
.block .is-weg { display: none; }
.block .is-gekuerzt { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.block__sug button {
  border-radius: 50%; border: 0; background: var(--surface); color: var(--text-muted);
  box-shadow: 0 1px 2px var(--lo); font-weight: 700;
}
.block__sug button:first-child { color: var(--selected-text); box-shadow: inset 0 0 0 2px currentColor; }
.block__sug button:hover { background: var(--mulde); }
.block__ghost { border: 1.5px dashed var(--area-line); border-radius: 12px; }
.loose { background: var(--bg); border-top-color: var(--border); }
.loosechip { border: 1.5px dashed var(--area-line); background: var(--area-bg); color: var(--area-text); }
.planhead { background: var(--bg); border-bottom-color: var(--border); }
.planhead h1 { font-weight: 800; }

/* ---- Aufgaben ---------------------------------------------------------- */
/* Eingabe als Pille mit dem Plus-Stein darin. */
.taskadd {
  align-items: center; gap: 8px; padding: 5px 5px 5px 6px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--rand);
}
.taskadd:focus-within { box-shadow: inset 0 0 0 2px var(--jade); }
.taskadd:has(.field[aria-invalid="true"]) { box-shadow: inset 0 0 0 2px var(--danger); }
.taskadd .field, .taskadd .field:focus, .taskadd .field[aria-invalid="true"] {
  border: 0; background: transparent; box-shadow: none; outline: none; padding-left: 10px;
}
.taskadd .btn--primary {
  width: 44px; min-width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo);
}
.taskadd .btn--primary .ui-icon { width: 22px; height: 22px; stroke-width: 2.4; }
.task { background: var(--surface); border-radius: 14px; }
.task:hover { border-color: transparent; background: var(--surface); }
.task__check {
  border: 0; background: var(--mulde);
  box-shadow: inset 0 2px 3px var(--mulde-tief), inset 0 0 0 1.5px var(--rand);
}
.task__check:checked {
  background: var(--jade); box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo);
}
.task__check.is-bereich:checked { background: oklch(var(--stone-L) var(--stone-C) var(--h)); }   /* = Farbe des fallenden Steins in jubel() */
.task__check:checked::after { border-color: var(--on-stone); }
.task__star { background: var(--jade); }
.task__go { background: var(--selected); color: var(--selected-text); border-radius: 999px; font-weight: 700; padding: 4px 14px; }
.task__go:hover { background: var(--surface-3); }
.task__more:hover { background: var(--mulde); }
.task__dur { border-left-color: var(--border); }
.tasks__invite { border-bottom-color: var(--border); }

/* ---- Wochenziele als Stundensteine (Schritt 2) ------------------------- */
/* Eine Stunde = ein Stein. Die Schiene (.mulden) ist das Soll, jede Mulde
   eine Stunde; abgehakt = massiver Stein, eingeplant = Ring, vorgeschlagen
   = blasser Stein, grob geplante Bereiche gestrichelt. Was über das Soll
   hinausgeht, liegt neben der Schiene und hebt sich. Gezeichnet von
   steinReihe()/steinHtml() im Skript. */
.goal__dot, .reliefrow .goal__dot, .abschlussrow .goal__dot { box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--lo); }
.goalrow, .reliefrow, .abschlussrow { border-color: transparent; background: var(--surface); }
.goals { gap: 2px; }
.goal { padding: 10px 0 12px; }
.goal .goal__dot { display: none; }   /* die Steine tragen die Farbe */
.goal__top { margin-bottom: 10px; align-items: baseline; }
.goal__name { font-size: 1.0625rem; font-weight: 700; }
.goal__num { font-size: var(--t-sm); color: var(--text-muted); }
.goal__rest { margin-top: 8px; font-size: var(--t-sm); }
.goals__which {
  background: transparent; padding: 0; margin: -4px 0 6px; border-radius: 0;
  color: var(--text-muted); font-weight: 600;
}
[data-card="ziele"] #goalsEdit { border-color: var(--rand); color: var(--selected-text); }

.steinreihe {
  --slot: 24px; --sgap: 6px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px var(--sgap);
}
.steinreihe.is-dicht { --slot: 18px; --sgap: 4px; }
.steinreihe.is-eng   { --slot: 14px; --sgap: 3px; }
.mulden {
  display: flex; flex-wrap: wrap; gap: var(--sgap); max-width: 100%;
  padding: 5px; border-radius: calc(var(--slot) / 2 + 5px);
  background: var(--tray); box-shadow: inset 0 1px 2px var(--mulde-tief);
}
.slot { position: relative; width: var(--slot); height: var(--slot); flex: none; }
.slot--mulde::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--mulde); box-shadow: inset 0 2px 3px var(--mulde-tief);
}
.slot--ueber { transform: translateY(-5px); }
.steinreihe__ueber {
  font-size: var(--t-sm); font-weight: 700; color: var(--danger); white-space: nowrap;
  font-variant-numeric: tabular-nums; transform: translateY(-5px);
}
.steinreihe__ueber.is-leise { color: var(--text-muted); font-weight: 600; transform: none; }
.stein {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 50%;
  background: var(--area-line);
  box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo), 0 1px 1px var(--lo);
}
.stein--plan { background: transparent; box-shadow: inset 0 0 0 2px var(--area-line); }
.stein--grob { background: transparent; box-shadow: none; border: 2px dashed var(--area-line); }
.stein--sug  { background: color-mix(in oklch, var(--area-line) 30%, transparent); box-shadow: none; }
.is-eng .stein--plan { box-shadow: inset 0 0 0 1.5px var(--area-line); }
.is-eng .stein--grob { border-width: 1.5px; }
svg.stein--teil { background: none; box-shadow: none; overflow: visible; }
.teil__spur { fill: none; stroke: var(--area-line); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 2 2.2; }
.teil__sug  { fill: var(--area-line); fill-opacity: .30; }
.teil__plan { fill: var(--area-line); fill-opacity: .16; stroke: var(--area-line); stroke-width: 2; stroke-linejoin: round; }
.teil__plan.is-grob { stroke-dasharray: 3 2.4; }
.teil__done { fill: var(--area-line); }
.goals__legende {
  display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0;
  font-size: var(--t-sm); color: var(--text-muted);
}
.goals__legende span { display: inline-flex; align-items: center; gap: 6px; }
.goals__legende .stein, .goals__legende .mulde {
  --area-line: var(--text-faint);
  position: static; display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none;
}
.goals__legende .mulde { background: var(--mulde); box-shadow: inset 0 2px 3px var(--mulde-tief); }
.goals__legende .stein--plan { box-shadow: inset 0 0 0 1.5px var(--area-line); }
.goals__legende .stein--grob { border-width: 1.5px; }
/* Beim Öffnen der Ziele fallen die Steine gestaffelt in ihre Mulden
   (steineFallen(), Verzögerung je Stein inline). */
@keyframes steinFall {
  0%   { transform: translateY(-26px) scale(.9); opacity: 0; }
  62%  { transform: translateY(2px) scale(1.06, .9); opacity: 1; }
  82%  { transform: translateY(-1px) scale(.98, 1.03); }
  100% { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .stein.is-fall { animation: steinFall .34s cubic-bezier(.3, .6, .4, 1) backwards; }
}

/* Auslastung wie im Entwurf: Satz oben, Schiene mit Marke darunter. */
.ampel { flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; font-size: var(--t-body); margin-bottom: var(--s-4); }
.ampel__bar {
  order: 3; flex: 1 0 100%; height: 6px; overflow: visible;
  background: var(--mulde); box-shadow: inset 0 1px 2px var(--mulde-tief);
}
.ampel__fill { border-radius: 6px; }
.ampel__mark { top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--text-muted); opacity: 1; }

/* „Neue Zusage?" als umrandete Fläche statt Linie. */
.zusage__einstieg {
  margin-top: var(--s-5); padding: 14px 16px; border-top: 0; border-radius: 18px;
  box-shadow: inset 0 0 0 1.5px var(--rand);
}
@media (hover: hover) { .zusage__einstieg:hover { background: var(--mulde); } }

/* Ziele bearbeiten: Liste mit Haarlinien, darunter die Steinreihe. */
.goallist { gap: 0; }
.goallist .goalrow { border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 14px 0; background: transparent; }
.goalrow__name { font-weight: 700; }
.goalrow .goal__dot { width: 12px; height: 12px; }
.goalrow__wert { display: flex; align-items: center; gap: 8px; margin-top: var(--s-2); }
.goalrow__wert .spacer { flex: 1; }
.goalrow__wert .goalrow__unit { margin-right: 4px; }
.goalrow__more { width: 44px; min-height: 44px; border-radius: 50%; }
.goalrow__halb {
  width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: transparent;
  color: var(--selected-text); font: inherit; font-weight: 700; font-size: var(--t-body);
  box-shadow: inset 0 0 0 1.5px var(--rand); cursor: pointer;
}
@media (hover: hover) { .goalrow__halb:not(:disabled):hover { background: var(--mulde); } }
.goalrow__halb:disabled { color: var(--text-faint); box-shadow: inset 0 0 0 1.5px var(--border); cursor: default; }
.zsteine {
  --slot: 28px;   /* zwölf Steine passen am Telefon in eine Zeile */
  display: flex; flex-wrap: wrap; gap: 1px; margin: 6px 0 2px -4px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.zsteine.is-dicht { --slot: 22px; }
.zsteine .slot { cursor: pointer; }
.zsteine .slot::before {
  content: ""; position: absolute; inset: 4px; border-radius: 50%;
  /* Ring in --rand wie bei den Haken-Mulden: die Mulden sind tippbar und
     brauchen 3:1 gegen das Blatt (kontrastlauf.js). */
  background: var(--mulde); box-shadow: inset 0 1px 2px var(--mulde-tief), inset 0 0 0 1.5px var(--rand);
}
.zsteine .slot .stein { inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }

/* Passt das noch?: die Rechnung als Steinzeile in Jade, Verdrängtes rot. */
.zsteinzeile { padding: 14px; border-radius: 18px; background: var(--bg); --area-line: var(--jade); }
.zsteinzeile .slot--verdraengt { --area-line: var(--danger); transform: translateY(-6px) rotate(-8deg); }
/* Verdrängt ist nie nur eine Farbe (ein gestrichelter Stein ohne Uhrzeit
   in „Menschen" ist ebenfalls rötlich): massiver Stein mit Schraffur und
   „!", angehoben und gekippt. Die Füllung liegt im ::before, damit die
   Maske eines angebrochenen Steins (--f) das „!" nicht mit abschneidet. */
.stein--verdraengt { --f: 1; background: none; box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--danger) 45%, transparent); }
.stein--verdraengt::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-linear-gradient(-45deg, transparent 0 3px, oklch(1 0 0 / .22) 3px 5px), var(--danger);
  box-shadow: inset 0 2px 1px var(--hi), inset 0 -3px 3px var(--lo), 0 2px 4px var(--lo);
  -webkit-mask: conic-gradient(black calc(var(--f) * 1turn), transparent 0);
  mask: conic-gradient(black calc(var(--f) * 1turn), transparent 0);
}
.stein--verdraengt::after {
  content: "!"; position: absolute; inset: 0; display: grid; place-items: center;
  font: 800 calc(var(--slot) * .62) / 1 var(--font-display); color: var(--on-danger);
}
/* Ein angebrochener verdrängter Stein trägt kein „!" — der Sektor allein
   ist zu klein dafür; seine vollen Nachbarn tragen es. */
.stein--verdraengt[style*="--f"]::after { content: none; }
.zsteinzeile p { margin: 10px 0 0; font-size: var(--t-sm); color: var(--text-muted); line-height: 1.45; }
.zusage__var { border: 1.5px solid var(--border); background: transparent; border-radius: 16px; padding: 14px 16px; }

/* ---- Blätter (Dialoge) ------------------------------------------------- */
.scrim { background: oklch(0.25 0.03 170 / .40); }
html[data-theme="dark"] .scrim { background: oklch(0.1 0.01 170 / .62); }
.sheet { border: 0; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-3); }
.sheet__title { font-weight: 800; }
.sheet__foot, html[data-theme="dark"] .sheet__foot { background: var(--surface); box-shadow: 0 -1px 0 var(--border); }
.sheet__griff { background: var(--border); }
.setmenu { background: var(--bg); }
.setmenu__item:hover { background: var(--mulde); }
.monatcell.is-today b { background: var(--ink); color: var(--on-ink); }
.monatcell__bar { background: linear-gradient(to right,
    var(--last-farbe, var(--jade)) 0 var(--last, 0%), var(--mulde-tief) var(--last, 0%) 100%); }
@media (max-width: 640px) {
  /* Nur das unten anliegende Blatt hat gerade untere Ecken — auf Tablets
     und quer steht es mittig und bleibt rundum rund. */
  .sheet { border-radius: 24px 24px 0 0; }
}
@media (max-width: 640px) and (pointer: coarse) {
  .sheet { border-radius: 24px 24px 0 0; }
}

/* ---- Hinweise ----------------------------------------------------------- */
.toast {
  background: var(--bar-bg); color: var(--bar-ink); font-weight: 600;
  padding: 11px 18px 11px 14px; border-radius: 22px; box-shadow: 0 8px 20px -8px var(--lo);
}
.toast::before {
  content: ""; width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--bar-btn);
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--lo);
}
.toast__act { color: var(--bar-btn); }

/* ---- Telefon: Tabbar und Vorschlagsleiste ------------------------------ */
@media (max-width: 1100px) {
  .tabbar { background: var(--surface) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    border-top: 0; box-shadow: inset 0 1px 0 var(--border); }
  .tabbar button { color: var(--text-faint); font-weight: 600; }
  .tabbar button[aria-current="true"] { background: transparent; color: var(--selected-text); }
  .tabbar button:active { background: var(--mulde); }
  body[data-mview="plan"] .fab { background: var(--ink); color: var(--on-ink); }
  /* Leiste: eine dunkle Pille über der Tabbar. Die Fläche des Elements
     bleibt 61 px hoch (--fuss-oben rechnet damit), die Pille liegt darin. */
  body[data-sugbar="1"] .sugbar {
    background: transparent !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    border-top: 0; box-shadow: none; padding: 6px 20px 10px 26px;
  }
  body[data-sugbar="1"] .sugbar::before {
    content: ""; position: absolute; z-index: -1; inset: 2px 10px 6px;
    border-radius: 999px; background: var(--bar-bg); box-shadow: 0 6px 16px -6px var(--lo);
  }
  .sugbar__text { color: var(--bar-ink); font-weight: 700; }
  .sugbar__accept, .sugbar .btn--primary, .sugbar .btn--primary:hover {
    background: var(--bar-btn); border-color: var(--bar-btn); color: var(--bar-btn-ink);
  }
  .sugbar__close { color: var(--bar-ink); opacity: .8; }
}
@media (max-width: 1100px) and (min-height: 501px) {
  .tabbar::before { display: none; }
  .tabbar button { margin: 2px 0; }
  .tabbar button[aria-current="true"] { background: transparent; color: var(--selected-text); }
  .tabbar button:active { background: var(--mulde); }
  /* Das „+" ist der größte Stein: 56 px, leicht über die Leiste gehoben,
     mit einem Ring in Leistenfarbe. Die Layout-Box bleibt 50 px (negativer
     Rand) — die Tabbar wird dadurch nicht höher. */
  .tabbar .tabbar__plus, .tabbar .tabbar__plus:active {
    width: 56px; height: 56px; min-height: 56px; margin: -3px 1px;
    background: var(--ink); color: var(--on-ink);
    box-shadow: inset 0 3px 2px var(--hi), inset 0 -4px 4px var(--lo), 0 4px 10px -4px var(--lo), 0 0 0 4px var(--surface);
    transform: translateY(-6px); transition: transform .3s var(--feder);
  }
  .tabbar .tabbar__plus:active { transform: translateY(-6px) scale(.94); }
  .tabbar .tabbar__plus svg { width: 26px; height: 26px; stroke-width: 2.4; }
}
/* Querformat: senkrechte Leiste — deckend, aktiver Tab als weiche Jade-Fläche. */
@media (max-height: 500px) and (max-width: 1000px) {
  .tabbar { box-shadow: inset -1px 0 0 var(--border); }
  .tabbar button[aria-current="true"] { background: var(--selected); color: var(--selected-text); }
  body[data-sugoben="1"][data-sugbar="1"] .sugbar {
    background: var(--bar-bg) !important; border-color: transparent; padding: 0 0 0 12px;
  }
  body[data-sugoben="1"][data-sugbar="1"] .sugbar::before { display: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .kopf { background: var(--bg) !important; }
  .tabbar { background: var(--surface) !important; }
  body[data-sugbar="1"] .sugbar { background: transparent !important; }
}

/* ---- Desktop: flache Arbeitsfläche neben dem Raster --------------------- */
@media (min-width: 1101px) {
  .kopf { box-shadow: 0 1px 0 var(--border); }
  .brand__mark { color: var(--ink); }
  .main > .panel {
    margin: 0; border: 0; border-right: 1px solid var(--border); border-radius: 0;
    background: var(--bg); padding: var(--s-5) var(--s-6);
  }
  .main > .panel, .main > .planwrap { margin-bottom: 0; }
  .planwrap { margin: 0; border: 0; border-radius: 0; background: var(--bg); }
  .planhead { border-bottom: 0; padding: var(--s-2) var(--s-6); }
  .planhead h1 { font-size: 1.375rem; }
  /* Reiter als Segmentschalter auf einer Mulde. */
  .panelnav {
    top: calc(var(--s-5) * -1 + 12px); margin: 0 0 var(--s-2); padding: 4px; gap: 4px;
    border: 0; border-radius: 999px; background: var(--tray);
    box-shadow: inset 0 1px 2px var(--mulde-tief), 0 -12px 0 12px var(--bg);
  }
  .panelnav button { min-height: 40px; border-radius: 999px; color: var(--text-muted); font-size: var(--t-body); }
  .panelnav button[aria-current="true"] {
    background: var(--raised); color: var(--text);
    box-shadow: 0 1px 2px var(--lo), inset 0 1px 0 var(--hi);
  }
  .dayhead { border-bottom-color: var(--border); }
}

/* ---- Bewegung (Schritt 3, Entwurf B) ------------------------------------ */
/* Blätter: am Telefon federt das Blatt von unten herein, sonst wächst es
   mittig aus 96 % und blendet auf; der Scrim blendet. Der Abgang läuft
   spiegelbildlich über eine Kopie (blattAbgang()). Ein aus modalPush()
   zurückkehrendes Blatt steht sofort wieder da (.is-zurueck). Die
   pauschale Regel für „Bewegung reduzieren" oben macht alles sofort. */
.scrim { animation: blattScrim .25s ease; }
