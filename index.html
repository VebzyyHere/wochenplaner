  // Was nach dem Filter oben noch als eigener sug-Block von heute steht, ist
  // damit bereits bewiesen vorbei — growSuggestions() (aufgerufen aus
  // placeArea() weiter unten) laesst diese Bloecke seit Stufe 16 von selbst
  // in Ruhe (kennt "jetzt", verlaengert kein Ende, das schon erreicht oder
  // ueberschritten ist). Bis dahin brauchte es hier eine eigene Sicherung
  // und Rueckschreibung dafuer — seit growSuggestions() die Regel selbst
  // kennt, ist das ueberfluessig.
  const todo = state.areas
    .filter(a => !a.plan.keinVorschlag)
    .filter(a => a.plan.days.includes(day.i) && fensterErlaubtTag(a.regeln, day.i))
    .map(a => ({ a: { ...a, plan: { ...a.plan, days: [day.i] } },
      open: a.plan.goal * 60 - areaMinutes(a.id, false) - areaMinutes(a.id, true) }))
    .filter(x => x.open >= 15)
    .sort((x, y) => (y.a.plan.must - x.a.plan.must) || (y.open - x.open));

  let placed = 0, missing = 0, hinweise = [];
  todo.forEach(({ a, open }) => {
    const got = placeArea(a, open);
    placed += got;
    missing += open - got;
    if (!got) { const h = mcsHinweis(a); if (h) hinweise.push(h); }
  });

  return { placed, missing, hinweise };
}

/* Nur fuer die Anzeige des Knopfs: derselbe Aufbau wie oben, aber auf
   einer Kopie von state.blocks probiert — state.blocks wird kurz
   umgehaengt (JS ist einstraengig, es laeuft nichts anderes dazwischen)
   und danach wieder auf die echte Liste zurueckgestellt. So weiss der
   Knopf, ob es heute noch etwas zu verteilen gibt, ohne selbst schon
   etwas zu verteilen — ein Knopf, der nichts tun kann, ist Laerm. */
function restDesTagesMoeglich() {
  const echt = state.blocks;
  state.blocks = echt.map(b => ({ ...b }));
  const r = restDesTagesBauen();
  state.blocks = echt;
  return r.placed > 0;
}

/* Stufe B2: der zeitlich früheste offene Vorschlag im GANZEN Zustand, nicht
   nur der angezeigten Woche — nach Datum, bei Gleichstand nach Beginn.
   Grobe zählen mit dem Beginn ihres Abschnitts, dasselbe Muster wie
   tagesAgenda() (2750 ff.) beim Mischen von exakt und grob verwendet.
   Grundlage für den Leisten-Link: "zeig mir den nächsten", auch wenn er in
   einer anderen Woche liegt. */
function fruehesterVorschlag() {
  let best = null, bestStart = 0;
  state.blocks.forEach(b => {
    if (!b.sug) return;
    const start = b.grob ? abschnittVon(b.teil).von : b.start;
    if (!best || b.date < best.date || (b.date === best.date && start < bestStart)) {
      best = b; bestStart = start;
    }
  });
  return best;
}

/* Stufe B2: springt zum frühesten offenen Vorschlag — eigene Funktion statt
   einer Handler-Inline-Funktion, damit Prüfskripte den Sprung auch dann
   direkt auslösen können, wenn die Leiste selbst gerade nicht im Bild ist
   (hasSuggestions() gilt nur für die angezeigte Woche; ein Vorschlag allein
   in der Folgewoche zeigt die Leiste in der laufenden Woche folgerichtig
   nicht — das ändert dieser Auftrag nicht). Muster wie planeNaechsteWoche()
   unten: anchor auf den Montag der Zielwoche, dann rendern. */
function springZumFruehestenVorschlag() {
  const b = fruehesterVorschlag();
  if (!b) return;
  const zielMontag = mondayOf(new Date(b.date + "T12:00:00"));
  if (iso(zielMontag) !== iso(mondayOf(anchor))) anchor = zielMontag;
  selectedDayIdx = b.day;
  setView("plan");
  renderAll();
}

/* Vorschlagsleiste ueber der Tabbar: dieselben drei Funktionen wie in
   "Ziele" (hasSuggestions/acceptSuggestions/clearSuggestions), nur auch
   in "Plan" und "Heute" sichtbar platziert — vorher musste man dafuer
   extra nach "Ziele" wechseln. Der data-sugbar-Flag am body treibt sowohl
   die Sichtbarkeit der Leiste als auch die Fussbereich-Stapelung in CSS
   (--fuss-oben, s. Responsive-Media-Query). */
function renderSugBar() {
  const bar = $("#sugBar");
  const aktiv = hasSuggestions() && (mview === "plan" || mview === "heute");
  document.body.dataset.sugbar = aktiv ? "1" : "0";
  bar.innerHTML = "";
  if (!aktiv) return;

  const keys = new Set(weekDays().map(d => d.key));
  const n = state.blocks.filter(b => b.sug && keys.has(b.date)).length;

  // Stufe B2: das Label ist ein echter Weg, kein bloßer Text mehr — Tipp
  // darauf springt zum frühesten offenen Vorschlag, auch wenn er in einer
  // anderen Woche liegt (Muster wie planeNaechsteWoche() unten: anchor auf
  // den Montag der Zielwoche, dann rendern).
  const text = document.createElement("button");
  text.type = "button"; text.className = "sugbar__text";
  text.textContent = n + (n === 1 ? " Vorschlag" : " Vorschläge");
  text.setAttribute("aria-label", "Vorschläge im Plan ansehen");
  text.onclick = () => springZumFruehestenVorschlag();

  const ok = document.createElement("button");
  ok.type = "button"; ok.className = "btn btn--primary sugbar__accept";
  ok.textContent = "Übernehmen";
  ok.onclick = () => {
    // Stufe C Punkt C7: die Blöcke VOR acceptSuggestions() sammeln — die
    // Funktion selbst löscht gleich die sug-Flags, an denen die Auswahl hängt.
    const bloecke = sugBlockeDieserWoche();
    acceptSuggestions();
    save(); renderAll();
    toast(toastUebernommenText(bloecke));
  };

  const close = document.createElement("button");
  close.type = "button"; close.className = "btn btn--icon btn--ghost sugbar__close";
  close.textContent = "×";
  close.setAttribute("aria-label", "Vorschläge verwerfen");
  close.onclick = () => { clearSuggestions(); save(); renderAll(); toast("Vorschläge verworfen"); };

  bar.append(text, ok, close);
}

// Die CSS-Werte sind der Startwert ohne JavaScript-Messung. Tatsächliche
// Höhen variieren mit Schrift, Safe Area und Zeilenumbrüchen. Ein ResizeObserver
// hält alle schwebenden Elemente und das Scrollpolster an derselben Kante.
function fussbereichMessen() {
  if (!isMobile) {
    document.body.style.removeProperty("--fussleiste");
    document.body.style.removeProperty("--fuss-oben");
    return;
  }
  const hoehe = id => document.getElementById(id).getBoundingClientRect().height;
  // v1.32: quer steht die Tabbar senkrecht am Rand — unten bleibt dann nur
  // der Bereich des Home-Indikators. Die Vorschlagsleiste zählt nur mit,
  // solange sie unten steht (sugbarPlatzieren()).
  const unten = window.matchMedia(QUER_Q).matches ? sicherUnten() : hoehe("tabbar");
  const sug = document.body.dataset.sugoben === "1" ? 0 : hoehe("sugBar");
  document.body.style.setProperty("--fussleiste", unten + "px");
  document.body.style.setProperty("--fuss-oben", (unten + sug) + "px");
}

/* env(safe-area-inset-bottom) in Pixeln — CSS kennt den Wert, JS nicht
   direkt. Ein unsichtbarer Messkörper mit genau dieser Höhe. */
function sicherUnten() {
  let m = document.getElementById("sicherMass");
  if (!m) {
    m = document.createElement("div");
    m.id = "sicherMass"; m.setAttribute("aria-hidden", "true");
    m.style.cssText = "position:fixed;left:0;bottom:0;width:0;visibility:hidden;pointer-events:none;height:var(--safe-bottom)";
    document.body.appendChild(m);
  }
  return m.getBoundingClientRect().height;
}

/* v1.32: Höhe des Glas-Kopfs, über dem der Inhalt am Telefon liegt. */
function kopfhoeheMessen() {
  if (!isMobile) { document.body.style.removeProperty("--kopf-h"); return; }
  document.body.style.setProperty("--kopf-h", $("#kopf").getBoundingClientRect().height + "px");
}

/* v1.32: Telefon quer und breit genug — die Vorschlagsleiste wandert in
   die Kopfzeile (zwischen Wochennavigation und Monatssymbol) und kostet
   dem Raster keine eigene Zeile mehr. Sonst steht sie wie bisher unten. */
function sugbarPlatzieren() {
  const bar = $("#sugBar");
  const oben = window.matchMedia(SUG_OBEN_Q).matches;
  document.body.dataset.sugoben = oben ? "1" : "0";
  if (oben && bar.parentElement.classList.contains("app")) $(".topbar").insertBefore(bar, $("#monthBtn"));
  if (!oben && !bar.parentElement.classList.contains("app")) $(".app").insertBefore(bar, $("#tabbar"));
  fussbereichMessen();
}

/* ============================================================ Ziele-Anzeige */
/* Ist die angezeigte Woche die laufende? */
function istDieseWoche() {
  return iso(mondayOf(anchor)) === iso(mondayOf(new Date()));
}

/* Blättert zu einer Woche und verteilt dort gleich — gemeinsamer Kern von
   planeNaechsteWoche() und dem "+"-Tipp auf eine künftige KW im
   Monatsblatt (monatSheet(), Stufe M1). Läuft seit dort durchs
   Kapazitäts-Gate wie die anderen drei Verteil-Einstiege (Stufe A/D) —
   vorher rief planeNaechsteWoche() buildSuggestions() direkt auf, ganz
   ohne Nachfrage; das war die einzige Lücke im Gate.

   Stufe M3.3: der Erfolgs-Toast richtet sich nach der Distanz der Zielwoche
   zur ECHTEN Heute-Woche (nicht zu anchor, der hier schon auf montag
   steht) — höchstens eine Woche entfernt bleibt es wörtlich "…nächste
   Woche…" (kapazitaet.js d)/f)/g) prüfen genau diesen Fall: der Knopf
   "Nächste Woche planen" erscheint nur, wenn die laufende Woche schon die
   echte aktuelle ist, das Ziel ist dort also immer genau +1). Weiter
   entfernt (z.B. der "+"-Tipp auf eine fernere KW im Monatsblatt) nennt
   der Toast die Kalenderwoche statt zu lügen. */
function planeWoche(montag) {
  const heuteMon = mondayOf(new Date());
  const distanzWochen = Math.round((montag - heuteMon) / 604800000);
  anchor = montag;
  verteilenMitGate(() => {
    const r = buildSuggestions();
    save(); renderAll();
    if (!r.placed) toast("Nichts zu verteilen — alle Ziele sind schon gedeckt");
    else if (Math.abs(distanzWochen) <= 1) toast("Vorschlag für die nächste Woche steht");
    else toast("Vorschlag für KW " + isoWeek(montag) + " steht");
  });
}

/* Vorausplanen ging immer schon — man musste nur wissen, dass man
   vorblättern kann. Genau das wusste niemand. */
function planeNaechsteWoche() {
  planeWoche(addDays(mondayOf(anchor), 7));
}

/* Stufe A: der Torwächter vor jedem Verteilen — vorher stand diese Prüfung
   nur in renderGoals(), die leere "Heute"-Karte (#agendaVorschlag) rief
   buildSuggestions() daneben ungeprüft auf. "verteilen" ist die eigentliche
   Aktion (buildSuggestions() + save()/renderAll() + Toast) — passt die Woche,
   läuft sie sofort; sonst "Das wird eng" mit dem Ausweg, statt erst zu
   verteilen und danach zu melden, was nicht passte. */
function verteilenMitGate(verteilen) {
  const k = wochenKapazitaet();
  if (k.ok) { verteilen(); return; }
  const blatt = modal((sh, close) => {
    sh.innerHTML =
      "<h2 class='sheet__title'>Das wird eng</h2>" +
      "<p style='margin:0 0 14px;color:var(--text-muted);font-size:var(--t-body);line-height:1.6'>" +
      "Deine Ziele und Termine summieren sich mit den nötigen Pausen auf <b>" +
      fmtDur(Math.round(k.bedarf)) + "</b>. In dieser Woche stehen dir " +
      fmtDur(Math.round(k.wach)) + " wache Stunden zur Verfügung — realistisch verplanbar " +
      "sind davon etwa <b>" + fmtDur(Math.round(k.grenze)) + "</b>.</p>" +
      "<p style='margin:0 0 14px;color:var(--text-faint);font-size:var(--t-sm);line-height:1.6'>" +
      "Ein Plan ohne Luft hält nicht: Es kommt immer etwas dazwischen, und dann " +
      "kippt der ganze Tag statt nur ein Block. Nimm lieber " +
      fmtDur(Math.round(k.bedarf - k.grenze)) + " aus den Wochenzielen heraus.</p>" +
      "<div id='wAmpel'></div>";
    ampelZeichnen(sh.querySelector("#wAmpel"));
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const trotz = document.createElement("button");
    trotz.className = "btn"; trotz.type = "button"; trotz.textContent = "Trotzdem verteilen";
    trotz.onclick = () => { close(); verteilen(); };
    foot.appendChild(trotz);
    // Der eigentliche Ausweg — nur in der laufenden Woche sinnvoll: in einer
    // Zukunftswoche gibt es kein "nächste Woche", das mehr Platz hätte.
    if (istDieseWoche()) {
      const weiter = document.createElement("button");
      weiter.className = "btn"; weiter.type = "button"; weiter.textContent = "Nächste Woche planen";
      weiter.onclick = () => { close(); planeNaechsteWoche(); };
      foot.appendChild(weiter);
    }
    const sp = document.createElement("span"); sp.className = "spacer";
    foot.appendChild(sp);
    const ziele = document.createElement("button");
    ziele.className = "btn btn--primary"; ziele.type = "button"; ziele.textContent = "Ziele anpassen";
    ziele.onclick = () => { close(); goalsSheet(); };
    foot.appendChild(ziele);
    sh.appendChild(foot);
  });
  // Schonfrist gegen den hastigen Doppeltipp: dieses Blatt öffnet sich
  // synchron unter dem Finger, und sein Fuß liegt fast genau dort, wo
  // eben noch der Auslöser saß ("Woche anlegen" im Assistenten,
  // "Vorschlagen" in den Zielen). Der zweite Tipp eines Doppeltipps traf
  // deshalb sofort "Ziele anpassen" — oder den Scrim, der schon auf
  // pointerdown schließt: niemand hat "Das wird eng" je gesehen
  // (werkzeug/doppeltipp.js). pointer-events statt Klick-Verschlucken,
  // damit Klicks mit Trefferprüfung (Playwright) von selbst warten statt
  // ins Leere zu laufen — so bleiben ob.js/kapazitaet.js unverändert
  // grün; der Streutipp fällt auf die inerte App. Bewusst nur setTimeout,
  // kein Date.now(): setFixedTime() in den Prüfskripten friert die Uhr
  // ein, echte Timer laufen weiter. Bewusst NICHT mit eingefroren: Toasts
  // mit Aktionsknopf (einziger Nachbar außerhalb der inerten .app) — ein
  // none am #toasts-Elternknoten verlöre gegen deren eigene
  // pointer-events-Regeln (.toast__act, :has()-Regel darüber), und der
  // Fall braucht Toast, Gate und Deckungsgleichheit zugleich.
  const scrim = blatt.parentElement;
  scrim.style.pointerEvents = "none";
  // Die Schonfrist oben wehrt nur ZEIGER ab — auf dem Desktop setzt modal()
  // aber nach 40ms einen Autofokus, und ein hastiges Doppel-Enter (Enter löst
  // "Woche anlegen"/"Vorschlagen" aus, das zweite Enter trifft dann den schon
  // fokussierten Gate-Knopf) kommt ganz ohne Zeiger aus. Deshalb dieselbe
  // Frist auch für Tastatur-AKTIVIERUNGEN in der Capture-Phase: Enter und
  // Leertaste werden geschluckt, Pfeiltasten/Tab/Escape bleiben frei.
  const tastenSperre = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); }
  };
  blatt.addEventListener("keydown", tastenSperre, true);
  setTimeout(() => {
    scrim.style.pointerEvents = "";
    blatt.removeEventListener("keydown", tastenSperre, true);
  }, 300);
}

/* ============================================================
   Passt das noch? (v1.32) — erste Fassung von „Was kostet mich dieses
   Ja?" aus IDEEN.md

   Vor einer Zusage durchspielen, was sie die Woche kostet. Bewusst nur aus
   dem gebaut, was die App schon weiß — wochenKapazitaet() (dieselbe Marke
   wie Ampel und Gate), freeGaps() (dieselben Lücken wie der Verteiler) und
   die offenen Wochenziele. Keine neuen Datenfelder, keine erfundene
   Rangfolge: welches Ziel weichen soll, entscheidet der Mensch — das Blatt
   nennt nur, welche offenen Ziele dann um den Platz konkurrieren.
   Nichts wird still gespeichert: jede Variante öffnet das normale
   Eintragsblatt vorausgefüllt.
   ============================================================ */

/* Die Rechnung einer Woche mit (montag) als anchor — anchor wird nur für
   die Dauer der Rechnung umgestellt und danach zurückgesetzt. */
function inWoche(montag, fn) {
  const alt = anchor;
  anchor = montag;
  try { return fn(); } finally { anchor = alt; }
}

function zusageDurchspielen(minuten, areaId, montag) {
  const area = areaById(areaId);
  const A = artOf(area);
  return inWoche(montag, () => {
    const k = wochenKapazitaet();
    const pause = Math.ceil(minuten / A.max) * A.pause;
    const bedarfNeu = k.bedarf + minuten + pause;
    // Freie Stellen am Stück, je Tag die früheste — Fenster und Anker des
    // Bereichs gelten für seine Ziele, nicht für eine fremde Zusage;
    // freigehaltene Tage bleiben tabu.
    const luecken = [];
    weekDays().forEach(day => {
      freeGaps(day, { from: null, to: null, days: [day.i] }, area, { ignoreFenster: true, ignoreAnker: true })
        .forEach(g => {
          // Auf die Viertelstunde: „13:20" nach einer 5-Minuten-Pause sagt niemand zu.
          const start = Math.ceil(g.start / 15) * 15;
          if (g.end - start >= 15) luecken.push({ day, start, end: g.end, laenge: g.end - start });
        });
    });
    const passend = [];
    luecken.filter(l => l.laenge >= minuten).forEach(l => {
      if (passend.length < 3 && !passend.some(p => p.day.i === l.day.i)) passend.push(l);
    });
    const groesste = luecken.reduce((m, l) => (!m || l.laenge > m.laenge ? l : m), null);
    // Offene Ziele dieser Woche — das, was bei einer engen Woche um Platz ringt.
    const offeneZiele = state.areas
      .map(a => ({ a, rest: Math.max(0, a.plan.goal * 60 - areaMinutes(a.id, false)) }))
      .filter(x => x.rest >= 15);
    return {
      k, pause, bedarfNeu,
      quoteVor: k.quote, quoteNach: k.wach ? bedarfNeu / k.wach : 9.99,
      okNach: bedarfNeu <= k.grenze,
      luft: Math.max(0, Math.floor((k.grenze - k.bedarf) / 15) * 15),
      ueber: Math.max(0, Math.round(bedarfNeu - k.grenze)),
      passend, groesste, offeneZiele
    };
  });
}

function zusageSheet() {
  const heuteMon = mondayOf(new Date());
  const ersteWoche = mondayOf(anchor) < heuteMon ? heuteMon : mondayOf(anchor);
  const standardBereich = (state.areas.find(a => /alltag/i.test(a.name)) || state.areas[state.areas.length - 1]).id;
  let titel = "", minuten = 120, areaId = standardBereich, montag = ersteWoche;

  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Passt das noch?</h2>" +
      "<p class='zusage__intro'>Bevor du zusagst: Was kostet es deine Woche? Nichts wird eingetragen, bevor du es bestätigst.</p>" +
      // Dauer und Woche zuerst, das Ergebnis direkt darunter — am Telefon
      // sieht man so, was ein Tipp auf „3 h" bewirkt. Titel und Bereich
      // braucht erst der Eintrag (der Bereich ändert nur Pausen und Wege).
      "<div class='sheet__row'><span class='label'>Wie lange etwa?</span><div class='chipset' id='zDauer'></div></div>" +
      "<div class='sheet__row'><span class='label'>Welche Woche?</span><div class='chipset' id='zWoche'></div></div>" +
      "<div class='zusage' id='zErgebnis' aria-live='polite'></div>" +
      "<div class='sheet__row' style='margin-top:var(--s-5)'><label class='label' for='zTitel'>Für den Eintrag: worum geht es?</label>" +
      "<input class='field' id='zTitel' placeholder='z.B. Umzug helfen, Zusatzprojekt' autocomplete='off'></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span><div class='chipset' id='zBereich'></div></div>";

    const chips = (wrap, optionen, aktuell, setzen) => {
      wrap.innerHTML = "";
      optionen.forEach(([wert, text]) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(wert === aktuell()));
        c.textContent = text;
        c.onclick = () => { setzen(wert); malen(); };
        wrap.appendChild(c);
      });
    };
    const inp = s.querySelector("#zTitel");
    inp.addEventListener("input", () => { titel = inp.value.trim(); });

    const slotText = l => DAY_SHORT[l.day.i] + " " + l.day.d.getDate() + "." + (l.day.d.getMonth() + 1) + ". " +
      fmtTime(l.start) + "–" + fmtTime(Math.min(l.end, l.start + minuten));
    const eintragen = (tagIdx, datum, start, laenge) => {
      close();
      anchor = new Date(datum + "T12:00:00");
      selectedDayIdx = tagIdx;
      renderAll();
      blockSheet({ id: null, title: titel, areaId, day: tagIdx, date: datum, repeat: "none",
        start, end: Math.min(state.settings.dayEnd * 60, start + laenge), frog: false });
    };
    const variante = (kopf, text, knopf, aktion) => {
      const v = document.createElement("div");
      v.className = "zusage__var";
      v.innerHTML = "<div class='zusage__kopf'>" + kopf + "</div><div class='zusage__text'>" + text + "</div>";
      if (knopf) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "btn btn--sm"; b.textContent = knopf;
        b.onclick = aktion;
        v.appendChild(b);
      }
      return v;
    };
    const pct = q => (q > 2 ? "über 200" : String(Math.round(q * 100))) + " %";
    // „3 h 15 min" statt „3,3 h" — so sagt man eine Dauer zu.
    const genau = m => m >= 60 ? Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : "") : m + " min";

    const malen = () => {
      chips(s.querySelector("#zDauer"), [[30, "30 min"], [60, "1 h"], [120, "2 h"], [180, "3 h"], [240, "4 h"], [360, "6 h"]],
        () => minuten, w => { minuten = w; });
      chips(s.querySelector("#zBereich"), state.areas.map(a => [a.id, a.name]), () => areaId, w => { areaId = w; });
      const naechste = addDays(ersteWoche, 7);
      chips(s.querySelector("#zWoche"), [[iso(ersteWoche), ersteWoche.getTime() === heuteMon.getTime() ? "Diese Woche" : "KW " + isoWeek(ersteWoche)],
        [iso(naechste), naechste.getTime() === addDays(heuteMon, 7).getTime() ? "Nächste Woche" : "KW " + isoWeek(naechste)]],
        () => iso(montag), w => { montag = new Date(w + "T12:00:00"); montag = mondayOf(montag); });

      const r = zusageDurchspielen(minuten, areaId, montag);
      const box = s.querySelector("#zErgebnis");
      box.innerHTML = "";
      const lage = document.createElement("p");
      lage.className = "zusage__lage";
      lage.innerHTML = "Jetzt zu <b>" + pct(r.quoteVor) + "</b> verplant, mit dieser Zusage zu <b>" + pct(r.quoteNach) + "</b>. " +
        (r.okNach
          ? "Das bleibt unter der Marke von " + Math.round(VERPLANT_GRENZE * 100) + " %."
          : "Das liegt " + fmtDur(r.ueber) + " über der Marke von " + Math.round(VERPLANT_GRENZE * 100) + " %.");
      box.appendChild(lage);

      // v1.42: dieselbe Rechnung als Steine. Mulden = Luft bis zur Marke
      // (r.luft), Steine = die Zusage samt der Pausen, die die App für ihren
      // Bereich rechnet (r.pause); was nicht mehr in eine Mulde passt, hebt
      // sich als verdrängt ab. Viel Luft (leere Zukunftswoche: 40 h und mehr)
      // wird nach den Steinen der Zusage plus einer freien Mulde, mindestens
      // sechs, als Zahl weitergeführt, statt die Zeile zu sprengen.
      const braucht = minuten + r.pause;
      const zeigeLuft = Math.min(r.luft, Math.max(6, Math.ceil(braucht / 60) + 1) * 60);
      const zeile = document.createElement("div");
      zeile.className = "zsteinzeile";
      zeile.innerHTML = steinReihe({ soll: zeigeLuft, ist: braucht, plan: braucht, verdraengt: true,
          ueber: r.luft > zeigeLuft ? "+" + genau(r.luft - zeigeLuft) : null, ueberLeise: true }) +
        "<p>" + (r.luft ? "Die Mulden sind die Luft bis zur Marke: " + genau(r.luft) + "." : "Bis zur Marke ist keine Luft mehr.") +
        " Die Zusage braucht " + genau(braucht) + (r.pause ? " mit Pausen." : ".") +
        // Nur, wenn wirklich ein Stein übersteht (auf volle Stunden gezählt).
        (!r.okNach && r.offeneZiele.length && Math.ceil(braucht / 60) > Math.ceil(zeigeLuft / 60)
          ? " Was übersteht, fehlt deinen offenen Zielen." : "") + "</p>";
      box.appendChild(zeile);

      // 1) Ganz zusagen
      const erste = r.passend[0];
      const folge = r.okNach ? "Keine Folgen für deine Wochenziele."
        : r.offeneZiele.length
          ? "Dann konkurrieren deine offenen Ziele um den Rest: " +
            r.offeneZiele.map(x => escapeHtml(x.a.name) + " " + fmtDur(x.rest)).join(", ") + "."
          : "Die Woche wird eng — Pausen und Puffer schrumpfen.";
      box.appendChild(variante(
        "Ganz zusagen · " + fmtDur(minuten),
        (erste ? "Frei am Stück: " + r.passend.map(slotText).join(" · ") + ". " : "Am Stück ist dafür keine Lücke frei. ") + folge,
        erste ? "Eintragen am " + DAY_SHORT[erste.day.i] : null,
        erste ? () => eintragen(erste.day.i, erste.day.key, erste.start, minuten) : null));

      // 2) Kleiner zusagen — nur, wenn das Ganze nicht folgenlos passt,
      //    aber ein spürbarer Teil schon: höchstens die Luft bis zur Marke
      //    und höchstens die größte freie Lücke.
      if (!r.okNach || !erste) {
        const kleiner = Math.min(r.luft, r.groesste ? Math.floor(r.groesste.laenge / 15) * 15 : 0, minuten - 15);
        if (kleiner >= 30) {
          const l = r.groesste;
          box.appendChild(variante(
            "Kleiner zusagen · " + genau(kleiner),
            "Ein klar begrenzter Teil passt ohne Folgen für deine Ziele, z.B. " +
              DAY_SHORT[l.day.i] + " " + l.day.d.getDate() + "." + (l.day.d.getMonth() + 1) + ". ab " + fmtTime(l.start) + ".",
            "Teil eintragen",
            () => eintragen(l.day.i, l.day.key, l.start, kleiner)));
        }
      }

      // 3) Eine Woche später
      const spaeter = addDays(montag, 7);
      const r2 = zusageDurchspielen(minuten, areaId, spaeter);
      const erste2 = r2.passend[0];
      box.appendChild(variante(
        "Eine Woche später · KW " + isoWeek(spaeter),
        "Dort zu " + pct(r2.quoteNach) + " verplant" + (r2.okNach ? ", unter der Marke." : ", " + fmtDur(r2.ueber) + " über der Marke.") +
          (erste2 ? " Frei am Stück: " + slotText(erste2) + "." : " Am Stück keine Lücke frei."),
        erste2 ? "Dort eintragen" : null,
        erste2 ? () => eintragen(erste2.day.i, erste2.day.key, erste2.start, minuten) : null));

      const absagen = document.createElement("p");
      absagen.className = "zusage__absagen";
      absagen.textContent = "Und Absagen ist auch eine Variante: Deine Woche bleibt, wie sie ist.";
      box.appendChild(absagen);
    };
    malen();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const sp = document.createElement("span"); sp.className = "spacer";
    const fertig = document.createElement("button");
    fertig.className = "btn"; fertig.type = "button"; fertig.textContent = "Schließen";
    fertig.onclick = close;
    foot.append(sp, fertig);
    s.appendChild(foot);
  });
}

/* ============================================================
   Wochenkarte (v1.35)

   Die Woche als Bild zum Teilen — für die Story, den Chat mit der
   Lerngruppe oder einfach das eigene Fotoalbum. Gezählt wird, was
   wirklich passiert ist (abgehakt), daneben, was geplant war; dieselben
   Regeln wie im Wochenrückblick: Vorschläge zählen nicht, eine Serie zählt
   an jedem ihrer Tage. Liest nur, schreibt nichts in state.

   Gezeichnet wird auf ein Canvas (1080 × 1350, 4:5) in der eingebetteten
   runden Schrift — die gibt es auf jedem Gerät, auch dort, wo das Canvas
   ui-rounded nicht kennt. Bereichsfarben werden aus OKLCH in sRGB
   umgerechnet, weil nicht jedes Canvas OKLCH versteht.
   ============================================================ */
function wochenBilanz() {
  const tage = weekDays();
  const bereiche = [];
  let ist = 0, geplant = 0, haken = 0;
  state.areas.forEach(a => {
    let aIst = 0, aPlan = 0;
    tage.forEach(d => state.blocks.forEach(b => {
      if (b.areaId !== a.id || b.sug || !onDay(b, d.key, d.i)) return;
      aPlan += dauerVon(b);
      if (istErledigt(b, d.key)) { aIst += dauerVon(b); haken++; }
    }));
    ist += aIst; geplant += aPlan;
    const ziel = a.plan.goal * 60;
    if (ziel > 0 || aIst > 0) bereiche.push({ name: a.name, hue: a.hue, ist: aIst, plan: aPlan, ziel });
  });
  bereiche.sort((x, y) => (y.ziel > 0) - (x.ziel > 0) || y.ist - x.ist);
  const mitZiel = bereiche.filter(x => x.ziel > 0);
  const geschafft = mitZiel.filter(x => x.ist >= x.ziel).length;
  return { ist, geplant, haken, bereiche, mitZiel: mitZiel.length, geschafft };
}

function bilanzSatz(bz) {
  if (bz.mitZiel && bz.geschafft === bz.mitZiel) return "Jedes Wochenziel geschafft. Legendär.";
  if (bz.mitZiel && bz.geschafft * 2 >= bz.mitZiel) return "Mehr als die Hälfte der Ziele geschafft. Läuft.";
  if (bz.haken === 1) return "Der erste Haken ist gesetzt. Weiter so.";
  if (bz.haken) return "Jeder Haken zählt – " + bz.haken + " sind es schon.";
  return "Frische Woche. Alles ist drin.";
}

/* OKLCH → sRGB (Björn Ottosson, OKLab), fürs Canvas. */
function oklchRgb(L, C, h, alpha) {
  const hr = h * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  const kanal = x => {
    x = Math.max(0, Math.min(1, x));
    return Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055));
  };
  const r = kanal(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s);
  const g = kanal(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s);
  const bl = kanal(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
  return alpha == null ? "rgb(" + r + "," + g + "," + bl + ")" : "rgba(" + r + "," + g + "," + bl + "," + alpha + ")";
}

async function wochenkarteZeichnen() {
  const B = 1080, H = 1350, SCHRIFT = '"Gabarito", ui-rounded, system-ui, sans-serif';
  if (document.fonts && document.fonts.load) {
    try { await Promise.all([document.fonts.load('800 160px "Gabarito"'), document.fonts.load('600 40px "Gabarito"')]); } catch (e) {}
  }
  const bz = wochenBilanz();
  const mon = mondayOf(anchor), so = addDays(mon, 6);
  const c = document.createElement("canvas");
  c.width = B; c.height = H;
  const x = c.getContext("2d");
  const schrift = (gewicht, px) => { x.font = gewicht + " " + px + "px " + SCHRIFT; };
  const kuerzen = (text, breite) => {
    if (x.measureText(text).width <= breite) return text;
    while (text.length > 1 && x.measureText(text + "…").width > breite) text = text.slice(0, -1);
    return text + "…";
  };
  const pille = (px, py, w, h, farbe) => {
    x.fillStyle = farbe; x.beginPath();
    if (x.roundRect) x.roundRect(px, py, w, h, h / 2); else x.rect(px, py, w, h);
    x.fill();
  };

  // Grund: ruhiges Salbei, dazu große weiche Farbflecken in den Tönen der Woche.
  x.fillStyle = oklchRgb(0.975, 0.018, 150); x.fillRect(0, 0, B, H);
  const toene = bz.bereiche.length ? bz.bereiche.map(b => b.hue) : [150, 280, 30];
  [[B * 0.92, 120, 330], [80, H * 0.62, 260], [B * 0.78, H * 0.94, 300]].forEach(([cx, cy, r], i) => {
    x.fillStyle = oklchRgb(0.82, 0.12, toene[i % toene.length], 0.35);
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  });

  // Marke
  const gruen = oklchRgb(0.36, 0.08, 150);
  pille(80, 80, 64, 64, gruen);
  x.strokeStyle = "#ffffff"; x.lineWidth = 6; x.lineCap = "round";
  [[98, 124, 108], [112, 124, 96], [126, 124, 112]].forEach(([sx, y1, y2]) => { x.beginPath(); x.moveTo(sx, y1); x.lineTo(sx, y2); x.stroke(); });
  x.fillStyle = oklchRgb(0.25, 0.03, 150); schrift(700, 38); x.textBaseline = "middle";
  x.fillText("Wochenplaner", 164, 114);

  // Woche
  x.textBaseline = "alphabetic";
  x.fillStyle = oklchRgb(0.22, 0.04, 150); schrift(800, 170);
  x.fillText("KW " + isoWeek(mon), 76, 370);
  x.fillStyle = oklchRgb(0.45, 0.03, 150); schrift(600, 46);
  const monat = m => MONTHS[m.getMonth()];
  x.fillText(mon.getDate() + ". " + (mon.getMonth() === so.getMonth() ? "" : monat(mon) + " ") + "– " + so.getDate() + ". " + monat(so) + " " + so.getFullYear(), 82, 440);

  // Die Zahl der Woche
  const zahl = bz.ist > 0 ? bz.ist : bz.geplant;
  x.fillStyle = gruen; schrift(800, 128);
  const zahlText = fmtDur(zahl);
  x.fillText(zahlText, 76, 610);
  const zb = x.measureText(zahlText).width;
  x.fillStyle = oklchRgb(0.35, 0.04, 150); schrift(650, 44);
  x.fillText(bz.ist > 0 ? "wirklich gemacht" : "eingeplant", 76 + zb + 24, 606);
  x.fillStyle = oklchRgb(0.3, 0.03, 150); schrift(600, 42);
  x.fillText(kuerzen(bilanzSatz(bz), B - 160), 80, 690);

  // Bereiche
  let y = 800;
  // Vier Zeilen passen über den Fuß; der Rest wird genannt, nicht gequetscht.
  const zeilen = bz.bereiche.slice(0, 4);
  if (!zeilen.length) {
    x.fillStyle = oklchRgb(0.45, 0.03, 150); schrift(600, 40);
    x.fillText("Noch keine Wochenziele – die nächste Woche wartet.", 80, y);
  }
  zeilen.forEach(bb => {
    const voll = bb.ziel > 0 ? bb.ziel : Math.max(bb.plan, bb.ist, 1);
    const anteil = Math.max(0, Math.min(1, bb.ist / voll));
    x.fillStyle = oklchRgb(0.62, 0.15, bb.hue);
    x.beginPath(); x.arc(92, y - 14, 12, 0, Math.PI * 2); x.fill();
    x.fillStyle = oklchRgb(0.25, 0.03, 150); schrift(700, 40);
    x.fillText(kuerzen(bb.name, 560), 120, y);
    x.fillStyle = oklchRgb(0.45, 0.03, 150); schrift(600, 36);
    const wert = fmtDur(bb.ist) + (bb.ziel > 0 ? " / " + fmtDur(bb.ziel) : "") + (bb.ziel > 0 && bb.ist >= bb.ziel ? " · geschafft" : "");
    x.textAlign = "right"; x.fillText(wert, B - 80, y); x.textAlign = "left";
    pille(80, y + 22, B - 160, 24, oklchRgb(0.9, 0.015, 150));
    if (anteil > 0) pille(80, y + 22, Math.max(24, (B - 160) * anteil), 24, oklchRgb(0.66, 0.15, bb.hue));
    y += 104;
  });
  if (bz.bereiche.length > 4) {
    x.fillStyle = oklchRgb(0.5, 0.03, 150); schrift(600, 32);
    const rest = bz.bereiche.length - 4;
    x.fillText("+ " + rest + (rest === 1 ? " weiterer Bereich" : " weitere Bereiche"), 80, y - 10);
  }

  // Fuß
  x.fillStyle = oklchRgb(0.35, 0.04, 150); schrift(700, 40);
  x.fillText(bz.haken === 1 ? "1 Termin abgehakt" : bz.haken + " Termine abgehakt", 80, H - 90);
  x.fillStyle = oklchRgb(0.55, 0.03, 150); schrift(600, 30);
  x.textAlign = "right"; x.fillText("geplant mit dem Wochenplaner", B - 80, H - 92); x.textAlign = "left";

  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  return { blob, bilanz: bz, dateiname: "wochenplaner-kw" + isoWeek(mon) + ".png" };
}

function wochenkarteSheet() {

  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Deine Woche als Karte</h2>" +
      "<p class='zusage__intro'>Zum Teilen oder Aufheben. Gezählt wird, was du abgehakt hast.</p>" +
      "<div class='wochenkarte' id='wkBild'><span class='wochenkarte__lade'>Karte wird gezeichnet …</span></div>";

    zu.onclick = () => { if (url) URL.revokeObjectURL(url); close(); };
    const sp = document.createElement("span"); sp.className = "spacer";
    const speichern = document.createElement("button");
    speichern.className = "btn"; speichern.type = "button"; speichern.id = "wkSpeichern";
    speichern.textContent = "Bild speichern"; speichern.disabled = true;

      const a = document.createElement("a");
      a.href = url; a.download = karte.dateiname;
      document.body.appendChild(a); a.click(); a.remove();
      toast("Wochenkarte gespeichert");
    };
    teilen.onclick = async () => {
      if (!karte) return;
      const datei = new File([karte.blob], karte.dateiname, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [datei] })) {
        try { await navigator.share({ files: [datei], title: "Meine Woche" }); }
        catch (e) { /* abgebrochen: nichts zu tun */ }
      } else speichern.onclick();
    };

    wochenkarteZeichnen().then(k => {
      if (!s.isConnected) return;
      karte = k;
      url = URL.createObjectURL(k.blob);
      const bild = s.querySelector("#wkBild");
      bild.innerHTML = "";
      const img = document.createElement("img");
      img.src = url; img.alt = "Wochenkarte KW " + isoWeek(mondayOf(anchor)) + ": " + fmtDur(k.bilanz.ist) + " gemacht, " + k.bilanz.haken + " Termine abgehakt";
      bild.appendChild(img);
      speichern.disabled = false; teilen.disabled = false;
      // Ohne Teilen-Funktion (die meisten Desktop-Browser) ist Speichern der Weg.
      const kannTeilen = !!(navigator.canShare && navigator.canShare({ files: [new File([k.blob], k.dateiname, { type: "image/png" })] }));
      if (!kannTeilen) { teilen.hidden = true; speichern.className = "btn btn--primary"; }
    });
  });
}

/* ============================================================
   Stundensteine (v1.42) — eine Stunde ist ein Stein

   Gezeichnet wird nur, was die App ohnehin rechnet: Soll (plan.goal),
   eingeplant (areaMinutes ohne Vorschläge), davon abgehakt (areaIst) und
   vorgeschlagen (areaMinutes mit Vorschlägen). Alle Werte gehen in Minuten
   hinein und werden erst je Stein durch 60 geteilt — so bleibt ein voller
   Stein voll (180/60 ist exakt 3, eine Summe aus Stundenbrüchen nicht).
   Ein angebrochener Stein zeigt seinen Füllstand als Kreissektor, wie ein
   Uhrzeiger. Was über das Soll hinausgeht, liegt außerhalb der Schiene
   und hebt sich leicht. Reine Darstellung: aria-hidden, die Zahlen stehen
   daneben als Text.
   ============================================================ */
function steinSektor(f) {
  const w = 2 * Math.PI * f;
  const x = (12 + 11 * Math.sin(w)).toFixed(2), y = (12 - 11 * Math.cos(w)).toFixed(2);
  return "M12 12V1A11 11 0 " + (f > 0.5 ? 1 : 0) + " 1 " + x + " " + y + "Z";
}
/* Ein Stein aus gestaffelten Anteilen 0…1: fd abgehakt ≤ fg ≤ fp
   eingeplant ≤ fs mit Vorschlägen. Zwischen fg und fp liegt Eingeplantes
   ohne Uhrzeit (gestrichelt); fg ≥ fp heißt: alles mit Uhrzeit. Ein Stein,
   der beides trägt, zeigt den festen Teil als Sektor über dem gestrichelten
   Ring. draussen = außerhalb der Schiene (bekommt eine Spur des vollen Steins). */
function steinHtml(fd, fp, fs, fg, draussen) {
  fg = Math.min(Math.max(fg, fd), fp);
  const grob = fp > fd && fg < fp;
  const gemischt = grob && fg > fd;
  const teil = f => f > 0 && f < 1;
  const planForm = (f, grobTeil) => f >= 1
    ? "<circle cx='12' cy='12' r='10' class='teil__plan" + (grobTeil ? " is-grob" : "") + "' style='fill-opacity:0'/>"
    : "<path d='" + steinSektor(f) + "' class='teil__plan" + (grobTeil ? " is-grob" : "") + "'/>";
  if (teil(fd) || teil(fp) || teil(fs) || gemischt) {
    let s = "<svg class='stein stein--teil' viewBox='0 0 24 24' aria-hidden='true'>" +
      (draussen ? "<circle cx='12' cy='12' r='11' class='teil__spur'/>" : "");
    if (fs > fp) s += fs >= 1 ? "<circle cx='12' cy='12' r='11' class='teil__sug'/>" : "<path d='" + steinSektor(fs) + "' class='teil__sug'/>";
    if (fp > fd) {
      if (grob) s += planForm(fp, true);
      if (!grob || gemischt) s += planForm(gemischt ? fg : fp, false);
    }
    if (fd > 0) s += fd >= 1 ? "<circle cx='12' cy='12' r='11' class='teil__done'/>" : "<path d='" + steinSektor(fd) + "' class='teil__done'/>";
    return s + "</svg>";
  }
  if (fd >= 1) return "<span class='stein'></span>";
  if (fp >= 1) return "<span class='stein " + (grob ? "stein--grob" : "stein--plan") + "'></span>";
  if (fs >= 1) return "<span class='stein stein--sug'></span>";
  return "";
}
/* Verdrängt (nur „Passt das noch?"): massiver Stein in Warnfarbe mit „!",
   in der Zeile angehoben und gekippt — unterscheidet sich von einem
   gestrichelten Stein ohne Uhrzeit nicht nur durch die Farbe. Ein
   angebrochener zeigt seinen Anteil über --f (conic-Maske im CSS). */
function steinVerdraengtHtml(f) {
  return "<span class='stein stein--verdraengt'" + (f < 1 ? " style='--f:" + f.toFixed(3) + "'" : "") + "></span>";
}
/* Eine Steinreihe. Alle Mengen in Minuten: soll, ist (abgehakt), plan
   (eingeplant, schließt ist ein), sug (Vorschläge obendrauf).
   o.grob: davon noch offen ohne Uhrzeit (Minuten, gestrichelt) — liegt
   hinter dem fest Eingeplanten.
   o.verdraengt: was außerhalb der Schiene liegt, ist verdrängt (Zusage).
   o.ueber: Text am Ende (z.B. „+1 h"), o.ueberLeise: derselbe Platz,
   aber ohne Warnfarbe. Ab 13 Steinen werden sie kleiner, ab 31 noch
   einmal — die Reihe bricht um, abgeschnitten wird nichts. */
function steinReihe(o) {
  const soll = Math.max(0, o.soll), ist = Math.max(0, o.ist || 0);
  const plan = Math.max(ist, o.plan || 0), alle = plan + Math.max(0, o.sug || 0);
  const grobAb = plan - clamp(+o.grob || 0, 0, plan - ist);
  const n = Math.ceil(Math.max(soll, alle) / 60);
  const anteil = (m, i) => clamp((m - i * 60) / 60, 0, 1);
  let drin = "", drueber = "";
  for (let i = 0; i < n; i++) {
    const innen = i * 60 < soll;
    const fp = anteil(plan, i);
    const stein = !innen && o.verdraengt
      ? steinVerdraengtHtml(fp)
      : steinHtml(anteil(ist, i), fp, anteil(alle, i), anteil(grobAb, i), !innen);
    const s = "<span class='slot " + (innen ? "slot--mulde" : "slot--ueber" + (o.verdraengt ? " slot--verdraengt" : "")) + "'>" + stein + "</span>";
    if (innen) drin += s; else drueber += s;
  }
  const dichte = n > 30 ? " is-eng" : n > 12 ? " is-dicht" : "";
  return "<div class='steinreihe" + dichte + "' aria-hidden='true'>" +
    (drin ? "<span class='mulden'>" + drin + "</span>" : "") + drueber +
    (o.ueber ? "<span class='steinreihe__ueber" + (o.ueberLeise ? " is-leise" : "") + "'>" + o.ueber + "</span>" : "") +
    "</div>";
}
/* Beim Öffnen der Ziele fallen die Steine einmal gestaffelt in ihre Mulden
   (~600 ms gesamt). Nur über ansichtWechseln(), also nur auf Nutzerwegen;
   renderGoals() nach jedem save() lässt sie liegen. */
function steineFallen() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const steine = [...document.querySelectorAll("#goalsList .steinreihe .stein")];
  const schritt = 260 / Math.max(steine.length, 1);
  steine.forEach((s, i) => {
    s.style.animationDelay = Math.round(i * schritt) + "ms";
    s.classList.add("is-fall");
  });
}

function renderGoals() {
  const list = $("#goalsList");
  const foot = $("#goalsFoot");
  list.innerHTML = "";
  foot.innerHTML = "";

  // Wer in einer anderen Woche plant, soll das sehen — sonst wundert man
  // sich, warum die Stunden nicht zum eigenen Gefühl passen.
  if (!istDieseWoche()) {
    const mon = mondayOf(anchor);
    const bar = document.createElement("div");
    bar.className = "goals__which";
    bar.textContent = (mon > mondayOf(new Date()) ? "Du planst voraus: " : "Vergangene Woche: ")
      + "KW " + isoWeek(mon) + ", ab " + mon.getDate() + "." + (mon.getMonth() + 1) + ".";
    list.appendChild(bar);
  }

  const withGoal = state.areas.filter(a => a.plan.goal > 0);

  if (withGoal.length) {
    const amp = document.createElement("div");
    ampelZeichnen(amp);
    list.appendChild(amp);
  }

  if (!withGoal.length) {
    list.innerHTML =
      "<div class='empty'><b>Noch keine Wochenziele</b>Für alles ohne feste Uhrzeit: sag, wie viele Stunden " +
      "pro Woche du willst — z.B. 10 h Lernen. Wann genau, entscheidest du später.</div>";
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Wochenziel festlegen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    return;
  }

  let anyOpen = false;
  const legende = { sug: false, grob: false };

  withGoal.forEach(a => {
    const goal = a.plan.goal * 60;
    const done = areaMinutes(a.id, false);
    const sug  = areaMinutes(a.id, true);
    const open = Math.max(0, goal - done - sug);
    if (goal - done >= 15) anyOpen = true;

    const row = document.createElement("div");
    row.className = "goal";
    row.style.setProperty("--h", a.hue);

    const ist   = Math.min(areaIst(a.id), done);
    // Gestrichelt nur, was wirklich ohne Uhrzeit verplant ist — nicht
    // alles eines Bereichs, der grob plant (ein fester Termin dort bleibt Ring).
    const grobOffen = Math.min(areaGrobOffen(a.id), done - ist);
    if (sug > 0) legende.sug = true;
    if (grobOffen > 0) legende.grob = true;
    // v1.42: Steine statt Balken — dieselben drei Stufen (abgehakt,
    // eingeplant, vorgeschlagen), nur jetzt in Stunden abzählbar.
    const ueber = done + sug - goal;

    row.innerHTML =
      "<div class='goal__top'>" +
        "<span class='goal__name'><span class='goal__dot'></span>" + escapeHtml(a.name) + "</span>" +
        "<span class='goal__num'>" + (ist > 0 ? "✓ " + fmtDur(ist) + " · " : "") +
          fmtDur(done) + " / " + fmtDur(goal) + "</span>" +
      "</div>" +
      steinReihe({ soll: goal, ist, plan: done, sug, grob: grobOffen,
        ueber: ueber > 0 ? "+" + fmtDur(ueber) : null }) +
      "<div class='goal__rest'>" + goalHint(done, sug, open, goal) + "</div>";

    list.appendChild(row);
  });

  // Legende wie im Entwurf; „vorgeschlagen" und „ohne Uhrzeit" nur, wenn
  // es solche Steine gerade gibt.
  const leg = document.createElement("div");
  leg.className = "goals__legende";
  leg.setAttribute("aria-hidden", "true");
  leg.innerHTML =
    "<span><i class='stein'></i>erledigt</span>" +
    "<span><i class='stein stein--plan'></i>verplant</span>" +
    (legende.grob ? "<span><i class='stein stein--grob'></i>ohne Uhrzeit</span>" : "") +
    (legende.sug ? "<span><i class='stein stein--sug'></i>vorgeschlagen</span>" : "") +
    "<span><i class='mulde'></i>noch offen</span>";
  list.appendChild(leg);

  // Immer erreichbar, solange man in der laufenden Woche steht
  const naechste = () => {
    if (!istDieseWoche()) return null;
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Nächste Woche";
    b.title = "Eine Woche vorblättern und dort verteilen";
    b.onclick = planeNaechsteWoche;
    return b;
  };

  if (hasSuggestions()) {
    const ok = document.createElement("button");
    ok.className = "btn btn--primary btn--sm";
    ok.textContent = "Alle übernehmen";
    ok.onclick = () => {
      // Stufe C Punkt C7: dieselbe Reihenfolge wie in renderSugBar() — erst
      // sammeln, dann übernehmen, dann den Satz aus der Sammlung bauen.
      const bloecke = sugBlockeDieserWoche();
      acceptSuggestions();
      save(); renderAll();
      toast(toastUebernommenText(bloecke));
    };
    const no = document.createElement("button");
    no.className = "btn btn--sm";
    no.textContent = "Verwerfen";
    no.onclick = () => { clearSuggestions(); save(); renderAll(); toast("Vorschläge verworfen"); };
    foot.append(ok, no);
  } else if (anyOpen) {
    const b = document.createElement("button");
    b.className = "btn btn--primary btn--sm";
    b.textContent = "Vorschlagen";
    b.onclick = () => verteilenMitGate(() => {
      const r = buildSuggestions();
      save(); renderAll();
      if (!r.placed) toast((r.hinweise && r.hinweise[0]) || "Kein Platz gefunden — Zeitfenster erweitern?");
      else if (r.missing >= 15) toast("Verteilt, bis auf " + fmtDur(r.missing) + " — da war kein Platz mehr");
      else toast("Vorschlag steht — schau, ob's dir passt");
    });
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  } else {
    const b = document.createElement("button");
    b.className = "btn btn--sm";
    b.textContent = "Ziele anpassen";
    b.onclick = goalsSheet;
    foot.appendChild(b);
    const n = naechste(); if (n) foot.appendChild(n);
  }
}

function goalHint(done, sug, open, goal) {
  if (sug > 0) return "<b>" + fmtDur(sug) + "</b> vorgeschlagen" + (open >= 15 ? " · " + fmtDur(open) + " bleiben offen" : "");
  if (done >= goal) return "Ziel eingeplant.";
  return "<b>" + fmtDur(goal - done) + "</b> noch offen";
}

/* Wochentage lesbar zusammenfassen: "Mo–Sa" statt "Mo, Di, Mi, Do, Fr, Sa".
   idx muss aufsteigend sortiert und lückenlos in sich eindeutig sein. */
function fmtTageListe(idx) {
  if (!idx.length) return "";
  const teile = [];
  let start = idx[0], prev = idx[0];
  for (let k = 1; k <= idx.length; k++) {
    const cur = idx[k];
    if (cur === prev + 1) { prev = cur; continue; }
    teile.push(start === prev ? DAY_SHORT[start] : DAY_SHORT[start] + "–" + DAY_SHORT[prev]);
    start = prev = cur;
  }
  return teile.join(", ");
}

// Anker-Puffer als Chips statt Zahlenfeld — dieselbe Entscheidung wie bei der
// Art (siehe Kommentar dort): eine überschaubare Auswahl statt geratener Zahlen.
const ANKER_MIN_OPTS = [0, 15, 30, 45, 60, 90, 120];
const ANKER_MAX_OPTS = [60, 90, 120, 180, 240, 360, 480];

/* Baut die zwei Regeln-Zeilen (Fenster + Anker) aus Stufe 9 in wrap und
   liefert eine commit()-Funktion, die den lokalen Zustand nach obj.regeln
   schreibt — genau wie die Tage-Chips oben erst beim Zuklappen/Speichern,
   nicht bei jedem Klick. area.regeln und task.regeln haben dieselbe Form
   (siehe migrate), darum ein gemeinsamer Editor für goalsSheet und
   taskSheet. selbstId schließt den eigenen Bereich aus der Anker-Auswahl
   aus — an sich selbst ankern ergibt keinen Sinn. */
function regelnEditor(wrap, obj, selbstId, opts) {
  // Ziele-Karte zeigt seit der Verschmelzungs-Runde keinen eigenen
  // Fenster-Block mehr (Mo-So+Von/Bis geht in "Wann darf das stattfinden?"
  // oben auf) — nur das Aufgaben-Blatt, das kein plan.days/from/to kennt,
  // braucht ihn weiterhin. opts.fenster === false schaltet ihn ab.
  const zeigeFenster = !opts || opts.fenster !== false;
  const alt = obj.regeln || null;
  const fAlt = (alt && alt.fenster && alt.fenster[0]) || null;
  const aAlt = (alt && alt.anker) || null;

  const tage = new Set(fAlt ? fAlt.tage : []);
  let von = fAlt ? fAlt.von : state.settings.dayStart * 60;
  let bis = fAlt ? fAlt.bis : state.settings.dayEnd * 60;
  let ankerRef = aAlt ? aAlt.ref : null;
  let ankerMin = aAlt ? aAlt.min : 30;
  let ankerMax = aAlt ? aAlt.max : 180;
  // Ein Tageszeit-Anker aus der Anker-Frage im Wochenstart (Stufe 13 Teil B)
  // hat hier keine eigenen Regler — er bleibt unangetastet, bis "Aus" oder
  // ein Bereich angeklickt wird. Sonst würde allein das Öffnen dieses Blatts
  // ihn beim Speichern wortlos löschen.
  let ankerTageszeit = aAlt && aAlt.tageszeit ? aAlt.tageszeit : null;

  wrap.innerHTML =
    (zeigeFenster ?
      "<p class='goalrow__sub'>Nur an bestimmten Tagen/Uhrzeiten möglich?</p>" +
      "<div class='chipset rTage' style='margin-bottom:8px'></div>" +
      "<div class='sheet__cols' style='margin-bottom:6px'>" +
        "<div><label class='label'>Von</label><input class='field rVon' type='time' step='900'></div>" +
        "<div><label class='label'>Bis</label><input class='field rBis' type='time' step='900'></div>" +
      "</div>" +
      "<p class='goalrow__sub' style='margin:0 0 14px' data-hint='f'></p>" : "") +
    "<p class='goalrow__sub'>Wann? Nach einem anderen Bereich, mit Puffer.</p>" +
    "<div class='chipset rBereich' style='margin-bottom:8px'></div>" +
    "<div class='chipset rMin' style='margin-bottom:8px'></div>" +
    "<div class='chipset rMax'></div>" +
    "<p class='goalrow__sub' style='margin:6px 0 0' data-hint='a'></p>";

  const tageW = wrap.querySelector(".rTage");
  const vonIn = wrap.querySelector(".rVon");
  const bisIn = wrap.querySelector(".rBis");
  const fHint = wrap.querySelector("[data-hint='f']");
  const bereichW = wrap.querySelector(".rBereich");
  const minW = wrap.querySelector(".rMin");
  const maxW = wrap.querySelector(".rMax");
  const aHint = wrap.querySelector("[data-hint='a']");

  if (zeigeFenster) {
    vonIn.value = fmtTime(von);
    bisIn.value = fmtTime(bis);
  }

  const paintFHint = () => {
    if (!fHint) return;
    fHint.textContent = tage.size
      ? fmtTageListe([...tage].sort((x, y) => x - y)) + " " + fmtTime(von) + "–" + fmtTime(bis) + " Uhr"
      : "Ohne eigene Einschränkung.";
  };
  const paintTage = () => {
    if (!tageW) return;
    tageW.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.setAttribute("aria-pressed", String(tage.has(i)));
      c.textContent = DAY_SHORT[i];
      c.onclick = () => { tage.has(i) ? tage.delete(i) : tage.add(i); paintTage(); paintFHint(); };
      tageW.appendChild(c);
    }
  };
  if (zeigeFenster) {
    paintTage(); paintFHint();
    vonIn.oninput = () => { von = parseTime(vonIn.value); paintFHint(); };
    bisIn.oninput = () => { bis = parseTime(bisIn.value); paintFHint(); };
  }

  const paintAHint = () => {
    aHint.textContent = ankerRef
      ? "Nach " + ((areaById(ankerRef) || {}).name || "") + " +" + fmtDur(ankerMin) + " bis +" + fmtDur(ankerMax)
      : ankerTageszeit
      ? (ankerTageszeit === "morgen" ? "Morgens" : "Abends") + " — aus der Anker-Frage im Wochenstart, hier nur ersetzbar."
      : "Kein Anker — das Zeitfenster oben gilt unverändert.";
  };
  const paintBereich = () => {
    bereichW.innerHTML = "";
    const aus = document.createElement("button");
    aus.type = "button"; aus.className = "chip";
    aus.setAttribute("aria-pressed", String(ankerRef === null && !ankerTageszeit));
    aus.textContent = "Aus";
    aus.onclick = () => { ankerRef = null; ankerTageszeit = null; paintBereich(); paintAHint(); };
    bereichW.appendChild(aus);
    state.areas.forEach(ar => {
      if (selbstId && ar.id === selbstId) return;
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.style.setProperty("--h", ar.hue);
      c.setAttribute("aria-pressed", String(ankerRef === ar.id));
      c.innerHTML = "<span class='chip__dot'></span>";
      c.append(ar.name);
      c.onclick = () => { ankerRef = ar.id; ankerTageszeit = null; paintBereich(); paintAHint(); };
      bereichW.appendChild(c);
    });
  };
  const paintMin = () => {
    minW.innerHTML = "";
    ANKER_MIN_OPTS.forEach(m => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip num";
      // Stufe C Punkt C5: die "+0 h"-Chip trägt die falsche Einheit und sagt
      // nichts — "direkt danach" beschreibt denselben Puffer (keiner) in Worten.
      c.textContent = m === 0 ? "direkt danach" : "+" + fmtDur(m);
      c.setAttribute("aria-pressed", String(ankerMin === m));
      c.onclick = () => {
        ankerMin = m;
        if (ankerMax <= ankerMin) ankerMax = ANKER_MAX_OPTS.find(x => x > ankerMin) || ankerMin + 60;
        paintMin(); paintMax(); paintAHint();
      };
      minW.appendChild(c);
    });
  };
  const paintMax = () => {
    maxW.innerHTML = "";
    ANKER_MAX_OPTS.forEach(m => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip num";
      c.textContent = "bis +" + fmtDur(m);
      c.setAttribute("aria-pressed", String(ankerMax === m));
      c.disabled = m <= ankerMin;
      if (c.disabled) c.style.opacity = ".4";
      c.onclick = () => { ankerMax = m; paintMax(); paintAHint(); };
      maxW.appendChild(c);
    });
  };
  paintBereich(); paintMin(); paintMax(); paintAHint();

  return {
    commit() {
      // sonst: "aus" ist der einzige Weg, den diese Stufe anbietet — ein Tag
      // ohne Bezugsblock fällt weg, statt das Fenster ungebremst zu öffnen.
      const anker = ankerRef ? { ref: ankerRef, min: ankerMin, max: ankerMax, sonst: "aus" }
        : ankerTageszeit ? { tageszeit: ankerTageszeit } : null;
      if (!zeigeFenster) {
        // Ziele-Karte: das Fenster ist in "Wann darf das stattfinden?" oben
        // aufgegangen (plan.days/from/to, der immer vorhandene, überall
        // gefilterte Kanal) — ein hier übrig bleibendes area.regeln.fenster
        // wäre eine unsichtbare Zusatzfessel, deshalb nie mitschreiben.
        obj.regeln = anker ? { anker } : null;
        return;
      }
      const fenster = (tage.size && bis > von)
        ? [{ tage: [...tage].sort((x, y) => x - y), von, bis }] : [];
      obj.regeln = (fenster.length || anker) ? { fenster, anker } : null;
    }
  };
}

/* ============================================================ Ziele bearbeiten */
function goalsSheet() {
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Wochenziele</h2>" +
      "<p style='margin:0 0 16px;color:var(--text-muted);font-size:var(--t-body);line-height:1.6'>" +
      "Für alles, was keine feste Uhrzeit hat. Trag Stunden pro Woche ein — der Planer " +
      "rechnet mit, was noch fehlt, und kann den Rest auf die Woche verteilen. " +
      "0 lassen heißt: kein Ziel. Die <b>Art</b> sagt ihm, wie lang die Blöcke sein " +
      "dürfen, wie viel Pause danach nötig ist und wann am Tag es am besten passt.</p>" +
      "<div id='gAmpel'></div>" +
      "<div class='goallist' id='gList'></div>";

    const wrap = s.querySelector("#gList");
    ampelZeichnen(s.querySelector("#gAmpel"));

    // Sicherung beim Öffnen: der "input"-Horcher unten ruft bei JEDEM
    // Tastendruck row._commit() auf ALLEN Zeilen auf, auch auf denen, die
    // gerade nur einen Chip angetippt haben — deshalb landet ohnehin alles
    // vorzeitig auf a.plan/a.regeln. Statt jedes Feld einzeln zurückzuhalten,
    // sichern wir hier eine tiefe Kopie und schreiben sie bei jedem
    // Schließweg außer "Speichern" zurück (modalOnCancel, siehe closeModal()).
    const sicherung = state.areas.map(a => ({
      a,
      plan: JSON.parse(JSON.stringify(a.plan)),
      regeln: a.regeln ? JSON.parse(JSON.stringify(a.regeln)) : null
    }));
    modalOnCancel = () => sicherung.forEach(x => { x.a.plan = x.plan; x.a.regeln = x.regeln; });

    state.areas.forEach(a => {
      const p = a.plan;
      const row = document.createElement("div");
      row.className = "goalrow";
      row.style.setProperty("--h", a.hue);

      row.innerHTML =
        // v1.42: Name oben allein (die Zeit-Etiketten haben Platz), darunter
        // die Stunden: Zahlenfeld, ±½ und — eine Zeile tiefer — dieselben
        // Stunden als Steinreihe. Tippen auf den n-ten Stein setzt n h. Das
        // Zahlenfeld bleibt der Weg für Tastatur und Screenreader und das
        // erste fokussierbare Feld; die Steinreihe ist aria-hidden, beide
        // schreiben über dasselbe Feld.
        "<div class='goalrow__head'>" +
          "<span class='goalrow__name'><span class='goal__dot'></span>" + escapeHtml(a.name) +
            "<span class='goalrow__tags'></span></span>" +
        "</div>" +
        "<div class='goalrow__wert'>" +
          "<input class='field goalrow__h' type='number' min='0' max='80' step='0.5' " +
                 "aria-label='Stunden pro Woche für " + escapeHtml(a.name) + "'>" +
          "<span class='goalrow__unit'>h / Woche</span>" +
          "<button class='goalrow__halb' type='button' data-d='-1' " +
                  "aria-label='Eine halbe Stunde weniger für " + escapeHtml(a.name) + "'>−½</button>" +
          "<button class='goalrow__halb' type='button' data-d='1' " +
                  "aria-label='Eine halbe Stunde mehr für " + escapeHtml(a.name) + "'>+½</button>" +
          "<span class='spacer'></span>" +
          "<button class='goalrow__more' type='button' aria-expanded='false' " +
                  "aria-label='Zeiten für " + escapeHtml(a.name) + "'>⌄</button>" +
        "</div>" +
        "<div class='zsteine' aria-hidden='true'></div>" +
        "<div class='goalrow__art'></div>" +
        "<div class='goalrow__arthint'></div>" +
        // Stufe 13 Teil F: der grob-Haken war hier hinter dem Chevron
        // versteckt (goalrow__body) — dieselbe Sichtbarkeit wie die Art
        // jetzt, zwei Chips statt eines Kontrollkästchens. Eigene Klassen,
        // damit row.querySelector(".goalrow__art") weiter eindeutig bleibt
        // (s. CSS: goalrow__grob(hint) teilt sich die Regel mit goalrow__art(hint)).
        "<div class='goalrow__grob' style='margin-top:6px'></div>" +
        "<div class='goalrow__grobhint'></div>" +
        "<div class='goalrow__body' hidden>" +
          "<label class='switch' style='margin-bottom:14px'>" +
            "<input type='checkbox' class='gMust'> Muss sein — nicht zum Streichen vorschlagen</label>" +
          // Gegenstück zum "×" im Vorschlags-Blatt (Teil F) — sonst gäbe es
          // keinen Weg zurück, wenn "kein Sport mehr" doch nicht endgültig war.
          "<label class='switch' style='margin-bottom:14px'>" +
            "<input type='checkbox' class='gKeinVorschlag'> Keine Vorschläge für diesen Bereich</label>" +
          "<p class='goalrow__sub'>Wann darf das stattfinden?</p>" +
          "<div class='chipset gDays' style='margin-bottom:14px'></div>" +
          "<div class='sheet__cols' style='margin-bottom:12px'>" +
            "<div><label class='label'>Frühestens</label><input class='field gFrom' type='time' step='900'></div>" +
            "<div><label class='label'>Spätestens</label><input class='field gTo' type='time' step='900'></div>" +
          "</div>" +
          "<p class='goalrow__sub gKonflikt' style='margin:-6px 0 12px' hidden></p>" +
          "<p class='goalrow__sub'>Wo findet das statt? Daraus rechnet der Planer die Fahrzeit.</p>" +
          "<div class='chipset gOrte'></div>" +
          "<div class='gRegeln'></div>" +
        "</div>";

      const hIn   = row.querySelector(".goalrow__h");
      const more  = row.querySelector(".goalrow__more");
      const body  = row.querySelector(".goalrow__body");
      const dayW  = row.querySelector(".gDays");
      const from  = row.querySelector(".gFrom");
      const to    = row.querySelector(".gTo");
      const mustIn = row.querySelector(".gMust");
      const kvIn = row.querySelector(".gKeinVorschlag");
      kvIn.checked = !!p.keinVorschlag;
      const grobW = row.querySelector(".goalrow__grob");
      const grobHint = row.querySelector(".goalrow__grobhint");
      const artW  = row.querySelector(".goalrow__art");
      const artHint = row.querySelector(".goalrow__arthint");
      const orteW = row.querySelector(".gOrte");
      const regeln = regelnEditor(row.querySelector(".gRegeln"), a, a.id, { fenster: false });

      // v1.42 Steinreihe: liest und schreibt nur hIn. setzeWert() löst ein
      // echtes "input" aus — derselbe Weg wie Tippen (row._commit() aller
      // Zeilen und die Ampel im Horcher unten), Validierung bleibt dort.
      const steinW = row.querySelector(".zsteine");
      const halbW = row.querySelectorAll(".goalrow__halb");
      const wertVon = () => clamp(parseFloat(String(hIn.value).replace(",", ".")) || 0, 0, 80);
      const paintSteine = () => {
        const v = wertVon();
        const n = Math.min(80, Math.max(10, Math.ceil(v) + 2));
        let h = "";
        for (let i = 0; i < n; i++) {
          const f = clamp(v - i, 0, 1);
          h += "<span class='slot' data-n='" + (i + 1) + "'>" + steinHtml(f, f, f, false, false) + "</span>";
        }
        steinW.className = "zsteine" + (n > 24 ? " is-dicht" : "");
        steinW.innerHTML = h;
        halbW[0].disabled = v <= 0;
        halbW[1].disabled = v >= 80;
      };
      const setzeWert = v => {
        hIn.value = String(clamp(Math.round(v * 2) / 2, 0, 80));
        hIn.dispatchEvent(new Event("input", { bubbles: true }));
      };
      hIn.addEventListener("input", paintSteine);
      // ±½ rastet auf die nächste halbe Stunde: 9,3 → 9,5 bzw. 9.
      halbW.forEach(b => b.onclick = () => {
        const v = wertVon(), d = +b.dataset.d;
        setzeWert(d > 0 ? Math.floor(v * 2 + 1e-9) / 2 + 0.5 : Math.ceil(v * 2 - 1e-9) / 2 - 0.5);
      });
      // Tippen: n-ter Stein = n h, erneut auf den letzten = eine Stunde weg.
      // Waagrecht ziehen setzt den Wert mit; senkrecht bleibt Scrollen
      // (touch-action: pan-y), der Browser meldet dann pointercancel.
      let zug = null;
      steinW.addEventListener("pointerdown", e => {
        const s = e.target.closest(".slot");
        if (!s) return;
        zug = { id: e.pointerId, x: e.clientX, y: e.clientY, n: +s.dataset.n, zieht: false };
        try { steinW.setPointerCapture(e.pointerId); } catch (_) { /* ohne Capture geht Tippen weiter */ }
      });
      steinW.addEventListener("pointermove", e => {
        if (!zug || zug.id !== e.pointerId) return;
        if (!zug.zieht) {
          const dx = Math.abs(e.clientX - zug.x), dy = Math.abs(e.clientY - zug.y);
          if (dx < 6 || dx < dy) return;
          zug.zieht = true;
        }
        const unter = [...steinW.querySelectorAll(".slot")].find(s => {
          const r = s.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX < r.right && e.clientY >= r.top - 4 && e.clientY < r.bottom + 4;
        });
        if (unter && +unter.dataset.n !== wertVon()) setzeWert(+unter.dataset.n);
      });
      steinW.addEventListener("pointerup", e => {
        if (!zug || zug.id !== e.pointerId) return;
        const z = zug; zug = null;
        if (!z.zieht) setzeWert(wertVon() === z.n ? z.n - 1 : z.n);
      });
      steinW.addEventListener("pointercancel", () => { zug = null; });

      // Stufe 3 hielt Art, Grob und Ort hier in einem eigenen Entwurf, weil sie
      // als einzige Felder sofort auf p schrieben. Seit der Sicherung/
      // Wiederherstellung oben (Auftrag B) macht das keinen Unterschied mehr —
      // "Abbrechen" stellt p ohnehin komplett zurück. Chips schreiben jetzt
      // direkt auf p, wie es ohne den Leck-Fall auch naheliegender wäre.

      const tags = row.querySelector(".goalrow__tags");
      // Fix 3 (Pruefer-Runde): der Chip liest jetzt das Trio (plan.days/from/to),
      // nicht mehr allein das alte area.regeln.fenster — das verschwand sonst
      // nach dem ersten Speichern, weil fenster dabei geraeumt wird (s. u.).
      // Existiert daneben noch ein ungeraeumtes Fenster, zeigt der Chip dessen
      // effektive Schnittmenge mit dem Trio, im Konfliktfall das Trio plus "!".
      const paintTags = () => {
        const an = a.regeln && a.regeln.anker;
        const tageAlle = p.days.length >= 7;
        const zeitOffen = p.from == null && p.to == null;
        let chipText = null;
        if (!tageAlle || !zeitOffen) {
          const vonZ = p.from == null ? state.settings.dayStart * 60 : p.from;
          const bisZ = p.to   == null ? state.settings.dayEnd   * 60 : p.to;
          chipText = fmtTageListe(p.days) + " " + fmtTime(vonZ) + "–" + fmtTime(bisZ) + " Uhr";
        }
        const fAlt = a.regeln && a.regeln.fenster && a.regeln.fenster[0];
        if (fAlt) {
          const vonBasis = p.from == null ? state.settings.dayStart * 60 : p.from;
          const bisBasis = p.to   == null ? state.settings.dayEnd   * 60 : p.to;
          const tageSchnitt = p.days.filter(i => fAlt.tage.includes(i));
          const zeitKonflikt = Math.max(vonBasis, fAlt.von) >= Math.min(bisBasis, fAlt.bis);
          const tageKonflikt = !tageSchnitt.length;
          chipText = zeitKonflikt || tageKonflikt
            ? (chipText || fmtTageListe(p.days) + " " + fmtTime(vonBasis) + "–" + fmtTime(bisBasis) + " Uhr") + " !"
            : fmtTageListe(tageSchnitt) + " " + fmtTime(Math.max(vonBasis, fAlt.von)) +
              "–" + fmtTime(Math.min(bisBasis, fAlt.bis)) + " Uhr";
        }
        tags.innerHTML =
          (p.grob ? "<span class='tag'>ohne Uhrzeit</span>" : "") +
          (p.must ? "" : "<span class='tag tag--soft'>kann warten</span>") +
          (p.keinVorschlag ? "<span class='tag tag--soft'>keine Vorschläge</span>" : "") +
          (p.ortId ? "<span class='tag'>" + escapeHtml(ortName(p.ortId)) + "</span>" : "") +
          (chipText ? "<span class='tag'>" + escapeHtml(chipText) + "</span>" : "") +
          (an ? "<span class='tag'>" + (an.ref
                ? "nach " + escapeHtml((areaById(an.ref) || {}).name || "")
                : (an.tageszeit === "morgen" ? "morgens" : "abends")) + "</span>" : "");
      };
      paintTags();

      // Art — die eine sichtbare Entscheidung je Bereich
      const paintArt = () => {
        artW.innerHTML = "";
        ART_REIHE.forEach(k => {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(p.art === k));
          c.textContent = ARTEN[k].label;
          c.onclick = () => { p.art = k; paintArt(); };
          artW.appendChild(c);
        });
        const A = ARTEN[p.art] || ARTEN.orga;
        artHint.textContent = A.hint + " · Blöcke " + A.min + "–" + A.max +
          " min, danach " + A.pause + " min Pause.";
      };
      paintArt();

      // Grob (Stufe 13 Teil F) — die Oberfläche reagiert weiterhin sofort
      // (paintGrob/paintTags).
      const paintGrob = () => {
        grobW.innerHTML = "";
        [[false, "Feste Uhrzeit"], [true, "Nur Tageszeit"]].forEach(([val, label]) => {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(!!p.grob === val));
          c.textContent = label;
          c.onclick = () => { p.grob = val; paintGrob(); paintTags(); };
          grobW.appendChild(c);
        });
        grobHint.textContent = p.grob
          ? "Der Vorschlag legt nur einen Tagesabschnitt fest — „Samstagabend, etwa zwei " +
            "Stunden“ statt 14:00–16:30. Für Freizeit und Zeit mit Menschen oft ehrlicher."
          : "Der Vorschlag setzt eine feste Uhrzeit, wie ein normaler Termin.";
      };
      paintGrob();

      // Ort
      ortChips(orteW, () => p.ortId, id => { p.ortId = id; paintTags(); });

      mustIn.checked = p.must;
      hIn.value = p.goal || 0;
      paintSteine();
      // Saat = effektive Schnittmenge aus plan.days/from/to und einem noch
      // nicht geräumten area.regeln.fenster — der Verteiler hat beide schon
      // immer UND-verknüpft (freeGaps/placeGrob/kandidatentage), die Karte
      // zeigt jetzt einfach, was ohnehin schon galt. Ohne Fenster darf die
      // Saat keine härteren Werte erfinden, deshalb bleiben from/to dann bei
      // ihrem alten Standard (dayStart/dayEnd).
      const fensterAlt = a.regeln && a.regeln.fenster && a.regeln.fenster[0];
      const planFrom = p.from == null ? state.settings.dayStart * 60 : p.from;
      const planTo   = p.to   == null ? state.settings.dayEnd * 60   : p.to;
      // Pruefer-Fix 1: eine leere Schnittmenge (Alt-Fenster liegt ganz außerhalb
      // von planFrom/planTo, oder teilt sich keinen Tag mit plan.days) darf nie
      // gefaltet werden — Math.max(von)/Math.min(bis) würde dann invertieren
      // (von > bis), und der Wächter in row._commit() verwirft die Obergrenze
      // danach still (t<1440 && t>f). Speichern schreibt exakt, was die Karte
      // zeigt — eine unmögliche Schnittmenge wird gezeigt und benannt, nie
      // stillschweigend aufgeweitet: im Konfliktfall bleibt das Trio unverändert.
      const zeitKonflikt = !!fensterAlt &&
        Math.max(planFrom, fensterAlt.von) >= Math.min(planTo, fensterAlt.bis);
      from.value = fmtTime(fensterAlt && !zeitKonflikt ? Math.max(planFrom, fensterAlt.von) : planFrom);
      to.value   = fmtTime(fensterAlt && !zeitKonflikt ? Math.min(planTo,   fensterAlt.bis) : planTo);

      const tageSchnitt = fensterAlt ? p.days.filter(i => fensterAlt.tage.includes(i)) : p.days;
      const tageKonflikt = !!fensterAlt && !tageSchnitt.length;
      const days = new Set(tageKonflikt ? p.days : tageSchnitt);

      const konfliktEl = row.querySelector(".gKonflikt");
      if (zeitKonflikt || tageKonflikt) {
        konfliktEl.hidden = false;
        konfliktEl.textContent = "Eine ältere Zeitregel (" +
          fmtTageListe([...fensterAlt.tage].sort((x, y) => x - y)) + " " +
          fmtTime(fensterAlt.von) + "–" + fmtTime(fensterAlt.bis) +
          ") passt nicht in diesen Zeitraum — beim Speichern gilt, was hier steht.";
      } else {
        konfliktEl.hidden = true;
      }
      const paintDays = () => {
        dayW.innerHTML = "";
        for (let i = 0; i < 7; i++) {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(days.has(i)));
          c.textContent = DAY_SHORT[i];
          c.onclick = () => {
            if (days.has(i)) { if (days.size > 1) days.delete(i); }
            else days.add(i);
            paintDays();
          };
          dayW.appendChild(c);
        }
      };
      paintDays();

      more.onclick = () => {
        const open = body.hidden;
        if (!open) { row._commit(); paintTags(); }   // Zugeklapptes zeigt den Zustand
        body.hidden = !open;
        more.setAttribute("aria-expanded", String(open));
        more.textContent = open ? "⌃" : "⌄";
      };

      row._commit = () => {
        p.must = mustIn.checked;
        p.keinVorschlag = kvIn.checked;
        // Art, Grob und Ort stehen bereits auf p — die Chips oben schreiben
        // seit Auftrag B direkt hin, siehe Kommentar dort.
        p.goal = clamp(parseFloat(String(hIn.value).replace(",", ".")) || 0, 0, 80);
        p.days = [...days].sort((x, y) => x - y);
        const f = parseTime(from.value), t = parseTime(to.value);
        p.from = f > 0 ? f : null;
        p.to   = t < 1440 && t > f ? t : null;
        // Blocklängen kommen aus der Art — die beiden Zahlenfelder sind weg.
        const A = ARTEN[p.art] || ARTEN.orga;
        p.min = A.min; p.max = A.max;
        regeln.commit();
      };

      wrap.appendChild(row);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Speichern";
    wrap.addEventListener("input", () => {
      wrap.querySelectorAll(".goalrow").forEach(r => r._commit());
      ampelZeichnen(s.querySelector("#gAmpel"));
    });
    ok.onclick = () => {
      wrap.querySelectorAll(".goalrow").forEach(r => r._commit());
      modalOnCancel = null;   // Speichern übernimmt — closeModal() soll nicht zurückstellen.
      save(); close(); renderAll();
      toast("Ziele gespeichert"); // Einziger Ausgang mit Rückmeldung — Abbrechen/Escape/Hintergrund bleiben stumm.
    };
    foot.append(cancel, ok);
    s.appendChild(foot);
  }, { wide: true });
}

/* ============================================================
   Band für grob geplante Zeit

   Steht unter dem Raster, in denselben Spalten, aber ohne Zeitachse.
   Erscheint nur, wenn es in der Woche überhaupt etwas Grobes gibt.
   ============================================================ */
function renderLoose() {
  const band = $("#looseBand");
  if (!band) return;
  const mon = mondayOf(anchor);
  const tage = einTag ? [selectedDayIdx] : [0, 1, 2, 3, 4, 5, 6];

  const daten = tage.map(i => {
    const d = addDays(mon, i);
    return { i, key: iso(d), items: grobeFor(iso(d), i) };
  });

  if (!daten.some(x => x.items.length)) { band.hidden = true; return; }
  band.hidden = false;
  band.innerHTML = "";
  band.style.setProperty("--lcols", tage.length);
  band.style.setProperty("--gutter", einTag ? "44px" : "56px");

  // Eine Zeile je Abschnitt, damit man sieht, wann am Tag es ungefähr sein soll
  ABSCHNITTE.forEach(abschnitt => {
    const inZeile = daten.map(x => x.items.filter(b => b.teil === abschnitt.id));
    if (!inZeile.some(l => l.length)) return;

    const lab = document.createElement("div");
    lab.className = "loose__lab";
    lab.textContent = abschnitt.kurz;
    band.appendChild(lab);

    inZeile.forEach((liste, n) => {
      const cell = document.createElement("div");
      cell.className = "loose__cell";
      liste.forEach(b => {
        const area = areaById(b.areaId);
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "loosechip" + (b.sug ? " is-sug" : "");
        chip.style.setProperty("--h", area.hue);
        const fertig = !b.sug && istErledigt(b, daten[n].key);
        if (fertig) chip.classList.add("is-done");
        chip.title = (fertig ? "Erledigt: " : "") + b.title + " · " + abschnitt.name + " · " + fmtDur(b.dauer)
                   + (b.sug ? " (Vorschlag)" : "");
        chip.innerHTML = "<span class='loosechip__t'>" + escapeHtml(b.title) + "</span>" +
                         "<span class='loosechip__d'>" + fmtDur(b.dauer) + "</span>";
        chip.onclick = () => (b.sug ? sugSheet(b) : blockSheet({ ...b }, daten[n].key));
        cell.appendChild(chip);
      });
      band.appendChild(cell);
    });
  });

  const hinweis = document.createElement("div");
  hinweis.className = "loose__hint";
  hinweis.textContent = isMobile
    ? "Ohne feste Uhrzeit."
    : "Ohne feste Uhrzeit — der Abschnitt ist reserviert, die Minute nicht.";
  band.appendChild(hinweis);
}

/* ============================================================ Raster */
// Scrollposition je Tag/Ansicht — s. renderGrid ganz unten und der
// scroll-Listener in wischenEinrichten. Schlüssel statt fixem Wert: die
// Eintagesansicht zeigt einen bestimmten Tag, die Woche einen gemeinsamen
// Scrollbereich über alle sieben Spalten.
const scrollMerk = {};
let scrollMerkSchluessel = null;
// Höhe des Tageskopfs für die klebenden Blocktitel (--kopf, s. renderGrid).
let kopfMessen = () => {};
const kopfBeobachter = window.ResizeObserver ? new ResizeObserver(() => kopfMessen()) : null;
function scrollSchluessel() {
  return einTag ? iso(addDays(mondayOf(anchor), selectedDayIdx)) : "woche";
}

function renderGrid() {
  const grid = $("#grid");
  const wrap = $("#gridWrap");
  grid.innerHTML = "";

  const { dayStart, dayEnd } = state.settings;
  const hours = dayEnd - dayStart;
  const hourH = parseFloat(getComputedStyle(grid).getPropertyValue("--hourh")) || 52;
  const bodyH = hours * hourH;
  const mon = mondayOf(anchor);
  const planTitel = $(".planhead h1");
  const planTag = addDays(mon, selectedDayIdx);
  planTitel.innerHTML = einTag
    ? "<span class='planhead__weekday'>" + DAY_LONG[selectedDayIdx] + ", </span>" + planTag.getDate() + ". " + MONTHS[planTag.getMonth()]
    : "Deine Woche";
  const todayIso = iso(new Date());
  const dayIdxs = einTag ? [selectedDayIdx] : [0, 1, 2, 3, 4, 5, 6];
  grid.style.setProperty("--cols", dayIdxs.length);

  // Kopfzeile — am Handy übernimmt das der Tag-Umschalter oben
  if (!einTag) {
  const gh = document.createElement("div");
  gh.className = "dayhead dayhead--gutter";
  grid.appendChild(gh);

  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const h = document.createElement("div");
    const frei = istFrei(iso(d));
    // v1.31: dieselbe Auslastung wie im Tagesstreifen (renderDaySwitch) —
    // am Desktop mit Stundenzahl, weil dort Platz dafür ist.
    const last = tagesAuslastung({ key: iso(d), i });
    h.className = "dayhead" + (iso(d) === todayIso ? " is-today" : "") + (frei ? " is-frei" : "")
      + (!frei && last.quote > 1 ? " is-voll" : "");
    const en = state.days[iso(d)] && state.days[iso(d)].energy;
    if (en) h.dataset.energy = en;
    const energie = "<span class='dayhead__energy' aria-hidden='true'><i></i><i></i><i></i></span>";
    h.innerHTML =
      "<div class='dayhead__name'>" + DAY_SHORT[i] + "</div>" +
      "<div class='dayhead__num'>" + d.getDate() + "</div>" +
      (frei
        ? "<span class='dayhead__frei'>frei</span>" + energie
        : "<span class='dayhead__last' aria-hidden='true' style='--last:" + Math.round(clamp(last.quote, 0, 1) * 100) + "%'>" +
            "<i></i><span class='dayhead__std'>" + (last.min < 15 ? "–" : fmtDur(last.min)) + "</span>" + energie + "</span>");
    // Der Kopf wählt den Tag für die Agenda daneben — bisher nur per Maus
    // und ohne sichtbare Rückmeldung, welcher Tag gerade gewählt ist.
    const wieVoll = frei ? "freigehalten"
      : last.min < 15 ? "nichts geplant"
      : fmtDur(last.min) + " geplant" + (last.quote > 1 ? " — das wird eng" : "");
    h.setAttribute("role", "button");
    h.tabIndex = 0;
    h.setAttribute("aria-pressed", String(i === selectedDayIdx));
    h.setAttribute("aria-label", DAY_LONG[i] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ". · " + wieVoll);
    h.title = h.getAttribute("aria-label");
    const waehlen = () => {
      selectedDayIdx = i;
      grid.querySelectorAll(".dayhead[aria-pressed]").forEach((k, j) => k.setAttribute("aria-pressed", String(j === i)));
      renderEnergy(); renderDaySwitch(); renderAgenda(); if (einTag) renderGrid();
    };
    h.onclick = waehlen;
    h.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); waehlen(); }
    });
