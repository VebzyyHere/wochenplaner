        "<div class='chipset' id='sOrtNeu' style='margin-top:10px'></div>" +
        "<div id='sWege' style='margin-top:14px'></div></div>" +
      "<div class='sheet__row' data-page='ansicht'><span class='label'>Darstellung</span>" +
        "<div class='chipset' id='sTheme'></div>" +
        (window.matchMedia("(pointer: fine)").matches
          ? "<button class='btn btn--sm btn--ghost' id='sKuerzel' type='button' style='margin-top:14px'>Tastenkürzel anzeigen</button>"
          : "") +
      "</div>" +
      "<div class='sheet__row' data-page='daten'><span class='label'>Daten</span>" +
      "<div style='display:flex;gap:8px;flex-wrap:wrap'>" +
      "<button class='btn btn--sm' id='sExport' type='button'>Sicherung speichern</button>" +
      "<button class='btn btn--sm' id='sImport' type='button'>Sicherung laden</button>" +
      "<button class='btn btn--sm btn--danger' id='sReset' type='button'>Alles löschen</button>" +
      "</div><div id='sStore' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px'></div>" +
      "<div id='sVorV9' style='margin-top:10px'></div></div>" +
      "<div class='sheet__row' data-page='kalender'><span class='label'>In deinen Kalender</span>" +
      "<p style='margin:0 0 12px;font-size:var(--t-body);color:var(--text-muted);line-height:1.6'>" +
      "Speichert alle Termine mit fester Uhrzeit als Kalenderdatei (.ics). Google, Apple und " +
      "Outlook können sie importieren. Serien bleiben Serien, ausgelassene Tage bleiben ausgelassen.</p>" +
      "<button class='btn btn--sm' id='sKalender' type='button'>Kalenderdatei speichern</button>" +
      "<div style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px;line-height:1.5'>" +
      "Ohne grob geplante Zeit und ohne offene Vorschläge. Ein einmaliger Export — " +
      "spätere Änderungen hier kommen erst mit dem nächsten Export dort an.</div></div>" +
      "<div class='sheet__row' data-page='app'><span class='label'>Auf den Startbildschirm</span>" +
      "<p style='margin:0 0 12px;font-size:var(--t-body);color:var(--text-muted);line-height:1.6'>" +
      "Dann startet der Planer ohne Browserleiste, mit eigenem Symbol — und er geht auch " +
      "auf, wenn du gerade kein Netz hast.</p>" +
      "<ol id='sAppSchritte' style='margin:0;padding-left:20px;font-size:var(--t-body);line-height:1.75;color:var(--text-muted)'></ol>" +
      "<div id='sAppStand' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:12px;line-height:1.5'></div></div>";

    {
      const ol = s.querySelector("#sAppSchritte");
      if (ol) {
        appAnleitung().forEach(x => {
          const li = document.createElement("li");
          li.innerHTML = x;
          ol.appendChild(li);
        });
        s.querySelector("#sAppStand").textContent = ("serviceWorker" in navigator)
          ? "Der Plan liegt weiter in deinem Konto — die App holt ihn beim Start ab."
          : "Dieser Browser unterstützt das Installieren nicht. Ein Lesezeichen tut es auch.";
      }
    }

    const name = s.querySelector("#sName"); name.value = state.profile.name;
    const f = s.querySelector("#sFrom"); f.value = state.settings.dayStart;
    const t = s.querySelector("#sTo"); t.value = state.settings.dayEnd;
    s.querySelector("#sStore").textContent = Store.available
      ? "Wird automatisch in diesem Browser gespeichert."
      : "Achtung: In dieser Ansicht kann nichts dauerhaft gespeichert werden. Lade die Datei herunter und öffne sie direkt — dann bleibt alles erhalten.";

    // Schlaf & Ruhe
    const sl = state.settings.sleep;
    const slOn = s.querySelector("#sSleepOn");
    const slFrom = s.querySelector("#sSleepFrom");
    const slTo = s.querySelector("#sSleepTo");
    const slWind = s.querySelector("#sSleepWind");
    const slBody = s.querySelector("#sSleepBody");
    const slHint = s.querySelector("#sSleepHint");

    slOn.checked = sl.on;
    slFrom.value = fmtTime(sl.from);
    slTo.value = fmtTime(sl.to);
    slWind.value = sl.wind;

    const paintSleep = () => {
      slBody.style.opacity = slOn.checked ? "1" : ".45";
      [slFrom, slTo, slWind].forEach(f => f.disabled = !slOn.checked);
      const f = parseTime(slFrom.value), t = parseTime(slTo.value);
      const w = clamp(parseInt(slWind.value, 10) || 0, 0, 180);
      slHint.textContent = slOn.checked
        ? "Ab " + fmtTime((f - w + 1440) % 1440) + " wird nichts mehr eingeplant, wieder ab " +
          fmtTime((t + w) % 1440) + ". Von Hand eintragen kannst du dort trotzdem."
        : "Ohne Schlafenszeit darf der Vorschlag über den ganzen sichtbaren Tag planen — auch früh um sechs.";
    };
    slOn.onchange = paintSleep;
    [slFrom, slTo, slWind].forEach(f => f.oninput = paintSleep);
    paintSleep();

    paintAccount(s.querySelector("#sAcctRow"), s.querySelector("#sAcct"), close);

    const areasWrap = s.querySelector("#sAreas");
    const paint = () => {
      areasWrap.innerHTML = "";
      state.areas.forEach((a, i) => {
        const row = document.createElement("div");
        row.className = "arearow";
        row.style.setProperty("--h", a.hue);
        const sw = document.createElement("button");
        sw.type = "button"; sw.className = "arearow__swatch";
        sw.title = "Farbe wechseln"; sw.setAttribute("aria-label", "Farbe von " + a.name + " wechseln");
        sw.onclick = () => { a.hue = (a.hue + 40) % 360; save(); paint(); renderAll(); };
        const inp = document.createElement("input");
        inp.className = "field"; inp.value = a.name;
        inp.setAttribute("aria-label", "Name des Bereichs");
        // Nicht bei jedem Tastenanschlag speichern: das setzte die
        // Rückgängig-Historie zurück, zeichnete das ganze Raster neu und
        // schickte pro Zeichen einen Abgleich zum Server.
        let tippTimer = null;
        inp.oninput = () => {
          a.name = inp.value;
          clearTimeout(tippTimer);
          tippTimer = setTimeout(() => { save(); renderAll(); }, 500);
        };
        inp.onchange = () => { clearTimeout(tippTimer); a.name = inp.value; save(); renderAll(); };
        const del = document.createElement("button");
        del.type = "button"; del.className = "btn btn--sm btn--danger"; del.textContent = "×";
        del.setAttribute("aria-label", "Bereich " + a.name + " löschen");
        del.disabled = state.areas.length <= 1;
        del.onclick = () => {
          const fallback = state.areas.find(x => x.id !== a.id).id;
          state.blocks.forEach(b => { if (b.areaId === a.id) b.areaId = fallback; });
          state.tasks.forEach(x => { if (x.areaId === a.id) x.areaId = fallback; });
          const gone = a.name;
          state.areas.splice(i, 1);
          save(); paint(); renderAll();
          toastUndo("Bereich „" + gone + "“ gelöscht");
        };
        row.append(sw, inp, del);
        areasWrap.appendChild(row);
      });
    };
    paint();

    // ---- Orte und Fahrzeiten
    const orteWrap = s.querySelector("#sOrte");
    const wegeWrap = s.querySelector("#sWege");
    const paintOrte = () => {
      orteWrap.innerHTML = "";
      const liste = state.orte || [];
      if (!liste.length) {
        orteWrap.innerHTML = "<div style='font-size:var(--t-sm);color:var(--text-faint);line-height:1.6'>" +
          "Noch keine Orte. Wenn du welche anlegst, plant der Planer die Fahrt dazwischen " +
          "ein — und lässt sie weg, wenn zwei Blöcke am selben Ort liegen.</div>";
      }
      liste.forEach(o => {
        const row = document.createElement("div");
        row.className = "arearow";
        const inp = document.createElement("input");
        inp.className = "field"; inp.value = o.name;
        inp.setAttribute("aria-label", "Name des Orts");
        let t = null;
        inp.oninput = () => { o.name = inp.value; clearTimeout(t);
                              t = setTimeout(() => { save(); paintWege(); }, 500); };
        inp.onchange = () => { clearTimeout(t); o.name = inp.value; save(); paintWege(); renderAll(); };
        const heim = document.createElement("button");
        heim.className = "btn btn--sm"; heim.type = "button";
        heim.textContent = state.settings.heimOrt === o.id ? "Zuhause ✓" : "als Zuhause";
        heim.title = "Blöcke ohne eigenen Ort gelten als hier";
        heim.onclick = () => { state.settings.heimOrt = o.id; save(); paintOrte(); };
        const del = document.createElement("button");
        del.className = "task__del"; del.innerHTML = "×";
        del.setAttribute("aria-label", "Ort löschen");
        del.onclick = () => {
          state.orte = state.orte.filter(x => x.id !== o.id);
          Object.keys(state.wege).forEach(k => { if (k.includes(o.id)) delete state.wege[k]; });
          state.areas.forEach(a => { if (a.plan.ortId === o.id) a.plan.ortId = null; });
          state.blocks.forEach(b => { if (b.ortId === o.id) delete b.ortId; });
          if (state.settings.heimOrt === o.id) state.settings.heimOrt = (state.orte[0] || {}).id || null;
          save(); paintOrte(); paintWege(); renderAll();
        };
        row.append(inp, heim, del);
        orteWrap.appendChild(row);
      });
    };
    const paintWege = () => {
      const paare = ortPaare();
      wegeWrap.innerHTML = paare.length
        ? "<p class='goalrow__sub'>Wie lange brauchst du zwischen zwei Orten?</p>"
        : "";
      paare.forEach(pr => {
        const row = document.createElement("div");
        row.className = "wegrow";
        const txt = document.createElement("span");
        txt.className = "wegrow__txt";
        txt.textContent = ortName(pr.a) + " ↔ " + ortName(pr.b);
        const inp = document.createElement("input");
        inp.className = "field wegrow__min"; inp.type = "number";
        inp.min = "0"; inp.max = "240"; inp.step = "5";
        inp.value = state.wege[pr.key] || 0;
        inp.setAttribute("aria-label", "Fahrzeit " + ortName(pr.a) + " nach " + ortName(pr.b));
        inp.onchange = () => {
          const v = clamp(parseInt(inp.value, 10) || 0, 0, 240);
          if (v) state.wege[pr.key] = v; else delete state.wege[pr.key];
          inp.value = v; save();
        };
        const min = document.createElement("span");
        min.style.cssText = "font-size:var(--t-sm);color:var(--text-faint);flex:none";
        min.textContent = "min";
        row.append(txt, inp, min);
        wegeWrap.appendChild(row);
      });
    };
    paintOrte();
    paintWege();
    {
      const neuWrap = s.querySelector("#sOrtNeu");
      const knopf = () => {
        neuWrap.innerHTML = "";
        const b = document.createElement("button");
        b.className = "btn btn--sm"; b.type = "button"; b.textContent = "+ Ort";
        b.onclick = () => {
          neuWrap.innerHTML = "";
          const inp = document.createElement("input");
          inp.className = "field"; inp.placeholder = "z.B. Büro, Uni, Halle";
          inp.style.maxWidth = "190px"; inp.autocomplete = "off";
          const ok = document.createElement("button");
          ok.className = "btn btn--sm"; ok.type = "button"; ok.textContent = "Anlegen";
          const fertig = () => {
            const name = inp.value.trim();
            if (name) {
              if (!Array.isArray(state.orte)) state.orte = [];
              const o = { id: "o-" + uid(), name };
              state.orte.push(o);
              if (!state.settings.heimOrt) state.settings.heimOrt = o.id;
              save(); paintOrte(); paintWege();
            }
            knopf();
          };
          ok.onclick = fertig;
          inp.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); fertig(); }
            if (e.key === "Escape") { e.preventDefault(); knopf(); }
          });
          neuWrap.append(inp, ok);
          inp.focus();
        };
        neuWrap.appendChild(b);
      };
      knopf();
    }

    s.querySelector("#sAddArea").onclick = () => {
      state.areas.push({ id: uid(), name: "Neuer Bereich", hue: (state.areas.length * 47 + 20) % 360, plan: defaultPlan() });
      save(); paint(); renderAll();
    };
    s.querySelector("#sExport").onclick = exportData;
    s.querySelector("#sKalender").onclick = kalenderExport;
    const kuerzelKnopf = s.querySelector("#sKuerzel");
    if (kuerzelKnopf) kuerzelKnopf.onclick = () => { close(); kuerzelSheet(); };
    s.querySelector("#sImport").onclick = importData;
    s.querySelector("#sReset").onclick = () => {
      close();
      confirmSheet("Wirklich alles löschen?",
        "Alle Einträge, Aufgaben und Bereiche werden entfernt. Das lässt sich nicht rückgängig machen — mach vorher eine Sicherung, wenn du unsicher bist.",
        "Alles löschen",
        () => { state = freshState(); save(); renderAll(); toastUndo("Alles zurückgesetzt"); });
    };

    // Nur sichtbar, solange die einmalige Sicherung vor der v9-Migration
    // existiert (Store.backupVorV9 in migrate()) — unaufdringlich, weil sie
    // die meisten nie brauchen.
    if (Store.hasVorV9()) {
      const b = document.createElement("button");
      b.className = "btn btn--sm btn--ghost"; b.type = "button";
      b.textContent = "Stand vor dem letzten großen Update wiederherstellen";
      b.onclick = () => {
        close();
        confirmSheet("Alten Stand wiederherstellen?",
          "Ersetzt den aktuellen Plan durch den Stand von vor dem letzten großen Update. Das lässt sich nicht rückgängig machen.",
          "Wiederherstellen",
          () => {
            const alt = Store.loadVorV9();
            if (!alt) { toast("Sicherung nicht gefunden"); return; }
            state = alt;
            migrate(state);
            lastSnap = snapshot(state);
            lastSavedJson = JSON.stringify(state);
            save(); renderAll();
            toast("Alter Stand wiederhergestellt");
          });
      };
      s.querySelector("#sVorV9").appendChild(b);
    }

    // Hell/Dunkel wohnt jetzt hier statt in der Kopfzeile — dort war kein
    // Platz mehr, und umgestellt wird es ohnehin einmal und nie wieder.
    {
      const wrap = s.querySelector("#sTheme");
      const paintTheme = () => {
        wrap.innerHTML = "";
        [["auto", "Wie das Gerät"], ["light", "Hell"], ["dark", "Dunkel"]].forEach(([wert, text]) => {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.setAttribute("aria-pressed", String(state.settings.theme === wert));
          c.textContent = text;
          c.onclick = () => { state.settings.theme = wert; save(); applyTheme(); paintTheme(); };
          wrap.appendChild(c);
        });
      };
      paintTheme();
    }

    const uebernehmen = () => {
      state.profile.name = name.value.trim();
      const a = clamp(parseInt(f.value, 10) || 0, 0, 12);
      const b = clamp(parseInt(t.value, 10) || 24, 13, 24);
      state.settings.dayStart = a; state.settings.dayEnd = b;
      state.settings.sleep = {
        on: slOn.checked,
        from: parseTime(slFrom.value),
        to: parseTime(slTo.value),
        wind: clamp(parseInt(slWind.value, 10) || 0, 0, 180)
      };
      save();
    };

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Fertig";
    ok.onclick = () => { uebernehmen(); close(); renderAll(); };
    foot.appendChild(ok);
    s.appendChild(foot);

    baueEinstellungsMenue(s, uebernehmen, ok);
  }, { wide: true });
};

/* ============================================================
   Einstellungen als Menü statt als eine lange Rolle

   Alles auf einmal waren am Telefon 1395 Pixel — zweieinhalb
   Bildschirmhöhen Scrollen, 35 Bedienelemente, kein Überblick.
   Hier bleibt der gesamte Aufbau unverändert: die Abschnitte stehen
   weiter im Dokument, es wird nur immer genau einer gezeigt. Dadurch
   funktionieren sämtliche Eingaben und Knöpfe unverändert weiter.
   ============================================================ */

const SETTINGS_SEITEN = [
  { id: "person",   name: "Wer plant hier?",     kurz: () => state.profile.name || "kein Name" },
  { id: "zeit",     name: "Tag und Nachtruhe",   kurz: () => {
      const sl = state.settings.sleep || {};
      return pad2(state.settings.dayStart) + "–" + pad2(state.settings.dayEnd) + " Uhr"
        + (sl.on ? " · Schlaf ab " + fmtTime(sl.from) : " · keine Schlafenszeit");
    } },
  { id: "bereiche", name: "Bereiche",            kurz: () => {
      const mitZiel = state.areas.filter(a => a.plan.goal > 0).length;
      return state.areas.length + " Bereiche" + (mitZiel ? ", " + mitZiel + " mit Wochenziel" : "");
    } },
  { id: "orte",     name: "Orte und Fahrzeiten", kurz: () => {
      const n = (state.orte || []).length;
      return n ? n + (n === 1 ? " Ort" : " Orte") : "noch keine Orte";
    } },
  { id: "ansicht",  name: "Darstellung",         kurz: () => (
      { auto: "Wie das Gerät", light: "Hell", dark: "Dunkel" }[state.settings.theme] || "Wie das Gerät") },
  { id: "konto",    name: "Konto",               kurz: () => (Sync.active() ? "angemeldet" : "nur dieses Gerät"),
    wennVerfuegbar: () => Sync.configured() },
  { id: "daten",    name: "Daten und Sicherung", kurz: () => (
      state.backupAt ? "zuletzt gesichert am " + new Date(state.backupAt).toLocaleDateString("de-DE")
                     : "noch nie gesichert") },
  { id: "kalender", name: "Kalender-Export",     kurz: () => {
      const n = state.blocks.filter(b => !b.grob && !b.sug).length;
      return n ? "Termine für Google, Apple oder Outlook" : "noch keine Termine";
    } },
  // Nur zeigen, solange die App im Browser läuft — wer sie schon auf dem
  // Startbildschirm hat, braucht die Anleitung nicht mehr.
  { id: "app",      name: "Auf den Startbildschirm", kurz: () => "wie eine App öffnen",
    wennVerfuegbar: () => !laeuftAlsApp() }
];

/* Läuft die Seite schon als eigenständige App? */
function laeuftAlsApp() {
  return window.matchMedia("(display-mode: standalone)").matches
      || window.matchMedia("(display-mode: minimal-ui)").matches
      || navigator.standalone === true;
}

/* Die Wege dahin unterscheiden sich pro Gerät, und keiner davon ist
   erratbar. Also einmal aufschreiben, statt es niemandem zu sagen. */
function appAnleitung() {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (ios) return [
    "Unten in der Leiste auf <b>Teilen</b> tippen (Quadrat mit Pfeil nach oben).",
    "In der Liste <b>Zum Home-Bildschirm</b> wählen.",
    "Oben rechts auf <b>Hinzufügen</b>."
  ];
  if (/Android/.test(ua)) return [
    "Oben rechts auf die <b>drei Punkte</b> tippen.",
    "<b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b> wählen.",
    "Bestätigen — der Planer liegt dann bei deinen Apps."
  ];
  return [
    "In der Adresszeile rechts erscheint ein <b>Installieren</b>-Symbol.",
    "Alternativ im Browsermenü <b>App installieren</b> wählen.",
    "Danach startet der Planer in einem eigenen Fenster."
  ];
}

function baueEinstellungsMenue(s, uebernehmen, fertigKnopf) {
  const titel = s.querySelector(".sheet__title");
  const abschnitte = {};
  {
    const rb = s.querySelector("#sRitual");
    if (rb) {
      rb.onclick = () => { closeModal(); ritualSheet(); };
      const h = s.querySelector("#sRitualHint");
      const wann = state.rituale[iso(mondayOf(anchor))];
      h.textContent = wann
        ? "Diese Woche schon gemacht — am " + new Date(wann).toLocaleDateString("de-DE",
            { weekday: "long", hour: "2-digit", minute: "2-digit" }) + "."
        : "Diese Woche noch offen.";
    }
  }

  s.querySelectorAll(".sheet__row[data-page]").forEach(r => {
    (abschnitte[r.dataset.page] = abschnitte[r.dataset.page] || []).push(r);
  });

  const menue = document.createElement("div");
  menue.className = "setmenu";
  titel.after(menue);

  const zurueck = document.createElement("button");
  zurueck.type = "button";
  zurueck.className = "setback";
  zurueck.innerHTML = "<span aria-hidden='true'>‹</span> Einstellungen";
  zurueck.hidden = true;
  titel.after(zurueck);

  const zeigeMenue = () => {
    uebernehmen();                       // Eingaben nicht verlieren beim Wechseln
    titel.textContent = "Einstellungen";
    titel.hidden = false;
    zurueck.hidden = true;
    menue.hidden = false;
    fertigKnopf.textContent = "Fertig";
    Object.values(abschnitte).flat().forEach(r => { r.hidden = true; });
    baueListe();
    s.scrollTop = 0;
  };

  const zeigeSeite = seite => {
    uebernehmen();
    titel.hidden = true;
    zurueck.hidden = false;
    menue.hidden = true;
    fertigKnopf.textContent = "Fertig";
    Object.entries(abschnitte).forEach(([id, rows]) => {
      rows.forEach(r => { r.hidden = id !== seite.id; });
    });
    s.scrollTop = 0;
  };

  const baueListe = () => {
    menue.innerHTML = "";
    SETTINGS_SEITEN.forEach(seite => {
      if (seite.wennVerfuegbar && !seite.wennVerfuegbar()) return;
      if (!abschnitte[seite.id]) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "setmenu__item";
      b.innerHTML =
        "<span class='setmenu__txt'><span class='setmenu__name'>" + escapeHtml(seite.name) + "</span>" +
        "<span class='setmenu__kurz'>" + escapeHtml(seite.kurz()) + "</span></span>" +
        "<span class='setmenu__pfeil' aria-hidden='true'>›</span>";
      b.onclick = () => zeigeSeite(seite);
      menue.appendChild(b);
    });
  };

  zurueck.onclick = zeigeMenue;
  zeigeMenue();
}

/* ============================================================ Konto */
function paintAccount(row, box, closeSheet) {
  if (!Sync.configured()) {
    // Noch nicht eingerichtet — dann auch nicht davon reden.
    row.hidden = true;
    return;
  }
  row.hidden = false;
  box.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "acct__row";
  const txt = document.createElement("div");
  txt.className = "acct__txt";

  if (Sync.active()) {
    txt.innerHTML =
      "<div class='acct__what'>Auf allen Geräten</div>" +
      "<div class='acct__sub'>Angemeldet als " + escapeHtml(Sync.email || "…") + "</div>";
    const out = document.createElement("button");
    out.className = "btn btn--sm"; out.type = "button"; out.textContent = "Abmelden";
    out.onclick = () => {
      closeSheet();
      confirmSheet("Abmelden?",
        "Dein Plan bleibt auf dem Server und auf den anderen Geräten. Auf diesem Gerät siehst du danach wieder den Plan, der hier vor der Anmeldung lag.",
        "Abmelden",
        () => { Sync.signOut(); toast("Abgemeldet"); });
    };
    wrap.append(txt, out);
  } else {
    txt.innerHTML =
      "<div class='acct__what'>Nur dieses Gerät</div>" +
      "<div class='acct__sub'>Der Plan liegt im Speicher dieses Browsers.</div>";
    const go = document.createElement("button");
    go.className = "btn btn--primary btn--sm"; go.type = "button";
    go.textContent = "Überall nutzen";
    go.onclick = () => { closeSheet(); signInSheet(); };
    wrap.append(txt, go);
  }
  box.appendChild(wrap);
}

function signInSheet(mode) {
  let neu = mode === "new";
  modal((s, close) => {
    const paint = () => {
      s.innerHTML =
        "<h2 class='sheet__title'>" + (neu ? "Konto anlegen" : "Auf allen Geräten") + "</h2>" +
        "<p style='margin:0 0 18px;color:var(--text-muted);font-size:var(--t-body);line-height:1.6'>" +
        (neu
          ? "Damit steht dein Plan auf Handy, Tablet und Rechner gleich — und er ist gesichert, falls diesem Gerät etwas passiert. Was du bisher hier eingetragen hast, wird übernommen."
          : "Melde dich an, dann siehst du auf jedem Gerät denselben Plan.") +
        "</p>" +
        "<div class='sheet__row'><label class='label' for='inEmail'>E-Mail</label>" +
        "<input class='field' id='inEmail' type='email' inputmode='email' autocomplete='email' placeholder='du@beispiel.de'></div>" +
        "<div class='sheet__row'><label class='label' for='inPass'>Passwort</label>" +
        "<input class='field' id='inPass' type='password' autocomplete='" +
          (neu ? "new-password" : "current-password") + "' placeholder='" +
          (neu ? "mindestens sechs Zeichen" : "") + "'></div>" +
        "<div id='inMsg' style='font-size:var(--t-sm);color:var(--text-muted);min-height:18px;line-height:1.5'></div>" +
        "<button type='button' id='inSwap' style='background:none;border:none;padding:6px 0;margin-top:4px;" +
        "font-size:var(--t-sm);color:var(--text-muted);text-decoration:underline;text-underline-offset:3px'>" +
        (neu ? "Ich habe schon ein Konto" : "Neu hier? Konto anlegen") + "</button>";

      const mail = s.querySelector("#inEmail");
      const pass = s.querySelector("#inPass");
      const msg = s.querySelector("#inMsg");

      s.querySelector("#inSwap").onclick = () => {
        const keepMail = mail.value;
        neu = !neu;
        paint();
        s.querySelector("#inEmail").value = keepMail;
        s.querySelector("#inEmail").focus();
      };

      const foot = document.createElement("div");
      foot.className = "sheet__foot";
      foot.innerHTML = "<span class='spacer'></span>";
      const cancel = document.createElement("button");
      cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
      cancel.onclick = close;
      const ok = document.createElement("button");
      ok.className = "btn btn--primary"; ok.type = "button";
      ok.textContent = neu ? "Konto anlegen" : "Anmelden";

      const go = async () => {
        const e = mail.value.trim(), p = pass.value;
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { msg.textContent = "Bitte eine gültige E-Mail-Adresse."; mail.focus(); return; }
        if (p.length < 6) { msg.textContent = "Das Passwort braucht mindestens sechs Zeichen."; pass.focus(); return; }
        ok.disabled = true;
        msg.textContent = neu ? "Konto wird angelegt …" : "Wird angemeldet …";
        try {
          if (neu) {
            const r = await Sync.signUp(e, p);
            if (r === "confirm") {
              msg.innerHTML = "<b>Fast fertig.</b> Bestätige zuerst den Link in deinem Postfach, dann melde dich hier an.";
              ok.textContent = "Alles klar"; ok.disabled = false; ok.onclick = close;
              return;
            }
          } else {
            await Sync.signInPassword(e, p);
          }
          close();
          await Sync.afterSignIn();
          toast("Angemeldet — dein Plan ist jetzt überall");
        } catch (err) {
          msg.textContent = err.message || "Hat nicht geklappt.";
          ok.disabled = false;
        }
      };
      ok.onclick = go;
      [mail, pass].forEach(f => f.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); go(); }
      }));
      foot.append(cancel, ok);
      s.appendChild(foot);
      mail.focus();
    };
    paint();
  });
}

/* ============================================================ Sichern / Laden */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wochenplaner-" + iso(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  state.backupAt = Date.now();
  save();
  toast("Sicherung gespeichert");
}

/* ============================================================
   Kalender-Export (v1.31)

   Der Plan lebt hier — der Rest des Lebens oft in Google, Apple oder
   Outlook. Eine .ics-Datei ist der einzige Weg, der ohne Konto, ohne
   Server und auch über file:// funktioniert.

   Was hinausgeht und was nicht:
   - Nur Blöcke mit fester Uhrzeit. Grobe Blöcke haben keine; eine
     erfundene Uhrzeit im fremden Kalender wäre genau das, was das Band
     unter dem Raster vermeiden soll.
   - Keine offenen Vorschläge (b.sug) — die gelten erst nach „Übernehmen".
   - Serien bleiben Serien (RRULE, INTERVAL=2 für zweiwöchentlich), einzeln
     ausgelassene Tage (b.ausnahmen) werden EXDATE. Der erste Termin wird
     über onDay() gesucht statt nachgerechnet — so gilt dieselbe Parität
     wie überall sonst in der App, auch über die Sommerzeit.
   - Lokale „schwebende" Zeiten ohne Zone: der Plan kennt nur Wanduhrzeit,
     und jeder Kalender legt sie in seine eigene Zone.
   - UID hängt an der Block-id: ein erneuter Import aktualisiert in den
     meisten Kalendern, statt zu verdoppeln.
   Liest nur, schreibt nichts in state — deshalb auch kein save().
   ============================================================ */
function icsText(t) {
  return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function icsZeit(datum, minuten) {
  const d = addDays(datum, Math.floor(minuten / 1440));
  const m = minuten % 1440;
  return iso(d).replace(/-/g, "") + "T" + pad2(Math.floor(m / 60)) + pad2(m % 60) + "00";
}
/* RFC 5545: höchstens 75 Oktette je Zeile, Fortsetzung mit einem
   Leerzeichen. Gezählt wird in UTF-8, getrennt nie mitten in einem Zeichen. */
function icsFalten(zeile) {
  const enc = new TextEncoder();
  const teile = [];
  let akt = "", bytes = 0, grenze = 75;
  for (const z of zeile) {
    const n = enc.encode(z).length;
    if (bytes + n > grenze) { teile.push(akt); akt = ""; bytes = 0; grenze = 74; }
    akt += z; bytes += n;
  }
  teile.push(akt);
  return teile.join("\r\n ");
}
function kalenderIcs() {
  const jetzt = new Date();
  const stempel = jetzt.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const zeilen = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Wochenplaner//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Wochenplaner"];
  const orte = new Map((state.orte || []).map(o => [o.id, o.name]));
  state.blocks.forEach(b => {
    if (b.grob || b.sug || !(b.end > b.start)) return;
    let erster = null;
    if (istSerie(b)) {
      // Ab since (sonst ab dem gespeicherten Datum bzw. dieser Woche) den
      // ersten Tag suchen, an dem onDay() den Block wirklich zeigt.
      const ab = new Date((b.since || b.date || iso(mondayOf(new Date()))) + "T12:00:00");
      for (let k = 0; k < 21 && !erster; k++) {
        const d = addDays(ab, k);
        if (onDay(b, iso(d), (d.getDay() + 6) % 7)) erster = d;
      }
      if (!erster) return;
    } else {
      if (!b.date) return;
      erster = new Date(b.date + "T12:00:00");
    }
    const area = areaById(b.areaId);
    zeilen.push("BEGIN:VEVENT",
      "UID:" + b.id + "@wochenplaner",
      "DTSTAMP:" + stempel,
      "DTSTART:" + icsZeit(erster, b.start),
      "DTEND:" + icsZeit(erster, b.end),
      "SUMMARY:" + icsText(b.title || (area && area.name) || "Eintrag"));
    if (area) zeilen.push("CATEGORIES:" + icsText(area.name));
    if (b.ortId && orte.has(b.ortId)) zeilen.push("LOCATION:" + icsText(orte.get(b.ortId)));
    if (istSerie(b)) {
      zeilen.push("RRULE:FREQ=WEEKLY" + (b.repeat === "2wochen" ? ";INTERVAL=2" : ""));
      (b.ausnahmen || []).slice().sort().forEach(a => {
        zeilen.push("EXDATE:" + icsZeit(new Date(a + "T12:00:00"), b.start));
      });
    }
    zeilen.push("END:VEVENT");
  });
  zeilen.push("END:VCALENDAR");
  return zeilen.map(icsFalten).join("\r\n") + "\r\n";
}
function kalenderExport() {
  const ics = kalenderIcs();
  const anzahl = (ics.match(/BEGIN:VEVENT/g) || []).length;
  if (!anzahl) { toast("Noch keine Termine mit fester Uhrzeit"); return; }
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wochenplaner-termine-" + iso(new Date()) + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(anzahl === 1 ? "1 Termin exportiert" : anzahl + " Termine exportiert");
}

/* ============================================================
   Sicherungs-Erinnerung

   Solange der Plan nur im Browser liegt, ist er genau eine gelöschte
   Browser-Historie vom Totalverlust entfernt. Deshalb ein Hinweis —
   aber ein einziger, höchstens alle zwei Wochen, und nur wenn wirklich
   Arbeit drinsteckt. Wer ein Konto hat, sieht ihn nie.
   ============================================================ */
const BACKUP_NAG_DAYS = 14;

function maybeBackupNag() {
  if (!Store.available) return;
  if (Sync.active()) return;
  const stuff = state.blocks.length + state.tasks.length;
  if (stuff < 8) return;                       // zu wenig, um daran zu hängen
  const now = Date.now();
  const span = BACKUP_NAG_DAYS * 86400000;
  if (state.backupAt && now - state.backupAt < span) return;
  if (state.nagAt && now - state.nagAt < span) return;

  state.nagAt = now;
  save();
  setTimeout(() => {
    toast(state.backupAt ? "Letzte Sicherung ist eine Weile her" : "Dein Plan liegt nur in diesem Browser",
      { label: "Sichern", run: exportData });
  }, 2500);
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data !== "object") throw new Error("bad");
        if (Array.isArray(data)) {
          // Ein Array besteht "typeof === object" und würde sonst unbemerkt
          // an migrate() durchgereicht: state würde selbst zum Array, und
          // JSON.stringify() verschluckt beim nächsten save() jedes benannte
          // Feld (areas, blocks, tasks, ...) — stiller, kompletter Datenverlust
          // ohne jede Fehlermeldung (Importfuzz Fall 2b, werkzeug/importfuzz.js).
          toast("Diese Datei ist keine gültige Wochenplaner-Sicherung");
          return;
        }
        // "areas" ist das eine Feld, das jede echte Sicherung traegt — von
        // freshState() bis migrate() nie leer oder weggelassen, weil die
        // ganze Planung um Bereiche herum aufgebaut ist. Muss VOR migrate()
        // gelesen werden: migrate() fuellt ein fehlendes areas-Feld selbst
        // mit den Standardbereichen auf und wuerde die Fremddatei sonst
        // nachtraeglich wie eine echte aussehen lassen.
        const hatBereiche = Array.isArray(data.areas);
        migrate(data);

        // Ersetzen ist nicht harmlos: alles, was es hier gibt und in der
        // Sicherung nicht, bekommt beim Speichern einen Grabstein — und den
        // schiebt der Abgleich auf alle anderen Geräte. Eine drei Monate alte
        // Sicherung auf dem Handy hat so den Plan auf dem PC gelöscht.
        const uebernehmen = (neu, wort) => {
          state = neu;
          save(); closeModal(); renderAll();
          toast(wort);
        };

        modal((s, close) => {
          // "0 Eintraege, 0 Aufgaben" sieht fuer eine tatsaechlich leere
          // Sicherung genauso aus wie fuer eine Datei ohne jede erkennbare
          // Wochenplaner-Struktur — obwohl "Ersetzen" direkt daneben steht.
          // hatBereiche unterscheidet die beiden Faelle ehrlich.
          const keineDaten = !hatBereiche && !(data.blocks || []).length && !(data.tasks || []).length;
          s.innerHTML =
            "<h2 class='sheet__title'>Sicherung laden</h2>" +
            "<p style='margin:0 0 10px;color:var(--text-muted);font-size:var(--t-body);line-height:1.6'>" +
            (keineDaten
              ? "Diese Datei enthält keine erkennbaren Wochenplaner-Daten. "
              : "Die Datei enthält <b>" + (data.blocks || []).length + " Einträge</b> und <b>" +
                (data.tasks || []).length + " Aufgaben</b>. ") +
            "Aktuell hier: " + state.blocks.length + " Einträge, " + state.tasks.length + " Aufgaben.</p>" +
            "<p style='margin:0 0 4px;color:var(--text-faint);font-size:var(--t-sm);line-height:1.6'>" +
            "<b>Zusammenführen</b> behält beides und nimmt bei Unterschieden das Neuere. " +
            "<b>Ersetzen</b> wirft den jetzigen Plan weg — auch auf deinen anderen Geräten.</p>";
          const foot = document.createElement("div");
          foot.className = "sheet__foot";
          const ers = document.createElement("button");
          ers.className = "btn btn--danger"; ers.type = "button"; ers.textContent = "Ersetzen";
          ers.onclick = () => { close(); uebernehmen(data, "Sicherung geladen"); };
          const sp = document.createElement("span"); sp.className = "spacer";
          const abb = document.createElement("button");
          abb.className = "btn"; abb.type = "button"; abb.textContent = "Abbrechen";
          abb.onclick = close;
          const zus = document.createElement("button");
          zus.className = "btn btn--primary"; zus.type = "button"; zus.textContent = "Zusammenführen";
          zus.onclick = () => { close(); uebernehmen(mergeStates(state, data), "Zusammengeführt"); };
          foot.append(ers, sp, abb, zus);
          s.appendChild(foot);
        });
      } catch (e) {
        toast("Datei konnte nicht gelesen werden");
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

/* ============================================================
   Zusammenführen zweier Stände

   Regel: pro Eintrag gewinnt die neuere Änderung. Ein Grabstein zählt
   wie eine Änderung — ist er neuer als der Eintrag, bleibt gelöscht.
   Das ist bewusst simpel: bei einem Wochenplaner arbeitet praktisch nie
   jemand gleichzeitig auf zwei Geräten am selben Eintrag.
   ============================================================ */
function mergeStates(mine, theirs) {
  const out = JSON.parse(JSON.stringify(mine));
  if (!theirs || typeof theirs !== "object") return out;

  out.tombs = Object.assign({}, out.tombs);
  Object.keys(theirs.tombs || {}).forEach(id => {
    out.tombs[id] = Math.max(out.tombs[id] || 0, theirs.tombs[id] || 0);
  });

  ["blocks", "tasks", "areas", "orte"].forEach(c => {
    const byId = new Map();
    (out[c] || []).forEach(r => byId.set(r.id, r));
    (theirs[c] || []).forEach(r => {
      const m = byId.get(r.id);
      if (!m || (r.at || 0) > (m.at || 0)) byId.set(r.id, r);
    });
    out[c] = [...byId.values()].filter(r => (out.tombs[r.id] || 0) <= (r.at || 0));
  });

  // Wegzeiten: kein Zeitstempel pro Schlüssel, darum feldweise das Maximum —
  // eine längere Fahrzeit ist die sicherere Annahme als eine kürzere.
  out.wege = Object.assign({}, out.wege);
  Object.keys(theirs.wege || {}).forEach(k => {
    out.wege[k] = Math.max(out.wege[k] || 0, theirs.wege[k] || 0);
  });

  // Abgehaktes und erledigte Wochenstarts: der jüngere Eintrag gewinnt.
  out.erledigt = Object.assign({}, out.erledigt);
  Object.keys(theirs.erledigt || {}).forEach(k => {
    const m = out.erledigt[k], e = theirs.erledigt[k];
    if (!e) return;
    if (!m || (e.at || 0) > (m.at || 0)) out.erledigt[k] = e;
  });
  out.rituale = Object.assign({}, out.rituale);
  Object.keys(theirs.rituale || {}).forEach(k => {
    out.rituale[k] = Math.max(out.rituale[k] || 0, theirs.rituale[k] || 0);
  });

  out.days = out.days || {};
  Object.keys(theirs.days || {}).forEach(k => {
    const m = out.days[k], t = theirs.days[k];
    if (!m || (t.at || 0) > (m.at || 0)) out.days[k] = t;
  });
  Object.keys(out.days).forEach(k => {
    if ((out.tombs["day:" + k] || 0) > (out.days[k].at || 0)) delete out.days[k];
  });

  if ((theirs.settingsAt || 0) > (out.settingsAt || 0)) {
    out.settings = theirs.settings;
    out.settingsAt = theirs.settingsAt;
  }
  if (!out.profile.name && theirs.profile && theirs.profile.name) out.profile.name = theirs.profile.name;
  out.backupAt = Math.max(out.backupAt || 0, theirs.backupAt || 0);

  // Grabsteine älter als ein halbes Jahr wegräumen
  const cutoff = Date.now() - 180 * 86400000;
  Object.keys(out.tombs).forEach(id => { if (out.tombs[id] < cutoff) delete out.tombs[id]; });
  // Ein „doch nicht erledigt" muss nur so lange bleiben, wie es ein älteres
  // „erledigt" auf einem anderen Gerät überstimmen können muss.
  Object.keys(out.erledigt).forEach(k => {
    const e = out.erledigt[k];
    if (!e || (!e.on && (e.at || 0) < cutoff)) delete out.erledigt[k];
  });

  return out;
}

/* ============================================================
   Abgleich zwischen Geräten (Supabase)

   Ohne eingetragene Zugangsdaten passiert hier nichts — der Planer
   läuft dann genau wie vorher rein lokal. Sobald URL und Schlüssel
   oben in SUPABASE stehen, erscheint in den Einstellungen der
   Konto-Bereich und alles Weitere läuft von selbst.

   Der öffentliche Schlüssel (anon key) darf in dieser Datei stehen —
   er ist dafür gemacht. Geschützt werden die Daten auf dem Server
   durch Row Level Security: jeder sieht nur seine eigene Zeile.
   ============================================================ */

const SESSION_KEY = "wochenplaner.session";

const Sync = (() => {
  let session = null;        // { access_token, refresh_token, expires_at, user_id, email }
  let status = "off";        // off | signedout | syncing | ok | offline | error
  let pending = false;
  let timer = null;

  const configured = () => !!(SUPABASE.url && SUPABASE.key);

  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
    catch (e) { session = null; }
  }
  function storeSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function setStatus(s) { status = s; paintSyncBadge(); }

  async function api(path, opts = {}) {
    const headers = Object.assign({
      "apikey": SUPABASE.key,
      "Content-Type": "application/json"
    }, opts.headers || {});
    if (session && session.access_token) headers["Authorization"] = "Bearer " + session.access_token;
    const res = await fetch(SUPABASE.url.replace(/\/$/, "") + path, Object.assign({}, opts, { headers }));
    if (res.status === 401 && session && session.refresh_token && !opts._retried) {
      const ok = await refresh();
      if (ok) return api(path, Object.assign({}, opts, { _retried: true }));
    }
    return res;
  }

  async function refresh() {
    try {
      const res = await fetch(SUPABASE.url.replace(/\/$/, "") + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE.key, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!res.ok) { storeSession(null); setStatus("signedout"); return false; }
      const d = await res.json();
      storeSession({
        access_token: d.access_token, refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        user_id: (d.user && d.user.id) || (session && session.user_id),
        email: (d.user && d.user.email) || (session && session.email)
      });
      return true;
    } catch (e) { setStatus("offline"); return false; }
  }

  const base = () => SUPABASE.url.replace(/\/$/, "");
  const anonHead = { "apikey": SUPABASE.key, "Content-Type": "application/json" };

  function takeSession(d) {
    storeSession({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Date.now() + (d.expires_in || 3600) * 1000,
      user_id: d.user && d.user.id,
      email: d.user && d.user.email
    });
  }

  /* Anmelden mit E-Mail und Passwort. Funktioniert ohne jede weitere
     Einrichtung — im Gegensatz zum E-Mail-Link, der einen Mailversand
     braucht (siehe unten). */
  async function signInPassword(email, password) {
    const res = await fetch(base() + "/auth/v1/token?grant_type=password", {
      method: "POST", headers: anonHead,
      body: JSON.stringify({ email, password })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = (d.error_description || d.msg || d.message || "").toLowerCase();
      if (m.includes("invalid login") || m.includes("credentials"))
        throw new Error("E-Mail oder Passwort stimmt nicht.");
      throw new Error("Anmeldung hat nicht geklappt.");
    }
    takeSession(d);
    return true;
  }

  async function signUp(email, password) {
    const res = await fetch(base() + "/auth/v1/signup", {
      method: "POST", headers: anonHead,
      body: JSON.stringify({ email, password })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = (d.msg || d.message || d.error_description || "").toLowerCase();
      if (m.includes("already registered") || m.includes("already been registered"))
        throw new Error("Diese Adresse hat schon ein Konto — melde dich einfach an.");
      if (m.includes("password"))
        throw new Error("Das Passwort ist zu kurz — mindestens sechs Zeichen.");
      throw new Error("Konto anlegen hat nicht geklappt.");
    }
    if (d.access_token) { takeSession(d); return "ready"; }
    return "confirm";     // Bestätigungsmail ist eingeschaltet
  }

  async function whoAmI() {
    const res = await api("/auth/v1/user");
    if (!res.ok) return null;
    const u = await res.json();
    storeSession(Object.assign({}, session, { user_id: u.id, email: u.email }));
    return u;
  }

  /* Server-Stand holen, mit dem lokalen zusammenführen, Ergebnis anzeigen. */
  async function pull() {
    if (!active()) return;
    setStatus("syncing");
    try {
      const res = await api("/rest/v1/plans?select=data");
      if (!res.ok) { setStatus("error"); return; }
      const rows = await res.json();
      if (rows.length && rows[0].data) {
        const merged = mergeStates(state, rows[0].data);
        migrate(merged);
        state = merged;
        lastSnap = snapshot(state);      // nicht alles als „gerade geändert" stempeln
        lastSavedJson = JSON.stringify(state);
        Store.save(state);
        renderAll();
      }
      setStatus("ok");
      await pushNow();
    } catch (e) { setStatus("offline"); pending = true; }
  }

  async function pushNow() {
    if (!active()) return;
    try {
      const res = await api("/rest/v1/plans", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ user_id: session.user_id, data: state, updated_at: new Date().toISOString() })
      });
      if (!res.ok) { pending = true; setStatus("error"); return; }
      pending = false;
      setStatus("ok");
    } catch (e) { pending = true; setStatus("offline"); }
  }

  function push() {
    if (!active()) return;
    clearTimeout(timer);
    timer = setTimeout(pushNow, 1500);
  }

  function active() { return configured() && !!(session && session.access_token && session.user_id); }

  async function signOut() {
    try { await api("/auth/v1/logout", { method: "POST" }); } catch (e) {}
    storeSession(null);
    Store.setScope("local");
    state = Store.load() || freshState();
    migrate(state);
    lastSnap = snapshot(state);
    lastSavedJson = JSON.stringify(state);
    setStatus("signedout");
    renderAll();
  }

  /* Beim Start: Konto ermitteln, auf den Speicherplatz dieses Kontos
     umschalten, dann abgleichen. */
  async function boot(opts) {
    if (!configured()) { setStatus("off"); return; }
    // Nur direkt nach einer Anmeldung wird der bisherige lokale Plan
    // übernommen — sonst würde beim Anmelden auf einem fremden Gerät
    // dessen Plan in den eigenen wandern.
    const adopt = !!(opts && opts.adopt);

    if (!session) loadSession();
    if (!session) { setStatus("signedout"); return; }

    if (!session.user_id) {
      const u = await whoAmI();
      if (!u) { setStatus("signedout"); return; }
    }

    Store.setScope(session.user_id);
    const own = Store.load();
    if (own) {
      state = own;
    } else if (adopt) {
      const local = Store.loadScope("local");
      if (local) state = mergeStates(state, local);
    }
    migrate(state);
    lastSnap = snapshot(state);
    lastSavedJson = JSON.stringify(state);
    Store.save(state);
    renderAll();
    await pull();
  }

  return {
    configured, active, signInPassword, signUp, signOut, pull, push, boot,
    afterSignIn: () => boot({ adopt: true }),
    get status() { return status; },
    get email() { return session && session.email; },
    retryPending() { if (pending) pushNow(); }
  };
})();

/* ============================================================
   Wischen wechselt den Tag

   Die Idee, am Tagesende oben wieder anzufangen, löst das falsche Problem:
   ein Tag hat einen Anfang und ein Ende, und das ist Information — wer unten
   ankommt, weiß, dass der Tag zu Ende ist. Eine Endlosschleife nimmt genau
   diese Orientierung weg; man weiß nicht mehr, ob man bei heute 8 Uhr oder
   morgen 8 Uhr steht. Kein Kalender macht das.

   Das eigentliche Bedürfnis — nicht anstoßen, weiterkommen — gehört auf die
   andere Achse: seitwärts wischen wechselt den Tag, und über Sonntag hinaus
   geht es in die nächste Woche. Dort ist die Bewegung wirklich endlos, ohne
   dass man die Orientierung verliert.
   ============================================================ */
function wischenEinrichten() {
  const wrap = $("#gridWrap");
  if (!wrap || wrap.dataset.wisch) return;
  wrap.dataset.wisch = "1";

  // Scrollposition je Tag mitschreiben (scrollMerk/scrollMerkSchluessel,
  // s. renderGrid) — nur hier läuft der Nutzer tatsächlich, renderGrid
  // selbst liest nur noch, statt aus dem DOM zu raten, welcher Tag gerade
  // gescrollt wurde.
  wrap.addEventListener("scroll", () => {
    if (scrollMerkSchluessel != null) scrollMerk[scrollMerkSchluessel] = wrap.scrollTop;
  }, { passive: true });

  const grid = $("#grid");
  let x0 = 0, y0 = 0, t0 = 0, aktiv = false, achse = null;

  wrap.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;      // Maus zieht Blöcke, nicht Tage
    if (!einTag) return;                        // in der Wochenansicht wechselt nichts
    x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp;
    aktiv = true; achse = null;
  }, { passive: true });

  wrap.addEventListener("pointermove", e => {
    // Über Blöcken erlaubt, solange kein Drag läuft — erst holdToMove
    // (blockDragAktiv) hat Vorrang, ein bloßes Antippen eines Blocks
    // wischt weiterhin ganz normal den Tag weiter.
    if (!aktiv || blockDragAktiv) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;

    // Achse erst ab 10px festlegen, danach bis pointerup nicht mehr
    // revidieren — sonst kippt eine leicht schräge Bewegung mittendrin von
    // Wischen auf Scrollen um und tut am Ende keins von beidem richtig.
    if (achse === null) {
      if (Math.hypot(dx, dy) < 10) return;
      achse = Math.abs(dx) > Math.abs(dy) * 1.7 ? "x" : "y";
      if (achse === "y") { aktiv = false; return; }        // das ist Scrollen
    }
    if (achse !== "x") return;

    // Sichtbare Rückmeldung während des Wischens — direkt an den Finger
    // gebunden, keine CSS-Transition und damit auch nicht von der
    // pauschalen prefers-reduced-motion-Regel oben erfasst (die deckt nur
    // Transitions/Animationen ab). Wer reduzierte Bewegung eingestellt hat,
    // sieht deshalb hier ausdrücklich keine Vorschau, sondern erst das
    // Ergebnis nach dem Loslassen.
    if (grid && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      grid.style.transform = "translateX(" + clamp(dx, -wrap.clientWidth, wrap.clientWidth) + "px)";
    }

    const breite = wrap.clientWidth || 1;
    const t = e.timeStamp - t0;
    const v = t > 0 ? Math.abs(dx) / t : 0;   // px/ms
    if (Math.abs(dx) / breite >= 0.25 || v >= 0.4) {
      aktiv = false;
      if (grid) grid.style.transform = "";
      tagWechseln(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  const ende = () => { aktiv = false; achse = null; if (grid) grid.style.transform = ""; };
  wrap.addEventListener("pointerup", ende, { passive: true });
  wrap.addEventListener("pointercancel", ende, { passive: true });
}

/* Einen Tag weiter oder zurück — über den Wochenrand hinweg. */
function tagWechseln(richtung) {
  let i = selectedDayIdx + richtung;
  if (i > 6)      { anchor = addDays(mondayOf(anchor), 7);  i = 0; }
  else if (i < 0) { anchor = addDays(mondayOf(anchor), -7); i = 6; }
  selectedDayIdx = i;

  const wrap = $("#gridWrap");
  if (wrap) {
    wrap.classList.remove("wisch-links", "wisch-rechts");
    void wrap.offsetWidth;
    wrap.classList.add(richtung > 0 ? "wisch-links" : "wisch-rechts");
    setTimeout(() => wrap.classList.remove("wisch-links", "wisch-rechts"), 220);
  }
  renderAll();
  if (navigator.vibrate) navigator.vibrate(6);
}

/* v1.42: wie Entwurf B — Deckkraft plus ein Hauch Wachstum (98,5 % → 100 %)
   um die sichtbare Mitte jeder neu gezeigten Fläche, 240 ms. Kopf, Reiter
   und Tabbar bewegen sich nicht; transform verschiebt kein Layout, die
   Positionen für Finger und Messungen bleiben dieselben. */
let wechselAus = 0;
function wechselEnde() {
  const main = $("#main");
  main.classList.remove("is-wechsel");

function ansichtWechseln(v) {

  const main = $("#main");
  main.classList.remove("is-wechsel");
  main.dataset.wechsel = v === "plan" ? "plan" : "panel";
  const hoch = window.innerHeight;
  main.querySelectorAll(".panel > .card, .planwrap > *").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.height) el.style.transformOrigin = "50% " + Math.round(clamp(hoch / 2 - r.top, 0, r.height)) + "px";
  });
  void main.offsetWidth;          // Animation neu starten, auch beim schnellen Hin und Her
  main.classList.add("is-wechsel");
  // Falls keine Fläche animiert (nichts sichtbar), räumt der Zeitgeber auf.
  clearTimeout(wechselAus);
  wechselAus = setTimeout(wechselEnde, 400);
}

/* ============================================================
   Erststart

   Ein leerer Planer ist die härteste Hürde des Produkts: er zeigt ein
   Raster und erwartet, dass jemand von Null anfängt. Deshalb endet der
   Erststart nicht mit einem leeren Raster, sondern mit einer Woche, in
   der schon etwas steht — dem Schlaf, dem Festen, und einem Vorschlag
   für den Rest. Ändern ist leichter als anfangen.

   Vier Fragen, alle überspringbar. Wer durchklickt, bekommt trotzdem
   einen brauchbaren Startplan.
   ============================================================ */

/* Was sich die meisten vornehmen, wenn man sie fragt — als Startwert,
   nicht als Vorgabe. Zahlen in Stunden pro Woche. */
const START_ZIELE = { a3: 3, a4: 2, a5: 6, a6: 3, a7: 2 };

/* Stufe 13 Teil C: "Später" im Erststart schließt, ohne etwas anzulegen —
   damit bleiben state.blocks/tasks/profile.name leer und der Wächter unten
   würde den Assistenten beim nächsten Laden sofort wieder aufmachen, unter
   Umständen mehrfach am selben Tag. Die Notiz sitzt auf state.days[heute]
   (wie .frei/.energy) statt in einem eigenen Speicher — dieselbe Ablage wie
   für den Tagesabschluss unten, kein zweiter Mechanismus für dieselbe Idee. */
function erststartHeuteAbgelehnt() {
  const m = dayMetaLesen(iso(new Date()));
  return !!(m && m.erststartSpaeter);
}

function maybeWelcome() {
  if (state.blocks.length || state.tasks.length || state.profile.name || erststartHeuteAbgelehnt()) return;

  let schritt = 0;

      const zeig = () => {
        ein.auf = auf.value || "07:00"; ein.bett = bett.value || "22:30";
        const a = parseTime(ein.auf), b = parseTime(ein.bett);
        const schlaf = ((a - b) + 1440) % 1440;
        hint.innerHTML = "Dein Tag läuft von <b>" + ein.auf + "</b> bis <b>" + ein.bett +
          "</b> — das sind " + fmtDur(1440 - schlaf) + " wach und " + fmtDur(schlaf) + " Schlaf.";
      };
      auf.oninput = zeig; bett.oninput = zeig; zeig();
    }

    /* --- 2: der feste Block ------------------------------------------- */
    function wFest(box) {
      box.innerHTML =
        "<p class='ritual__lead'>Das eine, was fast jede Woche gleich ist — Arbeit, Uni, Schule. " +
        "Weiteres trägst du später mit zwei Fingertipps nach.</p>" +
        "<label class='switch'><input type='checkbox' id='wFestAn'> Ich habe so etwas</label>" +
        "<div id='wFestBody' style='margin-top:14px'>" +
          "<div class='sheet__row' style='margin:0 0 14px'>" +
            "<label class='label' for='wFestName'>Wie heißt es?</label>" +
            "<input class='field' id='wFestName' autocomplete='off'></div>" +
          "<div class='sheet__cols' style='margin-bottom:14px'>" +
            "<div><label class='label' for='wFestVon'>Von</label>" +
            "<input class='field' id='wFestVon' type='time' step='900'></div>" +
            "<div><label class='label' for='wFestBis'>Bis</label>" +
            "<input class='field' id='wFestBis' type='time' step='900'></div>" +
          "</div>" +
          "<span class='label'>An welchen Tagen?</span>" +
          "<div class='chipset' id='wFestTage' style='margin-top:8px'></div>" +
        "</div>";
      const an = box.querySelector("#wFestAn");
      const bodyF = box.querySelector("#wFestBody");
      const nm = box.querySelector("#wFestName");
      const von = box.querySelector("#wFestVon"), bis = box.querySelector("#wFestBis");
      const tage = box.querySelector("#wFestTage");
      an.checked = ein.festAn; nm.value = ein.festName;
      von.value = ein.festVon; bis.value = ein.festBis;
      nm.oninput = () => { ein.festName = nm.value; };
      von.oninput = () => { ein.festVon = von.value; };
      bis.oninput = () => { ein.festBis = bis.value; };
      const malTage = () => {
        tage.innerHTML = "";
        for (let i = 0; i < 7; i++) {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.textContent = DAY_SHORT[i];
          c.setAttribute("aria-pressed", String(ein.festTage.has(i)));
          c.onclick = () => {
            if (ein.festTage.has(i)) ein.festTage.delete(i); else ein.festTage.add(i);
            malTage();
          };
          tage.appendChild(c);
        }
      };
      const umschalten = () => {
        ein.festAn = an.checked;
        bodyF.hidden = !an.checked;
      };
      an.onchange = umschalten;
      malTage(); umschalten();
    }

    /* --- 3: Wochenziele ----------------------------------------------- */
    function wZiele(box) {
      box.innerHTML =
        "<p class='ritual__lead'>Stunden pro Woche, ohne feste Uhrzeit — den Platz sucht der " +
        "Planer. Null heißt: diese Woche nicht.</p>";
      const liste = document.createElement("div");
      liste.className = "zieleliste";
      box.appendChild(liste);
      const summe = document.createElement("div");
      summe.className = "ritual__summe";
      box.appendChild(summe);

      const zeichnen = () => {
        liste.innerHTML = "";
        state.areas.forEach(a => {
          const wert = ein.ziele[a.id] || 0;
          const row = document.createElement("div");
          row.className = "zielrow" + (wert > 0 ? " is-on" : "");
          row.style.setProperty("--h", a.hue);
          const name = document.createElement("div");
          name.className = "zielrow__name";
          name.innerHTML = "<span class='goal__dot'></span>" + escapeHtml(a.name);
          const stepper = document.createElement("div");
          stepper.className = "stepper";
          const minus = document.createElement("button");
          minus.type = "button"; minus.className = "btn btn--sm"; minus.textContent = "−";
          minus.setAttribute("aria-label", a.name + ": eine Stunde weniger");
          minus.onclick = () => { ein.ziele[a.id] = Math.max(0, wert - 1); zeichnen(); };
          const v = document.createElement("span");
          v.className = "stepper__val num";
          v.textContent = wert > 0 ? wert + " h" : "—";
          const plus = document.createElement("button");
          plus.type = "button"; plus.className = "btn btn--sm"; plus.textContent = "+";
          plus.setAttribute("aria-label", a.name + ": eine Stunde mehr");
          plus.onclick = () => { ein.ziele[a.id] = Math.min(80, wert + 1); zeichnen(); };
          stepper.append(minus, v, plus);
          row.append(name, stepper);
          liste.appendChild(row);
        });
        const ges = Object.values(ein.ziele).reduce((n, x) => n + (x || 0), 0);
        const fest = ein.festAn
          ? ein.festTage.size * Math.max(0, parseTime(ein.festBis) - parseTime(ein.festVon)) / 60 : 0;
        summe.innerHTML = "<b>" + fmtDur(ges * 60) + "</b> Wochenziele" +
          (fest ? " · dazu " + fmtDur(Math.round(fest * 60)) + " " + escapeHtml(ein.festName || "Fest") : "");
      };
      zeichnen();
    }

    /* --- Fußzeile ----------------------------------------------------- */
    function malenFoot() {
      foot.innerHTML = "";
      // Stufe 13 Teil C: an jeder Station sichtbar, nicht nur der ersten —
      // "alle überspringbar" (Kommentar oben) galt bisher nur für den Inhalt
      // einer Frage (Weiter übernimmt die Vorgabe), nie als eigener Ausgang.
      // Schließt ohne anzulegen; die Notiz auf dayMeta() merkt sich den Tag,
      // damit der Assistent nicht gleich beim nächsten Laden wieder aufspringt.
      const spaeter = document.createElement("button");
      spaeter.className = "btn btn--ghost"; spaeter.type = "button"; spaeter.textContent = "Später";
      spaeter.onclick = () => { dayMeta(iso(new Date())).erststartSpaeter = true; save(); close(); };
      foot.appendChild(spaeter);
      if (schritt > 0) {
        const z = document.createElement("button");
        z.className = "btn"; z.type = "button"; z.textContent = "Zurück";
        z.onclick = () => { schritt--; malen(); };
        foot.appendChild(z);
      }
      const sp = document.createElement("span"); sp.className = "spacer";
      foot.appendChild(sp);
      const w = document.createElement("button");
      w.className = "btn btn--primary"; w.type = "button";
      w.textContent = schritt === 0 ? "Los geht's" : schritt < 3 ? "Weiter" : "Woche anlegen";
      w.onclick = () => {
        if (schritt < 3) { schritt++; malen(); return; }
        // Erst schließen, dann anlegen(): anlegen() kann über
        // verteilenMitGate() bei knapper Woche selbst ein Blatt öffnen
        // ("Das wird eng") — bliebe der Assistent bis danach offen, würde
        // dieses close() hier das frisch geöffnete Gate-Blatt treffen statt
        // des Assistenten (modal() räumt beim Öffnen ohnehin das jeweils
        // offene Blatt weg, ein echter Stapel ist dafür nicht nötig).
        close();
        anlegen();
      };
      foot.appendChild(w);
    }

    /* --- Aus den Antworten eine Woche bauen ---------------------------- */
    function anlegen() {
      state.profile.name = ein.name.trim();

      const auf = parseTime(ein.auf), bett = parseTime(ein.bett);
      state.settings.sleep = { on: true, from: bett, to: auf, wind: 30 };
      // Das Raster soll den wachen Tag zeigen, mit einer Stunde Luft.
      state.settings.dayStart = clamp(Math.floor(auf / 60) - 1, 0, 22);
      // Bis eine halbe Stunde nach dem Zubettgehen — mehr wäre leere Fläche.
      state.settings.dayEnd = clamp(Math.ceil((bett + 30) / 60), state.settings.dayStart + 1, 24);

      const mon = mondayOf(anchor);
      if (ein.festAn && ein.festTage.size) {
        let von = parseTime(ein.festVon), bis = parseTime(ein.festBis);
        if (bis <= von) bis = von + 60;
        const area = areaById(ein.festArea) || state.areas[0];
        [...ein.festTage].sort((x, y) => x - y).forEach(d => {
          state.blocks.push({
            id: uid(), title: ein.festName.trim() || area.name, areaId: area.id,
            day: d, date: iso(addDays(mon, d)), repeat: "weekly",
            since: iso(addDays(mon, d)), ortId: null,
            grob: false, start: von, end: bis, frog: false
          });
        });
      }

      state.areas.forEach(a => { a.plan.goal = ein.ziele[a.id] || 0; });

      save();
      renderAll();

      // Erst jetzt verteilen — durchs selbe Tor wie die anderen beiden
      // Verteil-Einstiege (Ziele, Heute-Leerzustand): der Erststart ist ein
      // dritter Weg zu buildSuggestions() und verdient dieselbe
      // Kapazitätsprüfung, sonst entsteht am Samstagabend ein vollgepacktes
      // Rest-Wochenende ohne jede Warnung.
      verteilenMitGate(() => {
        const r = buildSuggestions();
        save();
        renderAll();
        // Der Knopf "Alle übernehmen" ist seit der dauerhaften Vorschlagsleiste
        // (Stufe 6) redundant und verdeckt hier eine Agenda-Zeile — die
        // Meldung bleibt, der Knopf fällt weg.
        if (r && r.placed)
          toast("Deine Woche steht.");
        else
          toast("Los geht's — trag ein, was fest ist");
      });
    }

    malen();
  }, { wide: true });
}

/* ============================================================ Start */
function renderAll() {
  renderHeader();
  wischenEinrichten();
  renderLoose();
  renderDaySwitch();
  renderGrid();
  renderTasks();
  renderGoals();
  renderAgenda();
  renderEnergy();
  renderRitual();
  renderSugBar();
}

if (!Store.available) {
  $("#banner").innerHTML =
    "<div class='banner' role='alert'><span><b>Speichern nicht möglich.</b> Dieser Browser kann deine Änderungen gerade nicht behalten. " +
    "Sichere sie als Datei über Einstellungen → Sicherung.</span></div>";
}

window.addEventListener("wp-speicher-voll", () => {

    "Sichere deinen Plan über Einstellungen → Sicherung, bevor du weiterarbeitest.</span></div>";
  toast("Speicher voll — bitte sichern", { label: "Sichern", run: exportData });
});

$("#syncBadge").onclick = () => {
  if (!Sync.configured()) return;
  if (!Sync.active()) signInSheet();
  else { Sync.pull(); toast("Wird abgeglichen …"); }
};

if ("ResizeObserver" in window) {
  const fussBeobachter = new ResizeObserver(fussbereichMessen);
  ["tabbar", "sugBar"].forEach(id => fussBeobachter.observe(document.getElementById(id)));
  new ResizeObserver(kopfhoeheMessen).observe(document.getElementById("kopf"));
}
sugbarPlatzieren();
kopfhoeheMessen();
window.matchMedia(SUG_OBEN_Q).addEventListener("change", sugbarPlatzieren);
window.matchMedia(QUER_Q).addEventListener("change", fussbereichMessen);

applyTheme();
document.body.dataset.tage = einTag ? "1" : "7";
setView("heute");
renderAll();
paintSyncBadge();

Sync.boot()
  .catch(() => {})
  .then(() => {
    // Erst jetzt ist der Stand endgültig — die Agenda tauscht ihre
    // Schraffur gegen den echten Inhalt (siehe renderAgenda, ~4139).
    syncSettled = true;
    renderAgenda();
    maybeWelcome();
    maybeBackupNag();
  });

// Während ein Zeiger im Raster aktiv ist (Halten, Verschieben, Wischen),
// darf der Minutentakt renderGrid() nicht auslösen — das räumt
// grid.innerHTML leer und reisst damit den Knoten unter dem Finger weg.
// Ein Set aus pointerId statt eines einzelnen Flags, falls je zwei Finger
// gleichzeitig im Raster stehen (Zoomen).
const zeigerImRaster = new Set();
document.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest("#gridWrap")) zeigerImRaster.add(e.pointerId);
}, true);
document.addEventListener("pointerup", e => zeigerImRaster.delete(e.pointerId), true);
document.addEventListener("pointercancel", e => zeigerImRaster.delete(e.pointerId), true);

let letzterTag = iso(new Date());
setInterval(() => {
  if (openModal) return;
  // Über Mitternacht hinweg zeigte die App weiter die abgelaufene Woche,
  // weil "anchor" nur beim Laden gesetzt wurde. Bei aktivem Zeiger wird
  // letzterTag bewusst NICHT aktualisiert — sonst würde der Tageswechsel
  // für diese eine Minute stillschweigend übersprungen, statt ihn beim
  // nächsten Takt nachzuholen.
  if (zeigerImRaster.size) { verschiebeJetztLinie(); return; }
  const heute = iso(new Date());
  if (heute !== letzterTag) {
    letzterTag = heute;
    if (iso(mondayOf(anchor)) !== iso(mondayOf(new Date()))) anchor = new Date();
    selectedDayIdx = (new Date().getDay() + 6) % 7;
    renderAll();
    return;
  }
  // Die Agenda hängt an "jetzt" wie die Jetzt-Linie im Raster — läuft
  // sie nicht mit, bleibt "noch 40 Min" stehen und ein vorbeigegangener
  // Eintrag rutscht nie von "läuft" nach "danach".
  renderGrid(); renderAgenda();
}, 60000);
// Beim Zurückkommen auf den Tab: kurz nachsehen, ob woanders was passiert ist
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Sync.active()) Sync.pull();
  if (!document.hidden) sucheNeueFassung();
});

/* ============================================================
   Vom Homescreen starten

   Der Service Worker macht aus der Seite eine App, die auch ohne Netz
   aufgeht. Sein bekanntes Risiko ist die Kehrseite: er kann eine alte
   Fassung festhalten. Zwei Gegenmittel — die Seite selbst wird immer
   zuerst aus dem Netz geholt (siehe sw.js), und wenn trotzdem eine neue
   Fassung wartet, fragt die App einmal nach, statt sie stillschweigend
   erst beim nächsten Mal zu nehmen.

   In der Einzeldatei-Fassung (über file:// geöffnet) gibt es keinen
   Service Worker — dort ist die Datei selbst schon die Offline-Fassung.
   ============================================================ */
let swReg = null;

function sucheNeueFassung() {
  if (swReg) swReg.update().catch(() => {});
}

function neueFassungAnbieten(worker) {
  if (!worker) return;
  toast("Eine neue Fassung ist da", {
    label: "Jetzt laden",
    run: () => {
      // Erst wenn der neue Worker das Ruder hat, neu laden — sonst kommt
      // die alte Seite zurück.
      navigator.serviceWorker.addEventListener("controllerchange",
        () => location.reload(), { once: true });
      worker.postMessage("uebernehmen");
      setTimeout(() => location.reload(), 1500);   // Notausgang
    }
  });
}

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      swReg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) neueFassungAnbieten(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const neu = reg.installing;
        if (!neu) return;
        neu.addEventListener("statechange", () => {
          // Ohne controller ist es die erste Installation — da gibt es
          // nichts zu melden.
          if (neu.state === "installed" && navigator.serviceWorker.controller)
            neueFassungAnbieten(neu);
        });
      });
    }).catch(() => {});
  });
}
