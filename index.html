      "<div class='sheet__row'><span class='label'>Wo?</span><div class='chipset' id='bOrte'></div>" +
        "<div id='bOrtHint' style='font-size:12px;color:var(--text-faint);margin-top:8px'></div></div>" +
      "<div class='sheet__row'><span class='label'>Wie genau?</span>" +
        "<div class='chipset' id='bGenau'></div>" +
        "<div id='bGenauHint' style='font-size:12px;color:var(--text-faint);margin-top:8px;line-height:1.5'></div>" +
      "</div>" +
      "<div class='sheet__row sheet__cols' id='bZeitRow'>" +
        "<div><label class='label' for='bFrom'>Von</label><input class='field' id='bFrom' type='time' step='300'></div>" +
        "<div><label class='label' for='bTo'>Bis</label><input class='field' id='bTo' type='time' step='300'></div>" +
      "</div>" +
      "<div class='sheet__row' id='bGrobRow' hidden>" +
        "<span class='label'>Wann ungefähr?</span><div class='chipset' id='bTeil'></div>" +
        "<label class='label' style='margin-top:14px' for='bDauer'>Wie lange etwa?</label>" +
        "<div class='chipset' id='bDauer'></div>" +
      "</div>" +
      "<div class='sheet__row'><span class='label'>Wann?</span>" +
        "<label class='switch'><input type='checkbox' id='bRepeat'> Jede Woche wiederholen</label>" +
        "<div class='chipset' id='bDays' style='margin-top:12px'></div>" +
        "<div id='bDaysHint' style='font-size:12px;color:var(--text-faint);margin-top:8px'></div>" +
      "</div>" +
      (isNew ? "" :
      "<div class='sheet__row'><span class='label'>Stattgefunden?</span>" +
        "<label class='switch'><input type='checkbox' id='bDone'> Erledigt</label>" +
        "<div id='bDoneHint' style='font-size:12px;color:var(--text-faint);margin-top:8px;line-height:1.5'></div>" +
      "</div>");

    const title = s.querySelector("#bTitle");
    title.value = draft.title;
    const from = s.querySelector("#bFrom"); from.value = fmtTime(draft.start);
    const to = s.querySelector("#bTo"); to.value = fmtTime(draft.end);
    const rep = s.querySelector("#bRepeat"); rep.checked = draft.repeat === "weekly";

    // ---- Abhaken. Bei einer Serie gilt das Häkchen nur für diesen Tag.
    const doneBox = s.querySelector("#bDone");
    if (doneBox) {
      doneBox.checked = istErledigt(draft, hakenTag);
      const dh = s.querySelector("#bDoneHint");
      const malen = () => {
        const d = hakenTag ? new Date(hakenTag + "T12:00:00") : null;
        const tagText = d ? DAY_LONG[(d.getDay() + 6) % 7] + ", " + d.getDate() + "." + (d.getMonth() + 1) + "." : "diesen Tag";
        dh.textContent = draft.repeat === "weekly"
          ? "Gilt nur für " + tagText + " — die anderen Wochen bleiben unberührt."
          : (doneBox.checked ? "Zählt auf das Wochenziel als wirklich passiert." : "Hake ab, was stattgefunden hat — daraus wird dein Wochenrückblick.");
      };
      doneBox.onchange = malen;
      malen();
    }

    // ---- Genauigkeit: feste Uhrzeit oder grober Abschnitt
    let grob = !!draft.grob;
    let teil = ABSCHNITTE.some(x => x.id === draft.teil) ? draft.teil
             : abschnittFuer(draft.start);
    let dauer = draft.dauer || Math.max(30, draft.end - draft.start);

    const genauWrap = s.querySelector("#bGenau");
    const genauHint = s.querySelector("#bGenauHint");
    const zeitRow = s.querySelector("#bZeitRow");
    const grobRow = s.querySelector("#bGrobRow");
    const teilWrap = s.querySelector("#bTeil");
    const dauerWrap = s.querySelector("#bDauer");

    const paintGenau = () => {
      genauWrap.innerHTML = "";
      [[false, "Feste Uhrzeit"], [true, "Ungefähr"]].forEach(([wert, text]) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(grob === wert));
        c.textContent = text;
        c.onclick = () => {
          if (grob === wert) return;
          if (wert) { teil = abschnittFuer(parseTime(from.value)); dauer = Math.max(30, parseTime(to.value) - parseTime(from.value)); }
          else {
            const a = abschnittVon(teil);
            const st = clamp(Math.max(a.von, state.settings.dayStart * 60), 0, 1440 - dauer);
            from.value = fmtTime(st); to.value = fmtTime(st + dauer);
          }
          grob = wert;
          paintGenau(); paintTeil(); paintDauer();
        };
        genauWrap.appendChild(c);
      });
      zeitRow.hidden = grob;
      grobRow.hidden = !grob;
      genauHint.textContent = grob
        ? "Steht ohne Uhrzeit im Band unter dem Raster. Nichts kollidiert, nichts muss umgeplant werden."
        : "Liegt fest im Raster.";
    };

    const paintTeil = () => {
      teilWrap.innerHTML = "";
      ABSCHNITTE.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(teil === a.id));
        c.textContent = a.name.charAt(0).toUpperCase() + a.name.slice(1);
        c.onclick = () => { teil = a.id; paintTeil(); };
        teilWrap.appendChild(c);
      });
    };

    const paintDauer = () => {
      dauerWrap.innerHTML = "";
      [30, 60, 90, 120, 180].forEach(m => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(dauer === m));
        c.textContent = fmtDur(m);
        c.onclick = () => { dauer = m; paintDauer(); };
        dauerWrap.appendChild(c);
      });
    };
    paintGenau(); paintTeil(); paintDauer();

    // Bereiche
    const areaWrap = s.querySelector("#bAreas");
    const paintAreas = () => {
      areaWrap.innerHTML = "";
      state.areas.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.style.setProperty("--h", a.hue);
        c.setAttribute("aria-pressed", String(a.id === draft.areaId));
        c.innerHTML = "<span class='chip__dot'></span>";
        c.append(a.name);
        c.onclick = () => { draft.areaId = a.id; paintAreas(); paintOrtHint(); };
        areaWrap.appendChild(c);
      });
    };
    paintAreas();

    // Ort — daraus rechnet der Planer die Fahrzeit zum nächsten Block
    const ortHint = s.querySelector("#bOrtHint");
    const paintOrtHint = () => {
      const gewaehlt = draft.ortId || (areaById(draft.areaId).plan || {}).ortId || null;
      if (!gewaehlt || !(state.orte || []).length) {
        ortHint.textContent = (state.orte || []).length
          ? "Ohne Ort rechnet der Planer keine Fahrzeit."
          : "Sobald du zwei Orte angelegt hast, kannst du in den Einstellungen eintragen, wie lange du zwischen ihnen brauchst.";
        return;
      }
      const andere = (state.orte || []).filter(o => o.id !== gewaehlt)
        .map(o => o.name + " " + (weg(gewaehlt, o.id) || 0) + " min");
      ortHint.textContent = andere.length
        ? "Fahrzeit von hier: " + andere.join(" · ")
        : "Noch kein zweiter Ort angelegt.";
    };
    const repaintOrte = ortChips(s.querySelector("#bOrte"),
      () => draft.ortId, id => { draft.ortId = id; paintOrtHint(); });
    paintOrtHint();

    // Tage
    const dayWrap = s.querySelector("#bDays");
    const hint = s.querySelector("#bDaysHint");
    const paintDays = () => {
      dayWrap.innerHTML = "";
      for (let i = 0; i < 7; i++) {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(days.has(i)));
        c.textContent = DAY_SHORT[i];
        c.onclick = () => {
          if (days.has(i)) { if (days.size > 1) days.delete(i); }
          else { if (isNew) days.add(i); else { days.clear(); days.add(i); } }
          paintDays();
        };
        dayWrap.appendChild(c);
      }
      hint.textContent = rep.checked
        ? (isNew && days.size > 1 ? days.size + " Einträge, jede Woche — z.B. Arbeit von Mo bis Fr in einem Rutsch." : "Taucht in jeder Woche auf.")
        : "Nur in dieser Woche (" + [...days].map(i => DAY_SHORT[i]).join(", ") + ", " + addDays(mon, [...days][0]).getDate() + "." + (addDays(mon, [...days][0]).getMonth() + 1) + ".).";
    };
    rep.onchange = paintDays;
    paintDays();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    if (!isNew) {
      const del = document.createElement("button");
      del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Löschen";
      del.onclick = () => {
        const weg = () => {
          state.blocks = state.blocks.filter(x => x.id !== draft.id);
          save(); close(); renderAll(); toastUndo("Eintrag gelöscht");
        };
        // Eine Serie zu löschen trifft jede Woche, nicht nur die angezeigte.
        // Das passierte bisher ohne jede Nachfrage.
        if (draft.repeat === "weekly")
          // push: true — bei „Abbrechen" bleibt der halb ausgefüllte Editor
          // dahinter erhalten statt zu verschwinden.
          confirmSheet("Wöchentlicher Eintrag",
            "„" + (draft.title || "Ohne Titel") + "\" steht in jeder Woche. Löschen entfernt " +
            "ihn aus allen Wochen — auch aus den kommenden.",
            "Aus allen Wochen löschen", weg, { push: true });
        else weg();
      };
      foot.appendChild(del);

      // Verschieben gehörte bisher nur der Tagesform — dabei ist moveSheet()
      // die beste Verschiebefunktion der App. Kein neuer Verschiebe-Code,
      // nur ein zweiter Weg dorthin.
      const move = document.createElement("button");
      move.className = "btn"; move.type = "button"; move.textContent = "Verschieben";
      move.onclick = () => { close(); moveSheet(draft.id); };
      foot.appendChild(move);
    }
    const sp = document.createElement("span"); sp.className = "spacer"; foot.appendChild(sp);
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = isNew ? "Eintragen" : "Speichern";

    const commit = () => {
      let st = parseTime(from.value), en = parseTime(to.value);
      if (en <= st) en = st + 30;
      const weekly = rep.checked;
      const list = [...days];
      // Grobe Blöcke tragen ihre Dauer und den Abschnitt; start/end bleiben
      // nur als Anhaltspunkt gefüllt, damit Sortierungen weiter funktionieren.
      const grobFelder = () => grob
        ? { grob: true, teil, dauer, start: abschnittVon(teil).von, end: abschnittVon(teil).von + dauer }
        : { grob: false, teil: undefined, dauer: undefined, start: st, end: en };

      if (isNew) {
        list.forEach(d => state.blocks.push(Object.assign({
          id: uid(), title: title.value.trim() || "Ohne Titel", areaId: draft.areaId,
          day: d, date: iso(addDays(mon, d)), repeat: weekly ? "weekly" : "none",
          since: iso(addDays(mon, d)), ortId: draft.ortId || null,
          // Die Stern-Markierung kam aus dem Entwurf und wurde hier
          // stillschweigend wieder auf false gesetzt — je nach Weg blieb sie
          // erhalten oder nicht.
          frog: !!draft.frog
        }, grobFelder())));
      } else {
        const b = state.blocks.find(x => x.id === draft.id);
        b.title = title.value.trim() || "Ohne Titel";
        b.areaId = draft.areaId;
        b.day = list[0];
        b.date = iso(addDays(mon, list[0]));
        b.repeat = weekly ? "weekly" : "none";
        b.ortId = draft.ortId || null;
        if (weekly && !b.since) b.since = b.date;
        if (!weekly) delete b.since;
        Object.assign(b, grobFelder());
        if (!b.grob) { delete b.teil; delete b.dauer; }
        // Wer einen Vorschlag von Hand bearbeitet, hat ihn angenommen.
        // Sonst entsteht ein Vorschlag, den keine Aufräumfunktion mehr findet.
        delete b.sug;
        if (doneBox) setzeErledigt(b, hakenTag, doneBox.checked);
      }
      save(); close(); renderAll();
    };
    ok.onclick = commit;
    title.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
    foot.append(cancel, ok);
    s.appendChild(foot);
  });
}

/* ============================================================ Aufgaben */
let dragTaskId = null;

function renderTasks() {
  const list = $("#taskList");
  list.innerHTML = "";
  const open = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done);

  if (!state.tasks.length) {
    list.innerHTML = "<div class='empty'><b>Noch nichts notiert</b>Schreib oben rein, was ansteht. Aufgaben kannst du später einfach in den Wochenplan ziehen.</div>";
    return;
  }
  [...open, ...done].forEach(t => list.appendChild(taskEl(t)));
}

/* ============================================================
   Eine Aufgabenzeile

   Vorher hing an jeder Zeile ein Streifen aus vier winzigen Knöpfen: Bereich
   durchtippen, Stern, Kalender, Löschen. Am Telefon war davon einer gar nicht
   erreichbar — Löschen erschien nur beim Zeigen mit der Maus, und Zeigen gibt
   es dort nicht. Der Bereichsknopf schaltete pro Tipp einen Bereich weiter:
   sieben Tipps für den falschen Nachbarn.

   Jetzt hat die Zeile ein Häkchen, den Text und einen Punkt-Knopf. Alles
   andere steht im Blatt dahinter — mit Platz für richtige Trefferflächen und
   für Dinge, die vorher gar nicht gingen: den Titel ändern und sagen, wie
   lange die Aufgabe dauert.
   ============================================================ */

const TASK_DAUERN = [15, 30, 45, 60, 90, 120];

function taskEl(t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " is-done" : "");
  row.draggable = !t.done;

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "task__check"; cb.checked = t.done;
  cb.setAttribute("aria-label", "Erledigt: " + t.title);
  cb.onchange = () => { t.done = cb.checked; save(); renderTasks(); };

  const body = document.createElement("div");
  body.className = "task__body";

  const ti = document.createElement("div");
  ti.className = "task__title";
  if (t.frog) {
    const st = document.createElement("span");
    st.className = "task__star";
    st.title = "Das Wichtigste";
    ti.appendChild(st);
  }
  ti.append(t.title);

  const a = areaById(t.areaId);
  const meta = document.createElement("div");
  meta.className = "task__meta";
  meta.style.setProperty("--h", a.hue);
  meta.innerHTML = "<span class='chip__dot'></span>" + escapeHtml(a.name)
    + (t.dauer ? "<span class='task__dur num'>" + fmtDur(t.dauer) + "</span>" : "");

  body.append(ti, meta);

  const more = document.createElement("button");
  more.className = "task__more"; more.type = "button"; more.innerHTML = "···";
  more.title = "Bearbeiten";
  more.setAttribute("aria-label", "Aufgabe bearbeiten: " + t.title);
  more.onclick = e => { e.stopPropagation(); taskSheet(t); };

  row.append(cb, body, more);

  // Der Text selbst öffnet dasselbe Blatt — am Telefon zielt niemand gern
  // auf drei Punkte, wenn die ganze Zeile daneben liegt.
  body.onclick = () => taskSheet(t);

  row.addEventListener("dragstart", e => {
    dragTaskId = t.id; row.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "copy";
    try { e.dataTransfer.setData("text/plain", t.title); } catch (err) {}
  });
  row.addEventListener("dragend", () => { dragTaskId = null; row.classList.remove("is-dragging"); });
  return row;
}

function taskSheet(t) {
  modal((s, close) => {
    let areaId = t.areaId || state.areas[0].id;
    let dauer = t.dauer || 0;
    let wichtig = !!t.frog;

    s.innerHTML =
      "<h2 class='sheet__title'>Aufgabe</h2>" +
      "<div class='sheet__row'><label class='label' for='tkTitle'>Was ist zu tun?</label>" +
      "<input class='field' id='tkTitle' autocomplete='off'></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span>" +
      "<div class='chipset' id='tkAreas'></div></div>" +
      "<div class='sheet__row'><span class='label'>Wie lange dauert das?</span>" +
      "<div class='chipset' id='tkDauer'></div>" +
      "<div id='tkDauerHint' style='font-size:12px;color:var(--text-faint);margin-top:8px;line-height:1.5'></div></div>" +
      "<div class='sheet__row'><label class='switch'><input type='checkbox' id='tkFrog'> " +
      "Das Wichtigste — zuerst dran</label></div>";

    const titel = s.querySelector("#tkTitle");
    titel.value = t.title;

    const areaWrap = s.querySelector("#tkAreas");
    const malAreas = () => {
      areaWrap.innerHTML = "";
      state.areas.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.style.setProperty("--h", a.hue);
        c.setAttribute("aria-pressed", String(a.id === areaId));
        c.innerHTML = "<span class='chip__dot'></span>";
        c.append(a.name);
        c.onclick = () => { areaId = a.id; malAreas(); };
        areaWrap.appendChild(c);
      });
    };
    malAreas();

    const dWrap = s.querySelector("#tkDauer");
    const dHint = s.querySelector("#tkDauerHint");
    const malDauer = () => {
      dWrap.innerHTML = "";
      const keine = document.createElement("button");
      keine.type = "button"; keine.className = "chip";
      keine.textContent = "weiß nicht";
      keine.setAttribute("aria-pressed", String(!dauer));
      keine.onclick = () => { dauer = 0; malDauer(); };
      dWrap.appendChild(keine);
      TASK_DAUERN.forEach(m => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip num";
        c.textContent = fmtDur(m);
        c.setAttribute("aria-pressed", String(dauer === m));
        c.onclick = () => { dauer = m; malDauer(); };
        dWrap.appendChild(c);
      });
      dHint.textContent = dauer
        ? "„In den Wochenplan legen\" nimmt " + fmtDur(dauer) + " statt einer Stunde."
        : "Ohne Angabe wird beim Einplanen eine Stunde angenommen.";
    };
    malDauer();

    const frogBox = s.querySelector("#tkFrog");
    frogBox.checked = wichtig;
    frogBox.onchange = () => { wichtig = frogBox.checked; };

    const inPlan = document.createElement("button");
    inPlan.className = "btn"; inPlan.type = "button";
    inPlan.style.width = "100%";
    inPlan.textContent = "📅 In den Wochenplan legen";
    inPlan.onclick = () => {
      uebernehmen();
      const d = addDays(mondayOf(anchor), selectedDayIdx);
      const laenge = dauer || 60;
      const start = clamp(snap(new Date().getHours() * 60 + 60),
        state.settings.dayStart * 60, state.settings.dayEnd * 60 - laenge);
      close();
      blockSheet({
        id: null, title: titel.value.trim() || t.title, areaId,
        day: selectedDayIdx, date: iso(d), repeat: "none",
        start, end: start + laenge, frog: wichtig
      }, iso(d));
    };
    s.appendChild(inPlan);

    function uebernehmen() {
      const neu = titel.value.trim();
      if (neu) t.title = neu;
      t.areaId = areaId;
      if (dauer) t.dauer = dauer; else delete t.dauer;
      if (wichtig && !t.frog) state.tasks.forEach(x => x.frog = false);
      t.frog = wichtig;
      save();
    }

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const del = document.createElement("button");
    del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Löschen";
    del.onclick = () => {
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      save(); close(); renderTasks(); renderEnergy(); toastUndo("Aufgabe gelöscht");
    };
    const sp = document.createElement("span"); sp.className = "spacer";
    const ab = document.createElement("button");
    ab.className = "btn"; ab.type = "button"; ab.textContent = "Abbrechen";
    ab.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Speichern";
    ok.onclick = () => { uebernehmen(); close(); renderTasks(); renderEnergy(); };
    titel.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok.onclick(); } };
    foot.append(del, sp, ab, ok);
    s.appendChild(foot);
  });
}

$("#taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#taskInput");
  const v = inp.value.trim();
  if (!v) return;
  state.tasks.unshift({ id: uid(), title: v, areaId: state.areas[0].id, done: false, frog: false });
  inp.value = "";

});
$("#goalsEdit").onclick = goalsSheet;

$("#clearDone").onclick = () => {
  const n = state.tasks.filter(t => t.done).length;
  if (!n) { toast("Nichts zu räumen"); return; }

};

/* ============================================================ Tagesform */
const ENERGY = {
  low:  { text: "<b>Wenig Energie.</b> Dann muss nicht alles heute sein. Der Planer zeigt dir unten, was an diesem Tag optional ist — streichen oder verschieben ist auch eine Entscheidung." },
  mid:  { text: "<b>Normal.</b> Das Wichtigste zuerst, der Rest ergibt sich. Pausen nimmst du, wenn du sie brauchst — nicht, wenn ein Timer klingelt." },
  high: { text: "<b>Viel Energie.</b> Guter Tag für das, was sonst liegen bleibt. Nimm es dir jetzt, bevor der Tag es frisst." },
  none: { text: "Wie fühlst du dich heute? An einem schwachen Tag zeigt der Planer, was heute nicht sein muss — an einem starken bleibt er still." }
};

function currentDayIso() { return iso(addDays(mondayOf(anchor), selectedDayIdx)); }

/* ============================================================
   Agenda (Stufe 4) — erstes Kind der Karte data-card="heute" (Markup
   ~1173). Läuft VOR renderEnergy(), das direkt danach dieselbe Karte
   weiterschreibt (#energyDay, #energyHint, #dayFrei, #dayFreiLab) — beide
   fassen nur ihre eigenen Knoten an, keiner ersetzt die Karte.

   Ladezustand: solange Sync.boot() (ganz unten) noch nicht durch ist, zeigt
   die Karte die Schraffur statt eines Standes, der gleich stillschweigend
   getauscht werden könnte — auf einem Zweitgerät sähe das sonst aus wie
   Datenverlust. */
function renderAgenda() {
  const box = $("#agenda");
  if (!box) return;

  if (!syncSettled) {
    box.innerHTML = "<div class='agenda__loading' aria-hidden='true'></div>";
    return;
  }

  const dayKey = currentDayIso();
  const dayIdx = selectedDayIdx;
  const heute = dayKey === iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  const wichtig = state.tasks.find(t => t.frog && !t.done);
  let html = "<div class='agenda__label'>Heute zählt</div>"
    + "<button type='button' class='agenda__frog' id='agendaFrog'>"
    + (wichtig ? escapeHtml(wichtig.title) : "—  antippen") + "</button>";

  const eintraege = tagesAgenda(dayKey, dayIdx);
  const laufend = heute
    ? eintraege.find(e => !e.grob && e.block.start <= jetzt && jetzt < e.block.end)
    : null;
  const danach = eintraege.filter(e => {
    if (e === laufend) return false;
    if (!heute) return true;
    return e.grob ? abschnittVon(e.block.teil).bis > jetzt : e.block.start > jetzt;
  });

  if (!laufend && !danach.length) {
    html += "<div class='empty'><b>" + (eintraege.length ? "Nichts mehr offen" : "Noch nichts geplant") + "</b>"
      + (eintraege.length ? "Für den Rest des Tages steht nichts mehr an." : "Für diesen Tag steht noch nichts im Plan.")
      + "</div><button type='button' class='btn btn--primary btn--sm' id='agendaVorschlag'>Vorschlagen</button>";
  } else {
    if (laufend) {
      const a = areaById(laufend.block.areaId);
      const rest = laufend.block.end - jetzt;
      html += "<div class='agenda__hero' style='--h:" + a.hue + "'>"
        + "<div class='agenda__hero-status'><span>" + escapeHtml(a.name) + "</span><span class='tag'>läuft</span></div>"
        + "<div class='agenda__hero-title'>" + escapeHtml(laufend.block.title || a.name) + "</div>"
        + "<div class='agenda__hero-sub'>noch " + fmtDur(rest) + "</div>"
        + "</div>";
    }

    if (danach.length) {
      html += "<div class='agenda__label'>Danach</div><div class='agenda__list'>";
      // Woher kommt man? Ohne laufenden Eintrag wird der Heimatort
      // angenommen — sonst gäbe es beim ersten Eintrag nie eine Wegzeit.
      let vorherOrt = laufend ? ortOf(laufend.block) : (state.settings.heimOrt || null);
      danach.forEach(e => {
        const b = e.block, a = areaById(b.areaId);
        const fertig = istErledigt(b, dayKey);
        let zeit, sub = "";
        if (e.grob) {
          zeit = abschnittVon(b.teil).name + " ~" + fmtDur(b.dauer);
        } else {
          zeit = fmtTime(b.start);
          const ortId = ortOf(b);
          const ortNaam = ortId ? ortName(ortId) : "";
          if (ortNaam) {
            const fahrt = weg(vorherOrt, ortId);
            sub = escapeHtml(ortNaam) + (fahrt > 0 ? " · " + fahrt + " min Weg" : "");
          }
          vorherOrt = ortId || vorherOrt;
        }
        html += "<label class='agenda__row" + (e.grob ? " agenda__row--grob" : "") + (fertig ? " is-on" : "")
          + "' style='--h:" + a.hue + "'>"
          + "<input type='checkbox' class='agenda__check' data-id='" + b.id + "'" + (fertig ? " checked" : "") + ">"
          + "<span class='agenda__body'><span class='agenda__line'>"
          + "<span class='agenda__title'>" + escapeHtml(b.title || a.name) + "</span>"
          + "<span class='agenda__time num'>" + zeit + "</span></span>"
          + (sub ? "<span class='agenda__sub'>" + sub + "</span>" : "")
          + "</span></label>";
      });
      html += "</div>";
    }

    const frei = freieZeitDanach(dayKey, dayIdx);
    if (frei && frei.total >= 15) {
      html += "<div class='agenda__foot'>Danach frei · längster Block " + fmtDur(frei.longest) + "</div>";
    }
  }

  box.innerHTML = html;

  $("#agendaFrog").onclick = () => { if (wichtig) taskSheet(wichtig); else setView("aufgaben"); };
  const vorschlagBtn = $("#agendaVorschlag");
  if (vorschlagBtn) vorschlagBtn.onclick = () => {
    const r = buildSuggestions();
    save(); renderAll();
    if (!r.placed) toast("Kein Platz gefunden — Zeitfenster erweitern?");
    else toast("Vorschlag steht — schau, ob's dir passt");
  };
  box.querySelectorAll(".agenda__check").forEach(cb => {
    cb.onchange = () => {
      const b = state.blocks.find(x => x.id === cb.dataset.id);
      if (!b) return;
      setzeErledigt(b, dayKey, cb.checked);
      const lab = cb.closest(".agenda__row");
      if (lab) lab.classList.toggle("is-on", cb.checked);
      save();
    };
  });

  // Verschieben aus der Agenda — ohne die Zeile mit einem eigenen Knopf
  // zuzustellen. Langes Drücken spricht dieselbe Sprache wie das Anlegen
  // im Raster (holdToCreate, HOLD_TIME). Der Haken bleibt unberührt: wer
  // ihn trifft, will abhaken, nicht verschieben.
  box.querySelectorAll(".agenda__row").forEach(row => {
    const id = row.querySelector(".agenda__check").dataset.id;
    row.title = "Lange drücken zum Verschieben";
    let timer = null, longPressed = false, move = null;
    const cancel = () => {
      clearTimeout(timer);
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", cancel);
      document.removeEventListener("pointercancel", cancel);
    };
    row.addEventListener("pointerdown", e => {
      if (e.target.closest(".agenda__check")) return;
      // Neuer Versuch, alte Sperre ist Vergangenheit — moveSheet() legt
      // sich beim letzten Mal über die Zeile, sodass der Klick, der die
      // Sperre unten wieder aufhebt, sie nie erreicht hat. Ohne dieses
      // Zurücksetzen bliebe ein ganz normaler Tipp danach fälschlich
      // gesperrt.
      longPressed = false;
      const x0 = e.clientX, y0 = e.clientY;
      move = ev => {
        if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) cancel();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", cancel);
      document.addEventListener("pointercancel", cancel);
      timer = setTimeout(() => {
        cancel();
        longPressed = true;
        if (navigator.vibrate) navigator.vibrate(12);
        const b = state.blocks.find(x => x.id === id);
        if (b) moveSheet(b.id);
      }, HOLD_TIME);
    });
    // Der Klick, der nach dem Loslassen folgt, würde sonst als Label-Klick
    // den Haken umschalten — genau das soll nach einem langen Druck nicht
    // mehr passieren.
    row.addEventListener("click", e => {
      if (longPressed) { e.preventDefault(); longPressed = false; }
    });
  });
}

function renderEnergy() {
  const key = currentDayIso();
  const meta = state.days[key] || {};
  const lvl = meta.energy;
  document.querySelectorAll(".energy__opt").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lvl === lvl));
  });
  const d = addDays(mondayOf(anchor), selectedDayIdx);
  $("#energyDay").textContent = DAY_LONG[selectedDayIdx] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ".";
  const wichtig = state.tasks.find(t => t.frog && !t.done);
  let html = ENERGY[lvl || "none"].text;
  if (wichtig) html += "<br><br><b>Das Wichtigste:</b> " + escapeHtml(wichtig.title);
  $("#energyHint").innerHTML = html;
  renderEnergyAction();

  const freiBox = $("#dayFrei");
  freiBox.checked = istFrei(key);
  $("#dayFreiLab").textContent = freiBox.checked
    ? "Dieser Tag bleibt frei" : "Diesen Tag freihalten";
}
/* ============================================================
   Was kann heute weg?

   Der Tagesform-Schalter hat lange nur den Timer gestellt — er sah aus
   wie ein Regler, der den Plan anpasst, war aber keiner. Das hier ist
   der fehlende Hebel: an einem schwachen Tag zeigt der Planer, was heute
   nicht sein muss, und bietet an, es zu streichen oder zu verschieben.

   Was „muss" ist, entscheidet der Bereich (plan.must) — im Zweifel gilt
   Pflicht, damit nie etwas zum Streichen vorgeschlagen wird, das wichtig war.
   ============================================================ */

function optionalToday() {
  const key = currentDayIso();
  const idx = selectedDayIdx;
  return state.blocks.filter(b => {
    if (b.sug) return false;
    const hier = b.repeat === "weekly" ? b.day === idx : b.date === key;
    if (!hier) return false;
    const area = areaById(b.areaId);
    return !(area.plan && area.plan.must);
  }).sort((a, b) => a.start - b.start);
}

function renderEnergyAction() {
  const box = $("#energyAct");
  if (!box) return;
  box.innerHTML = "";
  const lvl = (state.days[currentDayIso()] || {}).energy;
  if (lvl !== "low") return;

  const weg = optionalToday();
  if (!weg.length) return;

  const b = document.createElement("button");
  b.className = "btn btn--sm";
  b.style.marginTop = "12px";
  b.style.width = "100%";
  b.textContent = (iso(addDays(mondayOf(anchor), selectedDayIdx)) === iso(new Date())
    ? "Was kann heute weg? (" : "Was kann an dem Tag weg? (") + weg.length + ")";
  b.onclick = relieveSheet;
  box.appendChild(b);
}

function relieveSheet() {
  modal((s, close) => {
    // Beim Vorausplanen stand hier "heute" über einem Tag in zehn Tagen.
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const heute = iso(d) === iso(new Date());
    const tag = DAY_LONG[selectedDayIdx] + (heute ? "" : ", " + d.getDate() + "." + (d.getMonth() + 1) + ".");
    s.innerHTML =
      "<h2 class='sheet__title'>Was kann " + (heute ? "heute" : "am " + tag) + " weg?</h2>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:14px;line-height:1.6'>" +
      "Wenig Energie am " + tag + ". Das hier ist nicht als Pflicht markiert — " +
      "du kannst es streichen oder auf einen anderen Tag schieben. " +
      "Was du stehen lässt, bleibt einfach im Plan.</p>" +
      "<div class='relief' id='reliefList'></div>";

    const list = s.querySelector("#reliefList");

    const paint = () => {
      const weg = optionalToday();
      list.innerHTML = "";
      if (!weg.length) {
        list.innerHTML = "<div class='empty'><b>Nichts mehr offen</b>" +
          "Alles andere an diesem Tag ist als Pflicht markiert.</div>";
        return;
      }
      weg.forEach(blk => {
        const area = areaById(blk.areaId);
        const row = document.createElement("div");
        row.className = "reliefrow";
        row.style.setProperty("--h", area.hue);
        row.innerHTML =
          "<div class='reliefrow__txt'>" +
            "<div class='reliefrow__title'><span class='goal__dot'></span>" + escapeHtml(blk.title) + "</div>" +
            "<div class='reliefrow__time num'>" + fmtTime(blk.start) + "–" + fmtTime(blk.end) +
            (blk.title === area.name ? "" : " · " + escapeHtml(area.name)) + "</div>" +
          "</div>";

        const move = document.createElement("button");
        move.className = "btn btn--sm"; move.type = "button"; move.textContent = "Verschieben";
        move.onclick = () => { close(); moveSheet(blk.id); };

        const del = document.createElement("button");
        del.className = "btn btn--sm btn--danger"; del.type = "button"; del.textContent = "Streichen";
        del.onclick = () => {
          state.blocks = state.blocks.filter(x => x.id !== blk.id);
          save(); renderAll(); paint();
          toastUndo("Gestrichen");
        };

        row.append(move, del);
        list.appendChild(row);
      });
    };
    paint();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Fertig";
    ok.onclick = close;
    foot.appendChild(ok);
    s.appendChild(foot);
  }, { wide: true });
}

/* Einen Block auf einen anderen Tag schieben — sucht dort die nächste
   freie Stelle, statt ihn blind auf dieselbe Uhrzeit zu setzen. */
function moveSheet(id) {
  const blk = state.blocks.find(x => x.id === id);
  if (!blk) return;
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Verschieben</h2>" +
      "<p style='margin:0 0 6px;font-size:15px'><b>" + escapeHtml(blk.title) + "</b></p>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:14px'>" +
      "Dauer " + fmtDur(blk.end - blk.start) + " · auf welchen Tag?</p>" +
      "<div class='chipset' id='mvDays'></div>" +
      "<div id='mvHint' style='font-size:13px;color:var(--text-faint);margin-top:14px;min-height:18px'></div>";

    const wrap = s.querySelector("#mvDays");
    const hint = s.querySelector("#mvHint");
    const laenge = blk.end - blk.start;
    const heuteKey = iso(new Date());

    weekDays().forEach(day => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.textContent = DAY_SHORT[day.i];
      const vergangen = day.key < heuteKey;
      const selbst = (blk.repeat === "weekly" ? blk.day === day.i : blk.date === day.key);
      c.disabled = vergangen || selbst;
      if (c.disabled) c.style.opacity = ".4";
      c.onclick = () => {
        const passende = freeGaps(day, { from: null, to: null, days: [day.i] }, areaById(blk.areaId))
          .filter(g => g.end - g.start >= laenge);
        if (!passende.length) { hint.textContent = "Am " + DAY_LONG[day.i] + " ist kein Platz von " + fmtDur(laenge) + " frei."; return; }

        // Die Stelle nehmen, die der bisherigen Uhrzeit am nächsten liegt.
        // Vorher war es immer die früheste — der Serienabend landete dadurch
        // um sieben Uhr morgens.
        let ziel = null;
        passende.forEach(g => {
          const st = clamp(blk.start, g.start, g.end - laenge);
          const d = Math.abs(st - blk.start);
          if (!ziel || d < ziel.d) ziel = { st, d };
        });

        const schieben = () => {
          blk.repeat = "none";
          delete blk.since;
          blk.day = day.i;
          blk.date = day.key;
          blk.start = ziel.st;
          blk.end = ziel.st + laenge;
          save(); close(); renderAll();
          toast("Auf " + DAY_LONG[day.i] + ", " + fmtTime(blk.start) + " geschoben");
        };

        // Eine Serie zu verschieben hat sie bisher stillschweigend in einen
        // einzelnen Termin verwandelt — also von jedem Montag gelöscht.
        if (blk.repeat === "weekly")
          // push: true — bei „Abbrechen" bleibt die Tagesauswahl dahinter
          // erhalten statt zu verschwinden.
          confirmSheet("Wöchentlicher Eintrag",
            "„" + (blk.title || "Ohne Titel") + "\" steht bisher in jeder Woche. Verschieben " +
            "macht daraus einen einzelnen Termin — aus den anderen Wochen verschwindet er.",
            "Trotzdem verschieben", schieben, { push: true });
        else schieben();
      };
      wrap.appendChild(c);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    foot.appendChild(cancel);
    s.appendChild(foot);
  });
}

/* Das einfache Anführungszeichen muss mit maskiert werden: an mehreren Stellen
   landet Nutzertext in einfach gequoteten Attributen (aria-label). Ohne die
   Maskierung kann ein Bereichsname aus dem Attribut ausbrechen und eigenen Code
   mitbringen — der über den Abgleich auch auf dem zweiten Gerät läuft. */
function escapeHtml(s) {
  return String(s).replace(/[&<>"'`]/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;"
  }[c]));
}

/* Freihalten heißt: der Verteiler lässt den Tag aus. Was schon drinsteht,
   bleibt stehen — sonst wäre es Löschen mit anderem Namen. */
$("#dayFrei").onchange = () => {
  const key = currentDayIso();
  const an = $("#dayFrei").checked;
  if (an) dayMeta(key).frei = true; else if (state.days[key]) delete state.days[key].frei;
  if (an) {
    // Ein Vorschlag an einem freien Tag hat seine Erlaubnis verloren
    const vorher = state.blocks.length;
    state.blocks = state.blocks.filter(b => !(b.sug && onDay(b, key, selectedDayIdx)));
    toast(state.blocks.length < vorher
      ? "Tag freigehalten — Vorschläge hier zurückgenommen" : "Tag freigehalten");
  } else toast("Tag wieder verplanbar");
  save(); renderAll();
};

document.querySelectorAll(".energy__opt").forEach(btn => {
  btn.onclick = () => {
    const key = currentDayIso();
    const meta = dayMeta(key);
    meta.energy = meta.energy === btn.dataset.lvl ? null : btn.dataset.lvl;
    save(); renderEnergy(); renderGrid(); renderDaySwitch();
  };
});

/* ============================================================
   Der Wochenstart

   Zehn Minuten, drei Schritte: Was ist letzte Woche wirklich passiert? →
   Was nimmst du dir für diese vor? → Verteilen.

   Der Wochenbeginn ist der wirksamste wiederkehrende Neuanfang, den ein
   Kalender hat — deshalb bekommt er hier einen eigenen Ort statt nur eine
   Spalte weiter links zu sein. Angeboten wird er am Sonntagabend und am
   Wochenanfang; danach schweigt er, statt jeden Tag zu erinnern.
   ============================================================ */

function ritualKey() { return iso(mondayOf(anchor)); }
function ritualErledigt() { return !!state.rituale[ritualKey()]; }

/* Ist jetzt die Zeit dafür? Sonntag ab 16 Uhr zählt schon zur neuen Woche. */
function ritualFaellig() {
  if (!istDieseWoche() || ritualErledigt()) return false;
  const jetzt = new Date();
  const wt = (jetzt.getDay() + 6) % 7;          // 0 = Montag
  if (wt === 6 && jetzt.getHours() >= 16) return true;
  return wt <= 1;
}

function renderRitual() {
  const card = $("#ritualCard");
  if (!card) return;
  if (!ritualFaellig()) { card.hidden = true; return; }
  card.hidden = false;
  const mon = mondayOf(anchor);
  const offen = wocheEintraege(addDays(mon, -7)).filter(x => !istErledigt(x.b, x.key)).length;
  card.innerHTML =
    "<div class='ritual__head'>Neue Woche</div>" +
    "<p class='ritual__txt'>Zehn Minuten, drei Schritte: Was ist letzte Woche gelaufen, " +
    "was nimmst du dir vor, wie verteilt es sich." +
    (offen ? " <b>" + offen + "</b> Einträge aus der letzten Woche sind noch nicht abgehakt." : "") +
    "</p>";
  const los = document.createElement("button");
  los.className = "btn btn--primary btn--sm";
  los.textContent = "Wochenstart";
  los.onclick = ritualSheet;
  const spaeter = document.createElement("button");
  spaeter.className = "btn btn--sm btn--ghost";
  spaeter.textContent = "Nicht jetzt";
  spaeter.onclick = () => { card.hidden = true; };
  const row = document.createElement("div");
  row.className = "ritual__foot";
  row.append(los, spaeter);
  card.appendChild(row);
}

function ritualSheet() {
  let schritt = 0;
  const mon = mondayOf(anchor);
  const vorwoche = addDays(mon, -7);

  modal((s, close) => {
    const body = document.createElement("div");
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    s.append(body, foot);

    const TITEL = ["Was ist gelaufen?", "Was nimmst du dir vor?", "Und wann?"];

    const malen = () => {
      body.innerHTML =
        "<div class='steps'>" + [0, 1, 2].map(i =>
          "<span class='steps__dot" + (i === schritt ? " is-on" : "") + "'></span>").join("") +
        "<span class='steps__lab'>Schritt " + (schritt + 1) + " von 3</span></div>" +
        "<h2 class='sheet__title'>" + TITEL[schritt] + "</h2>";
      const box = document.createElement("div");
      body.appendChild(box);
      [schrittRueckblick, schrittZiele, schrittVerteilen][schritt](box);
      malenFoot();
    };

    /* --- Schritt 1: die letzte Woche abhaken --------------------------- */
    function schrittRueckblick(box) {
      const eintraege = wocheEintraege(vorwoche);
      if (!eintraege.length) {
        box.innerHTML = "<div class='empty'><b>Die letzte Woche ist leer</b>" +
          "Dann fängst du hier an — beim nächsten Wochenstart gibt es was zum Abhaken.</div>";
        return;
      }
      const lead = document.createElement("p");
      lead.className = "ritual__lead";
      lead.textContent = "Hake ab, was wirklich stattgefunden hat. Das ist keine Note — es ist die Grundlage für Ziele, die aufgehen.";
      box.appendChild(lead);

      const kopf = document.createElement("div");
      kopf.className = "hakenkopf";
      const sumEl = document.createElement("div");
      sumEl.className = "hakenkopf__sum";
      const alle = document.createElement("button");
      alle.className = "btn btn--sm";
      alle.type = "button";
      kopf.append(sumEl, alle);
      box.appendChild(kopf);

      const liste = document.createElement("div");
      liste.className = "hakenliste";
      box.appendChild(liste);

      const summe = () => {
        const ab = eintraege.filter(x => istErledigt(x.b, x.key));
        const min = ab.reduce((n, x) => n + dauerVon(x.b), 0);
        const ges = eintraege.reduce((n, x) => n + dauerVon(x.b), 0);
        sumEl.innerHTML = "<b>" + fmtDur(min) + "</b> von " + fmtDur(ges) + " geplant · " +
          ab.length + " von " + eintraege.length + " Einträgen";
        const allesAb = ab.length === eintraege.length;
        alle.textContent = allesAb ? "Alle abwählen" : "Alle abhaken";
        alle.onclick = () => {
          eintraege.forEach(x => setzeErledigt(x.b, x.key, !allesAb));
          save(); malen();
        };
      };

      let letzterTag = -1;
      eintraege.forEach(x => {
        if (x.i !== letzterTag) {
          letzterTag = x.i;
          const h = document.createElement("div");
          h.className = "hakenliste__tag";
          const d = addDays(vorwoche, x.i);
          h.textContent = DAY_LONG[x.i] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ".";
          liste.appendChild(h);
        }
        const area = areaById(x.b.areaId);
        const lab = document.createElement("label");
        lab.className = "hakenrow";
        lab.style.setProperty("--h", area.hue);
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = istErledigt(x.b, x.key);
        cb.onchange = () => {
          setzeErledigt(x.b, x.key, cb.checked);
          lab.classList.toggle("is-on", cb.checked);
          save(); summe();
        };
        lab.classList.toggle("is-on", cb.checked);
        const txt = document.createElement("span");
        txt.className = "hakenrow__txt";
        txt.innerHTML = "<span class='goal__dot'></span>" + escapeHtml(x.b.title || "Ohne Titel") +
          "<span class='hakenrow__zeit num'>" +
          (x.b.grob ? abschnittVon(x.b.teil).name + " · " + fmtDur(x.b.dauer)
                    : fmtTime(x.b.start) + "–" + fmtTime(x.b.end)) + "</span>";
        lab.append(cb, txt);
        liste.appendChild(lab);
      });

      summe();
    }

    /* --- Schritt 2: Ziele für die neue Woche --------------------------- */
    function schrittZiele(box) {
      const lead = document.createElement("p");
      lead.className = "ritual__lead";
      lead.innerHTML = "Was letzte Woche stattgefunden hat, steht in Klammern. " +
        "Ein Ziel, das drei Wochen nicht aufging, war kein Ziel, sondern ein Wunsch.";
      box.appendChild(lead);

      const liste = document.createElement("div");
      liste.className = "zieleliste";
      box.appendChild(liste);

      const zeichnen = () => {
        liste.innerHTML = "";
        state.areas.forEach(a => {
          const ist = istVorwoche(a.id, vorwoche);
          const row = document.createElement("div");
          row.className = "zielrow" + (a.plan.goal > 0 ? " is-on" : "");
          row.style.setProperty("--h", a.hue);
          const name = document.createElement("div");
          name.className = "zielrow__name";
          name.innerHTML = "<span class='goal__dot'></span>" + escapeHtml(a.name) +
            (ist > 0 ? " <span class='zielrow__ist'>(" + fmtDur(ist) + " gelaufen)</span>" : "");
          const stepper = document.createElement("div");
          stepper.className = "stepper";
          const minus = document.createElement("button");
          minus.type = "button"; minus.className = "btn btn--sm"; minus.textContent = "−";
          minus.setAttribute("aria-label", a.name + ": eine Stunde weniger");
          minus.onclick = () => { a.plan.goal = Math.max(0, (a.plan.goal || 0) - 1); save(); zeichnen(); };
          const wert = document.createElement("span");
          wert.className = "stepper__val num";
          wert.textContent = a.plan.goal > 0 ? a.plan.goal + " h" : "—";
          const plus = document.createElement("button");
          plus.type = "button"; plus.className = "btn btn--sm"; plus.textContent = "+";
          plus.setAttribute("aria-label", a.name + ": eine Stunde mehr");
          plus.onclick = () => { a.plan.goal = Math.min(80, (a.plan.goal || 0) + 1); save(); zeichnen(); };
          stepper.append(minus, wert, plus);
          row.append(name, stepper);
          liste.appendChild(row);
        });
        const amp = document.createElement("div");
        amp.style.marginTop = "16px";
        ampelZeichnen(amp);
        liste.appendChild(amp);
      };
      zeichnen();
    }

    /* --- Schritt 3: verteilen ----------------------------------------- */
    function schrittVerteilen(box) {
      const zeichnen = () => {
        box.innerHTML = "";
        const lead = document.createElement("p");
        lead.className = "ritual__lead";
        const offen = state.areas.reduce((n, a) => {
          if (!(a.plan.goal > 0)) return n;
          return n + Math.max(0, a.plan.goal * 60 - areaMinutes(a.id, false) - areaMinutes(a.id, true));
        }, 0);
        if (hasSuggestions()) {
          lead.innerHTML = "Der Vorschlag steht im Plan. Schau ihn dir an — was nicht passt, " +
            "verschiebst du oder wirfst du raus.";
        } else if (offen >= 15) {
          lead.innerHTML = "<b>" + fmtDur(offen) + "</b> aus deinen Wochenzielen haben noch " +
            "keinen Platz. Der Planer sucht ihn — annehmen musst du selbst.";
        } else {
          lead.innerHTML = "Deine Ziele stehen schon im Plan. Nichts mehr zu verteilen.";
        }
        box.appendChild(lead);

        if (!hasSuggestions() && offen >= 15) {
          const b = document.createElement("button");
          b.className = "btn btn--primary";
          b.type = "button";
          b.textContent = "Verteilen";
          b.onclick = () => {
            const r = buildSuggestions();
            save(); renderAll(); zeichnen();
            if (!r.placed) toast("Kein Platz gefunden — Zeitfenster erweitern?");
          };
          box.appendChild(b);
        }
        if (hasSuggestions()) {
          const ok = document.createElement("button");
          ok.className = "btn btn--primary"; ok.type = "button";
          ok.textContent = "Alle übernehmen";
          ok.onclick = () => { acceptSuggestions(); save(); renderAll(); zeichnen(); };
          const no = document.createElement("button");
          no.className = "btn"; no.type = "button";
          no.style.marginLeft = "8px";
          no.textContent = "Verwerfen";
          no.onclick = () => { clearSuggestions(); save(); renderAll(); zeichnen(); };
          const row = document.createElement("div");
          row.append(ok, no);
          box.appendChild(row);
        }
      };
      zeichnen();
    }

    /* --- Fußzeile ------------------------------------------------------ */
    function malenFoot() {
      foot.innerHTML = "";
      if (schritt > 0) {
        const z = document.createElement("button");
        z.className = "btn"; z.type = "button"; z.textContent = "Zurück";
        z.onclick = () => { schritt--; malen(); };
        foot.appendChild(z);
      }
      const sp = document.createElement("span"); sp.className = "spacer";
      foot.appendChild(sp);
      const w = document.createElement("button");
      w.className = "btn btn--primary"; w.type = "button";
      w.textContent = schritt < 2 ? "Weiter" : "Fertig";
      w.onclick = () => {
        if (schritt < 2) { schritt++; malen(); return; }
        state.rituale[ritualKey()] = Date.now();
        save(); close(); renderAll();
        toast("Wochenstart erledigt — gute Woche.");
      };
      foot.appendChild(w);
    }

    malen();
  }, { wide: true });
}

/* Ist-Stunden einer vergangenen Woche, für den Vergleich im Schritt 2. */
function istVorwoche(areaId, mon) {
  let sum = 0;
  [0, 1, 2, 3, 4, 5, 6].forEach(i => {
    const key = iso(addDays(mon, i));
    state.blocks.forEach(b => {
      if (b.areaId !== areaId || b.sug) return;
      if (onDay(b, key, i) && istErledigt(b, key)) sum += dauerVon(b);
    });
  });
  return sum;
}
