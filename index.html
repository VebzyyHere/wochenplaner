/* ============================================================
   Design Tokens
   Waldgrün markiert Aktionen und Auswahl, die Bereichsfarben den Inhalt.
   Helle Salbeiflächen geben Orientierung, ohne mit dem Wochenraster zu konkurrieren.
   ============================================================ */
:root {
  color-scheme: light dark;
  -webkit-text-size-adjust: 100%;   /* iOS blaeht Text im Querformat sonst auf */

  --h-ink: 155;

  --bg:         oklch(0.977 0.007 var(--h-ink));
  --surface:    oklch(1 0 0);
  --surface-2:  oklch(0.965 0.008 var(--h-ink));
  --surface-3:  oklch(0.935 0.006 var(--h-ink));
  --border:     oklch(0.90 0.006 var(--h-ink));
  --border-strong: oklch(0.82 0.008 var(--h-ink));
  --text:       oklch(0.24 0.015 var(--h-ink));
  --text-muted: oklch(0.44 0.012 var(--h-ink));
  --text-faint: oklch(0.50 0.010 var(--h-ink));

  --ink:        oklch(0.40 0.085 var(--h-ink));
  --ink-hover:  oklch(0.34 0.075 var(--h-ink));
  --ink-active: oklch(0.29 0.065 var(--h-ink));
  --focus:      oklch(0.48 0.120 var(--h-ink));
  --selected:   oklch(0.935 0.027 var(--h-ink));
  --selected-text: oklch(0.35 0.070 var(--h-ink));
  --sicht-hoehe: 100dvh;
  --sicht-oben: 0px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  --danger:  oklch(0.55 0.190 25);
  --success: oklch(0.55 0.140 150);
  --warn:    oklch(0.66 0.150 75);

  --on-ink:    var(--surface);
  --on-danger: var(--surface);

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-12:48px;

  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow-1: 0 1px 2px oklch(0.2 0.02 var(--h-ink) / 0.08);
  --shadow-2: 0 6px 20px oklch(0.2 0.02 var(--h-ink) / 0.14), 0 1px 3px oklch(0.2 0.02 var(--h-ink) / 0.08);
  --shadow-3: 0 16px 48px oklch(0.2 0.02 var(--h-ink) / 0.22);

  /* Glas (v1.32) für Kopf, Tab- und Vorschlagsleiste: durchscheinende
     Fläche, Weichzeichner dahinter, eine helle Lichtkante oben. Ohne
     backdrop-filter oder mit „Transparenz reduzieren" wird daraus die
     volle --surface (s. .glas weiter unten). */
  --glas:        oklch(0.995 0.004 var(--h-ink) / 0.80);
  --glas-kante:  oklch(1 0 0 / 0.85);
  --glas-linie:  oklch(0.55 0.02 var(--h-ink) / 0.16);
  --glas-schatten: 0 1px 0 var(--glas-linie), 0 8px 24px oklch(0.2 0.02 var(--h-ink) / 0.06);
  /* Vom Home-Bildschirm gestartet ist der Kopf flach und deckend — genau
     diese Farbe meldet applyTheme() als theme-color (s. .kopf). */
  --kopf-flach: #ffffff;

  /* v1.42: Grund- und Display-Schrift sind dieselbe eingebettete Gabarito
     (s. @font-face oben) — auf jedem Gerät gleich, auch offline. Fehlt sie,
     greifen die Rundlinge und die Systemschrift dahinter. */
  --font: "Gabarito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Gabarito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Schrift-Tokens — rem gegen die 100%-Basis, damit die Oberfläche mit der
     Systemschriftgröße mitwächst. Feste Skala (~1.13), kein Fluid Type: bei
     Spalten sehr unterschiedlicher Breite macht viewport-abhängige Schrift die
     Typografie beliebig. Einzige Ausnahme --t-display, s. dort. Halbschritte
     (11,5/12,5/13,5/14,5px) gibt es nicht mehr — sie sind in den Nachbarn
     aufgegangen. */
  --t-xs:   0.6875rem;  /* ~11px  — kleinste Beschriftungen/Metadaten */
  --t-sm:   0.8125rem;  /* ~13px  — Hinweistexte, Chips, Zusatzinfo */
  --t-body: 0.9375rem;  /* ~15px  — Fließtext, Basisgröße der App */
  --t-h2:   1.0625rem;  /* ~17px  — Zwischenüberschriften, größere Ziffern */
  --t-h1:   1.1875rem;  /* ~19px  — Dialogtitel */
  /* Genau eine Stelle: der laufende/nächste Agenda-Eintrag — die größte
     Schrift gehört auf die Antwort, nicht auf ein Datum. */
  --t-display: clamp(1.5rem, 1.3rem + 1vw, 1.75rem);
}

html[data-theme="dark"] {
  --bg:         oklch(0.165 0.012 var(--h-ink));
  --surface:    oklch(0.205 0.014 var(--h-ink));
  --surface-2:  oklch(0.245 0.015 var(--h-ink));
  --surface-3:  oklch(0.285 0.016 var(--h-ink));
  --border:     oklch(0.315 0.016 var(--h-ink));
  --border-strong: oklch(0.40 0.018 var(--h-ink));
  --text:       oklch(0.955 0.006 var(--h-ink));
  --text-muted: oklch(0.80 0.012 var(--h-ink));
  --text-faint: oklch(0.68 0.012 var(--h-ink));

  --ink:        oklch(0.82 0.095 var(--h-ink));
  --ink-hover:  oklch(0.89 0.075 var(--h-ink));
  --ink-active: oklch(0.76 0.095 var(--h-ink));
  --focus:      oklch(0.78 0.120 var(--h-ink));
  --selected:   oklch(0.30 0.035 var(--h-ink));
  --selected-text: oklch(0.89 0.060 var(--h-ink));

  --danger:  oklch(0.68 0.180 25);
  --success: oklch(0.72 0.140 150);
  --warn:    oklch(0.78 0.150 75);

  --on-ink:    oklch(0.18 0.014 var(--h-ink));
  --on-danger: oklch(0.18 0.014 var(--h-ink));

  --shadow-1: 0 1px 2px oklch(0 0 0 / 0.35);
  --shadow-2: 0 6px 20px oklch(0 0 0 / 0.45), 0 1px 3px oklch(0 0 0 / 0.3);
  --shadow-3: 0 16px 48px oklch(0 0 0 / 0.6);
  --glas:        oklch(0.215 0.014 var(--h-ink) / 0.80);
  --glas-kante:  oklch(1 0 0 / 0.10);
  --glas-linie:  oklch(1 0 0 / 0.09);
  --glas-schatten: 0 1px 0 var(--glas-linie), 0 8px 24px oklch(0 0 0 / 0.30);
  --kopf-flach: #101b15;

}

/* Bereichsfarben: gleiche Helligkeit/Chroma, nur der Hue (--h) wechselt.
   Muss auf dem Element selbst deklariert werden — auf :root wäre --h leer. */
.block, .block__ghost, .chip, .arearow, .task__meta, .dayswitch__btn, .goal, .goalrow, .reliefrow,
.hakenrow, .zielrow, .agenda__hero, .agenda__row, .abschlussrow, .wochenzeile__seg {
  --area-bg:     oklch(0.950 0.048 var(--h));
  --area-bg-2:   oklch(0.900 0.075 var(--h));
  --area-edge:   oklch(0.870 0.070 var(--h));
  --area-line:   oklch(0.605 0.150 var(--h));
  --area-text:   oklch(0.350 0.090 var(--h));
  --area-dot:    oklch(0.605 0.150 var(--h));
}
html[data-theme="dark"] :is(.block, .block__ghost, .chip, .arearow, .task__meta, .dayswitch__btn, .goal, .goalrow, .reliefrow,
.hakenrow, .zielrow, .agenda__hero, .agenda__row, .abschlussrow, .wochenzeile__seg) {
  --area-bg:     oklch(0.320 0.060 var(--h));
  --area-bg-2:   oklch(0.400 0.085 var(--h));
  --area-edge:   oklch(0.430 0.080 var(--h));
  --area-line:   oklch(0.740 0.150 var(--h));
  --area-text:   oklch(0.945 0.035 var(--h));
  --area-dot:    oklch(0.740 0.150 var(--h));
}

/* ============================================================ Base */
* { box-sizing: border-box; }
/* Das hidden-Attribut bringt nur einen schwachen Browser-Standard mit, den
   jede Klassenregel schlaegt. Ohne das hier bleibt ein verborgener Knopf
   unsichtbar, faengt aber weiter Klicks ab — genau das hat auf dem iPhone
   das Zahnrad blockiert. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { caret-color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--text-faint); opacity: 1; }
::selection { background: var(--selected); color: var(--selected-text); }
* { scrollbar-color: var(--border-strong) transparent; scrollbar-width: thin; }
.ui-icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
.num { font-variant-numeric: tabular-nums; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* Sprunglink "Zum Inhalt" (1385): blieb bisher auch mit Tastaturfokus
   1x1px und unsichtbar - fuer sehende Tastaturnutzung ohne Wirkung, obwohl
   genau die davon profitieren soll. Erst beim Fokus zeigen, wie ueberall
   ueblich. */
.sr:focus {
  position: fixed; top: var(--s-2); left: var(--s-2); z-index: 100;
  width: auto; height: auto; padding: var(--s-2) var(--s-4); margin: 0;
  overflow: visible; clip: auto; white-space: normal;
  background: var(--ink); color: var(--on-ink); border-radius: var(--radius-sm);
}

/* ============================================================ Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 38px; padding: 0 var(--s-3);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-size: var(--t-body); font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn--primary {
  background: var(--ink); border-color: var(--ink);
  color: var(--on-ink); font-weight: 600;
}
.btn--ghost { background: transparent; border-color: transparent; }
/* Ohne echtes Zeigegerät bleibt :hover nach dem Antippen hängen (z. B.
   #nextWeek zeigt dann dauerhaft die Hover-Fläche) — deshalb nur auf
   Geräten mit echtem Hover aktiv. .btn:hover trifft auch auf .btn--ghost
   zu (gleiche Kaskade), muss also mitwandern. */
@media (hover: hover) {
  .btn:hover { background: var(--surface-2); }
  .btn--ghost:hover { background: var(--surface-2); }
}
/* Nach dem @media-Block, nicht davor: gleiche Spezifität wie .btn:hover,
   und bei Gleichstand gewinnt die spätere Regel. Vor dem Block platziert
   übermalte .btn:hover jeden gehoverten Primärknopf mit --surface-2, die
   Schrift blieb --on-ink — weiß auf fast Weiß (Prüfung: werkzeug/hover.js). */
.btn--primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn--danger { color: var(--danger); border-color: transparent; background: transparent; }
.btn--danger:hover { background: oklch(0.55 0.19 25 / 0.12); }
.btn--icon { min-width: 38px; padding: 0 var(--s-2); }
.btn--sm { min-height: 32px; font-size: var(--t-sm); padding: 0 var(--s-2); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface); font-size: var(--t-sm); font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s;
}
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink);
}
.chip__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--area-dot); flex: none; }

.label {
  display: block; font-size: var(--t-sm); font-weight: 650; letter-spacing: 0;
  color: var(--text-muted); margin-bottom: var(--s-2);
}
.field {
  width: 100%; min-height: 40px; padding: 0 var(--s-3);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
}
.field:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.field[aria-invalid="true"] { border-color: var(--danger); }
.field-error { margin: 8px 0 0; color: var(--danger); font-size: var(--t-sm); line-height: 1.5; }
.field-error[hidden] { display: none; }

/* ============================================================ App shell */
/* overflow: hidden verhindert, dass die ganze Seite am Telefon gummiartig
   mitfedert — gescrollt wird im Raster, nicht am Dokument. */
.app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  padding-left: var(--safe-left); padding-right: var(--safe-right); }
/* Rückfall für setAppInert(), falls der Browser kein natives inert kennt —
   aria-hidden allein hält die Maus nicht ab. */
.app.is-inert-fallback { pointer-events: none; }

/* Langes Drücken legt einen Eintrag an. Ohne diese drei Zeilen kommt an
   derselben Stelle die Textauswahl von iOS dazwischen und übernimmt die
   Geste. */
.gridwrap, .dayswitch, .tabbar, .loose, .dayhead, .block, .daycol {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.block__title, .block__time { -webkit-user-select: none; user-select: none; }

/* v1.32: gemeinsamer Kopf aus Banner, Kopfzeile und Tagesstreifen — eine
   Glasfläche statt dreier einzeln gefärbter Streifen. Am Desktop steht er im
   Fluss; am Telefon liegt er über dem Inhalt, der darunter durchläuft
   (s. Responsive). */
.kopf {
  flex: none; position: relative; z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tabbar, .sugbar { background: var(--surface); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .kopf, .tabbar, .sugbar {
    background: var(--glas);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
  }
  .kopf { border-bottom: 0; box-shadow: var(--glas-schatten), inset 0 -1px 0 var(--glas-kante); }
}
/* v1.33: vom Home-Bildschirm gestartet (html[data-app="1"]) legt iOS ab 26
   seinen Liquid-Glass-„Scroll-Edge-Effekt" über den oberen Rand — überall
   dort, wo es keine flache Farbe abtasten kann. Über unserem durchscheinenden
   Kopf wusch das die KW-Zeile aus (iOS 27, Screenshot vom 2026-09-26). Hier
   ist der Kopf deshalb flach und deckend, in genau der theme-color. Das Glas
   bleibt unten (Tab- und Vorschlagsleiste) und im Browser. */
/* Auch die Leinwand darunter trägt dieselbe Farbe — nichts Andersfarbiges
   am oberen Rand, das iOS abtasten könnte. */
html[data-app="1"] { background: var(--kopf-flach); }
html[data-app="1"] .kopf {
  background: var(--kopf-flach) !important;
  -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  box-shadow: 0 1px 0 var(--glas-linie);
}
/* Wer „Transparenz reduzieren" eingeschaltet hat, bekommt volle Flächen. */
@media (prefers-reduced-transparency: reduce) {
  .kopf, .tabbar, .sugbar {
    background: var(--surface) !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  }
}
.topbar {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  padding-top: max(var(--s-3), var(--safe-top));
  background: transparent;
  flex: none;
}
.brand { display: flex; align-items: center; gap: var(--s-3); margin-right: auto; min-width: 0; }
.brand__mark { width: 34px; height: 34px; flex: none; color: var(--ink); }
.brand__copy { display: flex; flex-direction: column; min-width: 0; }
.brand__tagline { font-size: var(--t-xs); color: var(--text-faint); }
.brand__name { font-size: var(--t-h2); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand__who {
  font-size: var(--t-sm); color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.weeknav { display: flex; align-items: center; gap: var(--s-1); }
/* #weekLabel ist ein echter <button> (öffnet "Frei diese Woche", siehe
   dort) — die drei Zeilen setzen nur den Browser-Rahmen/-Hintergrund
   zurück, den ein <button> sonst mitbringt; Maße/Typografie bleiben wie
   beim bisherigen <div>. min-height sichert die 44px-Trefferfläche, ohne
   die Kopfzeilenhöhe zu ändern — die steht schon durch die Pfeile daneben fest. */
.weeknav__label {
  min-width: 148px; min-height: 44px; text-align: center; font-size: var(--t-body); font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: none; border: none; border-radius: var(--radius-sm); color: inherit;
  cursor: pointer;
}
@media (hover: hover) { .weeknav__label:hover { background: var(--surface-2); } }
.weeknav__label small { display: block; font-weight: 500; color: var(--text-muted); font-size: var(--t-sm); }
/* Ruhige Andeutung, dass sich hier etwas öffnet — ohne eigene Fläche oder
   Farbe, die der Chrome laut Gestaltungsregel nicht tragen darf. */
.weeknav__caret {
  width: 11px; height: 11px; margin-left: 3px; vertical-align: 1px;
  fill: none; stroke: var(--text-muted); stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round;
}
/* #monthBtn (Monatsübersicht, Stufe M1) — gleiche Strichstärke wie das
   Wolken-Icon in .syncbadge__ico, damit die Topbar-Icons einheitlich
   wirken, obwohl sie an verschiedenen Stellen im Markup entstehen. */
.monthbtn__ico {
  width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ============================================================
   Frei diese Woche (Auftrag A) — sieben Zeilen in Worten statt eines
   Rasters, aus dem man Lücken heraussuchen muss. Komplett achromatisch:
   freie Zeit gehört keinem Bereich, im Gegensatz zu jedem Block sonst in
   dieser App — hier darf die Oberfläche also wirklich farblos bleiben.

   Stufe M2: Hinweiszeile und Zeilenabstand hier unten sind gegenüber der
   M1-Fassung leicht gestrafft (Margin s-3->s-2, Zeilenpolster 8px->4px),
   damit unter dem Kopf Platz für den neuen Frei/Belegt-Umschalter entsteht,
   ohne dass das Blatt auf dem iPhone SE zu scrollen anfängt (freiwoche.js,
   Test g). Klassen, IDs, Inhalt und Verhalten dieses Gesichts bleiben sonst
   exakt wie vorher — freiwoche.js prüft das hart, unverändert.
   ============================================================ */
/* #freizeitTitel (Stufe M3.1) ist wie #weekLabel ein echter <button> --
   Zoom-Ausstieg zum Monatsblatt. Dieselbe Formensprache: Browser-Chrome
   zurückgesetzt, Caret-Hinweis (.weeknav__caret wird 1:1 wiederverwendet),
   44px Mindesthöhe für die Trefferfläche -- bei flex:1 (Breite über die
   ganze Kopfzeile des Blatts) reicht das ohne ::before-Kniff. Die
   Typografie bleibt bei .sheet__title (font-size/-weight/letter-spacing),
   diese Klasse setzt nur das Knopf-Drumherum zurück. */
.freizeittitel {
  min-height: 44px; background: none; border: none; color: inherit;
  cursor: pointer; padding: 0; border-radius: var(--radius-sm);
}
@media (hover: hover) { .freizeittitel:hover { background: var(--surface-2); } }
.freizeithint {
  margin: 0 0 var(--s-2); color: var(--text-muted); font-size: var(--t-xs);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.freizeitlist { display: flex; flex-direction: column; }
.freizeitlist[hidden] { display: none; }
.freizeitrow {
  display: flex; align-items: baseline; gap: var(--s-3);
  padding: 4px 2px; border-bottom: 1px solid var(--border);
}
.freizeitrow:last-child { border-bottom: none; }
.freizeitrow__tag { flex: none; width: 6em; font-weight: 700; font-size: var(--t-body); }
.freizeitrow__zeit { flex: 1; min-width: 0; font-size: var(--t-body); color: var(--text-muted); line-height: 1.35; }
.freizeitrow__zeit b { color: var(--text); font-weight: 700; }
.freizeitrow.is-vorbei .freizeitrow__tag,
.freizeitrow.is-vorbei .freizeitrow__zeit { color: var(--text-faint); }
.freizeitrow.is-vorbei .freizeitrow__zeit b { color: var(--text-faint); }
.freizeitrow.is-heute { background: var(--surface-2); border-radius: var(--radius-sm); }

/* ============================================================
   Wochenübersicht: Frei/Belegt-Umschalter (Stufe M2) — dieselbe Frage von
   der Gegenseite: nicht "wann hab ich Zeit" (oben), sondern "was liegt
   an". Zwei Chips wie überall sonst in der App (.chip/[aria-pressed]),
   keine neue Formensprache. "Frei" bleibt Vorgabe beim Öffnen — welche
   Fläche zuletzt gewählt war, merkt sich nur eine Modulvariable fürs
   laufende Tab (freizeitGesicht, bei freizeitZeile weiter unten im
   Skript) — kein state-Feld, nichts synchronisiert.
   ============================================================ */
.gesichtumschalter { display: flex; gap: var(--s-2); margin-bottom: var(--s-3); }
.gesichtumschalter .chip { flex: 1; justify-content: center; min-height: 44px; }

/* Belegt-Gesicht: sieben Zeilen "was liegt an" statt Spalten — ein
   7-Spalten-Wochenraster am Handy wurde am 2026-08-08 als Prototyp gebaut
   und ist gescheitert (Spaltenteilung macht Titel unlesbar). Rechts je Tag
   eine Segmentleiste über die Tagesachse (dayStart..dayEnd), Farbton wie
   überall über --h auf dem Segment selbst (Muster .block/.chip__dot).
   Grobe/Vorschlag-Segmente sind komplett umrandet gestrichelt (border,
   alle vier Seiten — Muster .block__ghost), NICHT nur links: ein weiterer
   farbiger border-left wäre ein vierter side-tab-Treffer, der Impeccable-
   Deckel steht bei genau drei (CLAUDE.md). */
.wochenzeilen { display: flex; flex-direction: column; }
.wochenzeilen[hidden] { display: none; }
.wochenzeile {
  display: block; width: 100%; min-height: 44px;
  padding: 8px 2px; border: none; border-bottom: 1px solid var(--border);
  background: transparent; color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.wochenzeile:last-child { border-bottom: none; }
@media (hover: hover) { .wochenzeile:hover { background: var(--surface-2); } }
.wochenzeile.is-heute { background: var(--surface-2); border-radius: var(--radius-sm); }
.wochenzeile__top { display: flex; align-items: center; gap: var(--s-3); }
.wochenzeile__tag {
  flex: none; min-width: 4.6em; font-weight: 700; font-size: var(--t-body);
  white-space: nowrap;
}
.wochenzeile__bar {
  position: relative; flex: 1; height: 20px; min-width: 0;
  border-radius: 4px; background: var(--surface-3); overflow: hidden;
}
.wochenzeile__seg { position: absolute; top: 2px; bottom: 2px; min-width: 3px; border-radius: 2px; background: var(--area-line); }
.wochenzeile__seg--grob, .wochenzeile__seg--sug {
  background: var(--area-bg-2); border: 1px dashed var(--area-line); opacity: .7;
}
.wochenzeile__seg--sug { opacity: .4; }
.wochenzeile__txt {
  display: block; margin: 4px 0 0; font-size: var(--t-sm); color: var(--text-muted); line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.wochenzeile__txt b { color: var(--text); font-weight: 700; }
.wochenzeile__txt.is-leer { color: var(--text-faint); }
.wochenzeile.is-vorbei .wochenzeile__tag,
.wochenzeile.is-vorbei .wochenzeile__txt { color: var(--text-faint); }
.wochenzeile.is-vorbei .wochenzeile__bar { opacity: .5; }

/* ============================================================
   Monatsübersicht (Stufe M1) — die Woche in Stunden beantwortet "was
   mache ich heute"; "wann ist noch Luft" blieb offen, solange man sich
   wochenweise durchklicken musste. Der Monats-Prototyp vom 2026-08-08
   hat vermessen: eine ~40px-Zelle traegt weder Uhrzeit noch Titel — der
   ehrliche Nutzen ist Navigation und Vorausplanen, kein Informations-
   kalender. Zellen zeigen darum NUR Auslastung, "freigehalten", "heute",
   "hat etwas" — alles andere bleibt der Wochenansicht vorbehalten.
   Randlos wie beim Tagwechsler (.dayswitch), aus demselben Platzgrund:
   acht Spalten (KW-Rinne + Mo-So) auf 320px lassen keine Fugen zu.
   margin cancelt das Sheet-Padding (var(--s-5)), damit die Zellen die
   volle Breite bekommen — dieselbe Technik wie .setmenu weiter oben. */
.monatgrid {
  display: grid; grid-template-columns: minmax(24px, .8fr) repeat(7, minmax(0, 1fr));
  gap: 2px; margin: 0 calc(var(--s-5) * -1); padding: 0 6px;
}
.monatgrid__lab {
  text-align: center; font-size: var(--t-xs); font-weight: 600; color: var(--text-faint);
  padding: 2px 0 6px;
}
.monatweek, .monatcell {
  min-height: 40px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 2px 0;
}
.monatcell--leer { min-height: 40px; }
.monatweek b, .monatcell b {
  font-size: var(--t-sm); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text);
}
.monatweek { color: var(--text-muted); }
.monatweek__pct { font-size: var(--t-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.monatweek__plus { font-size: var(--t-xs); font-weight: 700; color: var(--text-muted); margin-left: 2px; }
.monatweek.is-past { opacity: .45; }
@media (hover: hover) {
  .monatweek:not(.is-past):hover, .monatcell:not(.monatcell--leer):hover { background: var(--surface-2); }
}
/* Auslastungsstrich — dieselbe Balken-Technik wie .dayswitch__btn i
   (~1112): ein Hintergrund-Gradient, keine Kante (Impeccable-Deckel). */
.monatcell__bar {
  width: 18px; height: 3px; border-radius: 2px; flex: none;
  background: linear-gradient(to right,
    var(--last-farbe, var(--text-faint)) 0 var(--last, 0%),
    var(--surface-3) var(--last, 0%) 100%);
}
.monatcell.is-voll .monatcell__bar { --last-farbe: var(--warn); }
/* Freigehalten ersetzt den Strich durch einen Ring statt eine Kante zu
   ziehen — box-shadow statt border, aus demselben Grund. */
.monatcell.is-frei .monatcell__bar {
  width: 7px; height: 7px; border-radius: 50%; background: transparent;
  box-shadow: inset 0 0 0 1.4px var(--text-muted);
}
.monatcell.is-vergangen { opacity: .45; }
/* "Heute" als gefuellter Kreis um die Nummer — Muster .dayswitch__btn.is-today b (~1096). */
.monatcell.is-today b {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--on-ink);
}
.monatfuss {
  margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--border);
  font-size: var(--t-sm); color: var(--text-muted); text-align: center;
}

.main { display: flex; flex: 1; min-height: 0; }
@keyframes einblenden { from { opacity: .3; } to { opacity: 1; } }
.main.is-wechsel > .panel, .main.is-wechsel > .planwrap { animation: einblenden .2s cubic-bezier(0.16, 1, 0.3, 1); }

/* Ein ausgewählter Arbeitsbereich neben dem Kalender. Die Navigation bleibt
   beim Scrollen erreichbar; kein Sprung in einen langen Kartenstapel. */
.panelnav { display: flex; gap: var(--s-1); position: sticky; top: calc(var(--s-5) * -1); z-index: 25;
  margin: calc(var(--s-5) * -1) calc(var(--s-5) * -1) 0; padding: var(--s-3);
  background: var(--surface); border-bottom: 1px solid var(--border); }
.panelnav button { flex: 1; min-height: 44px; border: none; border-radius: var(--radius-sm);
  padding: var(--s-2); background: transparent; color: var(--text-muted); font-weight: 600; font-size: var(--t-sm); }
.panelnav button[aria-current="true"] { background: var(--selected); color: var(--selected-text); }
.planhead { display: flex; flex: none; align-items: center; justify-content: space-between;
  gap: var(--s-4); padding: var(--s-2) var(--s-5); min-height: 56px; border-bottom: 1px solid var(--border); background: var(--surface); }
/* v1.32: eine Zeile statt Titel + Werbesatz; „Freie Zeit" entfiel, weil die
   KW-Anzeige im Kopf (und die Taste W) dasselbe Blatt öffnet. */
.planhead h1 { font-size: var(--t-h2); margin: 0; letter-spacing: -.01em; }
.planhead__actions { display: flex; align-items: center; gap: var(--s-2); flex: none; }
@media (min-width: 1101px) {
  .main > .panel { width: clamp(352px, 29vw, 440px); padding: var(--s-5);
    margin: var(--s-4); border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--surface); }
  .panel > .card { border: 0; border-radius: 0; padding: 0; background: transparent; }
  body[data-panel="heute"] .panel > .card:not([data-card="heute"]),
  body[data-panel="ziele"] .panel > .card:not([data-card="ziele"]),
  body[data-panel="aufgaben"] .panel > .card:not([data-card="aufgaben"]) { display: none; }
  .planwrap { margin: var(--s-4) var(--s-4) var(--s-4) 0; border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; }
  .main > .panel, .main > .planwrap { margin-bottom: max(var(--s-4), var(--safe-bottom)); }
}

.panel {
  width: 320px; flex: none;
  border-right: 1px solid var(--border);
  background: var(--bg);
  overflow-y: auto;
  padding: var(--s-4);
  display: flex; flex-direction: column; gap: var(--s-5);
}
.card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: var(--s-4);
  scroll-margin-top: 76px;
}
.card__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-2); margin-bottom: var(--s-3);
}
.card__title { font-size: var(--t-h2); font-weight: 650; letter-spacing: -.01em; color: var(--text); margin: 0; }

/* ============================================================ Tagesform (Signature) */
.energy { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.energy__opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: var(--s-3) var(--s-1); min-height: 74px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); font-size: var(--t-sm); font-weight: 600;
  transition: background .15s, border-color .15s, transform .1s;
}
.energy__opt:active { transform: scale(0.97); }
.energy__opt[aria-pressed="true"] { border-color: var(--ink); background: var(--selected); color: var(--selected-text); }
.energy__bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.energy__bars i { width: 5px; border-radius: 2px; background: var(--border-strong); display: block; }
.energy__bars i:nth-child(1) { height: 8px; }
.energy__bars i:nth-child(2) { height: 14px; }
.energy__bars i:nth-child(3) { height: 20px; }
/* v1.31: unausgewählt sahen alle drei Knöpfe gleich aus — dreimal dieselben
   grauen Balken. Jetzt zeigt jeder seine Stufe wie eine Signalanzeige; die
   Farbe bleibt der Auswahl vorbehalten (Regeln darunter). */
.energy__opt[data-lvl="low"] .energy__bars i:nth-child(1),
.energy__opt[data-lvl="mid"] .energy__bars i:nth-child(-n+2),
.energy__opt[data-lvl="high"] .energy__bars i { background: var(--text-faint); }
.energy__opt[data-lvl="low"][aria-pressed="true"] .energy__bars i:nth-child(1) { background: var(--warn); }
.energy__opt[data-lvl="mid"][aria-pressed="true"] .energy__bars i:nth-child(-n+2) { background: var(--focus); }
.energy__opt[data-lvl="high"][aria-pressed="true"] .energy__bars i { background: var(--success); }
/* v1.33: kein gestrichelter Kasten mehr um einen Satz — der Text steht
   einfach unter den Knöpfen, auf die er antwortet. */
.hint {
  margin-top: var(--s-3); padding: 0 2px;
  font-size: var(--t-sm); color: var(--text-muted); line-height: 1.5;
}
.hint b { color: var(--text); font-weight: 600; }

/* ============================================================
   Agenda — der neue Kopf der „Heute"-Karte (Stufe 4)

   Keine Karten in der Karte: Zeilen trennt eine Haarlinie, Farbe ist ein
   3px-Strich links (--area-line), keine Fläche, kein Rahmen, kein
   Schatten. Zwei Schriftgrößen pro Zeile, nicht drei — die einzige große
   ist der laufende Eintrag, alles andere bleibt Fließtext.
   ============================================================ */
.agenda { display: flex; flex-direction: column; }
/* v1.33: normal geschrieben und in der runden Stimme statt gesperrter
   Großbuchstaben — gleiche Größe, damit die Falz-Verträge halten. */
.agenda__label {
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 700; letter-spacing: 0;
  color: var(--text); margin: 14px 0 6px;
}
/* Begrüßung in derselben Zeile wie „Heute zählt" — kostet keine Höhe. */
.agenda__kopfzeile { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px var(--s-2); }
.agenda__kopfzeile .agenda__label { margin-top: 0; }
.agenda__gruss {
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 600; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
/* Die runde Stimme trägt Zahlen, Titel und die eine große Antwort. */
.sheet__title, .card__title, .planhead h1, .brand__name, .weeknav__label,
.dayhead__num, .dayswitch__btn b, .agenda__hero-title, .agenda__frog,
.goal__name, .monat__titel, .zusage__kopf, .kuerzel kbd {
  font-family: var(--font-display);
}
.agenda__hero-title { font-weight: 750; letter-spacing: -.01em; }
.sheet__title, .card__title, .planhead h1 { font-weight: 750; letter-spacing: -.015em; }
.dayhead__num, .dayswitch__btn b { font-weight: 750; }

/* Abhaken wird gefeiert (jubel(), v1.33): kleine Schnipsel im Farbton des
   Bereichs, feste Position über allem, nie anklickbar. */
.jubel {
  position: fixed; z-index: 400; width: 8px; height: 12px; border-radius: 2px;
  pointer-events: none; will-change: transform, opacity;
}
.agenda__label:first-child { margin-top: 0; }
.agenda__frog {
  display: block; width: 100%; min-height: 44px; padding: 4px 0 10px;
  border: none; border-bottom: 1px solid var(--border); background: transparent;
  font-size: var(--t-body); font-weight: 600; color: var(--text); text-align: left;
  cursor: pointer;
}
.agenda__frog { color: var(--selected-text); }
/* v1.33: der Schwerpunkt des Tages bekommt eine handgezogene Welle im
   Farbton seines Bereichs — das eine Element, das „Heute" Charakter gibt. */
.agenda__frogtext {
  padding-bottom: 7px; background-repeat: repeat-x; background-position: left bottom;
  background-size: 18px 7px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.task__step, .agenda__step { margin-top: 6px; font-size: var(--t-sm); color: var(--text-muted);
  line-height: 1.45; overflow-wrap: anywhere; }
.agenda__step { margin-bottom: 4px; }
.task__step b, .agenda__step b { font-weight: 600; color: var(--text); }
.agenda__hero {
  margin-top: 10px; padding: 8px 0 10px 10px;
  border-left: 3px solid var(--area-line); border-bottom: 1px solid var(--border);
}
.agenda__hero-status {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--t-sm); color: var(--text-muted); margin-bottom: 3px;
}
.agenda__hero-title { font-size: var(--t-display); font-weight: 600; line-height: 1.25; }
.agenda__hero-sub { font-size: var(--t-sm); color: var(--text-muted); margin-top: 3px; }
.agenda__list { display: flex; flex-direction: column; }
.agenda__row {
  display: flex; align-items: flex-start; gap: 10px; min-height: 44px;
  padding: 6px 0 6px 10px; border-left: 3px solid var(--area-line);
  border-top: 1px solid var(--border); cursor: pointer;
}
.agenda__row--grob { border-left-style: dotted; }
/* Wischen zum Abhaken (v1.35): die Zeile folgt dem Finger, dahinter wächst
   die Bestätigung; ab der Schwelle wird sie satt und sagt, was passiert. */
.agenda__row:not(.is-vorschlag) { position: relative; touch-action: pan-y; }
.agenda__row > * { transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1); }
.agenda__row.is-wisch > * { transform: translateX(var(--wisch, 0px)); transition: none; }
.agenda__row.is-wisch::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: var(--wisch, 0px);
  background: var(--selected); pointer-events: none; border-radius: 0 12px 12px 0;
}
.agenda__row.is-wisch::after {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 750;
  color: var(--selected-text); opacity: 0; pointer-events: none; transition: opacity .12s;
}
.agenda__row.is-wisch[data-wisch-ziel="ab"]::after { content: "Erledigt"; }
.agenda__row.is-wisch[data-wisch-ziel="zurueck"]::after { content: "Wieder offen"; }
.agenda__row.is-wisch-voll::before { background: var(--ink); }
.agenda__row.is-wisch.is-wisch-links::before { left: auto; right: 0; width: var(--wisch-links, 0px); border-radius: 12px 0 0 12px; }
.agenda__row.is-wisch.is-wisch-links::after { content: "Verschieben"; left: auto; right: 12px; }
.agenda__row.is-wisch-voll::after { opacity: 1; color: var(--on-ink); }
.agenda__row.is-on .agenda__title { opacity: .55; text-decoration: line-through; }
.agenda__check {
  appearance: none; width: 16px; height: 16px; margin-top: 4px; flex: none;
  border: 1.5px solid var(--border-strong); border-radius: 50%; background: var(--surface);
  cursor: pointer; position: relative;
}
.agenda__check:checked { background: var(--ink); border-color: var(--ink); }
.agenda__check:checked::after {
  content: ""; position: absolute; left: 4px; top: 1.5px;
  width: 4px; height: 7px; border: solid var(--on-ink);
  border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.agenda__body { flex: 1; min-width: 0; }
.agenda__line { display: flex; align-items: baseline; gap: 8px; }
.agenda__title { font-size: var(--t-body); font-weight: 500; min-width: 0; }
.agenda__time { margin-left: auto; font-size: var(--t-sm); color: var(--text-muted); flex: none; }
.agenda__sub { font-size: var(--t-sm); color: var(--text-faint); margin-top: 2px; }
/* Vorschlagszeilen (Stufe B1) — dieselbe .agenda__row, nur gedämpft und
   gestrichelt wie die Vorschlagsblöcke im Raster (.block.is-sug, ~683):
   border-left-STYLE wechselt auf dashed (die Farbe/Breite bleiben die von
   .agenda__row — kein neuer Streifen, s. Impeccable-Deckel), der Inhalt
   tritt zurück. Die Knöpfe bleiben voll deckend, sonst liest sich "Vorschlag
   übernehmen" selbst wie deaktiviert.
   Stufe C Punkt C8: die Dämpfung sitzt bewusst auf .agenda__line (Titel +
   Zeit), NICHT auf .agenda__body — sonst geriet .agenda__sub (color:
   var(--text-faint), ohnehin schon der leiseste Text) unter die
   gemessenen 4,5:1 (hell 3,63:1, dunkel 4,59:1 — Kippgrenze, vorschlagzeilen.js
   misst das dauerhaft nach). .agenda__sub ist ein Geschwister von
   .agenda__line innerhalb .agenda__body (s. renderAgenda()-Markup), bleibt
   also unangetastet bei voller Deckkraft — derselbe Wert wie in einer
   normalen (nicht-Geister-)Zeile. Der Geist-Charakter bleibt: Titel/Zeit
   treten weiter zurück, die Kante bleibt gestrichelt. */
.agenda__row.is-vorschlag { border-left-style: dashed; }
.agenda__row.is-vorschlag .agenda__line { opacity: .82; }
.agenda__sugacts { display: flex; align-items: flex-start; gap: 6px; flex: none; }
.agenda__sugacts button {
  width: 26px; height: 26px; padding: 0; border-radius: 6px;
  border: 1px solid var(--area-edge); background: var(--surface);
  color: var(--area-text); font-size: var(--t-xs); line-height: 1;
  display: grid; place-items: center; position: relative; flex: none;
}
.agenda__sugacts button:hover { background: var(--area-bg-2); }
.agenda__foot {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: var(--t-sm); color: var(--text-muted);
}
/* Ladezustand, solange Sync.boot() den echten Stand noch nicht gezogen hat —
   dieselbe Schraffur wie die Nachtruhe im Raster (.rest, ~785), nur als
   eigenständige Fläche statt als Overlay. */
.agenda__loading {
  height: 200px; border-radius: var(--radius-sm);
  background: var(--surface-3);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0.5 0.02 var(--h-ink) / 0.055) 5px 10px);
}
html[data-theme="dark"] .agenda__loading {
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0 0 0 / 0.16) 5px 10px);
}

/* ============================================================ Wochenstart */
.ritual { border-color: var(--border-strong); }
.ritual__head {
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 700;
  color: var(--text-muted); margin-bottom: 6px;
}
.ritual__txt { margin: 0; font-size: var(--t-sm); line-height: 1.55; color: var(--text-muted); }
.ritual__txt b { color: var(--text); }
.ritual__foot { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); }
.ritual__lead {
  margin: 0 0 16px; font-size: var(--t-sm); line-height: 1.6; color: var(--text-muted);
}
.ritual__lead b { color: var(--text); font-weight: 600; }

.steps { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.steps__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
.steps__dot.is-on { background: var(--ink); }
.steps__lab { font-size: var(--t-xs); color: var(--text-faint); margin-left: 6px; }
.ritual__summe {
  margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--border);
  font-size: var(--t-sm); color: var(--text-muted);
}
.ritual__summe b { color: var(--text); font-weight: 600; }

.hakenliste { display: flex; flex-direction: column; gap: 2px; }
.hakenliste__tag:first-child { margin-top: 0; }
.hakenkopf {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border);
}
.hakenkopf__sum { font-size: var(--t-sm); color: var(--text-muted); flex: 1; min-width: 120px; }
.hakenkopf__sum b { color: var(--text); font-weight: 600; }
.hakenliste__tag {
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 700;
  color: var(--text-muted); margin: 12px 0 4px;
}
.hakenrow {
  display: flex; align-items: center; gap: 10px; min-height: 44px;
  padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer;
}
.hakenrow:hover { background: var(--surface-2); }
.hakenrow.is-on .hakenrow__txt { opacity: .55; text-decoration: line-through; }
.hakenrow input { width: 20px; height: 20px; flex: none; accent-color: var(--area-line); }
.hakenrow__txt {
  display: flex; align-items: center; gap: 7px; font-size: var(--t-sm);
  min-width: 0; flex: 1;
}
.hakenrow__txt > span:first-child { flex: none; }
.hakenrow__zeit { margin-left: auto; font-size: var(--t-xs); color: var(--text-faint); flex: none; }

.zieleliste { display: flex; flex-direction: column; gap: 2px; }
.zielrow {
  display: flex; align-items: center; gap: 10px; min-height: 48px;
  padding: 4px 0; opacity: .55;
}
.zielrow.is-on { opacity: 1; }
.zielrow__name { display: flex; align-items: center; gap: 7px; font-size: var(--t-sm); flex: 1; min-width: 0; }
.zielrow__ist { color: var(--text-faint); font-size: var(--t-xs); }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper__val { min-width: 42px; text-align: center; font-size: var(--t-sm); font-weight: 600; }

/* Anker-Frage (Stufe 13 Teil B), unter der Zielzeile: dieselbe kleine
   Chip-Größe wie .goalrow__art, damit sie neben dem Stepper nicht dominiert. */
.zielanker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: -2px 0 10px; }
.zielanker__lab { font-size: var(--t-xs); color: var(--text-faint); flex: none; }
.zielanker .chip { font-size: var(--t-sm); padding: 5px 10px; min-height: 32px; }
@media (pointer: coarse) { .zielanker .chip { min-height: 44px; padding: 5px 12px; } }

/* Wochenrückblick (Stufe 14), unter der Abhak-Liste in Schritt 1: geplant
   gegen tatsächlich als Satz statt als Diagramm — Bereichsfarbe als 3px-Strich
   links (--area-line), wie die Agenda oben, keine Balken, keine Ampelfarbe. */
.rueckblick { display: flex; flex-direction: column; gap: 2px; margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--border); }
.rueckblick__row { padding: 6px 0 6px 10px; border-left: 2px solid var(--area-line); font-size: var(--t-sm); color: var(--text-muted); }
.rueckblick__hinweis { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; padding: 8px 0 8px 10px; border-left: 2px solid var(--area-line); font-size: var(--t-sm); color: var(--text-muted); }
.rueckblick__hinweis-txt { flex: 1 1 220px; min-width: 0; }

/* Freihalten sitzt unter der Tagesform, weil beides dieselbe Frage ist:
   was verträgt dieser Tag? */
.freischalter { margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--border); }

/* ============================================================ Konto-Anzeige */
.syncbadge {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); border-radius: 999px;
  padding: 0 10px; min-height: 28px; font-size: var(--t-sm); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.syncbadge::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint); flex: none;
}
.syncbadge:hover { background: var(--surface-2); color: var(--text); }
.syncbadge.is-ok::before   { background: var(--success); }
.syncbadge.is-warn::before { background: var(--warn); }
.syncbadge.is-danger::before { background: var(--danger); }
.syncbadge.is-work::before { background: var(--focus); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.syncbadge__ico { display: none; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .syncbadge { padding: 0; min-width: 44px; justify-content: center; gap: 3px; }
  .syncbadge__txt { display: none; }
  .syncbadge__ico { display: block; }
  .syncbadge::before { width: 7px; height: 7px; }
  /* v1.32: im Glaskopf wie die Symbolknöpfe daneben — ohne eigene Pille;
     der Punkt trägt den Zustand. .topbar erhöht die Spezifität gegenüber
     der pointer:coarse-Regel, die sonst 12px Seitenpolster zurückbringt. */
  .topbar .syncbadge { padding: 0; border-color: transparent; background: transparent; }
  .topbar .syncbadge:hover { background: var(--surface-2); }
}

/* ============================================================ Einstellungs-Menü */
.setmenu { display: flex; flex-direction: column; gap: 2px; margin: 0 calc(var(--s-2) * -1); padding-bottom: var(--s-3); }
.setmenu__item {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%; text-align: left;
  padding: 13px var(--s-2); min-height: 58px;
  border: none; background: transparent; border-radius: var(--radius-sm);
  border-bottom: 1px solid var(--border);
}
.setmenu__item:last-child { border-bottom: 0; }
.setmenu__item:hover { background: var(--surface-2); }
.setmenu__item:active { background: var(--surface-3); }
.setmenu__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.setmenu__name { font-size: var(--t-body); font-weight: 600; }
.setmenu__kurz {
  font-size: var(--t-sm); color: var(--text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.setmenu__pfeil { flex: none; font-size: var(--t-h1); color: var(--text-faint); line-height: 1; }
.setback {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; padding: 4px 0; margin: 0 0 var(--s-4);
  font-size: var(--t-body); font-weight: 600; color: var(--text-muted);
  min-height: 40px;
}
.setback:hover { color: var(--text); }
.setback span { font-size: var(--t-h1); line-height: 1; }
.sheet__row[hidden], .setmenu[hidden], .setback[hidden] { display: none; }

/* Konto in den Einstellungen */
.acct { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s-3); }
.acct__row { display: flex; align-items: center; gap: var(--s-3); }
.acct__txt { flex: 1; min-width: 0; }
.acct__what { font-size: var(--t-body); font-weight: 600; }
.acct__sub { font-size: var(--t-sm); color: var(--text-faint); margin-top: 2px; }

/* ============================================================ Wochenziele */
.goals { display: flex; flex-direction: column; gap: var(--s-4); }
.goal__top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); margin-bottom: 6px; }
.goal__name {
  font-size: var(--t-sm); font-weight: 600; display: flex; align-items: center; gap: 7px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.goal__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--area-dot); flex: none; }
.goal__num { font-size: var(--t-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; flex: none; }
/* Drei Stufen im selben Balken: abgehakt, geplant, vorgeschlagen.
   Unterschieden über die Deckkraft, nicht über eine Schraffur — in acht
   Pixeln Höhe ist eine Schraffur kein Muster mehr, nur ein Farbton, und
   ein Vorschlag sah aus wie Erledigtes. */
.goal__track {
  height: 8px; border-radius: 4px; background: var(--surface-3);
  overflow: hidden; display: flex;
}
.goal__fill { background: var(--area-line); opacity: .58; }
.goal__fill--ist { opacity: 1; }
.goal__fill--sug { opacity: .24; }
.goal__rest { font-size: var(--t-xs); color: var(--text-muted); margin-top: 5px; }
.goal__rest b { color: var(--text); font-weight: 600; }
.goals__foot { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); }
.goals__foot .btn { flex: 1 1 auto; }

/* Passt das noch? (v1.32, zusageSheet) */
.zusage__einstieg {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  width: 100%; min-height: 44px; margin-top: var(--s-4); padding: var(--s-3) 0 0;
  border: 0; border-top: 1px solid var(--border); background: none; color: var(--text-muted);
  font: inherit; font-size: var(--t-sm); text-align: left; line-height: 1.45; cursor: pointer;
}
.zusage__einstieg b { color: var(--text); font-weight: 600; }
.zusage__einstieg > span:last-child { font-size: var(--t-h1); color: var(--text-faint); flex: none; }
@media (hover: hover) { .zusage__einstieg:hover b { text-decoration: underline; text-underline-offset: 3px; } }
.zusage__intro { margin: 0 0 var(--s-4); color: var(--text-muted); font-size: var(--t-body); line-height: 1.55; }
.zusage { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-2); }
.zusage__lage { margin: 0 0 var(--s-1); font-size: var(--t-body); line-height: 1.55; color: var(--text); }
.zusage__var {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
}
.zusage__kopf { font-weight: 600; font-size: var(--t-body); color: var(--text); }
.zusage__text { font-size: var(--t-sm); color: var(--text-muted); line-height: 1.5; }
/* Wochenkarte (v1.35): Vorschau im Blatt, Seitenverhältnis 4:5 wie das Bild. */
.card__aktionen { display: flex; align-items: center; gap: 2px; }
.wochenkarte { aspect-ratio: 4 / 5; max-height: 56vh; margin: 0 auto; display: grid; place-items: center;
  border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow-2); }
.wochenkarte img { width: 100%; height: 100%; object-fit: contain; display: block; }
.wochenkarte__lade { font-size: var(--t-sm); color: var(--text-muted); }
.zusage__absagen { margin: var(--s-1) 0 0; font-size: var(--t-sm); color: var(--text-faint); line-height: 1.5; }

/* Zieleditor */
.goallist { display: flex; flex-direction: column; gap: var(--s-2); }
.goalrow {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--s-3); background: var(--surface);
}
.goalrow__head { display: flex; align-items: center; gap: var(--s-2); }
.goalrow__name {
  flex: 1; font-size: var(--t-body); font-weight: 600; display: flex; align-items: center; gap: 7px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.goalrow__tags { display: inline-flex; gap: 5px; overflow: hidden; }
.goals__which {
  font-size: var(--t-sm); font-weight: 600; color: var(--text-muted);
  background: var(--surface-3); border-radius: var(--radius-sm);
  padding: 6px 10px; margin-bottom: 2px;
}
.relief { display: flex; flex-direction: column; gap: var(--s-2); }
.reliefrow {
  display: flex; align-items: center; gap: var(--s-2);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--s-3); background: var(--surface);
}
.reliefrow__txt { flex: 1; min-width: 0; }
.reliefrow__title { font-size: var(--t-body); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.reliefrow__time { font-size: var(--t-sm); color: var(--text-faint); margin-top: 2px; }
.reliefrow .goal__dot { background: var(--area-dot); }

/* Tagesabschluss (Stufe 13 Teil E) — drei Aktionen statt zwei, darum eigene
   Zeile statt .reliefrow: Titel oben, Aktionen darunter im eigenen, umbrechenden
   Streifen. Nebeneinander wie bei .reliefrow würde auf 320px überlaufen. */
.abschlussliste { display: flex; flex-direction: column; gap: var(--s-2); margin-bottom: var(--s-3); }
.abschlussrow {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--s-3); background: var(--surface);
}
.abschlussrow__title { font-size: var(--t-body); font-weight: 600; display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.abschlussrow__zeit { margin-left: auto; font-size: var(--t-sm); color: var(--text-faint); font-weight: 400; }
.abschlussrow__acts { display: flex; gap: 6px; flex-wrap: wrap; }
.abschlussrow__acts .btn { flex: 1 1 auto; }
.abschlussrow .goal__dot { background: var(--area-dot); }
.tag {
  font-size: var(--t-xs); font-weight: 600; letter-spacing: .02em;
  padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-3); color: var(--text-muted);
}
.tag--soft { background: transparent; border: 1px dashed var(--border-strong); }
.goalrow__h { width: 78px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.goalrow__unit { font-size: var(--t-sm); color: var(--text-faint); flex: none; }
.goalrow__more {
  border: none; background: transparent; color: var(--text-faint);
  width: 30px; min-height: 30px; border-radius: var(--radius-sm); flex: none; font-size: var(--t-sm);
}
.goalrow__more:hover { background: var(--surface-2); color: var(--text); }
.goalrow__body {
  margin-top: var(--s-3); padding-top: var(--s-3);
  border-top: 1px dashed var(--border);
}
.goalrow__body[hidden] { display: none; }
.goalrow__art, .goalrow__grob { display: flex; gap: 6px; margin-top: var(--s-2); flex-wrap: wrap; }
.goalrow__art .chip, .goalrow__grob .chip { font-size: var(--t-sm); padding: 5px 10px; min-height: 32px; }
@media (pointer: coarse) { .goalrow__art .chip, .goalrow__grob .chip { min-height: 44px; padding: 5px 12px; } }
.goalrow__arthint, .goalrow__grobhint { font-size: var(--t-xs); color: var(--text-faint); margin-top: 6px; }
.wegrow { display: flex; align-items: center; gap: var(--s-2); margin-bottom: 6px; }
.wegrow__txt { flex: 1; font-size: var(--t-sm); min-width: 0; }
.wegrow__min { width: 74px; flex: none; text-align: right; }
.ampel { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm);
  color: var(--text-muted); margin-bottom: var(--s-2); }
.ampel__bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-3);
  overflow: hidden; position: relative; }
.ampel__fill {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  border-radius: 99px; transform-origin: left; transition: transform .25s;
}
.ampel__mark { position: absolute; top: -2px; bottom: -2px; width: 1px;
  background: var(--text-faint); opacity: .55; }
.goalrow__sub { font-size: var(--t-sm); color: var(--text-faint); margin: 0 0 var(--s-2); }

/* Vorschlagsblöcke im Raster */
.block.is-sug {
  border-style: dashed;
  border-left-style: dashed;
  background: transparent;
  box-shadow: none;
  cursor: grab;
}
.block.is-sug::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--area-bg); opacity: .55;
}
.block.is-sug .block__title { opacity: .9; padding-right: 44px; background: none; }
.block.is-sug .block__time { opacity: .6; }
.block__sug { position: absolute; right: 3px; top: 3px; display: flex; gap: 3px; z-index: 3; }
.block__sug button {
  width: 19px; height: 19px; padding: 0; border-radius: 5px;
  border: 1px solid var(--area-edge); background: var(--surface);
  color: var(--area-text); font-size: var(--t-xs); line-height: 1;
  display: grid; place-items: center; box-shadow: var(--shadow-1);
}
.block__sug button:hover { background: var(--area-bg-2); }
.block.is-short .block__sug { display: none; }
.block.is-short .block__title { padding-right: 0; min-width: 0; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }

/* ============================================================ Aufgaben */
.tasks { display: flex; flex-direction: column; gap: 2px; }
.task {
  display: flex; align-items: flex-start; gap: var(--s-2);
  padding: var(--s-2); border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid transparent;
  transition: background .15s, border-color .15s;
  cursor: grab;
}
.task:hover { border-color: var(--border); }
.task.is-dragging { opacity: .4; }
.task__check {
  appearance: none; width: 18px; height: 18px; margin: 2px 0 0; flex: none;
  border: 1.5px solid var(--border-strong); border-radius: 50%; background: var(--surface);
  cursor: pointer; transition: background .15s, border-color .15s; position: relative;
}
.task__check:checked { background: var(--ink); border-color: var(--ink); }
.task__check:checked::after {
  content: ""; position: absolute; left: 5px; top: 2px;
  width: 4px; height: 8px; border: solid var(--on-ink);
  border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.task__body { flex: 1; min-width: 0; min-height: 44px; cursor: pointer; }
.task__title { font-size: var(--t-body); overflow-wrap: anywhere; line-height: 1.4; }
.task.is-done .task__title { text-decoration: line-through; color: var(--text-faint); }
.task__star {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text); margin-right: 5px; vertical-align: middle;
}
.task__meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 4px;
  font-size: var(--t-xs); color: var(--text-muted);
}
.task__dur {
  margin-left: 4px; padding-left: 7px; border-left: 1px solid var(--border);
  color: var(--text-faint);
}
.task__more {
  flex: none; border: 0; background: transparent; color: var(--text-muted);
  font-size: var(--t-h2); letter-spacing: 1px; line-height: 1;
  padding: 4px 8px; border-radius: 8px; align-self: center;
  transition: background .15s, color .15s;
}
.task__more:hover { background: var(--surface-2); color: var(--text); }
/* Stufe 14: der direkte Weg in den Plan, nur an Zeilen ohne Platz — die
   einzige Stelle auf diesem Bildschirm, an der der Akzent (--ink) für eine
   Primäraktion steht, statt nur für Zustand (Häkchen). */
.task__go {
  flex: none; align-self: center; border: 0; border-radius: 8px;
  background: var(--selected); color: var(--selected-text);
  min-width: 44px; min-height: 44px; padding: 4px 8px;
  font-size: var(--t-sm); font-weight: 600; line-height: 1;
  transition: background .15s;
}
.task__go:hover { background: var(--surface-3); }
.task__body:focus-visible { outline-offset: 4px; }
.taskadd { display: flex; gap: var(--s-2); margin-bottom: var(--s-3); }
.taskadd .field { min-height: 44px; min-width: 0; }
.taskadd .btn { min-width: 44px; }

/* Stufe 14: Gliederung der Aufgabenliste — Abschnittsköpfe und der
   Tagesschwerpunkt teilen sich die Sprache der Agenda (.agenda__label,
   .agenda__frog, .agenda__foot), dieselbe Karte-in-der-Karte-Vermeidung:
   ein Strich, keine Fläche. */
.tasks__invite {
  display: block; padding: 4px 0 10px; border-bottom: 1px solid var(--border);
  font-size: var(--t-sm); color: var(--text-muted); line-height: 1.5;
}
.tasks__toggle {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
  width: 100%; min-height: 44px; padding: 0; border: none; background: transparent;
}

.empty {
  text-align: center; padding: var(--s-5) var(--s-3);
  color: var(--text-faint); font-size: var(--t-sm); line-height: 1.6;
}
.empty b { display: block; color: var(--text-muted); font-size: var(--t-body); margin-bottom: 4px; }

/* ============================================================ Wochenraster */
/* min-height:0 ist hier nicht optional — ohne das wächst das Raster über
   den Bildschirm hinaus und schiebt das Band unter den Rand. */
.planwrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.gridwrap { flex: 1; min-width: 0; overflow: auto; position: relative; background: var(--bg); }
/* Leerzustand des Rasters — als Grid-Kind über die volle Breite gelegt
   (grid-column/-row per JS, s. renderGrid) statt separat positioniert, damit
   er unter dem Tageskopf bleibt statt ihn zu verdecken. pointer-events:none
   lässt Ziehen/Antippen der leeren Fläche darunter unangetastet. */
.grid > .empty { pointer-events: none; padding-top: var(--s-6); }

/* ============================================================
   Band für grob geplante Zeit

   Bewusst ohne Zeitachse und ohne scharfe Kanten: was hier steht, hat
   keine Uhrzeit und soll auch keine vortäuschen.
   ============================================================ */
.loose {
  flex: none; border-top: 1px solid var(--border);
  background: var(--surface); padding: var(--s-2) 0;
  display: grid; grid-template-columns: var(--gutter, 56px) repeat(var(--lcols, 7), minmax(0, 1fr));
  max-height: 34dvh; overflow-y: auto;
  overscroll-behavior: contain;
}
.loose__lab {
  grid-column: 1; font-family: var(--font-display); font-size: var(--t-xs); font-weight: 700;
  color: var(--text-muted);
  padding: 4px var(--s-2) 0 0; text-align: right; align-self: start;
}
.loose__cell { padding: 2px 3px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.loosechip {
  --area-bg: oklch(0.950 0.048 var(--h)); --area-line: oklch(0.605 0.150 var(--h));
  --area-text: oklch(0.350 0.090 var(--h));
  display: flex; align-items: baseline; gap: 5px;
  border: 1px dashed var(--area-line); border-radius: 999px;
  background: var(--area-bg); color: var(--area-text);
  padding: 5px 10px; min-height: 30px; text-align: left;
  font-size: var(--t-xs); font-weight: 600; line-height: 1.2;
  overflow: hidden;
}
html[data-theme="dark"] .loosechip {
  --area-bg: oklch(0.320 0.060 var(--h)); --area-line: oklch(0.740 0.150 var(--h));
  --area-text: oklch(0.945 0.035 var(--h));
}
.loosechip:hover { filter: brightness(0.97); }
html[data-theme="dark"] .loosechip:hover { filter: brightness(1.12); }
.loosechip.is-sug { opacity: .72; }
.loosechip__t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loosechip.is-done { opacity: .5; text-decoration: line-through; }
.loosechip__d { flex: none; opacity: .75; font-variant-numeric: tabular-nums; font-weight: 500; }
.loose__hint {
  grid-column: 1 / -1; font-size: var(--t-xs); color: var(--text-faint);
  padding: 2px var(--s-3) 4px calc(var(--gutter, 56px) + 3px);
}

/* Am Telefon ist links kein Platz für eine Beschriftungsspalte —
   der Abschnitt steht als Zeile über seinen Einträgen. */
@media (max-width: 1100px) {
  body[data-tage="1"] .loose { grid-template-columns: 1fr; padding: var(--s-1) 0 var(--s-2); }
  body[data-tage="1"] .loose__lab { text-align: left; padding: 6px var(--s-3) 2px; }
  body[data-tage="1"] .loose__cell { padding: 0 var(--s-3); }
  body[data-tage="1"] .loose__hint { padding: 4px 76px 0 var(--s-3); }
}
.grid {
  display: grid;
  grid-template-columns: var(--gutter) repeat(var(--cols), minmax(var(--colmin), 1fr));
  min-width: 100%;
  --gutter: 56px;
  --colmin: 0px;
  --hourh: 52px;
}
.dayhead {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  border-left: 1px solid var(--border);
  padding: var(--s-2) var(--s-2) var(--s-3);
  text-align: center;
}
.dayhead--gutter { border-left: 0; }
.dayhead.is-frei { background: var(--surface-2); }
/* v1.33: „frei" ist ein kleiner Aufkleber, leicht schräg aufgeklebt — ein
   freigehaltener Tag ist etwas, worauf man sich freut. */
.dayhead__frei {
  display: inline-block; font-family: var(--font-display); font-size: var(--t-xs); font-weight: 700;
  color: var(--selected-text); background: var(--selected); border-radius: 999px;
  padding: 1px 8px; margin-top: 3px; transform: rotate(-4deg);
}
/* Ein freier Tag ist nicht leer — er ist geschützt. Darum eine ruhige
   Fläche statt einer Sperrschraffur. */
.daycol.is-frei { background: oklch(0.62 0.14 150 / .05); }
html[data-theme="dark"] .daycol.is-frei { background: oklch(0.72 0.14 150 / .07); }
.dayswitch__btn.is-frei { background: oklch(0.62 0.14 150 / .10); }
html[data-theme="dark"] .dayswitch__btn.is-frei { background: oklch(0.72 0.14 150 / .13); }
.dayhead__name { font-size: var(--t-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
.dayhead__num {
  font-size: var(--t-h1); font-weight: 700; font-variant-numeric: tabular-nums;
  width: 32px; height: 32px; line-height: 32px; margin: 2px auto 0;
  border-radius: 50%;
}
.dayhead.is-today .dayhead__num { background: var(--ink); color: var(--on-ink); }
.dayhead.is-today .dayhead__name { color: var(--text); }
/* v1.31: der Kopf ist der Tageswähler des Desktops (Agenda links folgt ihm)
   — also sieht er aus und verhält sich wie der Tagesstreifen am Telefon:
   gewählter Tag hinterlegt, per Tastatur erreichbar. */
.dayhead:not(.dayhead--gutter) { cursor: pointer; }
.dayhead:not(.dayhead--gutter):hover { background: var(--surface-2); }
.dayhead[aria-pressed="true"], .dayhead[aria-pressed="true"]:hover { background: var(--surface-3); }
.dayhead:focus-visible { outline: 2px solid var(--focus); outline-offset: -3px; }
/* Wie voll ist der Tag — dieselbe tagesAuslastung() und dieselbe 65-%-Marke
   wie der Balken im Tagesstreifen. Die Zahl steht daneben, weil am Desktop
   Platz dafür ist: „wo ist noch Luft" liest man so, ohne zu rechnen. */
.dayhead__last {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 4px; min-height: 16px;
}
.dayhead__last i {
  width: 22px; height: 3px; border-radius: 2px; flex: none;
  background: linear-gradient(to right,
    var(--last-farbe, var(--text-faint)) 0 var(--last, 0%),
    var(--surface-3) var(--last, 0%) 100%);
}
.dayhead[aria-pressed="true"] .dayhead__last i { background: linear-gradient(to right,
    var(--last-farbe, var(--ink)) 0 var(--last, 0%), var(--border) var(--last, 0%) 100%); }
.dayhead.is-voll .dayhead__last i { --last-farbe: var(--warn); }
.dayhead__std { font-size: var(--t-xs); font-variant-numeric: tabular-nums; color: var(--text-muted); white-space: nowrap; }
.dayhead.is-voll .dayhead__std { color: var(--text); font-weight: 600; }
.dayhead__energy {
  display: none; align-items: flex-end; gap: 2px; height: 11px; margin-top: 4px;
}
.dayhead[data-energy] .dayhead__energy { display: inline-flex; }
.dayhead__last .dayhead__energy { margin-top: 0; }
.dayhead__energy i { width: 3px; border-radius: 1px; background: var(--border-strong); }
.dayhead__energy i:nth-child(1){height:5px} .dayhead__energy i:nth-child(2){height:8px} .dayhead__energy i:nth-child(3){height:11px}
.dayhead[data-energy="low"] .dayhead__energy i:nth-child(1){background:var(--warn)}
.dayhead[data-energy="mid"] .dayhead__energy i:nth-child(-n+2){background:var(--focus)}
.dayhead[data-energy="high"] .dayhead__energy i{background:var(--success)}

.timecol { grid-column: 1; position: relative; background: var(--bg); }
.timecol__mark {
  position: absolute; right: var(--s-2); transform: translateY(-50%);
  font-size: var(--t-xs); font-variant-numeric: tabular-nums; color: var(--text-faint);
}
.daycol {
  position: relative; border-left: 1px solid var(--border);
  background: var(--surface);
  /* pinch-zoom ausdruecklich dazu, sonst nimmt "pan-y" allein dem Browser
     jede andere Standardgeste weg — auch das Zwei-Finger-Zoomen, das vorher
     nie eingeschraenkt war. Nie "none": das Raster muss senkrecht scrollbar
     bleiben, das Wischen zum Tagwechsel (wischenEinrichten) greift nur ein,
     wenn es selbst dx/dy auswertet, es blockiert nichts per touch-action. */
  touch-action: pan-y pinch-zoom;
}
.daycol.is-weekend { background: var(--surface-2); }
.daycol__line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
.daycol__line--half { border-top-style: dotted; opacity: .6; }
.now {
  position: absolute; left: 0; right: 0; height: 0; z-index: 7; pointer-events: none;
  border-top: 2px solid var(--danger);
}
.now::before {
  content: ""; position: absolute; left: -4px; top: -5px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
}

.block {
  position: absolute; left: 3px; right: 3px; z-index: 8;
  border-radius: var(--radius-sm);
  border: 1px solid var(--area-edge);
  border-left: 4px solid var(--area-line);
  background: var(--area-bg);
  color: var(--area-text);
  padding: 4px 6px;
  /* clip statt hidden: schneidet ab, erzeugt aber keinen eigenen
     Scroll-Bereich - erst dadurch kann der Titel unten sticky bleiben */
  overflow: clip;
  text-align: left;
  font: inherit;
  cursor: grab;
  transition: box-shadow .15s, filter .15s;
}
.block:hover { box-shadow: var(--shadow-1); filter: brightness(0.985); z-index: 9; }
html[data-theme="dark"] .block:hover { filter: brightness(1.12); }
.block.is-dragging { opacity: .75; box-shadow: var(--shadow-2); z-index: 30; cursor: grabbing; }
.block__title {
  font-size: var(--t-sm); font-weight: 600; line-height: 1.25;
  /* Nur an Wortgrenzen umbrechen. „Vorlesu ng Statisti k" war unlesbar -
     lieber ein zu langes Wort abschneiden als es mittendrin zerhacken.
     Auf iOS und Safari trennt hyphens zusaetzlich sauber nach Silben. */
  overflow-wrap: normal; word-break: normal; hyphens: auto;
  /* Laeuft ein langer Block oben aus dem Bild, bleibt die Beschriftung
     stehen statt unsichtbar zu werden - unterhalb der Tagesleiste,
     sonst verschwindet sie dahinter. --kopf misst renderGrid() am echten
     Tageskopf (v1.31: die feste 58px lag am Desktop hinter dem ~89px hohen
     Kopf, und am Telefon, wo es im Raster keinen Kopf gibt, 58px zu tief). */
  position: sticky; top: var(--kopf, 58px);
  /* Die Zeitzeile läuft beim Kleben darunter durch statt durch den Titel
     hindurch — derselbe Grund wie der Block, unsichtbar, solange nichts klebt. */
  background: var(--area-bg); z-index: 1;
}
.block__time { font-size: var(--t-xs); opacity: .78; font-variant-numeric: tabular-nums; }
/* Begründungszeile (Stufe 11) — dieselbe Idee wie .agenda__sub (Ort-/Wegzeit-
   Zeile), aber über opacity statt fester Farbe: sitzt auf der bereichseigenen
   --area-bg und muss darauf lesbar bleiben, nicht auf der Seiten-Fläche. */
.block__grund { font-size: var(--t-xs); opacity: .65; margin-top: 1px; line-height: 1.3; }
.block.is-short { padding: 1px 6px; display: flex; align-items: center; gap: 6px; }
.block.is-short .block__time { display: none; }
.block.is-done { opacity: .55; }
.block.is-done .block__title { text-decoration: line-through; text-decoration-thickness: 1px; }
/* v1.34: der Haken am Termin war unsichtbar, bis er gesetzt war — ein
   leeres 13×12-Feld, das niemand fand. Jetzt ein Ring im Bereichston: am
   Telefon immer da, mit Maus beim Überfahren/Fokus; gesetzt ein gefüllter
   Kreis mit gezeichnetem Häkchen (kein Schriftzeichen). */
.block__done {
  appearance: none; position: absolute; right: 5px; bottom: 5px;
  width: 16px; height: 16px; margin: 0; padding: 0; z-index: 4;
  border: 1.5px solid var(--area-line); border-radius: 50%;
  background: var(--area-bg); cursor: pointer;
  transition: opacity .15s, background-color .15s, transform .15s;
}
.block__done::after {
  content: ""; position: absolute; left: 4.5px; top: 1.5px;
  width: 3.5px; height: 7px; border: solid var(--area-bg);
  border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0;
}
.block__done:checked { background: var(--area-line); }
.block__done:checked::after { opacity: 1; }
.block.is-short .block__done { bottom: auto; top: 50%; width: 14px; height: 14px; margin-top: -7px; }
.block.is-short .block__done::after { left: 3.5px; top: 1px; width: 3px; height: 6px; }
/* Zwei Zeilen füllen einen knappen Block — dort hält der Text rechts Platz
   für den Ring frei, statt unter ihm zu verschwinden. */
.block.is-knapp:not(.is-sug) .block__title, .block.is-knapp:not(.is-sug) .block__time { padding-right: 20px; }
/* Sieben schmale Spalten am Touchgerät (Tablet, Telefon quer) sind die
   Übersicht — wie .block__sug dort bleibt der Ring an knappen Blöcken weg,
   statt kurze Titel zu zerstückeln. Abhaken: Tagesansicht oder „Heute". */
@media (pointer: coarse) {
  body[data-tage="7"] .block.is-knapp .block__done, body[data-tage="7"] .block.is-short .block__done { display: none; }
  body[data-tage="7"] .block.is-knapp .block__title, body[data-tage="7"] .block.is-knapp .block__time { padding-right: 0; }
}
@media (hover: hover) and (pointer: fine) {
  .block__done:not(:checked) { opacity: 0; }
  .block:hover .block__done, .block:focus-within .block__done, .block__done:focus-visible { opacity: 1; }
  .block__done:hover { transform: scale(1.12); }
}
@media (pointer: coarse) {
  .block__done::before { content: ""; position: absolute; inset: -9px; }
}
/* Tagesschwerpunkt: kein Emoji, keine breitere Kante (verschlimmert den
   side-tab-Befund nur) - stattdessen ein gezeichneter Punkt oben rechts
   plus fetter Titel. ::after ist frei, .is-done belegt bereits ::before. */
.block.is-frog::after {
  content: ""; position: absolute; top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--area-text);
}
.block.is-frog .block__title { font-weight: 700; }
.block__resize {
  position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
  cursor: ns-resize;
}
/* touch-action:none gehoert nur der Maus-Groessenaenderung (attachColumnHandlers
   prueft dort e.pointerType === "mouse") — mit dem Finger gibt es sie (noch)
   nicht, dann war der Streifen nur eine 14px hohe Totzone, die das sonst
   erlaubte senkrechte Scrollen (.daycol, pan-y) verschluckt hat. */
@media (pointer: fine) {
  .block__resize { touch-action: none; }
}
.block__ghost {
  position: absolute; left: 3px; right: 3px; z-index: 12;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--area-line);
  background: var(--area-bg);
  opacity: .8; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-xs); font-weight: 600; color: var(--area-text);
  font-variant-numeric: tabular-nums;
}
.daycol.is-droptarget { background: var(--surface-3); }
.gridwrap.wisch-links  .grid { animation: wischL .2s ease-out; }
.gridwrap.wisch-rechts .grid { animation: wischR .2s ease-out; }
@keyframes wischL { from { transform: translateX(26px); opacity: .45 } }
@keyframes wischR { from { transform: translateX(-26px); opacity: .45 } }
.block__ghost.is-holding {
  opacity: 0; animation: hold var(--holdms, 380ms) ease-out forwards;
}
@keyframes hold {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: .85; transform: scale(1); }
}

/* Nachtruhe — dezent hinterlegt, blockiert aber nichts */
.rest {
  position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
  background: var(--surface-3);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0.5 0.02 var(--h-ink) / 0.055) 5px 10px);
}
html[data-theme="dark"] .rest {
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, oklch(0 0 0 / 0.16) 5px 10px);
}

/* ============================================================ Mobile day switcher */
.dayswitch {
  display: none; grid-template-columns: minmax(0, 1fr);
  padding: 4px 0; border-top: 1px solid var(--glas-linie);
  background: transparent; overflow: hidden; position: relative;
}
/* v1.41: das Band scrollt selbst (waagerecht, mit Schwung), rastet je Tag
   ein und zeigt immer sieben Tage. Die Leiste darum läuft nie über. */
.dayswitch__band {
  --band-rand: 4px;
  position: relative;
  display: grid; grid-auto-flow: column; gap: 3px;
  grid-auto-columns: calc((100% - 6 * 3px) / 7);   /* 100 % = Inhaltsbreite, Rand schon abgezogen */
  padding: 0 var(--band-rand); scroll-padding: 0 var(--band-rand);
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  touch-action: pan-x pan-y pinch-zoom;
}
.dayswitch__band::-webkit-scrollbar { display: none; }
.dayswitch__band > .dayswitch__btn { scroll-snap-align: start; }
.dayswitch__heute {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%); z-index: 2;
  min-height: 36px; padding: 0 14px; border: none; border-radius: 999px;
  background: var(--lime); color: var(--on-lime);
  font-family: var(--font-display); font-size: var(--t-sm); font-weight: 800;
  box-shadow: 0 6px 18px oklch(0.25 0.04 155 / .25);
}
.dayswitch__heute.is-links { right: auto; left: 8px; }
.dayswitch__heute::before { content: ""; position: absolute; inset: -4px; }
/* Die Woche wird bereits über die Pfeile im Kopf gewechselt. Ohne zweite
   Pfeilreihe bekommen alle sieben Tage auch auf 320px eine Trefferfläche
   nahe 44px; Tastatur- und sichtbare Reihenfolge bleiben gleich. */
.dayswitch__btn {
  min-width: 0; min-height: 46px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; padding: 3px 1px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.dayswitch__btn span {
  font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-muted); line-height: 1.1;
}
.dayswitch__btn b { font-size: var(--t-h2); font-variant-numeric: tabular-nums; line-height: 1.15; }
/* "Heute" bekommt geraeteuebergreifend dieselbe Form wie am Desktop: dort
   ist .dayhead__num immer ein Kreis (border-radius:50%), gefuellt wird er
   nur fuer den heutigen Tag (.dayhead.is-today). Vorher stand hier ein von
   Hand gesetztes style.color = var(--focus) in renderDaySwitch — --focus
   ist die Fokusringfarbe, keine Markierung fuer "heute". 28px bei
   font-size t-h2 wie schon .dayhead__num im Tablet-Layout (~1245). */
.dayswitch__btn.is-today b {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: var(--on-ink);
}
.dayswitch__btn[aria-pressed="true"] { background: var(--surface-3); border-color: var(--border-strong); }
/* Wie voll ist dieser Tag?

   Die Eintagesansicht ist am Telefon richtig — sieben Spalten auf 390 Pixeln
   kann niemand lesen. Sie kostet aber die Woche: „an welchem Tag ist noch
   Luft" war nur noch durch Durchblättern zu beantworten. Der Punkt unter dem
   Datum sagte lediglich „da ist irgendwas".

   Jetzt ist er ein Balken. Voll heißt: an dieser Marke reißen Pläne — dieselben
   65 %, die auch die Ampel bei den Wochenzielen benutzt. Damit steht die
   Wochenverteilung wieder im Bild, ohne den Tag zu verlassen. */
.dayswitch__btn i {
  width: 20px; height: 3px; border-radius: 2px; flex: none;
  background: linear-gradient(to right,
    var(--last-farbe, var(--text-faint)) 0 var(--last, 0%),
    var(--surface-3) var(--last, 0%) 100%);
}
.dayswitch__btn.is-voll i { --last-farbe: var(--warn); }
.dayswitch__btn[aria-pressed="true"] i { --last-farbe: var(--ink); }
.dayswitch__btn[aria-pressed="true"].is-voll i { --last-farbe: var(--warn); }

/* Tastenkürzel (v1.31, kuerzelSheet) */
.kuerzel { margin: 0; display: grid; gap: 2px; }
.kuerzel__zeile {
  display: grid; grid-template-columns: 88px 1fr; gap: var(--s-3); align-items: baseline;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.kuerzel__zeile:last-child { border-bottom: 0; }
.kuerzel dt { margin: 0; white-space: nowrap; }
.kuerzel dd { margin: 0; font-size: var(--t-body); color: var(--text-muted); line-height: 1.45; }
.kuerzel kbd {
  display: inline-block; min-width: 26px; padding: 2px 7px; text-align: center;
  font-family: inherit; font-size: var(--t-sm); font-weight: 600; line-height: 1.4; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-bottom-width: 2px; border-radius: 6px;
}

/* ============================================================ Sheet / Modal */
.scrim {
  position: fixed; inset: 0; top: var(--sicht-oben); bottom: auto; height: var(--sicht-hoehe); z-index: 60;
  background: oklch(0.2 0.02 var(--h-ink) / 0.45);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: var(--s-4);
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0 } }
.sheet {
