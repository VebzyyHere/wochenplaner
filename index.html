.sheet { animation: blattMitte .42s var(--feder), blattBlende .2s ease; }
.scrim.is-zurueck, .scrim.is-zurueck .sheet { animation: none; }
/* Die Fläche blendet, nicht die Deckkraft: das Blatt ist Kind des Scrims
   und würde sonst beim Hereinfedern durchscheinen. */
@keyframes blattScrim { from { background-color: transparent; } }
@keyframes blattBlende { from { opacity: 0; } }
@keyframes blattMitte { from { transform: translateY(4%) scale(.96); } }
@keyframes blattFeder { from { transform: translateY(100%); } }
@media (max-width: 640px) {
  /* Die Feder schießt ein Stück über das Ziel hinaus — der zweite, flache
     Schatten in Blattfarbe füllt die Lücke darunter (in Ruhe liegt er
     unterhalb des Bildschirms). */
  .sheet { animation: blattFeder .46s var(--feder); box-shadow: var(--shadow-3), 0 48px 0 var(--surface); }
}
.blatt-abgang { pointer-events: none; }

/* ---- Kontraste nachgeschärft (gemessen mit kontrastlauf.js) ------------- */
/* Rasterblöcke: Uhrzeit und Begründung trugen eigene Deckkraft (.78/.65),
   in Vorschlägen (.6) und erledigten Blöcken (Block .82) multipliziert sich
   das unter 4.5:1. Vorschläge sprechen jetzt wie ihr Titel in --text-muted;
   im erledigten Block bleibt nur die Deckkraft des Blocks. */
.block.is-sug :is(.block__time, .block__grund) { opacity: 1; color: var(--text-muted); }
.block.is-done :is(.block__time, .block__grund) { opacity: 1; }
/* Die Konto-Pille ist ein Knopf ohne Füllung — Rand wie .btn. */
.syncbadge { background: transparent; border: 1.5px solid var(--rand); }
/* Schlafenszeit aus: gedämpft werden nur die abgeschalteten Felder samt
   Beschriftung, nicht der Satz, der erklärt, was ohne Schlafenszeit gilt. */
#sSleepBody:has(.field:disabled) { opacity: 1 !important; }
#sSleepBody:has(.field:disabled) > :not(#sSleepHint) { opacity: .45; }

/* Ansichtswechsel (nur ansichtWechseln(), also Nutzerwege): die neue
   Ansicht blendet auf und wächst aus 98,5 % um ihre sichtbare Mitte
   (transform-origin setzt das Skript). Bewegt wird nur, was wechselt —
   Kopf, Reiter und Tabbar stehen; am Desktop bleibt das Raster ruhig. */
@keyframes einblenden { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
.main.is-wechsel > .panel, .main.is-wechsel > .planwrap { animation: none; }
.main.is-wechsel[data-wechsel="panel"] > .panel > .card,
.main.is-wechsel[data-wechsel="plan"] > .planwrap > :is(.planhead, .gridwrap, .loose) {
  animation: einblenden .24s cubic-bezier(.2, .8, .2, 1);
}
</style>
</head>
<body>
<a href="#main" class="sr">Zum Inhalt</a>

<div class="app">
  <!-- v1.32: Banner, Kopfzeile und Tagesstreifen bilden einen gemeinsamen
       Kopf. Am Telefon liegt er als Glasfläche über dem Inhalt (s. .kopf). -->
  <div class="kopf" id="kopf">
  <div id="banner"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="10" fill="currentColor"/><path d="M10 24V16m8 8V10m8 14v-9" fill="none" stroke="var(--on-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="brand__copy"><span class="brand__name">Wochenplaner</span><span class="brand__tagline">Platz für das, was zählt.</span></div>
      <span class="brand__who" id="whoLabel"></span>
    </div>

    <div class="weeknav">
      <button class="btn btn--icon btn--ghost" id="prevWeek" aria-label="Woche zurück"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
      <button type="button" class="weeknav__label" id="weekLabel" aria-label="Wochenübersicht anzeigen"></button>
      <button class="btn btn--icon btn--ghost" id="nextWeek" aria-label="Woche vor"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 5 5-5 5"/></svg></button>
    </div>

    <button type="button" class="btn btn--icon btn--ghost" id="monthBtn" aria-label="Monatsübersicht anzeigen" title="Monatsübersicht">
      <svg class="monthbtn__ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 13.5h2M12 13.5h2M17 13.5h1M7 17.5h2M12 17.5h2"/></svg>
    </button>
    <button class="syncbadge" id="syncBadge" hidden></button>
    <button class="btn btn--sm" id="todayBtn">Heute</button>
    <button class="btn btn--icon btn--ghost" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.6-2 3.5 1.6 1.6v2.8L2.4 15l2 3.5 2-.6 2 .9L9 21h4l.6-2.2 2-.9 2 .6 2-3.5-1.6-1.6v-2.8L19.6 9l-2-3.5-2 .6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button>
  </header>

  <nav class="dayswitch" id="daySwitch" aria-label="Tag wählen"></nav>
  </div>

  <div class="main" id="main" role="main" aria-label="Wochenplaner" tabindex="-1">

    <aside class="panel">

      <nav class="panelnav" id="panelNav" aria-label="Arbeitsbereich wählen">
        <button type="button" data-panel="heute" aria-current="true">Heute</button>
        <button type="button" data-panel="ziele" aria-current="false">Ziele</button>
        <button type="button" data-panel="aufgaben" aria-current="false">Aufgaben</button>
      </nav>

      <!-- Tagesform -->
      <section class="card" data-card="heute">
        <div class="agenda" id="agenda"></div>
        <div class="card__head">
          <h2 class="card__title">Tagesform</h2>
          <span id="energyDay" style="font-size:var(--t-sm);color:var(--text-faint)"></span>
        </div>
        <div class="energy" role="group" aria-label="Wie viel Energie hast du heute?">
          <button class="energy__opt" data-lvl="low" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Wenig
          </button>
          <button class="energy__opt" data-lvl="mid" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Normal
          </button>
          <button class="energy__opt" data-lvl="high" aria-pressed="false">
            <span class="energy__bars" aria-hidden="true"><i></i><i></i><i></i></span>
            Viel
          </button>
        </div>
        <div class="hint" id="energyHint"></div>
        <div id="energyAct"></div>
        <label class="switch freischalter"><input type="checkbox" id="dayFrei"> <span id="dayFreiLab">Diesen Tag freihalten</span></label>
      </section>

      <!-- Wochenstart -->
      <section class="card ritual" data-card="ziele" id="ritualCard" hidden></section>

      <!-- Wochenziele -->
      <section class="card" data-card="ziele">
        <div class="card__head">

/* ============================================================

   │  HIER die beiden Werte aus Supabase eintragen,           │

   │                                                          │

   │    url : Project URL                                     │
   │    key : anon public key                                 │
   │                                                          │
   │  Der anon key darf öffentlich sein, das ist so gedacht.  │

   └──────────────────────────────────────────────────────────┘
   ============================================================ */
const SUPABASE = {

  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlandkc3h3aXB6bHV5ZXh6YXN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMDgzNTYsImV4cCI6MjEwMDg4NDM1Nn0.YSRXrKJam83F4ovTId_NyhGxIH6M5dbEReD1mF5lhzc"

/* ============================================================
   Speicher — versucht den Browser-Speicher, fällt sonst
   auf reinen Arbeitsspeicher zurück (z.B. in Vorschau-Frames).
   ============================================================ */
const Store = (() => {
  const BASE = "wochenplaner";
  const LEGACY = "wochenplaner.v1";
  // Pro Konto ein eigener Speicherplatz — sonst überschreiben sich zwei
  // Leute, die denselben Rechner benutzen, gegenseitig den Plan.
  let scope = "local";
  let available = false;
  let full = false;              // Browser-Speicher voll — einmal melden, nicht dauernd
  try {
    localStorage.setItem("__wp_test", "1");
    localStorage.removeItem("__wp_test");
    available = true;
  } catch (e) { available = false; }

  const key = () => BASE + "." + scope;

  return {
    available,
    get scope() { return scope; },
    setScope(s) { scope = s || "local"; },
    load() {
      if (!available) return null;
      try {
        let raw = localStorage.getItem(key());
        // Alte Fassung übernehmen (v1.0–v1.2 lag unter einem festen Schlüssel)
        if (!raw && scope === "local") {
          raw = localStorage.getItem(LEGACY);
          if (raw) localStorage.setItem(key(), raw);
        }
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    loadScope(s) {
      if (!available) return null;
      try { const raw = localStorage.getItem(BASE + "." + s); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    },
    save(data) {
      if (!available) return;
      try { localStorage.setItem(key(), JSON.stringify(data)); full = false; }
      catch (e) {
        // Ein voller Speicher wurde bisher verschluckt: die App meldete
        // „gespeichert", und beim nächsten Öffnen war alles weg.
        if (!full) {
          full = true;
          try { window.dispatchEvent(new CustomEvent("wp-speicher-voll")); } catch (e2) {}
        }
      }
    },
    get full() { return full; },
    clear() { if (available) { try { localStorage.removeItem(key()); } catch (e) {} } },

    /* Einmalige Sicherung, bevor migrate() zum ersten Mal einen Stand mit
       version < 9 anfasst (Stufe 9: Regeln wandern vom Bereich zum Vorhaben).
       Die Migration lief bisher nur gegen synthetische Daten — dieser Aufruf
       ist das Sicherheitsnetz für echte.
       Eigener Schlüssel neben dem eigentlichen Zustand, nicht darin: so bleibt
       die Sicherung außerhalb von snapshot()/mergeStates() und wird nie
       mitsynchronisiert — sie ist geräteseitig und je Konto (scope) getrennt.
       „Genau einmal" heißt: existiert der Schlüssel schon, wird nicht
       überschrieben, sonst wäre die Sicherung nach dem ersten fehlgeschlagenen
       Migrationsversuch schon wieder weg. */
    backupVorV9(s) {
      if (!available || !s || typeof s !== "object") return;
      if ((s.version || 0) >= 9) return;
      const k = key() + ".vor-v9";
      try {
        if (localStorage.getItem(k) !== null) return;
        localStorage.setItem(k, JSON.stringify(s));
      } catch (e) {
        // Wie bei save(): ein voller Speicher darf die App nicht aufhalten,
        // nur den vorhandenen Hinweis auslösen.
        if (!full) {
          full = true;
          try { window.dispatchEvent(new CustomEvent("wp-speicher-voll")); } catch (e2) {}
        }
      }
    },
    hasVorV9() {
      return available && localStorage.getItem(key() + ".vor-v9") !== null;
    },
    loadVorV9() {
      if (!available) return null;
      try {
        const raw = localStorage.getItem(key() + ".vor-v9");
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
  };
})();

/* ============================================================ Hilfen */
const $ = (sel, root = document) => root.querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, "0");
const fmtTime = m => pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
const parseTime = s => { const p = String(s).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const iso = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const DAY_LONG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const DAY_SHORT = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const off = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - off);
  return d;
}
function addDays(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() + n);
  return d;
}
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dn = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dn + 3);
  const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const fdn = (first.getUTCDay() + 6) % 7;
  first.setUTCDate(first.getUTCDate() - fdn + 3);
  return 1 + Math.round((d - first) / 604800000);
}

/* ============================================================ Zustand */
const DEFAULT_AREAS = [
  { id: "a1", name: "Arbeit",           hue: 248 },
  { id: "a2", name: "Uni & Lernen",     hue: 295 },
  { id: "a3", name: "Sport",            hue: 152 },
  { id: "a4", name: "Hobby",            hue: 88  },
  { id: "a5", name: "Freizeit & Pausen",hue: 196 },
  { id: "a6", name: "Menschen",         hue: 22  },
  { id: "a7", name: "Alltag",           hue: 330 }
];

/* ============================================================
   Art einer Tätigkeit — die eine Eigenschaft, aus der sich fast alles ableitet.

   Vorher musste man je Bereich vier Zahlen raten (kürzester Block, längster
   Block, frühestens, spätestens) und die Wirkung war unsichtbar. Die Art ist
   eine Entscheidung, die man versteht: „Sport ist Körper". Daraus ergeben sich
   Blocklänge, Pause danach und die bevorzugte Tageszeit.

   Die Pausenlänge folgt der geistigen Last: nach Kopfarbeit reichen fünf
   Minuten nicht, nach einem Spaziergang schon.
   ============================================================ */
const ARTEN = {
  kopf: {
    label: "Kopf", kurz: "Kopf",
    hint: "Arbeit, Lernen, alles was Konzentration kostet",
    min: 60, max: 120, pause: 20,
    // Früher am Tag ist besser, Vormittag bekommt einen Bonus
    zeit: (start, tagAnfang) => -(Math.max(0, start - tagAnfang) / 60 * 2.5)
                              + (start >= 480 && start <= 780 ? 10 : 0)
  },
  koerper: {
    label: "Körper", kurz: "Körper",
    hint: "Sport, Bewegung, alles Körperliche",
    min: 45, max: 90, pause: 15,
    // War 1.2 — Schwung über den ganzen Tag nur rund 11 Punkte, gegen die
    // Tagesbalance in slotScore (bis zu -140.8) chancenlos. Auf das Maß von
    // Erholung angehoben, damit „nach Feierabend" gegen einen mittelvollen
    // Tag wirklich zählt. Ganz gleichziehen würde die Balance aushebeln, die
    // sonst den ersten Wochentag alles fressen lässt (siehe slotScore).
    zeit: (start) => -Math.abs(start - 16 * 60) / 60 * 3
  },
  erholung: {
    label: "Erholung", kurz: "Erholung",
    hint: "Freizeit, Hobby, Zeit mit Menschen, Pausen für dich",
    min: 60, max: 180, pause: 10,
    // Erholung gehört in den Feierabend, nicht in den Vormittag —
    // und auch nicht in die letzte Stunde vor dem Schlafen.
    zeit: (start) => -Math.abs(start - 18.5 * 60) / 60 * 3
  },
  orga: {
    label: "Alltag", kurz: "Alltag",
    hint: "Haushalt, Erledigungen, Organisation",
    min: 30, max: 90, pause: 10,
    zeit: (start, tagAnfang) => -(Math.max(0, start - tagAnfang) / 60 * 1)
  }
};
const ART_REIHE = ["kopf", "koerper", "erholung", "orga"];

/* Art eines Bereichs, immer mit gültigem Rückfall. */
function artOf(area) {
  return ARTEN[(area && area.plan && area.plan.art)] || ARTEN.orga;
}

/* Erste Zuordnung für bestehende und neue Bereiche. Die sieben Standard-
   bereiche kennen wir; bei eigenen Namen raten wir über Stichworte und
   landen sonst bei „Alltag", der neutralen Art. */
const ART_STANDARD = { a1: "kopf", a2: "kopf", a3: "koerper",
                       a4: "erholung", a5: "erholung", a6: "erholung", a7: "orga" };
function artRaten(area) {
  if (ART_STANDARD[area.id]) return ART_STANDARD[area.id];
  const n = String(area.name || "").toLowerCase();
  if (/arbeit|job|büro|buero|uni|lern|studi|schule|projekt|fokus|deep/.test(n)) return "kopf";
  if (/sport|lauf|gym|fitness|yoga|schwimm|rad|training|bewegung/.test(n)) return "koerper";
  if (/freizeit|pause|hobby|menschen|freund|familie|serie|entspann|ruhe|spiel|musik|lesen/.test(n)) return "erholung";
  return "orga";
}

/* Plan-Einstellungen eines Bereichs — steuern Wochenziel und Vorschlag.
   goal 0 = kein Wochenziel. from/to null = ganzer sichtbarer Tag. */
/* ============================================================
   Grob statt genau

   Freizeit mit Uhrzeit ist keine Freizeit mehr. Tonietto & Malkoc haben das
   über dreizehn Studien gezeigt: eine verabredete Tätigkeit fühlt sich
   verpflichtender an und wird weniger genossen als dieselbe spontan — und
   im selben Papier steht die Lösung, „roughly scheduling without prespecified
   times" hebt den Effekt vollständig auf.

   Deshalb kennt ein Block hier zwei Genauigkeiten. Ein exakter Block liegt
   im Raster wie bisher. Ein grober hängt nur an einem Tagesabschnitt: „Samstag
   abends, ungefähr zwei Stunden". Er kann mit nichts kollidieren, muss nie
   umgeplant werden, und der Abend bleibt reserviert, ohne zerschnitten zu sein.
   ============================================================ */
const ABSCHNITTE = [
  { id: "vm", name: "vormittags", kurz: "Vorm.",  von: 0,        bis: 12 * 60 },
  { id: "nm", name: "nachmittags", kurz: "Nachm.", von: 12 * 60,  bis: 17 * 60 },
  { id: "ab", name: "abends",     kurz: "Abends", von: 17 * 60,  bis: 24 * 60 }
];
const abschnittVon = id => ABSCHNITTE.find(a => a.id === id) || ABSCHNITTE[2];

/* In welchen Abschnitt fällt eine Uhrzeit? */
function abschnittFuer(minute) {
  return (ABSCHNITTE.find(a => minute < a.bis) || ABSCHNITTE[2]).id;
}

/* Wie lange dauert ein Block — grobe zählen ihre Dauer, exakte ihre Spanne. */
function dauerVon(b) {
  return b.grob ? (b.dauer || 0) : (b.end - b.start);
}

function defaultPlan() {
  return {
    goal: 0, days: [0, 1, 2, 3, 4, 5, 6], from: null, to: null, min: 45, max: 120,
    // muss: Standard ist Pflicht. Wer nichts einstellt, soll nie erleben,
    // dass der Planer ihm etwas zum Streichen vorschlaegt, das ihm wichtig war.
    must: true,
    // pad: Wegzeit vor und nach einem Block dieses Bereichs, in Minuten.
    // Ab v1.7 nur noch Altlast — die Wegzeit hängt jetzt am Ortswechsel.
    pad: 0,
    // art: steuert Blocklänge, Pause danach und bevorzugte Tageszeit
    art: "orga",
    // ortId: Standardort für diesen Bereich, leer erlaubt
    ortId: null,
    // grob: plant dieser Bereich ohne feste Uhrzeit? Für Erholung ist das
    // der bessere Standard — siehe Kommentar oben. Hier bleibt es bei
    // false (gilt auch für neue, nutzer-angelegte Bereiche, die als
    // "orga" starten) — die Startbereiche selbst bekommen den besseren
    // Standard gezielt in freshState().
    grob: false,
    // keinVorschlag (Stufe 13 Teil F): der Verteiler lässt diesen Bereich
    // aus — gesetzt über das "×" im Vorschlags-Blatt, nicht hier.
    keinVorschlag: false
  };
}

/* Schlafenszeit samt Ruhezeit davor und danach.
   „wind" ist die Zeit zum Runterkommen und Fertigmachen — sie gehört
   genauso zur Nacht wie der Schlaf selbst und wird nicht verplant.
   Standardmäßig aus: der Planer setzt niemandem einen Rhythmus vor. */
function defaultSleep() {
  return { on: false, from: 22 * 60 + 30, to: 6 * 60 + 30, wind: 30 };
}

function freshState() {
  return {
    version: 8,
    profile: { id: uid(), name: "" },
    settings: { dayStart: 7, dayEnd: 22, theme: "auto", sleep: defaultSleep() },
    settingsAt: 0,
    // Stufe C Punkt C1: die Startbereiche bekommen ihren grob-Standard schon
    // hier passend zur Art gesetzt (a4/a5/a6 = "erholung" → grob:true) —
    // defaultPlan() selbst bleibt bei false, siehe Kommentar dort. Ohne das
    // hätte migrate()s v7-Migration (a.plan.grob = a.plan.art==="erholung")
    // nie gegriffen: sie greift nur bei fehlendem Feld, das frisch angelegte
    // Bereiche nie haben.
    areas: DEFAULT_AREAS.map(a => ({ ...a, plan: defaultPlan(), })).map(a =>
      ({ ...a, plan: { ...a.plan, art: ART_STANDARD[a.id] || "orga",
                        grob: (ART_STANDARD[a.id] || "orga") === "erholung" } })),
    orte: [],        // { id, name } — Wegzeiten hängen an Ortspaaren, nicht an Bereichen
    wege: {},        // { "id1>id2": minuten }
    blocks: [],
    tasks: [],
    days: {},
    tombs: {},        // gelöschte IDs mit Zeitpunkt — sonst kommen sie beim Sync zurück
    erledigt: {},     // "blockId|datum" -> { on, at } — abgehakt, pro Tag statt pro Serie
    rituale: {},      // "montag-datum" -> Zeitpunkt des Wochenstarts
    backupAt: 0,      // wann zuletzt eine Sicherung gespeichert wurde
    nagAt: 0          // wann zuletzt an eine Sicherung erinnert wurde
  };
}

let state = Store.load() || freshState();
migrate(state);

function migrate(s) {
  // Sicherung vor der v9-Migration — muss vor jeder Änderung an s stehen,
  // sonst wäre der „unveränderte" Stand schon nicht mehr unverändert.
  Store.backupVorV9(s);
  if (!s.profile) s.profile = { id: uid(), name: "" };
  if (!s.settings) s.settings = { dayStart: 7, dayEnd: 22, theme: "auto", sleep: defaultSleep() };
  if (!Array.isArray(s.areas) || !s.areas.length) s.areas = DEFAULT_AREAS.map(a => ({ ...a, plan: defaultPlan() }));
  if (!Array.isArray(s.blocks)) s.blocks = [];
  if (!Array.isArray(s.tasks)) s.tasks = [];
  // Optionaler Startschritt: ältere Sicherungen brauchen keine Umstellung.
  // Wertbasiert und idempotent, auch beim Import und beim Abgleich.
  s.tasks.forEach(t => {
    if (typeof t.schritt === "string" && t.schritt.trim()) t.schritt = t.schritt.trim().slice(0, 240);
    else delete t.schritt;
  });
  if (!s.days) s.days = {};
  // v2: Wochenziele + bevorzugte Zeitfenster pro Bereich
  s.areas.forEach(a => {
    const d = defaultPlan();
    const p = (a.plan && typeof a.plan === "object") ? a.plan : {};
    a.plan = {
      goal: Math.max(0, +p.goal || 0),
      days: Array.isArray(p.days) && p.days.length ? p.days.filter(n => n >= 0 && n <= 6) : d.days,
      from: (p.from === null || p.from === undefined) ? null : +p.from,
      to:   (p.to   === null || p.to   === undefined) ? null : +p.to,
      min:  clamp(+p.min || d.min, 15, 240),
      max:  clamp(+p.max || d.max, 15, 480),
      must: p.must === undefined ? true : !!p.must,
      pad:  clamp(+p.pad || 0, 0, 180),
      art:  ARTEN[p.art] ? p.art : null,
      ortId: p.ortId || null,
      grob: p.grob === undefined ? undefined : !!p.grob,
      // Stufe 13 Teil F: "×" im Vorschlags-Blatt schaltet Vorschläge für
      // diesen Bereich dauerhaft ab — dasselbe Feld wie plan.goal/must, sonst
      // verschwindet die Wahl beim nächsten Laden (a.plan wird hier komplett
      // neu aufgebaut, jedes fremde Feld fiele sonst weg).
      keinVorschlag: !!p.keinVorschlag
    };
    if (a.plan.max < a.plan.min) a.plan.max = a.plan.min;
    if (!a.plan.art) a.plan.art = artRaten(a);
  });
  // v4: Schlafenszeit mit Ruhezeit
  {
    const d = defaultSleep();
    const sl = (s.settings.sleep && typeof s.settings.sleep === "object") ? s.settings.sleep : {};
    s.settings.sleep = {
      on:   !!sl.on,
      from: clamp(typeof sl.from === "number" ? sl.from : d.from, 0, 1439),
      to:   clamp(typeof sl.to   === "number" ? sl.to   : d.to,   0, 1439),
      wind: clamp(typeof sl.wind === "number" ? sl.wind : d.wind, 0, 180)
    };
  }
  // v3: Vorbereitung für den Abgleich zwischen Geräten
  if (!s.tombs || typeof s.tombs !== "object") s.tombs = {};
  if (typeof s.settingsAt !== "number") s.settingsAt = 0;
  if (typeof s.backupAt !== "number") s.backupAt = 0;

  // Tagfenster absichern. Geclampt wurde bisher nur im Einstellungsdialog —
  // ein gesyncter oder importierter Stand mit dayEnd < dayStart zerlegt das Raster.
  s.settings.dayStart = clamp(+s.settings.dayStart || 7, 0, 22);
  s.settings.dayEnd   = clamp(+s.settings.dayEnd   || 22, s.settings.dayStart + 1, 24);

  // v6: Orte und Wegzeiten.
  //
  // Bisher hing die Wegzeit am Bereich: „Arbeit +60 min". Das legte eine Stunde
  // Anfahrt auch zwischen zwei Arbeitsblöcke am selben Schreibtisch und null
  // Minuten zwischen Arbeit und Uni. Eine Fahrt entsteht aber nicht durch die
  // Tätigkeit, sondern durch den Ortswechsel.
  //
  // Aus jedem Bereich mit Wegzeit wird ein Ort, dazu ein Heimatort. Wer vorher
  // „Arbeit +60" hatte, bekommt „Zuhause ↔ Arbeit = 60 min" — dieselbe Wirkung,
  // nur an der richtigen Stelle. Blöcke ohne eigenen Ort gelten als zuhause.
  if (!Array.isArray(s.orte)) s.orte = [];
  if (!s.wege || typeof s.wege !== "object") s.wege = {};
  {
    const mitWeg = s.areas.filter(a => a.plan.pad > 0 && !a.plan.ortId);
    if (mitWeg.length && !s.settings.heimOrt) {
      const heim = { id: "o-heim", name: "Zuhause" };
      s.orte.push(heim);
      s.settings.heimOrt = heim.id;
      mitWeg.forEach(a => {
        const o = { id: "o-" + a.id, name: a.name };
        s.orte.push(o);
        a.plan.ortId = o.id;
        s.wege[wegKey(heim.id, o.id)] = a.plan.pad;
      });
    }
    s.areas.forEach(a => { a.plan.pad = 0; });   // Altfeld stillgelegt
    // Schlüssel sind immer sortiert („a>b" mit a < b) — sonst findet weg() nichts
    Object.keys(s.wege).forEach(k => {
      const t = k.split(">");
      if (t.length !== 2) { delete s.wege[k]; return; }
      const richtig = wegKey(t[0], t[1]);
      if (richtig !== k) { s.wege[richtig] = s.wege[k]; delete s.wege[k]; }
    });
    const ortIds = new Set(s.orte.map(o => o.id));
    if (s.settings.heimOrt && !ortIds.has(s.settings.heimOrt)) s.settings.heimOrt = null;
    s.areas.forEach(a => { if (a.plan.ortId && !ortIds.has(a.plan.ortId)) a.plan.ortId = null; });
    s.blocks.forEach(b => { if (b.ortId && !ortIds.has(b.ortId)) delete b.ortId; });
    Object.keys(s.wege).forEach(k => {
      if (!k.split(">").every(id => ortIds.has(id))) delete s.wege[k];
    });
  }

  // Wöchentliche Blöcke gelten ab ihrem Anlegedatum, nicht seit Anbeginn
  s.blocks.forEach(b => {
    if (istSerie(b) && !b.since) b.since = b.date || "1970-01-01";
  });

  // Ausnahmen einzelner Termine einer Serie (Stufe „nur diesen Termin
  // löschen"): nur ein Array gültiger ISO-Datumsstrings, sonst verworfen —
  // ein leeres Array bleibt nicht liegen, sonst schleppt jeder Stand das
  // Feld unnötig mit.
  s.blocks.forEach(b => {
    if (!Array.isArray(b.ausnahmen)) { delete b.ausnahmen; return; }
    const a = b.ausnahmen.filter(x => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x));
    if (a.length) b.ausnahmen = a; else delete b.ausnahmen;
  });

  // Verwaiste Verweise reparieren. Wird ein Bereich auf einem Gerät gelöscht,
  // zeigen die Blöcke des anderen ins Leere — areaById fällt still auf den
  // ersten Bereich zurück, und „Laufen" zählt plötzlich auf das Arbeitsziel.
  {
    const ids = new Set(s.areas.map(a => a.id));
    const heimat = () => {
      let rest = s.areas.find(a => a.name === "Sonstiges");
      if (!rest) {
        rest = { id: "arest", name: "Sonstiges", hue: 210, plan: defaultPlan() };
        rest.plan.goal = 0;
        s.areas.push(rest);
        ids.add(rest.id);
      }
      return rest.id;
    };
    [...s.blocks, ...s.tasks].forEach(r => {
      if (r.areaId && !ids.has(r.areaId)) r.areaId = heimat();
    });
  }

  // v7: grobe Planung. Erholung plant ab jetzt ohne feste Uhrzeit —
  // wer es anders will, stellt es pro Bereich um.
  s.areas.forEach(a => {
    if (a.plan.grob === undefined) a.plan.grob = a.plan.art === "erholung";
  });
  s.blocks.forEach(b => {
    if (b.grob) {
      b.teil = ABSCHNITTE.some(x => x.id === b.teil) ? b.teil : "ab";
      b.dauer = clamp(+b.dauer || 60, 15, 720);
    } else {
      delete b.teil; delete b.dauer;
    }
  });
  // v8: Abhaken und Wochenstart
  if (!s.erledigt || typeof s.erledigt !== "object") s.erledigt = {};
  if (!s.rituale || typeof s.rituale !== "object") s.rituale = {};
  // Ein Tag kann auf einem anderen Gerät freigehalten worden sein, nachdem
  // hier schon verteilt wurde. Vorschläge dort gelten dann nicht mehr.
  s.blocks = s.blocks.filter(b => {
    if (!b.sug) return true;
    const m = s.days[b.date];
    return !(m && m.frei);
  });

  // Stufe 12: Aufgabe ↔ Block können auseinanderlaufen — derselbe Fehler
  // wie bei einer verwaisten areaId oben, nur zwischen zwei Sammlungen
  // statt zwischen Eintrag und Bereich. Ein Gerät löscht den Block (auch
  // der Filter unmittelbar darüber kann das gerade getan haben), das
  // andere trägt noch task.geplant darauf — oder umgekehrt. Wertbasiert
  // geprüft wie bei den Regeln oben, keine neue s.version nötig: beide
  // Richtungen nur entkoppeln, nie das jeweils andere mitreißen.
  {
    const blockIds = new Set(s.blocks.map(b => b.id));
    const taskIds = new Set(s.tasks.map(t => t.id));
    s.tasks.forEach(t => { if (t.geplant && !blockIds.has(t.geplant)) delete t.geplant; });
    s.blocks.forEach(b => { if (b.taskId && !taskIds.has(b.taskId)) delete b.taskId; });
    // Frühere doppelte Einplanungen bleiben als Termine erhalten. Nur der
    // von task.geplant benannte Termin behält die gemeinsame Erledigt-Markierung.
    const tasksById = new Map(s.tasks.map(t => [t.id, t]));
    s.blocks.forEach(b => {
      const t = tasksById.get(b.taskId);
      if (t && t.geplant && t.geplant !== b.id) delete b.taskId;
    });
  }

  // v9: Regeln, die am Vorhaben hängen statt am Bereich — Fenster (erlaubte
  // Wochentage + Uhrzeit) und Anker (frühestens/spätestens nach dem letzten
  // Block eines anderen Bereichs). Geschwister von a.plan, nicht darin: a.plan
  // wird oben aus einer Whitelist neu aufgebaut, jedes fremde Feld darin würde
  // bei jedem Laden verschwinden. Wertbasiert statt über s.version, damit ein
  // fremder oder alter Stand beim nächsten Kontakt genauso sauber ankommt.
  // task.regeln bekommt hier absichtlich keine Behandlung — migrate() baut
  // Aufgaben nicht aus einer Whitelist neu auf, also droht dort kein Verlust.
  s.areas.forEach(a => {
    if (a.regeln === undefined) a.regeln = null;
    if (!a.regeln || typeof a.regeln !== "object") return;
    const fenster = Array.isArray(a.regeln.fenster)
      ? a.regeln.fenster.filter(f => f && Array.isArray(f.tage) && f.tage.length &&
          typeof f.von === "number" && typeof f.bis === "number" && f.bis > f.von)
      : [];
    const roh = a.regeln.anker;
    // max ist Pflicht — ohne Obergrenze wäre "mind. 30 Min nach Feierabend"
    // auch um 23:30 noch formal erfüllt. ref muss auf einen noch vorhandenen
    // Bereich zeigen — wie plan.ortId oben verwaist eine Referenz, wenn der
    // Bereich auf einem anderen Gerät gelöscht wurde.
    // Stufe 13 Teil B: ein zweiter, schlankerer Anker-Zweig ohne ref — die
    // Anker-Frage im Wochenstart kennt neben "Nach [Bereich]" auch "Morgens"
    // und "Abends", ohne Bezugsbereich. Beide Zweige schließen sich aus.
    const anker = (roh && typeof roh === "object" && roh.ref && typeof roh.max === "number" &&
                   s.areas.some(x => x.id === roh.ref))
      ? { ref: roh.ref, min: typeof roh.min === "number" ? roh.min : 0, max: roh.max,
          sonst: roh.sonst === "fenster" ? "fenster" : "aus" }
      : (roh && typeof roh === "object" && (roh.tageszeit === "morgen" || roh.tageszeit === "abend"))
      ? { tageszeit: roh.tageszeit }
      : null;
    a.regeln = (fenster.length || anker) ? { fenster, anker } : null;
  });

  // v10: optionaler erster Schritt an Aufgaben (oben wertbasiert abgesichert).
  s.version = 10;
}

let anchor = new Date();          // irgendein Tag der angezeigten Woche
let selectedDayIdx = (new Date().getDay() + 6) % 7;   // für Mobile
// Wird erst wahr, wenn Sync.boot() (ganz unten) durch ist — vorher zeigt
// die Agenda eine Schraffur statt eines Standes, der gleich stillschweigend
// gegen den abgeglichenen ausgetauscht werden könnte.
let syncSettled = false;
/* Zwei Fragen, die bisher eine waren:

   MOBILE_Q — bekommt der Bildschirm die Tableiste unten und eine Ansicht
   zur Zeit? Das hängt daran, ob Karten und Raster nebeneinander passen.

   EINTAG_Q — zeigt das Raster einen Tag oder die ganze Woche? Das hängt
   allein an der Breite. Wer das Telefon dreht, hat plötzlich 844 Pixel —
   da passt die Woche, und der Tagwechsler wird überflüssig. Vorher war
   beides dieselbe Bedingung, und im Querformat blieb ein einzelner Tag
   über die volle Breite gezogen. */
const MOBILE_Q = "(max-width: 1100px)";
const EINTAG_Q = "(max-width: 640px)";
// v1.32: Telefon quer — Navigation als senkrechte Leiste (CSS gleichlautend).
const QUER_Q = "(max-height: 500px) and (max-width: 1000px)";
// ... und ab 700px Breite steht die Vorschlagsleiste in der Kopfzeile.
const SUG_OBEN_Q = "(max-height: 500px) and (min-width: 700px) and (max-width: 1000px)";
let isMobile = window.matchMedia(MOBILE_Q).matches;
let einTag   = window.matchMedia(EINTAG_Q).matches;

/* ============================================================
   Änderungen erkennen — Grundlage für den Abgleich zwischen Geräten.

   Statt an jeder einzelnen Stelle im Code einen Zeitstempel zu setzen
   (und garantiert eine zu vergessen), vergleicht der Planer beim
   Speichern den neuen Stand mit dem letzten. Was sich geändert hat,
   bekommt den aktuellen Zeitpunkt; was verschwunden ist, landet als
   Grabstein in state.tombs.

   Die Grabsteine sind der unscheinbare, aber entscheidende Teil: ohne
   sie taucht ein auf dem Handy gelöschter Eintrag beim nächsten
   Abgleich vom PC wieder auf.
   ============================================================ */

function recHash(r) {
  const c = {};
  Object.keys(r).sort().forEach(k => { if (k !== "at") c[k] = r[k]; });
  return JSON.stringify(c);
}

function snapshot(s) {
  const snap = { blocks: {}, tasks: {}, areas: {}, orte: {}, days: {} };
  ["blocks", "tasks", "areas", "orte"].forEach(c =>
    (s[c] || []).forEach(r => { snap[c][r.id] = recHash(r); }));
  Object.keys(s.days || {}).forEach(k => { snap.days[k] = recHash(s.days[k]); });
  snap.settings = JSON.stringify(s.settings);
  return snap;
}

let lastSnap = snapshot(state);
let lastSavedJson = JSON.stringify(state);
let prevSavedJson = null;     // Stand vor der letzten Änderung — für „Rückgängig"

function stampChanges() {
  const now = Date.now();

  ["blocks", "tasks", "areas", "orte"].forEach(c => {
    const prev = lastSnap[c] || {};
    const seen = new Set();
    state[c].forEach(r => {
      seen.add(r.id);
      if (prev[r.id] !== recHash(r)) r.at = now;
      if (typeof r.at !== "number") r.at = 0;
    });
    Object.keys(prev).forEach(id => { if (!seen.has(id)) state.tombs[id] = now; });
  });

  const prevDays = lastSnap.days || {};
  const seenDays = new Set();
  Object.keys(state.days).forEach(k => {
    seenDays.add(k);
    if (prevDays[k] !== recHash(state.days[k])) state.days[k].at = now;
  });
  Object.keys(prevDays).forEach(k => { if (!seenDays.has(k)) state.tombs["day:" + k] = now; });

  if (lastSnap.settings !== JSON.stringify(state.settings)) state.settingsAt = now;

  lastSnap = snapshot(state);
}

function save() {
  prevSavedJson = lastSavedJson;
  stampChanges();
  Store.save(state);
  lastSavedJson = JSON.stringify(state);
  syncPush();
}

/* Stellt den Stand vor der letzten Änderung wieder her. Die zurückgeholten
   Einträge bekommen dabei neue Zeitstempel, damit sie beim nächsten
   Abgleich nicht erneut von der Löschung überholt werden. */
function undoLast() {
  if (!prevSavedJson) { toast("Nichts zum Rückgängigmachen"); return; }
  try {
    const s = JSON.parse(prevSavedJson);
    migrate(s);
    state = s;
    save();
    renderAll();
    toast("Wiederhergestellt");
  } catch (e) { toast("Konnte nicht wiederhergestellt werden"); }
}

const areaById = id => state.areas.find(a => a.id === id) || state.areas[0];
function dayMeta(dateIso) {
  if (!state.days[dateIso]) state.days[dateIso] = { energy: null };
  return state.days[dateIso];
}
/* Reine Lesefassung: legt anders als dayMeta() nichts an. Für Stellen, die
   nur nachsehen wollen (z. B. eine Übersicht, die beim Vorblättern nicht
   sieben leere days-Einträge erzeugen und per Sync hochschieben soll). */
function dayMetaLesen(dateIso) {
  return state.days[dateIso] || null;
}

/* Ein freigehaltener Tag: der Verteiler schlägt hier nichts vor. Was von
   Hand drinsteht, bleibt — frei heißt „nichts Neues", nicht „gesperrt". */
function istFrei(dateIso) {
  const m = state.days[dateIso];
  return !!(m && m.frei);
}

/* ============================================================ Theme */
function applyTheme() {
  const t = state.settings.theme;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dunkel = (t === "auto" ? sysDark : t === "dark");
  document.documentElement.dataset.theme = dunkel ? "dark" : "light";
  // v1.33: installiert (Home-Bildschirm) — flacher Kopf, s. html[data-app].
  document.documentElement.dataset.app = laeuftAlsApp() ? "1" : "0";
  // Vom Homescreen gestartet ist das die Farbe der Statusleiste. Ohne das
  // sitzt eine weisse Leiste ueber einer dunklen App.
  const mc = document.getElementById("themeColor");
  if (mc) mc.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--kopf-flach").trim()
    || (dunkel ? "#101b15" : "#ffffff"));
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.settings.theme === "auto") applyTheme();
});

/* ============================================================ Toast */
function toast(msg, action) {
  const el = document.createElement("div");
  el.className = "toast";
  const txt = document.createElement("span");
  txt.textContent = msg;
  el.appendChild(txt);
  const life = action ? 6000 : 2200;
  if (action) {
    const b = document.createElement("button");
    b.className = "toast__act"; b.type = "button"; b.textContent = action.label;
    b.onclick = () => { el.remove(); action.run(); };
    el.appendChild(b);
  }
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, life);
  setTimeout(() => el.remove(), life + 400);
}

/* Toast mit Rückgängig — für alles, was etwas wegnimmt. */
function toastUndo(msg) {
  const snap = prevSavedJson;
  toast(msg, { label: "Rückgängig", run: () => {
    prevSavedJson = snap;
    undoLast();
  }});
}

/* ============================================================ Modal */
let openModal = null;
// Vom oberen Blatt beiseitegelegt statt entfernt — siehe modalPush() unten.
let stashedModal = null;
// Wer den Dialog geöffnet hat — bekommt beim Schließen den Fokus zurück.
let modalOpener = null;
// Rückruf, den ein Blatt beim Aufbau hinterlegen kann, um sich selbst
// zurückzustellen, wenn closeModal() NICHT über "Speichern" erreicht wird
// (Escape, Klick auf den Scrim, Abbrechen) — siehe goalsSheet(). Bleibt für
// die anderen rund 30 closeModal()-Aufrufer null, also ohne Wirkung dort.
let modalOnCancel = null;

// .app während des Dialogs abschalten. inert ist in fast allen aktuellen
// Browsern da; ohne das (alter WebKit) bleibt wenigstens aria-hidden plus
// eine CSS-Sperre gegen Maus/Touch dahinter.
function setAppInert(on) {
  const app = $(".app");
  if (!app) return;
  if ("inert" in app) {
    app.inert = on;
  } else if (on) {
    app.setAttribute("aria-hidden", "true");
    app.classList.add("is-inert-fallback");
  } else {
    app.removeAttribute("aria-hidden");
    app.classList.remove("is-inert-fallback");
  }
}

// Ghost-Click-Schutz fuer den Scrim: der Scrim schliesst bewusst auf
// pointerdown (s. Kommentar an den scrim-Listenern unten, NICHT aendern) --
// der nachfolgende click desselben Tipps trifft dann den durch das
// Schliessen freigelegten Ausloeser darunter (z.B. #monthBtn/#weekLabel)
// und oeffnet das Blatt sofort wieder; ein Tipp daneben kann ebenso ein
// anderes Topbar-Icon treffen. Ein einmaliger Capture-Listener schluckt
// darum genau den naechsten click irgendwo im Dokument, hoechstens 400ms
// lang, und raeumt sich danach selbst ab -- ein normaler naechster Tipp
// (>400ms) bleibt unberuehrt; Escape-, Fuss-Knopf- und programmatische
// Schliesswege rufen dies nicht auf, ihr Klick ist schon verbraucht.
function schluckeNaechstenClick() {
  const schlucker = e => { e.preventDefault(); e.stopPropagation(); };
  document.addEventListener("click", schlucker, { capture: true, once: true });
  setTimeout(() => document.removeEventListener("click", schlucker, { capture: true }), 400);
}
function modal(builder, opts = {}) {
  closeModal();
  modalOpener = document.activeElement && document.activeElement !== document.body
    ? document.activeElement : null;
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet" + (opts.wide ? " sheet--wide" : "");
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  scrim.appendChild(sheet);
  builder(sheet, closeModal);
  const titleEl = sheet.querySelector("h2.sheet__title");
  if (titleEl) {
    if (!titleEl.id) titleEl.id = "modalTitle";
    sheet.setAttribute("aria-labelledby", titleEl.id);
  }
  scrim.addEventListener("pointerdown", e => { if (e.target === scrim) { closeModal(); schluckeNaechstenClick(); } });
  blattZiehenEinrichten(sheet);
  $("#modalRoot").appendChild(scrim);
  openModal = scrim;
  setAppInert(true);
  // Auf dem Handy deckt die aufspringende Tastatur sonst rund 40% von
  // 568px Höhe zu — Autofokus nur, wo ein Zeiger fein genug ist, um ihn
  // absichtlich ins Feld gesetzt zu haben.
  const focusable = sheet.querySelector("input, select, textarea, button");
  if (focusable && window.matchMedia("(pointer: fine)").matches) setTimeout(() => focusable.focus(), 40);
  return sheet;
}
/* v1.36: Blatt nach unten ziehen schließt es — wie überall auf iOS. Nur
   Touch, nur wenn das Blatt ganz oben steht und nicht in einem Eingabefeld
   begonnen wurde. Unter der Schwelle federt es zurück. */
function blattZiehenEinrichten(sheet) {
  const griff = document.createElement("div");
  griff.className = "sheet__griff"; griff.setAttribute("aria-hidden", "true");
  sheet.prepend(griff);
  let y0 = null, dy = 0;
  sheet.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || sheet.scrollTop > 0 || e.target.closest("input, textarea, select, .zsteine")) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (sheet.scrollTop > 0) dy = 0;
    sheet.style.transition = "none";
    sheet.style.transform = dy ? "translateY(" + dy + "px)" : "";
  }, { passive: true });
  sheet.addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null; sheet.style.transition = "";
    if (dy > 110) { closeModal(); schluckeNaechstenClick(); }
    else sheet.style.transform = "";
    dy = 0;
  });
}
// Tab läuft nicht hinter den Scrim — gilt für modal() wie für modalPush(),
// da beide denselben openModal-Knoten belegen.
document.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !openModal) return;
  const sheetEl = openModal.querySelector(".sheet");
  if (!sheetEl) return;
  const items = Array.prototype.filter.call(
    sheetEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    el => !el.disabled && el.offsetParent !== null
  );
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
/* v1.42: Blätter gehen spiegelbildlich, wie sie kamen — am Telefon nach
   unten, am Desktop mittig kleiner und blasser, der Scrim blendet aus. Das
   echte Blatt verschwindet dabei SOFORT aus dem Dokument (openModal,
   Fokus, inert, zuletztGeschlossen, Prüfskripte: alles wie bisher); was
   sich bewegt, ist eine Kopie in einem geschlossenen Shadow-Root: für
   querySelector und Playwright unsichtbar, inert und ohne Zeigerereignisse
   (ein Tipp fällt durch sie hindurch — schluckeNaechstenClick() bleibt der
   einzige Schutz gegen den Folge-Klick). Sie liegt vor #modalRoot, ein
   gleich danach geöffnetes Blatt also darüber. Bei „Bewegung reduzieren"
   gibt es keine Kopie: das Blatt ist sofort weg. */
let blattStil = null;
function blattAbgang(scrim) {
  if (!scrim || !scrim.isConnected || !document.body.animate || !document.body.attachShadow) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const sheet = scrim.querySelector(".sheet");
  if (!sheet) return;
  try {
    if (!blattStil) {
      blattStil = new CSSStyleSheet();
      blattStil.replaceSync([...document.querySelectorAll("style")].map(x => x.textContent).join(" "));
    }
    const sc = getComputedStyle(scrim), ss = getComputedStyle(sheet);
    const host = document.createElement("div");
    host.className = "blatt-abgang"; host.setAttribute("aria-hidden", "true"); host.inert = true;
    const wurzel = host.attachShadow({ mode: "closed" });
    wurzel.adoptedStyleSheets = [blattStil];
    const kopie = scrim.cloneNode(true), kblatt = kopie.querySelector(".sheet");
    // Regeln mit html[data-theme] greifen im Shadow-Root nicht — die
    // gemessenen Flächen kommen deshalb direkt an die Kopie.
    kopie.style.background = sc.backgroundColor; kopie.style.pointerEvents = "none";
    kopie.style.animation = "none"; kblatt.style.animation = "none";
    kblatt.style.background = ss.backgroundColor; kblatt.style.color = ss.color;
    kblatt.style.boxShadow = ss.boxShadow; kblatt.style.pointerEvents = "none";
    kblatt.style.transform = ss.transform === "none" ? "" : ss.transform;
    kblatt.style.transition = "none";
    // Eingetipptes und Gezeichnetes mitnehmen — cloneNode kopiert nur Attribute.
    const felder = sheet.querySelectorAll("input, textarea, select"), kfelder = kblatt.querySelectorAll("input, textarea, select");
    felder.forEach((f, i) => { if (kfelder[i]) { kfelder[i].value = f.value; if ("checked" in f) kfelder[i].checked = f.checked; } });
    const bilder = sheet.querySelectorAll("canvas"), kbilder = kblatt.querySelectorAll("canvas");
    bilder.forEach((c, i) => { try { if (kbilder[i] && c.width && c.height) kbilder[i].getContext("2d").drawImage(c, 0, 0); } catch (e) { /* leer lassen */ } });
    wurzel.appendChild(kopie);
    $("#modalRoot").before(host);
    kblatt.scrollTop = sheet.scrollTop;
    const unten = window.matchMedia("(max-width: 640px)").matches;   // dort liegt das Blatt unten an
    const von = kblatt.style.transform || "none";
    const dauer = unten ? 260 : 190;
    kblatt.animate(unten
      ? [{ transform: von }, { transform: "translateY(100%)" }]
      : [{ transform: von, opacity: 1 }, { transform: "translateY(10px) scale(.96)", opacity: 0 }],
      { duration: dauer, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" });
    // Nur die Fläche des Scrims blendet aus — seine Deckkraft würde das
    // Blatt (sein Kind) mit durchsichtig machen.
    const a = kopie.animate([{ backgroundColor: sc.backgroundColor }, { backgroundColor: "transparent" }],
      { duration: dauer, easing: "ease-in", fill: "forwards" });
    a.onfinish = a.oncancel = () => host.remove();
  } catch (e) { /* ohne Kopie schließt das Blatt eben sofort */ }
}

// closeModal() heisst an rund 30 Stellen „alles zu" — das bleibt so, auch
// wenn gerade ein Blatt beiseitegelegt ist. Sonst würde z.B. Escape
// während einer beiseitegelegten Verschieben-Ansicht nur das obere Blatt
// schließen und die andere unsichtbar im Speicher hängen lassen.
// v1.36: wann zuletzt ein Blatt schloss — das „+" der Tabbar liegt dort, wo
// die Fußknöpfe eines Bottom Sheets stehen; ein hastiger Doppeltipp auf
// „Speichern"/„Woche anlegen" soll nicht sofort das nächste Blatt öffnen.
let zuletztGeschlossen = -1e9;
function closeModal() {
  if (stashedModal) { stashedModal.remove(); stashedModal = null; }
  if (openModal) {
    // Vor "Speichern" räumt das Blatt modalOnCancel selbst ab (siehe
    // goalsSheet()) — hier lösen deshalb nur die übrigen Schließwege aus.
    if (modalOnCancel) { modalOnCancel(); modalOnCancel = null; }
    blattAbgang(openModal);
    openModal.remove(); openModal = null;
    zuletztGeschlossen = performance.now();
    setAppInert(false);
    if (modalOpener && modalOpener.isConnected) modalOpener.focus();
    modalOpener = null;
  }
}
// iOS kann beim Öffnen der Bildschirmtastatur den Layout-Viewport behalten.
// Dialog und klebender Fuß folgen deshalb dem sichtbaren Bereich. Pinch-Zoom
// wird ausgenommen, damit Vergrößern nicht gegen eine neue Dialoggröße arbeitet.
if (window.visualViewport) {
  const sichtbarerBereich = () => {
    const v = window.visualViewport;
    if (Math.abs(v.scale - 1) > .02) return;
    document.documentElement.style.setProperty("--sicht-hoehe", v.height + "px");
    document.documentElement.style.setProperty("--sicht-oben", v.offsetTop + "px");
  };
  window.visualViewport.addEventListener("resize", sichtbarerBereich);
  window.visualViewport.addEventListener("scroll", sichtbarerBereich);
  sichtbarerBereich();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* Zweiter Einstieg neben modal() — NICHT modal() zu einem echten Stapel
   ausbauen, das würde die Bedeutung jedes der rund 30 closeModal()-Aufrufe
   verändern. modalPush() legt nur das gerade offene Blatt beiseite statt es
   zu entfernen, und der Rückweg läuft über das eigene close() des oberen
   Blatts (nicht über closeModal()) — dafür maximal zwei Ebenen. Gedacht für
   genau zwei Fälle: die Serien-Rückfrage aus dem Blockeditor und aus dem
   Verschieben-Dialog heraus (siehe confirmSheet(..., { push: true })). */
function modalPush(builder, opts = {}) {
  if (openModal) { openModal.remove(); stashedModal = openModal; openModal = null; }
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet" + (opts.wide ? " sheet--wide" : "");
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  scrim.appendChild(sheet);
  const closeThis = () => {
    // Kehrt das beiseitegelegte Blatt zurück, steht es sofort wieder da
    // (ohne zweites Hereinfedern) und deckt den Abgang ohnehin zu.
    if (!stashedModal) blattAbgang(scrim);
    scrim.remove();
    openModal = null;
    if (stashedModal) {
      openModal = stashedModal; stashedModal = null;
      openModal.classList.add("is-zurueck");
      $("#modalRoot").appendChild(openModal);
    }
  };
  builder(sheet, closeThis);
  // Wie modal(): ohne aria-labelledby hat auch das aufgesetzte Blatt keinen
  // zugaenglichen Namen fuer AT.
  const titleEl = sheet.querySelector("h2.sheet__title");
  if (titleEl) {
    if (!titleEl.id) titleEl.id = "modalTitle";
    sheet.setAttribute("aria-labelledby", titleEl.id);
  }
  scrim.addEventListener("pointerdown", e => { if (e.target === scrim) { closeThis(); schluckeNaechstenClick(); } });
  $("#modalRoot").appendChild(scrim);
  openModal = scrim;
  const focusable = sheet.querySelector("input, select, textarea, button");
  if (focusable) setTimeout(() => focusable.focus(), 40);
  return sheet;
}

function confirmSheet(title, text, confirmLabel, onYes, opts = {}) {
  const open = opts.push ? modalPush : modal;
  open((s, close) => {
    s.innerHTML = "<h2 class='sheet__title'></h2><p style='margin:0;color:var(--text-muted);font-size:var(--t-body);line-height:1.55'></p>";
    s.querySelector("h2").textContent = title;
    s.querySelector("p").textContent = text;
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    // opts.extra — ein dritter, harmloser Weg neben Abbrechen/Löschen (bisher
    // nur „nur diesen Termin überspringen" bei Serien-Löschung); bewusst kein
    // Gefahrknopf, deshalb ohne die Löschfarbe.
    let extra = null;
    if (opts.extra) {
      extra = document.createElement("button");
      extra.className = "btn"; extra.textContent = opts.extra.label;
      extra.onclick = () => { close(); opts.extra.onClick(); };
    }
    const yes = document.createElement("button");
    yes.className = "btn btn--primary"; yes.textContent = confirmLabel;
    yes.style.background = "var(--danger)"; yes.style.borderColor = "var(--danger)";
    yes.style.color = "var(--on-danger)";
    yes.onclick = () => { close(); onYes(); };
    if (extra) foot.append(cancel, extra, yes); else foot.append(cancel, yes);
    s.appendChild(foot);
  });
}

/* ============================================================ Kopfzeile */
function renderHeader() {
  const mon = mondayOf(anchor);
  const sun = addDays(mon, 6);
  const sameMonth = mon.getMonth() === sun.getMonth();
  const range = isMobile
    ? mon.getDate() + "." + (mon.getMonth() + 1) + ".–" + sun.getDate() + "." + (sun.getMonth() + 1) + "."
    : sameMonth
      ? mon.getDate() + ".–" + sun.getDate() + ". " + MONTHS[mon.getMonth()]
      : mon.getDate() + ". " + MONTHS[mon.getMonth()].slice(0, 3) + " – " + sun.getDate() + ". " + MONTHS[sun.getMonth()].slice(0, 3);
  $("#weekLabel").innerHTML = "KW " + isoWeek(mon)
    + "<svg class='weeknav__caret' viewBox='0 0 24 24' aria-hidden='true' focusable='false'><path d='M6 9l6 6 6-6'/></svg>"
    + "<small>" + range + "</small>";
  $("#whoLabel").textContent = state.profile.name ? "· " + state.profile.name : "";
  // In der laufenden Woche braucht niemand einen Knopf, der dorthin führt.
  // Am Telefon war die Kopfzeile bis auf null Pixel gefüllt — das Zahnrad
  // wurde angeschnitten. Der Knopf erscheint nur, wenn er etwas tut.
  const heuteBtn = $("#todayBtn");
  if (heuteBtn) heuteBtn.hidden = iso(mon) === iso(mondayOf(new Date()));
}

/* ============================================================
   Frei diese Woche (Auftrag A) — #weekLabel öffnet dieses Blatt.

   Beantwortet direkt "hast du diese Woche Zeit" in Worten, die man am
   Telefon sagen kann ("Donnerstag ab halb sechs") — kein Raster, aus dem
   man Lücken erst heraussuchen muss. Rechnet auf freeGaps() (3024) auf,
   der Lückenberechnung, die es für den Verteiler schon gibt, statt sie
   neu zu erfinden.

   FREIZEIT_MIN = 30: freeGaps() selbst liefert auch 15-Minuten-Fenster
   (das ist für den Verteiler richtig, ein Puffer zwischen zwei Blöcken
   darf klein sein) — als Antwort auf "hast du Zeit" ist das aber Lärm:
   niemand sagt am Telefon "ich hab von 17:30 bis 17:45 Zeit zu". 30
   Minuten ist die kürzeste Spanne, für die man sinnvoll noch etwas zusagt.

   WIDERSPRUCH, ABSICHTLICH SICHTBAR — NICHT REPARIEREN: grobe Blöcke
   (b.grob, ohne Uhrzeit, mit teil+dauer) sind für freeGaps() unsichtbar
   (~3087, filter(b => !b.grob && ...)) — der Verteiler darf grobe Sachen
   an jede Stelle des Tages legen, freeGaps kennt also keine feste Uhrzeit,
   die es aussparen könnte. tagesAuslastung() (2495) zählt dieselben
   Blöcke trotzdem zu Recht als verplante Zeit, denn ihre Dauer ist real,
   nur ihre Uhrzeit nicht. Beide Funktionen haben in ihrem eigenen
   Zusammenhang recht, keine von beiden wird hier angefasst — diese Liste
   macht den Unterschied nur sichtbar, indem sie hinter die echten
   Fenster nennt, was an dem Tag zusätzlich noch unverplant herumliegt,
   ohne ihm eine erfundene Uhrzeit anzudichten. */
const FREIZEIT_MIN = 30;

// Stufe M2: welche Fläche des Blatts zuletzt gewählt war ("Frei" oder
// "Belegt") — reine Sitzungsvariable fürs laufende Tab, bewusst KEIN
// state-Feld (nichts, was über den Abgleich auf ein zweites Gerät
// wandern müsste). "frei" ist die Vorgabe beim allerersten Öffnen; jeder
// weitere Öffnungsvorgang im selben Tab merkt sich die letzte Wahl.
let freizeitGesicht = "frei";

function freizeitZeile(day, todayKey) {
  // Vergangene Tage: freeGaps() gibt hier [] zurück, aber OHNE .gruende
  // (die Eigenschaft fehlt ganz, Zeile ~3028) — gaps.gruende.length würde
  // dort abstürzen. Deshalb erst gar nicht hinein, sondern hier schon
  // raus; "vorbei" statt Weglassen, damit die Woche vollständig bleibt.
  if (day.key < todayKey) return { text: "vorbei", art: "vorbei" };

  const gaps = freeGaps(day, {}, null, {});
  const gruende = gaps.gruende || [];

  const grobeHeute = state.blocks.filter(b => b.grob && onDay(b, day.key, day.i));
  const hinweis = grobeHeute.length
    ? " · " + grobeHeute.map(b => "<b>" + fmtDur(b.dauer) + "</b> " + escapeHtml(b.title) + " offen").join(", ")
    : "";

  // Ein freigehaltener Tag hat gruende ["Tag freigehalten"] und keine
  // Lücken — er ist trotzdem der freieste Tag der Woche und muss darum
  // genauso fett auftreten wie "ganzer Tag frei", nicht wie "nichts frei".
  if (gruende.includes("Tag freigehalten")) return { text: "<b>freigehalten</b>" + hinweis, art: "frei" };

  const echte = gaps.filter(g => g.end - g.start >= FREIZEIT_MIN);
  if (!echte.length) return { text: "nichts frei" + hinweis, art: "voll" };

  const basisLo = state.settings.dayStart * 60, basisHi = state.settings.dayEnd * 60;
  if (echte.length === 1 && echte[0].start <= basisLo + 15 && echte[0].end >= basisHi - 15) {
    return { text: "<b>ganzer Tag frei</b>" + hinweis, art: "ganz" };
  }

  // Reicht ein Fenster bis ans Tagesende, ist es offen ("ab X", viel
  // Zeit) — hat es ein echtes Ende, ist es eher ein Termin-Fenster
  // ("X–Y"), nicht der ganze Abend.
  const teile = echte.map(g =>
    g.end >= basisHi - 15 ? "ab <b>" + fmtTime(g.start) + "</b>"
                          : "<b>" + fmtTime(g.start) + "–" + fmtTime(g.end) + "</b>");
  return { text: teile.join(", ") + hinweis, art: "teil" };
}

/* ============================================================
   Wochenübersicht: Belegt-Gesicht (Stufe M2) — dieselbe Frage von der
   Gegenseite: nicht "wann hab ich Zeit" (freizeitZeile oben), sondern
   "was liegt an". Dieselben Tages-Helfer wie tagesAgenda()/blocksFor()
   (KEIN eigenes Datenmodell) — aber NICHT tagesAgenda() selbst: deren
   "exakt"-Teil hängt am globalen anchor (blocksFor(addDays(mondayOf(
   anchor), dayIdx), dayIdx), ~3160), nicht am übergebenen dayKey. Im
   Hauptraster fällt das nie auf, weil dort immer die Woche von anchor
   steht — dieses Blatt kann per lokalem ‹›-Umschalter aber eine ANDERE
   Woche zeigen als anchor (genau wie freizeitZeile/freeGaps oben). Darum
   hier eine eigene, schlanke Zusammenführung über dieselben Bausteine,
   parametrisiert über "day" (i/d/key aus tageDerWoche()) statt anchor.
   ============================================================ */
function wochenzeileEintraege(day) {
  const roh = [...blocksFor(day.d, day.i), ...grobeFor(day.key, day.i)];
  const eingeordnet = b => ({ block: b, grob: !!b.grob, sug: !!b.sug, sortMin: b.grob ? abschnittVon(b.teil).von : b.start });
  const echt = roh.filter(b => !b.sug).map(eingeordnet).sort((a, b) => a.sortMin - b.sortMin);
  const sug = roh.filter(b => b.sug).map(eingeordnet);
  return { echt, sug };
}

/* Klartextzeile unter der Segmentleiste: bis zu zwei Titel, Rest als
   "+N" — dieselbe Kappung wie an anderen engen Stellen der App. Vorschläge
   zählen nicht mit (wie in tagesAgenda(): die Zeile zeigt, was gilt, nicht,
   was der Verteiler anbietet). Ein exakter Eintrag nennt seine Uhrzeit,
   ein grober nur den Titel — er hat keine echte Uhrzeit, die man nennen
   könnte (dieselbe Zurückhaltung wie bei freizeitZeile()/ABSCHNITTE). */
function klartextZeile(echt, day) {
  if (istFrei(day.key)) return { html: "<b>bewusst frei</b>", leer: false };
  if (!echt.length) return { html: "nichts geplant", leer: true };
  const KAPPUNG = 2;
  const teile = echt.slice(0, KAPPUNG).map(e => {
    const a = areaById(e.block.areaId);
    const titel = escapeHtml(e.block.title || a.name);
    return e.grob ? titel : titel + " " + fmtTime(e.block.start);
  });
  const rest = echt.length - KAPPUNG;
  return { html: teile.join(" · ") + (rest > 0 ? " +" + rest : ""), leer: false };
}

function freizeitSheet(startMontag) {
  modal((s, close) => {
    const todayKey = iso(new Date());
    const heuteMon = mondayOf(new Date());
    // Stufe C Punkt C6: Start-Woche ist die beim Öffnen angezeigte. "mon"
    // ist lokal — der Umschalter unten ändert nur ihn, nie den globalen
    // anchor (die Hauptansicht bleibt unberührt). Stufe M3.2 gibt der
    // KW-Rinne im Monatsblatt (monatSheet()) einen eigenen Startpunkt mit
    // (aktuelle/vergangene Woche antippen) — Vorgabe bleibt mondayOf(anchor).
    let mon = mondayOf(startMontag || anchor);

    const tageDerWoche = () => [0, 1, 2, 3, 4, 5, 6].map(i => {
      const d = addDays(mon, i);
      return { i, d, key: iso(d) };
    });

    // Titel relativ zu HEUTE, nicht zur angezeigten Woche — sonst läuft man
    // ihm hinterher: navigiert man vorher im Hauptraster in eine andere
    // Woche und öffnet dann dieses Blatt, wäre "Frei diese Woche" gelogen.
    // Stufe M2: dasselbe fürs Belegt-Gesicht, nur ohne "Frei" davor — der
    // Frei-Zweig bleibt wortgleich zu vorher (freiwoche.js prüft das hart).
    const titelText = () => {
      const diff = Math.round((mon - heuteMon) / 604800000);
      if (freizeitGesicht === "frei") {
        if (diff === 0) return "Frei diese Woche";
        if (diff === 1) return "Frei nächste Woche";
        if (diff === -1) return "Frei letzte Woche";
      } else {
        if (diff === 0) return "Diese Woche";
        if (diff === 1) return "Nächste Woche";
        if (diff === -1) return "Letzte Woche";
      }
      // Muster vom Topbar-Label (renderHeader(), ~2537).
      const sun = addDays(mon, 6);
      const sameMonth = mon.getMonth() === sun.getMonth();
      const range = sameMonth
        ? mon.getDate() + ".–" + sun.getDate() + ". " + MONTHS[mon.getMonth()]
        : mon.getDate() + ". " + MONTHS[mon.getMonth()].slice(0, 3) + " – " + sun.getDate() + ". " + MONTHS[sun.getMonth()].slice(0, 3);
      const kw = "KW " + isoWeek(mon) + " (" + range + ")";
      return freizeitGesicht === "frei" ? "Frei in " + kw : kw;
    };

    s.innerHTML =
      "<div class='weeknav' style='margin-bottom:var(--s-3)'>" +
        "<button type='button' class='btn btn--icon btn--ghost' id='freizeitPrev' aria-label='Vorherige Woche'>‹</button>" +
        // Stufe M3.1: echter <button> -- Zoom-Ausstieg zum Monatsblatt. Das
        // Blatt braucht trotzdem einen eigenen, vom aria-label dieses Knopfs
        // unabhängigen Namen (sonst würde "Monatsübersicht öffnen" zur
        // Bezeichnung des ganzen Dialogs) -- das übernimmt zeichnen() unten
        // per aria-label direkt auf dem Sheet; modal() findet hier kein
        // h2.sheet__title mehr und rührt aria-labelledby also gar nicht an.
        "<button type='button' class='sheet__title freizeittitel' id='freizeitTitel' aria-label='Monatsübersicht öffnen' style='margin:0;flex:1;text-align:center'></button>" +
        "<button type='button' class='btn btn--icon btn--ghost' id='freizeitNext' aria-label='Nächste Woche'>›</button>" +
      "</div>" +
      "<div class='gesichtumschalter' id='gesichtUmschalter'></div>" +
      // Die Nachtruhe nur nennen, wenn sie auch eingeschaltet ist — defaultSleep()
      // liefert on:false, und ein Blatt, aus dem man jemandem vorliest, darf nicht
      // behaupten, es rechne etwas ein, das gar nicht wirkt. Gehört nur zum
      // Frei-Gesicht (Stufe M2) — zeichnen() blendet sie im Belegt-Gesicht aus.
      "<p class='freizeithint' id='freizeitHint'>ab " + FREIZEIT_MIN + " Min frei"
        + (state.settings.sleep && state.settings.sleep.on ? " · Nachtruhe zählt mit" : "") + "</p>" +
      "<div class='freizeitlist' id='freizeitListe'></div>" +
      "<div class='wochenzeilen' id='wochenzeilenListe' hidden></div>";

    const titelEl = s.querySelector("#freizeitTitel");
    const hintEl = s.querySelector("#freizeitHint");
    const listeEl = s.querySelector("#freizeitListe");
    const wochenEl = s.querySelector("#wochenzeilenListe");
    const umschalterEl = s.querySelector("#gesichtUmschalter");

    // "echte" aktuelle Woche: dieselbe Bedingung, die vorher inline in
    // zeichnen() stand — jetzt eine Funktion, weil sie ab Stufe M2 in zwei
    // Zeichenfunktionen (Frei/Belegt) gebraucht wird, nicht mehr nur einer.
    const istEchteWoche = () => mon.getTime() === heuteMon.getTime();

    // ---- Frei-Gesicht — UNVERÄNDERT gegenüber vorher, nur in eine eigene
    // Funktion gezogen: gleiche Zeichenkette, gleiche Klassen/IDs, gleicher
    // Sentinel-Kniff gegen freizeitZeile()s .gruende-Falle in fremden Wochen.
    const zeichnenFrei = () => {
      hintEl.hidden = false;
      wochenEl.hidden = true; wochenEl.innerHTML = "";
      listeEl.hidden = false;
      const echteWoche = istEchteWoche();
      listeEl.innerHTML = tageDerWoche().map(day => {
        const z = freizeitZeile(day, echteWoche ? todayKey : "0000-00-00");
        const heute = day.key === todayKey;
        return "<div class='freizeitrow" + (z.art === "vorbei" ? " is-vorbei" : "")
          + (heute ? " is-heute" : "") + "'>"
          + "<span class='freizeitrow__tag'>" + DAY_SHORT[day.i] + (heute ? " · heute" : "") + "</span>"
          + "<span class='freizeitrow__zeit'>" + z.text + "</span>"
          + "</div>";
      }).join("");
    };

    // ---- Belegt-Gesicht (Stufe M2) — sieben Zeilen "was liegt an".
    // Segmentleiste: links%/breite% linear über dayStart..dayEnd, auf den
    // sichtbaren Bereich geklemmt (ein Block außerhalb der Tagesgrenzen
    // läuft sonst aus der Leiste heraus statt nur abgeschnitten zu
    // wirken). Die Mindestbreite von 3px kommt aus der CSS-Regel
    // (.wochenzeile__seg min-width), nicht von hier.
    const zeichnenBelegt = () => {
      hintEl.hidden = true;
      listeEl.hidden = true; listeEl.innerHTML = "";
      wochenEl.hidden = false;
      const vonMin = state.settings.dayStart * 60, bisMin = state.settings.dayEnd * 60;
      const spanMin = Math.max(1, bisMin - vonMin);
      const echteWoche = istEchteWoche();

      const segment = e => {
        const a = e.grob ? abschnittVon(e.block.teil) : null;
        const start = e.grob ? a.von : e.block.start;
        const ende = e.grob ? a.von + (e.block.dauer || 0) : e.block.end;
        const links = clamp((start - vonMin) / spanMin * 100, 0, 100);
        const breite = Math.max(0, clamp((ende - vonMin) / spanMin * 100, 0, 100) - links);
        const klasse = e.sug ? " wochenzeile__seg--sug" : (e.grob ? " wochenzeile__seg--grob" : "");
        const ar = areaById(e.block.areaId);
        return "<i class='wochenzeile__seg" + klasse + "' style='left:" + links.toFixed(2)
          + "%;width:" + breite.toFixed(2) + "%;--h:" + ar.hue + "'></i>";
      };

      wochenEl.innerHTML = tageDerWoche().map(day => {
        const { echt, sug } = wochenzeileEintraege(day);
        const heute = echteWoche && day.key === todayKey;
        const vorbei = echteWoche && day.key < todayKey;
        const segmente = echt.map(segment).join("") + sug.map(segment).join("");
        const kt = klartextZeile(echt, day);

        return "<button type='button' class='wochenzeile" + (vorbei ? " is-vorbei" : "") + (heute ? " is-heute" : "") + "'"
          + " data-date='" + day.key + "'>"
          + "<span class='wochenzeile__top'>"
            + "<span class='wochenzeile__tag'>" + DAY_SHORT[day.i] + " " + day.d.getDate() + "." + (heute ? " · heute" : "") + "</span>"
            + "<span class='wochenzeile__bar'>" + segmente + "</span>"
          + "</span>"
          + "<span class='wochenzeile__txt" + (kt.leer ? " is-leer" : "") + "'>" + kt.html + "</span>"
          + "</button>";
      }).join("");
    };

    // ---- Umschalter (Stufe M2.1) — Muster wie paintGenau()/paintRepeat()
    // im Block-Editor: zwei Chips aus einem Array, aria-pressed trägt den
    // Zustand, ein Klick auf den schon aktiven Chip tut nichts.
    const paintUmschalter = () => {
      umschalterEl.innerHTML = "";
      [["frei", "Frei"], ["belegt", "Belegt"]].forEach(([wert, text]) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(freizeitGesicht === wert));
        c.textContent = text;
        c.onclick = () => {
          if (freizeitGesicht === wert) return;
          freizeitGesicht = wert;
          paintUmschalter();
          zeichnen();
        };
        umschalterEl.appendChild(c);
      });
    };

    // Zeichnet Titel + Inhalt der aktuell gewählten Fläche für die
    // angezeigte Woche ("mon") neu — beim Öffnen, nach ‹/› und nach jedem
    // Umschalt-Klick. Stufe M3.1: das aria-label des Dialogs zieht hier
    // mit -- #freizeitTitel selbst trägt sein EIGENES, konstantes
    // aria-label ("Monatsübersicht öffnen", s.o.), das darf die
    // Bezeichnung des Blatts nicht überschreiben (s. Kommentar oben).
    const zeichnen = () => {
      const titel = titelText();
      titelEl.innerHTML = titel
        + "<svg class='weeknav__caret' viewBox='0 0 24 24' aria-hidden='true' focusable='false'><path d='M6 9l6 6 6-6'/></svg>";
      s.setAttribute("aria-label", titel);
      if (freizeitGesicht === "frei") zeichnenFrei(); else zeichnenBelegt();
    };
    paintUmschalter();
    zeichnen();

    // Zeilen-Tipp (nur Belegt-Gesicht) — dasselbe Muster wie der Tages-Tipp
    // im Monatsblatt (monatSheet(), ~3054): anchor auf die angezeigte
    // (u.U. per ‹/› vorgeblätterte) Woche, selectedDayIdx auf den Tag,
    // Blatt zu, Ansicht "plan". Ein Listener für die ganze Liste statt
    // sieben — Frei-Zeilen bleiben wie bisher ohne Tipp (eigenes Gesicht,
    // eigener Container, kein Listener dort).
    wochenEl.addEventListener("click", e => {
      const btn = e.target.closest(".wochenzeile[data-date]");
      if (!btn) return;
      const d = new Date(btn.dataset.date + "T12:00:00");
      close();
      anchor = mondayOf(d);
      selectedDayIdx = (d.getDay() + 6) % 7;
      setView("plan");
      renderAll();
    });

    s.querySelector("#freizeitPrev").onclick = () => { mon = addDays(mon, -7); zeichnen(); };
    s.querySelector("#freizeitNext").onclick = () => { mon = addDays(mon, 7); zeichnen(); };
    // Stufe M3.1: Titel zoomt raus -- schließt dieses Blatt und öffnet
    // monatSheet() im Monat der zuletzt HIER angezeigten Woche ("mon"),
    // nicht stumpf im Monat von anchor (der bleibt unbewegt, s.
    // Kerninvariante dieser Stufe). modal() ersetzt das offene Blatt
    // ohnehin (closeModal() läuft als erstes in modal()) -- kein Stapel
    // nötig, close() hier nur zur Klarheit, wie an den anderen Zoom-Wegen.
    titelEl.onclick = () => { const zielMonat = mon; close(); monatSheet(zielMonat); };

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const okBtn = document.createElement("button");
    okBtn.className = "btn btn--primary"; okBtn.type = "button"; okBtn.textContent = "Fertig";
    okBtn.onclick = close;
    foot.appendChild(okBtn);
    s.appendChild(foot);
  });
}

/* ============================================================ Tag-Umschalter (Mobile) */

/* Wie viel steht an einem Tag, gemessen an dem, was der Tag verträgt.

   Zähler: alles, was an dem Tag liegt — auch Vorschläge. Wer verteilen lässt,
   soll sofort sehen, wohin es die Woche kippt, und nicht erst nach dem
   Übernehmen.

   Nenner: die wache Zeit dieses Tages mal 65 %. Dieselbe Marke wie in der
   Ampel bei den Wochenzielen; zwei verschiedene Maßstäbe für dieselbe Frage
   wären schlimmer als keiner. */
function tagesAuslastung(day) {
  let wach = (state.settings.dayEnd - state.settings.dayStart) * 60;
  restSpans().forEach(r => {
    wach -= Math.max(0, Math.min(state.settings.dayEnd * 60, r.end)
                      - Math.max(state.settings.dayStart * 60, r.start));
  });
  const grenze = Math.max(60, wach) * VERPLANT_GRENZE;
  let min = 0;
  state.blocks.forEach(b => { if (onDay(b, day.key, day.i)) min += dauerVon(b); });
  return { min, grenze, quote: min / grenze };
}

/* v1.41: der Tagesstreifen ist ein frei ziehbares Band über viele Wochen
   (natives waagerechtes Scrollen mit Einrasten je Tag). Ziehen allein ändert
   nichts — wie beim Monats- und Wochen-Blatt bewegt erst ein Tipp auf einen
   Tag anchor/selectedDayIdx. Die sieben Tage der gezeigten Woche tragen
   .is-woche; nur einer davon ist aria-pressed. */
const BAND_ZURUECK = 8, BAND_VOR = 12;   // Wochen um die aktuelle Woche herum

function renderDaySwitch() {
  const wrap = $("#daySwitch");
  const altBand = wrap.querySelector(".dayswitch__band");
  const altScroll = altBand ? altBand.scrollLeft : null;
  wrap.innerHTML = "";
  const band = document.createElement("div");
  band.className = "dayswitch__band";
  const mon = mondayOf(anchor), monIso = iso(mon);
  const todayIso = iso(new Date());
  const heuteMo = mondayOf(new Date());
  let start = addDays(heuteMo, -7 * BAND_ZURUECK), ende = addDays(heuteMo, 7 * BAND_VOR);
  if (iso(mon) < iso(start)) start = mon;
  if (iso(mon) >= iso(ende)) ende = addDays(mon, 7);

  for (let d = start; iso(d) < iso(ende); d = addDays(d, 1)) {
    const i = (d.getDay() + 6) % 7;
    const key = iso(d);
    const woche = iso(mondayOf(d)) === monIso;
    const frei = istFrei(key);
    const last = tagesAuslastung({ key, i });
    const heute = key === todayIso;

    const b = document.createElement("button");
    b.type = "button";
    b.className = "dayswitch__btn" + (woche ? " is-woche" : "")
      + (frei ? " is-frei" : "") + (last.quote > 1 ? " is-voll" : "") + (heute ? " is-today" : "");
    b.dataset.tag = key;
    b.setAttribute("aria-pressed", String(woche && i === selectedDayIdx));
    // Ein Tab-Stopp für das ganze Band (der gewählte Tag), Pfeiltasten wandern.
    b.tabIndex = woche && i === selectedDayIdx ? 0 : -1;
    b.style.setProperty("--last", Math.round(clamp(last.quote, 0, 1) * 100) + "%");
    b.innerHTML = "<span>" + DAY_SHORT[i] + "</span><b>" + d.getDate() + "</b><i></i>";

    // Ein Balken allein sagt niemandem etwas, der ihn nicht sieht.
    const wieVoll = frei ? "freigehalten"
      : last.min < 15 ? "nichts geplant"
      : fmtDur(last.min) + " geplant" + (last.quote > 1 ? " — das wird eng" : "");
    b.title = DAY_LONG[i] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ". · " + wieVoll;
    b.setAttribute("aria-label", b.title);

    const tag = new Date(d);
    b.onclick = () => {
      selectedDayIdx = i;
      if (woche) { renderGrid(); renderDaySwitch(); renderAgenda(); renderEnergy(); }
      else { anchor = tag; renderAll(); }
    };
    band.appendChild(b);
  }
  band.addEventListener("keydown", e => {
    const schritt = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (!schritt || !e.target.classList.contains("dayswitch__btn")) return;
    const ziel = schritt < 0 ? e.target.previousElementSibling : e.target.nextElementSibling;
    if (!ziel) return;
    e.preventDefault();
    e.target.tabIndex = -1; ziel.tabIndex = 0; ziel.focus({ preventScroll: true });
    ziel.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  wrap.appendChild(band);

  const zuHeute = document.createElement("button");
  zuHeute.type = "button";
  zuHeute.className = "dayswitch__heute";
  zuHeute.hidden = true;
  zuHeute.onclick = () => {
    anchor = new Date(); selectedDayIdx = (new Date().getDay() + 6) % 7;
    renderAll();
    bandAusrichten(null, true);
  };
  wrap.appendChild(zuHeute);
  let ruhe = null;
  band.addEventListener("scroll", () => {
    requestAnimationFrame(heuteKnopfZeigen);
    clearTimeout(ruhe);
    ruhe = setTimeout(() => bandEinrasten(band), 160);
  }, { passive: true });
  bandAusrichten(altScroll);
}

/* Band so stellen, dass der gewählte Tag sichtbar ist: die bisherige
   Position bleibt, solange er drinsteht (ein Tipp springt nie weg);
   sonst beginnt das Band am Montag seiner Woche. Ohne Breite (Band
   ausgeblendet) passiert nichts — setView() ruft erneut. */
function bandAusrichten(altScroll, sanft) {
  const band = $("#daySwitch .dayswitch__band");
  if (!band || !band.clientWidth) return;
  const sel = band.querySelector('[aria-pressed="true"]') || band.querySelector(".is-woche");
  if (!sel) return;
  const drin = altScroll != null && sel.offsetLeft >= altScroll - 1
    && sel.offsetLeft + sel.offsetWidth <= altScroll + band.clientWidth + 1;
  const woche = band.querySelector(".is-woche");
  const ziel = drin ? altScroll
    : band.scrollLeft + woche.getBoundingClientRect().left - band.getBoundingClientRect().left - parseFloat(getComputedStyle(band).paddingLeft || 0);
  if (sanft && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) band.scrollTo({ left: ziel, behavior: "smooth" });
  else band.scrollLeft = ziel;
  heuteKnopfZeigen();
}

/* Einrasten als Rückfall: CSS-Scroll-Snap erledigt das normalerweise; bleibt
   das Band nach dem Schwung zwischen zwei Tagen stehen (Bruchteil-Breiten,
   manche WebViews), richtet es sich hier am nächsten Tag aus. */
function bandEinrasten(band) {
  const rand = band.getBoundingClientRect().left + parseFloat(getComputedStyle(band).paddingLeft || 0);
  let best = null;
  for (const c of band.children) {
    const d = c.getBoundingClientRect().left - rand;
    if (best === null || Math.abs(d) < Math.abs(best)) best = d;
  }
  if (best !== null && Math.abs(best) > 1) band.scrollBy({ left: best, behavior: "smooth" });
}

/* „Heute"-Knopf, sobald heute aus dem Band gescrollt ist — mit Pfeil in
   die Richtung, in der heute liegt. */
function heuteKnopfZeigen() {
  const band = $("#daySwitch .dayswitch__band"), knopf = $("#daySwitch .dayswitch__heute");
  if (!band || !knopf) return;
  const t = band.querySelector(".is-today");
  if (!t || !band.clientWidth) { knopf.hidden = true; return; }
  const links = t.offsetLeft + t.offsetWidth <= band.scrollLeft + 2;
  const rechts = t.offsetLeft >= band.scrollLeft + band.clientWidth - 2;
  knopf.hidden = !(links || rechts);
  knopf.textContent = links ? "‹ Heute" : "Heute ›";
  knopf.classList.toggle("is-links", links);
}

/* ============================================================
   Monatsübersicht (Stufe M1) — die Woche in Stunden beantwortet "was
   mache ich heute"; "wann ist noch Luft" blieb offen, solange man sich
   wochenweise durchklicken musste. Der Monats-Prototyp vom 2026-08-08
   hat vermessen: eine ~40px-Zelle trägt weder Uhrzeit noch Titel — der
   ehrliche Nutzen ist Navigation und Vorausplanen, kein Informations-
   kalender. Zellen zeigen darum NUR Auslastung, "freigehalten", "heute",
   "hat etwas" — alles andere bleibt der Wochenansicht vorbehalten.
   Kein zweites Datenmodell: state.blocks/onDay()/tagesAuslastung()/
   istFrei() liefern schon alles, was die Zellen brauchen — nur die
   Wochen-Belegung der KW-Rinne ist neu (wochenBelegung() unten).
   ============================================================ */

/* Welche Montage gehören ins Raster eines Monats — jede Woche, die
   mindestens einen Tag des Monats trägt (Standard-Kalenderraster: die
   erste Zeile beginnt am Montag der Woche, die den 1. enthält, die
   letzte endet am Sonntag der Woche, die den letzten Tag enthält — eine
   Woche kann also auch am jeweils anderen Ende überstehen). */
function monatMontage(jahr, monatIdx) {
  const gehoertDazu = d => d.getFullYear() === jahr && d.getMonth() === monatIdx;
  const montage = [];
