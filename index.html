    grid.appendChild(h);
  });
  }

  // Ein freigehaltener Tag wird nicht bebaut — der Verteiler lässt ihn aus,
  // von Hand eintragen bleibt erlaubt.
  // Zeitspalte
  const tc = document.createElement("div");
  tc.className = "timecol";
  tc.style.height = bodyH + "px";
  for (let h = dayStart; h <= dayEnd; h++) {
    const m = document.createElement("div");
    m.className = "timecol__mark num";
    m.style.top = ((h - dayStart) * hourH) + "px";
    m.textContent = pad2(h) + ":00";
    tc.appendChild(m);
  }
  grid.appendChild(tc);

  // Tagesspalten
  let hatEintraege = false;
  dayIdxs.forEach(i => {
    const d = addDays(mon, i);
    const col = document.createElement("div");
    col.className = "daycol" + (i >= 5 ? " is-weekend" : "") + (istFrei(iso(addDays(mon, i))) ? " is-frei" : "");
    col.style.height = bodyH + "px";
    col.dataset.day = i;
    col.dataset.date = iso(d);

    // Nachtruhe hinterlegen — liegt unter den Linien und Blöcken
    restSpans().forEach(sp => {
      const a = Math.max(sp.start, dayStart * 60);
      const b = Math.min(sp.end, dayEnd * 60);
      if (b <= a) return;
      const r = document.createElement("div");
      r.className = "rest";
      r.style.top = ((a - dayStart * 60) / 60 * hourH) + "px";
      r.style.height = ((b - a) / 60 * hourH) + "px";
      r.title = "Nachtruhe — hier wird nichts vorgeschlagen";
      col.appendChild(r);
    });

    for (let h = 0; h <= hours; h++) {
      const l = document.createElement("div");
      l.className = "daycol__line";
      l.style.top = (h * hourH) + "px";
      col.appendChild(l);
      if (h < hours) {
        const hl = document.createElement("div");
        hl.className = "daycol__line daycol__line--half";
        hl.style.top = (h * hourH + hourH / 2) + "px";
        col.appendChild(hl);
      }
    }

    if (iso(d) === todayIso) {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      if (mins >= dayStart * 60 && mins <= dayEnd * 60) {
        const n = document.createElement("div");
        n.className = "now";
        n.style.top = ((mins - dayStart * 60) / 60 * hourH) + "px";
        col.appendChild(n);
      }
    }

    const eintraege = layout(blocksFor(d, i));
    if (eintraege.length) hatEintraege = true;
    eintraege.forEach(p => col.appendChild(blockEl(p, hourH, iso(d))));

    attachColumnHandlers(col, hourH);
    grid.appendChild(col);
  });

  if (!hatEintraege) {
    // Als Grid-Kind statt als Geschwister von #grid: liegt so exakt über den
    // (leeren) Tagesspalten, ohne deren eigene Zeile/Höhe zu verändern, und
    // bleibt oben stehen statt in der bodyH-hohen Zeile zu verschwinden.
    // Bei genau einem gezeigten Tag (einTag) ist der sonst wortgleiche Text
    // sonst von einem bewusst freigehaltenen Tag nicht zu unterscheiden.
    const einzelTag = dayIdxs.length === 1 ? iso(addDays(mon, dayIdxs[0])) : null;
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1 / -1";
    empty.style.gridRow = einTag ? "1" : "2";
    empty.style.alignSelf = "start";
    empty.innerHTML = (einzelTag && istFrei(einzelTag))
      ? "<b>Bewusst frei</b>Diesen Tag hast du dir bewusst freigehalten."
      : "<b>Noch nichts geplant</b>Leere Seite, volle Freiheit. Tipp auf „Eintrag“ oder direkt auf eine freie Stunde.";
    grid.appendChild(empty);
  }

  // Gemerkter statt aus dem DOM gelesener Wert (scrollMerk oben): wrap.scrollTop
  // gehörte an dieser Stelle schon nicht mehr zuverlässig zum neuen Tag, etwa
  // nach einem Wisch-Wechsel, der selectedDayIdx vor dem Neuzeichnen schon
  // weiterstellt — sonst würde man mit der Scrollposition des alten Tages auf
  // dem neuen landen. null heißt „diesen Tag noch nie gesehen" (Sprung zur
  // passenden Startzeit), 0 heißt „stand ganz oben" — das eine ist keine
  // Abkürzung fürs andere, sonst risse der Minutentakt jeden, der bewusst
  // ganz nach oben gescrollt hat, wieder zur aktuellen Uhrzeit zurück.
  // Klebende Blocktitel bleiben unter dem Tageskopf stehen — gemessen statt
  // geschätzt, weil seine Höhe von Schriftgröße, „frei"-Zeile und Querformat
  // abhängt. Ohne Kopf (Eintagesansicht) kleben sie am oberen Rand. Ein
  // gerade verborgenes Raster (Tablet, andere Ansicht) misst 0 — dann misst
  // der Beobachter nach, sobald der Kopf sichtbar wird.
  const kopfEl = grid.querySelector(".dayhead");
  kopfMessen = () => {
    if (!kopfEl) grid.style.setProperty("--kopf", "0px");
    else if (kopfEl.offsetHeight) grid.style.setProperty("--kopf", kopfEl.offsetHeight + "px");
  };
  kopfMessen();
  if (kopfBeobachter) {
    kopfBeobachter.disconnect();
    if (kopfEl) kopfBeobachter.observe(kopfEl);
  }

  // v1.32: den Glaskopf JETZT messen, nicht erst im ResizeObserver danach —
  // sein Tagesstreifen erscheint je nach Ansicht, und mit der alten Höhe
  // wäre der Scrollweg kürzer: die gemerkte Position würde gekappt (scroll.js).
  kopfhoeheMessen();

  blockZeilenEinpassen(grid);

  scrollMerkSchluessel = scrollSchluessel();
  const gemerkt = scrollMerk[scrollMerkSchluessel];
  wrap.scrollTop = gemerkt != null ? gemerkt : (hatEintraege ? startScroll(hourH) : 0);
}

/* v1.42: Was in einem Rasterblock nicht ganz passt, fällt ganz weg, statt
   mitten in der Zeile abgeschnitten zu werden (wie im Entwurf B): zuerst
   die Begründung (auf ganze Zeilen gekürzt oder weg), dann die Uhrzeit; ein
   langer Titel wird auf ganze Zeilen gekürzt. Der volle Text bleibt im
   title (Zeiger) und im Blatt, das ein Tipp öffnet. Erst alles zurücksetzen
   und messen, dann schreiben — ein Layout für das ganze Raster. Ein
   verborgenes Raster misst 0 und bleibt unangetastet; setView("plan")
   zeichnet es beim Zeigen ohnehin neu. */
function blockZeilenEinpassen(grid) {
  if (!grid) return;
  const bloecke = [...grid.querySelectorAll(".block")];
  bloecke.forEach(el => {
    el.removeAttribute("title");
    el.querySelectorAll(".is-weg, .is-gekuerzt").forEach(x => {
      x.classList.remove("is-weg", "is-gekuerzt"); x.style.removeProperty("-webkit-line-clamp");
    });
  });
  const zeilen = x => parseFloat(getComputedStyle(x).lineHeight) || 16;
  const plan = bloecke.map(el => {
    if (!el.clientHeight) return null;
    const t = el.querySelector(".block__title"), z = el.querySelector(".block__time"), g = el.querySelector(".block__grund");
    // Kurze Blöcke zeigen nur den Titel; ein Vorschlag unter 34 px bekommt
    // gar keine Begründungszeile — beides zählt als „nicht alles sichtbar".
    const r = { el, weg: [], kuerzen: [], fehlt: el.classList.contains("is-short") || (!g && (el._volltext || "").split("\n").length > 2) };
    if (el.classList.contains("is-short")) return r;
    const cs = getComputedStyle(el);
    const oben = parseFloat(cs.paddingTop), unten = el.clientHeight - parseFloat(cs.paddingBottom) + 0.5;
    if (g && g.offsetTop + g.offsetHeight > unten) {
      const n = Math.floor((unten - g.offsetTop) / zeilen(g));
      if (n >= 1) r.kuerzen.push([g, n]); else r.weg.push(g);
      r.fehlt = true;
    }
    if (z && z.offsetTop + z.offsetHeight > unten) {
      r.weg.push(z);
      if (g && !r.weg.includes(g)) { r.weg.push(g); r.kuerzen = r.kuerzen.filter(k => k[0] !== g); }
      r.fehlt = true;
    }
    // Der Titel klebt (sticky) — gemessen wird seine Höhe ab der Polsterung.
    if (t && oben + t.offsetHeight > unten) {
      r.kuerzen.push([t, Math.max(1, Math.floor((unten - oben) / zeilen(t)))]);
      r.fehlt = true;
    }
    return r;
  });
  plan.forEach(r => {
    if (!r) return;
    r.weg.forEach(x => x.classList.add("is-weg"));
    r.kuerzen.forEach(([x, n]) => { x.classList.add("is-gekuerzt"); x.style.setProperty("-webkit-line-clamp", String(n)); });
    if (r.fehlt && r.el._volltext) r.el.title = r.el._volltext;
  });
}
let einpassenRahmen = 0;
window.addEventListener("resize", () => {
  cancelAnimationFrame(einpassenRahmen);
  einpassenRahmen = requestAnimationFrame(() => blockZeilenEinpassen($("#grid")));
});
// Die eingebettete Schrift kommt asynchron — mit ihr können Titel anders umbrechen.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => blockZeilenEinpassen($("#grid")));

/* Nur die Jetzt-Linie verschieben, ohne das Raster neu aufzubauen — für den
   Minutentakt (s. ganz unten), solange ein Zeiger im Raster aktiv ist.
   renderGrid() räumt vorher grid.innerHTML leer; das reisst den Knoten
   unter einem gerade gehaltenen oder verschobenen Block weg. Die Linie
   existiert höchstens einmal, in der Spalte des heutigen Tages. */
function verschiebeJetztLinie() {
  const grid = $("#grid");
  if (!grid) return;
  const hourH = parseFloat(getComputedStyle(grid).getPropertyValue("--hourh")) || 52;
  const { dayStart, dayEnd } = state.settings;
  const todayIso = iso(new Date());
  const mins = new Date().getHours() * 60 + new Date().getMinutes();
  grid.querySelectorAll(".daycol").forEach(col => {
    const n = col.querySelector(".now");
    const heute = col.dataset.date === todayIso;
    if (!heute || mins < dayStart * 60 || mins > dayEnd * 60) { if (n) n.remove(); return; }
    const top = ((mins - dayStart * 60) / 60 * hourH) + "px";
    if (n) n.style.top = top;
    else {
      const el = document.createElement("div");
      el.className = "now";
      el.style.top = top;
      col.appendChild(el);
    }
  });
}

/* Wohin das Raster beim ersten Zeichnen springt.

   Bisher immer „aktuelle Stunde minus eins". Am Telefon zeigt der Plan aber
   einen einzelnen Tag, und wer den Sonntag ansieht, will nicht die Uhrzeit
   von heute sehen, sondern was an dem Tag ansteht. Und wenn der erste
   Eintrag um neun beginnt, ist eine Kopfzeile bei zehn nutzlos. */
function startScroll(hourH) {
  const { dayStart } = state.settings;
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();
  let ziel;

  if (isMobile) {
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const heute = iso(d) === iso(new Date());
    const starts = blocksFor(d, selectedDayIdx).map(b => b.start);
    if (starts.length) ziel = Math.min(...starts);
    else if (heute) ziel = jetzt;
    else ziel = Math.max(dayStart * 60, 8 * 60);
    if (heute) ziel = Math.min(ziel, jetzt);
  } else {
    ziel = jetzt;
  }

  // Eine Dreiviertelstunde Vorlauf, damit der erste Eintrag nicht am
  // oberen Rand klebt.
  return Math.max(0, (ziel - 45 - dayStart * 60) / 60 * hourH);
}

function blockEl({ b, col, of }, hourH, dayKey) {
  const { dayStart } = state.settings;
  const el = document.createElement("div");
  const area = areaById(b.areaId);
  const h = (b.end - b.start) / 60 * hourH;
  const fertig = !b.sug && istErledigt(b, dayKey || b.date);
  el.className = "block" + (h < 34 ? " is-short" : h < 52 ? " is-knapp" : "") + (b.frog ? " is-frog" : "")
    + (b.sug ? " is-sug" : "") + (fertig ? " is-done" : "");
  el.style.setProperty("--h", area.hue);
  el.style.top = ((b.start - dayStart * 60) / 60 * hourH) + "px";
  el.style.height = Math.max(18, h - 2) + "px";
  if (of > 1) {
    const w = 100 / of;
    el.style.left = "calc(" + (col * w) + "% + 3px)";
    el.style.right = "calc(" + ((of - col - 1) * w) + "% + 3px)";
  }
  el.tabIndex = 0;
  el.dataset.id = b.id;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label",
    (b.sug ? "Vorschlag: " : "") + (fertig ? "Erledigt: " : "") + b.title + ", "
    + fmtTime(b.start) + " bis " + fmtTime(b.end) + ", " + area.name);
  const t = document.createElement("div");
  t.className = "block__title"; t.textContent = b.title || "Ohne Titel";
  const tm = document.createElement("div");
  tm.className = "block__time num"; tm.textContent = fmtTime(b.start) + "–" + fmtTime(b.end);
  el.append(t, tm);
  // Begründungszeile (Stufe 11) — nur Vorschläge haben eine, das reicht als
  // Erkennungsmerkmal. In kurzen Blöcken (is-short) ist ohnehin kein Platz.
  // Stufe C Punkt C2: die Anzeige schweigt beim generischen Grund.
  const grundAnzeige = b.sug && h >= 34 ? grundZumZeigen(b) : "";
  // Voller Wortlaut für den Fall, dass blockZeilenEinpassen() Zeilen weglässt.
  el._volltext = [b.title || "Ohne Titel", tm.textContent, b.sug ? grundZumZeigen(b) : ""].filter(Boolean).join("\n");
  if (grundAnzeige) {
    const gr = document.createElement("div");
    gr.className = "block__grund"; gr.textContent = grundAnzeige;
    el.appendChild(gr);
  }
  const rz = document.createElement("div");
  rz.className = "block__resize";
  el.appendChild(rz);

  // Abhaken direkt am Block — bisher ging das nur über den Blockeditor.
  // Vorschläge zählen nicht: die gelten erst als erledigt, wenn sie
  // angenommen wurden.
  if (!b.sug) {
    const done = document.createElement("input");
    done.type = "checkbox"; done.className = "block__done";
    done.checked = fertig;
    done.setAttribute("aria-label", "Erledigt: " + (b.title || area.name));
    // Sonst löst der Klick auch den Spalten-Handler aus (verschieben/öffnen),
    // und die Leertaste würde zusätzlich noch den Editor öffnen (Tastatur-
    // Handler unten am Block, hört auch auf gebubbelte Ereignisse).
    done.addEventListener("pointerdown", e => e.stopPropagation());
    done.addEventListener("click", e => e.stopPropagation());
    done.addEventListener("keydown", e => e.stopPropagation());
    done.onchange = () => {
      abhaken(b, dayKey || b.date, done.checked, done);
      // renderAll() statt nur diesen Block anzufassen: am Desktop stehen
      // Agenda und Raster nebeneinander, sonst zeigt der Haken in der
      // Agenda-Zeile den alten Stand, bis irgendetwas anderes neu zeichnet.
      save(); renderAll();
    };
    el.appendChild(done);
  }

  if (b.sug) {
    const bar = document.createElement("div");
    bar.className = "block__sug";
    const yes = document.createElement("button");
    yes.type = "button"; yes.textContent = "✓";
    yes.title = "Übernehmen"; yes.setAttribute("aria-label", "Vorschlag übernehmen");
    yes.onclick = e => { e.stopPropagation(); acceptOne(b.id); };
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "×";
    no.title = "Verwerfen"; no.setAttribute("aria-label", "Vorschlag verwerfen");
    no.onclick = e => { e.stopPropagation(); dropOne(b.id); };
    bar.append(yes, no);
    // Pointer-Events der Knöpfe nicht vom Spalten-Handler abfangen lassen
    bar.addEventListener("pointerdown", e => e.stopPropagation());
    el.appendChild(bar);
  }

  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (b.sug) acceptOne(b.id); else editBlock(b.id, dayKey || b.date);
    }
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      unlinkTask(b);
      state.blocks = state.blocks.filter(x => x.id !== b.id);
      save(); renderAll();
      if (b.sug) toast("Vorschlag verworfen"); else toastUndo("Eintrag gelöscht");
    }
  });
  return el;
}

function acceptOne(id, fest) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  delete b.sug;
  if (fest) b.repeat = "weekly";
  save(); renderAll();
  toast(fest ? "Übernommen — steht ab jetzt jede Woche" : "Übernommen");
}
function dropOne(id) {
  const b = state.blocks.find(x => x.id === id);
  if (b) unlinkTask(b);
  state.blocks = state.blocks.filter(x => x.id !== id);
  save(); renderAll(); toast("Vorschlag verworfen");
}

/* ============================================================ Maus/Touch im Raster */
const SNAP = 15;
function snap(min) { return Math.round(min / SNAP) * SNAP; }

// Wischt gerade jemand über einen Block, während ein langer Druck (s.
// holdToMove) ihn schon zum Verschieben angehoben hat? Dann darf
// wischenEinrichten das nicht als Wochentagwechsel lesen. Ausserhalb eines
// Drags ist Wischen über Blöcken erlaubt — nur während eines laufenden
// Drags nicht.
let blockDragAktiv = false;

/* Stufe 12: statt eine Aufgabe stur auf die Fingerposition bzw. "jetzt +
   1 h" zu legen, die nächstgelegene Stelle nehmen, die wirklich frei ist —
   dasselbe Muster wie beim Verschieben (moveSheet): alle passenden Lücken
   des Tages sammeln, die dem Wunschzeitpunkt nächste nehmen. Ohne Treffer
   (Tag schon voll) null zurückgeben — der Aufrufer entscheidet dann selbst
   über einen groben Rückfall, statt dass hier stillschweigend eine Stelle
   erfunden wird, die gar nicht frei ist. */
function naechsteStelle(day, laenge, wunsch, area) {
  const passende = freeGaps(day, { from: null, to: null, days: [day.i] }, area)
    .filter(g => g.end - g.start >= laenge);
  if (!passende.length) return null;
  let ziel = null;
  passende.forEach(g => {
    const st = clamp(wunsch, g.start, g.end - laenge);
    const d = Math.abs(st - wunsch);
    if (!ziel || d < ziel.d) ziel = { st, d };
  });
  return ziel.st;
}

function attachColumnHandlers(col, hourH) {
  const { dayStart, dayEnd } = state.settings;
  const minAt = clientY => {
    const r = col.getBoundingClientRect();
    return clamp(snap(dayStart * 60 + (clientY - r.top) / hourH * 60), dayStart * 60, dayEnd * 60);
  };

  col.addEventListener("pointerdown", e => {
    const blockNode = e.target.closest(".block");
    const handle = e.target.closest(".block__resize");
    const fine = e.pointerType === "mouse";

    /* --- Größe ändern --- */
    if (handle && blockNode && fine) {
      e.preventDefault();
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const move = ev => {
        const end = Math.max(b.start + SNAP, minAt(ev.clientY));
        blockNode.style.height = Math.max(18, (end - b.start) / 60 * hourH - 2) + "px";
        blockNode.dataset.pendEnd = end;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        b.end = +blockNode.dataset.pendEnd || b.end;
        // fix (Stufe 11): von Hand gezogen — der Verteiler rührt den Block
        // beim nächsten Durchlauf nicht mehr an (auch nicht durchs Wachsen-
        // lassen in growSuggestions).
        b.fix = true;
        save(); renderAll();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Block verschieben (nur Maus) --- */
    if (blockNode && fine) {
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const startY = e.clientY, origStart = b.start, len = b.end - b.start;
      let moved = false;
      const move = ev => {
        if (!moved && Math.abs(ev.clientY - startY) < 4) return;
        moved = true;
        blockNode.classList.add("is-dragging");
        const delta = snap((ev.clientY - startY) / hourH * 60);
        const ns = clamp(origStart + delta, dayStart * 60, dayEnd * 60 - len);
        blockNode.style.top = ((ns - dayStart * 60) / 60 * hourH) + "px";
        blockNode.dataset.pendStart = ns;
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        if (moved) {
          const ns = +blockNode.dataset.pendStart;
          b.start = ns; b.end = ns + len;
          // fix (Stufe 11): von Hand gezogen — der Verteiler rührt den Block
          // beim nächsten Durchlauf nicht mehr an.
          b.fix = true;
          save(); renderAll();
        } else {
          editBlock(b.id, col.dataset.date);
        }
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf Block: Tippen öffnet, langer Druck verschiebt ---
       Vorher ging der Editor schon beim Aufsetzen des Fingers auf, sodass
       jeder Scrollversuch einen Dialog erzeugt hat (tapOrScroll unten löst
       das weiterhin erst bei pointerup). Verschieben gab es am Telefon
       bisher gar nicht — nur mit der Maus oben. Ein langer Druck (dieselben
       380 ms wie holdToCreate) hebt den Block jetzt zum Verschieben an;
       tapAbbrechen sorgt dafür, dass der Editor dann nicht zusätzlich noch
       aufgeht, sobald losgelassen wird. */
    if (blockNode) {
      const b = state.blocks.find(x => x.id === blockNode.dataset.id);
      const tapAbbrechen = tapOrScroll(e, () => editBlock(blockNode.dataset.id, col.dataset.date));
      if (b) holdToMove(e, blockNode, b, col, hourH, tapAbbrechen);
      return;
    }

    /* --- Ziehen zum Anlegen (nur Maus) --- */
    if (fine) {
      e.preventDefault();
      const a = minAt(e.clientY);
      const ghost = document.createElement("div");
      ghost.className = "block__ghost";
      ghost.style.setProperty("--h", state.areas[0].hue);
      col.appendChild(ghost);
      let from = a, to = a + 60;
      const paint = () => {
        const s = Math.min(from, to), en = Math.max(from, to);
        ghost.style.top = ((s - dayStart * 60) / 60 * hourH) + "px";
        ghost.style.height = Math.max(16, (en - s) / 60 * hourH - 2) + "px";
        ghost.textContent = fmtTime(s) + "–" + fmtTime(en);
      };
      paint();
      let dragged = false;
      const move = ev => { dragged = true; to = minAt(ev.clientY); paint(); };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        ghost.remove();
        let s = Math.min(from, to), en = Math.max(from, to);
        if (!dragged || en - s < SNAP) { s = a; en = a + 60; }
        newBlock(+col.dataset.day, col.dataset.date, s, Math.min(en, dayEnd * 60));
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      return;
    }

    /* --- Touch auf leere Fläche: langes Drücken ---
       Ein kurzer Tipp legt bewusst nichts an. Beim Scrollen streift man
       ständig freie Flächen; ein Eintrag, den man nicht wollte, ist
       ärgerlicher als ein Weg, den man einmal lernen muss. Für alles
       andere gibt es den Plus-Knopf. */
    holdToCreate(e, col, minAt, hourH, dayEnd);
  });

  /* Aufgabe per Drag&Drop einplanen */
  col.addEventListener("dragover", e => {
    if (!dragTaskId) return;
    e.preventDefault();
    col.classList.add("is-droptarget");
  });
  col.addEventListener("dragleave", () => col.classList.remove("is-droptarget"));
  col.addEventListener("drop", e => {
    col.classList.remove("is-droptarget");
    if (!dragTaskId) return;
    e.preventDefault();
    const t = state.tasks.find(x => x.id === dragTaskId);
    if (!t) return;
    if (aufgabenBlock(t)) { planTask(t); return; }
    // Startzeit klemmen, nicht die Endzeit — sonst entsteht beim Fallenlassen
    // ganz unten ein Block „22:00–22:00" ohne Dauer.
    const laenge = t.dauer || 60;
    const wunsch = Math.min(minAt(e.clientY), state.settings.dayEnd * 60 - 30);
    // Stufe 12: nicht stur auf die Fingerposition — die nächstgelegene
    // wirklich freie Stelle desselben Tages nehmen (naechsteStelle). Passt
    // nirgends etwas hinein, bleibt die Fingerposition als grober Rückfall.
    const day = { i: +col.dataset.day, key: col.dataset.date };
    const gefunden = naechsteStelle(day, laenge, wunsch, taskVorhaben(t));
    const s = gefunden == null ? wunsch : gefunden;
    const id = uid();
    state.blocks.push({
      id, title: t.title, areaId: t.areaId || state.areas[0].id, taskId: t.id,
      day: day.i, date: day.key, repeat: "none",
      start: s, end: Math.min(s + laenge, state.settings.dayEnd * 60), frog: !!t.frog
    });
    t.geplant = id;
    save(); renderAll();
    toast("Eingeplant: " + t.title);
  });
}

/* ============================================================
   Tippen oder Wischen auseinanderhalten

   Auf einem Telefon ist jede Berührung erst einmal mehrdeutig: Anfang
   einer Scrollbewegung oder Tipp? Das entscheidet sich erst beim
   Loslassen — vorher zu handeln erzeugt genau die Fehlauslösungen, über
   die man dann stolpert.
   ============================================================ */
const WISCH_AB = 72;     // so weit nach rechts wischen, um eine Agenda-Zeile abzuhaken (v1.35)
const TAP_SLOP = 10;      // Pixel Wackeln, die noch als Tipp durchgehen
const TAP_TIME = 700;     // länger gehalten ist kein Tipp mehr
const HOLD_TIME = 380;    // so lange drücken für einen neuen Eintrag

function tapOrScroll(e, run) {
  const x0 = e.clientX, y0 = e.clientY, t0 = Date.now();
  let moved = false, abgesagt = false;
  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) moved = true;
  };
  const done = () => {
    off();
    if (!abgesagt && !moved && Date.now() - t0 < TAP_TIME) run();
  };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", done);
    document.removeEventListener("pointercancel", off);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", done);
  document.addEventListener("pointercancel", off);
  // Rückgabewert für holdToMove: ein langer Druck, der zum Verschieben
  // wird, soll beim Loslassen nicht zusätzlich noch den Editor öffnen. Die
  // Auflösung selbst (oben in "done") bleibt unverändert bei pointerup.
  return () => { abgesagt = true; };
}

function holdToCreate(e, col, minAt, hourH, dayEnd) {
  const x0 = e.clientX, y0 = e.clientY;
  const start = minAt(e.clientY);
  let abgebrochen = false;

  // Sichtbare Rückmeldung, damit klar ist, dass gerade etwas entsteht
  const ghost = document.createElement("div");
  ghost.className = "block__ghost is-holding";
  ghost.style.setProperty("--h", state.areas[0].hue);
  ghost.style.top = ((start - state.settings.dayStart * 60) / 60 * hourH) + "px";
  ghost.style.height = Math.max(16, hourH - 2) + "px";
  ghost.textContent = fmtTime(start) + "–" + fmtTime(start + 60);
  col.appendChild(ghost);

  const timer = setTimeout(() => {
    if (abgebrochen) return;
    off();
    ghost.remove();
    if (navigator.vibrate) navigator.vibrate(12);
    newBlock(+col.dataset.day, col.dataset.date, start, Math.min(start + 60, dayEnd * 60));
  }, HOLD_TIME);

  const move = ev => {
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) stop();
  };
  const stop = () => { abgebrochen = true; clearTimeout(timer); ghost.remove(); off(); };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", stop);
    document.removeEventListener("pointercancel", stop);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
}

/* Langer Druck auf einen Block verschiebt ihn — dieselbe Geste wie
   holdToCreate auf freier Fläche, nur auf einem bestehenden Eintrag statt
   auf leerem Raum. Bricht die Bewegung vor Ablauf der Haltezeit ab (der
   Finger wandert, das ist dann Scrollen oder Wischen), bleibt tapOrScroll
   unangetastet dafür zuständig, ob daraus noch ein Tipp wird — dessen
   Auflösung bei pointerup ändert sich hier nicht. Löst der lange Druck
   aber aus, übernimmt ab da dieselbe Verschieben-Logik wie am Schreibtisch
   mit der Maus (15-Minuten-Raster über snap()), nur eben erst nach der
   Haltezeit statt sofort bei der ersten Bewegung. */
function holdToMove(e, blockNode, b, col, hourH, tapAbbrechen) {
  const { dayStart, dayEnd } = state.settings;
  const x0 = e.clientX, y0 = e.clientY;
  const origStart = b.start, len = b.end - b.start;
  let pendStart = origStart, dragging = false;

  // Dieselbe Rückmeldung wie beim Anlegen (holdToCreate) — ein Fingerdruck
  // auf einen Block soll sich beim Halten nicht anders anfühlen als einer
  // auf freier Fläche.
  const ghost = document.createElement("div");
  ghost.className = "block__ghost is-holding";
  ghost.style.top = blockNode.style.top;
  ghost.style.height = blockNode.style.height;
  ghost.style.left = blockNode.style.left;
  ghost.style.right = blockNode.style.right;
  ghost.style.setProperty("--h", blockNode.style.getPropertyValue("--h"));
  col.appendChild(ghost);

  const startDrag = () => {
    dragging = true;
    ghost.remove();
    blockDragAktiv = true;
    tapAbbrechen();
    if (navigator.vibrate) navigator.vibrate(12);
    blockNode.classList.add("is-dragging");
  };
  const timer = setTimeout(startDrag, HOLD_TIME);

  const move = ev => {
    if (dragging) {
      const delta = snap((ev.clientY - y0) / hourH * 60);
      pendStart = clamp(origStart + delta, dayStart * 60, dayEnd * 60 - len);
      blockNode.style.top = ((pendStart - dayStart * 60) / 60 * hourH) + "px";
      return;
    }
    if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) {
      clearTimeout(timer);
      ghost.remove();
    }
  };
  const off = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onCancel);
  };
  // pointerup übernimmt den neuen Stand, pointercancel (vom System
  // unterbrochene Geste) verwirft ihn — renderAll() zeichnet in dem Fall
  // aus dem unveränderten Datenstand neu, damit kein loses style.top stehen
  // bleibt.
  const finish = commit => {
    clearTimeout(timer);
    off();
    ghost.remove();
    if (dragging) {
      blockNode.classList.remove("is-dragging");
      blockDragAktiv = false;
      // fix (Stufe 11): von Hand gezogen — der Verteiler rührt den Block
      // beim nächsten Durchlauf nicht mehr an.
      if (commit) { b.start = pendStart; b.end = pendStart + len; b.fix = true; save(); }
      renderAll();
    }
  };
  const onUp = () => finish(true);
  const onCancel = () => finish(false);

  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
}

/* ============================================================ Block-Editor */
function newBlock(dayIdx, dateIso, start, end) {
  blockSheet({
    id: null, title: "", areaId: state.areas[0].id,
    day: dayIdx, date: dateIso, repeat: "none",
    start, end, frog: false
  });
}
function editBlock(id, dayKey) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  if (b.sug) { sugSheet(b); return; }
  blockSheet({ ...b }, dayKey || b.date);
}

/* Antippen eines Vorschlags — am Handy der Hauptweg, am PC die Alternative
   zu den kleinen Knöpfen im Block. */
function sugSheet(b) {
  const area = areaById(b.areaId);
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Vorschlag</h2>" +
      "<p style='margin:0 0 6px;font-size:var(--t-body)'><b>" + escapeHtml(b.title) + "</b></p>" +
      "<p style='margin:0 0 6px;color:var(--text-muted);font-size:var(--t-body)'>" +
      DAY_LONG[b.day] + ", " + fmtTime(b.start) + "–" + fmtTime(b.end) +
      " · " + escapeHtml(area.name) + "</p>" +
      // Begründungszeile (Stufe 11) — dasselbe Muster wie die Ort-/Wegzeit-
      // Zeile der Agenda (.agenda__sub).
      (b.grund ? "<p class='agenda__sub' style='margin:0 0 16px'>" + escapeHtml(b.grund) + "</p>" : "") +
      "<p style='margin:0 0 16px;color:var(--text-faint);font-size:var(--t-sm);line-height:1.6'>" +
      "Nur ein Vorschlag — er zählt erst mit, wenn du ihn übernimmst. " +
      "Verschieben kannst du ihn auch einfach im Raster.</p>" +
      "<label class='switch'><input type='checkbox' id='sugWeekly'> " +
      "Fest übernehmen — ab jetzt jede Woche zu dieser Zeit</label>" +
      // Teil F: "×" schaltet Vorschläge für DIESEN Bereich dauerhaft ab
      // (area.plan.keinVorschlag) — wer einmal "kein Sport mehr" sagt, soll
      // das nicht jede Woche neu wegklicken müssen.
      "<div style='display:flex;align-items:center;gap:8px;margin-top:16px'>" +
        "<span style='flex:1;font-size:var(--t-sm);color:var(--text-faint)'>Keine " +
        escapeHtml(area.name) + "-Vorschläge mehr?</span>" +
        "<button type='button' class='btn btn--icon btn--ghost' id='sugAusBereich' " +
        "aria-label='Keine " + escapeHtml(area.name) + "-Vorschläge mehr'>×</button>" +
      "</div>" +
      "<div id='sugAlt'></div>";

    s.querySelector("#sugAusBereich").onclick = () => {
      area.plan.keinVorschlag = true;
      // Bestehende Vorschläge desselben Bereichs widersprächen sonst der
      // gerade getroffenen Wahl — wie unlinkTask() beim Streichen (5390 ff.).
      state.blocks.forEach(x => { if (x.sug && x.areaId === area.id) unlinkTask(x); });
      state.blocks = state.blocks.filter(x => !(x.sug && x.areaId === area.id));
      save(); close(); renderAll();
      toast("Keine " + area.name + "-Vorschläge mehr");
    };

    // Die zwei besten verworfenen Plätze (Stufe 11) — fallen beim Verteilen
    // ohnehin an, statt sie wegzuwerfen. „Trotzdem hierhin" setzt fix, sonst
    // würde der nächste Durchlauf die Handwahl gleich wieder verwerfen.
    if (b.alternativen && b.alternativen.length) {
      const altWrap = s.querySelector("#sugAlt");
      altWrap.innerHTML = "<p class='goalrow__sub' style='margin:16px 0 8px'>Andere Plätze, die auch gingen:</p>";
      b.alternativen.forEach(alt => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:8px";
        const txt = document.createElement("div");
        txt.style.flex = "1";
        txt.innerHTML = "<span style='font-size:var(--t-sm)'>" + DAY_LONG[alt.day] + ", " +
          fmtTime(alt.start) + "–" + fmtTime(alt.end) + "</span>" +
          "<div class='agenda__sub'>" + escapeHtml(alt.grund) + "</div>";
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "btn btn--sm"; btn.textContent = "Trotzdem hierhin";
        btn.onclick = () => {
          b.day = alt.day; b.date = alt.date; b.start = alt.start; b.end = alt.end;
          b.fix = true;
          delete b.alternativen;
          save(); close(); renderAll();
          toast("Verschoben");
        };
        row.append(txt, btn);
        altWrap.appendChild(row);
      });
    }

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const del = document.createElement("button");
    del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Verwerfen";
    del.onclick = () => { close(); dropOne(b.id); };
    const sp = document.createElement("span"); sp.className = "spacer";
    const edit = document.createElement("button");
    edit.className = "btn"; edit.type = "button"; edit.textContent = "Ändern";
    edit.onclick = () => { close(); blockSheet({ ...b }); };
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Übernehmen";
    ok.onclick = () => {
      const fest = s.querySelector("#sugWeekly").checked;
      close();
      acceptOne(b.id, fest);
    };
    foot.append(del, sp, edit, ok);
    s.appendChild(foot);
  });
}

function blockSheet(draft, dayKey) {
  const isNew = !draft.id;
  const hakenTag = dayKey || draft.date;
  const mon = mondayOf(anchor);
  let days = new Set([draft.day]);

  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>" + (isNew ? "Neuer Eintrag" : "Eintrag bearbeiten") + "</h2>" +
      // Begründungszeile (Stufe 13 Nachtrag zu Teil A) — bei einem
      // angenommenen Vorschlag mit Ort zeigt die Agenda den Ort statt des
      // Grundes (s. renderAgenda). Ohne diese Zeile wäre der Grund dann
      // nirgends mehr zu lesen: sugSheet zeigt ihn nur, solange b.sug noch
      // gilt, und acceptSuggestions() löscht nur .sug, nicht .grund.
      // Dasselbe Muster wie dort: .agenda__sub.
      (draft.grund ? "<p class='agenda__sub' style='margin:0 0 16px'>" + escapeHtml(draft.grund) + "</p>" : "") +
      "<div class='sheet__row'><label class='label' for='bTitle'>Was?</label>" +
      "<input class='field' id='bTitle' placeholder='z.B. Vorlesung, Sport, Serienabend' autocomplete='off'></div>" +
      "<div class='sheet__row'><span class='label'>Wann?</span>" +
        "<div class='chipset' id='bDays'></div>" +
        "<div id='bDaysHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px'></div>" +
      "</div>" +
      "<div class='sheet__row'><span class='label'>Wie genau?</span>" +
        "<div class='chipset' id='bGenau'></div>" +
        "<div id='bGenauHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px;line-height:1.5'></div>" +
      "</div>" +
      "<div class='sheet__row sheet__cols' id='bZeitRow'>" +
        "<div><label class='label' for='bFrom'>Von</label><input class='field' id='bFrom' type='time' step='300'></div>" +
        "<div><label class='label' for='bTo'>Bis</label><input class='field' id='bTo' type='time' step='300'></div>" +
      "</div>" +
      "<p class='field-error' id='bZeitError' role='status' hidden></p>" +
      "<div class='sheet__row' id='bGrobRow' hidden>" +
        "<span class='label'>Wann ungefähr?</span><div class='chipset' id='bTeil'></div>" +
        "<label class='label' style='margin-top:14px' for='bDauer'>Wie lange etwa?</label>" +
        "<div class='chipset' id='bDauer'></div>" +
      "</div>" +
      "<div class='sheet__row'><span class='label'>Wiederholen?</span><div class='chipset' id='bRepeat'></div></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span><div class='chipset' id='bAreas'></div></div>" +
      "<div class='sheet__row'><span class='label'>Wo?</span><div class='chipset' id='bOrte'></div>" +
        "<div id='bOrtHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px'></div></div>" +
      (isNew ? "" :
      "<div class='sheet__row'><span class='label'>Stattgefunden?</span>" +
        "<label class='switch'><input type='checkbox' id='bDone'> Erledigt</label>" +
        "<div id='bDoneHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px;line-height:1.5'></div>" +
      "</div>");

    const title = s.querySelector("#bTitle");
    title.value = draft.title;
    const from = s.querySelector("#bFrom"); from.value = fmtTime(draft.start);
    const to = s.querySelector("#bTo"); to.value = fmtTime(draft.end);
    // ---- Wiederholung: drei Zustände statt eines Hakens (Chips statt
    // Dropdown — bei drei überschaubaren Werten sofort anklickbar, der
    // gewählte Rhythmus ist ohne weiteren Klick sichtbar).
    let repeatMode = draft.repeat === "2wochen" ? "2wochen" : draft.repeat === "weekly" ? "weekly" : "none";
    const repWrap = s.querySelector("#bRepeat");
    const paintRepeat = () => {
      repWrap.innerHTML = "";
      [["none", "Einmalig"], ["weekly", "Wöchentlich"], ["2wochen", "Alle 2 Wochen"]].forEach(([wert, text]) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(repeatMode === wert));
        c.textContent = text;
        c.onclick = () => {
          if (repeatMode === wert) return;
          repeatMode = wert;
          paintRepeat(); paintDays();
        };
        repWrap.appendChild(c);
      });
    };
    paintRepeat();

    // ---- Abhaken. Bei einer Serie gilt das Häkchen nur für diesen Tag.
    const doneBox = s.querySelector("#bDone");
    if (doneBox) {
      doneBox.checked = istErledigt(draft, hakenTag);
      const dh = s.querySelector("#bDoneHint");
      const malen = () => {
        const d = hakenTag ? new Date(hakenTag + "T12:00:00") : null;
        const tagText = d ? DAY_LONG[(d.getDay() + 6) % 7] + ", " + d.getDate() + "." + (d.getMonth() + 1) + "." : "diesen Tag";
        dh.textContent = istSerie(draft)
          ? "Gilt nur für " + tagText + " — die anderen Wochen bleiben unberührt."
          : (doneBox.checked ? "Zählt auf das Wochenziel als wirklich passiert." : "Hake ab, was stattgefunden hat — daraus wird dein Wochenrückblick.");
      };
      doneBox.onchange = malen;
      malen();
    }

    // ---- Genauigkeit: feste Uhrzeit oder grober Abschnitt
    let grob = !!draft.grob;
    let teil = ABSCHNITTE.some(x => x.id === draft.teil) ? draft.teil
             : abschnittFuer(draft.start);
    let dauer = draft.dauer || Math.max(30, draft.end - draft.start);
    const zeitFehler = s.querySelector("#bZeitError");
    from.setAttribute("aria-describedby", "bZeitError");
    to.setAttribute("aria-describedby", "bZeitError");
    const pruefeZeit = (fokus = false) => {
      const fehltVon = !from.value, fehltBis = !to.value;
      const falsch = !grob && (fehltVon || fehltBis || parseTime(to.value) <= parseTime(from.value));
      zeitFehler.hidden = !falsch;
      zeitFehler.textContent = falsch
        ? (fehltVon || fehltBis ? "Bitte gib Start- und Endzeit an." : "Die Endzeit muss nach der Startzeit liegen. Bitte passe „Bis“ an.") : "";
      from.setAttribute("aria-invalid", String(!grob && fehltVon));
      to.setAttribute("aria-invalid", String(falsch && !fehltVon));
      if (falsch && fokus) (fehltVon ? from : to).focus();
      return !falsch;
    };
    from.addEventListener("input", () => pruefeZeit());
    to.addEventListener("input", () => pruefeZeit());

    const genauWrap = s.querySelector("#bGenau");
    const genauHint = s.querySelector("#bGenauHint");
    const zeitRow = s.querySelector("#bZeitRow");
    const grobRow = s.querySelector("#bGrobRow");
    const teilWrap = s.querySelector("#bTeil");
    const dauerWrap = s.querySelector("#bDauer");

    const paintGenau = () => {
      genauWrap.innerHTML = "";
      [[false, "Feste Uhrzeit"], [true, "Ungefähr"]].forEach(([wert, text]) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(grob === wert));
        c.textContent = text;
        c.onclick = () => {
          if (grob === wert) return;
          if (wert) { teil = abschnittFuer(parseTime(from.value)); dauer = Math.max(30, parseTime(to.value) - parseTime(from.value)); }
          else {
            const a = abschnittVon(teil);
            const st = clamp(Math.max(a.von, state.settings.dayStart * 60), 0, 1440 - dauer);
            from.value = fmtTime(st); to.value = fmtTime(st + dauer);
          }
          grob = wert;
          paintGenau(); paintTeil(); paintDauer();
        };
        genauWrap.appendChild(c);
      });
      zeitRow.hidden = grob;
      grobRow.hidden = !grob;
      pruefeZeit();
      genauHint.textContent = grob
        ? "Steht ohne Uhrzeit im Band unter dem Raster. Nichts kollidiert, nichts muss umgeplant werden."
        : "Liegt fest im Raster.";
    };

    const paintTeil = () => {
      teilWrap.innerHTML = "";
      ABSCHNITTE.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(teil === a.id));
        c.textContent = a.name.charAt(0).toUpperCase() + a.name.slice(1);
        c.onclick = () => { teil = a.id; paintTeil(); };
        teilWrap.appendChild(c);
      });
    };

    const paintDauer = () => {
      dauerWrap.innerHTML = "";
      [30, 60, 90, 120, 180].forEach(m => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(dauer === m));
        c.textContent = fmtDur(m);
        c.onclick = () => { dauer = m; paintDauer(); };
        dauerWrap.appendChild(c);
      });
    };
    paintGenau(); paintTeil(); paintDauer();

    // Bereiche
    const areaWrap = s.querySelector("#bAreas");
    const paintAreas = () => {
      areaWrap.innerHTML = "";
      state.areas.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.style.setProperty("--h", a.hue);
        c.setAttribute("aria-pressed", String(a.id === draft.areaId));
        c.innerHTML = "<span class='chip__dot'></span>";
        c.append(a.name);
        c.onclick = () => { draft.areaId = a.id; paintAreas(); paintOrtHint(); };
        areaWrap.appendChild(c);
      });
    };
    paintAreas();

    // Ort — daraus rechnet der Planer die Fahrzeit zum nächsten Block
    const ortHint = s.querySelector("#bOrtHint");
    const paintOrtHint = () => {
      const gewaehlt = draft.ortId || (areaById(draft.areaId).plan || {}).ortId || null;
      if (!gewaehlt || !(state.orte || []).length) {
        ortHint.textContent = (state.orte || []).length
          ? "Ohne Ort rechnet der Planer keine Fahrzeit."
          : "Sobald du zwei Orte angelegt hast, kannst du in den Einstellungen eintragen, wie lange du zwischen ihnen brauchst.";
        return;
      }
      const andere = (state.orte || []).filter(o => o.id !== gewaehlt)
        .map(o => o.name + " " + (weg(gewaehlt, o.id) || 0) + " min");
      ortHint.textContent = andere.length
        ? "Fahrzeit von hier: " + andere.join(" · ")
        : "Noch kein zweiter Ort angelegt.";
    };
    const repaintOrte = ortChips(s.querySelector("#bOrte"),
      () => draft.ortId, id => { draft.ortId = id; paintOrtHint(); });
    paintOrtHint();

    // Tage
    const dayWrap = s.querySelector("#bDays");
    const hint = s.querySelector("#bDaysHint");
    const paintDays = () => {
      dayWrap.innerHTML = "";
      for (let i = 0; i < 7; i++) {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.setAttribute("aria-pressed", String(days.has(i)));
        c.textContent = DAY_SHORT[i];
        c.onclick = () => {
          if (days.has(i)) { if (days.size > 1) days.delete(i); }
          else { if (isNew) days.add(i); else { days.clear(); days.add(i); } }
          paintDays();
        };
        dayWrap.appendChild(c);
      }
      const rhythmus = repeatMode === "2wochen" ? "alle 2 Wochen" : "jede Woche";
      hint.textContent = repeatMode !== "none"
        ? (isNew && days.size > 1 ? days.size + " Einträge, " + rhythmus + " — z.B. Arbeit von Mo bis Fr in einem Rutsch." : "Taucht " + rhythmus + " auf.")
        : "Nur in dieser Woche (" + [...days].map(i => DAY_SHORT[i]).join(", ") + ", " + addDays(mon, [...days][0]).getDate() + "." + (addDays(mon, [...days][0]).getMonth() + 1) + ".).";
    };
    paintDays();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    if (!isNew) {
      const del = document.createElement("button");
      del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Löschen";
      del.onclick = () => {
        const weg = () => {
          unlinkTask(draft);
          state.blocks = state.blocks.filter(x => x.id !== draft.id);
          save(); close(); renderAll(); toastUndo("Eintrag gelöscht");
        };
        // Eine Serie zu löschen trifft jede (bzw. jede zweite) Woche, nicht
        // nur die angezeigte. Das passierte bisher ohne jede Nachfrage.
        if (istSerie(draft)) {
          const rhythmus = draft.repeat === "2wochen" ? "alle 2 Wochen" : "in jeder Woche";
          const d = hakenTag ? new Date(hakenTag + "T12:00:00") : null;
          const tagText = d ? DAY_LONG[(d.getDay() + 6) % 7] + ", " + d.getDate() + "." + (d.getMonth() + 1) + "." : "diesen Termin";
          const nur = () => {
            if (!draft.ausnahmen) draft.ausnahmen = [];
            if (!draft.ausnahmen.includes(hakenTag)) draft.ausnahmen.push(hakenTag);
            const b = state.blocks.find(x => x.id === draft.id);
            if (b) b.ausnahmen = draft.ausnahmen;
            save(); close(); renderAll(); toast("Termin am " + tagText + " übersprungen");
          };
          // push: true — bei „Abbrechen" bleibt der halb ausgefüllte Editor
          // dahinter erhalten statt zu verschwinden.
          confirmSheet(draft.repeat === "2wochen" ? "Zweiwöchentlicher Eintrag" : "Wöchentlicher Eintrag",
            "„" + (draft.title || "Ohne Titel") + "\" steht " + rhythmus + ". Nur diesen Termin (" + tagText + ") " +
            "überspringen, oder ihn aus allen Wochen löschen — auch aus den kommenden?",
            "Aus allen Wochen löschen", weg, { push: true, extra: hakenTag ? { label: "Nur diesen Termin", onClick: nur } : null });
        } else weg();
      };
      foot.appendChild(del);

      // Verschieben gehörte bisher nur der Tagesform — dabei ist moveSheet()
      // die beste Verschiebefunktion der App. Kein neuer Verschiebe-Code,
      // nur ein zweiter Weg dorthin.
      const move = document.createElement("button");
      move.className = "btn"; move.type = "button"; move.textContent = "Verschieben";
      move.onclick = () => { close(); moveSheet(draft.id); };
      foot.appendChild(move);
    }
    const sp = document.createElement("span"); sp.className = "spacer"; foot.appendChild(sp);
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = isNew ? "Eintragen" : "Speichern";

    const commit = () => {
      if (!pruefeZeit(true)) return;
      const st = parseTime(from.value), en = parseTime(to.value);
      const list = [...days];
      // Grobe Blöcke tragen ihre Dauer und den Abschnitt; start/end bleiben
      // nur als Anhaltspunkt gefüllt, damit Sortierungen weiter funktionieren.
      const grobFelder = () => grob
        ? { grob: true, teil, dauer, start: abschnittVon(teil).von, end: abschnittVon(teil).von + dauer }
        : { grob: false, teil: undefined, dauer: undefined, start: st, end: en };

      if (isNew) {
        // Stufe 12: kommt der Entwurf aus dem Aufgabenblatt ("In den
        // Wochenplan legen"), trägt er draft.taskId — der neue Block
        // bekommt die Verbindung, die Aufgabe zeigt danach "eingeplant"
        // statt eines Duplikats in der Liste. Derselbe Editor erlaubt aber
        // auch mehrere Tage auf einmal (list.length > 1) — eine Aufgabe ist
        // laut placeTask() aber GENAU EIN Block. Deshalb bekommt nur der
        // letzte erzeugte Block taskId, nicht jeder: sonst würden mehrere
        // Blöcke sich dieselbe Aufgabe teilen, während task.geplant ohnehin
        // nur auf einen zeigen kann.
        let letzteId = null;
        list.forEach((d, i) => {
          const nb = Object.assign({
            id: uid(), title: title.value.trim() || "Ohne Titel", areaId: draft.areaId,
            day: d, date: iso(addDays(mon, d)), repeat: repeatMode,
            since: iso(addDays(mon, d)), ortId: draft.ortId || null,
            // Die Stern-Markierung kam aus dem Entwurf und wurde hier
            // stillschweigend wieder auf false gesetzt — je nach Weg blieb sie
            // erhalten oder nicht.
            frog: !!draft.frog
          }, grobFelder());
          if (draft.taskId && i === list.length - 1) nb.taskId = draft.taskId;
          letzteId = nb.id;
          state.blocks.push(nb);
        });
        if (draft.taskId) {
          const tk = state.tasks.find(x => x.id === draft.taskId);
          if (tk) tk.geplant = letzteId;
        }
      } else {
        const b = state.blocks.find(x => x.id === draft.id);
        b.title = title.value.trim() || "Ohne Titel";
        b.areaId = draft.areaId;
        b.day = list[0];
        b.date = iso(addDays(mon, list[0]));
        b.repeat = repeatMode;
        b.ortId = draft.ortId || null;
        // since ist der Anker der Serie (bei "weekly" das Startdatum, bei
        // "2wochen" zusätzlich die Parität). Ein bereits gesetztes since
        // bleibt stehen — nur eine neu begonnene Serie bekommt eines, und
        // zwar das Datum, auf dem sie hier gerade liegt: der Termin steht
        // dann sichtbar dort, wo er gerade hingelegt wurde, am wenigsten
        // überraschend für alles, was danach kommt.
        if (repeatMode !== "none" && !b.since) b.since = b.date;
        if (repeatMode === "none") delete b.since;
        Object.assign(b, grobFelder());
        if (!b.grob) { delete b.teil; delete b.dauer; }
        // Wer einen Vorschlag von Hand bearbeitet, hat ihn angenommen.
        // Sonst entsteht ein Vorschlag, den keine Aufräumfunktion mehr findet.
        delete b.sug;
        // fix (Stufe 11): im Editor bearbeitet — der Verteiler rührt den
        // Block beim nächsten Durchlauf nicht mehr an.
        b.fix = true;
        if (doneBox) abhaken(b, hakenTag, doneBox.checked, doneBox);
        const tk = state.tasks.find(t => t.id === b.taskId && t.geplant === b.id);
        if (tk) { tk.title = b.title; tk.areaId = b.areaId; }
      }
      save(); close(); renderAll();
      toast(isNew ? "Eintrag im Wochenplan gespeichert" : "Eintrag gespeichert");
    };
    ok.onclick = commit;
    title.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
    foot.append(cancel, ok);
    s.appendChild(foot);
  });
}

/* ============================================================ Aufgaben */
let dragTaskId = null;

/* Bleibt zusammengeklappt, solange man nicht selbst aufklappt — kein Teil
   von state, das ist Bildschirmzustand, kein Datum, das der Abgleich
   irgendwem mitteilen müsste. */
let aufgabenErledigtOffen = false;

function aufgabenBlock(t) { return t.geplant ? state.blocks.find(b => b.id === t.geplant) : null; }
function blockInPlanwoche(b) { return !!b && weekDays().some(d => onDay(b, d.key, d.i)); }
function aufgabenTermin(b) {
  const tag = weekDays().find(d => onDay(b, d.key, d.i));
  return tag ? tag.key : b.date;
}
function aufgabeAbhaken(t, on) {
  const b = aufgabenBlock(t);
  t.done = !!on;
  if (b) {
    // Wer die Aufgabe als erledigt bestätigt, bestätigt auch ihre Durchführung.
    // Ein zugehöriger Vorschlag wird dabei zum tatsächlichen Eintrag.
    if (on && b.sug) { delete b.sug; b.fix = true; }
    setzeErledigt(b, aufgabenTermin(b), on);
  }
  save(); renderAll();
}

/* ============================================================
   Stufe 14: der Aufgaben-Bildschirm beantwortet eine Frage — "was hat noch
   keinen Platz?" — statt eine flache Liste zu sein. Drei Abschnitte, in
   dieser Reihenfolge: ohne Platz (das Wichtigste, steht oben), eingeplant
   (steht schon, wandert nur hierher), erledigt (zusammengeklappt). Leere
   Abschnitte erscheinen nicht — kein Platzhalter, kein "0 Aufgaben".
   ============================================================ */
function renderTasks() {
  const list = $("#taskList");
  const foot = $("#tasksFoot");
  list.innerHTML = "";
  foot.hidden = true; foot.innerHTML = "";

  if (!state.tasks.length) {
    list.innerHTML = "<div class='empty'><b>Was möchtest du angehen?</b>Notiere die nächste konkrete Handlung. Über „Planen“ bekommt sie einen Platz im Wochenplan.</div>";
    return;
  }

  const open = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done);
  if (!open.length) {
    const leer = document.createElement("div");
    leer.className = "empty";
    leer.innerHTML = "<b>Alles erledigt.</b>Neue Aufgaben kannst du oben notieren. Deine erledigten Aufgaben bleiben unten erreichbar.";
    list.appendChild(leer);
  }

  // Punkt C: mit Dauer vor ohne Dauer (die kann der Planer einplanen),
  // alphabetisch nur als letzter Schlüssel — Scannbarkeit vor Anlegereihenfolge.
  const ohnePlatz = open.filter(t => !aufgabenBlock(t)).sort((a, b) =>
    (a.dauer ? 0 : 1) - (b.dauer ? 0 : 1) || a.title.localeCompare(b.title, "de"));

  // Chronologisch nach Tag+Uhrzeit des Blocks, alphabetisch nur als letzter
  // Schlüssel.
  const sortiert = open.filter(t => aufgabenBlock(t)).sort((a, b) => {
    const ba = state.blocks.find(x => x.id === a.geplant);
    const bb = state.blocks.find(x => x.id === b.geplant);
    return aufgabenTermin(ba).localeCompare(aufgabenTermin(bb))
      || (ba ? ba.start : 0) - (bb ? bb.start : 0)
      || a.title.localeCompare(b.title, "de");
  });
  const eingeplant = sortiert.filter(t => blockInPlanwoche(aufgabenBlock(t)) && !aufgabenBlock(t).sug);
  const vorgeschlagen = sortiert.filter(t => blockInPlanwoche(aufgabenBlock(t)) && aufgabenBlock(t).sug);
  const andereWochen = sortiert.filter(t => !blockInPlanwoche(aufgabenBlock(t)));

  // Punkt B: der Tagesschwerpunkt steht ganz oben, dieselbe Sprache wie die
  // Agenda ("Heute zählt", ~5702) — dort für den Tag, hier für die Woche.
  // Ist keiner gesetzt: eine ruhige Einladung, keine Mahnung, kein Zwang.
  if (open.length) {
    const wichtig = open.find(t => t.frog);
    const kopf = document.createElement("div");
    kopf.className = "agenda__label";
    kopf.textContent = "Heute zählt";
    list.appendChild(kopf);
    if (wichtig) {
      const frog = document.createElement("button");
      frog.type = "button"; frog.className = "agenda__frog";
      frog.textContent = wichtig.title;
      frog.onclick = () => taskSheet(wichtig);
      list.appendChild(frog);
    } else {
      const einladung = document.createElement("div");
      einladung.className = "tasks__invite";
      einladung.textContent = "Noch kein Schwerpunkt gesetzt — öffne eine Aufgabe unten und wähle „Das Wichtigste“.";
      list.appendChild(einladung);
    }
  }

  const abschnitt = (label, tasks) => {
    if (!tasks.length) return;
    const kopf = document.createElement("div");
    kopf.className = "agenda__label";
    kopf.textContent = label;
    list.appendChild(kopf);
    tasks.forEach(t => list.appendChild(taskEl(t)));
  };
  abschnitt("Ohne Platz", ohnePlatz);
  abschnitt("Vorgeschlagen", vorgeschlagen);
  abschnitt("Eingeplant", eingeplant);
  abschnitt("Andere Wochen", andereWochen);

  if (done.length) {
    const kopf = document.createElement("button");
    kopf.type = "button"; kopf.className = "agenda__label tasks__toggle";
    kopf.setAttribute("aria-expanded", String(aufgabenErledigtOffen));
    kopf.innerHTML = "<span>Erledigt (" + done.length + ")</span><span aria-hidden='true'>"
      + (aufgabenErledigtOffen ? "⌃" : "⌄") + "</span>";
    kopf.onclick = () => { aufgabenErledigtOffen = !aufgabenErledigtOffen; renderTasks(); $("#taskList .tasks__toggle").focus(); };
    list.appendChild(kopf);
    if (aufgabenErledigtOffen) {
      done.forEach(t => list.appendChild(taskEl(t)));
      const weg = document.createElement("button");
      weg.type = "button"; weg.className = "btn btn--sm btn--ghost";
      weg.textContent = "Erledigte weg";
      weg.style.marginTop = "6px";
      weg.onclick = () => {
        const n = done.length;
        const ids = new Set(done.map(t => t.id));
        state.blocks.forEach(b => { if (ids.has(b.taskId)) delete b.taskId; });
        state.tasks = state.tasks.filter(x => !x.done);
        save(); renderAll(); toastUndo(n + " erledigt & weggeräumt");
      };
      list.appendChild(weg);
    }
  }

  // Punkt F: eine Kennzahl im Fuß, keine Wertung — dieselbe Sprache wie im
  // Wochenstart (Schritt "verteilen", ~6426: "X von Y Zielen hat einen
  // Platz"). Kein Ring, kein Balken, keine Farbe, nur der Satz.
  if (open.length) {
    foot.hidden = false;
    const zeitraum = istDieseWoche() ? "diese Woche" : "in KW " + isoWeek(mondayOf(anchor));
    foot.innerHTML = "<b>" + eingeplant.length + " von " + open.length + "</b> Aufgaben haben einen Platz " + zeitraum + "."
      + (vorgeschlagen.length ? " " + vorgeschlagen.length + " noch vorgeschlagen." : "");
  }
}

/* ============================================================
   Eine Aufgabenzeile

   Vorher hing an jeder Zeile ein Streifen aus vier winzigen Knöpfen: Bereich
   durchtippen, Stern, Kalender, Löschen. Am Telefon war davon einer gar nicht
   erreichbar — Löschen erschien nur beim Zeigen mit der Maus, und Zeigen gibt
   es dort nicht. Der Bereichsknopf schaltete pro Tipp einen Bereich weiter:
   sieben Tipps für den falschen Nachbarn.

   Jetzt hat die Zeile ein Häkchen, den Text und einen Punkt-Knopf. Alles
   andere steht im Blatt dahinter — mit Platz für richtige Trefferflächen und
   für Dinge, die vorher gar nicht gingen: den Titel ändern und sagen, wie
   lange die Aufgabe dauert.
   ============================================================ */

const TASK_DAUERN = [15, 30, 45, 60, 90, 120];

function taskEl(t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " is-done" : "");
  row.draggable = !t.done && !aufgabenBlock(t);

  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.className = "task__check"; cb.checked = t.done;
  cb.setAttribute("aria-label", "Erledigt: " + t.title);
  // v1.42: der abgehakte Haken trägt denselben Stein wie der fallende —
  // Bereichsfarbe, wenn die Aufgabe einen (noch vorhandenen) Bereich hat,
  // sonst Jade für beide. Sonst spränge die Farbe beim Landen.
  const bereich = state.areas.find(x => x.id === t.areaId);
  if (bereich) { cb.classList.add("is-bereich"); cb.style.setProperty("--h", bereich.hue); }
  cb.onchange = () => {
    if (cb.checked) jubel(cb, bereich ? bereich.hue : null, false);
    aufgabeAbhaken(t, cb.checked);
    const ziel = $("#taskList .task__check") || $("#taskList .tasks__toggle") || $("#taskInput");
    ziel.focus();
  };

  const body = document.createElement("div");
  body.className = "task__body";
  body.tabIndex = 0; body.setAttribute("role", "button");
  body.setAttribute("aria-label", "Aufgabe bearbeiten: " + t.title);
  body.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); taskSheet(t); }
  };

  const ti = document.createElement("div");
  ti.className = "task__title";
  if (t.frog) {
    const st = document.createElement("span");
    st.className = "task__star";
    st.title = "Das Wichtigste";
    ti.appendChild(st);
  }
  ti.append(t.title);

  const a = areaById(t.areaId);
  const meta = document.createElement("div");
  meta.className = "task__meta";
  meta.style.setProperty("--h", a.hue);
  // Stufe 12: eine verplante Aufgabe zeigt Tag+Uhrzeit ihres Blocks statt
  // der bloßen Dauer — sonst stünde dieselbe Aufgabe doppelt da: einmal
  // hier in der Liste, einmal als Block im Raster.
  const geplantBlock = aufgabenBlock(t);
  const tagText = geplantBlock ? (() => {
    const tag = new Date(aufgabenTermin(geplantBlock) + "T12:00:00");
    const zeit = geplantBlock.grob ? abschnittVon(geplantBlock.teil).name : fmtTime(geplantBlock.start);
    return DAY_SHORT[(tag.getDay() + 6) % 7] + ", " + tag.getDate() + "." + (tag.getMonth() + 1) + "."
      + (tag.getFullYear() !== new Date().getFullYear() ? tag.getFullYear() : "") + " · " + zeit;
  })() : "";
  meta.innerHTML = "<span class='chip__dot'></span>" + escapeHtml(a.name)
    + (geplantBlock
        ? "<span class='task__dur num'>" + (geplantBlock.sug ? "Vorschlag " : "eingeplant ") + tagText + "</span>"
        : (t.dauer ? "<span class='task__dur num'>" + fmtDur(t.dauer) + "</span>" : "<span>· Dauer offen</span>"));

  body.append(ti, meta);
  if (t.schritt && !t.done) {
    const schritt = document.createElement("div"); schritt.className = "task__step";
    schritt.innerHTML = "<b>Start:</b> " + escapeHtml(t.schritt); body.appendChild(schritt);
  }

  row.append(cb, body);

  // Offene Aufgaben führen direkt zum nächsten Schritt: planen oder
  // einen vorhandenen Vorschlag prüfen, ohne den Arbeitsbereich zu wechseln.
  if (!t.done && (!geplantBlock || geplantBlock.sug)) {
    const go = document.createElement("button");
    go.className = "task__go"; go.type = "button"; go.textContent = "Planen";
    go.title = "In den Wochenplan legen";
    go.setAttribute("aria-label", "In den Wochenplan legen: " + t.title);
    if (geplantBlock) {
      go.textContent = "Prüfen";
      go.title = "Vorschlag prüfen";
      go.setAttribute("aria-label", "Vorschlag prüfen: " + t.title);
    }
    go.onclick = e => { e.stopPropagation(); if (geplantBlock) sugSheet(geplantBlock); else planTask(t); };
    row.append(go);
  }

  const more = document.createElement("button");
  more.className = "task__more"; more.type = "button"; more.innerHTML = "···";
  more.title = "Bearbeiten";
  more.setAttribute("aria-label", "Aufgabe bearbeiten: " + t.title);
  more.onclick = e => { e.stopPropagation(); taskSheet(t); };

  row.append(more);

  // Der Text selbst öffnet dasselbe Blatt — am Telefon zielt niemand gern
  // auf drei Punkte, wenn die ganze Zeile daneben liegt.
  body.onclick = () => taskSheet(t);

  row.addEventListener("dragstart", e => {
    if (!row.draggable) { e.preventDefault(); return; }
    dragTaskId = t.id; row.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "copy";
    try { e.dataTransfer.setData("text/plain", t.title); } catch (err) {}
  });
  row.addEventListener("dragend", () => { dragTaskId = null; row.classList.remove("is-dragging"); });
  return row;
}

/* Stufe 14: der Weg "Aufgabe -> Plan", bisher nur der Knopf im Aufgaben-
   blatt (taskSheet unten), jetzt auch der Knopf direkt an der Zeile
   (taskEl, .task__go). Sucht wie gehabt die nächstgelegene freie Stelle
   des Tages (naechsteStelle) und öffnet den Block-Editor damit vorausgefüllt
   — kein stilles Eintragen ohne Blick auf Tag und Uhrzeit. */
function planTask(t) {
  const vorhanden = aufgabenBlock(t);
  if (vorhanden) {
    // Der Aufgabenbestand ist global. Öffnen muss den tatsächlichen Termin
    // zeigen und darf weder einen zweiten Block noch ein anderes Datum erzeugen.
    const key = aufgabenTermin(vorhanden);
    anchor = new Date(key + "T12:00:00");
    selectedDayIdx = (anchor.getDay() + 6) % 7;
    setView("plan"); renderAll();
    if (vorhanden.sug) sugSheet(vorhanden); else editBlock(vorhanden.id, key);
    return;
  }
  const d = addDays(mondayOf(anchor), selectedDayIdx);
  const laenge = t.dauer || 60;
  const wunsch = clamp(snap(new Date().getHours() * 60 + 60),
    state.settings.dayStart * 60, state.settings.dayEnd * 60 - laenge);
  const day = { i: selectedDayIdx, key: iso(d) };
  const gefunden = naechsteStelle(day, laenge, wunsch, taskVorhaben(t));
  const start = gefunden == null ? wunsch : gefunden;
  blockSheet({
    id: null, title: t.title, areaId: t.areaId || state.areas[0].id,
    day: selectedDayIdx, date: iso(d), repeat: "none",
    start, end: start + laenge, frog: !!t.frog, taskId: t.id
  }, iso(d));
}

function taskSheet(t) {
  modal((s, close) => {
    let areaId = t.areaId || state.areas[0].id;
    let dauer = t.dauer || 0;
    let wichtig = !!t.frog;

    s.innerHTML =
      "<h2 class='sheet__title'>Aufgabe</h2>" +
      "<div class='sheet__row'><label class='label' for='tkTitle'>Was ist zu tun?</label>" +
      "<input class='field' id='tkTitle' autocomplete='off'></div>" +
      "<div class='sheet__row'><label class='label' for='tkSchritt'>Erster kleiner Schritt <span style='font-weight:400'>(optional)</span></label>" +
      "<input class='field' id='tkSchritt' maxlength='240' placeholder='z. B. Dokument öffnen und drei Stichpunkte notieren' autocomplete='off' aria-describedby='tkSchrittHint'>" +
      "<div class='task__step' id='tkSchrittHint'>Was kannst du als Erstes in wenigen Minuten tun?</div></div>" +
      "<div class='sheet__row'><span class='label'>Bereich</span>" +
      "<div class='chipset' id='tkAreas'></div></div>" +
      "<div class='sheet__row'><span class='label'>Wie lange dauert das?</span>" +
      "<div class='chipset' id='tkDauer'></div>" +
      "<div id='tkDauerHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:8px;line-height:1.5'></div></div>" +
      "<div class='sheet__row'><label class='switch'><input type='checkbox' id='tkFrog'> " +
      "Das Wichtigste — zuerst dran</label></div>" +
      "<div class='sheet__row' id='tkRegeln' hidden></div>";

    const titel = s.querySelector("#tkTitle");
    titel.value = t.title;
    titel.required = true;
    titel.oninput = () => titel.setCustomValidity("");
    const schritt = s.querySelector("#tkSchritt");
    schritt.value = t.schritt || "";

    const areaWrap = s.querySelector("#tkAreas");
    const malAreas = () => {
      areaWrap.innerHTML = "";
      state.areas.forEach(a => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip";
        c.style.setProperty("--h", a.hue);
        c.setAttribute("aria-pressed", String(a.id === areaId));
        c.innerHTML = "<span class='chip__dot'></span>";
        c.append(a.name);
        c.onclick = () => { areaId = a.id; malAreas(); };
        areaWrap.appendChild(c);
      });
    };
    malAreas();

    const dWrap = s.querySelector("#tkDauer");
    const dHint = s.querySelector("#tkDauerHint");
    const malDauer = () => {
      dWrap.innerHTML = "";
      const keine = document.createElement("button");
      keine.type = "button"; keine.className = "chip";
      keine.textContent = "weiß nicht";
      keine.setAttribute("aria-pressed", String(!dauer));
      keine.onclick = () => { dauer = 0; malDauer(); };
      dWrap.appendChild(keine);
      TASK_DAUERN.forEach(m => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip num";
        c.textContent = fmtDur(m);
        c.setAttribute("aria-pressed", String(dauer === m));
        c.onclick = () => { dauer = m; malDauer(); };
        dWrap.appendChild(c);
      });
      dHint.textContent = dauer
        ? "„In den Wochenplan legen\" nimmt " + fmtDur(dauer) + " statt einer Stunde."
        : "Ohne Angabe wird beim Einplanen eine Stunde angenommen.";
      if (aufgabenBlock(t)) dHint.textContent = "Das ist deine Schätzung. Die Dauer des bestehenden Termins änderst du direkt im Plan.";
    };
    malDauer();

    const frogBox = s.querySelector("#tkFrog");
    frogBox.checked = wichtig;
    frogBox.onchange = () => { wichtig = frogBox.checked; };

    // Wann genau — hinter einem Umschalter wie im Zieldialog, damit die
    // schnelle Aufgabe schnell bleibt und Regeln nur sieht, wer sie will.
    const regelnToggle = document.createElement("button");
    regelnToggle.type = "button"; regelnToggle.className = "btn";
    regelnToggle.style.width = "100%";
    regelnToggle.setAttribute("aria-expanded", "false");
    regelnToggle.textContent = "Wann genau? ⌄";
    const regelnBody = s.querySelector("#tkRegeln");
    const regeln = regelnEditor(regelnBody, t, null);
    regelnToggle.onclick = () => {
      const open = regelnBody.hidden;
      regelnBody.hidden = !open;
      regelnToggle.setAttribute("aria-expanded", String(open));
      regelnToggle.textContent = open ? "Wann genau? ⌃" : "Wann genau? ⌄";
    };
    s.insertBefore(regelnToggle, regelnBody);

    const inPlan = document.createElement("button");
    inPlan.className = "btn"; inPlan.type = "button";
    inPlan.style.width = "100%";
    const schonGeplant = aufgabenBlock(t);
    inPlan.textContent = schonGeplant ? (schonGeplant.sug ? "Vorschlag prüfen" : "Eintrag im Plan öffnen") : "In den Wochenplan legen";
    inPlan.onclick = () => {
      // Stufe 14: dieselbe Suche nach der nächstgelegenen freien Stelle
      // (naechsteStelle) steckt jetzt in planTask() — geteilt mit dem
      // Knopf direkt an der Zeile ohne Platz (taskEl, .task__go).
      // uebernehmen() zieht Titel/Bereich/Dauer/Stern vorher auf t, damit
      // planTask(t) denselben Stand sieht wie diese Felder gerade zeigen.
      if (!uebernehmen()) return;
      close();
      planTask(t);
    };
    s.appendChild(inPlan);

    function uebernehmen() {
      const neu = titel.value.trim();
      titel.setCustomValidity(neu ? "" : "Gib der Aufgabe einen kurzen Titel.");
      if (!titel.reportValidity()) return false;
      t.title = neu;
      if (schritt.value.trim()) t.schritt = schritt.value.trim().slice(0, 240); else delete t.schritt;
      t.areaId = areaId;
      if (dauer) t.dauer = dauer; else delete t.dauer;
      if (wichtig && !t.frog) state.tasks.forEach(x => x.frog = false);
      t.frog = wichtig;
      const geplant = aufgabenBlock(t);
      if (geplant) { geplant.title = t.title; geplant.areaId = areaId; geplant.frog = wichtig; }
      regeln.commit();
      save();
      renderAll();
      return true;
    }

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    const del = document.createElement("button");
    del.className = "btn btn--danger"; del.type = "button"; del.textContent = "Löschen";
    del.onclick = () => {
      // Stufe 12: der Block bleibt stehen, verliert nur die Verbindung —
      // sonst würde eine gelöschte Aufgabe stillschweigend einen Termin
      // mitreißen, den man vielleicht längst wahrgenommen hat.
      state.blocks.forEach(b => { if (b.taskId === t.id) delete b.taskId; });
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      save(); close(); renderAll(); toastUndo("Aufgabe gelöscht");
    };
    const sp = document.createElement("span"); sp.className = "spacer";
    const ab = document.createElement("button");
    ab.className = "btn"; ab.type = "button"; ab.textContent = "Abbrechen";
    ab.onclick = close;
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Speichern";
    ok.onclick = () => { if (!uebernehmen()) return; close(); renderAll(); };
    titel.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok.onclick(); } };
    foot.append(del, sp, ab, ok);
    s.appendChild(foot);
  });
}

$("#taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#taskInput");
  const v = inp.value.trim();
  const fehler = $("#taskError");
  if (!v) {
    fehler.textContent = "Gib eine Aufgabe ein, zum Beispiel „Einkaufen“.";
    fehler.hidden = false;
    inp.setAttribute("aria-invalid", "true");

  }
  state.tasks.unshift({ id: uid(), title: v, areaId: state.areas[0].id, done: false, frog: false });

  inp.focus();
  toast("Aufgabe hinzugefügt — mit „Planen“ in die Woche legen");
});
