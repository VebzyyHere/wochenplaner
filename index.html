/* ============================================================ Tagesform */
const ENERGY = {
  low:  { text: "<b>Wenig Energie.</b> Dann muss nicht alles heute sein. Der Planer zeigt dir unten, was an diesem Tag optional ist — streichen oder verschieben ist auch eine Entscheidung." },
  mid:  { text: "<b>Normal.</b> Das Wichtigste zuerst, der Rest ergibt sich. Pausen nimmst du, wenn du sie brauchst — nicht, wenn ein Timer klingelt." },
  high: { text: "<b>Viel Energie.</b> Guter Tag für das, was sonst liegen bleibt. Nimm es dir jetzt, bevor der Tag es frisst." },
  none: { text: "Wie fühlst du dich heute? An einem schwachen Tag zeigt der Planer, was heute nicht sein muss — an einem starken bleibt er still." }
};

function currentDayIso() { return iso(addDays(mondayOf(anchor), selectedDayIdx)); }

/* ============================================================
   Agenda (Stufe 4) — erstes Kind der Karte data-card="heute" (Markup
   ~1173). Läuft VOR renderEnergy(), das direkt danach dieselbe Karte
   weiterschreibt (#energyDay, #energyHint, #dayFrei, #dayFreiLab) — beide
   fassen nur ihre eigenen Knoten an, keiner ersetzt die Karte.

   Ladezustand: solange Sync.boot() (ganz unten) noch nicht durch ist, zeigt
   die Karte die Schraffur statt eines Standes, der gleich stillschweigend
   getauscht werden könnte — auf einem Zweitgerät sähe das sonst aus wie
   Datenverlust. */
function renderAgenda() {
  const box = $("#agenda");
  if (!box) return;

  if (!syncSettled) {
    box.innerHTML = "<div class='agenda__loading' aria-hidden='true'></div>";
    return;
  }

  const dayKey = currentDayIso();
  const dayIdx = selectedDayIdx;
  const heute = dayKey === iso(new Date());
  const jetzt = new Date().getHours() * 60 + new Date().getMinutes();

  const wichtig = state.tasks.find(t => t.frog && !t.done);
  // Stufe C Punkt C3: das Hero-Label heißt nur am heutigen Tag "Heute
  // zählt" — an einem anderen Tag im Tagesstreifen (der seine Tagesform
  // korrekt "Sonntag, 9.8." nennt) wäre "Heute" schlicht falsch.
  // v1.33: die Begrüßung steht in derselben Zeile wie „Heute zählt" —
  // nur am heutigen Tag, und ohne eine Zeile Höhe zu kosten.
  const eintraege = tagesAgenda(dayKey, dayIdx);
  // v1.36: kleiner Fortschrittsring „x/y" neben der Begrüßung — nur lesen,
  // gezählt wird über istErledigt() wie beim Abhaken. Kostet keine Zeile.
  const fertigZahl = eintraege.filter(e => istErledigt(e.block, dayKey)).length;
  const umfang = 2 * Math.PI * 9;
  const fortHtml = eintraege.length
    ? "<span class='agenda__fort' aria-label='" + fertigZahl + " von " + eintraege.length + " erledigt'>"
      + "<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9'/><circle class='agenda__fortbogen' cx='12' cy='12' r='9' stroke-dasharray='"
      + (umfang * fertigZahl / eintraege.length).toFixed(1) + " " + umfang.toFixed(1) + "'/></svg>"
      + "<b class='num'>" + fertigZahl + "/" + eintraege.length + "</b></span>"
    : "";
  const grussText = heute ? gruss() : "";
  let html = "<div class='agenda__kopfzeile" + (grussText.length > 22 ? " is-lang" : "") + "'><div class='agenda__label'>" + (heute ? "Heute" : DAY_LONG[dayIdx]) + " zählt</div>"
    + (heute ? "<span class='agenda__gruss'>" + escapeHtml(grussText) + "</span>" : "") + fortHtml + "</div>"
    + "<button type='button' class='agenda__frog' id='agendaFrog'>"
    + (wichtig ? "<span class='agenda__frogtext' style=\"background-image:" + kringel((areaById(wichtig.areaId) || { hue: 150 }).hue) + "\">" + escapeHtml(wichtig.title) + "</span>" : "Schwerpunkt wählen") + "</button>"
    + (wichtig && wichtig.schritt ? "<div class='agenda__step'><b>Erster Schritt:</b> " + escapeHtml(wichtig.schritt) + "</div>" : "");

  const laufend = heute
    ? eintraege.find(e => !e.grob && e.block.start <= jetzt && jetzt < e.block.end)
    : null;
  const danach = eintraege.filter(e => {
    if (e === laufend) return false;
    if (!heute) return true;
    return e.grob ? abschnittVon(e.block.teil).bis > jetzt : e.block.start > jetzt;
  });

  // Stufe B1: die Vorschläge DIESES Tages, separat von tagesAgenda() (deren
  // Stufe-4-Ausschluss von b.sug bleibt unangetastet — daran hängen
  // freieZeitDanach() und die Danach-Logik oben). Dasselbe Misch-Muster wie
  // tagesAgenda() selbst: exakte + grobe, nach Beginn sortiert, nur eben
  // sug:true statt sug:false.
  const heutigeVorschlaege = [
    ...blocksFor(addDays(mondayOf(anchor), dayIdx), dayIdx).filter(b => b.sug)
      .map(b => ({ block: b, grob: false, sortMin: b.start })),
    ...grobeFor(dayKey, dayIdx).filter(b => b.sug)
      .map(b => ({ block: b, grob: true, sortMin: abschnittVon(b.teil).von }))
  ].sort((a, b) => a.sortMin - b.sortMin);
  const vorschlagHtml = heutigeVorschlaege.length
    ? "<div class='agenda__label'>Vorschläge</div><div class='agenda__list'>"
      + heutigeVorschlaege.map(e => {
          const b = e.block, a = areaById(b.areaId);
          const zeit = e.grob ? abschnittVon(b.teil).name + " ~" + fmtDur(b.dauer) : fmtTime(b.start);
          const grundAnzeige = grundZumZeigen(b);
          // Stufe C Punkt C9: tastaturbedienbar wie ein Rasterblock
          // (blockEl(), tabIndex/role/aria-label dort als Vorbild).
          const ariaLabel = "Vorschlag: " + escapeHtml(b.title || a.name) + ", " + zeit + ", " + escapeHtml(a.name);
          return "<div class='agenda__row is-vorschlag' style='--h:" + a.hue + "' data-id='" + b.id + "'"
            + " tabindex='0' role='button' aria-label='" + ariaLabel + "'>"
            + "<span class='agenda__body'><span class='agenda__line'>"
            + "<span class='agenda__title'>" + escapeHtml(b.title || a.name) + "</span>"
            + "<span class='agenda__time num'>" + zeit + "</span></span>"
            + (grundAnzeige ? "<span class='agenda__sub'>" + escapeHtml(grundAnzeige) + "</span>" : "")
            + "</span>"
            + "<span class='agenda__sugacts'>"
            + "<button type='button' data-vorschlag-ok='" + b.id + "' aria-label='Vorschlag übernehmen' title='Übernehmen'>✓</button>"
            + "<button type='button' data-vorschlag-nein='" + b.id + "' aria-label='Vorschlag verwerfen' title='Verwerfen'>×</button>"
            + "</span></div>";
        }).join("")
      + "</div>"
    : "";

  if (!laufend && !danach.length) {
    // Ein bewusst freigehaltener Tag ohne Eintraege sieht sonst wortgleich
    // aus wie ein einfach vergessener — samt "Vorschlagen"-Knopf, der hier
    // ohnehin nichts ausloest (istFrei-Vertrag in buildSuggestions()).
    if (!eintraege.length && istFrei(dayKey)) {
      html += "<div class='empty'><b>Bewusst frei</b>Diesen Tag hast du dir bewusst freigehalten.</div>";
    } else if (!eintraege.length && heutigeVorschlaege.length) {
      // Stufe B1: der Tag ist nicht "leer" — es liegt schon etwas vor, nur
      // noch nicht entschieden. "Vorschlagen" entfällt hier: die Leiste
      // unten bietet Übernehmen/Verwerfen bereits an, ein zweiter Weg zum
      // Verteiler würde nur weitere Vorschläge obendrauf erzeugen.
      html += "<div class='empty'><b>Noch nichts fest</b>" + heutigeVorschlaege.length
        + (heutigeVorschlaege.length === 1 ? " Vorschlag" : " Vorschläge") + " für diesen Tag.</div>"
        + vorschlagHtml;
    } else {
      html += "<div class='empty'><b>" + (eintraege.length ? "Nichts mehr offen" : "Noch nichts geplant") + "</b>"
        + (eintraege.length ? "Für heute ist nichts mehr fällig. Gut gemacht." : "Der Tag gehört noch ganz dir. Soll der Planer etwas vorschlagen?")
        + "</div><button type='button' class='btn btn--primary btn--sm' id='agendaVorschlag'>Vorschlagen</button>";
    }
  } else {
    if (laufend) {
      const a = areaById(laufend.block.areaId);
      const rest = laufend.block.end - jetzt;
      html += "<div class='agenda__hero' style='--h:" + a.hue + "'>"
        + "<div class='agenda__hero-status'><span>" + escapeHtml(a.name) + "</span><span class='tag'>läuft</span></div>"
        + "<div class='agenda__hero-title'>" + escapeHtml(laufend.block.title || a.name) + "</div>"
        + "<div class='agenda__hero-sub'>noch " + fmtDur(rest) + "</div>"
        + "</div>";
    }

    if (danach.length) {
      // Stufe C Punkt C4: "Danach" stimmt nur heute — an einem anderen Tag
      // läuft nichts, die Liste ist dort schlicht der geplante Tag.
      html += "<div class='agenda__label'>" + (heute ? "Danach" : "Geplant") + "</div><div class='agenda__list'>";
      // Woher kommt man? Ohne laufenden Eintrag wird der Heimatort
      // angenommen — sonst gäbe es beim ersten Eintrag nie eine Wegzeit.
      let vorherOrt = laufend ? ortOf(laufend.block) : (state.settings.heimOrt || null);
      danach.forEach(e => {
        const b = e.block, a = areaById(b.areaId);
        const fertig = istErledigt(b, dayKey);
        let zeit, sub = "";
        const grundAnzeige = grundZumZeigen(b);
        if (e.grob) {
          zeit = abschnittVon(b.teil).name + " ~" + fmtDur(b.dauer);
          if (grundAnzeige) sub = escapeHtml(grundAnzeige);
        } else {
          zeit = fmtTime(b.start);
          const ortId = ortOf(b);
          const ortNaam = ortId ? ortName(ortId) : "";
          // Ort hat Vorrang vor dem Grund (Stufe 13): er sagt WO, das ist am
          // Ort-Bildschirm gefragter als das WARUM — der Grund bleibt im
          // Vorschlags-/Block-Blatt abrufbar. Zwei Unterzeilen wären auf
          // 320px zu viel (s. Auftrag).
          if (ortNaam) {
            const fahrt = weg(vorherOrt, ortId);
            sub = escapeHtml(ortNaam) + (fahrt > 0 ? " · " + fahrt + " min Weg" : "");
          } else if (grundAnzeige) {
            sub = escapeHtml(grundAnzeige);
          }
          vorherOrt = ortId || vorherOrt;
        }
        html += "<label class='agenda__row" + (e.grob ? " agenda__row--grob" : "") + (fertig ? " is-on" : "")
          + "' style='--h:" + a.hue + "'>"
          + "<input type='checkbox' class='agenda__check' data-id='" + b.id + "'" + (fertig ? " checked" : "") + ">"
          + "<span class='agenda__body'><span class='agenda__line'>"
          + "<span class='agenda__title'>" + escapeHtml(b.title || a.name) + "</span>"
          + "<span class='agenda__time num'>" + zeit + "</span></span>"
          + (sub ? "<span class='agenda__sub'>" + sub + "</span>" : "")
          + "</span></label>";
      });
      html += "</div>";
    }

    // Stufe B1: eigener Abschnitt unterhalb von "Danach", vor der Fußzeile —
    // dieselbe Sektion wie im Leerzustand oben, hier nur als Anschluss statt
    // als Ersatz.
    html += vorschlagHtml;

    const frei = freieZeitDanach(dayKey, dayIdx);
    if (frei && frei.total >= 15) {
      html += "<div class='agenda__foot'>Danach frei · längster Block " + fmtDur(frei.longest) + "</div>";
    }

    // Stufe 15: "Tag durcheinander?" — nur am heutigen Tag (sonst betrifft
    // ein Antippen einen fremden Tag, den man gerade nur zum Nachsehen
    // aufgeklappt hat), nur solange es dort ueberhaupt noch etwas gibt
    // (sonst waere der Knopf blosses Rauschen), und nur VOR der
    // Feierabendzeit — danach uebernimmt der Tagesabschluss direkt darunter
    // dieselbe Rolle fuer den Tagesrest, zwei Angebote uebereinander waeren
    // unruhig. "Durcheinander" setzt zudem voraus, dass fuer heute ueberhaupt
    // schon etwas stand — bei einem komplett leeren Tag (Zweig oben) sagt das
    // "Vorschlagen" dort bereits alles Noetige. Feierabend wie unten aus
    // dayEnd und der Nachtruhe abgeleitet, hier bewusst noch einmal
    // ausgeschrieben statt geteilt — dieselbe Dopplung wie schon zweimal
    // in dieser Datei (s. Kommentar unten).
    const feierabendJetzt = restSpans().filter(r => r.end >= 1440).map(r => r.start);
    const feierabendGrenze = Math.min(state.settings.dayEnd * 60, ...(feierabendJetzt.length ? feierabendJetzt : [1440]));
    if (heute && jetzt < feierabendGrenze && restDesTagesMoeglich()) {
      html += "<button type='button' class='btn btn--sm btn--ghost' id='restTagBtn' style='width:100%'>" +
        "Tag durcheinander? Rest neu vorschlagen</button>";
    }
  }

  // Tagesabschluss (Stufe 13 Teil E): ab Feierabend jede heute offene Sache
  // einmal verorten — abhaken, schieben oder zurück in die Aufgaben. Kein
  // automatisches Verschieben auf morgen: das wäre der Punkt, an dem andere
  // Planer bevormundend werden (s. Auftrag) — jede der drei Aktionen ist ein
  // eigener Klick. Feierabend wie in grundAbzug (3159 ff.) aus dayEnd und der
  // Nachtruhe abgeleitet, hier absichtlich noch einmal ausgeschrieben statt
  // geteilt — dieselbe kleine Dopplung trägt der Code schon zweimal (dort
  // und in slotScore). dayMeta().abschlussWeg blendet für den Rest des Tages
  // aus, genau wie .frei/.energy/.erststartSpaeter kein eigener Speicher.
  const feierabendRuhe = restSpans().filter(r => r.end >= 1440).map(r => r.start);
  const feierabend = Math.min(state.settings.dayEnd * 60, ...(feierabendRuhe.length ? feierabendRuhe : [1440]));
  const tagMeta = heute ? dayMetaLesen(dayKey) : null;
  const offenHeute = heute ? eintraege.filter(e => !istErledigt(e.block, dayKey)) : [];
  if (heute && jetzt >= feierabend && !(tagMeta && tagMeta.abschlussWeg) && offenHeute.length) {
    html += "<div class='agenda__label'>Tagesabschluss</div>"
      + "<div class='abschlussliste'>"
      + offenHeute.map(e => {
          const b = e.block, a = areaById(b.areaId);
          const zeit = e.grob ? abschnittVon(b.teil).name + " ~" + fmtDur(b.dauer) : fmtTime(b.start);
          return "<div class='abschlussrow' style='--h:" + a.hue + "'>"
            + "<div class='abschlussrow__title'><span class='goal__dot'></span>"
            + escapeHtml(b.title || a.name)
            + "<span class='abschlussrow__zeit num'>" + zeit + "</span></div>"
            + "<div class='abschlussrow__acts'>"
            + "<button type='button' class='btn btn--sm' data-abschluss='ab' data-id='" + b.id + "'>Abhaken</button>"
            + "<button type='button' class='btn btn--sm' data-abschluss='schieben' data-id='" + b.id + "'>Schieben</button>"
            + "<button type='button' class='btn btn--sm' data-abschluss='aufgabe' data-id='" + b.id + "'>Zu Aufgaben</button>"
            + "</div></div>";
        }).join("")
      + "</div>"
      + "<button type='button' class='btn btn--sm btn--ghost' id='abschlussWeg' style='width:100%'>Für heute ausblenden</button>";
  }

  box.innerHTML = html;

  $("#agendaFrog").onclick = () => { if (wichtig) taskSheet(wichtig); else setView("aufgaben"); };
  const vorschlagBtn = $("#agendaVorschlag");
  if (vorschlagBtn) vorschlagBtn.onclick = () => verteilenMitGate(() => {
    const r = buildSuggestions();
    save(); renderAll();
    if (!r.placed) toast((r.hinweise && r.hinweise[0]) || "Kein Platz gefunden — Zeitfenster erweitern?");
    else toast("Vorschlag steht — schau, ob's dir passt");
  });
  const restTagBtn = $("#restTagBtn");
  if (restTagBtn) restTagBtn.onclick = () => {
    const r = restDesTagesBauen();
    save(); renderAll();
    if (!r.placed) toast((r.hinweise && r.hinweise[0]) || "Kein Platz gefunden — Zeitfenster erweitern?");
    else toast("Rest des Tages neu vorgeschlagen — schau, ob's dir passt");
  };

  // Vorschlagszeilen (Stufe B1): ✓/× rufen dieselben Funktionen wie die
  // gleichnamigen Knöpfe im Raster (blockEl, ~4931 ff.) — acceptOne()/
  // dropOne() erledigen dort schon save()+renderAll()+toast() und das
  // Lösen der Aufgaben-Verknüpfung, kein zweiter Weg dafür nötig.
  box.querySelectorAll("[data-vorschlag-ok]").forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); acceptOne(btn.dataset.vorschlagOk); };
  });
  box.querySelectorAll("[data-vorschlag-nein]").forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); dropOne(btn.dataset.vorschlagNein); };
  });
  // Die Zeile selbst (nicht die Knöpfe) öffnet das vorhandene Vorschlags-
  // Blatt — kein Long-Press, kein Drag hier (s. Auftrag), darum ein eigener,
  // schlichter Klick-Handler statt der Verschieben-Logik weiter unten.
  box.querySelectorAll(".agenda__row.is-vorschlag").forEach(row => {
    row.addEventListener("click", () => {
      const b = state.blocks.find(x => x.id === row.dataset.id);
      if (b) sugSheet(b);
    });
    // Stufe C Punkt C9: Enter/Space wie am Rasterblock (blockEl(), ~4931 ff.).
    row.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      const b = state.blocks.find(x => x.id === row.dataset.id);
      if (b) sugSheet(b);
    });
  });

  box.querySelectorAll(".agenda__check").forEach(cb => {
    cb.onchange = () => {
      const b = state.blocks.find(x => x.id === cb.dataset.id);
      if (!b) return;
      abhaken(b, dayKey, cb.checked, cb);
      const lab = cb.closest(".agenda__row");
      if (lab) lab.classList.toggle("is-on", cb.checked);
      save();
      renderTasks(); renderGoals(); renderGrid(); renderAgenda();
    };
  });

  // Tagesabschluss — drei Aktionen je Zeile (Stufe 13 Teil E). "Schieben"
  // nutzt denselben moveSheet() wie das lange Drücken unten (5734 ff.),
  // statt einen zweiten Tagesauswahl-Dialog zu bauen.
  box.querySelectorAll("[data-abschluss]").forEach(btn => {
    btn.onclick = () => {
      const b = state.blocks.find(x => x.id === btn.dataset.id);
      if (!b) return;
      const art = btn.dataset.abschluss;
      if (art === "ab") {
        abhaken(b, dayKey, true, btn);
        save(); renderAll();
      } else if (art === "schieben") {
        moveSheet(b.id);
      } else if (art === "aufgabe") {
        // Wie unlinkTask() beim Löschen einer Aufgabe (5389 ff.), nur
        // umgekehrt: der Block geht, die Aufgabe bleibt — und entsteht neu,
        // wenn es noch keine gab.
        unlinkTask(b);
        if (!b.taskId) {
          state.tasks.unshift({ id: uid(), title: b.title || areaById(b.areaId).name,
            areaId: b.areaId, done: false, frog: !!b.frog, dauer: dauerVon(b) });
        }
        state.blocks = state.blocks.filter(x => x.id !== b.id);
        save(); renderAll();
        toastUndo("Zurück in die Aufgaben");
      }
    };
  });
  const abschlussWegBtn = $("#abschlussWeg");
  if (abschlussWegBtn) abschlussWegBtn.onclick = () => {
    dayMeta(dayKey).abschlussWeg = true;
    save(); renderAgenda();
  };

  // Verschieben aus der Agenda — ohne die Zeile mit einem eigenen Knopf
  // zuzustellen. Langes Drücken spricht dieselbe Sprache wie das Anlegen
  // im Raster (holdToCreate, HOLD_TIME). Der Haken bleibt unberührt: wer
  // ihn trifft, will abhaken, nicht verschieben. Vorschlagszeilen haben
  // weder Haken noch Long-Press (eigener Klick-Handler oben) — ausgenommen,
  // sonst risse das querySelector(".agenda__check") unten ins Leere.
  box.querySelectorAll(".agenda__row:not(.is-vorschlag)").forEach(row => {
    const id = row.querySelector(".agenda__check").dataset.id;
    row.title = "Lange drücken zum Verschieben";
    let timer = null, longPressed = false, move = null;
    const cancel = () => {
      clearTimeout(timer);
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", cancel);
      document.removeEventListener("pointercancel", cancel);
    };
    row.addEventListener("pointerdown", e => {
      if (e.target.closest(".agenda__check")) return;
      // Neuer Versuch, alte Sperre ist Vergangenheit — moveSheet() legt
      // sich beim letzten Mal über die Zeile, sodass der Klick, der die
      // Sperre unten wieder aufhebt, sie nie erreicht hat. Ohne dieses
      // Zurücksetzen bliebe ein ganz normaler Tipp danach fälschlich
      // gesperrt.
      longPressed = false;
      const x0 = e.clientX, y0 = e.clientY;
      move = ev => {
        if (Math.abs(ev.clientY - y0) > TAP_SLOP || Math.abs(ev.clientX - x0) > TAP_SLOP) cancel();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", cancel);
      document.addEventListener("pointercancel", cancel);
      timer = setTimeout(() => {
        cancel();
        longPressed = true;
        if (navigator.vibrate) navigator.vibrate(12);
        const b = state.blocks.find(x => x.id === id);
        if (b) moveSheet(b.id);
      }, HOLD_TIME);
    });
    // v1.35: Wischen nach rechts hakt ab (oder hebt den Haken auf) — nur mit
    // dem Finger; die Zeile folgt ihm, dahinter erscheint die Bestätigung.
    // Ab WISCH_AB px gilt es beim Loslassen. Senkrecht bleibt Scrollen, das
    // lange Drücken bricht wie bisher bei Bewegung ab (move oben).
    let wx = 0, wy = 0, wachse = null, wdx = 0, gewischt = false, wAktiv = false;
    const cb = row.querySelector(".agenda__check");
    // v1.40: nach links = Verschieben (dieselbe Tür wie langes Drücken).
    const wischZeigen = dx => {
      row.style.setProperty("--wisch", dx + "px");
      row.style.setProperty("--wisch-links", -dx + "px");
      row.classList.toggle("is-wisch", dx !== 0);
      row.classList.toggle("is-wisch-links", dx < 0);
      row.classList.toggle("is-wisch-voll", Math.abs(dx) >= WISCH_AB);
    };
    row.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" || e.target.closest(".agenda__check")) return;
      wx = e.clientX; wy = e.clientY; wachse = null; wdx = 0; wAktiv = true;
      row.dataset.wischZiel = cb.checked ? "zurueck" : "ab";
    });
    row.addEventListener("pointermove", e => {
      if (!wAktiv) return;
      const dx = e.clientX - wx, dy = e.clientY - wy;
      if (wachse === null) {
        if (Math.hypot(dx, dy) < 10) return;
        wachse = Math.abs(dx) > Math.abs(dy) * 1.5 ? "x" : "y";
        if (wachse === "y") { wAktiv = false; return; }
      }
      wdx = clamp(dx, -140, 140);
      wischZeigen(wdx);
    });
    const wischEnde = () => {
      if (!wAktiv) return;
      wAktiv = false;
      if (wachse === "x") {
        gewischt = true;
        if (wdx >= WISCH_AB) {
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event("change"));
        } else if (wdx <= -WISCH_AB) {
          const b = state.blocks.find(x => x.id === id);
          if (b) moveSheet(b.id);
        }
      }
      wischZeigen(0);
    };
    row.addEventListener("pointerup", wischEnde);
    row.addEventListener("pointercancel", wischEnde);
    // Der Klick, der nach dem Loslassen folgt, würde sonst als Label-Klick
    // den Haken umschalten — genau das soll nach einem langen Druck oder
    // einem Wischen nicht mehr passieren.
    row.addEventListener("click", e => {
      if (longPressed || gewischt) { e.preventDefault(); longPressed = false; gewischt = false; }
    });
  });
}

function renderEnergy() {
  const key = currentDayIso();
  const meta = state.days[key] || {};
  const lvl = meta.energy;
  document.querySelectorAll(".energy__opt").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lvl === lvl));
  });
  const d = addDays(mondayOf(anchor), selectedDayIdx);
  $("#energyDay").textContent = DAY_LONG[selectedDayIdx] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ".";
  // v1.32: „Das Wichtigste: …" stand hier ein zweites Mal — dieselbe Karte
  // nennt den Schwerpunkt schon ganz oben („Heute zählt", renderAgenda()).
  $("#energyHint").innerHTML = ENERGY[lvl || "none"].text;
  renderEnergyAction();

  const freiBox = $("#dayFrei");
  freiBox.checked = istFrei(key);
  $("#dayFreiLab").textContent = freiBox.checked
    ? "Dieser Tag bleibt frei" : "Diesen Tag freihalten";
}
/* ============================================================
   Was kann heute weg?

   Der Tagesform-Schalter hat lange nur den Timer gestellt — er sah aus
   wie ein Regler, der den Plan anpasst, war aber keiner. Das hier ist
   der fehlende Hebel: an einem schwachen Tag zeigt der Planer, was heute
   nicht sein muss, und bietet an, es zu streichen oder zu verschieben.

   Was „muss" ist, entscheidet der Bereich (plan.must) — im Zweifel gilt
   Pflicht, damit nie etwas zum Streichen vorgeschlagen wird, das wichtig war.
   ============================================================ */

function optionalToday() {
  const key = currentDayIso();
  const idx = selectedDayIdx;
  return state.blocks.filter(b => {
    if (b.sug) return false;
    // onDay() statt einer eigenen weekly-Abfrage: die hätte bei "2wochen"
    // jede Woche "hier" gesagt statt nur jede zweite — onDay kennt die
    // Parität bereits, ein zweites Mal von Hand nachbauen wäre die nächste
    // Stelle, an der ein Rhythmus lautlos falsch würde.
    if (!onDay(b, key, idx)) return false;
    const area = areaById(b.areaId);
    return !(area.plan && area.plan.must);
  }).sort((a, b) => a.start - b.start);
}

function renderEnergyAction() {
  const box = $("#energyAct");
  if (!box) return;
  box.innerHTML = "";
  const lvl = (state.days[currentDayIso()] || {}).energy;
  if (lvl !== "low") return;

  const weg = optionalToday();
  if (!weg.length) return;

  const b = document.createElement("button");
  b.className = "btn btn--sm";
  b.style.marginTop = "12px";
  b.style.width = "100%";
  b.textContent = (iso(addDays(mondayOf(anchor), selectedDayIdx)) === iso(new Date())
    ? "Was kann heute weg? (" : "Was kann an dem Tag weg? (") + weg.length + ")";
  b.onclick = relieveSheet;
  box.appendChild(b);
}

function relieveSheet() {
  modal((s, close) => {
    // Beim Vorausplanen stand hier "heute" über einem Tag in zehn Tagen.
    const d = addDays(mondayOf(anchor), selectedDayIdx);
    const heute = iso(d) === iso(new Date());
    const tag = DAY_LONG[selectedDayIdx] + (heute ? "" : ", " + d.getDate() + "." + (d.getMonth() + 1) + ".");
    s.innerHTML =
      "<h2 class='sheet__title'>Was kann " + (heute ? "heute" : "am " + tag) + " weg?</h2>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:var(--t-body);line-height:1.6'>" +
      "Wenig Energie am " + tag + ". Das hier ist nicht als Pflicht markiert — " +
      "du kannst es streichen oder auf einen anderen Tag schieben. " +
      "Was du stehen lässt, bleibt einfach im Plan.</p>" +
      "<div class='relief' id='reliefList'></div>";

    const list = s.querySelector("#reliefList");

    const paint = () => {
      const weg = optionalToday();
      list.innerHTML = "";
      if (!weg.length) {
        list.innerHTML = "<div class='empty'><b>Nichts mehr offen</b>" +
          "Alles andere an diesem Tag ist als Pflicht markiert.</div>";
        return;
      }
      weg.forEach(blk => {
        const area = areaById(blk.areaId);
        const row = document.createElement("div");
        row.className = "reliefrow";
        row.style.setProperty("--h", area.hue);
        row.innerHTML =
          "<div class='reliefrow__txt'>" +
            "<div class='reliefrow__title'><span class='goal__dot'></span>" + escapeHtml(blk.title) + "</div>" +
            "<div class='reliefrow__time num'>" + fmtTime(blk.start) + "–" + fmtTime(blk.end) +
            (blk.title === area.name ? "" : " · " + escapeHtml(area.name)) + "</div>" +
          "</div>";

        const move = document.createElement("button");
        move.className = "btn btn--sm"; move.type = "button"; move.textContent = "Verschieben";
        move.onclick = () => { close(); moveSheet(blk.id); };

        const del = document.createElement("button");
        del.className = "btn btn--sm btn--danger"; del.type = "button"; del.textContent = "Streichen";
        del.onclick = () => {
          unlinkTask(blk);
          state.blocks = state.blocks.filter(x => x.id !== blk.id);
          save(); renderAll(); paint();
          toastUndo("Gestrichen");
        };

        row.append(move, del);
        list.appendChild(row);
      });
    };
    paint();

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const ok = document.createElement("button");
    ok.className = "btn btn--primary"; ok.type = "button"; ok.textContent = "Fertig";
    ok.onclick = close;
    foot.appendChild(ok);
    s.appendChild(foot);
  }, { wide: true });
}

/* Einen Block auf einen anderen Tag schieben — sucht dort die nächste
   freie Stelle, statt ihn blind auf dieselbe Uhrzeit zu setzen. */
function moveSheet(id) {
  const blk = state.blocks.find(x => x.id === id);
  if (!blk) return;
  modal((s, close) => {
    s.innerHTML =
      "<h2 class='sheet__title'>Verschieben</h2>" +
      "<p style='margin:0 0 6px;font-size:var(--t-body)'><b>" + escapeHtml(blk.title) + "</b></p>" +
      "<p style='margin:0 0 18px;color:var(--text-muted);font-size:var(--t-body)'>" +
      "Dauer " + fmtDur(blk.end - blk.start) + " · auf welchen Tag?</p>" +
      "<div class='chipset' id='mvDays'></div>" +
      "<div id='mvHint' style='font-size:var(--t-sm);color:var(--text-faint);margin-top:14px;min-height:18px'></div>";

    const wrap = s.querySelector("#mvDays");
    const hint = s.querySelector("#mvHint");
    const laenge = blk.end - blk.start;
    const heuteKey = iso(new Date());

    weekDays().forEach(day => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip";
      c.textContent = DAY_SHORT[day.i];
      const vergangen = day.key < heuteKey;
      const selbst = (istSerie(blk) ? blk.day === day.i : blk.date === day.key);
      c.disabled = vergangen || selbst;
      if (c.disabled) c.style.opacity = ".4";
      c.onclick = () => {
        const passende = freeGaps(day, { from: null, to: null, days: [day.i] }, areaById(blk.areaId))
          .filter(g => g.end - g.start >= laenge);
        if (!passende.length) { hint.textContent = "Am " + DAY_LONG[day.i] + " ist kein Platz von " + fmtDur(laenge) + " frei."; return; }

        // Die Stelle nehmen, die der bisherigen Uhrzeit am nächsten liegt.
        // Vorher war es immer die früheste — der Serienabend landete dadurch
        // um sieben Uhr morgens.
        let ziel = null;
        passende.forEach(g => {
          const st = clamp(blk.start, g.start, g.end - laenge);
          const d = Math.abs(st - blk.start);
          if (!ziel || d < ziel.d) ziel = { st, d };
        });

        const schieben = () => {
          blk.repeat = "none";
          delete blk.since;
          blk.day = day.i;
          blk.date = day.key;
          blk.start = ziel.st;
          blk.end = ziel.st + laenge;
          // fix (Stufe 11): von Hand verschoben — der Verteiler rührt den
          // Block beim nächsten Durchlauf nicht mehr an.
          blk.fix = true;
          save(); close(); renderAll();
          toast("Auf " + DAY_LONG[day.i] + ", " + fmtTime(blk.start) + " geschoben");
        };

        // Eine Serie zu verschieben hat sie bisher stillschweigend in einen
        // einzelnen Termin verwandelt — also von jedem Montag (bzw. jeder
        // zweiten Woche) gelöscht.
        if (istSerie(blk)) {
          const rhythmus = blk.repeat === "2wochen" ? "bisher alle 2 Wochen" : "bisher in jeder Woche";
          // push: true — bei „Abbrechen" bleibt die Tagesauswahl dahinter
          // erhalten statt zu verschwinden.
          confirmSheet(blk.repeat === "2wochen" ? "Zweiwöchentlicher Eintrag" : "Wöchentlicher Eintrag",
            "„" + (blk.title || "Ohne Titel") + "\" steht " + rhythmus + ". Verschieben " +
            "macht daraus einen einzelnen Termin — aus den anderen Wochen verschwindet er.",
            "Trotzdem verschieben", schieben, { push: true });
        } else schieben();
      };
      wrap.appendChild(c);
    });

    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    foot.innerHTML = "<span class='spacer'></span>";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Abbrechen";
    cancel.onclick = close;
    foot.appendChild(cancel);
    s.appendChild(foot);
  });
}

/* Das einfache Anführungszeichen muss mit maskiert werden: an mehreren Stellen
   landet Nutzertext in einfach gequoteten Attributen (aria-label). Ohne die
   Maskierung kann ein Bereichsname aus dem Attribut ausbrechen und eigenen Code
   mitbringen — der über den Abgleich auch auf dem zweiten Gerät läuft. */
function escapeHtml(s) {
  return String(s).replace(/[&<>"'`]/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;"
  }[c]));
}

/* Freihalten heißt: der Verteiler lässt den Tag aus. Was schon drinsteht,
   bleibt stehen — sonst wäre es Löschen mit anderem Namen. */
$("#dayFrei").onchange = () => {
  const key = currentDayIso();
  const an = $("#dayFrei").checked;
  if (an) dayMeta(key).frei = true; else if (state.days[key]) delete state.days[key].frei;
  if (an) {
    // Ein Vorschlag an einem freien Tag hat seine Erlaubnis verloren
    const vorher = state.blocks.length;
    state.blocks.forEach(b => { if (b.sug && onDay(b, key, selectedDayIdx)) unlinkTask(b); });
    state.blocks = state.blocks.filter(b => !(b.sug && onDay(b, key, selectedDayIdx)));
    toast(state.blocks.length < vorher
      ? "Tag freigehalten — Vorschläge hier zurückgenommen" : "Tag freigehalten");
  } else toast("Tag wieder verplanbar");
  save(); renderAll();
};

document.querySelectorAll(".energy__opt").forEach(btn => {
  btn.onclick = () => {
    const key = currentDayIso();
    const meta = dayMeta(key);
    meta.energy = meta.energy === btn.dataset.lvl ? null : btn.dataset.lvl;
    save(); renderEnergy(); renderGrid(); renderDaySwitch();
  };
});

/* ============================================================
   Der Wochenstart

   Zehn Minuten, drei Schritte: Was ist letzte Woche wirklich passiert? →
   Was nimmst du dir für diese vor? → Verteilen.

   Der Wochenbeginn ist der wirksamste wiederkehrende Neuanfang, den ein
   Kalender hat — deshalb bekommt er hier einen eigenen Ort statt nur eine
   Spalte weiter links zu sein. Angeboten wird er am Sonntagabend und am
   Wochenanfang; danach schweigt er, statt jeden Tag zu erinnern.
   ============================================================ */

function ritualKey() { return iso(mondayOf(anchor)); }
function ritualErledigt() { return !!state.rituale[ritualKey()]; }

/* Ist jetzt die Zeit dafür? Sonntag ab 16 Uhr zählt schon zur neuen Woche. */
function ritualFaellig() {
  if (!istDieseWoche() || ritualErledigt()) return false;
  const jetzt = new Date();
  const wt = (jetzt.getDay() + 6) % 7;          // 0 = Montag
  if (wt === 6 && jetzt.getHours() >= 16) return true;
  return wt <= 1;
}

function renderRitual() {
  const card = $("#ritualCard");
  if (!card) return;
  if (!ritualFaellig()) { card.hidden = true; return; }
  card.hidden = false;
  const mon = mondayOf(anchor);
  const offen = wocheEintraege(addDays(mon, -7)).filter(x => !istErledigt(x.b, x.key)).length;
  card.innerHTML =
    "<div class='ritual__head'>Neue Woche</div>" +
    "<p class='ritual__txt'>Zehn Minuten, drei Schritte: Was ist letzte Woche gelaufen, " +
    "was nimmst du dir vor, wie verteilt es sich." +
    (offen ? " <b>" + offen + "</b> Einträge aus der letzten Woche sind noch nicht abgehakt." : "") +
    "</p>";
  const los = document.createElement("button");
  los.className = "btn btn--primary btn--sm";
  los.textContent = "Wochenstart";
  los.onclick = ritualSheet;
  const spaeter = document.createElement("button");
  spaeter.className = "btn btn--sm btn--ghost";
  spaeter.textContent = "Nicht jetzt";
  spaeter.onclick = () => { card.hidden = true; };
  const row = document.createElement("div");
  row.className = "ritual__foot";
  row.append(los, spaeter);
  card.appendChild(row);
}

function ritualSheet() {
  let schritt = 0;
  const mon = mondayOf(anchor);
  const vorwoche = addDays(mon, -7);

  modal((s, close) => {
    const body = document.createElement("div");
    const foot = document.createElement("div");
    foot.className = "sheet__foot";
    s.append(body, foot);

    const TITEL = ["Was ist gelaufen?", "Was nimmst du dir vor?", "Und wann?"];

    const malen = () => {
      body.innerHTML =
        "<div class='steps'>" + [0, 1, 2].map(i =>
          "<span class='steps__dot" + (i === schritt ? " is-on" : "") + "'></span>").join("") +
        "<span class='steps__lab'>Schritt " + (schritt + 1) + " von 3</span></div>" +
        "<h2 class='sheet__title'>" + TITEL[schritt] + "</h2>";
      const box = document.createElement("div");
      body.appendChild(box);
      [schrittRueckblick, schrittZiele, schrittVerteilen][schritt](box);
      malenFoot();
    };

    /* --- Schritt 1: die letzte Woche abhaken --------------------------- */
    function schrittRueckblick(box) {
      const eintraege = wocheEintraege(vorwoche);
      if (!eintraege.length) {
        box.innerHTML = "<div class='empty'><b>Die letzte Woche ist leer</b>" +
          "Dann fängst du hier an — beim nächsten Wochenstart gibt es was zum Abhaken.</div>";
        return;
      }
      const lead = document.createElement("p");
      lead.className = "ritual__lead";
      lead.textContent = "Hake ab, was wirklich stattgefunden hat. Das ist keine Note — es ist die Grundlage für Ziele, die aufgehen.";
      box.appendChild(lead);

      const kopf = document.createElement("div");
      kopf.className = "hakenkopf";
      const sumEl = document.createElement("div");
      sumEl.className = "hakenkopf__sum";
      const alle = document.createElement("button");
      alle.className = "btn btn--sm";
      alle.type = "button";
      kopf.append(sumEl, alle);
      box.appendChild(kopf);

      const liste = document.createElement("div");
      liste.className = "hakenliste";
      box.appendChild(liste);

      const summe = () => {
        const ab = eintraege.filter(x => istErledigt(x.b, x.key));
        const min = ab.reduce((n, x) => n + dauerVon(x.b), 0);
        const ges = eintraege.reduce((n, x) => n + dauerVon(x.b), 0);
        sumEl.innerHTML = "<b>" + fmtDur(min) + "</b> von " + fmtDur(ges) + " geplant · " +
          ab.length + " von " + eintraege.length + " Einträgen";
        const allesAb = ab.length === eintraege.length;
        alle.textContent = allesAb ? "Alle abwählen" : "Alle abhaken";
        alle.onclick = () => {
          eintraege.forEach(x => setzeErledigt(x.b, x.key, !allesAb));
          save(); malen();
        };
      };

      let letzterTag = -1;
      eintraege.forEach(x => {
        if (x.i !== letzterTag) {
          letzterTag = x.i;
          const h = document.createElement("div");
          h.className = "hakenliste__tag";
          const d = addDays(vorwoche, x.i);
          h.textContent = DAY_LONG[x.i] + ", " + d.getDate() + "." + (d.getMonth() + 1) + ".";
          liste.appendChild(h);
        }
        const area = areaById(x.b.areaId);
        const lab = document.createElement("label");
        lab.className = "hakenrow";
        lab.style.setProperty("--h", area.hue);
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = istErledigt(x.b, x.key);
        cb.onchange = () => {
          setzeErledigt(x.b, x.key, cb.checked);
          lab.classList.toggle("is-on", cb.checked);
          save(); summe();
        };
        lab.classList.toggle("is-on", cb.checked);
        const txt = document.createElement("span");
        txt.className = "hakenrow__txt";
        txt.innerHTML = "<span class='goal__dot'></span>" + escapeHtml(x.b.title || "Ohne Titel") +
          "<span class='hakenrow__zeit num'>" +
          (x.b.grob ? abschnittVon(x.b.teil).name + " · " + fmtDur(x.b.dauer)
                    : fmtTime(x.b.start) + "–" + fmtTime(x.b.end)) + "</span>";
        lab.append(cb, txt);
        liste.appendChild(lab);
      });

      summe();

      /* --- Rückblick je Bereich (Stufe 14): geplant gegen tatsächlich, als
         Satz statt als Diagramm. Nur Bereiche mit Wochenziel — ohne Ziel gibt
         es nichts, wogegen man "vorgenommen" vergleichen könnte. Ohne solche
         Bereiche bleibt der Abschnitt ganz weg statt als leere Trennlinie. */
      if (!state.areas.some(a => a.plan.goal > 0)) return;
      const musterVerworfen = new Set();
      const rueckblick = document.createElement("div");
      rueckblick.className = "rueckblick";
      box.appendChild(rueckblick);

      const zeichnenRueckblick = () => {
        rueckblick.innerHTML = "";
        state.areas.filter(a => a.plan.goal > 0).forEach(a => {
          const geplant = eintraege
            .filter(x => x.b.areaId === a.id)
            .reduce((n, x) => n + dauerVon(x.b), 0);
          const geschafft = istVorwoche(a.id, vorwoche);
          const row = document.createElement("div");
          row.className = "rueckblick__row";
          row.style.setProperty("--h", a.hue);
          row.innerHTML = "<span class='num'>" + escapeHtml(a.name) + ": " +
            fmtDur(a.plan.goal * 60) + " vorgenommen · " + fmtDur(geplant) +
            " eingeplant · " + fmtDur(geschafft) + " geschafft</span>";
          rueckblick.appendChild(row);

          if (musterVerworfen.has(a.id)) return;
          const vorschlag = rueckblickMuster(a, mon);
          if (vorschlag == null) return;
          const hin = document.createElement("div");
          hin.className = "rueckblick__hinweis";
          hin.style.setProperty("--h", a.hue);
          const txt = document.createElement("span");
          txt.className = "rueckblick__hinweis-txt";
          txt.textContent = a.name + ": in drei von vier Wochen unter dem Ziel. Ziel auf " +
            vorschlag + " h setzen?";
          const setzen = document.createElement("button");
          setzen.type = "button"; setzen.className = "btn btn--sm";
          setzen.textContent = "Auf " + vorschlag + " h setzen";
          setzen.onclick = () => { a.plan.goal = vorschlag; save(); zeichnenRueckblick(); };
          const weg = document.createElement("button");
          weg.type = "button"; weg.className = "btn btn--sm btn--ghost";
          weg.textContent = "Verstanden";
          weg.setAttribute("aria-label", "Hinweis zu " + a.name + " ausblenden");
          weg.onclick = () => { musterVerworfen.add(a.id); hin.remove(); };
          hin.append(txt, setzen, weg);
          rueckblick.appendChild(hin);
        });
      };
      zeichnenRueckblick();
    }

    /* --- Schritt 2: Ziele für die neue Woche --------------------------- */
    function schrittZiele(box) {
      const lead = document.createElement("p");
      lead.className = "ritual__lead";
      lead.innerHTML = "Was letzte Woche stattgefunden hat, steht in Klammern. " +
        "Ein Ziel, das drei Wochen nicht aufging, war kein Ziel, sondern ein Wunsch.";
      box.appendChild(lead);

      const liste = document.createElement("div");
      liste.className = "zieleliste";
      box.appendChild(liste);

      /* Anker-Frage (Stufe 13 Teil B) — der Wenn-Dann-Vorsatz aus der
         Forschung, nur ohne das Wort dafür. Nur für Bereiche mit Ziel diese
         Woche: "Wann?" ohne Ziel ist eine Frage ohne Gegenstand. Vier Chips,
         eine Entscheidung — nie ein Formularfeld (s. Auftrag). Dieselbe
         Ablage wie der Anker aus Stufe 9 (area.regeln.anker): "Nach der
         Arbeit" nutzt den bestehenden ref-Zweig, "Morgens"/"Abends" den
         neuen Tageszeit-Zweig (freeGaps, migrate, placeGrob). Die Wahl liest
         der Nutzer danach unter jedem Vorschlag wieder (grundFuer/placeGrob). */
      function ankerZeile(a) {
        const wrap = document.createElement("div");
        wrap.className = "zielanker";
        const lab = document.createElement("span");
        lab.className = "zielanker__lab";
        lab.textContent = "Wann?";
        wrap.appendChild(lab);

        // "Nach der Arbeit" braucht einen Bereich dieses Namens — fehlt er
        // (umbenannt, gelöscht) oder ist es der Bereich selbst, gibt es die
        // Option nicht, statt ins Leere zu zeigen.
        const arbeit = state.areas.find(x => x.id !== a.id &&
          String(x.name || "").trim().toLowerCase() === "arbeit");
        const anker = a.regeln && a.regeln.anker;
        const aktuell = anker && anker.ref ? "arbeit" : anker && anker.tageszeit ? anker.tageszeit : "egal";

        const optionen = [
          arbeit ? ["arbeit", "Nach der Arbeit"] : null,
          ["morgen", "Morgens"], ["abend", "Abends"], ["egal", "Egal"]
        ].filter(Boolean);

        optionen.forEach(([key, label]) => {
          const c = document.createElement("button");
          c.type = "button"; c.className = "chip";
          c.textContent = label;
          c.setAttribute("aria-pressed", String(aktuell === key));
          c.onclick = () => {
            const neu = key === "egal" ? null
              : key === "arbeit"
              ? (anker && anker.ref === arbeit.id ? anker : { ref: arbeit.id, min: 30, max: 180, sonst: "aus" })
              : { tageszeit: key };
            const fenster = (a.regeln && a.regeln.fenster) || [];
            a.regeln = (fenster.length || neu) ? { fenster, anker: neu } : null;
            save(); zeichnen();
          };
          wrap.appendChild(c);
        });
        return wrap;
      }

      const zeichnen = () => {
        liste.innerHTML = "";
        state.areas.forEach(a => {
          const ist = istVorwoche(a.id, vorwoche);
          const row = document.createElement("div");
          row.className = "zielrow" + (a.plan.goal > 0 ? " is-on" : "");
          row.style.setProperty("--h", a.hue);
          const name = document.createElement("div");
          name.className = "zielrow__name";
          name.innerHTML = "<span class='goal__dot'></span>" + escapeHtml(a.name) +
            (ist > 0 ? " <span class='zielrow__ist'>(" + fmtDur(ist) + " gelaufen)</span>" : "");
          const stepper = document.createElement("div");
          stepper.className = "stepper";
          const minus = document.createElement("button");
          minus.type = "button"; minus.className = "btn btn--sm"; minus.textContent = "−";
          minus.setAttribute("aria-label", a.name + ": eine Stunde weniger");
          minus.onclick = () => { a.plan.goal = Math.max(0, (a.plan.goal || 0) - 1); save(); zeichnen(); };
          const wert = document.createElement("span");
          wert.className = "stepper__val num";
          wert.textContent = a.plan.goal > 0 ? a.plan.goal + " h" : "—";
          const plus = document.createElement("button");
          plus.type = "button"; plus.className = "btn btn--sm"; plus.textContent = "+";
          plus.setAttribute("aria-label", a.name + ": eine Stunde mehr");
          plus.onclick = () => { a.plan.goal = Math.min(80, (a.plan.goal || 0) + 1); save(); zeichnen(); };
          stepper.append(minus, wert, plus);
          row.append(name, stepper);
          liste.appendChild(row);
          if (a.plan.goal > 0) liste.appendChild(ankerZeile(a));
        });
        const amp = document.createElement("div");
        amp.style.marginTop = "16px";
        ampelZeichnen(amp);
        liste.appendChild(amp);
      };
      zeichnen();
    }

    /* --- Schritt 3: verteilen ----------------------------------------- */
    function schrittVerteilen(box) {
      const zeichnen = () => {
        box.innerHTML = "";
        const lead = document.createElement("p");
        lead.className = "ritual__lead";
        const zieleAreas = state.areas.filter(a => a.plan.goal > 0);
        const offenJeArea = a => Math.max(0, a.plan.goal * 60 - areaMinutes(a.id, false) - areaMinutes(a.id, true));
        const offen = zieleAreas.reduce((n, a) => n + offenJeArea(a), 0);
        // Kennzahl (Stufe 13 Teil D): nicht mehr "wie viel ist offen", sondern
        // "wie viele Ziele haben schon einen Platz" — nach Masicampo &
        // Baumeister entlastet das Verorten, nicht das Abhaken. Ein Vorschlag
        // zählt schon als Platz, er ist ja einer; erst "Verwerfen" nimmt ihn
        // wieder weg. Dieselbe Toleranz (15 Min) wie bisher bei "offen".
        const platziert = zieleAreas.filter(a => offenJeArea(a) < 15).length;
        if (!zieleAreas.length) {
          lead.innerHTML = "Keine Wochenziele diese Woche — nichts zu verteilen.";
        } else {
          lead.innerHTML = "<b>" + platziert + " von " + zieleAreas.length + "</b> Zielen hat einen Platz diese Woche.";
          if (hasSuggestions()) {
            lead.innerHTML += " Schau den Vorschlag durch — was nicht passt, verschiebst du oder wirfst du raus.";
          } else if (offen >= 15) {
            lead.innerHTML += " Der Planer sucht den Rest — annehmen musst du selbst.";
          }
        }
        box.appendChild(lead);

        // Stufe A5: passt der Rest der Woche nicht mehr (dieselbe Prüfung wie
        // in der Ampel und im "Das wird eng"-Dialog), sagt das Ritual das
        // offen dazu — mit demselben Ausweg (verteilenMitGate, Stufe A3),
        // nicht nur über die Ampel-Farbe weiter oben in Schritt 2.
        if (istDieseWoche() && !wochenKapazitaet().ok) {
          const warn = document.createElement("div");
          warn.style.margin = "-4px 0 12px";
          warn.innerHTML = "<p class='goalrow__sub' style='margin:0 0 8px'>Der Rest passt nicht mehr in diese Woche.</p>";
          const weiter = document.createElement("button");
          weiter.className = "btn"; weiter.type = "button";
          weiter.textContent = "Nächste Woche planen";
          // planeNaechsteWoche() blättert anchor eine Woche weiter und ruft
          // renderAll() — Schritt 1/2 dieses Rituals hängen aber an der
          // Vorwoche/dieser Woche von oben (mon/vorwoche, beim Öffnen des
          // Blatts erfasst) und würden dabei inkonsistent. Sauberer Schnitt,
          // derselbe wie beim "Trotzdem"-Knopf im Gate-Dialog: erst das
          // Blatt schließen, dann verteilen — planeNaechsteWoche() meldet
          // das Ergebnis bereits selbst per Toast.
          weiter.onclick = () => { close(); planeNaechsteWoche(); };
          warn.appendChild(weiter);
          box.appendChild(warn);
        }

        if (!hasSuggestions() && offen >= 15) {
          const b = document.createElement("button");
          b.className = "btn btn--primary";
          b.type = "button";
          b.textContent = "Verteilen";
          b.onclick = () => {
            const r = buildSuggestions();
            save(); renderAll(); zeichnen();
            if (!r.placed) toast((r.hinweise && r.hinweise[0]) || "Kein Platz gefunden — Zeitfenster erweitern?");
          };
          box.appendChild(b);
        }
        if (hasSuggestions()) {
          const ok = document.createElement("button");
          ok.className = "btn btn--primary"; ok.type = "button";
          ok.textContent = "Alle übernehmen";
          ok.onclick = () => { acceptSuggestions(); save(); renderAll(); zeichnen(); };
          const no = document.createElement("button");
          no.className = "btn"; no.type = "button";
          no.style.marginLeft = "8px";
          no.textContent = "Verwerfen";
          no.onclick = () => { clearSuggestions(); save(); renderAll(); zeichnen(); };
          const row = document.createElement("div");
          row.append(ok, no);
          box.appendChild(row);
        }
      };
      zeichnen();
    }

    /* --- Fußzeile ------------------------------------------------------ */
    function malenFoot() {
      foot.innerHTML = "";
      if (schritt > 0) {
        const z = document.createElement("button");
        z.className = "btn"; z.type = "button"; z.textContent = "Zurück";
        z.onclick = () => { schritt--; malen(); };
        foot.appendChild(z);
      } else {
        // Stufe 13 Teil C: Schritt 1 hat kein "Zurück" — ohne einen eigenen
        // Ausgang bliebe nur der Tipp neben das Blatt, auf 320px kaum
        // erreichbar. "Später" schließt, ohne den Wochenstart als erledigt
        // zu markieren — die Karte (renderRitual/ritualFaellig) bietet ihn
        // beim nächsten Öffnen der App wieder an.
        const spaeter = document.createElement("button");
        spaeter.className = "btn btn--ghost"; spaeter.type = "button"; spaeter.textContent = "Später";
        spaeter.onclick = () => close();
        foot.appendChild(spaeter);
      }
      const sp = document.createElement("span"); sp.className = "spacer";
      foot.appendChild(sp);
      const w = document.createElement("button");
      w.className = "btn btn--primary"; w.type = "button";
      w.textContent = schritt < 2 ? "Weiter" : "Fertig";
      w.onclick = () => {
        if (schritt < 2) { schritt++; malen(); return; }
        state.rituale[ritualKey()] = Date.now();
        save(); close(); renderAll();
        toast("Wochenstart erledigt — gute Woche.");
      };
      foot.appendChild(w);
    }

    malen();
  }, { wide: true });
}

/* Ist-Stunden einer vergangenen Woche, für den Vergleich im Schritt 2. */
function istVorwoche(areaId, mon) {
  let sum = 0;
  [0, 1, 2, 3, 4, 5, 6].forEach(i => {
    const key = iso(addDays(mon, i));
    state.blocks.forEach(b => {
      if (b.areaId !== areaId || b.sug) return;
      if (onDay(b, key, i) && istErledigt(b, key)) sum += dauerVon(b);
    });
  });
  return sum;
}

/* Stufe 14 Teil B: taucht ein Bereich in drei von vier zurückliegenden Wochen
   deutlich unter seinem Ziel auf (unter zwei Dritteln), ist das laut dem
   Kommentar zu wochenKapazitaet oben ein Zielproblem, kein Charakterfehler —
   der Rückblick bietet dann an, das Ziel zu senken. Eine Historie der
   Zielwerte gibt es nicht (das Ziel wird jede Woche überschrieben, dafür
   legen wir kein neues Feld an) — verglichen wird darum gegen das *aktuelle*
   a.plan.goal, das zum Zeitpunkt von Schritt 1 noch der Wert der letzten
   Woche ist (Schritt 2 ändert ihn erst danach). Wochen ganz ohne Einträge
   zählen nicht mit — sonst gälte die Zeit vor der ersten Nutzung fälschlich
   als verfehltes Ziel. Gibt den vorgeschlagenen neuen Zielwert in ganzen
   Stunden zurück, oder null, wenn kein Hinweis angezeigt werden soll. */
function rueckblickMuster(a, mon) {
  if (!(a.plan.goal > 0)) return null;
  const schwelle = a.plan.goal * 60 * 2 / 3;
  let gewertet = 0, unter = 0, summe = 0;
  for (let i = 1; i <= 4; i++) {
    const wocheMon = addDays(mon, -7 * i);
    if (!wocheEintraege(wocheMon).length) continue;
    gewertet++;
    const ist = istVorwoche(a.id, wocheMon);
    summe += ist;
    if (ist < schwelle) unter++;
  }
  if (gewertet < 4 || unter < 3) return null;
  const vorschlag = Math.max(1, Math.round(summe / 4 / 60));
  return vorschlag < a.plan.goal ? vorschlag : null;
}
